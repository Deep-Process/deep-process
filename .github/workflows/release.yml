name: Create Plugin Release

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/plugin.json'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(node -p "require('./.claude-plugin/plugin.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=plugin-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "plugin-v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Plugin v${{ steps.version.outputs.version }}"
          body: |
            ## Claude Code Plugin v${{ steps.version.outputs.version }}

            Install in Claude Code:
            ```
            claude plugin install deep-process
            ```
          generate_release_notes: true
