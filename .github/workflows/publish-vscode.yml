name: Publish VS Code Extension

on:
  push:
    branches: [main]
    paths:
      - 'packages/vscode/package.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use package.json version)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Extract version
        id: version
        working-directory: packages/vscode
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=vscode-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "vscode-v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if already published
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "Version ${{ steps.version.outputs.version }} already published, skipping."
          exit 0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package
        working-directory: packages/core
        run: pnpm run build

      - name: Compile extension
        working-directory: packages/vscode
        run: pnpm run compile

      - name: Package extension
        working-directory: packages/vscode
        run: pnpm run package

      - name: Publish to VS Code Marketplace
        if: github.event_name == 'push' || github.event.inputs.version != ''
        working-directory: packages/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            pnpm run publish
          else
            echo "⚠️ VSCE_PAT secret not set. Skipping marketplace publish."
            echo "To publish, add your Visual Studio Marketplace Personal Access Token as VSCE_PAT secret."
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "VS Code Extension v${{ steps.version.outputs.version }}"
          body: |
            ## Deep Process VS Code Extension v${{ steps.version.outputs.version }}

            ### Installation

            **From VS Code Marketplace:**
            ```
            ext install deep-process.deep-process-vscode
            ```

            **From VSIX file:**
            1. Download the `.vsix` file below
            2. In VS Code: Extensions → ... menu → Install from VSIX
            3. Select the downloaded file

            ### Features
            - 🔍 Process installation and management
            - 💬 GitHub Copilot chat participant (`@deep-process`)
            - ⚙️ Interactive configuration panel
            - 🤖 Auto-detection of AI tools
            - 📦 One-click installation

            ### What's New
            See [CHANGELOG.md](https://github.com/deep-process-org/deep-process/blob/main/packages/vscode/CHANGELOG.md)
          files: |
            packages/vscode/*.vsix
          generate_release_notes: true
