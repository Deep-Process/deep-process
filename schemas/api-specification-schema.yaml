---
# API Specification Schema
# API contracts (OpenAPI-style)
---

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://deep-process.org/schemas/api-specification-schema.yaml"

title: "API Specification"
description: "API contracts and endpoint specifications"
type: "object"

required:
  - dp_id
  - artifact_type
  - api_version
  - endpoints

properties:
  dp_id:
    type: "string"

  artifact_type:
    type: "string"
    const: "api-specification"

  api_version:
    type: "string"

  base_url:
    type: "string"

  authentication:
    type: "object"
    properties:
      type:
        type: "string"
        enum: ["JWT", "OAuth2", "API_KEY", "Basic", "None"]
      description:
        type: "string"

  endpoints:
    type: "array"
    items:
      type: "object"
      required: ["path", "method", "name"]
      properties:
        endpoint_id:
          type: "string"
        path:
          type: "string"
        method:
          type: "string"
          enum: ["GET", "POST", "PUT", "PATCH", "DELETE"]
        name:
          type: "string"
        description:
          type: "string"
        authentication_required:
          type: "boolean"
        parameters:
          type: "array"
        request_body:
          type: "object"
        responses:
          type: "object"
        requirements_fulfilled:
          type: "array"
          items:
            type: "string"

  created_at:
    type: "string"
    format: "date-time"

examples:
  - dp_id: "PRJ-001-API"
    artifact_type: "api-specification"
    api_version: "v1"
    base_url: "/api/v1"
    authentication:
      type: "JWT"
    endpoints:
      - endpoint_id: "EP-001"
        path: "/auth/register"
        method: "POST"
        name: "User Registration"
        authentication_required: false
        request_body:
          type: "object"
          properties:
            email:
              type: "string"
            password:
              type: "string"
        responses:
          "201":
            description: "User created"
          "400":
            description: "Invalid input"
    created_at: "2026-02-16T11:00:00Z"
