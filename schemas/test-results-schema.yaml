---
# Test Results Schema
# Results from all testing phases
---

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://deep-process.org/schemas/test-results-schema.yaml"

title: "Test Results"
description: "Comprehensive test results from unit, integration, security, performance tests"
type: "object"

required:
  - dp_id
  - artifact_type
  - summary
  - verdict

properties:
  dp_id:
    type: "string"
    pattern: "^[A-Z0-9]+-TEST$"

  artifact_type:
    type: "string"
    const: "test-results"

  summary:
    type: "object"
    required: ["total_tests", "passed", "failed", "coverage_percent"]
    properties:
      total_tests:
        type: "integer"
        minimum: 0
      passed:
        type: "integer"
        minimum: 0
      failed:
        type: "integer"
        minimum: 0
      skipped:
        type: "integer"
        minimum: 0
      coverage_percent:
        type: "number"
        minimum: 0
        maximum: 100
      duration_seconds:
        type: "number"

  unit_tests:
    type: "object"
    properties:
      total_tests:
        type: "integer"
      passed:
        type: "integer"
      failed:
        type: "integer"
      coverage_percent:
        type: "number"

  integration_tests:
    type: "object"
    properties:
      total_tests:
        type: "integer"
      passed:
        type: "integer"
      failed:
        type: "integer"

  security_tests:
    type: "object"
    properties:
      auth_tests:
        type: "object"
      injection_tests:
        type: "object"
      security_scan_results:
        type: "object"

  performance_tests:
    type: "object"
    properties:
      benchmarks:
        type: "array"
      load_test_results:
        type: "object"

  failures:
    type: "array"
    items:
      type: "object"
      properties:
        test_id:
          type: "string"
        test_name:
          type: "string"
        error_message:
          type: "string"
        file:
          type: "string"
        severity:
          type: "string"
          enum: ["CRITICAL", "HIGH", "MEDIUM", "LOW"]

  requirements_coverage:
    type: "object"

  verdict:
    type: "string"
    enum: ["PASS", "FAIL", "CONDITIONAL"]

  created_at:
    type: "string"
    format: "date-time"

  created_by:
    type: "string"

examples:
  - dp_id: "PRJ-001-TEST"
    artifact_type: "test-results"
    summary:
      total_tests: 150
      passed: 145
      failed: 5
      coverage_percent: 87
    unit_tests:
      total_tests: 100
      passed: 98
      failed: 2
    verdict: "CONDITIONAL"
    created_at: "2026-02-16T13:00:00Z"
    created_by: "deep-test"
