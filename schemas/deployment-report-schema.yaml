---
# Deployment Report Schema
# Deployment status and infrastructure state
---

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://deep-process.org/schemas/deployment-report-schema.yaml"

title: "Deployment Report"
description: "Deployment status, infrastructure state, and health checks"
type: "object"

required:
  - dp_id
  - artifact_type
  - deployment_status
  - environment

properties:
  dp_id:
    type: "string"
    pattern: "^[A-Z0-9]+-DEPLOY$"

  artifact_type:
    type: "string"
    const: "deployment-report"

  deployment_status:
    type: "string"
    enum: ["SUCCESS", "FAILED", "IN_PROGRESS", "MANUAL_DEPLOYMENT_REQUIRED"]

  environment:
    type: "string"
    enum: ["development", "staging", "production"]

  deployment_url:
    type: "string"
    format: "uri"

  platform:
    type: "string"

  infrastructure:
    type: "object"
    properties:
      containers:
        type: "array"
        items:
          type: "string"
      database:
        type: "string"
      hosting_platform:
        type: "string"

  health_checks:
    type: "object"
    properties:
      health_endpoint:
        type: "string"
        enum: ["PASS", "FAIL"]
      smoke_tests:
        type: "object"

  monitoring:
    type: "object"

  deployed_at:
    type: "string"
    format: "date-time"

  deployed_by:
    type: "string"

examples:
  - dp_id: "PRJ-001-DEPLOY"
    artifact_type: "deployment-report"
    deployment_status: "SUCCESS"
    environment: "staging"
    deployment_url: "https://task-app-staging.example.com"
    platform: "Railway"
    infrastructure:
      containers: ["task-app:latest"]
      database: "PostgreSQL"
    health_checks:
      health_endpoint: "PASS"
    deployed_at: "2026-02-16T14:00:00Z"
    deployed_by: "deep-deploy"
