---
# Remediation Plan Schema
# Plan to fix error from feedback loop
---

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://deep-process.org/schemas/remediation-plan-schema.yaml"

title: "Remediation Plan"
description: "Detailed plan to remediate error identified in feedback loop"
type: "object"

required:
  - dp_id
  - artifact_type
  - root_cause
  - fix_strategy
  - execution_plan

properties:
  dp_id:
    type: "string"
    pattern: "^[A-Z0-9]+-REMEDIATION-\\d+$"

  artifact_type:
    type: "string"
    const: "remediation-plan"

  root_cause:
    type: "string"
    description: "Primary cause of the error"

  impact_scope:
    type: "object"
    properties:
      directly_affected:
        type: "array"
        items:
          type: "string"
      indirectly_affected:
        type: "array"
        items:
          type: "string"
      restart_phase:
        type: "integer"

  fix_strategy:
    type: "object"
    required: ["approach", "steps"]
    properties:
      approach:
        type: "string"
      steps:
        type: "array"
        items:
          type: "string"
      artifacts_to_modify:
        type: "array"
        items:
          type: "string"

  execution_plan:
    type: "object"
    required: ["restart_phase", "phases_to_rerun"]
    properties:
      restart_phase:
        type: "integer"
      phases_to_rerun:
        type: "array"
        items:
          type: "integer"
      artifacts_to_update:
        type: "array"
      estimated_duration:
        type: "string"

  auto_fix_plan:
    type: "object"

  requires_manual_fix:
    type: "boolean"

  manual_fix_guidance:
    type: "string"

  success_criteria:
    type: "array"
    items:
      type: "string"

  created_at:
    type: "string"
    format: "date-time"

examples:
  - dp_id: "PRJ-001-REMEDIATION-001"
    artifact_type: "remediation-plan"
    root_cause: "Missing input validation in user registration endpoint"
    impact_scope:
      directly_affected: ["src/api/auth_router.py"]
      restart_phase: 5
    fix_strategy:
      approach: "Add Pydantic validation to UserCreate schema"
      steps:
        - "Update src/schemas/user.py with validation rules"
        - "Re-run test suite"
    execution_plan:
      restart_phase: 5
      phases_to_rerun: [5, 6, 7]
    success_criteria:
      - "All tests pass"
      - "No regressions"
    created_at: "2026-02-16T13:10:00Z"
