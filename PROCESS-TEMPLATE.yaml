---
# Process Template v1.0
# Meta-process defining REQUIRED structure for all deep-process executions
# VIOLATION OF THIS TEMPLATE = INVALID PROCESS
---

template_version: "1.0.0"
created: "2026-02-16"

# ═══════════════════════════════════════════════════════════════
# MANDATORY SECTIONS (MUST exist in every process)
# ═══════════════════════════════════════════════════════════════

required_sections:
  - process_name
  - version
  - 13_zasady_version
  - metadata (minimal - category, complexity only)
  - inputs (with schemas, no examples)
  - phases (with OODA structure)
  - outputs (with schemas)
  - validation_gates (binding, with enforcement)
  - error_handlers (ALL edge cases)
  - compliance_13_zasady (verification)

# ═══════════════════════════════════════════════════════════════
# FORBIDDEN CONTENT (MUST NOT exist)
# ═══════════════════════════════════════════════════════════════

forbidden_content:
  - examples (move to separate examples.yaml if needed)
  - descriptions longer than 10 words
  - explanatory text ("this is because...", "in order to...")
  - comments explaining intent
  - documentation sections
  - "best practices" advice
  - helper_functions with logic (only lookup tables allowed)
  - metaphors or analogies
  - future plans or "nice to have"

# ═══════════════════════════════════════════════════════════════
# ZASADA 0: OODA LOOP STRUCTURE (MANDATORY)
# ═══════════════════════════════════════════════════════════════

ooda_loop_enforcement:
  description: "Every phase MUST follow OODA: Observe → Orient → Decide → Act"

  phase_structure:
    observe:
      required: true
      what: "Load/extract data. No interpretation."
      format: "LOAD X FROM Y"
      binding_gate: "GATE_OBSERVED_COMPLETE"

    orient:
      required: true
      what: "Analyze/classify data. State assumptions explicitly."
      format: "CLASSIFY X AS Y IF condition"
      binding_gate: "GATE_ORIENTED_COMPLETE"

    decide:
      required: true
      what: "Determine action based on orientation. IF-THEN rules only."
      format: "IF X THEN action ELSE alternative"
      binding_gate: "GATE_DECIDED"

    act:
      required: true
      what: "Execute action. Produce artifact."
      format: "CREATE artifact WITH content"
      binding_gate: "GATE_ACTED"

  enforcement: "Phase without complete OODA = HALT with error"

# ═══════════════════════════════════════════════════════════════
# ZASADA 1: SELF-CONTAINED (just-in-time loading)
# ═══════════════════════════════════════════════════════════════

self_contained_enforcement:
  rule: "No upfront loading. Data loaded at step that uses it."

  violation_examples:
    - "Load all artifacts at start"
    - "Read entire codebase before phase 1"

  correct_pattern: |
    step_N:
      observe: "LOAD artifact X"
      orient: "EXTRACT field Y FROM X"
      decide: "IF Y meets criteria THEN proceed ELSE HALT"
      act: "USE Y TO create Z"

# ═══════════════════════════════════════════════════════════════
# ZASADA 2: COMPLETENESS > TOKENS
# ═══════════════════════════════════════════════════════════════

completeness_enforcement:
  rule: "ALWAYS 'all', 'every', 'each'. NEVER 'main', 'primary', 'typical'."

  required_quantifiers:
    - "FOR EACH item IN collection"  # not "FOR main items"
    - "VALIDATE ALL fields"  # not "VALIDATE key fields"
    - "CHECK EVERY reference"  # not "CHECK important references"

  binding: "Agent cannot skip ANY item without explicit scope_reduction declaration"

# ═══════════════════════════════════════════════════════════════
# ZASADA 3: MECHANISM NOT INTENT
# ═══════════════════════════════════════════════════════════════

mechanism_enforcement:
  rule: "Every rule = trigger + action. No 'should', 'might', 'typically'."

  forbidden_intent_language:
    - "Agent should verify..."
    - "Process typically results in..."
    - "May need to check..."

  required_mechanism_language:
    - "IF condition THEN action ELSE alternative"
    - "WHEN event THEN action"
    - "FOR EACH item DO action UNTIL condition"

  format: |
    step_name:
      trigger: "condition that activates this step"
      action: "VERB object WITH parameters"
      halt_if: "condition that stops execution"

# ═══════════════════════════════════════════════════════════════
# ZASADA 4: BINDING GATES
# ═══════════════════════════════════════════════════════════════

binding_gate_enforcement:
  rule: "Cannot proceed without explicit gate pass OR scope_reduction declaration"

  gate_structure:
    gate_name:
      type: "BLOCKING | WARNING"
      condition: "executable boolean expression"
      on_fail: "HALT | EMIT_WARNING | TRIGGER_ERROR_HANDLER"
      scope_reduction_allowed: true | false

  scope_reduction_declaration:
    required_when: "Skipping ANY step or artifact"
    format: |
      DECLARE_SCOPE_REDUCTION:
        skipped: [list of skipped items]
        reason: "explicit justification"
        acknowledged_risk: "what might break"
        approver: "user | orchestrator | process_name"

  enforcement: "Advance to next step WITHOUT gate pass AND WITHOUT scope_reduction = VIOLATION"

# ═══════════════════════════════════════════════════════════════
# ZASADA 5: ASSUMPTIONS BEFORE ACTION
# ═══════════════════════════════════════════════════════════════

assumption_declaration_enforcement:
  rule: "EXTRACT → VERIFY → DECLARE → RENDER. No action before declaration."

  required_sequence:
    extract:
      action: "LOAD data FROM source"
      output: "raw_data"

    verify:
      action: "VALIDATE raw_data AGAINST schema"
      output: "validated_data"

    declare:
      action: "STATE assumptions about validated_data"
      format: "ASSUME X because Y"
      output: "assumptions_list"

    render:
      action: "GENERATE output USING assumptions"
      output: "artifact"

  enforcement: "Render before declare = HALT"

# ═══════════════════════════════════════════════════════════════
# ZASADA 6: FORCED SEQUENCE (blockers between phases)
# ═══════════════════════════════════════════════════════════════

sequence_enforcement:
  rule: "Phases connected by BLOCKER gates. Cannot skip without scope_reduction."

  blocker_format: |
    phase_N:
      completion_gate: "GATE_PHASE_N_COMPLETE"
      blocker_to_next: |
        IF GATE_PHASE_N_COMPLETE == false THEN
          HALT WITH error "Cannot proceed to phase N+1"
        IF scope_reduction declared for phase_N THEN
          LOG scope_reduction
          PROCEED WITH warning
        ELSE
          PROCEED

  enforcement: "Phase N+1 starts before phase N complete = VIOLATION"

# ═══════════════════════════════════════════════════════════════
# ZASADA 7: CHECKLIST AFTER EVERY PHASE
# ═══════════════════════════════════════════════════════════════

checklist_enforcement:
  rule: "Every phase ends with mandatory checklist. Negative answer = action required."

  checklist_structure:
    questions:
      - question: "boolean question"
        expected: true | false
        if_negative: "HALT | RETURN_TO_STEP | EMIT_WARNING"

  minimum_questions: 3
  maximum_questions: 7

  required_question_types:
    - completeness: "Did we process ALL items?"
    - correctness: "Did validation pass for EVERY artifact?"
    - consistency: "Are results consistent with inputs?"

  enforcement: "Phase without checklist = INVALID PROCESS"

# ═══════════════════════════════════════════════════════════════
# ZASADA 8: COUNTER-CHECKS
# ═══════════════════════════════════════════════════════════════

counter_check_enforcement:
  rule: "Critical assertions require deliberate attempt to disprove. Report both."

  counter_check_structure:
    assertion: "statement claimed to be true"
    counter_check_method: "how to attempt to disprove"
    counter_evidence: "evidence AGAINST assertion"
    final_verdict: "assertion holds | assertion fails"

  required_for:
    - "Architecture decisions (check if alternative better)"
    - "Completeness claims (actively search for gaps)"
    - "Correctness claims (try to find counterexamples)"

  format: |
    counter_check:
      claim: "X is true"
      attempt_disproof: "SEARCH FOR cases where NOT X"
      findings: "list of counter-evidence"
      verdict: "claim holds DESPITE findings | claim fails"

  enforcement: "Critical claim without counter-check = WARNING"

# ═══════════════════════════════════════════════════════════════
# ZASADA 9: EXECUTABLE LANGUAGE
# ═══════════════════════════════════════════════════════════════

executable_language_enforcement:
  rule: "Commands only. No descriptions of desired states."

  required_verbs:
    - LOAD, EXTRACT, PARSE
    - VALIDATE, CHECK, VERIFY
    - CREATE, GENERATE, PRODUCE
    - IF, WHEN, FOR, WHILE, UNTIL
    - HALT, CONTINUE, SKIP

  forbidden_patterns:
    - "The system should..."
    - "This results in..."
    - "Typically..."
    - "Ideally..."

  correct_pattern: |
    LOAD file FROM path
    EXTRACT field FROM file
    IF field meets criteria THEN
      GENERATE output
    ELSE
      HALT WITH error

# ═══════════════════════════════════════════════════════════════
# ZASADA 10: VISIBLE REASONING
# ═══════════════════════════════════════════════════════════════

visible_reasoning_enforcement:
  rule: "Agent MUST output thinking steps before conclusion"

  required_output_format:
    reasoning:
      step_1: "observation"
      step_2: "inference from step_1"
      step_3: "conclusion"
    conclusion: "final answer based on reasoning"

  enforcement: "Answer without reasoning = INVALID"

# ═══════════════════════════════════════════════════════════════
# ZASADA 11: INSTRUCTION + NECESSARY DATA ONLY
# ═══════════════════════════════════════════════════════════════

minimal_data_enforcement:
  rule: "Each step contains: action + minimum data needed. Nothing more."

  step_structure:
    action: "VERB object"
    required_data:
      - name: "data_name"
        source: "where to get it"
        schema: "expected format"

  forbidden_in_step:
    - background information
    - alternative approaches
    - historical context
    - tips or suggestions

  enforcement: "Step with data not used in action = violation"

# ═══════════════════════════════════════════════════════════════
# ZASADA 12: JUST-IN-TIME INFORMATION
# ═══════════════════════════════════════════════════════════════

jit_information_enforcement:
  rule: "Data for phase N appears AT phase N. Not before."

  loading_pattern: |
    phase_N:
      step_1:
        observe: "LOAD data_X needed for step_1"
        action: "USE data_X"
      step_2:
        observe: "LOAD data_Y needed for step_2"
        action: "USE data_Y"

  violation: "Loading data_Y in step_1 when used in step_2"

# ═══════════════════════════════════════════════════════════════
# ZASADA 13: ZERO DECORATIONS
# ═══════════════════════════════════════════════════════════════

zero_decoration_enforcement:
  forbidden:
    - explanations
    - context
    - justifications
    - examples (separate file)
    - ASCII art
    - metaphors
    - encouragement

  allowed:
    - process_name
    - version
    - required sections
    - executable instructions
    - schemas
    - gates
    - error handlers

# ═══════════════════════════════════════════════════════════════
# EDGE CASE HANDLING (MANDATORY)
# ═══════════════════════════════════════════════════════════════

edge_case_requirements:
  rule: "Process MUST handle ALL failure modes, not just happy path"

  required_error_handlers:
    - missing_input: "What if required artifact missing?"
    - invalid_input: "What if input fails schema validation?"
    - partial_completion: "What if phase 70% complete then fails?"
    - external_dependency_failure: "What if API/service unavailable?"
    - timeout: "What if step takes too long?"
    - resource_exhaustion: "What if out of memory/disk?"
    - concurrent_modification: "What if artifact changed during execution?"
    - user_cancellation: "What if user cancels mid-process?"

  error_handler_structure:
    trigger: "condition that activates handler"
    severity: "CRITICAL | HIGH | MEDIUM | LOW"
    action: "what to do"
    recovery: "can process continue? how?"
    notification: "who to notify"

# ═══════════════════════════════════════════════════════════════
# PROCESS SIZE LIMITS
# ═══════════════════════════════════════════════════════════════

size_enforcement:
  max_lines_per_process: 300
  max_lines_per_phase: 50
  max_steps_per_phase: 7

  if_exceeded: "SPLIT into sub-processes with handoff protocol"

# ═══════════════════════════════════════════════════════════════
# FILE STRUCTURE (MANDATORY)
# ═══════════════════════════════════════════════════════════════

file_structure:
  main_process:
    filename: "{process-name}.yaml"
    max_lines: 300
    sections:
      - process_name
      - version
      - 13_zasady_version
      - metadata (minimal)
      - inputs
      - phases (OODA structure)
      - outputs
      - validation_gates
      - error_handlers
      - compliance_13_zasady

  if_phases_too_many:
    split_to: "{process-name}-phase-{N}.yaml"
    main_file_contains: "phase invocation + gates"
    phase_files_contain: "OODA steps for that phase"

# ═══════════════════════════════════════════════════════════════
# TRANSPARENCY REQUIREMENTS
# ═══════════════════════════════════════════════════════════════

transparency_enforcement:
  rule: "User MUST know what agent is doing at every moment"

  required_emissions:
    on_phase_start: "EMIT 'Starting phase N: {name}'"
    on_step_start: "EMIT 'Executing step {N}: {action}'"
    on_gate_check: "EMIT 'Checking gate {name}: {condition}'"
    on_decision: "EMIT 'Decision: IF {condition} THEN {action}'"
    on_artifact_create: "EMIT 'Created artifact: {path}'"
    on_error: "EMIT 'Error: {error} at step {step}'"

  emission_format:
    timestamp: true
    process_name: true
    phase_name: true
    step_name: true
    action: true
    result: true

# ═══════════════════════════════════════════════════════════════
# VALIDATION OF PROCESS AGAINST TEMPLATE
# ═══════════════════════════════════════════════════════════════

process_validation_checklist:
  structure:
    - "All required sections present?"
    - "No forbidden content?"
    - "All phases follow OODA?"
    - "Every phase has checklist?"
    - "Critical claims have counter-checks?"

  zasady_compliance:
    - "Self-contained (JIT loading)?"
    - "Completeness enforced (all/every/each)?"
    - "Mechanisms not intents (IF-THEN)?"
    - "Binding gates present?"
    - "Extract → verify → declare → render?"
    - "Forced sequence with blockers?"
    - "Checklist after every phase?"
    - "Counter-checks on critical claims?"
    - "Executable language only?"
    - "Visible reasoning required?"
    - "Instruction + necessary data only?"
    - "JIT information?"
    - "Zero decorations?"

  edge_cases:
    - "All 8 required error handlers present?"
    - "Each handler has trigger + action + recovery?"

  size:
    - "Process <300 lines?"
    - "Each phase <50 lines?"

  transparency:
    - "Emissions at every key point?"

# ═══════════════════════════════════════════════════════════════
# EXAMPLE: MINIMAL VALID PHASE
# ═══════════════════════════════════════════════════════════════

minimal_valid_phase:
  phase_N_example:
    description: "10 words max"

    observe:
      action: "LOAD artifacts/input.yaml"
      gate: "GATE_LOADED"

    orient:
      action: "EXTRACT field_x FROM input"
      assumption: "ASSUME field_x represents Y"
      gate: "GATE_ORIENTED"

    decide:
      rule: "IF field_x > threshold THEN proceed ELSE HALT"
      gate: "GATE_DECIDED"

    act:
      action: "CREATE output.yaml WITH processed_data"
      gate: "GATE_ACTED"

    checklist:
      - question: "Was input loaded?"
        expected: true
        if_no: "HALT"
      - question: "Was field_x valid?"
        expected: true
        if_no: "RETURN_TO_OBSERVE"
      - question: "Was output created?"
        expected: true
        if_no: "HALT"

    counter_check:
      claim: "field_x > threshold"
      disproof_attempt: "CHECK IF field_x <= threshold"
      verdict: "claim holds | claim fails"

# ═══════════════════════════════════════════════════════════════
# PROCESS TEMPLATE VERSION
# ═══════════════════════════════════════════════════════════════

template_compliance:
  version: "1.0.0"
  enforcement: "MANDATORY"
  violation_handling: "Process violating template = INVALID, MUST FIX"

---
# END PROCESS-TEMPLATE.yaml
# All deep-process executions MUST comply with this template
