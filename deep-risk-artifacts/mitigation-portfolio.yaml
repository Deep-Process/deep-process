      risk_id: VR-007
      warning: "CL-001 pilot success may create sunk cost pressure to continue even if enterprise validated"
      remediation: "Month 6 decision checkpoint with explicit decision criteria independent of pilot sunk costs"

    - mitigation_id: M-VR002-02
