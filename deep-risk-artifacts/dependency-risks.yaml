# DEPENDENCY_RISKS - Step 01: IDENTIFY_VERTICAL
# Phase: IDENTIFY_VERTICAL
# Date: 2026-02-15
# Method: #104 Dependency Risk Discovery

dependency_risks:
  dependencies:
    - name: "MCP (Model Context Protocol)"
      type: VENDOR
      criticality: CRITICAL
      replaceability: HARD
      vendor: "Anthropic / Open Source Community"

      maintenance_status:
        last_update: "2025-Q4 (emerging protocol, active development)"
        active_maintainers: "Unknown (specification owned by Anthropic, implementations vary)"
        issue_response_time: "N/A (specification development, not traditional OSS project)"
        maturity: EMERGING

      security_history:
        known_vulnerabilities: 0
        severity: N/A
        patched: N/A
        notes: "Protocol too new for established CVE history; security model evolving"

      bus_factor: 3
      bus_factor_note: "Anthropic team + GitHub adopters + community contributors; small but growing"

      identified_risks:
        - risk: "Protocol abandonment if enterprise adoption fails to materialize (<10% penetration in 24 months)"
          severity: HIGH
          probability: MEDIUM
          rationale: "RGS-U01 unmeasurable adoption trajectory; if GitHub/Azure/LiteLLM abandon MCP, integration strategy collapses"
          mitigation: "Build REST API fallback, monitor adoption metrics quarterly, maintain protocol-agnostic architecture"

        - risk: "Breaking changes in protocol specification require coordinated updates across 4+ platforms (GitHub, Azure, Jira, Claude Code) with different release cycles"
          severity: HIGH
          probability: HIGH
          rationale: "RGS-CO02 emerging standard means frequent changes; coordinating updates creates deployment complexity and version incompatibility windows"
          mitigation: "Version negotiation in MCP handshake, backward compatibility for N-1 versions, automated compatibility testing"

        - risk: "Vendor lock-in to Anthropic ecosystem if MCP remains Claude-specific protocol"
          severity: MEDIUM
          probability: MEDIUM
          rationale: "If MCP doesn't become cross-LLM standard, switching from Claude to OpenAI/other LLM requires full re-architecture"
          mitigation: "Monitor MCP adoption beyond Anthropic, design LLM-agnostic workflow engine, maintain provider abstraction layer"

    - name: "Claude API (Anthropic LLM Provider)"
      type: API
      criticality: CRITICAL
      replaceability: MEDIUM
      vendor: "Anthropic"

      maintenance_status:
        last_update: "Continuous (production API service)"
        active_maintainers: "Anthropic engineering team"
        issue_response_time: "24-48 hours (enterprise support SLA)"
        maturity: PRODUCTION
        uptime_sla: "99.9% (claimed)"

      security_history:
        known_vulnerabilities: 0
        severity: N/A
        patched: N/A
        notes: "API-level security managed by Anthropic; customer responsible for API key protection"

      bus_factor: N/A
      bus_factor_note: "Commercial vendor, not applicable; vendor viability is risk"

      identified_risks:
        - risk: "API pricing changes compress platform margins - $1.80/1M input tokens increases to $3.00 erodes profitability"
          severity: MEDIUM
          probability: MEDIUM
          rationale: "Technical report flags LLM costs as out-of-scope but affects pricing model; usage-based pricing assumes stable API costs"
          mitigation: "Multi-provider architecture (support OpenAI, Google Gemini as alternatives), cost monitoring dashboards, customer cost pass-through clauses"

        - risk: "Rate limiting or throttling during high-usage periods causes workflow failures for enterprise customers"
          severity: MEDIUM
          probability: MEDIUM
          rationale: "Enterprise customers with hundreds of users may exceed API rate limits; batch processing workflows vulnerable to throttling"
          mitigation: "Enterprise API tier with higher limits, request queuing and retry logic, usage quota management per customer"

        - risk: "API availability outage (< 99.9% SLA) causes platform-wide unavailability - no fallback LLM provider"
          severity: HIGH
          probability: LOW
          rationale: "Single LLM dependency creates SPOF; API outage affects all customers; switching to fallback mid-request complex"
          mitigation: "Multi-LLM support (failover to OpenAI/Gemini), circuit breakers, degraded mode with cached responses, status page transparency"

        - risk: "Model version deprecation requires workflow re-validation - Opus 4.6 retired forces migration to Opus 5.0 with different behavior"
          severity: MEDIUM
          probability: HIGH
          rationale: "LLM model lifecycles short (12-18 months); workflow prompts tuned for specific model; version changes may alter outputs"
          mitigation: "Version pinning support, automated workflow testing on model upgrades, customer opt-in for model migrations"

    - name: "SOC 2 Auditor / Compliance Consulting Firm"
      type: VENDOR
      criticality: HIGH
      replaceability: MEDIUM
      vendor: "TBD (Vanta, Drata, Secureframe, or big-4 accounting firm)"

      maintenance_status:
        engagement_status: "Not yet engaged"
        typical_engagement: "6-12 months for Type II certification"
        renewal_frequency: "Annual re-certification"

      security_history:
        audit_firm_reputation: "TBD - varies by vendor"
        past_client_success_rate: "Unknown until vendor selected"

      bus_factor: N/A
      bus_factor_note: "Commercial service; vendor bankruptcy or disengagement is risk"

      identified_risks:
        - risk: "Certification timeline extends beyond 12 months blocking enterprise sales pipeline ($2M-$15M ARR delayed)"
          severity: CRITICAL
          probability: MEDIUM
          rationale: "RGS-U03 timeline uncertainty; technical report Q3 flags as high-impact unknown; revenue recognition delayed 6-12+ months"
          mitigation: "Early auditor engagement, pre-audit readiness assessment, parallel compliance work during architecture phase, sales pipeline communication"

        - risk: "Audit failure requires remediation and re-audit (additional 3-6 months) - competitive timing risk"
          severity: HIGH
          probability: MEDIUM
          rationale: "15-25% first-time SOC 2 failure rate per industry data; control gaps discovered late require design changes"
          mitigation: "Gap assessment before formal audit, continuous compliance monitoring, experienced consultant guidance, over-engineer controls"

        - risk: "Auditor scope creep increases certification cost from $500K to $1M+ - budget overrun"
          severity: MEDIUM
          probability: MEDIUM
          rationale: "Complex architecture (hybrid deployment, multi-tenancy, blockchain audit) may expand audit scope beyond initial estimate"
          mitigation: "Fixed-scope contract with auditor, clear boundary definition, phased certification (SaaS first, on-prem later)"

        - risk: "Vendor lock-in to specific auditor - switching auditors mid-cycle resets certification timeline"
          severity: MEDIUM
          probability: LOW
          rationale: "Auditor change requires re-education on architecture, controls; continuity risk if relationship sours"
          mitigation: "Standardize on AICPA SOC 2 framework (vendor-agnostic), documentation quality to ease auditor transitions"

    - name: "Kubernetes (Container Orchestration)"
      type: SERVICE
      criticality: CRITICAL
      replaceability: HARD
      vendor: "Managed services: AWS EKS, Azure AKS, or GCP GKE"

      maintenance_status:
        last_update: "Kubernetes v1.29 (Jan 2024), quarterly releases"
        active_maintainers: "CNCF, cloud provider support teams"
        issue_response_time: "Cloud provider SLA (4-24 hours for critical issues)"
        maturity: PRODUCTION
        version_support_window: "12-14 months per minor version"

      security_history:
        known_vulnerabilities: "Regular CVEs patched by cloud providers"
        severity: "Varies (HIGH to CRITICAL CVEs quarterly)"
        patched: "Managed K8s auto-patches control plane; node patches require customer action"

      bus_factor: N/A
      bus_factor_note: "Industry standard with CNCF governance; abandonment risk near zero"

      identified_risks:
        - risk: "Managed K8s control plane failure causes complete platform outage - all tenants unavailable"
          severity: CRITICAL
          probability: LOW
          rationale: "Failure mode CTRL-PLANE-FAIL; 99.9% SLA = 8.76h/year downtime budget; single outage consumes annual SLA"
          mitigation: "Multi-AZ deployment, disaster recovery runbook, managed K8s SLA monitoring, customer communication protocols"

        - risk: "Kubernetes version upgrade requires workflow compatibility testing - breaking API changes in v1.30+ affect deployments"
          severity: MEDIUM
          probability: HIGH
          rationale: "K8s deprecates APIs aggressively (e.g., v1.25 removed PodSecurityPolicy); quarterly upgrades create testing burden"
          mitigation: "Automated K8s version compatibility testing, Helm chart version pinning, upgrade staging environment, gradual rollout"

        - risk: "Cloud provider vendor lock-in - EKS-specific features make migration to AKS/GKE costly (6-12 months)"
          severity: MEDIUM
          probability: MEDIUM
          rationale: "EKS (AWS Fargate), AKS (Azure AD integration), GKE (GCP Autopilot) have proprietary features; multi-cloud portability lost"
          mitigation: "Avoid cloud-specific K8s features, use standard K8s APIs, infrastructure-as-code for portability, multi-cloud architecture design"

        - risk: "Kubernetes CVE exploitation allows container escape and cross-tenant data access"
          severity: HIGH
          probability: LOW
          rationale: "Threat model ELEV-PRIV-03; zero-day container escape CVEs (runc, containerd) bypass multi-tenant isolation"
          mitigation: "Managed K8s patching, runtime security monitoring (Falco), network segmentation, pod security standards enforcement"

    - name: "PostgreSQL (Multi-Tenant Database)"
      type: LIBRARY
      criticality: CRITICAL
      replaceability: HARD
      vendor: "Open source / Cloud managed service (RDS, Azure Database, Cloud SQL)"

      maintenance_status:
        last_update: "PostgreSQL 16.1 (Nov 2023), quarterly minor releases"
        active_maintainers: "PostgreSQL Global Development Group"
        issue_response_time: "Community-driven (days to weeks); managed service SLA for critical issues"
        maturity: PRODUCTION
        version_support_window: "5 years per major version"

      security_history:
        known_vulnerabilities: "Regular CVEs, typically low-medium severity"
        severity: "Mostly MEDIUM (privilege escalation, DoS), rare CRITICAL (RCE)"
        patched: "Community patches quickly; managed services auto-patch"

      bus_factor: 50+
      bus_factor_note: "Mature open source project with large contributor base; abandonment risk negligible"

      identified_risks:
        - risk: "Multi-tenant schema design lock-in - migration from shared schema to separate databases requires full data migration for all customers"
          severity: HIGH
          probability: MEDIUM
          rationale: "ARCH-01 architecture decision; wrong isolation model discovered after customer base established creates multi-year migration"
          mitigation: "Prototype multi-tenancy patterns early, customer segmentation by isolation needs, phased migration plan if needed"

        - risk: "PostgreSQL connection pool exhaustion under multi-tenant load causes all tenants unavailable"
          severity: HIGH
          probability: MEDIUM
          rationale: "Failure mode DB-POOL-EXHAUST; noisy neighbor problem in shared infrastructure"
          mitigation: "Connection pool sizing per tenant class, circuit breakers, connection timeout limits, PgBouncer pooling"

        - risk: "Slow query from one tenant degrades performance for all tenants - query governor needed but not standard PostgreSQL feature"
          severity: MEDIUM
          probability: HIGH
          rationale: "Failure mode DB-SLOW-QUERY; multi-tenant SaaS risk; PostgreSQL lacks per-tenant query timeout enforcement"
          mitigation: "Application-level query timeouts, statement_timeout per connection, query complexity analysis, tenant resource quotas"

        - risk: "PostgreSQL CVE allows SQL injection or privilege escalation - multi-tenant data exposure"
          severity: CRITICAL
          probability: LOW
          rationale: "Managed service patches quickly but delay window exists; historical CVEs (CVE-2023-xxxxx) allow auth bypass"
          mitigation: "Managed PostgreSQL with auto-patching, parameterized queries only, row-level security policies, least-privilege DB roles"

    - name: "GitHub Marketplace / VS Code Marketplace / Claude Code Marketplace"
      type: VENDOR
      criticality: HIGH
      replaceability: MEDIUM
      vendor: "Microsoft (GitHub, VS Code), Anthropic (Claude Code)"

      maintenance_status:
        platform_stability: "Production platforms with established ecosystems"
        review_process: "Each platform has independent approval workflow"
        update_frequency: "Can update extensions continuously after approval"

      security_history:
        platform_breaches: "None known for marketplace platforms themselves"
        malicious_extensions: "Periodic removal of malicious extensions from all marketplaces"
        review_quality: "Varies by platform; some malicious extensions slip through"

      bus_factor: N/A
      bus_factor_note: "Commercial platforms; business continuity risk if platform discontinues marketplace"

      identified_risks:
        - risk: "Marketplace approval delays (4-12 months for multi-platform) block developer-first GTM timeline"
          severity: HIGH
          probability: MEDIUM
          rationale: "RGS-CO04 cascade; CL-001 Fast Market Entry assumes 4-6 months but multi-platform coordination could extend to 12 months"
          mitigation: "Parallel submission to all marketplaces, early engagement with platform developer relations, staged launch (GitHub first, then VS Code, then Claude)"

        - risk: "Marketplace rejection or delisting removes distribution channel - policy violation or false report triggers removal"
          severity: HIGH
          probability: MEDIUM
          rationale: "RGS-A02 platform vendor control; Threat DOS-04; policy violations subjective (e.g., 'security concern' from competitor report)"
          mitigation: "Multi-platform distribution strategy, direct download fallback on website, legal review of marketplace policies, trademark protection"

        - risk: "Marketplace platform fee changes erode margins - 30% commission on paid tiers reduces profitability"
          severity: MEDIUM
          probability: MEDIUM
          rationale: "Platforms may introduce or increase revenue sharing; Apple/Google 30% app store fees precedent"
          mitigation: "Direct sales channel development, free tier on marketplace to drive discovery then upgrade off-platform, monitor platform fee changes"

        - risk: "Marketplace activation gap (install ≠ usage) - 10-20% activation rate means 80-90% of installs never become active users"
          severity: HIGH
          probability: HIGH
          rationale: "Technical report Q2 critical unknown; high install count misleading if activation low; GTM metrics overestimated"
          mitigation: "Activation funnel optimization, first-run experience design, in-app tutorials, measure install→activation→usage separately"

  total_dependencies: 6
  critical_dependencies: 5
  high_dependencies: 1

  high_risk_dependencies:
    - dependency: "MCP (Model Context Protocol)"
      reason: "Emerging protocol with unmeasurable adoption; abandonment risk if enterprise adoption fails"
      risk_score: 18

    - dependency: "SOC 2 Auditor"
      reason: "Certification timeline uncertainty blocks $2M-$15M enterprise pipeline; 6-12+ month delay risk"
      risk_score: 20

    - dependency: "Marketplace Platforms"
      reason: "CL-001 Fast Market Entry depends on approval; delisting or rejection eliminates distribution channel"
      risk_score: 16

    - dependency: "Claude API"
      reason: "Single LLM provider SPOF; pricing volatility affects margins; outage causes platform-wide unavailability"
      risk_score: 14

    - dependency: "Kubernetes"
      reason: "Control plane failure affects all tenants; version upgrades create compatibility testing burden"
      risk_score: 14

summary:
  total_dependencies_analyzed: 6
  critical_dependencies_count: 5
  high_risk_dependencies_count: 5
  replaceability_hard_count: 3
  replaceability_impossible_count: 0
  emerging_technology_count: 1
  vendor_controlled_count: 4
  open_source_count: 2

  concentration_risks:
    - concentration: "Anthropic ecosystem dependency (MCP protocol + Claude API + Claude Code marketplace)"
      severity: HIGH
      rationale: "Three critical dependencies on single vendor; Anthropic viability risk creates correlated failure"
      mitigation: "Multi-LLM support, MCP fallback to REST API, multi-marketplace strategy beyond Claude Code"

    - concentration: "Microsoft ecosystem dependency (GitHub Marketplace + VS Code Marketplace + Azure deployment option)"
      severity: MEDIUM
      rationale: "Two marketplace channels plus cloud provider option; Microsoft relationship important but not SPOF"
      mitigation: "AWS/GCP deployment options, direct distribution channel, Anthropic Claude Code marketplace as alternative"

  interpretation: "6 critical dependencies with 5 rated high-risk. MCP protocol (emerging, unmeasurable adoption) and SOC 2 auditor (timeline uncertainty blocking revenue) are highest priority. Anthropic concentration risk (MCP + Claude + marketplace) creates correlated failure mode. Replaceability HARD for 50% of dependencies indicates switching costs high and architecture lock-in significant. Mitigation strategy: multi-provider architecture, fallback mechanisms, continuous monitoring of dependency health."
