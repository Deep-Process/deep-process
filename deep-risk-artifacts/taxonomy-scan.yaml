# TAXONOMY_SCAN - Step 01: IDENTIFY_VERTICAL
# Phase: IDENTIFY_VERTICAL
# Date: 2026-02-15
# Method: #101 Risk Taxonomy Scan

taxonomy_scan:
  architecture_risks:
    - id: ARCH-01
      description: "Multi-tenant schema isolation architecture decision locks in data model - migration from shared schema to separate databases requires full data migration affecting all customers"
      genesis_source: COMPLEXITY
      severity: HIGH
      type: technical
      rationale: "Three isolation levels (shared schema, separate schemas, separate DBs) have different cost/security/complexity tradeoffs; wrong choice discovered after customer base established creates multi-year migration"

    - id: ARCH-02
      description: "Hybrid deployment architecture (on-prem + cloud sync) creates dual infrastructure burden - must maintain feature parity, security controls, and operations expertise for both environments"
      genesis_source: COUPLING
      severity: HIGH
      type: business
      rationale: "CL-002 Enterprise path requires hybrid capability; 50-85% on-prem TCO in personnel costs means dual environments may be economically unsustainable at scale"

    - id: ARCH-03
      description: "MCP-first integration strategy creates protocol dependency risk - if MCP fails to achieve enterprise adoption, entire integration architecture requires redesign"
      genesis_source: UNCERTAINTY
      severity: MEDIUM
      type: technical
      rationale: "Protocol adoption trajectory unmeasurable (RGS-U01); fallback to REST API requires 6-12 month re-architecture if MCP doesn't gain traction"

  data_risks:
    - id: DATA-01
      description: "Multi-tenant database cross-tenant data leak from SQL injection or tenant_id filter bypass exposes all customer data simultaneously"
      genesis_source: COMPLEXITY
      severity: CRITICAL
      type: technical
      rationale: "RGS-C01 emergent behavior from three-layer isolation (DB schema, app logic, API auth); single filter bypass in application layer exposes all tenant data"

    - id: DATA-02
      description: "Hybrid deployment data sync corruption causes divergence between on-prem (source of truth) and cloud (analytics) - customer reports generated from stale/incorrect cloud data"
      genesis_source: COUPLING
      severity: HIGH
      type: business
      rationale: "RGS-C02 sync queue accumulation under load creates data staleness; customers making compliance decisions based on corrupted analytics data"

    - id: DATA-03
      description: "Blockchain audit trail immutability prevents compliance corrections - if incorrect data logged to blockchain, cannot be edited per GDPR 'right to rectification'"
      genesis_source: BOUNDARIES
      severity: MEDIUM
      type: technical
      rationale: "Blockchain provides regulatory trust but creates GDPR tension; immutable audit logs may violate data subject rights"

    - id: DATA-04
      description: "GDPR + EU AI Act dual compliance creates complex data retention and purpose limitation requirements - document processing may retain personal data beyond permitted scope"
      genesis_source: UNCERTAINTY
      severity: HIGH
      type: business
      rationale: "Technical report identifies dual compliance (FRIA + DPIA for high-risk AI with personal data); data retention policies complex and violation risks significant fines"

  security_risks:
    - id: SEC-01
      description: "Multi-tenant authentication bypass allows attacker to impersonate any tenant - MCP OAuth token reuse across tenants if not properly scoped"
      genesis_source: COMPLEXITY
      type: technical
      severity: CRITICAL
      rationale: "RGS-C03 emergent auth conflicts from multiple platform integrations (GitHub, Azure, Jira, Claude Code); combinatorial explosion of auth states creates bypass opportunities"

    - id: SEC-02
      description: "On-prem deployment customer misconfiguration creates public exposure of compliance audit data - vendor blamed for customer security failure"
      genesis_source: AGENCY
      type: business
      severity: HIGH
      rationale: "RGS-A03 negligent customer IT team; responsibility boundary ambiguous (RGS-B04 SOC 2 scope); vendor reputation damaged by customer error"

    - id: SEC-03
      description: "Database administrator with cross-tenant access could exfiltrate competitive intelligence from customer audit logs - insider threat in multi-tenant model"
      genesis_source: AGENCY
      type: technical
      severity: HIGH
      rationale: "RGS-A01 malicious DBA; multi-tenant architecture creates honeypot of all customer data accessible to privileged operators"

    - id: SEC-04
      description: "Trust boundary violation in hybrid deployment sends compliance-classified data to cloud without encryption - HIPAA/FedRAMP violation"
      genesis_source: BOUNDARIES
      type: technical
      severity: CRITICAL
      rationale: "RGS-B03 data misclassification; hybrid architecture assumes correct classification but ambiguity in 'compliance vs document' data causes violations"

  operations_risks:
    - id: OPS-01
      description: "Kubernetes cluster failure in multi-tenant SaaS affects all customers simultaneously - no tenant isolation during infrastructure outage"
      genesis_source: COUPLING
      type: technical
      severity: HIGH
      rationale: "RGS-CO03 shared infrastructure coupling; 99.9% SLA (8.76h/year) budget consumed by single multi-hour K8s outage affecting entire customer base"

    - id: OPS-02
      description: "Hybrid deployment operations complexity exceeds team capacity - 2x monitoring dashboards, 2x deployment pipelines, 2x incident response playbooks"
      genesis_source: TEMPORALITY
      type: business
      severity: MEDIUM
      rationale: "RGS-T04 on-prem knowledge decay as team focuses on SaaS; dual environment support burden identified in technical report premortem"

    - id: OPS-03
      description: "Workflow timeout cascade (deep-explore 30min + deep-verify 45min + deep-risk 60min = 2h15m) exceeds customer patience and session limits"
      genesis_source: COMPLEXITY
      type: technical
      severity: MEDIUM
      rationale: "RGS-C04 non-linear timeout accumulation; individual workflow timeouts reasonable but chained execution creates UX failure"

    - id: OPS-04
      description: "Serverless cold start latency (5-15 seconds) creates poor UX for marketplace quick-win scenario - user activation fails on first workflow execution"
      genesis_source: COUPLING
      type: business
      severity: MEDIUM
      rationale: "Technical report premortem flags serverless cold starts; CL-001 Fast Market Entry activation rate risk if first experience is slow"

  dependency_risks:
    - id: DEP-01
      description: "MCP protocol breaking changes from Anthropic/GitHub require coordinated updates across 4+ integration platforms with different release cycles"
      genesis_source: COUPLING
      type: technical
      severity: HIGH
      rationale: "RGS-CO02 protocol dependency; emerging standard means frequent breaking changes; coordinating GitHub, Azure, Jira, Claude Code updates creates deployment complexity"

    - id: DEP-02
      description: "SOC 2 certification delay or failure blocks all enterprise sales simultaneously - $2M-$15M ARR pipeline frozen for 6-12+ months"
      genesis_source: COUPLING
      type: business
      severity: CRITICAL
      rationale: "RGS-CO01 single certification affects all enterprise prospects; technical report identifies SOC 2 as table stakes; delay timeline uncertainty (RGS-U03)"

    - id: DEP-03
      description: "Marketplace platform delisting (GitHub, VS Code, Claude Code) removes distribution channel with no alternative for developer-first GTM"
      genesis_source: AGENCY
      type: business
      severity: HIGH
      rationale: "RGS-A02 platform vendor control; CL-001 Fast Market Entry depends on marketplace approval; policy violation (subjective) or competitive delisting blocks entire channel"

    - id: DEP-04
      description: "Claude API (LLM provider) pricing changes or rate limiting affects platform economics - margins compressed if API costs spike unexpectedly"
      genesis_source: UNCERTAINTY
      type: business
      severity: MEDIUM
      rationale: "External dependency flagged as out-of-scope but affects pricing model; usage-based pricing assumes stable API costs; volatility creates margin risk"

  people_risks:
    - id: PPL-01
      description: "Professional services team capacity insufficient for on-prem deployment surge - concurrent enterprise onboardings blocked by PS team size"
      genesis_source: UNCERTAINTY
      type: business
      severity: MEDIUM
      rationale: "Technical report premortem: PS team too small for concurrent deployments; CL-002 Enterprise path requires significant PS investment; optimal team size unmeasurable (RGS-U05)"

    - id: PPL-02
      description: "Key architecture decision-maker departure before implementation creates knowledge loss - rationale for hybrid deployment, multi-tenancy design lost"
      genesis_source: AGENCY
      type: technical
      severity: MEDIUM
      rationale: "Architecture decisions in 12-24 month timeframe; key person risk if implementation team different from decision team; knowledge transfer critical"

    - id: PPL-03
      description: "Dual environment expertise requirement (on-prem + SaaS) creates hiring difficulty - need DevOps engineers skilled in both kubernetes and on-prem deployment"
      genesis_source: COMPLEXITY
      type: business
      severity: MEDIUM
      rationale: "Hybrid architecture requires broader skill set; talent market may not have combined on-prem + cloud expertise; training timeline extended"

  regulatory_risks:
    - id: REG-01
      description: "EU AI Act high-risk classification requires Fundamental Rights Impact Assessment (FRIA) - compliance workflow delay 3-6 months if triggered"
      genesis_source: UNCERTAINTY
      type: business
      severity: HIGH
      rationale: "Technical report identifies EU AI Act + GDPR dual requirements; high-risk classification depends on use case interpretation; FRIA process adds timeline uncertainty"

    - id: REG-02
      description: "SOC 2 audit scope boundary ambiguity for on-prem deployments creates audit failure risk - what vendor controls vs customer controls unclear"
      genesis_source: BOUNDARIES
      type: technical
      severity: HIGH
      rationale: "RGS-B04 shared responsibility model ambiguity; SOC 2 certification covers vendor-controlled systems but on-prem transfers infrastructure control to customer"

    - id: REG-03
      description: "HIPAA compliance requirements for healthcare customers prohibit cloud sync in hybrid deployment - architecture incompatible with segment"
      genesis_source: COUPLING
      type: business
      severity: MEDIUM
      rationale: "Hybrid model assumes compliance data stays on-prem but sync required for analytics; HIPAA may prohibit cloud storage entirely; market segmentation required"

    - id: REG-04
      description: "Regulatory landscape evolution (new GDPR guidance, AI Act implementation details) erodes existing compliance architecture over 12-24 months"
      genesis_source: TEMPORALITY
      type: technical
      severity: MEDIUM
      rationale: "RGS-T03 compliance requirements drift; platform built to 2026 standards may not support 2027-2028 regulatory changes; continuous compliance investment required"

  financial_risks:
    - id: FIN-01
      description: "Multi-tenant infrastructure cost optimization delay causes negative unit economics - cost per tenant exceeds revenue per tenant in early phase"
      genesis_source: TEMPORALITY
      type: business
      severity: MEDIUM
      rationale: "Multi-tenant SaaS requires scale for profitability; first 10-50 customers may have negative gross margins while infrastructure costs fixed; breakeven point uncertain"

    - id: FIN-02
      description: "On-prem deployment professional services revenue insufficient to cover delivery costs - $250K contract consumed by 6-month PS engagement"
      genesis_source: UNCERTAINTY
      type: business
      severity: HIGH
      rationale: "Technical report estimates $250K-$1M ARR per enterprise customer but PS costs may exceed first-year revenue; CL-002 Enterprise path economics unvalidated"

    - id: FIN-03
      description: "SOC 2 certification investment ($500K-$2M per technical report) sunk cost if pivot from enterprise to community/marketplace strategy"
      genesis_source: COUPLING
      type: business
      severity: MEDIUM
      rationale: "SOC 2 required for CL-002 Enterprise but unnecessary for CL-001 Fast Market or CL-003 Community; early certification commitment reduces pivot optionality"

    - id: FIN-04
      description: "Hybrid infrastructure dual cost (on-prem tooling + cloud services) exceeds single-model TCO - 50-85% personnel costs for on-prem + cloud fees"
      genesis_source: COMPLEXITY
      type: business
      severity: HIGH
      rationale: "Technical report: on-prem 50-85% TCO in personnel; hybrid adds cloud costs on top; dual environment may be economically unviable without pricing premium"

  timeline_risks:
    - id: TIME-01
      description: "SOC 2 certification timeline uncertainty (6-12 months) delays enterprise revenue - first enterprise sale blocked until certification complete"
      genesis_source: UNCERTAINTY
      type: business
      severity: HIGH
      rationale: "RGS-U03 certification timeline range; technical report flags as critical unknown Q3; CL-002 Enterprise path revenue delayed 6-12+ months from architecture decision"

    - id: TIME-02
      description: "Marketplace approval process delays (GitHub, VS Code, Claude Code) create GTM timeline risk - 4-12 month range from technical report"
      genesis_source: COUPLING
      type: business
      severity: MEDIUM
      rationale: "RGS-CO04 marketplace approval cascade; CL-001 Fast Market Entry assumes 4-6 months but multi-platform coordination could extend to 12 months"

    - id: TIME-03
      description: "MCP protocol integration complexity underestimated - 4-8 week estimate from technical report may extend to 4-6 months for production-grade implementation"
      genesis_source: COMPLEXITY
      type: technical
      severity: MEDIUM
      rationale: "Technical report planning fallacy detected; MCP integration across 4 platforms with auth complexity may reveal hidden implementation challenges"

    - id: TIME-04
      description: "Hybrid deployment first customer onboarding extends beyond 6 months - professional services bottleneck delays go-live and revenue recognition"
      genesis_source: UNCERTAINTY
      type: business
      severity: MEDIUM
      rationale: "On-prem deployment complexity varies by customer infrastructure; first deployment used to calibrate timeline; optimistic estimate creates customer expectation mismatch"

  strategic_risks:
    - id: STRAT-01
      description: "Wrong strategic cluster selection (Enterprise vs Fast Market vs Community) creates 12-month opportunity cost - cannot easily pivot between clusters"
      genesis_source: BOUNDARIES
      type: business
      severity: CRITICAL
      rationale: "Technical report identifies cluster choice as critical decision; CL-001 HIGH reversibility but CL-002 LOW reversibility; wrong choice locks in suboptimal path"

    - id: STRAT-02
      description: "MCP protocol fails to achieve enterprise adoption (<10% penetration in 24 months) - integration strategy investment wasted, REST API fallback required"
      genesis_source: UNCERTAINTY
      type: technical
      severity: HIGH
      rationale: "RGS-U01 unmeasurable adoption trajectory; technical report surprise #1 (MCP faster than expected) may be premature; enterprise conservative on emerging protocols"

    - id: STRAT-03
      description: "Competitor with well-funded SaaS offering launches during on-prem deployment phase - market window closes while building complex hybrid architecture"
      genesis_source: COUPLING
      type: business
      severity: MEDIUM
      rationale: "CL-002 Enterprise path 12-24 months to revenue; CL-001 Fast Market 4-12 months; competitive timing risk if choose slow path and fast competitor enters"

    - id: STRAT-04
      description: "Product-market fit assumption violated - customers don't need tiered deployment (Q1 from technical report) - hybrid architecture over-engineered"
      genesis_source: UNCERTAINTY
      type: business
      severity: HIGH
      rationale: "RGS-U02 customer preference unmeasurable without interviews; if uniform deployment sufficient, hybrid complexity wasted investment; critical unknown from technical report"

total_risks: 42
