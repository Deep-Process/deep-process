risk_register:
  # TOP PRIORITY RISKS (RPN ≥ 18)

  - risk_id: VR-001
    risk_name: "Multi-Tenant Data Isolation Breach"
    category: SECURITY
    severity: CRITICAL
    status: ACTIVE

    description: "Cross-tenant data access via tenant_ID filter bypass, SQL injection, or application logic error exposes all customer data simultaneously in multi-tenant PostgreSQL database"

    genesis_source: COMPLEXITY
    genesis_explanation: "Three-layer isolation (DB row-level security, application tenant_ID filtering, API authentication) creates emergent failure when layers assume others handle isolation"

    5d_scores:
      probability: 0.30
      impact: 0.95
      velocity: 0.85
      detectability: 0.25
      reversibility: 0.10
      risk_score: 79.2

    probability_rationale: "30% - Industry base rate 2-5% annually for multi-tenant SaaS, but complex 3-layer architecture increases likelihood; parameterized queries reduce but don't eliminate SQL injection risk"
    impact_rationale: "95% - Catastrophic impact: all tenant data exposed, SOC 2 violation, GDPR fines (up to €20M or 4% revenue), customer churn >50%, platform reputation destruction"
    velocity_rationale: "85% - Fast propagation: single exploit affects all customers within minutes; automated scraping exfiltrates full dataset in hours"
    detectability_rationale: "25% - Hard to detect: application logs may not surface tenant_ID manipulation; only detected via anomaly detection (cross-tenant query patterns) or post-breach forensics"
    reversibility_rationale: "10% - Nearly irreversible: data breach public disclosure required by law, customer trust permanently damaged, contractual damages in millions"

    exposure_window:
      when_vulnerable: "From multi-tenant database deployment through product lifecycle"
      duration: "Continuous exposure during all SaaS operations"
      peak_risk_period: "Months 6-18 after launch (customer base growing, security hardening incomplete)"

    worst_case_scenario: "Attacker exploits SQL injection vulnerability in workflow execution API, bypasses tenant_ID filtering via UNION injection, exfiltrates all customer compliance audit data (including PII, PHI, architecture decisions, business strategies) for 500+ customers. Public disclosure triggers: (1) SOC 2 certification revocation, (2) GDPR fines €20M, (3) HIPAA violations $50M penalties, (4) 70% customer churn within 3 months, (5) class-action lawsuit, (6) platform shutdown within 12 months. Total impact: $100M+ liability, business failure."

    existing_controls:
      - "Parameterized queries via ORM (Prisma/Sequelize)"
      - "JWT tokens with tenant_ID claim server-side validation"
      - "Database row-level security policies (if implemented)"

    residual_risk: HIGH
    residual_risk_explanation: "Existing controls provide defense but not sufficient for CRITICAL severity. Developer error (raw SQL concatenation), ORM bypass, or JWT secret compromise creates breach path. Defense-in-depth required."

    mitigation_strategy: "TREAT (4T classification)"
    recommended_mitigations:
      - priority: 1
        mitigation: "Implement database row-level security as mandatory second layer of tenant isolation (PostgreSQL RLS policies)"
        cost_estimate: "$20K-$40K (2-3 weeks engineering)"
        effectiveness: "Reduces probability 30% → 10% (defense-in-depth)"

      - priority: 2
        mitigation: "Automated static analysis (SAST) for SQL injection patterns in CI/CD pipeline with build-blocking failures"
        cost_estimate: "$10K-$15K (tool licensing + integration)"
        effectiveness: "Reduces probability via developer error prevention"

      - priority: 3
        mitigation: "Real-time tenant isolation anomaly detection - alert on cross-tenant queries within 1 minute"
        cost_estimate: "$30K-$50K (monitoring infrastructure + ML model)"
        effectiveness: "Improves detectability 25% → 60% (earlier breach detection)"

      - priority: 4
        mitigation: "Quarterly penetration testing focused on multi-tenant isolation with simulated attacker"
        cost_estimate: "$40K/year (external security firm)"
        effectiveness: "Validates control effectiveness, discovers bypasses before attackers"

    leading_indicators:
      - "Anomalous cross-tenant query patterns (>5 tenant_IDs in single session)"
      - "Failed tenant_ID validation attempts (potential probing)"
      - "SAST findings for SQL concatenation or ORM bypasses"
      - "Penetration test findings on tenant isolation"

    review_cadence: WEEKLY
    escalation_owner: "CTO + CISO"
    escalation_trigger: "Any cross-tenant data access detected, penetration test critical findings, SAST build failures bypassed"

  - risk_id: VR-010
    risk_name: "OAuth Authentication Bypass (Cross-Tenant Impersonation)"
    category: SECURITY
    severity: CRITICAL
    status: ACTIVE

    description: "MCP OAuth token reuse across tenants, scope escalation, or token theft enables attacker to impersonate any tenant and access their workflows/data"

    genesis_source: COMPLEXITY
    genesis_explanation: "MCP integration with 4+ platforms (GitHub, Azure, Jira, Claude Code) creates combinatorial explosion of auth states, token expiry patterns, scope permissions - emergent conflicts create bypass opportunities"

    5d_scores:
      probability: 0.30
      impact: 0.95
      velocity: 0.80
      detectability: 0.30
      reversibility: 0.15
      risk_score: 75.8

    exposure_window:
      when_vulnerable: "From MCP server deployment through all marketplace operations"
      duration: "Continuous during multi-platform OAuth integration"
      peak_risk_period: "Months 3-12 (MCP integration complexity increases with platform count)"

    mitigation_strategy: "TREAT"
    recommended_mitigations:
      - priority: 1
        mitigation: "Immutable OAuth scopes - no expansion on token refresh; re-authentication required for broader scopes"
        cost_estimate: "$15K-$25K (OAuth flow redesign)"
        effectiveness: "Eliminates scope escalation attack vector"

      - priority: 2
        mitigation: "Per-tenant OAuth token isolation - tokens scoped to single tenant_ID, cannot cross boundaries"
        cost_estimate: "$20K-$35K (auth architecture refactor)"
        effectiveness: "Reduces impersonation probability 30% → 5%"

      - priority: 3
        mitigation: "Real-time OAuth anomaly detection - alert on token reuse across tenants, unusual scope requests"
        cost_estimate: "$25K-$40K (behavioral analytics)"
        effectiveness: "Improves detectability 30% → 65%"

  - risk_id: VR-007
    risk_name: "Wrong Strategic Cluster Selection (12-Month Opportunity Cost)"
    category: STRATEGIC
    severity: CRITICAL
    status: ACTIVE

    description: "Choose CL-002 Enterprise (12-24 months to revenue, LOW reversibility, $500K-$2M investment) vs CL-001 Fast Market (4-12 months, HIGH reversibility, $50K-$200K) - wrong choice locks suboptimal path"

    genesis_source: BOUNDARIES
    genesis_explanation: "Decision boundary between clusters creates irreversible commitment; customer contracts, architecture, team structure lock in path dependency"

    5d_scores:
      probability: 0.40
      impact: 0.80
      velocity: 0.30
      detectability: 0.40
      reversibility: 0.20
      risk_score: 64.0

    probability_rationale: "40% - Technical delivery report identifies 5 critical unknowns (Q1-Q5) with HIGH impact; 44% verification ratio means claims under-verified; decision made with incomplete information"
    impact_rationale: "80% - High impact: 12-month opportunity cost ($1M-$3M revenue delay if wrong), $500K-$2M sunk investment if pivot needed, market window missed, team morale hit"
    velocity_rationale: "30% - Slow burn: wrong choice not immediately obvious; takes 6-12 months to detect product-market misfit; another 6-12 months to pivot"
    detectability_rationale: "40% - Medium: early signals visible (customer interview feedback, pilot activation rates, sales cycle length) but require active monitoring to interpret"
    reversibility_rationale: "20% - Low reversibility: CL-002 Enterprise has customer contracts, on-prem deployments, SOC 2 investment creating switching costs; CL-001 more reversible but still 6-12 month pivot timeline"

    worst_case_scenario: "Choose CL-002 Enterprise Compliance-First path. Invest $1.5M in SOC 2 certification, hybrid architecture, professional services team. 18 months later, discover: (1) Customer tiered deployment preference was false (Q1 - uniform deployment sufficient), (2) On-prem economics unsustainable (50-85% personnel TCO), (3) Competitor launched CL-001 Fast Market approach, captured SMB market with $5M ARR. Attempt to pivot requires: abandoning sunk $1.5M investment, laying off PS team, 12-month re-architecture to SaaS-only, customer churn from on-prem accounts. Net impact: 30-month delay to market fit, $3M sunk costs, competitive disadvantage unrecoverable. Alternative scenario equally bad if choose CL-001 and enterprise market was correct path."

    mitigation_strategy: "TREAT + TOLERATE (Hybrid approach)"
    recommended_mitigations:
      - priority: 1
        mitigation: "Customer discovery interviews (15-20 enterprises + 10-15 SMBs) to validate tiered deployment assumption (Q1) before cluster commitment"
        cost_estimate: "$30K-$50K (interview program, analysis)"
        effectiveness: "Reduces probability 40% → 20% (resolves highest-impact unknown Q1)"
        timeline: "4-6 weeks"

      - priority: 2
        mitigation: "6-month pilot with CL-001 Fast Market Entry (MCP marketplace) before committing to CL-002 Enterprise - test activation rates (Q2), measure GTM velocity"
        cost_estimate: "$75K-$150K (6-month pilot investment)"
        effectiveness: "Provides empirical data to validate cluster choice; preserves pivot optionality"
        timeline: "6 months"

      - priority: 3
        mitigation: "Modular architecture design allowing cluster pivot - avoid CL-002-specific lock-in (blockchain audit, hybrid sync) until product-market fit validated"
        cost_estimate: "$40K-$60K (architecture flexibility investment)"
        effectiveness: "Improves reversibility 20% → 50% (reduces pivot cost/timeline)"

      - priority: 4
        mitigation: "TOLERATE decision uncertainty - document assumptions, set 6-month decision review checkpoints, accept 20% residual risk of wrong choice"
        cost_estimate: "$0 (process discipline)"
        effectiveness: "Ensures decision is revisited before irreversible commitment"

  - risk_id: VR-002
    risk_name: "SOC 2 Certification Timeline Delay Blocks Enterprise Revenue"
    category: DEPENDENCY
    severity: CRITICAL
    status: ACTIVE

    description: "Certification extends beyond 12 months (6-12+ month range per Q3 critical unknown) or audit failure requires remediation - $2M-$15M ARR enterprise pipeline frozen until certification complete"

    genesis_source: COUPLING
    genesis_explanation: "All enterprise prospects require SOC 2 as table stakes; single certification timeline affects entire enterprise segment revenue (coupling); no alternative path to enterprise sales without certification"

    5d_scores:
      probability: 0.50
      impact: 0.75
      velocity: 0.20
      detectability: 0.80
      reversibility: 0.40
      risk_score: 60.0

    probability_rationale: "50% - High probability: 6-12 month range from technical report indicates uncertainty; 15-25% first-time failure rate per industry data; complex architecture (hybrid, multi-tenant, blockchain) may expand audit scope"
    impact_rationale: "75% - Major impact: $2M-$15M ARR enterprise pipeline delayed 6-12 months, cash flow impact on runway, competitive timing risk (competitors may certify faster), CL-002 Enterprise path viability threatened"

    mitigation_strategy: "TREAT + TRANSFER (Hybrid)"
    recommended_mitigations:
      - priority: 1
        mitigation: "Early SOC 2 auditor engagement (month 1-2) for gap assessment before formal audit - identify control gaps with 6+ month remediation runway"
        cost_estimate: "$25K-$40K (pre-audit consulting)"
        effectiveness: "Reduces failure probability 25% → 10%; front-loads timeline visibility"

      - priority: 2
        mitigation: "Compliance automation platform (Vanta, Drata, Secureframe) for continuous control monitoring - accelerates certification by 2-4 months per vendor claims"
        cost_estimate: "$30K/year (platform licensing)"
        effectiveness: "Reduces timeline 6-12mo → 5-9mo (20-30% improvement)"

      - priority: 3
        mitigation: "Parallel path: Pursue CL-001 Fast Market Entry (marketplace, SMB focus) during SOC 2 certification - de-risks enterprise revenue dependency"
        cost_estimate: "$75K-$150K (dual GTM investment)"
        effectiveness: "Transfers impact - revenue from SMB market during enterprise certification gap"

  - risk_id: VR-008
    risk_name: "Resource Exhaustion Attack (Workflow Bombing)"
    category: SECURITY
    severity: HIGH
    status: ACTIVE

    description: "Attacker abuses free tier or compromised accounts to launch thousands of CPU/memory intensive deep-risk comprehensive runs causing infrastructure cost spike and performance degradation"

    genesis_source: AGENCY
    genesis_explanation: "Free tier business model creates adversarial incentive for abuse; attacker optimizes for cost maximization (deep-risk comprehensive = longest runtime, highest resource consumption)"

    5d_scores:
      probability: 0.70
      impact: 0.60
      velocity: 0.85
      detectability: 0.70
      reversibility: 0.60
      risk_score: 55.8

    mitigation_strategy: "TREAT"
    recommended_mitigations:
      - priority: 1
        mitigation: "Usage quotas per pricing tier: Free (10 workflows/month), Basic ($20/mo, 100/month), Pro ($100/mo, 500/month) with hard limits"
        cost_estimate: "$10K-$15K (quota enforcement system)"
        effectiveness: "Reduces impact 60% → 20% (caps attacker resource consumption)"

      - priority: 2
        mitigation: "CAPTCHA challenges for high-volume requests (>5 workflows in 10 minutes) to prevent automated abuse"
        cost_estimate: "$5K-$10K (CAPTCHA integration)"
        effectiveness: "Reduces probability 70% → 30% (blocks automated attacks)"

      - priority: 3
        mitigation: "Cost-based throttling: deep-risk comprehensive runs queued behind quick/standard for free tier users"
        cost_estimate: "$15K-$25K (priority queue implementation)"
        effectiveness: "Reduces velocity of cost accumulation"

