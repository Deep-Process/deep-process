# ASSUMPTIONS_DECLARED - Step 01: IDENTIFY_VERTICAL
# Phase: IDENTIFY_VERTICAL
# Date: 2026-02-15

assumptions:
  - id: A1-01
    assumption: "Component boundaries defined as: (1) Frontend - marketplace extensions/CLI, (2) Integration - MCP server/REST API/webhooks, (3) Execution - K8s/serverless/local, (4) Data - multi-tenant database/audit blockchain, (5) Security - auth/SSO/tenant isolation, (6) Observability - dashboards/SARIF/SBOM based on technical delivery report architecture diagrams"
    confidence: MEDIUM
    falsification_criteria: "If actual implementation architecture differs significantly from technical delivery report (e.g., monolithic vs microservices, different integration patterns), boundaries misaligned and risk inventory incomplete"
    rationale: "Component structure inferred from technical delivery report dimensions (deployment, multi-tenancy, integration, execution, observability); not yet validated against actual codebase architecture"

  - id: A1-02
    assumption: "Failure modes within vertical extraction assumed independent (e.g., database failure independent from MCP server failure) - cascades and interactions addressed in Phase 4 (INTERACT)"
    confidence: HIGH
    falsification_criteria: "If failure mode enumeration reveals tight coupling requiring simultaneous analysis (e.g., database failure immediately crashes MCP server with no buffering), independence violated and vertical extraction methodology invalid"
    rationale: "Deep-Risk workflow explicitly separates vertical extraction (component-level, Phase 1) from horizontal interactions (Phase 2) and cascade analysis (Phase 4); independence assumption is methodological requirement"

  - id: A1-03
    assumption: "Standard taxonomy categories (architecture, data, security, operations, dependency, people, regulatory, financial, timeline, strategic) are exhaustive for SaaS platform risk assessment - no platform-specific categories needed"
    confidence: HIGH
    falsification_criteria: "If risk discovered that doesn't fit any of 10 categories (e.g., 'marketplace platform relationship risks' as distinct category), taxonomy incomplete and risk may be missed"
    rationale: "Taxonomy based on established risk frameworks (PMBOK, TOGAF, NIST); covers technical and business dimensions; marketplace and compliance risks mappable to existing categories (dependency, regulatory)"

  - id: A1-04
    assumption: "Threat model scope limited to platform security (multi-tenant isolation, API auth, data encryption) - excludes customer-deployed threats in on-prem model as customer responsibility"
    confidence: MEDIUM
    falsification_criteria: "If customer security incidents attributed to vendor (e.g., customer misconfiguration of on-prem deployment blamed on vendor), responsibility boundary assumption violated"
    rationale: "Shared responsibility model standard for cloud/on-prem split; vendor responsible for secure software, customer responsible for secure deployment; ambiguity identified in RGS-B04 (SOC 2 scope boundary)"

counter_check_execution:
  method: "#78 Assumption Excavation"
  results:
    - assumption_id: A1-01
      stress_test: "If component boundaries 50% wrong (e.g., actual architecture is microservices with 15 services, not 5 logical components), risk inventory will miss inter-service risks"
      impact: "HIGH - incomplete risk identification; would require re-execution of Step 1 with corrected component map"

    - assumption_id: A1-02
      stress_test: "If 50% of failure modes are NOT independent (tightly coupled system), vertical extraction will produce incomplete risk picture and cascade risks missed until Phase 4"
      impact: "MEDIUM - cascades addressed in Phase 4 anyway; vertical extraction still useful for component-level risks"

    - assumption_id: A1-03
      stress_test: "If 50% of platform risks don't fit taxonomy (novel risk categories for AI governance platforms), major risks could be systematically excluded"
      impact: "HIGH - would require taxonomy extension or risk misclassification; mitigated by Pattern Library detection in 1.6"

    - assumption_id: A1-04
      stress_test: "If 50% of customer incidents are vendor responsibility (unclear boundary), support burden and liability exceed assumptions"
      impact: "HIGH - would require contract revision, expanded SOC 2 scope, increased support team size"
