      genesis_source: AGENCY
      description: "GitHub/VS Code/Claude Code approval delays (4-12 months) or policy violation delisting removes distribution channel for CL-001 Fast Market Entry strategy"
      impact: "High - GTM timeline extended, revenue delayed, no alternative developer discovery channel, competitive timing risk"
      probability: MEDIUM
      detectability: EASY
      rpn: 12
      mitigation_status: PARTIAL

