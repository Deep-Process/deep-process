      severity: CRITICAL
      sources: [TAXONOMY:DEP-02, DEPENDENCY:SOC2-AUDITOR-TIMELINE, TAXONOMY:TIME-01]
      genesis_source: COUPLING
      description: "Certification extends beyond 12 months (6-12+ month range) or audit failure requires remediation - $2M-$15M ARR enterprise pipeline frozen"
