      description: "MCP OAuth token reuse across tenants, scope escalation, or token theft enables attacker to impersonate any tenant and access their workflows"
      impact: "Catastrophic - complete authentication bypass, cross-tenant data access, compliance violation, platform trust destruction"
      probability: MEDIUM
      detectability: HARD
      rpn: 24
      mitigation_status: PARTIAL

