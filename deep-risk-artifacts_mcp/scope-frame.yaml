# SCOPE_FRAME - Step 00: GROUND
# Phase: GROUND
# Date: 2026-02-15

scope_frame:
  subject: "Enterprise architecture decisions for Deep Process platform deployment, integration, and business model (SaaS vs On-Prem vs Hybrid, multi-tenancy, MCP integration, marketplace strategy)"

  in_scope:
    - "Deployment model architecture (SaaS, On-Premise, Hybrid, Sovereign Cloud)"
    - "Multi-tenancy design and data isolation strategies"
    - "Integration architecture (MCP protocol, REST API, CI/CD plugins, marketplace extensions)"
    - "Security model (tiered vs uniform, compliance requirements)"
    - "Execution infrastructure (Kubernetes, serverless, local CLI, hybrid)"
    - "Observability and audit trail systems (dashboards, blockchain, SARIF/SBOM)"
    - "Business model and pricing strategy risks"
    - "Developer experience and go-to-market approach"
    - "SOC 2 certification requirements and timeline"
    - "Professional services and support model"
    - "Strategic cluster selection (Fast Market vs Enterprise vs Community)"
    - "Technology stack decisions (databases, auth, infrastructure-as-code)"

  out_of_scope:
    - "Deep Process core workflow logic (deep-explore, deep-verify, deep-risk assumed functional)"
    - "CLI implementation quality (assumed stable baseline)"
    - "LLM provider risks (Claude API availability, performance, cost - treated as external dependency)"
    - "General market risks (economic downturn, AI regulation) unless specific to architecture decisions"
    - "Competitive dynamics post-launch (monitoring only, not mitigation)"
    - "Individual feature roadmap prioritization (product-level, not architecture-level)"
    - "Team hiring and organizational structure (HR risks, not architecture risks)"
    - "Legal entity formation and contracts (legal risks, not architecture risks)"

  timeframe: "12-24 months from architecture decision (2026-02 to 2028-02)"

  timeframe_rationale: "Critical decision lock-in period covers: (1) Initial architecture implementation (4-12 months to first deployment per technical report), (2) Early customer acquisition (6-18 months for first 10-20 customers), (3) Architecture solidification point where changes become prohibitively expensive due to customer dependencies and technical debt"

  stakes: HIGH

  stakes_rationale: "Major impact with uncertain recovery if architecture decisions fail. Evidence: (1) Multi-year customer contracts create switching cost lock-in, (2) SaaS architecture migrations typically require 12-18 months and risk customer churn, (3) Wrong deployment model (e.g., pure on-prem) may exclude large market segments (SMB, developer-first), (4) Security model failures (data breaches, compliance violations) could be existential for enterprise SaaS, (5) Technical delivery report identifies $500K-$2M+ investment for enterprise path - sunk cost if architecture proves wrong. Not CRITICAL because business can pivot to alternative clusters (reversibility exists but costly)."
