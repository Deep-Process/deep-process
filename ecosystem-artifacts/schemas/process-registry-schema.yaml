---
# Process Registry Schema v1.0
# Multi-instance tracking registry
# ARCHITECT-TASK.yaml task_05 deliverable (NEW #1)
---

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://deep-process.org/schemas/process-registry-schema.v1.yaml"

title: "Process Registry Entry"
description: |
  Entry in process registry for multi-instance tracking.
  Tracks lifecycle: CREATED → RUNNING → COMPLETED → ARCHIVED

allOf:
  - $ref: "categories/process-execution.schema.yaml"
  - type: object
    required: [registry_id, instance_status, lifecycle_state, lock_status]
    properties:
      registry_id:
        type: string
        pattern: "^registry-[0-9]{6}$"
        description: "Unique registry entry ID"

      instance_status:
        type: string
        enum: [CREATED, RUNNING, PAUSED, COMPLETED, FAILED, ARCHIVED]

      lifecycle_state:
        type: object
        required: [current_phase, progress_percentage]
        properties:
          current_phase: {type: string}
          progress_percentage: {type: number, minimum: 0, maximum: 100}
          estimated_completion: {type: string, format: date-time}

      lock_status:
        type: object
        required: [is_locked]
        properties:
          is_locked: {type: boolean}
          locked_by: {type: string}
          locked_at: {type: string, format: date-time}
          lock_reason: {type: string}

      parent_instance_id:
        type: string
        description: "Parent instance (for sub-processes)"

      child_instance_ids:
        type: array
        items: {type: string}
        description: "Child instances spawned"

examples:
  - dp_id: "REG-000042"
    artifact_type: "PROCESS_REGISTRY_ENTRY"
    version: "1.0.0"
    created_at: "2026-02-16T10:00:00Z"
    created_by: "system:orchestrator"
    schema_ref: "https://deep-process.org/schemas/process-registry-schema.v1.yaml"
    compliance_flags: {self_contained: true, has_counter_checks: true, binding_gates_enforced: true}
    instance_id: "deep-verify-042"
    process_name: "deep-verify"
    execution_phase: "phase-3-adversarial"
    registry_id: "registry-000042"
    instance_status: "RUNNING"
    lifecycle_state:
      current_phase: "Phase 3: Adversarial Validation"
      progress_percentage: 75
      estimated_completion: "2026-02-16T11:00:00Z"
    lock_status:
      is_locked: true
      locked_by: "claude-sonnet-4.5"
      locked_at: "2026-02-16T10:30:00Z"
      lock_reason: "Executing adversarial prompts"
