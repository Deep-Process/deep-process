---
# Drift Detection Result Schema v1.0 (NEW #9)
---
$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://deep-process.org/schemas/drift-detection-result-schema.v1.yaml"
title: "Drift Detection Result"
description: "Semantic drift detection result (vocabulary/meaning changes)"

allOf:
  - $ref: "categories/system-integration.schema.yaml"
  - type: object
    required: [drift_type, drift_severity]
    properties:
      drift_type:
        type: string
        enum: [VOCABULARY_DRIFT, SEMANTIC_DRIFT, STRUCTURAL_DRIFT]
      drift_severity: {type: string, enum: [CRITICAL, IMPORTANT, MINOR]}
      drifted_terms:
        type: array
        items:
          type: object
          properties:
            term: {type: string}
            original_meaning: {type: string}
            current_meaning: {type: string}
            drift_score: {type: number, minimum: 0, maximum: 1}

examples:
  - dp_id: "DRIFT-001"
    artifact_type: "DRIFT_DETECTION"
    version: "1.0.0"
    created_at: "2026-02-16T11:10:00Z"
    created_by: "system:drift-detector"
    schema_ref: "https://deep-process.org/schemas/drift-detection-result-schema.v1.yaml"
    compliance_flags: {self_contained: true, has_counter_checks: true, binding_gates_enforced: true}
    source_process: "deep-coherence"
    drift_type: "VOCABULARY_DRIFT"
    drift_severity: "IMPORTANT"
    drifted_terms:
      - term: "process"
        original_meaning: "workflow"
        current_meaning: "microservice"
        drift_score: 0.7
