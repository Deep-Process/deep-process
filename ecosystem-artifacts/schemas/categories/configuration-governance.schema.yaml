---
# Configuration & Governance Category Schema v1.0
# Category for artifacts defining HOW ecosystem operates
# Inherits from: base-artifact.schema.yaml
---

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://deep-process.org/schemas/categories/configuration-governance.v1.yaml"

title: "Configuration & Governance Artifact"
description: |
  Artifacts defining HOW the ecosystem operates:
  Process definitions, orchestration rules, transformation rules

allOf:
  - $ref: "../base-artifact.schema.yaml"
  - type: object
    required: [config_scope]
    properties:
      config_scope:
        type: string
        enum: [global, process-specific, instance-specific]
        description: "Scope of configuration"

      activation_rule:
        type: string
        description: "When this config activates (IF/THEN rule)"
        examples:
          - "IF instance.status = RUNNING THEN apply"
          - "IF git_branch = main THEN active"

      precedence:
        type: integer
        minimum: 0
        description: "For conflict resolution (higher = higher priority)"

concrete_types:
  - PROCESS_DEFINITION
  - ORCHESTRATION_STATE_MACHINE
  - TRANSFORMATION_RULE
  - CONTRACT
  - ARTIFACT_HIERARCHY
  - TEMPORAL_BRANCH
  - VALIDATION_RULES

examples:
  - dp_id: "CONFIG-001"
    artifact_type: "ORCHESTRATION_STATE_MACHINE"
    version: "1.0.0"
    created_at: "2026-02-16T10:30:00Z"
    created_by: "user:architect"
    schema_ref: "https://deep-process.org/schemas/orchestration-state-machine-schema.v1.yaml"
    compliance_flags: {self_contained: true, has_counter_checks: true, binding_gates_enforced: true}
    config_scope: "global"
    activation_rule: "IF process_type = deep-* THEN apply"
    precedence: 100
