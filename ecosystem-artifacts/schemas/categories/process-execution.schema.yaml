---
# Process Execution Category Schema v1.0
# Category for artifacts created DURING process execution
# Inherits from: base-artifact.schema.yaml
# Date: 2026-02-16
---

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://deep-process.org/schemas/categories/process-execution.v1.yaml"

title: "Process Execution Artifact"
description: |
  Category schema for artifacts created DURING process execution:
  - Instance state snapshots
  - Process logs
  - Checkpoints
  - Decision records

allOf:
  - $ref: "../base-artifact.schema.yaml"
  - type: object
    required:
      - instance_id
      - process_name
      - execution_phase

    properties:
      # ═══════════════════════════════════════════════════════════════
      # PROCESS EXECUTION CONTEXT
      # ═══════════════════════════════════════════════════════════════

      instance_id:
        type: string
        pattern: "^[a-z0-9-]+-[0-9]{3}$"
        description: "Which process instance this artifact belongs to"
        examples:
          - "deep-risk-001"
          - "deep-verify-042"

      process_name:
        type: string
        description: "Which process type (e.g., deep-risk, deep-verify)"
        examples:
          - "deep-risk"
          - "deep-verify"
          - "deep-architect"

      execution_phase:
        type: string
        description: "Which phase of execution (process-specific)"
        examples:
          - "phase-1-pattern-scan"
          - "phase-2-targeted"
          - "setup"
          - "execution"
          - "completion"

      # ═══════════════════════════════════════════════════════════════
      # OPERATOR CONTEXT
      # ═══════════════════════════════════════════════════════════════

      operator_id:
        type: string
        description: "Human operator (if human-anchored approval point)"
        examples:
          - "user:alice"
          - "user:bob"
          - null

      operator_action:
        type: string
        enum:
          - APPROVED
          - REJECTED
          - DEFERRED
          - MODIFIED
          - null
        description: "Action taken by operator (if applicable)"

      # ═══════════════════════════════════════════════════════════════
      # EXECUTION METADATA
      # ═══════════════════════════════════════════════════════════════

      execution_duration_ms:
        type: integer
        minimum: 0
        description: "How long this execution step took (milliseconds)"

      retry_count:
        type: integer
        minimum: 0
        default: 0
        description: "Number of retries for this operation"

      error_context:
        type: object
        description: "Error details if operation failed"
        properties:
          error_type: { type: string }
          error_message: { type: string }
          stack_trace: { type: string }
          recovery_attempted: { type: boolean }

# ═══════════════════════════════════════════════════════════════
# CONCRETE TYPES IN THIS CATEGORY
# ═══════════════════════════════════════════════════════════════

concrete_types:
  - PROCESS_INSTANCE_STATE
  - PROCESS_REGISTRY_ENTRY
  - PROCESS_LOG_ENTRY
  - DECISION_POINT
  - FORK_JOIN
  - TRANSFORMATION_PROOF

# ═══════════════════════════════════════════════════════════════
# EXAMPLE
# ═══════════════════════════════════════════════════════════════

examples:
  - dp_id: "LOG-001"
    artifact_type: "PROCESS_LOG_ENTRY"
    version: "1.0.0"
    created_at: "2026-02-16T10:30:00Z"
    created_by: "system:orchestrator"
    schema_ref: "https://deep-process.org/schemas/process-log.schema.yaml"
    compliance_flags:
      self_contained: true
      has_counter_checks: true
      binding_gates_enforced: true
    instance_id: "deep-verify-042"
    process_name: "deep-verify"
    execution_phase: "phase-1-pattern-scan"
    execution_duration_ms: 1500
    retry_count: 0

---
# END process-execution.schema.yaml
