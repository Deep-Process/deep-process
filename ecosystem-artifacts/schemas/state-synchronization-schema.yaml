---
# State Synchronization Schema v1.0
# Real-time coherence validation messages
# ARCHITECT-TASK.yaml task_07 deliverable (NEW #4)
---

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://deep-process.org/schemas/state-synchronization-schema.v1.yaml"

title: "State Synchronization Message"
description: "Message for state sync between processes (real-time coherence)"

allOf:
  - $ref: "categories/system-integration.schema.yaml"
  - type: object
    required: [sync_type, source_state, target_state, sync_status]
    properties:
      sync_type:
        type: string
        enum: [PUSH, PULL, BROADCAST, RECONCILE]

      source_state:
        type: object
        additionalProperties: true
        description: "State snapshot from source"

      target_state:
        type: object
        additionalProperties: true
        description: "Expected state at target"

      sync_status:
        type: string
        enum: [PENDING, IN_SYNC, OUT_OF_SYNC, CONFLICT, FAILED]

      conflicts:
        type: array
        items:
          type: object
          properties:
            field: {type: string}
            source_value: {}
            target_value: {}
            resolution: {type: string, enum: [SOURCE_WINS, TARGET_WINS, MERGE, MANUAL]}

examples:
  - dp_id: "SYNC-001"
    artifact_type: "STATE_SYNC"
    version: "1.0.0"
    created_at: "2026-02-16T10:40:00Z"
    created_by: "system:coherence-validator"
    schema_ref: "https://deep-process.org/schemas/state-synchronization-schema.v1.yaml"
    compliance_flags: {self_contained: true, has_counter_checks: true, binding_gates_enforced: true}
    source_process: "deep-verify"
    target_process: "deep-document"
    sync_type: "PUSH"
    source_state: {verification_complete: true, verdict: "REJECT"}
    target_state: {verification_received: false}
    sync_status: "OUT_OF_SYNC"
