---
# Consistency Report Schema v1.0 (NEW #8)
---
$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://deep-process.org/schemas/consistency-report-schema.v1.yaml"
title: "Consistency Report"
description: "Cross-artifact consistency validation report"

allOf:
  - $ref: "categories/system-integration.schema.yaml"
  - type: object
    required: [consistency_checks, overall_status]
    properties:
      consistency_checks:
        type: array
        items:
          type: object
          properties:
            check_name: {type: string}
            status: {type: string, enum: [PASS, FAIL, WARNING]}
            affected_artifacts: {type: array, items: {type: string}}
      overall_status: {type: string, enum: [CONSISTENT, INCONSISTENT, WARNINGS]}

examples:
  - dp_id: "CONSISTENCY-001"
    artifact_type: "CONSISTENCY_REPORT"
    version: "1.0.0"
    created_at: "2026-02-16T11:15:00Z"
    created_by: "system:consistency-checker"
    schema_ref: "https://deep-process.org/schemas/consistency-report-schema.v1.yaml"
    compliance_flags: {self_contained: true, has_counter_checks: true, binding_gates_enforced: true}
    source_process: "deep-coherence"
    consistency_checks:
      - check_name: "Cross-reference integrity"
        status: "PASS"
        affected_artifacts: ["ARCH-001", "RISK-001"]
    overall_status: "CONSISTENT"
