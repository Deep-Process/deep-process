---
# Temporal Branch Schema v1.0
# Metadata for temporal branches (main/planned/*/historical/*)
# ARCHITECT-TASK.yaml task_04 deliverable (NEW #12)
---

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://deep-process.org/schemas/temporal-branch-schema.v1.yaml"

title: "Temporal Branch Metadata"
description: "Metadata for git temporal branch (main, planned, historical)"

allOf:
  - $ref: "categories/configuration-governance.schema.yaml"
  - type: object
    required: [branch_name, branch_type, effective_from]
    properties:
      branch_name:
        type: string
        pattern: "^(main|planned/[a-z0-9-]+|historical/[0-9]{4})$"

      branch_type:
        type: string
        enum: [MAIN, PLANNED, HISTORICAL]

      effective_from:
        type: string
        format: date-time
        description: "When this branch becomes active"

      effective_until:
        type: string
        format: date-time
        description: "When this branch expires (PLANNED only)"

      activation_trigger:
        type: string
        description: "What activates this branch"
        examples:
          - "IF date >= 2026-Q1 THEN activate"
          - "IF user_approves = true THEN activate"

      merge_rules:
        type: object
        properties:
          merge_allowed: {type: boolean}
          merge_requires_approval: {type: boolean}
          conflict_resolution: {type: string, enum: [MANUAL, AUTO_MAIN_WINS, AUTO_BRANCH_WINS]}

examples:
  - dp_id: "BRANCH-001"
    artifact_type: "TEMPORAL_BRANCH"
    version: "1.0.0"
    created_at: "2026-02-16T09:00:00Z"
    created_by: "user:architect"
    schema_ref: "https://deep-process.org/schemas/temporal-branch-schema.v1.yaml"
    compliance_flags: {self_contained: true, has_counter_checks: true, binding_gates_enforced: true}
    config_scope: "global"
    branch_name: "planned/q1-2026"
    branch_type: "PLANNED"
    effective_from: "2026-01-01T00:00:00Z"
    effective_until: "2026-03-31T23:59:59Z"
    activation_trigger: "IF date >= 2026-01-01 THEN activate"
    merge_rules:
      merge_allowed: true
      merge_requires_approval: true
      conflict_resolution: "MANUAL"
