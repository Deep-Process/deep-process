---
# Event Sourcing Architecture v1.0
# ARCHITECT-TASK.yaml task_02 deliverable
# Date: 2026-02-16
#
# PURPOSE: Define event log and state reconstruction mechanism
# COMPLIANCE: 13 zasady - mechanism-based, binding gates, corruption handling
---

architecture_version: "1.0.0"
created: "2026-02-16"
compliance_target: "13_zasady"

# ═══════════════════════════════════════════════════════════════
# OVERVIEW
# ═══════════════════════════════════════════════════════════════

overview:
  description: |
    Event sourcing architecture for deep-process ecosystem.
    All state changes recorded as immutable events in append-only log.
    Current state reconstructed by replaying events from snapshots.

  key_principles:
    - "Append-only: Events NEVER modified or deleted after creation"
    - "Immutable: Hash chain prevents tampering"
    - "Replay-based: State reconstructed from events (not stored directly)"
    - "Snapshot-optimized: Periodic snapshots avoid full replay"
    - "Audit-friendly: Complete history for compliance/debugging"

  benefits:
    - "Complete audit trail (regulatory compliance)"
    - "Time-travel debugging (replay to any point)"
    - "Event-driven architecture (pub/sub integration)"
    - "Conflict-free replication (events are facts)"
    - "Bug recovery (fix bug, replay from snapshot)"

# ═══════════════════════════════════════════════════════════════
# EVENT TYPES (12+ required)
# ═══════════════════════════════════════════════════════════════

event_types:
  total_types: 17
  categories: 4

  # ─────────────────────────────────────────────────────────────
  # CATEGORY 1: Process Lifecycle (5 events)
  # ─────────────────────────────────────────────────────────────

  process_lifecycle:
    PROCESS_STARTED:
      description: "Process instance created and started"
      payload_schema:
        process_id: string
        process_name: string
        started_by: string
        initial_state: object
      emitted_by: "orchestrator"
      triggers: "State transition to RUNNING"

    PROCESS_PAUSED:
      description: "Process execution paused (human intervention)"
      payload_schema:
        process_id: string
        pause_reason: string
        paused_by: string
      emitted_by: "orchestrator or operator"
      triggers: "State transition to PAUSED"

    PROCESS_RESUMED:
      description: "Process execution resumed after pause"
      payload_schema:
        process_id: string
        resumed_by: string
      emitted_by: "operator"
      triggers: "State transition back to RUNNING"

    PROCESS_COMPLETED:
      description: "Process successfully completed"
      payload_schema:
        process_id: string
        completion_status: string
        final_artifacts: array
        final_score: number
      emitted_by: "orchestrator"
      triggers: "State transition to COMPLETED, emit completion events"

    PROCESS_FAILED:
      description: "Process failed with error"
      payload_schema:
        process_id: string
        error_type: string
        error_message: string
        stack_trace: string
      emitted_by: "orchestrator"
      triggers: "State transition to FAILED, trigger error recovery"

  # ─────────────────────────────────────────────────────────────
  # CATEGORY 2: Artifact Lifecycle (3 events)
  # ─────────────────────────────────────────────────────────────

  artifact_lifecycle:
    ARTIFACT_CREATED:
      description: "New artifact created"
      payload_schema:
        artifact_id: string
        artifact_type: string
        created_by: string
        file_path: string
        parent_artifact: string
      emitted_by: "process instance"
      triggers: "Update artifact registry, emit to subscribers"

    ARTIFACT_UPDATED:
      description: "Artifact modified"
      payload_schema:
        artifact_id: string
        version_before: string
        version_after: string
        updated_by: string
        change_summary: string
      emitted_by: "process instance"
      triggers: "Increment version, cascade STALE to children"

    ARTIFACT_DELETED:
      description: "Artifact marked for deletion"
      payload_schema:
        artifact_id: string
        deleted_by: string
        deletion_reason: string
      emitted_by: "process instance or operator"
      triggers: "Mark status DELETED, break references"

  # ─────────────────────────────────────────────────────────────
  # CATEGORY 3: Coordination & Handoff (4 events)
  # ─────────────────────────────────────────────────────────────

  coordination:
    HANDOFF_INITIATED:
      description: "Process handoff started"
      payload_schema:
        handoff_id: string
        source_process: string
        target_process: string
        handoff_payload: object
      emitted_by: "source process"
      triggers: "Create handoff checkpoint, pre-validation"

    HANDOFF_COMPLETED:
      description: "Process handoff completed successfully"
      payload_schema:
        handoff_id: string
        target_instance_id: string
        post_verification_status: string
      emitted_by: "target process"
      triggers: "Update registry, emit to event bus"

    HANDOFF_FAILED:
      description: "Process handoff failed"
      payload_schema:
        handoff_id: string
        failure_reason: string
        recovery_action: string
      emitted_by: "orchestrator"
      triggers: "Rollback, retry, or escalate"

    STATE_SYNCHRONIZED:
      description: "State sync completed between processes"
      payload_schema:
        sync_id: string
        source_process: string
        target_process: string
        sync_status: string
      emitted_by: "coherence validator"
      triggers: "Update sync registry"

  # ─────────────────────────────────────────────────────────────
  # CATEGORY 4: Validation & Gates (5 events)
  # ─────────────────────────────────────────────────────────────

  validation_gates:
    VALIDATION_PASSED:
      description: "Validation check passed"
      payload_schema:
        validation_id: string
        validation_type: string
        validated_artifact: string
      emitted_by: "validator"
      triggers: "Update artifact status to VALID"

    VALIDATION_FAILED:
      description: "Validation check failed"
      payload_schema:
        validation_id: string
        validation_type: string
        validated_artifact: string
        errors: array
      emitted_by: "validator"
      triggers: "Mark artifact INVALID, emit violation report"

    GATE_PASSED:
      description: "Binding gate passed"
      payload_schema:
        gate_id: string
        gate_name: string
        checklist_items: integer
        all_passed: boolean
      emitted_by: "gate enforcer"
      triggers: "Allow progression to next phase"

    GATE_FAILED:
      description: "Binding gate failed"
      payload_schema:
        gate_id: string
        gate_name: string
        failed_items: array
      emitted_by: "gate enforcer"
      triggers: "HALT process, require remediation"

    COHERENCE_VIOLATION_DETECTED:
      description: "Coherence violation found"
      payload_schema:
        violation_id: string
        violation_type: string
        severity: string
        affected_artifacts: array
      emitted_by: "coherence validator"
      triggers: "Create violation report, trigger remediation"

  # ─────────────────────────────────────────────────────────────
  # CATEGORY 5: System Events (bonus)
  # ─────────────────────────────────────────────────────────────

  system_events:
    SNAPSHOT_CREATED:
      description: "State snapshot created"
      payload_schema:
        snapshot_id: string
        snapshot_sequence: integer
        event_sequence_at_snapshot: integer
        snapshot_file_path: string
      emitted_by: "snapshot service"
      triggers: "Update snapshot registry"

    DECISION_MADE:
      description: "Human decision recorded"
      payload_schema:
        decision_id: string
        decision_type: string
        decided_by: string
        decision_value: string
      emitted_by: "decision point handler"
      triggers: "Resume process with decision context"

# ═══════════════════════════════════════════════════════════════
# EVENT LOG FORMAT
# ═══════════════════════════════════════════════════════════════

event_log_format:
  storage_format: "YAML (append-only file)"
  file_location: ".deep-process/event-log.yaml"
  file_structure: |
    # Append-only event log
    # Each entry is a complete event with hash chain

    events:
      - dp_id: EVENT-001
        event_type: PROCESS_STARTED
        event_sequence: 1
        timestamp: "2026-02-16T10:00:00.000Z"
        event_payload: {...}
        event_hash: "abc123..."
        previous_event_hash: null  # First event

      - dp_id: EVENT-002
        event_type: ARTIFACT_CREATED
        event_sequence: 2
        timestamp: "2026-02-16T10:00:15.123Z"
        event_payload: {...}
        event_hash: "def456..."
        previous_event_hash: "abc123..."  # Links to previous

      # ... more events ...

  append_mechanism:
    rule: "Events ALWAYS appended to end of file"
    enforcement: "File system append-only mode OR S3 Object Lock"
    prohibition: "NEVER modify or delete existing events"

  file_rotation:
    trigger: "When file exceeds 10,000 events OR 100MB"
    action: "Create new file event-log-YYYYMMDD-HHMMSS.yaml"
    index: "Maintain event-log-index.yaml with file list"

# ═══════════════════════════════════════════════════════════════
# HASH CHAIN FOR IMMUTABILITY
# ═══════════════════════════════════════════════════════════════

hash_chain:
  description: |
    Each event contains hash of itself + hash of previous event.
    Forms blockchain-style chain for tamper detection.

  algorithm: "SHA-256"

  hash_calculation:
    input_data:
      - event_type
      - event_sequence
      - timestamp
      - event_payload (JSON stringified)
      - previous_event_hash
    formula: "event_hash = SHA256(concat(input_data))"
    example: |
      event_hash = SHA256(
        "PROCESS_STARTED" +
        "1" +
        "2026-02-16T10:00:00.000Z" +
        '{"process_id": "deep-verify-042"}' +
        "null"
      )

  chain_validation:
    validation_rule: |
      FOR EACH event in event_log:
        IF event.event_sequence > 1:
          previous_event = get_event(event.event_sequence - 1)
          ASSERT event.previous_event_hash = previous_event.event_hash
          ASSERT event.event_hash = SHA256(event_data)
        ELSE:
          ASSERT event.previous_event_hash = null

    integrity_check:
      frequency: "On startup, before replay"
      action_on_failure: "HALT and alert - log corruption detected"

  tamper_detection:
    scenario_1_modified_event:
      detection: "Recalculated hash ≠ stored hash"
      action: "Reject event, log security alert"

    scenario_2_missing_event:
      detection: "Gap in event_sequence OR hash chain break"
      action: "Identify missing sequence numbers, alert"

    scenario_3_reordered_events:
      detection: "Hash chain breaks (previous_event_hash mismatch)"
      action: "Reject out-of-order events, alert"

# ═══════════════════════════════════════════════════════════════
# SNAPSHOT MECHANISM
# ═══════════════════════════════════════════════════════════════

snapshot_mechanism:
  description: |
    Periodic state snapshots to avoid replaying all events.
    Snapshot = complete state at event_sequence N.

  snapshot_triggers:
    trigger_1_event_count:
      condition: "Every 100 events"
      rationale: "Balance replay time vs snapshot storage"

    trigger_2_time_based:
      condition: "Every 24 hours"
      rationale: "Daily snapshots for operational recovery"

    trigger_3_manual:
      condition: "Operator request"
      rationale: "Before major operations (deployment, migration)"

  snapshot_format:
    file_name: "snapshot-{event_sequence}-{timestamp}.yaml"
    example: "snapshot-00500-20260216T120000Z.yaml"
    location: ".deep-process/snapshots/"

    structure: |
      snapshot_metadata:
        snapshot_id: "SNAPSHOT-005"
        event_sequence: 500
        timestamp: "2026-02-16T12:00:00Z"
        event_hash_at_snapshot: "abc123..."

      process_state:
        instance_id: "deep-verify-042"
        status: "RUNNING"
        current_phase: "phase-3-adversarial"
        progress: 75

      artifact_registry:
        - artifact_id: "VERIFY-REPORT-001"
          status: "COMMITTED"
          version: "1.0.0"
        # ... all artifacts ...

      execution_context:
        variables: {...}
        history: [...]

  snapshot_retention:
    policy: "Keep last 10 snapshots + daily snapshots for 30 days"
    cleanup: "Automated cleanup via snapshot-gc.sh cron job"

  snapshot_validation:
    rule: "Snapshot must be reproducible by replaying events"
    test: |
      1. Replay events 1 to N
      2. Compare reconstructed state to snapshot
      3. ASSERT all fields match

# ═══════════════════════════════════════════════════════════════
# STATE RECONSTRUCTION ALGORITHM
# ═══════════════════════════════════════════════════════════════

state_reconstruction:
  algorithm_name: "Snapshot-based Incremental Replay"
  reference: "state-reconstruction-algorithm.md (separate document)"

  high_level_steps:
    step_1: "Find most recent snapshot before target event_sequence"
    step_2: "Load snapshot as base state"
    step_3: "Replay events from (snapshot_sequence + 1) to target_sequence"
    step_4: "Return reconstructed state"

  pseudo_code: |
    FUNCTION reconstruct_state(target_event_sequence):
      # Step 1: Find snapshot
      snapshot = find_latest_snapshot_before(target_event_sequence)

      IF snapshot exists:
        state = load_snapshot(snapshot)
        start_sequence = snapshot.event_sequence + 1
      ELSE:
        state = empty_state()
        start_sequence = 1

      # Step 2: Replay events
      events = load_events_range(start_sequence, target_event_sequence)

      FOR EACH event IN events:
        state = apply_event(state, event)

      RETURN state

    FUNCTION apply_event(state, event):
      # Dispatch to event-specific handler
      handler = get_event_handler(event.event_type)
      RETURN handler(state, event.event_payload)

  event_handlers:
    description: "Each event type has dedicated handler function"
    example: |
      FUNCTION handle_PROCESS_STARTED(state, payload):
        state.process_id = payload.process_id
        state.status = "RUNNING"
        state.started_at = payload.timestamp
        RETURN state

      FUNCTION handle_ARTIFACT_CREATED(state, payload):
        artifact = {
          id: payload.artifact_id,
          type: payload.artifact_type,
          status: "CREATED"
        }
        state.artifacts.append(artifact)
        RETURN state

  performance_optimization:
    snapshot_distance: "Max 100 events to replay (worst case)"
    index_structure: "B-tree index on event_sequence for O(log N) lookup"
    caching: "Cache last replayed state (30s TTL) for rapid re-queries"

# ═══════════════════════════════════════════════════════════════
# CORRUPTION HANDLING
# ═══════════════════════════════════════════════════════════════

corruption_handling:
  detection_mechanisms:
    hash_chain_break:
      detection: "previous_event_hash mismatch"
      action: "Identify last valid event, quarantine corrupted events"

    sequence_gap:
      detection: "Missing event_sequence numbers"
      action: "Log gap range, attempt recovery from backup"

    invalid_hash:
      detection: "Recalculated hash ≠ stored hash"
      action: "Mark event invalid, isolate corruption"

    schema_violation:
      detection: "Event fails schema validation"
      action: "Log warning, attempt graceful degradation"

  recovery_strategies:
    strategy_1_snapshot_rollback:
      condition: "Corruption detected after snapshot"
      action: "Rollback to last valid snapshot, discard corrupted events"
      data_loss: "Events after snapshot (max 100 events)"

    strategy_2_backup_restore:
      condition: "Corruption in main event log"
      action: "Restore from backup event log (daily backups)"
      data_loss: "Events since last backup (max 24 hours)"

    strategy_3_manual_repair:
      condition: "Isolated corruption (1-2 events)"
      action: "Operator manually reconstructs events from external logs"
      risk: "Human error, requires expert review"

    strategy_4_forward_recovery:
      condition: "Corruption is isolated, system can continue"
      action: "Mark corrupted events, continue with warning flag"
      risk: "State may be inconsistent, requires reconciliation"

  prevention_measures:
    write_verification:
      rule: "Immediately read back written event and validate hash"
      enforcement: "Write-Read-Verify loop after each append"

    backup_policy:
      frequency: "Daily backups + incremental every 4 hours"
      retention: "30 days of backups"
      storage: "S3 with versioning enabled"

    monitoring:
      metric_1: "Hash chain validation failures (alert on first occurrence)"
      metric_2: "Sequence gap detection (alert immediately)"
      metric_3: "Event write latency (alert if >1s, indicates I/O issues)"

# ═══════════════════════════════════════════════════════════════
# COMPLIANCE & VALIDATION
# ═══════════════════════════════════════════════════════════════

compliance_13_zasady:
  zasada_0_self_contained:
    status: "COMPLIANT"
    evidence: "Event log is self-contained file, no external dependencies"

  zasada_2_binding_gates:
    status: "COMPLIANT"
    evidence: "GATE_PASSED/GATE_FAILED events enforce binding gates"

  zasada_3_mechanism_based:
    status: "COMPLIANT"
    evidence: "All rules are IF/THEN mechanisms (e.g., IF hash mismatch THEN reject)"

  zasada_7_counter_checks:
    status: "COMPLIANT"
    evidence: "Hash chain validation = counter-check on event integrity"

  zasada_12_executable:
    status: "COMPLIANT"
    evidence: "Replay algorithm is executable (pseudocode → Python/TypeScript)"

validation_rules:
  rule_1_append_only:
    description: "Events NEVER modified after creation"
    validation: "File system write-once OR immutable storage"
    severity: "CRITICAL"

  rule_2_hash_chain:
    description: "Each event links to previous via hash"
    validation: "Automated integrity check on startup"
    severity: "CRITICAL"

  rule_3_monotonic_sequence:
    description: "event_sequence must be strictly increasing"
    validation: "Assert sequence[n+1] = sequence[n] + 1"
    severity: "ERROR"

  rule_4_snapshot_consistency:
    description: "Snapshot reproducible by replay"
    validation: "Periodic snapshot validation job"
    severity: "IMPORTANT"

# ═══════════════════════════════════════════════════════════════
# OPERATIONAL PROCEDURES
# ═══════════════════════════════════════════════════════════════

operational_procedures:
  startup_procedure:
    step_1: "Validate event log integrity (hash chain check)"
    step_2: "Load most recent snapshot"
    step_3: "Replay events since snapshot"
    step_4: "Verify reconstructed state matches expected"
    step_5: "Begin accepting new events"

  shutdown_procedure:
    step_1: "Flush pending events to log"
    step_2: "Create shutdown snapshot (optional)"
    step_3: "Close event log file (ensure all writes synced)"

  disaster_recovery:
    scenario_1_log_corruption:
      action: "Restore from backup, replay from last valid snapshot"

    scenario_2_snapshot_corruption:
      action: "Use older snapshot, replay more events"

    scenario_3_total_loss:
      action: "Restore from offsite backup (S3), accept up to 24h data loss"

