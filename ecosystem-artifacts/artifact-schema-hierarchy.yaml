    description: "Risk assessment from deep-risk"
    usage: "Output from deep-risk process"

  documentation_artifact:
    artifact_type: "DOCUMENTATION"
    category: "analysis_reporting"
    schema_file: "schemas/documentation.schema.yaml"
    status: "EXISTS (multiple doc schemas)"
    description: "Documentation from deep-document"
    usage: "Output from deep-document process"

  tradeoff_analysis:
    artifact_type: "TRADEOFF_ANALYSIS"
    category: "analysis_reporting"
    schema_file: "schemas/tradeoff-analysis.schema.yaml"
    status: "EXISTS"
    description: "Tradeoff analysis from deep-architect"
    usage: "ADR supporting analysis"

  adversary_findings:
    artifact_type: "ADVERSARY_FINDINGS"
    category: "analysis_reporting"
    schema_file: "schemas/adversary-findings.schema.yaml"
    status: "EXISTS"
    description: "Adversarial findings from deep-verify"
    usage: "Phase 3 adversarial validation results"

# ═══════════════════════════════════════════════════════════════
# SCHEMA CREATION ROADMAP
# ═══════════════════════════════════════════════════════════════

creation_roadmap:
  total_schemas: 27
  existing_schemas: 15
  new_schemas_required: 12
  bonus_schema: 1  # validation-rules (makes 13 total new)

  priority_order:
    P0_foundational:
      - base-artifact.schema.yaml
      - Category schemas (4 files)

    P1_critical:
      - event-log-schema.yaml               # NEW #2 - Event sourcing foundation
      - handoff-checkpoint-schema.yaml      # NEW #3 - Process coordination
      - process-registry-schema.yaml        # NEW #1 - Multi-instance tracking
      - orchestration-state-machine-schema.yaml  # NEW #10 - Orchestrator core

    P2_integration:
      - state-synchronization-schema.yaml   # NEW #4 - Real-time coherence
      - coherence-violation-schema.yaml     # NEW #5 - Validation pipeline
      - temporal-branch-schema.yaml         # NEW #12 - Temporal branching

    P3_analysis:
      - lineage-provenance-schema.yaml      # NEW #6 - Provenance tracking
      - cascade-impact-analysis-schema.yaml # NEW #7 - Change impact
      - drift-detection-result-schema.yaml  # NEW #9 - Semantic drift
      - consistency-report-schema.yaml      # NEW #8 - Consistency validation

    P4_transformation:
      - transformation-rule-schema.yaml     # NEW #11 - UPS transformation
      - validation-rules-schema.yaml        # NEW #13 - Validation config

# ═══════════════════════════════════════════════════════════════
# CROSS-REFERENCES & DEPENDENCIES
# ═══════════════════════════════════════════════════════════════

cross_references:
  event_log_uses:
    - handoff_checkpoint (events: HANDOFF_INITIATED, HANDOFF_COMPLETED)
    - state_synchronization_message (event: STATE_SYNCHRONIZED)
    - coherence_violation_report (event: VALIDATION_FAILED)

  orchestration_state_machine_drives:
    - process_instance_state (state transitions)
    - event_log_entry (state change events)

  handoff_checkpoint_requires:
    - process_registry_entry (source/target process lookup)
    - contract_definition (pre/post conditions)

  coherence_violation_triggers:
    - cascade_impact_analysis (assess downstream impact)
    - drift_detection_result (check if violation is drift)

# ═══════════════════════════════════════════════════════════════
# VALIDATION & COMPLIANCE
# ═══════════════════════════════════════════════════════════════

validation_rules:
  schema_completeness:
    rule: "ALL concrete types MUST reference valid schema_file"
    enforcement: "Binding gate in task_01 completion"

  inheritance_validity:
    rule: "ALL schemas MUST extend base-artifact or category schema"
    enforcement: "JSON Schema $ref validation"

  example_presence:
    rule: "ALL schemas MUST include at least 1 complete example"
    enforcement: "13 zasada #4 - completeness > tokens"

  self_containment:
    rule: "NO external dependencies (except $ref to base/category)"
    enforcement: "13 zasada #2 - self-contained"

compliance_13_zasady:
  zasada_0_self_contained:
    status: "COMPLIANT"
    evidence: "All schemas define full structure, no external deps"

  zasada_2_binding_gates:
    status: "COMPLIANT"
    evidence: "Validation rules enforce schema completeness before proceeding"

  zasada_4_completeness:
    status: "COMPLIANT"
    evidence: "All schemas include examples, validation constraints"

  zasada_7_counter_checks:
    status: "COMPLIANT"
    evidence: "Each schema has validation_rules for consistency"

  zasada_12_executable:
    status: "COMPLIANT"
    evidence: "Schemas are JSON Schema format (machine-executable validation)"

