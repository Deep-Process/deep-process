---
# Artifact Schema Hierarchy v1.0
# ARCHITECT-TASK.yaml task_01 deliverable
# Date: 2026-02-16
#
# PURPOSE: Taxonomy tree for ALL artifact types in deep-process ecosystem
# COMPLIANCE: 13 zasady - self-contained, binding gates, counter-checks
---

schema_version: "1.0"
ecosystem_version: "1.0.0"
created: "2026-02-16"
compliance_target: "13_zasady"

# ═══════════════════════════════════════════════════════════════
# TAXONOMY OVERVIEW
# ═══════════════════════════════════════════════════════════════

taxonomy_structure:
  description: |
    Three-tier hierarchy of artifact schemas:
    1. BASE LAYER: Universal base schema (inherited by all)
    2. CATEGORY LAYER: 4 major categories
    3. CONCRETE LAYER: 27 concrete artifact types (12 new + 15 existing)

  inheritance_model: "Single inheritance with mixins"

  validation_approach: "Schema composition via $ref"

# ═══════════════════════════════════════════════════════════════
# LAYER 1: BASE ARTIFACT SCHEMA
# ═══════════════════════════════════════════════════════════════

base_artifact_schema:
  schema_id: "base-artifact"
  file: "schemas/base-artifact.schema.yaml"
  status: "TO_CREATE"

  description: |
    Universal base schema inherited by ALL artifact types.
    Defines common fields: dp_id, version, timestamps, provenance.

  required_fields:
    - dp_id              # Deep-Process unique identifier
    - artifact_type      # Concrete type (e.g., EVENT, HANDOFF, RISK_ASSESSMENT)
    - version            # Semantic version
    - created_at         # ISO 8601 timestamp
    - created_by         # Agent or user identifier
    - schema_ref         # URI to schema definition
    - compliance_flags   # 13 zasady compliance markers

  optional_fields:
    - updated_at
    - updated_by
    - parent_artifact    # For hierarchical artifacts
    - effective_from     # For temporal branching
    - effective_until    # For temporal branching
    - git_commit         # Git hash if stored in repo
    - tags               # Free-form tags
    - metadata           # Extension point

  mixins:
    - validatable        # Adds validation_status, validation_errors
    - versionable        # Adds version history tracking
    - temporal           # Adds temporal branching fields
    - traceable          # Adds lineage/provenance tracking

# ═══════════════════════════════════════════════════════════════
# LAYER 2: CATEGORY SCHEMAS (4 categories)
# ═══════════════════════════════════════════════════════════════

category_schemas:

  # ─────────────────────────────────────────────────────────────
  # CATEGORY A: Process Execution Artifacts
  # ─────────────────────────────────────────────────────────────

  process_execution:
    category_id: "process-execution"
    file: "schemas/categories/process-execution.schema.yaml"
    status: "TO_CREATE"
    inherits_from: "base-artifact"

    description: |
      Artifacts created DURING process execution:
      - Instance state snapshots
      - Process logs
      - Checkpoints
      - Decision records

    additional_fields:
      - instance_id       # Which process instance
      - process_name      # Which process type
      - execution_phase   # Which phase of execution
      - operator_id       # Human operator (if any)

    concrete_types: 6

  # ─────────────────────────────────────────────────────────────
  # CATEGORY B: System Integration Artifacts
  # ─────────────────────────────────────────────────────────────

  system_integration:
    category_id: "system-integration"
    file: "schemas/categories/system-integration.schema.yaml"
    status: "TO_CREATE"
    inherits_from: "base-artifact"

    description: |
      Artifacts for COORDINATION between processes:
      - Events (event sourcing)
      - State synchronization messages
      - Handoff checkpoints
      - Coherence validation results

    additional_fields:
      - source_process    # Originating process
      - target_process    # Destination process (if applicable)
      - event_sequence    # For event ordering
      - correlation_id    # For request/response pairing

    concrete_types: 8

  # ─────────────────────────────────────────────────────────────
  # CATEGORY C: Configuration & Governance Artifacts
  # ─────────────────────────────────────────────────────────────

  configuration_governance:
    category_id: "configuration-governance"
    file: "schemas/categories/configuration-governance.schema.yaml"
    status: "TO_CREATE"
    inherits_from: "base-artifact"

    description: |
      Artifacts defining HOW the ecosystem operates:
      - Process definitions (process.yaml)
      - Orchestration rules
      - Transformation rules
      - Validation rules

    additional_fields:
      - config_scope      # global, process-specific, instance-specific
      - activation_rule   # When this config activates
      - precedence        # For conflict resolution

    concrete_types: 7

  # ─────────────────────────────────────────────────────────────
  # CATEGORY D: Analysis & Reporting Artifacts
  # ─────────────────────────────────────────────────────────────

  analysis_reporting:
    category_id: "analysis-reporting"
    file: "schemas/categories/analysis-reporting.schema.yaml"
    status: "TO_CREATE"
    inherits_from: "base-artifact"

    description: |
      Artifacts from ANALYSIS processes:
      - Verification reports
      - Risk assessments
      - Architecture models
      - Drift detection results

    additional_fields:
      - analysis_method   # Which method used (e.g., Method #71)
      - confidence_level  # HIGH/MEDIUM/LOW
      - findings_count    # Number of findings
      - severity_summary  # CRITICAL/IMPORTANT/MINOR counts

    concrete_types: 6

# ═══════════════════════════════════════════════════════════════
# LAYER 3: CONCRETE ARTIFACT TYPES (27 total = 12 new + 15 existing)
# ═══════════════════════════════════════════════════════════════

concrete_artifact_types:

  # ─────────────────────────────────────────────────────────────
  # CATEGORY A: Process Execution (6 types)
  # ─────────────────────────────────────────────────────────────

  process_instance_state:
    artifact_type: "PROCESS_INSTANCE_STATE"
    category: "process_execution"
    schema_file: "schemas/state-schema.yaml"
    status: "EXISTS"
    description: "Current state of a process instance"
    usage: "Updated on every state transition"

  process_registry_entry:
    artifact_type: "PROCESS_REGISTRY_ENTRY"
    category: "process_execution"
    schema_file: "schemas/process-registry-schema.yaml"
    status: "TO_CREATE (NEW #1)"
    description: "Entry in process registry for multi-instance tracking"
    usage: "Created when process instance starts, archived when completes"

  process_log_entry:
    artifact_type: "PROCESS_LOG_ENTRY"
    category: "process_execution"
    schema_file: "schemas/process-log.schema.yaml"
    status: "EXISTS"
    description: "Log entry from process execution"
    usage: "Append-only log for audit trail"

  decision_point_record:
    artifact_type: "DECISION_POINT"
    category: "process_execution"
    schema_file: "schemas/decision-point-schema.yaml"
    status: "EXISTS"
    description: "Record of decision made at decision point"
    usage: "Human-anchored approval points"

  fork_join_record:
    artifact_type: "FORK_JOIN"
    category: "process_execution"
    schema_file: "schemas/fork-join-schema.yaml"
    status: "EXISTS"
    description: "Fork/join parallel execution record"
    usage: "Parallel task coordination"

  transformation_proof:
    artifact_type: "TRANSFORMATION_PROOF"
    category: "process_execution"
    schema_file: "schemas/transformation-proof-schema.yaml"
    status: "EXISTS"
    description: "Proof that transformation was valid (Method #160)"
    usage: "Validates UPS → SRE-Convergent transformation"

  # ─────────────────────────────────────────────────────────────
  # CATEGORY B: System Integration (8 types - ALL NEW)
  # ─────────────────────────────────────────────────────────────

  event_log_entry:
    artifact_type: "EVENT"
    category: "system_integration"
    schema_file: "schemas/event-log-schema.yaml"
    status: "TO_CREATE (NEW #2)"
    description: "Event in event-sourcing log (append-only, immutable)"
    usage: "State reconstruction, audit trail, cross-process communication"
    event_types:
      - PROCESS_STARTED
      - PROCESS_COMPLETED
      - ARTIFACT_CREATED
      - ARTIFACT_UPDATED
      - HANDOFF_INITIATED
      - HANDOFF_COMPLETED
      - VALIDATION_FAILED
      - STATE_SYNCHRONIZED

  handoff_checkpoint:
    artifact_type: "HANDOFF_CHECKPOINT"
    category: "system_integration"
    schema_file: "schemas/handoff-checkpoint-schema.yaml"
    status: "TO_CREATE (NEW #3)"
    description: "Checkpoint at process handoff boundary"
    usage: "Pre-handoff validation, post-handoff verification"

  state_synchronization_message:
    artifact_type: "STATE_SYNC"
    category: "system_integration"
    schema_file: "schemas/state-synchronization-schema.yaml"
    status: "TO_CREATE (NEW #4)"
    description: "Message for state sync between processes"
    usage: "Real-time coherence validation"

  coherence_violation_report:
    artifact_type: "COHERENCE_VIOLATION"
    category: "system_integration"
    schema_file: "schemas/coherence-violation-schema.yaml"
    status: "TO_CREATE (NEW #5)"
    description: "Report of coherence violation detected"
    usage: "Real-time validation pipeline output"

  lineage_provenance_record:
    artifact_type: "LINEAGE_PROVENANCE"
    category: "system_integration"
    schema_file: "schemas/lineage-provenance-schema.yaml"
    status: "TO_CREATE (NEW #6)"
    description: "Provenance chain for artifact lineage"
    usage: "Track artifact derivation, dependencies"

  cascade_impact_analysis:
    artifact_type: "CASCADE_IMPACT"
    category: "system_integration"
    schema_file: "schemas/cascade-impact-analysis-schema.yaml"
    status: "TO_CREATE (NEW #7)"
    description: "Analysis of change impact across ecosystem"
    usage: "Predict STALE propagation, prioritize updates"

  consistency_report:
    artifact_type: "CONSISTENCY_REPORT"
    category: "system_integration"
    schema_file: "schemas/consistency-report-schema.yaml"
    status: "TO_CREATE (NEW #8)"
    description: "Cross-artifact consistency validation report"
    usage: "Periodic consistency checks"

  drift_detection_result:
    artifact_type: "DRIFT_DETECTION"
    category: "system_integration"
    schema_file: "schemas/drift-detection-result-schema.yaml"
    status: "TO_CREATE (NEW #9)"
    description: "Semantic drift detection result"
    usage: "Detect vocabulary/semantic drift over time"

  # ─────────────────────────────────────────────────────────────
  # CATEGORY C: Configuration & Governance (7 types)
  # ─────────────────────────────────────────────────────────────

  process_definition:
    artifact_type: "PROCESS_DEFINITION"
    category: "configuration_governance"
    schema_file: "schemas/universal-process-schema.yaml"
    status: "EXISTS (Universal Process Schema)"
    description: "Process definition (process.yaml)"
    usage: "Defines how process executes"

  orchestration_state_machine:
    artifact_type: "ORCHESTRATION_STATE_MACHINE"
    category: "configuration_governance"
    schema_file: "schemas/orchestration-state-machine-schema.yaml"
    status: "TO_CREATE (NEW #10)"
    description: "State machine for deep-process orchestrator"
    usage: "Defines state transitions for orchestration"

  transformation_rule:
    artifact_type: "TRANSFORMATION_RULE"
    category: "configuration_governance"
    schema_file: "schemas/transformation-rule-schema.yaml"
    status: "TO_CREATE (NEW #11)"
    description: "Rule for UPS → SRE-Convergent transformation"
    usage: "Transformation pipeline configuration"

  contract_definition:
    artifact_type: "CONTRACT"
    category: "configuration_governance"
    schema_file: "schemas/contract-schema.yaml"
    status: "EXISTS"
    description: "Contract between processes or artifacts"
    usage: "Pre/post conditions, binding gates"

  artifact_hierarchy_config:
    artifact_type: "ARTIFACT_HIERARCHY"
    category: "configuration_governance"
    schema_file: "schemas/artifact-hierarchy-schema.yaml"
    status: "EXISTS"
    description: "Artifact hierarchy within instance"
    usage: "Self-extension, parent-child tracking"

  temporal_branch_metadata:
    artifact_type: "TEMPORAL_BRANCH"
    category: "configuration_governance"
    schema_file: "schemas/temporal-branch-schema.yaml"
    status: "TO_CREATE (NEW #12)"
    description: "Metadata for temporal branch (main/planned/*/historical/*)"
    usage: "Git branch activation, effective_from tracking"

  validation_rule_set:
    artifact_type: "VALIDATION_RULES"
    category: "configuration_governance"
    schema_file: "schemas/validation-rules-schema.yaml"
    status: "TO_CREATE (NEW #13 - bonus)"
    description: "Validation rules for coherence pipeline"
    usage: "Syntax → Schema → Semantic → Coherence stages"

  # ─────────────────────────────────────────────────────────────
  # CATEGORY D: Analysis & Reporting (6 types)
  # ─────────────────────────────────────────────────────────────

  verification_report:
    artifact_type: "VERIFICATION_REPORT"
    category: "analysis_reporting"
    schema_file: "schemas/verification-report.schema.yaml"
    status: "EXISTS"
