bottlenecks:

  - id: "BN-001"
    location: "C-015 (PostgreSQL Database)"
    type: "throughput"
    description: "Single PostgreSQL instance (even Multi-AZ) handles all read/write queries from 23 components"
    current_capacity: "5000 queries/sec (db.r6g.2xlarge benchmark)"
    projected_load_6m: "10,000 queries/sec (100 customers, 50 jobs/day each, 100 queries/job)"
    projected_load_12m: "30,000 queries/sec (300 customers)"
    headroom: "-25,000 queries/sec at 12 months (insufficient)"
    mitigation: "1. Read replicas for query distribution (3 replicas, split read load 75%). 2. Connection pooling (PgBouncer, reduce connection overhead). 3. Query optimization (indexes on tenant_id, job_id, created_at). 4. Vertical scaling to db.r6g.4xlarge if needed."
    priority: "critical"
    timeline: "Implement read replicas by Month 6, before bottleneck hits"

  - id: "BN-002"
    location: "C-014 (LLM Integration Service)"
    type: "external_dependency"
    description: "Anthropic API rate limit (tier-dependent, estimated 10K requests/min for enterprise tier)"
    current_capacity: "10,000 requests/min (Anthropic enterprise tier)"
    projected_load_6m: "20,000 requests/min (100 customers × 200 LLM calls/job × 1 job/min)"
    projected_load_12m: "60,000 requests/min (300 customers)"
    headroom: "-50,000 requests/min at 12 months (bottleneck)"
    mitigation: "1. Multi-provider load balancing (50% Anthropic, 50% OpenAI). 2. Request higher tier from Anthropic (negotiate custom limits). 3. LLM response caching (30% cache hit rate reduces load). 4. Batch prompts where possible (reduce API calls)."
    priority: "critical"
    timeline: "Negotiate higher limits by Month 3, implement multi-provider by Month 6"

  - id: "BN-003"
    location: "C-004 (Process Executor Pool)"
    type: "resource"
    description: "Executor pods limited by K8s node capacity (16 vCPU, 32GB RAM per c6i.4xlarge node)"
    current_capacity: "50 pods (5 nodes × 10 pods/node)"
    projected_load_6m: "100 concurrent jobs (need 100 pods)"
    projected_load_12m: "400 concurrent jobs (need 400 pods)"
    headroom: "-350 pods at 12 months (major bottleneck)"
    mitigation: "1. Horizontal Pod Autoscaler (HPA) based on SQS queue depth. 2. Cluster autoscaler (add nodes dynamically, max 50 nodes). 3. Spot instances for cost (70% discount on c6i.4xlarge). 4. Pod bin packing optimization (2 pods/node with resource limits)."
    priority: "high"
    timeline: "Implement HPA + Cluster Autoscaler by Month 3 (before load increases)"

