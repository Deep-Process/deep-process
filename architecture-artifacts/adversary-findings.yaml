premortem_scenarios:

  - id: "PS-001"
    scenario: "Platform shutdown after 18 months due to multi-tenant data breach (500+ customers affected)"
    root_cause: "VR-001 realized: SQL injection vulnerability in job submission API bypassed tenant_ID filtering, exposed all customer data. SOC 2 revoked, GDPR fines, customer exodus."
    probability: "medium"
    impact: "catastrophic"
    early_warning_signs:
      - "SAST tool bypassed (developer override)"
      - "Penetration test findings not remediated within SLA"
      - "Anomaly detection alerts ignored (alert fatigue)"
    preventive_measures:
      - "Zero tolerance for SAST bypasses (CTO approval required)"
      - "Quarterly penetration testing with mandatory remediation"
      - "Implement VR-001 mitigations immediately ($100K-$145K investment)"
    source: "VR-001 from TSK-002"

  - id: "PS-002"
    scenario: "Chose wrong strategic cluster (CL-002 Enterprise-First), wasted $1.5M, market captured by competitor with CL-001 Fast Market approach"
    root_cause: "VR-007 realized: Tiered deployment assumption (Q1) was false. Customers didn't need on-prem compliance, SaaS with contractual guarantees sufficient. Invested in hybrid architecture, SOC 2, professional services team unnecessarily."
    probability: "medium"
    impact: "critical"
    early_warning_signs:
      - "Customer discovery interviews reveal uniform deployment preference"
      - "On-prem sales cycle >18 months (too long)"
      - "Competitor launches simpler SaaS-only product, gains traction"
    preventive_measures:
      - "Complete 15-20 enterprise interviews before cluster commitment (VR-007 mitigation #1)"
      - "6-month CL-001 pilot to validate assumptions (VR-007 mitigation #2)"
      - "6-month decision review checkpoint before irreversible investment"
    source: "VR-007 from TSK-002"

  - id: "PS-003"
    scenario: "Platform unavailable for 8 hours during peak compliance season, $500K revenue impact, customer churn"
    root_cause: "PostgreSQL connection pool exhaustion during audit season spike (5× normal load). All services timeout, API Gateway returns 503. Recovery delayed due to lack of runbook."
    probability: "medium"
    impact: "high"
    early_warning_signs:
      - "Connection pool utilization trending upward (70% → 85% over 2 weeks)"
      - "Slow query log shows increasing table scans"
      - "No load testing performed before audit season"
    preventive_measures:
      - "Implement BN-001 mitigation (read replicas, connection pooling, query optimization)"
      - "Load testing at 2× projected load (200 concurrent jobs)"
      - "Incident response runbook for database failover"
      - "Auto-scaling for executor pool (HPA + Cluster Autoscaler)"

  - id: "PS-004"
    scenario: "LLM API costs spiral out of control ($50K/month vs $10K budget), cash flow crisis"
    root_cause: "No usage quotas implemented. Free tier users abuse deep-risk comprehensive runs. Attacker automation launches 10K jobs/day."
    probability: "high"
    impact: "medium"
    early_warning_signs:
      - "LLM API cost increasing 20%+ month-over-month"
      - "Unusual spike in deep-risk comprehensive job count"
      - "Single tenant consuming >50% of API tokens"
    preventive_measures:
      - "Implement VR-008 mitigations (usage quotas, CAPTCHA, cost-based throttling)"
      - "Real-time cost alerting (PagerDuty if daily cost >$200)"
      - "Per-tenant cost tracking dashboard"
      - "Hard caps on free tier (10 jobs/month, cannot be exceeded)"

  - id: "PS-005"
    scenario: "SOC 2 audit failure after 12 months of preparation, enterprise pipeline frozen for additional 6 months"
    root_cause: "Incident response plan gap (from compliance analysis). Auditor finds insufficient evidence of incident response capabilities, fails CC7.5 control."
    probability: "medium"
    impact: "high"
    early_warning_signs:
      - "Pre-audit gap assessment identifies incident response as weakness"
      - "No tabletop exercises conducted"
      - "Incident response plan incomplete or not tested"
    preventive_measures:
      - "Implement compliance gap remediation (incident response playbook, CAB process)"
      - "Quarterly tabletop exercises with documented outcomes"
      - "Early auditor engagement (Month 1-2) for gap assessment (VR-002 mitigation)"
      - "Compliance automation platform (Vanta, Drata) to track control evidence"

  - id: "PS-006"
    scenario: "OAuth integration with GitHub compromised, attacker accesses all customers' workflow data via MCP"
    root_cause: "VR-010 realized: OAuth token reuse vulnerability. Attacker obtains token, replays across tenants via MCP. No per-tenant token isolation."
    probability: "medium"
    impact: "critical"
    early_warning_signs:
      - "OAuth anomaly detection alerts on token reuse"
      - "Unusual MCP traffic patterns (single token accessing multiple tenants)"
      - "GitHub security advisory on OAuth vulnerability"
    preventive_measures:
      - "Implement VR-010 mitigations (per-tenant OAuth tokens, immutable scopes)"
      - "Real-time OAuth anomaly detection with auto-block"
      - "Security advisory monitoring for GitHub, Azure AD, Okta"
    source: "VR-010 from TSK-002"

