anti_patterns_detected:

  - id: "AP-001"
    anti_pattern_id: "AAP-DAT-001"
    name: "Shared Database (between services)"
    location: "C-010 (IAM), C-011 (Artifact Storage), C-002 (Orchestrator) all access C-015 (PostgreSQL)"
    severity: "high"
    symptoms_matched:
      - "Multiple services read/write same database tables (users, jobs, artifacts_metadata)"
      - "Schema changes affect multiple services"
    description: "IAM service owns users table, Orchestrator owns jobs table, Artifact Storage owns artifacts_metadata table, but all in same PostgreSQL instance. Risk of tight coupling, schema migration coordination, and blast radius if DB fails."
    remediation:
      - "Long-term: Migrate to database-per-service (IAM → separate DB, Orchestrator → separate DB). Effort: high (6-12 months)."
      - "Short-term: Enforce schema ownership boundaries (IAM service NEVER touches jobs table, only users). Document table ownership in README."
      - "Implement database migration coordination (shared Flyway migrations repo, versioned per service)."
    related_patterns: ["AP-DAT-001 (Database per Service)"]
    accepted_risk: "Accept for MVP (single PostgreSQL simplifies ops). Revisit at 200+ customers when scaling challenges emerge."

  - id: "AP-002"
    anti_pattern_id: "AAP-COM-004"
    name: "Missing Circuit Breaker"
    location: "C-004 (Executor) → C-005/C-006/C-007/C-008 (Process Services) calls lack circuit breakers"
    severity: "medium"
    symptoms_matched:
      - "No fallback behavior when process service unavailable"
      - "Potential thread pool exhaustion if process service slow"
    description: "Executor invokes process services via gRPC. If deep-compliance service crashes, executor retries indefinitely, blocking thread. No circuit breaker to fail fast."
    remediation:
      - "Add circuit breaker to Executor → Process Service gRPC calls (resilience4j library)."
      - "Circuit breaker config: 5 failures in 10s window → open for 60s cooldown."
      - "Fallback: Mark job as 'failed' with clear error message, allow user retry."
    related_patterns: ["AP-RES-001 (Circuit Breaker)"]
    priority: "high"
    timeline: "Implement by Month 3 (before production load)"

anti_patterns_summary:
  total_detected: 2
  by_severity:
    critical: 0
    high: 1
    medium: 1
  remediation_status:
    accepted_risk: 1
    planned_mitigation: 1

