failure_modes:

  - id: "FM-001"
    component: "C-015 (PostgreSQL Database)"
    failure_mode: "Primary database failure (hardware/software crash)"
    effect: "All write operations fail, job submissions blocked, read-only mode for 1-5 minutes during failover"
    severity: 9
    occurrence: 3
    detection: 2
    rpn: 54
    mitigation: "RDS Multi-AZ automatic failover (1-5 min). Read replicas for read traffic during failover. Health checks detect failure in <30s."
    mitigated_rpn: 18
    priority: "high"

  - id: "FM-002"
    component: "C-003 (SQS Job Queue)"
    failure_mode: "Message visibility timeout expires, job executed twice (duplicate processing)"
    effect: "Same job runs in 2 executor pods, generates duplicate artifacts, wastes LLM API cost"
    severity: 6
    occurrence: 5
    detection: 4
    rpn: 120
    mitigation: "Idempotency key in job metadata. Executor checks artifact storage before starting. If artifacts exist, skip execution. DLQ for poison messages."
    mitigated_rpn: 32
    priority: "critical"

  - id: "FM-003"
    component: "C-014 (LLM Integration Service)"
    failure_mode: "LLM API rate limit (429 Too Many Requests)"
    effect: "Job execution paused, retries consume 60s timeout, cascading delays"
    severity: 7
    occurrence: 6
    detection: 2
    rpn: 84
    mitigation: "Circuit breaker (open after 5 failures, 60s cooldown). Multi-provider failover (Anthropic → OpenAI). Token bucket rate limiting on client side. Exponential backoff retry (1s, 2s, 4s, 8s, 16s)."
    mitigated_rpn: 21
    priority: "high"

  - id: "FM-004"
    component: "C-004 (Process Executor Pool)"
    failure_mode: "Out-of-memory crash during deep-risk comprehensive execution"
    effect: "Job fails after 8+ hours, user must restart from scratch, wasted LLM API cost"
    severity: 8
    occurrence: 4
    detection: 3
    rpn: 96
    mitigation: "Memory limits per pod (16GB). Checkpoint/resume mechanism (save state every phase). K8s OOMKilled detection triggers auto-restart from checkpoint. Swap to disk for large data structures."
    mitigated_rpn: 24
    priority: "high"

  - id: "FM-005"
    component: "C-002 (Process Orchestrator)"
    failure_mode: "Orchestrator pod crashes mid-job, job status stuck in 'running' state"
    effect: "Job never completes, webhook never sent, user receives no notification"
    severity: 7
    occurrence: 3
    detection: 5
    rpn: 105
    mitigation: "Job status stored in PostgreSQL (not pod memory). Orphan job detector (cron job checks jobs 'running' >24 hours, marks failed). Watchdog timer in executor sends heartbeat to orchestrator (missing heartbeat triggers timeout)."
    mitigated_rpn: 28
    priority: "critical"

  - id: "FM-006"
    component: "C-001 (API Gateway)"
    failure_mode: "All API Gateway pods crash (bad deployment, resource exhaustion)"
    effect: "Platform completely unavailable, no job submissions, no status checks, 100% downtime"
    severity: 10
    occurrence: 2
    detection: 1
    rpn: 20
    mitigation: "Rolling update with 25% max unavailable (always 2/3 pods healthy). Health checks block bad deployment. PodDisruptionBudget ensures min 2 pods during updates. ALB health check fails over to healthy pods."
    mitigated_rpn: 10
    priority: "medium"

  - id: "FM-007"
    component: "C-012 (S3 Object Storage)"
    failure_mode: "S3 region outage (AWS service disruption)"
    effect: "Cannot store or retrieve artifacts, job completion blocked, dashboard cannot load results"
    severity: 8
    occurrence: 1
    detection: 1
    rpn: 8
    mitigation: "Cross-region replication to us-west-2. Failover DNS record points to DR region. RTO: 2-4 hours (manual failover). S3 versioning prevents data loss."
    mitigated_rpn: 8
    priority: "low"

  - id: "FM-008"
    component: "C-019 (Webhook Dispatcher)"
    failure_mode: "Customer webhook URL unreachable (DNS failure, firewall, downtime)"
    effect: "Job completion notification not delivered, customer unaware job finished"
    severity: 5
    occurrence: 7
    detection: 3
    rpn: 105
    mitigation: "Retry with exponential backoff (5 attempts: 1s, 2s, 4s, 8s, 16s). DLQ for failed webhooks. Email fallback notification. Webhook delivery status visible in dashboard."
    mitigated_rpn: 30
    priority: "critical"

