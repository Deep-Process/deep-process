---
id: "ADR-002"
title: "Event-Driven Architecture for Async Long-Running Process Execution"
date: "2026-02-15"
status: "accepted"
deciders: ["Architecture Team", "Platform Lead"]

context: |
  Deep-* processes are long-running operations (2-24 hours per config.yaml timeouts). Requirements:
  - Async execution: HTTP requests cannot block for 24 hours (client timeouts, load balancer limits)
  - Queue-based: Need durable job queue to survive executor crashes (jobs must not be lost)
  - Progress tracking: Users need visibility into current phase, gate status, progress percentage
  - Notifications: External systems (Slack, CI/CD pipelines) need job completion webhooks
  - Decoupling: Job submission (API Gateway) decoupled from execution (Executor Pool) for independent scaling

decision: |
  Adopt event-driven architecture with:
  - Job Queue (SQS FIFO / Azure Service Bus) for async job delivery to executor pool
  - Event bus (EventBridge / Event Grid) for job lifecycle events (phase_started, gate_passed, gate_failed, completed)
  - Webhook dispatcher subscribed to event bus for outbound notifications
  - Correlation IDs propagated through entire workflow for distributed tracing

  Job submission flow:
  1. User -> API Gateway: POST /v1/jobs (synchronous)
  2. API Gateway -> Orchestrator: SubmitJob (synchronous gRPC)
  3. Orchestrator -> Job Queue: EnqueueMessage (async, fire-and-forget)
  4. Orchestrator -> User: 202 Accepted {job_id, status: "queued"}
  5. Job Queue -> Executor Pool: DeliverMessage (async pull/push)
  6. Executor -> Event Bus: PublishEvent (phase_started, gate_passed, etc.)
  7. Event Bus -> Webhook Dispatcher -> Customer Webhook URL

rationale: |
  1. **Temporal Decoupling**: Job submission returns immediately (202 Accepted) without waiting for completion.
     Client connection doesn't block for 24 hours.

  2. **Durability**: Queue persists messages. If executor crashes mid-execution, job remains in queue for retry
     (visibility timeout mechanism).

  3. **Scalability**: Queue absorbs traffic spikes. During audit season, 500 jobs/hour can queue without overwhelming
     executors. Auto-scaling adds executors based on queue depth.

  4. **Loose Coupling**: Orchestrator doesn't directly invoke Executor. Queue provides buffer, allowing independent
     deployment and scaling.

  5. **Event-Driven Notifications**: Multiple consumers (Webhook Dispatcher, Observability, Dashboard UI) subscribe
     to job events without Orchestrator knowing about them.

alternatives_considered:
  - option: "Synchronous HTTP Long-Polling"
    pros:
      - "Simpler: no queue infrastructure needed"
      - "Immediate response when job completes"
    cons:
      - "Client connection held open for 2-24 hours (HTTP timeout, load balancer timeout)"
      - "Connection failures lose job (not durable)"
      - "Cannot scale executors independently (connection pinned to specific executor)"
    rejected_because: |
      HTTP timeouts at load balancer (60s), API Gateway (30s), client (varies) make long-polling impractical for
      multi-hour jobs. Not durable: network blip loses job.

  - option: "Polling (Client Polls Job Status)"
    pros:
      - "No long-held connections"
      - "Client controls polling frequency"
    cons:
      - "Chatty: client polls every 10s for 24 hours = 8640 API calls"
      - "Inefficient: wasted API calls when nothing changes"
      - "No push notifications: external systems (Slack) must poll, not receive webhooks"
    rejected_because: |
      Polling is acceptable as fallback, but primary mechanism should be push (webhooks). Event-driven + polling
      provides best of both: push for efficiency, polling for resilience.

  - option: "WebSocket Streaming"
    pros:
      - "Real-time bidirectional communication"
      - "Push updates to client as job progresses"
    cons:
      - "Complex to scale (stateful connections)"
      - "Load balancer sticky sessions required"
      - "Connection failures require reconnection logic"
      - "Not suitable for CI/CD pipeline integration (wants webhook callback, not persistent connection)"
    rejected_because: |
      WebSocket useful for Dashboard UI real-time updates (can add later), but unsuitable for primary job execution
      pattern. CI/CD pipelines and external systems expect webhook callbacks, not WebSocket streams.

consequences:
  positive:
    - "Async execution: API returns immediately (202), no blocked connections"
    - "Durability: Jobs persist in queue, survive executor crashes"
    - "Scalability: Queue absorbs spikes, auto-scaling adds executors"
    - "Loose coupling: Orchestrator and Executor scale independently"
    - "Event-driven: Multiple consumers (webhooks, dashboard, observability) without coupling"
    - "Replay capability: Event bus archive enables job replay for debugging"

  negative:
    - "Eventual consistency: Job status updates not immediate (event propagation latency 100ms-1s)"
    - "Complexity: Need queue, event bus, webhook retry logic vs simple sync HTTP"
    - "Debugging: Distributed tracing required to follow job through queue, executor, event bus"
    - "Cost: Queue and event bus incur charges (SQS: $0.40/million requests, EventBridge: $1/million events)"
    - "DLQ management: Failed jobs move to DLQ, require monitoring and manual intervention"

implementation_details:
  queue:
    aws: "SQS FIFO queue with content-based deduplication, DLQ for failed jobs, visibility timeout 1 hour"
    azure: "Service Bus Premium with sessions, duplicate detection, DLQ"
    message_format: |
      {
        "job_id": "uuid",
        "tenant_id": "uuid",
        "process_id": "deep-compliance",
        "inputs": {...},
        "priority": "high",
        "correlation_id": "uuid",
        "created_at": "ISO-8601"
      }

  event_bus:
    aws: "EventBridge custom event bus with schema registry, archive enabled (7 days retention)"
    azure: "Event Grid custom topic with event schemas"
    event_types:
      - "job.queued"
      - "job.started"
      - "job.phase.started"
      - "job.gate.passed"
      - "job.gate.failed"
      - "job.completed"
      - "job.failed"

  retry_policy:
    queue_retries: 3
    dlq_after: "3 failed attempts"
    webhook_retries: 5
    webhook_backoff: "exponential (1s, 2s, 4s, 8s, 16s)"

risks:
  - risk: "Message loss if queue deleted or misconfigured"
    mitigation: "Queue replication (SQS standard, Service Bus Premium geo-replication), backup to S3"

  - risk: "Poison messages block queue processing"
    mitigation: "DLQ for failed messages after 3 retries, monitoring for DLQ depth"

  - risk: "Event bus throttling during traffic spikes"
    mitigation: "EventBridge: 10K events/sec default limit, request increase. Batch events where possible."

compliance_notes: |
  - SOC 2: Audit trail via event bus archive. All job lifecycle events immutable and retained for 7 days.
  - GDPR: Events containing PII (user_id, inputs) encrypted at rest, access logged.

related_adrs:
  - "ADR-001: Microservices Architecture"
  - "ADR-004: Circuit Breaker for External LLM APIs"
  - "ADR-008: Webhook Delivery with HMAC Signatures"
