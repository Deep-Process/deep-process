---
# Subprocess Adapter: deep-requirements
# Wraps processes/deep-requirements for Executive Orchestrator

subprocess_id: deep-requirements
subprocess_name: "Requirements Gathering"
version: 1.0.0

purpose: "Extract and analyze requirements from user vision and constraints"

# Reference to original process
original_process:
  location: ../../../processes/deep-requirements
  process_file: process.yaml

# Executive Orchestrator metadata
inputs_required:
  - goal_declaration: "Business goal from Phase 1"
  - constraints: "Budget, timeline, compliance, technology constraints"
  - user_vision: "Original user vision statement"

outputs_produced:
  - requirements_document: "Structured requirements specification"
  - functional_requirements: "List of functional requirements"
  - non_functional_requirements: "Quality attributes and constraints"
  - acceptance_criteria: "Testable acceptance criteria"

estimated_duration: "1-2 hours"
complexity: MEDIUM

execution_pattern: |
  When invoked by Executive Orchestrator:

  1. LOAD inputs from Phase 1:
     - goal-declaration.yaml
     - constraints.yaml

  2. DELEGATE to original process:
     EXECUTE: ../../../processes/deep-requirements/
     PROVIDE: goal, constraints as context
     CAPTURE: all outputs

  3. TRANSLATE outputs to business terms:
     Technical artifacts → Business value description

  4. RETURN:
     - requirements_document (for next phase)
     - business_summary (for user display)

business_value:
  description: "Converts business vision into structured requirements"
  user_sees: "Requirements captured and documented"
  user_does_not_see: "Technical requirement analysis details"

integration_notes: |
  This subprocess is HIDDEN from user (Phase 3 execution).
  User sees only: "✓ Requirements gathering complete.
                   Captured: [business-level summary]"

  Technical output logged to execution-log.yaml for reference.

error_handlers:
  - missing_input
  - invalid_input
  - partial_completion
  - timeout
