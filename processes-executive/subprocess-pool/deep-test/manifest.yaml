---
# Subprocess Adapter: deep-test
# Wraps processes/deep-test for Executive Orchestrator

subprocess_id: deep-test
subprocess_name: "Testing & Validation"
version: 1.0.0

purpose: "Test and validate implemented system"

# Reference to original process
original_process:
  location: ../../../processes/deep-test
  process_file: process.yaml

# Executive Orchestrator metadata
inputs_required:
  - implementation_artifacts: "Code from deep-implement"
  - requirements_document: "Acceptance criteria from deep-requirements"
  - test_scope: "What to test (unit, integration, e2e, all)"

outputs_produced:
  - test_results: "Pass/fail results with details"
  - test_coverage_report: "Coverage metrics"
  - failed_tests: "List of failures (if any)"
  - test_log: "Execution log"

estimated_duration: "1-2 hours"
complexity: HIGH

execution_pattern: |
  When invoked by Executive Orchestrator:

  1. LOAD inputs:
     - implementation artifacts (from deep-implement)
     - requirements.yaml (acceptance criteria)
     - test_scope (from task definition)

  2. DELEGATE to original deep-test process:
     EXECUTE: ../../../processes/deep-test/
     PROVIDE: code artifacts, acceptance criteria
     CAPTURE: test results

  3. ANALYZE results:
     IF all tests pass:
       MARK: validation SUCCESS
       PROCEED normally

     IF tests fail:
       TRIGGER: recursive fix pattern
       CREATE fix tasks for each failure:
         FOR EACH failed_test:
           CREATE task:
             task_name: "Fix: {test_name}"
             task_type: FIX
             issue: {failure_reason}
             parent_task: {current_implementation_task}

       INSERT fix tasks BEFORE current task
       UPDATE current task: state = TODO (will retry after fixes)

  4. TRANSLATE outputs to business terms:
     "95% code coverage, 147 unit tests pass" →
     "High-quality implementation validated"

     "3 integration tests fail" →
     "System integration issues detected - adding fix tasks"

  5. RETURN:
     - test_results (for validation report)
     - business_summary (for user display)

business_value:
  description: "Validates system works correctly and meets requirements"
  user_sees: "Testing complete: [validation status]"
  user_does_not_see: "Test code, coverage metrics, technical logs"

recursive_fix_pattern: |
  This subprocess enables the recursive execution pattern:

  Execute → Test → FAIL → Add Fix Tasks → Execute Fixes → Retest → PASS

  Example:
  1. deep-test finds 3 failures
  2. Executive Orchestrator injects 3 fix tasks
  3. deep-implement executes fixes
  4. deep-test retests
  5. IF pass: continue
     IF fail: REPEAT

integration_notes: |
  Deep-test is CRITICAL for quality assurance.
  Failures are NOT shown as errors to user, but as:
  "Tests detected issues. Fixing automatically..."

  User sees:
  - "✓ Testing complete - all validated" (if pass)
  - "Fixing detected issues..." (if fail, then auto-fix)

error_handlers:
  - missing_input
  - test_execution_error
  - timeout
  - resource_exhaustion
