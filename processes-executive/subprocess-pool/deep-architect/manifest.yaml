---
# Subprocess Adapter: deep-architect
# Wraps processes/deep-architect for Executive Orchestrator

subprocess_id: deep-architect
subprocess_name: "Architecture Design"
version: 1.4.1

purpose: "Design software architecture with adversarial validation"

# Reference to original process
original_process:
  location: ../../../processes/deep-architect
  manifest_file: manifest.yaml
  workflow_file: workflow.md

# Executive Orchestrator metadata
inputs_required:
  - requirements_document: "From deep-requirements subprocess"
  - constraints: "Technical constraints from goal-declaration"
  - goal: "Business goal to guide architecture decisions"

outputs_produced:
  - architecture_document: "Complete architecture specification"
  - component_diagram: "System decomposition"
  - architecture_decisions: "Key architectural decisions with rationale"
  - quality_attributes: "Performance, scalability, security targets"
  - deployment_model: "How system will be deployed"

estimated_duration: "2-4 hours"
complexity: HIGH

execution_pattern: |
  When invoked by Executive Orchestrator:

  1. LOAD inputs:
     - requirements.yaml (from deep-requirements)
     - constraints.yaml (from Phase 1)
     - goal (from goal-declaration.yaml)

  2. DELEGATE to original deep-architect process:
     EXECUTE: ../../../processes/deep-architect/workflow.md
     PROVIDE: requirements, constraints as inputs
     CAPTURE: all architecture artifacts

  3. EXTRACT critical decisions:
     IF architecture includes critical choices (database, framework, deployment):
       ESCALATE to user via decision-prompt template

  4. TRANSLATE outputs to business terms:
     "3-tier architecture with microservices" →
     "Scalable, maintainable system design"

  5. RETURN:
     - architecture.yaml (for next phase)
     - business_summary (for user display)

business_value:
  description: "Designs system structure that meets requirements and constraints"
  user_sees: "Architecture designed: [high-level structure, key decisions]"
  user_does_not_see: "Detailed architectural patterns, technical trade-offs analysis"

critical_decisions_handled:
  - database_choice: "PostgreSQL vs MongoDB vs other"
  - architecture_pattern: "Monolith vs Microservices vs Serverless"
  - api_style: "REST vs GraphQL"
  - deployment_target: "Cloud vs On-premise vs Hybrid"

integration_notes: |
  Deep-architect has USER CHECKPOINTS built-in.
  When running through Executive Orchestrator:
  - Checkpoints translated to executive-level decisions
  - User approves architecture before proceeding to implementation

error_handlers:
  - missing_input
  - invalid_input
  - partial_completion
  - user_checkpoint_failed
  - timeout
