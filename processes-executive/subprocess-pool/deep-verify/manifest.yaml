---
# Subprocess Adapter: deep-verify
# Wraps processes/deep-verify for Executive Orchestrator

subprocess_id: deep-verify
subprocess_name: "Verification & Compliance"
version: 1.0.0

purpose: "Verify system compliance with constraints and quality standards"

# Reference to original process
original_process:
  location: ../../../processes/deep-verify
  manifest_file: manifest.yaml
  workflow_file: workflow.md

# Executive Orchestrator metadata
inputs_required:
  - implementation_artifacts: "Complete system from deep-implement"
  - test_results: "From deep-test subprocess"
  - constraints: "Compliance, security, quality requirements"
  - architecture_document: "From deep-architect (for verification)"

outputs_produced:
  - verification_report: "Compliance status for each constraint"
  - violations: "List of violations (if any)"
  - recommendations: "Improvement recommendations"
  - compliance_score: "Overall compliance percentage"

estimated_duration: "30-60 minutes"
complexity: MEDIUM

execution_pattern: |
  When invoked by Executive Orchestrator:

  1. LOAD inputs:
     - implementation artifacts
     - test_results.yaml
     - constraints.yaml (GDPR, security, etc.)
     - architecture.yaml

  2. DELEGATE to original deep-verify process:
     EXECUTE: ../../../processes/deep-verify/workflow.md
     PROVIDE: all artifacts, constraints
     CAPTURE: verification results

  3. ANALYZE compliance:
     FOR EACH constraint:
       CHECK: Is constraint satisfied?
       CALCULATE: compliance_score

     IF compliance_score < 80%:
       ESCALATE to user:
         "Compliance issues detected:
          {list violations}

          Opcje:
          A) Fix issues (add tasks)
          B) Revise constraints
          C) Accept with risks"

     IF compliance_score >= 80%:
       PROCEED normally

  4. TRANSLATE outputs to business terms:
     "GDPR compliance: 95%" →
     "Data privacy requirements met"

     "Security vulnerabilities: 2 medium" →
     "Security hardening recommended"

  5. RETURN:
     - verification_report (for Phase 4 validation)
     - business_summary (for user display)

business_value:
  description: "Ensures system meets quality and compliance requirements"
  user_sees: "Verification complete: [compliance status]"
  user_does_not_see: "Technical verification details, code analysis results"

compliance_checks:
  - gdpr: "Data privacy, consent, right to deletion"
  - security: "Authentication, authorization, encryption"
  - quality: "Code quality, maintainability"
  - performance: "Response times, scalability"
  - accessibility: "WCAG compliance (if applicable)"

integration_notes: |
  Deep-verify runs AFTER deep-test passes.
  Acts as final quality gate before delivery.

  If violations found:
  - Critical: HALT, user decision required
  - Medium: Add fix tasks, continue
  - Low: Log as recommendations, continue

error_handlers:
  - missing_input
  - invalid_input
  - verification_tool_error
  - timeout
