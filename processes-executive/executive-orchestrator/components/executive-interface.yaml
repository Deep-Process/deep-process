---
# Component: Executive Interface
# Translates technical details to business-level communication

component_id: executive-interface
component_name: "Executive Interface"
version: 1.0.0
purpose: "Filter technical details and present information in business terms"

responsibilities:
  - Generate executive summaries
  - Format decision prompts for user
  - Create progress updates
  - Translate subprocess outputs to business value
  - Hide technical jargon
  - Enforce max 2-page rule

capabilities:
  generate_executive_summary:
    description: "Create business-level summary from technical artifacts"
    trigger: "Phase 5 (Deliver)"
    inputs:
      - goal
      - execution_log
      - deliverables
      - validation_report
      - decisions_made
    outputs:
      - executive_summary_content: markdown text
    template: templates/executive-summary.yaml
    procedure: |
      LOAD template: templates/executive-summary.yaml

      FILL sections:
        1. Goal & Outcome:
           - original_goal
           - achieved status
           - alignment_score

        2. What Was Done (Business Level):
           - Extract top 5 achievements by business impact
           - NO technical tasks, ONLY business outcomes
           - Example: "Created user management capability" not "Implemented UserService class"

        3. Key Decisions Made:
           - Filter to critical decisions only (max 3)
           - Format: "Decision → Choice → Impact"

        4. Deliverables Produced:
           - Business descriptions, NOT file paths
           - Group by: primary, supporting
           - Example: "User Dashboard: Displays user data and key metrics"

        5. Metrics:
           - Completion rate
           - Session duration
           - Alignment score
           - Decisions count

        6. Next Steps:
           - Optional enhancements if gaps accepted
           - Deployment status
           - "Project complete" if done

      VALIDATE:
        - Length <= 2 pages
        - No technical jargon
        - Business value clear

      RETURN: executive_summary_content

  format_decision_prompt:
    description: "Format critical decision for user approval"
    trigger: "Phase 3 when critical decision needed"
    inputs:
      - decision (from decision-points.yaml)
      - goal
      - current_context
    outputs:
      - decision_prompt: formatted text
    template: templates/decision-prompt.yaml
    procedure: |
      LOAD template: templates/decision-prompt.yaml

      FILL sections:
        Context:
          - Current phase
          - Goal reminder (ALWAYS)
          - Why decision needed (business rationale)

        Decision:
          - Question (business terms)
          - Criticality level
          - Options with pros/cons/impact

        Recommendation:
          - IF exists: present recommendation with rationale

        Impact on Goal:
          - How each option affects goal achievement

      VALIDATE:
        - No technical jargon
        - Options clear
        - Impact on goal explicit

      FORMAT: readable, scannable structure

      RETURN: decision_prompt

  create_progress_update:
    description: "Generate brief progress status update"
    trigger: "Phase 3 before each task execution"
    inputs:
      - goal
      - current_task
      - backlog_state
      - recent_completed_tasks
    outputs:
      - progress_update: formatted text
    template: templates/progress-update.yaml
    max_length: half_page
    procedure: |
      LOAD template: templates/progress-update.yaml

      FILL sections:
        Goal Reminder:
          - Display goal (ALWAYS)

        Current Status:
          - Phase: "3/5 (Execute)"
          - Completion: "{X}%"
          - Status: on_track | delayed | blocked

        Recent Work:
          - Last 3 completed tasks
          - Business-level description

        In Progress:
          - Current task name
          - Purpose (how it serves goal)
          - Estimated completion

        Next Milestone:
          - Identify next significant milestone

      VALIDATE:
        - Max half page
        - Readable in 30 seconds
        - Goal visible

      RETURN: progress_update

  translate_subprocess_output:
    description: "Translate technical subprocess output to business summary"
    trigger: "Phase 3 after subprocess execution"
    inputs:
      - subprocess_name
      - subprocess_technical_output
      - subprocess_artifacts
      - subprocess_decisions
    outputs:
      - business_summary: text
    procedure: |
      EXTRACT from technical output:
        - Key achievements (what was done)
        - Critical decisions made
        - Artifacts produced

      TRANSLATE to business terms:
        FOR EACH achievement:
          NOT: "Implemented class X with methods Y, Z"
          BUT: "Created capability to {business function}"

        FOR EACH artifact:
          NOT: "src/components/UserDashboard.tsx (452 lines)"
          BUT: "User Dashboard: {what it does, why it matters}"

        FOR EACH decision:
          IF criticality HIGH:
            INCLUDE: decision + business impact
          ELSE:
            HIDE: (logged but not displayed)

      FORMAT business summary:
        "✓ {subprocess_name} complete.

         Osiągnięcia:
         - {achievement_1 in business terms}
         - {achievement_2 in business terms}

         Wytworzone:
         - {artifact_1 - what it is, why it matters}

         {IF critical decisions:
           Decyzje techniczne:
           - {decision_1 - business impact}
         }"

      VALIDATE:
        - No code snippets
        - No technical jargon
        - Value proposition clear

      LOG technical details (hidden):
        APPEND to execution_log:
          subprocess: {name}
          technical_output: {full output}
          artifacts: {technical details}

      RETURN: business_summary

  enforce_communication_rules:
    description: "Validate all user-facing content against rules"
    trigger: "Before displaying anything to user"
    inputs:
      - content: text to validate
      - content_type: summary | decision | progress | other
    outputs:
      - validated_content: text
      - violations: array (if any)
    rules:
      - rule: no_technical_jargon
        check: content does NOT contain [class, method, function, API endpoint, etc.]
        action: REWRITE without jargon

      - rule: max_length
        check: |
          IF content_type = summary: length <= 2 pages
          IF content_type = progress: length <= half page
        action: CONDENSE OR split into sections

      - rule: goal_visibility
        check: |
          IF content_type IN [decision, progress]:
            content MUST contain goal reminder
        action: ADD goal reminder

      - rule: business_value_clear
        check: Each statement has clear business value proposition
        action: REWRITE to clarify value

      - rule: no_code_dumps
        check: content does NOT contain code blocks or file contents
        action: REMOVE OR replace with description

forbidden_patterns:
  - pattern: "class UserService"
    instead: "user management capability"

  - pattern: "API endpoint /api/users"
    instead: "user data access"

  - pattern: "PostgreSQL database with 5 tables"
    instead: "data storage system"

  - pattern: "React component with useState hook"
    instead: "interactive user interface"

  - pattern: "152 lines of code"
    instead: "comprehensive implementation"

translation_examples:
  technical_to_business:
    - technical: "Implemented UserRepository with CRUD operations"
      business: "Created user data management capability"

    - technical: "Added JWT authentication middleware"
      business: "Secured system with user authentication"

    - technical: "Wrote 47 unit tests covering 95% of codebase"
      business: "Validated system quality with comprehensive testing"

    - technical: "Deployed to AWS EC2 with Docker containers"
      business: "System deployed and ready for use"

    - technical: "Refactored AuthService to use dependency injection"
      business: "Improved system maintainability"

data_structures:
  forbidden_terms:
    - class
    - method
    - function
    - API
    - endpoint
    - repository
    - service
    - controller
    - middleware
    - hook
    - component
    - interface
    - implementation
    - refactor
    - dependency injection

  business_alternatives:
    class/method/function: "capability"
    API/endpoint: "access point"
    repository/service: "management system"
    component: "interface element"
    refactor: "improvement"
    test: "validation"
    deploy: "make available"

integration_points:
  - phase-03-execute.md: section 2 (DISPLAY_PROGRESS_UPDATE), section_execute_subprocess
  - phase-05-deliver.md: section 2 (GENERATE_EXECUTIVE_SUMMARY)
  - workflow.md: all user-facing communication

usage_pattern: |
  Phase 3 (Execute):
    BEFORE task:
      INVOKE: create_progress_update()
      DISPLAY: progress_update

    AFTER subprocess:
      INVOKE: translate_subprocess_output()
      DISPLAY: business_summary (NOT technical output)

  Phase 5 (Deliver):
    INVOKE: generate_executive_summary()
    VALIDATE: enforce_communication_rules()
    DISPLAY: executive_summary

  Anytime decision needed:
    INVOKE: format_decision_prompt()
    DISPLAY: decision_prompt

compliance:
  guideline_9_executive_language: "All communication uses imperative verbs, business terms"
  guideline_10_visible_reasoning: "Summaries show what was done and why"
  guideline_13_zero_decorations: "Only essential business information, no technical fluff"

violation_handling: |
  IF technical detail leaks to user:
    HALT
    OUTPUT: "VIOLATION: Technical details should be hidden from user"
    SUPPRESS technical output
    SHOW only business summary

methods_applied:
  - method_071: "First Principles Analysis - identify core business value"
  - method_152: "Socratic Decomposition - break down technical to business concepts"
