---
# Component: Backlog Manager
# Manages dynamic backlog with task injection and recursive execution

component_id: backlog-manager
component_name: "Backlog Manager"
version: 1.0.0
purpose: "Manage task backlog dynamically with recursive execution support"

responsibilities:
  - Create initial backlog from execution plan
  - Select next eligible task
  - Update task states
  - Inject new tasks dynamically (recursive fixes)
  - Handle dependencies
  - Detect deadlocks
  - Calculate progress

capabilities:
  create_backlog:
    description: "Create initial backlog from execution plan"
    trigger: "Phase 2 (Plan)"
    inputs:
      - execution_plan (phases, dependencies)
    outputs:
      - backlog.yaml
    procedure: |
      LOAD: execution-plan.yaml

      INITIALIZE: backlog = []

      FOR EACH phase IN execution_plan (in dependency order):
        CREATE task:
          task_id: {generate_task_id}
          task_name: "Execute {phase.name}"
          task_type: SUBPROCESS_INVOCATION
          subprocess: {phase.subprocess}
          inputs_needed: {phase.inputs}
          outputs_produced: {phase.outputs}
          dependencies: {phase.dependencies}
          state: TODO
          estimated_effort: {phase.duration_estimate}
          metadata:
            phase_id: {phase.id}
            criticality: {CRITICAL if no alternatives, HIGH otherwise}
            on_critical_path: {boolean}

        ADD task to backlog

      ADD integration tasks:
        FOR EACH adjacent phase pair (A, B):
          IF A.outputs NOT match B.inputs:
            CREATE integration_task
            INSERT between A and B

      ADD validation tasks:
        FOR EACH phase:
          CREATE validation_task
          INSERT after phase

      CALCULATE: critical_path

      SAVE: backlog.yaml

  select_next_task:
    description: "Select next eligible task to execute"
    trigger: "Phase 3 main loop"
    inputs:
      - backlog (current state)
    outputs:
      - selected_task OR null
    procedure: |
      FILTER tasks:
        eligible = tasks WHERE:
          - state = TODO
          - ALL dependencies IN [DONE]
          - NOT blocked

      IF eligible is empty:
        CHECK for blocked tasks:
          IF remaining tasks > 0:
            RETURN: null (deadlock detected)
          ELSE:
            RETURN: null (all done)

      PRIORITIZE eligible tasks:
        SORT by:
          1. criticality DESC
          2. on_critical_path DESC
          3. dependencies_count ASC

      SELECT: first task from sorted list

      RETURN: selected_task

  update_task_state:
    description: "Update task state with validation"
    trigger: "During task execution"
    inputs:
      - task_id
      - new_state
      - optional: blocker, validation_result, outputs
    outputs:
      - backlog updated
    state_transitions:
      TODO: [IN_PROGRESS, BLOCKED, CANCELLED]
      IN_PROGRESS: [DONE, BLOCKED, TODO]
      BLOCKED: [TODO, SKIPPED, CANCELLED]
      DONE: []
      SKIPPED: []
      CANCELLED: []
    procedure: |
      LOAD: backlog.yaml

      FIND: task WHERE task_id = {task_id}

      VALIDATE transition:
        IF new_state NOT IN allowed_transitions[task.state]:
          ERROR: "Invalid state transition: {task.state} → {new_state}"
          HALT

      UPDATE: task.state = new_state

      IF new_state = BLOCKED:
        REQUIRE: blocker provided
        SET: task.blocker = {blocker}

      IF new_state = DONE:
        SET: task.completed_at = {now}
        IF outputs provided:
          SET: task.outputs_produced = {outputs}

      SAVE: backlog.yaml

      RETURN: success

  inject_task:
    description: "Dynamically inject new task into backlog"
    trigger: "Test fail, gap identified, or user adds requirement"
    inputs:
      - task_definition
      - insertion_point (BEFORE task_id OR AFTER task_id OR END)
      - priority
    outputs:
      - task_id (of new task)
      - backlog updated
    procedure: |
      LOAD: backlog.yaml

      VALIDATE task_definition:
        REQUIRE: task_name, task_type, state=TODO

      GENERATE: task_id = "task-{next_number}"

      CREATE: new_task with all fields

      IF priority = HIGH:
        SET: metadata.criticality = HIGH

      INSERT based on insertion_point:
        IF BEFORE {task_id}:
          FIND position of {task_id}
          INSERT new_task BEFORE
          UPDATE dependencies: {task_id} now depends on new_task

        IF AFTER {task_id}:
          FIND position of {task_id}
          INSERT new_task AFTER
          SET: new_task.dependencies = [{task_id}]

        IF END:
          APPEND new_task to backlog

      RECALCULATE: statistics, critical_path if needed

      SAVE: backlog.yaml

      LOG: "Task injected: {task_name} at {insertion_point}"

      RETURN: task_id

  handle_test_failure:
    description: "Recursive fix: test fails → add fix task → retry"
    trigger: "Phase 3 when subprocess returns test failures"
    inputs:
      - failed_tests: array of test failures
      - original_task_id
    outputs:
      - fix_tasks: array of task_ids
    procedure: |
      FOR EACH failed_test:
        CREATE fix_task:
          task_name: "Fix test: {failed_test.name}"
          task_type: FIX
          parent_task: {original_task_id}
          issue: {failed_test.error}
          state: TODO
          estimated_effort: "30 minutes"
          metadata:
            criticality: HIGH
            parent_task: {original_task_id}

        INVOKE: inject_task(fix_task, BEFORE {original_task_id}, HIGH)

      UPDATE original_task:
        SET: state = TODO (will retry after fixes)
        ADD to dependencies: all fix_task_ids

      DISPLAY to user (business terms):
        "Tests failed. Adding fix tasks to backlog.
         Will retest after fixes complete."

      RETURN: fix_tasks

  detect_deadlock:
    description: "Detect circular dependencies or blocked state"
    trigger: "When select_next_task returns null but tasks remain"
    inputs:
      - backlog
    outputs:
      - deadlock_detected: boolean
      - deadlock_type: CIRCULAR | COMMON_BLOCKER
      - resolution_options: array
    procedure: |
      CHECK 1: Circular dependencies
        RUN: topological_sort(backlog.tasks.dependencies)
        IF cycle detected:
          deadlock_type = CIRCULAR
          IDENTIFY: tasks in cycle
          RETURN options: [break_dependency, merge_tasks, cancel]

      CHECK 2: Common blocker
        FIND: tasks WHERE state = BLOCKED
        IF all remaining tasks blocked by same issue:
          deadlock_type = COMMON_BLOCKER
          IDENTIFY: root blocker
          RETURN options: [resolve_blocker, skip_tasks, cancel]

      IF no deadlock pattern found:
        deadlock_type = UNKNOWN
        ESCALATE to user: "Need manual intervention"

  calculate_progress:
    description: "Calculate completion percentage"
    trigger: "Before each progress update"
    inputs:
      - backlog
    outputs:
      - progress_pct: number
      - remaining_tasks: number
      - completed_tasks: number
    procedure: |
      LOAD: backlog.yaml

      total_tasks = COUNT all tasks
      completed = COUNT WHERE state = DONE
      skipped = COUNT WHERE state = SKIPPED
      in_progress = COUNT WHERE state = IN_PROGRESS
      remaining = COUNT WHERE state IN [TODO, BLOCKED]

      progress_pct = ((completed + skipped) / total_tasks) * 100

      RETURN:
        progress_pct: {pct}
        remaining_tasks: {remaining}
        completed_tasks: {completed}

  rebuild_backlog:
    description: "Rebuild backlog when goal changes mid-execution"
    trigger: "Phase 3 when user changes direction"
    inputs:
      - new_goal
      - current_backlog
      - current_execution_log
    outputs:
      - updated_backlog.yaml
      - reusable_tasks: array
      - discarded_tasks: array
      - new_tasks: array
    procedure: |
      ANALYZE impact:
        COMPARE: new_goal vs current_goal

        IDENTIFY reusable tasks:
          FOR EACH task WHERE state IN [DONE, IN_PROGRESS]:
            IF task output serves new_goal:
              MARK as reusable
            ELSE:
              MARK as discard candidate

        IDENTIFY tasks to discard:
          FOR EACH task WHERE state = TODO:
            IF task does NOT serve new_goal:
              MARK for discard

        IDENTIFY new tasks needed:
          DECOMPOSE new_goal into phases
          FOR EACH phase NOT covered by reusable:
            CREATE new_task

      UPDATE backlog:
        KEEP: reusable_tasks (preserve state)
        CANCEL: discarded_tasks (set state = CANCELLED)
        ADD: new_tasks (state = TODO)

      RECALCULATE: dependencies, critical_path

      SAVE: backlog.yaml

      DISPLAY to user:
        "Backlog updated for new goal.
         Reusable: {count} tasks
         Discarded: {count} tasks
         New: {count} tasks"

      RETURN: updated_backlog

data_structures:
  task_schema:
    task_id: string
    task_name: string
    task_type: enum
    state: enum
    dependencies: array
    estimated_effort: string
    subprocess: string (optional)
    inputs_needed: array
    outputs_produced: array
    metadata: object
    blocker: string (optional)
    validation_result: enum (optional)
    completed_at: timestamp (optional)

  backlog_schema:
    backlog_id: uuid
    created_at: timestamp
    tasks: array
    statistics: object
    critical_path: array

state_tracking:
  file: state/backlog.yaml
  update_frequency: after_each_task_state_change
  validation: schemas/backlog-schema.yaml

integration_points:
  - phase-02-plan.md: section 4 (BUILD_BACKLOG)
  - phase-03-execute.md: section 1 (SELECT_NEXT_TASK), section 4 (HANDLE_RESULT)
  - phase-03-execute.md: section_handle_direction_change

usage_pattern: |
  Phase 2 (Plan):
    INVOKE: create_backlog(execution_plan)

  Phase 3 (Execute):
    LOOP:
      task = select_next_task()
      IF task is null:
        CHECK: detect_deadlock()

      EXECUTE task

      IF test_failure:
        INVOKE: handle_test_failure()

      UPDATE: update_task_state()

      progress = calculate_progress()
      DISPLAY: progress

  Phase 3 (Direction change):
    INVOKE: rebuild_backlog(new_goal, current_backlog)

error_handling:
  circular_dependency:
    detection: topological_sort fails
    action: HALT planning, escalate to user

  invalid_state_transition:
    detection: transition not allowed
    action: HALT, display error, allow correction

  deadlock:
    detection: no eligible tasks but remaining > 0
    action: INVOKE detect_deadlock(), present options to user

compliance:
  guideline_4_binding_gates: "Backlog completeness enforced at GATE_2"
  guideline_6_enforced_sequence: "Dependencies enforce execution order"
  guideline_10_visible_reasoning: "Task states and progress visible"

methods_applied:
  - method_152: "Socratic Decomposition - break execution into tasks"
  - method_083: "Closure Check - verify all dependencies exist"
  - method_084: "Coherence Check - verify state transitions valid"

recursive_execution_example: |
  # Test failure triggers recursive fix

  1. Execute task: "deep-test subprocess"
  2. Result: 3 tests fail
  3. INVOKE: handle_test_failure([test_1, test_2, test_3], "task-015")
  4. Creates:
     - task-016: "Fix test: user_authentication_test"
     - task-017: "Fix test: data_validation_test"
     - task-018: "Fix test: api_integration_test"
  5. Inserts BEFORE task-015
  6. Updates task-015 dependencies: [task-016, task-017, task-018]
  7. Continue execution: fix tasks → retest
  8. IF tests pass: task-015 DONE
  9. IF tests still fail: REPEAT (recursive)
