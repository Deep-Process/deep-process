---
# Component: State Manager
# Handles state persistence, snapshots, and session resumption

component_id: state-manager
component_name: "State Manager"
version: 1.0.0
purpose: "Manage session state, snapshots, and resumption for continuity"

responsibilities:
  - Save state snapshots after each task
  - Create session archives
  - Load previous sessions
  - Handle resume protocol
  - Manage current-session.yaml
  - Track session history

capabilities:
  save_snapshot:
    description: "Save current state snapshot"
    trigger: "After each task completion OR before critical decision OR on error"
    inputs:
      - current_phase
      - goal
      - backlog_state
      - execution_log
      - last_completed_task
      - next_action
    outputs:
      - snapshot_file: state/snapshots/snapshot-{timestamp}.yaml
      - current_session_updated: state/current-session.yaml
    procedure: |
      CREATE snapshot:
        snapshot_id: {generate_uuid}
        timestamp: {now}
        current_phase: {phase}
        goal: {goal}
        completion_percentage: {calculate}
        backlog_state: {current backlog}
        execution_log: {log since last snapshot}
        last_completed_task: {task details}
        next_action: {describe next task}

      SAVE to: state/snapshots/snapshot-{timestamp}.yaml

      UPDATE: state/current-session.yaml with latest snapshot reference

  load_last_session:
    description: "Load last saved session"
    trigger: "On /executive invocation IF current-session.yaml EXISTS"
    inputs:
      - none (loads from state/current-session.yaml)
    outputs:
      - session_data: complete session state
      - resume_point: which phase/section to resume
    procedure: |
      CHECK: state/current-session.yaml EXISTS

      IF NOT EXISTS:
        RETURN: null (no previous session)

      LOAD: current-session.yaml
      EXTRACT: last_snapshot_id

      LOAD: state/snapshots/{last_snapshot_id}.yaml
      EXTRACT all state:
        - current_phase
        - goal
        - backlog_state
        - completion_percentage
        - next_action

      RETURN: session_data

  archive_session:
    description: "Archive completed session"
    trigger: "On session completion (Phase 5)"
    inputs:
      - session_id
      - all_state_files
    outputs:
      - archive: state/archives/session-{session_id}.tar.gz
    procedure: |
      COLLECT all state files:
        - goal-declaration.yaml
        - constraints.yaml
        - execution-plan.yaml
        - backlog.yaml
        - execution-log.yaml
        - validation-report.yaml
        - session-complete.yaml
        - snapshots/

      COMPRESS to: state/archives/session-{session_id}.tar.gz

      UPDATE: state/session-history.yaml
        ADD entry:
          session_id: {id}
          goal: {goal}
          completed_at: {timestamp}
          archive_location: {path}
          alignment_score: {score}

  resume_session:
    description: "Resume from saved session"
    trigger: "User confirms resume in Phase 1"
    inputs:
      - session_data (from load_last_session)
    outputs:
      - restored_state: all state restored
      - resume_phase: which phase to jump to
    procedure: |
      RESTORE state:
        LOAD: all artifacts from session_data
        RESTORE: goal, constraints, backlog, execution_log

      IDENTIFY resume point:
        resume_phase = session_data.current_phase
        resume_section = session_data.next_action

      DISPLAY to user:
        "✓ Session resumed
         Cel: {goal}
         Faza: {current_phase}
         Następny krok: {next_action}"

      JUMP to: {resume_phase}.md at {resume_section}

  clear_session:
    description: "Clear current session (start fresh)"
    trigger: "User chooses new session OR session cancelled"
    inputs:
      - session_id (to archive)
    outputs:
      - session_cleared: boolean
    procedure: |
      IF session_id provided:
        ARCHIVE: current session

      CLEAR: state/current-session.yaml
      RESET: all state variables

      MARK: ready for new session

data_structures:
  snapshot_schema:
    snapshot_id: uuid
    timestamp: ISO8601
    current_phase: string
    goal: string
    completion_percentage: number
    backlog_state: object
    execution_log: array
    last_completed_task: object
    next_action: string

  current_session_schema:
    last_session_id: uuid
    status: enum [ACTIVE, COMPLETE, PAUSED, CANCELLED]
    last_snapshot_id: uuid
    goal: string
    current_phase: string
    completion_percentage: number
    next_action: string
    updated_at: ISO8601

  session_history_schema:
    sessions:
      - session_id: uuid
        goal: string
        started_at: ISO8601
        completed_at: ISO8601
        archive_location: string
        alignment_score: number
        status: enum

state_locations:
  snapshots: state/snapshots/
  current_session: state/current-session.yaml
  archives: state/archives/
  history: state/session-history.yaml

error_handling:
  corrupted_snapshot:
    action: "Load previous valid snapshot, warn user"
    fallback: "Start new session if no valid snapshot"

  missing_state_file:
    action: "Reconstruct from snapshots OR start fresh"
    escalate: "Warn user about data loss"

  archive_failure:
    action: "Retry with backup location"
    fallback: "Keep uncompressed files, warn user"

integration_points:
  - phase-01-intake.md: section_resume, section_new
  - phase-03-execute.md: section 5 (SAVE_STATE_SNAPSHOT)
  - phase-05-deliver.md: section 4 (SAVE_SESSION_STATE)

usage_pattern: |
  Phase 1 (Intake):
    INVOKE: load_last_session()
    IF session exists:
      DISPLAY: resume prompt
      IF user confirms:
        INVOKE: resume_session()

  Phase 3 (Execute):
    AFTER each task:
      INVOKE: save_snapshot()

  Phase 5 (Deliver):
    AFTER packaging:
      INVOKE: archive_session()
      INVOKE: clear_session() OR keep for enhancement

compliance:
  guideline_1_self_contained: "Each snapshot is self-contained"
  guideline_11_instruction_plus_min_data: "Snapshots contain only essential state"
  guideline_12_info_at_moment_of_use: "State loaded just-in-time when needed"

methods_applied:
  - method_167: "Baseline Census - track all state artifacts"
  - method_152: "Socratic Decomposition - break state into manageable pieces"
