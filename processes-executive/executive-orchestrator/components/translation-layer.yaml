---
# Component: Translation Layer
# Bidirectional translation between business and technical domains

component_id: translation-layer
component_name: "Translation Layer"
version: 1.0.0
purpose: "Translate between business requirements and technical execution"

responsibilities:
  - Translate business goals to technical requirements
  - Translate technical outputs to business value
  - Map user constraints to technical constraints
  - Convert technical decisions to business impact
  - Maintain glossary of translations

capabilities:
  goal_to_requirements:
    description: "Translate business goal to technical requirements"
    trigger: "Phase 2 (Plan) decomposition"
    inputs:
      - goal (business terms)
      - constraints (budget, timeline, compliance, tech)
    outputs:
      - technical_requirements: array
      - phases_needed: array
      - subprocesses_to_invoke: array
    procedure: |
      PARSE goal statement:
        EXTRACT: action verbs (stworzyć, zbudować, etc.)
        EXTRACT: target artifact (system, aplikacja, API, etc.)
        EXTRACT: domain context (CRM, e-commerce, etc.)
        EXTRACT: target audience (mała firma, users, etc.)

      MAP to technical requirements:

        IF goal contains ["system", "aplikacja", "program"]:
          requirement_type = SOFTWARE_DEVELOPMENT
          phases = [requirements, architecture, implementation, testing, deployment]

        IF goal contains ["API", "interface"]:
          requirement_type = API_DEVELOPMENT
          phases = [specification, design, implementation, testing]

        IF goal contains ["analiza", "research"]:
          requirement_type = ANALYSIS
          phases = [data_collection, analysis, reporting]

        IF goal contains ["migrate", "refactor"]:
          requirement_type = MIGRATION
          phases = [assessment, planning, migration, validation]

      MAP constraints to technical constraints:

        IF constraints.compliance contains "GDPR":
          ADD technical_requirement: "data_privacy_compliance"
          ADD phase: "compliance_validation"

        IF constraints.timeline = TIGHT:
          ADD technical_constraint: "parallel_execution_preferred"
          ADJUST: phase_estimates *= 0.8

        IF constraints.budget = MINIMAL:
          ADD technical_constraint: "use_open_source"
          REMOVE: expensive_subprocesses

      IDENTIFY subprocesses needed:
        FOR EACH phase:
          MAP phase_name → subprocess_name
          ADD to subprocesses_to_invoke

      RETURN:
        technical_requirements: [{requirements}]
        phases_needed: [{phases}]
        subprocesses_to_invoke: [{subprocesses}]

  output_to_business_value:
    description: "Translate technical output to business value proposition"
    trigger: "Phase 3 after subprocess execution"
    inputs:
      - technical_artifact (code, config, test results, etc.)
      - artifact_type
      - original_goal
    outputs:
      - business_description: string
      - value_proposition: string
    translation_rules:
      code:
        rule: "Focus on capability, not implementation"
        examples:
          - technical: "UserService.java with CRUD methods"
            business: "User management capability"
          - technical: "AuthController with JWT tokens"
            business: "Secure user authentication"

      architecture:
        rule: "Focus on qualities, not structure"
        examples:
          - technical: "3-tier architecture with microservices"
            business: "Scalable, maintainable system design"
          - technical: "Event-driven architecture with message queue"
            business: "Responsive system with reliable processing"

      tests:
        rule: "Focus on confidence, not coverage"
        examples:
          - technical: "95% code coverage, 147 unit tests"
            business: "High-quality implementation with validated behavior"
          - technical: "Integration tests pass"
            business: "System components work together correctly"

      deployment:
        rule: "Focus on readiness, not infrastructure"
        examples:
          - technical: "Deployed to AWS EC2 with Docker"
            business: "System live and ready for use"
          - technical: "CI/CD pipeline configured"
            business: "Automated deployment process in place"

    procedure: |
      IDENTIFY: artifact_type from technical_artifact

      APPLY translation_rule for artifact_type

      EXTRACT business_description:
        REMOVE: technical terms
        FOCUS: what capability this provides
        RELATE: to original goal

      EXTRACT value_proposition:
        ANSWER: "Why does this matter for the goal?"
        FORMAT: "This enables {business_capability}"

      RETURN:
        business_description: {description}
        value_proposition: {value}

  decision_to_impact:
    description: "Translate technical decision to business impact"
    trigger: "Phase 3 when critical decision needed"
    inputs:
      - decision (technical question and options)
      - goal
    outputs:
      - business_question: string
      - options_with_business_impact: array
    procedure: |
      TRANSLATE decision question:

        TECHNICAL: "Choose database: PostgreSQL vs MongoDB"
        BUSINESS: "How should we store data?"

        TECHNICAL: "Monolith vs Microservices architecture"
        BUSINESS: "How should system be structured for growth?"

        TECHNICAL: "REST API vs GraphQL"
        BUSINESS: "How should external systems integrate?"

      FOR EACH technical option:
        TRANSLATE to business terms:

          EXTRACT pros → business benefits
          EXTRACT cons → business risks

        EXAMPLE:
          TECHNICAL option: "PostgreSQL"
            Pros: ACID compliance, strong consistency
            Cons: Vertical scaling, schema rigidity

          BUSINESS option: "PostgreSQL (relational database)"
            Benefits:
              - Data integrity guaranteed
              - Reliable for financial/critical data
            Risks:
              - May need powerful server as data grows
              - Schema changes require planning

      CALCULATE impact on goal:
        FOR EACH option:
          ANALYZE: how this option affects goal achievement
          SCORE: alignment with constraints

      FORMAT: business_question with options

      RETURN:
        business_question: {question}
        options_with_business_impact: [{options}]

  constraint_mapping:
    description: "Map business constraints to technical constraints"
    trigger: "Phase 2 (Plan)"
    inputs:
      - constraints (from constraints.yaml)
    outputs:
      - technical_constraints: object
    mappings:
      budget:
        "nieokreślony": {}
        "minimal":
          - prefer_open_source: true
          - avoid_paid_services: true
          - simple_architecture: true
        "reasonable":
          - balance_cost_quality: true
        "flexible":
          - optimize_for_quality: true

      timeline:
        "nieokreślony": {}
        "tight":
          - parallel_execution: true
          - reduce_scope: consider
          - fast_tools: prefer
        "X miesiące":
          - plan_by_milestone: true
          - buffer: 20%

      compliance:
        "GDPR":
          - data_privacy: mandatory
          - audit_logging: required
          - user_consent: required
        "HIPAA":
          - healthcare_privacy: mandatory
          - encryption: required
        "SOC2":
          - security_controls: mandatory

      technology:
        "wybór techniczny":
          - technical_freedom: true
        specific_tech:
          - use_specified: mandatory
          - justify_deviations: required

    procedure: |
      technical_constraints = {}

      FOR EACH constraint_type IN [budget, timeline, compliance, technology]:
        constraint_value = constraints[constraint_type]

        IF mappings[constraint_type][constraint_value] EXISTS:
          technical_constraints[constraint_type] = mappings[constraint_type][constraint_value]

      RETURN: technical_constraints

glossary:
  business_to_technical:
    "stworzyć system": "implement software system"
    "zarządzanie": "CRUD operations + business logic"
    "bezpieczeństwo": "authentication + authorization + encryption"
    "wydajność": "performance optimization + caching"
    "skalowalność": "horizontal scaling + load balancing"
    "niezawodność": "error handling + monitoring + backup"
    "łatwe użycie": "UX design + intuitive interface"
    "integracja": "API + data exchange"
    "raportowanie": "data aggregation + visualization"
    "automatyzacja": "scripting + scheduling + workflows"

  technical_to_business:
    "class/method/function": "capability"
    "API/endpoint": "data access point"
    "database": "data storage"
    "authentication": "user identity verification"
    "authorization": "access control"
    "cache": "speed optimization"
    "load balancer": "traffic distribution"
    "microservice": "independent component"
    "event bus": "communication system"
    "CI/CD": "automated delivery"
    "container": "isolated runtime environment"
    "test": "quality validation"
    "refactor": "code improvement"
    "deploy": "make available"
    "repository": "data management"

  forbidden_in_business_communication:
    - class
    - method
    - function
    - variable
    - algorithm
    - data structure
    - pointer
    - reference
    - polymorphism
    - inheritance
    - dependency injection
    - singleton pattern
    - factory pattern
    - REST/SOAP/GraphQL (use "API" instead)
    - JSON/XML (use "data format" instead)
    - SQL/NoSQL (use "database" instead)

translation_patterns:
  pattern_1_capability_focus:
    rule: "Instead of 'implemented X', say 'created capability to Y'"
    examples:
      - technical: "Implemented UserRepository class"
        business: "Created capability to manage user data"
      - technical: "Added JWT middleware"
        business: "Added user authentication"

  pattern_2_value_focus:
    rule: "Instead of 'built X', say 'enabled Y'"
    examples:
      - technical: "Built caching layer"
        business: "Enabled faster response times"
      - technical: "Built notification service"
        business: "Enabled user alerts"

  pattern_3_outcome_focus:
    rule: "Instead of 'configured X', say 'ensured Y'"
    examples:
      - technical: "Configured backup system"
        business: "Ensured data safety"
      - technical: "Configured monitoring"
        business: "Ensured system health tracking"

  pattern_4_impact_focus:
    rule: "Instead of 'used X', say 'provides Y'"
    examples:
      - technical: "Used PostgreSQL database"
        business: "Provides reliable data storage"
      - technical: "Used React framework"
        business: "Provides modern user interface"

validation:
  validate_translation:
    description: "Validate that translation maintains meaning without technical jargon"
    inputs:
      - original: technical text
      - translated: business text
    outputs:
      - valid: boolean
      - violations: array
    checks:
      - check: translated does NOT contain forbidden_terms
        error: "Contains technical jargon"

      - check: translated conveys same core meaning as original
        error: "Lost essential information"

      - check: translated adds business context
        error: "Missing 'why it matters'"

      - check: length_increase <= 50%
        error: "Translation too verbose"

integration_points:
  - phase-02-plan.md: section 2 (DECOMPOSE_INTO_PHASES) - goal_to_requirements
  - phase-03-execute.md: section_execute_subprocess - output_to_business_value
  - phase-03-execute.md: section_handle_critical_decision - decision_to_impact
  - executive-interface component: uses glossary for all translations

usage_pattern: |
  Phase 2 (Plan):
    INVOKE: goal_to_requirements(goal, constraints)
    RECEIVE: technical_requirements, phases, subprocesses
    USE: to build execution plan

  Phase 3 (Execute):
    AFTER subprocess:
      INVOKE: output_to_business_value(subprocess_output)
      RECEIVE: business_description
      DISPLAY: to user (hide technical output)

    WHEN decision needed:
      INVOKE: decision_to_impact(technical_decision, goal)
      RECEIVE: business_question with impact
      PRESENT: to user for approval

compliance:
  guideline_9_executive_language: "All translations use business terms"
  guideline_13_zero_decorations: "Only essential meaning preserved, no technical decoration"

methods_applied:
  - method_071: "First Principles Analysis - identify core meaning beyond jargon"
  - method_152: "Socratic Decomposition - break down concepts to fundamental value"

examples:
  full_translation_flow:
    input_goal: "Chcę stworzyć system CRM dla małej firmy"

    step_1_goal_to_requirements:
      technical_requirements:
        - "Implement user management module"
        - "Implement contact management module"
        - "Implement interaction tracking"
        - "Implement reporting dashboard"
      phases:
        - "requirements gathering"
        - "architecture design"
        - "implementation"
        - "testing"
        - "deployment"
      subprocesses:
        - "deep-requirements"
        - "deep-architect"
        - "deep-implement"
        - "deep-test"
        - "deep-deploy"

    step_2_output_to_business_value:
      technical_output: "UserModule.java with CRUD operations, authentication"
      business_description: "User management capability"
      value_proposition: "Enables tracking who uses the system and their permissions"

    step_3_decision_to_impact:
      technical_decision:
        question: "Database choice: PostgreSQL vs MongoDB"
        options:
          - PostgreSQL: ACID, relational
          - MongoDB: NoSQL, flexible schema
      business_question: "How should we store customer data?"
      business_options:
        - option: "Relational database (PostgreSQL)"
          benefits:
            - "Data integrity guaranteed"
            - "Good for structured customer records"
          risks:
            - "Schema changes need planning"
        - option: "Document database (MongoDB)"
          benefits:
            - "Flexible data structure"
            - "Easy to add new fields"
          risks:
            - "Less strict data validation"
