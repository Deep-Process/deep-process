---
# Schema for session-complete.yaml (Phase 5 output)
schema_id: session-complete
version: 1.0.0
purpose: Enforce structure for completed session state

required_fields:
  - session_id
  - status
  - timestamp
  - goal
  - execution_summary
  - deliverables
  - validation
  - key_decisions
  - metadata

structure:
  session_id:
    type: uuid
    description: "Unique session identifier"

  status:
    type: enum
    allowed_values:
      - COMPLETE
      - PARTIAL
      - CANCELLED
    description: "Session completion status"

  timestamp:
    type: timestamp
    format: ISO8601
    description: "When session was completed"

  goal:
    type: object
    required_fields:
      - statement
      - declared_at
      - achieved
      - alignment_score
    structure:
      statement:
        type: string
        description: "Original goal statement"
      declared_at:
        type: timestamp
        description: "When goal was declared"
      achieved:
        type: enum
        allowed_values:
          - YES
          - MOSTLY
          - PARTIALLY
          - NO
        description: "Goal achievement status"
      alignment_score:
        type: number
        min: 0
        max: 1
        description: "Final alignment score from validation"

  execution_summary:
    type: object
    required_fields:
      - phases_completed
      - total_tasks
      - completed_tasks
      - skipped_tasks
      - completion_rate
      - session_duration
      - start_time
      - end_time
    structure:
      phases_completed:
        type: integer
        min: 1
        max: 5
        description: "Number of phases completed (out of 5)"
      total_tasks:
        type: integer
        min: 0
      completed_tasks:
        type: integer
        min: 0
      skipped_tasks:
        type: integer
        min: 0
      completion_rate:
        type: number
        min: 0
        max: 100
        description: "Percentage of tasks completed"
      session_duration:
        type: string
        description: "Total session duration (e.g., '4 hours 23 minutes')"
      start_time:
        type: timestamp
      end_time:
        type: timestamp

  deliverables:
    type: object
    required_fields:
      - package_location
      - primary_count
      - supporting_count
    optional_fields:
      - primary_list
      - supporting_list
    structure:
      package_location:
        type: string
        description: "Path to deliverables package"
      primary_count:
        type: integer
        min: 0
        description: "Number of primary deliverables"
      supporting_count:
        type: integer
        min: 0
        description: "Number of supporting deliverables"
      primary_list:
        type: array
        item_type: string
        description: "List of primary deliverable names"
      supporting_list:
        type: array
        item_type: string
        description: "List of supporting deliverable names"

  validation:
    type: object
    required_fields:
      - alignment_score
      - classification
      - drift_detected
    optional_fields:
      - user_accepted_gaps
    structure:
      alignment_score:
        type: number
        min: 0
        max: 1
      classification:
        type: enum
        allowed_values:
          - EXCELLENT
          - GOOD
          - ACCEPTABLE
          - MISALIGNED
      drift_detected:
        type: boolean
      user_accepted_gaps:
        type: boolean
        description: "Present if classification = ACCEPTABLE"

  key_decisions:
    type: object
    required_fields:
      - count
      - critical_count
      - decisions
    structure:
      count:
        type: integer
        min: 0
        description: "Total decisions made"
      critical_count:
        type: integer
        min: 0
        description: "Critical decisions count"
      decisions:
        type: array
        item_schema:
          type: object
          required_fields:
            - decision_id
            - question
            - user_choice
            - timestamp
          structure:
            decision_id:
              type: string
            question:
              type: string
            user_choice:
              type: string
            timestamp:
              type: timestamp
            rationale:
              type: string
              optional: true

  metadata:
    type: object
    required_fields:
      - phases
      - snapshots_count
      - blockers_resolved
    structure:
      phases:
        type: object
        required_fields:
          - phase_1_intake
          - phase_2_plan
          - phase_3_execute
          - phase_4_validate
          - phase_5_deliver
        structure:
          phase_1_intake:
            type: object
            fields: [duration, status]
          phase_2_plan:
            type: object
            fields: [duration, status]
          phase_3_execute:
            type: object
            fields: [duration, status, tasks_executed]
          phase_4_validate:
            type: object
            fields: [duration, status, alignment_score]
          phase_5_deliver:
            type: object
            fields: [duration, status]
      snapshots_count:
        type: integer
        min: 0
        description: "Number of state snapshots created"
      blockers_resolved:
        type: integer
        min: 0
        description: "Number of blockers resolved"

validation_rules:
  - rule: status_complete_requires_5_phases
    check: |
      IF status == COMPLETE
      THEN execution_summary.phases_completed == 5
    error: "Status COMPLETE requires all 5 phases completed"

  - rule: completion_rate_matches_tasks
    check: |
      completion_rate == (completed_tasks / total_tasks) * 100
    error: "Completion rate doesn't match task counts"

  - rule: session_duration_valid
    check: end_time > start_time
    error: "Session end_time must be after start_time"

  - rule: deliverable_counts_match
    check: |
      IF primary_list EXISTS
      THEN primary_count == LENGTH(primary_list)
    error: "Primary count doesn't match primary_list length"

  - rule: goal_achieved_aligns_with_score
    check: |
      IF alignment_score >= 0.9 THEN achieved IN [YES, MOSTLY]
      IF alignment_score < 0.5 THEN achieved IN [PARTIALLY, NO]
    error: "Goal achievement status doesn't align with score"

gate_requirement:
  gate: GATE_5
  condition: "session-complete.yaml EXISTS AND status != null"

example:
  session_id: "880e8400-e29b-41d4-a716-446655440003"
  status: COMPLETE
  timestamp: "2025-01-15T18:00:00Z"
  goal:
    statement: "Stworzyć system CRM dla małej firmy"
    declared_at: "2025-01-15T10:30:00Z"
    achieved: YES
    alignment_score: 0.85
  execution_summary:
    phases_completed: 5
    total_tasks: 15
    completed_tasks: 14
    skipped_tasks: 1
    completion_rate: 93.3
    session_duration: "7 hours 30 minutes"
    start_time: "2025-01-15T10:30:00Z"
    end_time: "2025-01-15T18:00:00Z"
  deliverables:
    package_location: "deliverables-package/"
    primary_count: 3
    supporting_count: 2
    primary_list:
      - "User management module"
      - "Dashboard UI"
      - "Database schema"
    supporting_list:
      - "API documentation"
      - "Test suite"
  validation:
    alignment_score: 0.85
    classification: GOOD
    drift_detected: false
  key_decisions:
    count: 2
    critical_count: 1
    decisions:
      - decision_id: "DECISION_TECH_001"
        question: "Wybór bazy danych"
        user_choice: "PostgreSQL"
        timestamp: "2025-01-15T12:00:00Z"
        rationale: "Better for relational data"
  metadata:
    phases:
      phase_1_intake:
        duration: "30 minutes"
        status: COMPLETE
      phase_2_plan:
        duration: "45 minutes"
        status: COMPLETE
      phase_3_execute:
        duration: "5 hours"
        status: COMPLETE
        tasks_executed: 15
      phase_4_validate:
        duration: "45 minutes"
        status: COMPLETE
        alignment_score: 0.85
      phase_5_deliver:
        duration: "30 minutes"
        status: COMPLETE
    snapshots_count: 18
    blockers_resolved: 2
