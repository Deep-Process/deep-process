---
# Schema for backlog.yaml (Phase 2 output, Phase 3 runtime)
schema_id: backlog
version: 1.0.0
purpose: Enforce structure for task backlog with state tracking

required_fields:
  - backlog_id
  - created_at
  - tasks
  - statistics
  - critical_path

structure:
  backlog_id:
    type: uuid
    description: "Unique backlog identifier"

  created_at:
    type: timestamp
    format: ISO8601
    description: "When backlog was created"

  tasks:
    type: array
    min_items: 1
    description: "List of all tasks"
    item_schema:
      type: object
      required_fields:
        - task_id
        - task_name
        - task_type
        - state
        - dependencies
        - estimated_effort
      optional_fields:
        - subprocess
        - inputs_needed
        - outputs_produced
        - metadata
        - blocker
        - validation_result
      structure:
        task_id:
          type: string
          format: "task-{number}"
          description: "Unique task identifier"
        task_name:
          type: string
          min_length: 5
          description: "Descriptive task name"
        task_type:
          type: enum
          allowed_values:
            - SUBPROCESS_INVOCATION
            - INTEGRATION
            - VALIDATION
            - MANUAL
            - FIX
            - GAP_FIX
          description: "Type of task"
        state:
          type: enum
          allowed_values:
            - TODO
            - IN_PROGRESS
            - DONE
            - BLOCKED
            - SKIPPED
            - CANCELLED
          description: "Current task state"
        dependencies:
          type: array
          item_type: string
          description: "List of task_ids this task depends on"
        estimated_effort:
          type: string
          description: "Estimated time/effort (e.g., '30 minutes', '2 hours')"
        subprocess:
          type: string
          description: "Subprocess name if task_type = SUBPROCESS_INVOCATION"
        inputs_needed:
          type: array
          item_type: string
          description: "Required input artifacts"
        outputs_produced:
          type: array
          item_type: string
          description: "Artifacts produced by this task"
        metadata:
          type: object
          optional_fields:
            - phase_id
            - criticality
            - on_critical_path
            - parent_task
            - issue
          structure:
            phase_id:
              type: string
            criticality:
              type: enum
              allowed_values:
                - CRITICAL
                - HIGH
                - MEDIUM
                - LOW
            on_critical_path:
              type: boolean
            parent_task:
              type: string
              description: "Parent task_id if this is a fix/subtask"
            issue:
              type: string
              description: "Issue description for FIX tasks"
        blocker:
          type: string
          description: "Blocker description if state = BLOCKED"
        validation_result:
          type: enum
          allowed_values:
            - PASS
            - FAIL
          description: "Validation result if task_type = VALIDATION"

  statistics:
    type: object
    required_fields:
      - total_tasks
      - todo_count
      - estimated_total
    structure:
      total_tasks:
        type: integer
        min: 1
      todo_count:
        type: integer
        min: 0
      estimated_total:
        type: string
        description: "Sum of all estimated efforts"

  critical_path:
    type: array
    item_type: string
    description: "List of task_ids on critical path"

validation_rules:
  - rule: no_circular_dependencies
    check: topological_sort(tasks.dependencies) succeeds
    error: "Circular dependencies detected in backlog"

  - rule: all_dependencies_exist
    check: FOR EACH task.dependencies → task_id EXISTS in tasks
    error: "Dependency references non-existent task"

  - rule: statistics_match_tasks
    check: statistics.total_tasks == COUNT(tasks)
    error: "Statistics don't match actual task count"

  - rule: critical_path_valid
    check: FOR EACH task_id IN critical_path → task_id EXISTS in tasks
    error: "Critical path references non-existent task"

  - rule: state_transitions_valid
    allowed_transitions:
      TODO:
        - IN_PROGRESS
        - BLOCKED
        - CANCELLED
      IN_PROGRESS:
        - DONE
        - BLOCKED
        - TODO  # retry
      BLOCKED:
        - TODO  # unblocked
        - SKIPPED
        - CANCELLED
      DONE:
        []  # terminal
      SKIPPED:
        []  # terminal
      CANCELLED:
        []  # terminal

gate_requirement:
  gate: GATE_2
  condition: "backlog.yaml EXISTS AND tasks NOT empty AND no circular dependencies"

example:
  backlog_id: "660e8400-e29b-41d4-a716-446655440001"
  created_at: "2025-01-15T10:45:00Z"
  tasks:
    - task_id: "task-001"
      task_name: "Execute requirements gathering"
      task_type: SUBPROCESS_INVOCATION
      subprocess: "deep-requirements"
      state: TODO
      dependencies: []
      inputs_needed: []
      outputs_produced: ["requirements.yaml"]
      estimated_effort: "2 hours"
      metadata:
        phase_id: "phase_1_requirements"
        criticality: CRITICAL
        on_critical_path: true
    - task_id: "task-002"
      task_name: "Validate requirements output"
      task_type: VALIDATION
      state: TODO
      dependencies: ["task-001"]
      estimated_effort: "10 minutes"
      metadata:
        criticality: HIGH
  statistics:
    total_tasks: 2
    todo_count: 2
    estimated_total: "2 hours 10 minutes"
  critical_path: ["task-001", "task-002"]
