---
# Schema for validation-report.yaml (Phase 4 output)
schema_id: validation-report
version: 1.0.0
purpose: Enforce structure for goal alignment validation reports

required_fields:
  - report_id
  - created_at
  - original_goal
  - deliverables_analyzed
  - alignment_analysis
  - drift_analysis
  - final_alignment_score
  - classification
  - recommendation
  - counter_check

structure:
  report_id:
    type: uuid
    description: "Unique report identifier"

  created_at:
    type: timestamp
    format: ISO8601
    description: "When validation was performed"

  original_goal:
    type: string
    description: "Original goal from goal-declaration.yaml"

  deliverables_analyzed:
    type: array
    min_items: 1
    description: "List of deliverables validated"
    item_schema:
      type: object
      required_fields:
        - deliverable_name
        - goal_component_served
        - contribution_level
        - alignment_score
        - gaps
      structure:
        deliverable_name:
          type: string
        goal_component_served:
          type: string
          description: "Which goal component this deliverable serves"
        contribution_level:
          type: enum
          allowed_values:
            - COMPLETE
            - PARTIAL
            - MISSING
        alignment_score:
          type: number
          min: 0
          max: 100
          description: "Per-deliverable alignment score"
        gaps:
          type: array
          item_type: string
          description: "List of gaps identified"

  alignment_analysis:
    type: object
    required_fields:
      - overall_alignment
      - overall_gaps
    structure:
      overall_alignment:
        type: number
        min: 0
        max: 100
        description: "Average alignment across all deliverables"
      overall_gaps:
        type: array
        item_type: string
        description: "Goal components not addressed by any deliverable"

  drift_analysis:
    type: object
    required_fields:
      - drift_detected
      - drift_magnitude
    optional_fields:
      - drift_type
      - drift_description
    structure:
      drift_detected:
        type: boolean
        description: "Was goal drift detected?"
      drift_magnitude:
        type: number
        min: 0
        max: 1
        description: "Magnitude of drift (0 = no drift, 1 = completely different)"
      drift_type:
        type: enum
        allowed_values:
          - EXPLICIT_CHANGE
          - IMPLICIT_DRIFT
          - SCOPE_DRIFT
        description: "Type of drift if detected"
      drift_description:
        type: string
        description: "Description of how goal drifted"

  final_alignment_score:
    type: number
    min: 0
    max: 1
    description: "Final alignment score after adjustments (0-1 scale)"

  classification:
    type: enum
    allowed_values:
      - EXCELLENT
      - GOOD
      - ACCEPTABLE_WITH_GAPS
      - MISALIGNED
    description: "Classification based on alignment score"
    mapping:
      EXCELLENT: ">= 0.9"
      GOOD: "0.7 - 0.9"
      ACCEPTABLE_WITH_GAPS: "0.5 - 0.7"
      MISALIGNED: "< 0.5"

  recommendation:
    type: string
    description: "Recommendation based on classification"

  counter_check:
    type: object
    required_fields:
      - performed
      - evidence_against
      - evidence_for
      - claim_holds
    structure:
      performed:
        type: boolean
        description: "Was counter-check performed?"
      evidence_against:
        type: array
        item_type: string
        description: "Evidence against alignment claim"
      evidence_for:
        type: array
        item_type: string
        description: "Evidence supporting alignment claim"
      claim_holds:
        type: boolean
        description: "Does alignment claim hold after counter-check?"

  user_decision:
    type: object
    optional: true
    description: "Present if classification = ACCEPTABLE_WITH_GAPS or MISALIGNED"
    fields:
      - decision
      - timestamp
      - rationale
    structure:
      decision:
        type: enum
        allowed_values:
          - ACCEPT
          - ADD_TASKS
          - REVISE_GOAL
          - REWORK
          - CANCEL
      timestamp:
        type: timestamp
      rationale:
        type: string

validation_rules:
  - rule: alignment_score_matches_classification
    check: |
      IF classification = EXCELLENT THEN final_alignment_score >= 0.9
      IF classification = GOOD THEN 0.7 <= final_alignment_score < 0.9
      IF classification = ACCEPTABLE_WITH_GAPS THEN 0.5 <= final_alignment_score < 0.7
      IF classification = MISALIGNED THEN final_alignment_score < 0.5
    error: "Classification doesn't match alignment score"

  - rule: counter_check_required
    check: counter_check.performed == true
    error: "Counter-check is mandatory per Guideline 8"

  - rule: user_decision_when_low_alignment
    check: |
      IF classification IN [ACCEPTABLE_WITH_GAPS, MISALIGNED]
      THEN user_decision EXISTS
    error: "User decision required when alignment < 0.9"

  - rule: drift_fields_consistent
    check: |
      IF drift_detected == true
      THEN drift_type EXISTS AND drift_description EXISTS
    error: "Drift detected but type/description missing"

gate_requirement:
  gate: GATE_4
  condition: "validation-report.yaml EXISTS AND (final_alignment_score >= 0.9 OR user_decision.decision == ACCEPT)"

example:
  report_id: "770e8400-e29b-41d4-a716-446655440002"
  created_at: "2025-01-15T16:30:00Z"
  original_goal: "Stworzyć system CRM dla małej firmy"
  deliverables_analyzed:
    - deliverable_name: "User management module"
      goal_component_served: "zarządzanie relacjami z klientami"
      contribution_level: COMPLETE
      alignment_score: 95
      gaps: []
    - deliverable_name: "Dashboard UI"
      goal_component_served: "wizualizacja danych klientów"
      contribution_level: PARTIAL
      alignment_score: 70
      gaps: ["Brak filtrowania zaawansowanego"]
  alignment_analysis:
    overall_alignment: 82.5
    overall_gaps: []
  drift_analysis:
    drift_detected: false
    drift_magnitude: 0.0
  final_alignment_score: 0.825
  classification: GOOD
  recommendation: "Recommendation: Accept output. Goal achieved."
  counter_check:
    performed: true
    evidence_against: []
    evidence_for:
      - "All goal components addressed"
      - "Deliverables provide business value"
    claim_holds: true
