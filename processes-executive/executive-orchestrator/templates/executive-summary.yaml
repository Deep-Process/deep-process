---
# Executive Summary Template
# Business-level communication only
# Max 2 pages
---

summary:
  goal: "[Original goal - business terms]"

  completion_status:
    overall: "[X%] complete"
    current_phase: "[Phase name]"

  what_was_done:
    - "[Achievement 1 - business impact]"
    - "[Achievement 2 - business impact]"
    - "[Achievement 3 - business impact]"
    # Max 5 bullets

  what_is_next:
    next_phase: "[Phase name]"
    next_milestone: "[Business milestone]"
    estimated_time: "[Rough estimate if known]"

  key_decisions_made:
    - decision: "[What was decided]"
      rationale: "[Why - business terms]"
      impact: "[Impact on goal]"
    # Only critical decisions

  current_blockers:
    - blocker: "[What blocks progress]"
      impact: "[Effect on goal]"
      resolution_needed: "[What's needed to unblock]"
    # Empty if no blockers

  deliverables:
    - "[Deliverable 1 - what it is, why it matters]"
    - "[Deliverable 2 - what it is, why it matters]"
    # Business value, not technical details

  alignment_check:
    goal_reminder: "[Repeat original goal]"
    output_alignment: "[How output serves goal]"
    drift_detected: "[Yes/No - if yes, explain]"

  next_action_for_user:
    prompt: "[What user should do next]"
    options:
      - "[Option A]"
      - "[Option B]"
    # Only if user input needed

# FORBIDDEN in this template:
# - Technical jargon
# - Code snippets
# - Architecture diagrams
# - Detailed logs
# - More than 2 pages of text

---
# END executive-summary.yaml
