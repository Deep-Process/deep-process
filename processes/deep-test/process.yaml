---
# Deep Test Process
# Comprehensive testing strategy
---

process_name: deep-test
version: "2.0.0"
13_zasady_version: "1.0.0"
created: "2026-02-16"

# ═══════════════════════════════════════════════════════════════
# METADATA
# ═══════════════════════════════════════════════════════════════

metadata:
  category: TESTING
  complexity: HIGH

# ═══════════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════════

inputs:
  project_context:
    type: artifact
    schema_ref: "schemas/project-context-schema.yaml"
    required: true

  source_code:
    type: directory
    required: true
    schema: "artifacts/{project_id}/src/**/*"

  requirements:
    type: artifact
    schema_ref: "schemas/requirements-schema.yaml"
    required: true

  api_specifications:
    type: artifact
    schema_ref: "schemas/api-specification-schema.yaml"
    required: false

  risk_assessment:
    type: artifact
    schema_ref: "schemas/risk-assessment-schema.yaml"
    required: false

  implementation_log:
    type: artifact
    schema_ref: "schemas/implementation-log-schema.yaml"
    required: true

# ═══════════════════════════════════════════════════════════════
# PHASES (OODA STRUCTURE)
# ═══════════════════════════════════════════════════════════════

phases:
  phase_0_preparation:
    observe:
      action: "LOAD implementation_log + requirements + risk_assessment"
      gate: "GATE_0_OBSERVED"

    orient:
      action: "CLASSIFY components BY test_needs + IDENTIFY test_types_required"
      assumptions: "DECLARE test_pyramid = [unit>60%, integration>25%, e2e>10%]"
      gate: "GATE_0_ORIENTED"

    decide:
      action: "IF api_exists THEN include_contract_tests ELSE skip"
      gate: "GATE_0_DECIDED"

    act:
      action: "CREATE test-plan.yaml WITH test_strategy"
      gate: "GATE_0"

  phase_1_test_generation:
    observe:
      action: "LOAD test-plan.yaml + source_code"
      gate: "GATE_1_OBSERVED"

    orient:
      action: "GENERATE unit|integration|e2e tests FROM components USING patterns"
      assumptions: "DECLARE test_patterns per component_type"
      gate: "GATE_1_ORIENTED"

    decide:
      action: "FOR EACH component IF testable THEN generate_tests ELSE flag"
      gate: "GATE_1_DECIDED"

    act:
      action: "CREATE tests/ WITH generated_test_files"
      gate: "GATE_1"

  phase_2_test_execution:
    observe:
      action: "LOAD tests/ + source_code"
      gate: "GATE_2_OBSERVED"

    orient:
      action: "EXECUTE unit_tests THEN integration_tests THEN e2e_tests"
      assumptions: "DECLARE execution_order = [unit, integration, e2e, security]"
      gate: "GATE_2_ORIENTED"

    decide:
      action: "IF test_fails THEN record_failure ELSE continue"
      gate: "GATE_2_DECIDED"

    act:
      action: "CREATE test-results.yaml WITH pass_fail_stats"
      gate: "GATE_2"

  phase_3_coverage_analysis:
    observe:
      action: "LOAD test-results.yaml + source_code"
      gate: "GATE_3_OBSERVED"

    orient:
      action: "CALCULATE coverage BY file|function|branch USING coverage_tool"
      assumptions: "DECLARE coverage_target >= 80%"
      gate: "GATE_3_ORIENTED"

    decide:
      action: "IF coverage < target THEN identify_gaps ELSE proceed"
      gate: "GATE_3_DECIDED"

    act:
      action: "CREATE coverage-report.yaml WITH gaps"
      gate: "GATE_3"

  phase_4_security_testing:
    observe:
      action: "LOAD source_code + risk_assessment"
      gate: "GATE_4_OBSERVED"

    orient:
      action: "EXECUTE SAST + DAST + dependency_scan USING security_tools"
      assumptions: "DECLARE vulnerability_threshold = zero_critical"
      gate: "GATE_4_ORIENTED"

    decide:
      action: "IF critical_vulns > 0 THEN fail ELSE proceed"
      gate: "GATE_4_DECIDED"

    act:
      action: "CREATE security-report.yaml WITH findings"
      gate: "GATE_4"

  phase_5_performance_testing:
    observe:
      action: "LOAD api_specifications + requirements"
      gate: "GATE_5_OBSERVED"

    orient:
      action: "EXECUTE load_tests + stress_tests USING performance_targets"
      assumptions: "DECLARE performance_targets FROM nfr"
      gate: "GATE_5_ORIENTED"

    decide:
      action: "IF performance < target THEN flag_bottleneck ELSE proceed"
      gate: "GATE_5_DECIDED"

    act:
      action: "CREATE performance-report.yaml WITH metrics"
      gate: "GATE_5"

  phase_6_finalization:
    observe:
      action: "LOAD ALL test_reports"
      gate: "GATE_6_OBSERVED"

    orient:
      action: "AGGREGATE results + VALIDATE quality_gates"
      assumptions: "DECLARE quality_gates = [coverage>80%, zero_critical_bugs, all_tests_pass]"
      gate: "GATE_6_ORIENTED"

    decide:
      action: "IF all_gates_pass THEN approve ELSE reject"
      gate: "GATE_6_DECIDED"

    act:
      action: "CREATE test-summary.yaml + handoff-checkpoint.yaml"
      gate: "GATE_6"

# ═══════════════════════════════════════════════════════════════
# OUTPUTS
# ═══════════════════════════════════════════════════════════════

outputs:
  test-plan: {schema: "{test_types[], strategy}", phase: 0}
  tests: {schema: "Generated test files", path: "tests/", phase: 1}
  test-results: {schema: "{passed, failed, skipped, duration}", phase: 2}
  coverage-report: {schema: "{coverage%, gaps[]}", phase: 3}
  security-report: {schema: "{vulnerabilities[], severity_counts{}}", phase: 4}
  performance-report: {schema: "{load_test{}, stress_test{}, bottlenecks[]}", phase: 5}
  test-summary: {schema: "{overall_status, quality_gates_status{}}", phase: 6}
  handoff-checkpoint: {schema_ref: "schemas/handoff-checkpoint-schema.yaml", phase: 6}

# ═══════════════════════════════════════════════════════════════
# VALIDATION GATES
# ═══════════════════════════════════════════════════════════════

validation_gates:
  GATE_0:
    condition: "test-plan.yaml EXISTS AND test_strategy DEFINED"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_1:
    condition: "tests/ EXISTS AND test_count > 0"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_2:
    condition: "test-results.yaml EXISTS AND execution_completed"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_3:
    condition: "coverage-report.yaml EXISTS AND coverage >= 80%"
    on_fail: "EMIT_WARNING + PROCEED"
    severity: WARNING

  GATE_4:
    condition: "security-report.yaml EXISTS AND critical_vulns == 0"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_5:
    condition: "performance-report.yaml EXISTS AND targets_met"
    on_fail: "EMIT_WARNING + PROCEED"
    severity: WARNING

  GATE_6:
    condition: "test-summary.yaml EXISTS AND quality_gates_passed"
    on_fail: "HALT"
    severity: BLOCKER

# ═══════════════════════════════════════════════════════════════
# ERROR HANDLERS
# ═══════════════════════════════════════════════════════════════

error_handlers:
  missing_input:
    trigger: "source_code OR implementation_log NOT PROVIDED"
    severity: CRITICAL
    action: "HALT WITH error_missing_code"
    recovery: "Request implementation artifacts"

  invalid_input:
    trigger: "source_code directory empty OR invalid"
    severity: HIGH
    action: "HALT WITH validation_error"
    recovery: "Verify implementation completion"

  partial_completion:
    trigger: "phase N reaches 70% THEN interrupted"
    severity: MEDIUM
    action: "SAVE checkpoint + HALT"
    recovery: "Resume from checkpoint"

  external_dependency_failure:
    trigger: "test_tools OR coverage_tools NOT ACCESSIBLE"
    severity: HIGH
    action: "USE fallback_tools + EMIT_WARNING"
    recovery: "Continue with reduced testing"

  timeout:
    trigger: "test_execution > max_allowed"
    severity: HIGH
    action: "SAVE state + HALT WITH timeout_error"
    recovery: "User decides: continue OR reduce_scope"

  resource_exhaustion:
    trigger: "test_count > max_executable"
    severity: HIGH
    action: "PRIORITIZE by importance + REDUCE scope"
    recovery: "Execute critical tests only"

  concurrent_modification:
    trigger: "source_code CHANGED during testing"
    severity: CRITICAL
    action: "RELOAD + RESTART from GATE_1"
    recovery: "Phase 1 re-execution"

  user_cancellation:
    trigger: "user_cancels DURING execution"
    severity: LOW
    action: "SAVE checkpoint + CLEANUP temp_files"
    recovery: "State saved for resume"

# ═══════════════════════════════════════════════════════════════
# COMPLIANCE
# ═══════════════════════════════════════════════════════════════

compliance_13_zasady:
  zasada_0_ooda: "PASS - 7 phases OODA"
  zasada_1_self_contained: "PASS - steps/*.md JIT"
  zasada_2_completeness: "PASS - ALL test types GATE_0"
  zasada_3_mechanisms: "PASS - 7 gates IF-THEN"
  zasada_4_binding_gates: "PASS - BLOCKER enforcement"
  zasada_5_assumptions: "PASS - DECLARE each phase"
  zasada_6_evr: "PASS - observe→orient→act"
  zasada_7_checklists: "PASS - step files"
  zasada_8_counter_checks: "PASS - security + coverage checks"
  zasada_9_executable: "PASS - LOAD/CREATE/IF"
  zasada_10_visible_reasoning: "PASS - orient shows test_strategy"
  zasada_11_instruction_data: "PASS - schemas + patterns"
  zasada_12_jit: "PASS - on-demand loading"
  zasada_13_zero_decoration: "PASS - no explanations"

---
# END deep-test process.yaml
