  - version: "3.7.19"
    date: "2026-02-09"
    changes:
      - "Fixed excessive file segmentation in proc-deep-document-v6 STATE_COVERAGE phase to address user-reported inefficiency where 824-line file was being read in 28 separate segments (15-30 lines each), causing 28 Read tool calls in STATE_EVIDENCE with massive token waste and latency overhead. Root cause: config.yaml max_segment_lines=100 forced aggressive segmentation for all files regardless of size. New segmentation strategy (v6.1.1 anti-over-segmentation): (1) Files <3000 lines: Read as ONE whole segment (no splitting). Example: 824-line file → 1 segment → 1 Read call (was 28). (2) Files ≥3000 lines: Split into 1000-1500 line chunks at logical boundaries (functions, classes, config blocks). (3) Updated config.yaml thresholds section: whole_file_threshold=3000 (new), max_segment_lines=1500 (was 100), min_segment_lines=1000 (new). (4) Updated mapper-agent.md STATE_COVERAGE sequence with 'Apply segmentation strategy' section documenting IF file <3000 lines THEN 1 segment, ELSE split into 1000-1500 line chunks. Added rationale explaining previous 100-line strategy caused 824-line file → 28 segments. (5) Updated mapper-agent.md STATE_EVIDENCE Step 1 with efficiency note: 'files <3000 lines = 1 segment = 1 Read call, not 28+ calls', changed 'Extract claims' to 'Extract claims in batches'. (6) Updated GATE_1 condition G1-04 from 'all segments <= max_segment_lines (100)' to 'all segments <= max_segment_lines (1500) OR whole file if <3000 lines'. (7) Updated reference.md coverage_map.yaml schema constraints from 'no segment > 100 lines without justification' to 'files <3000 lines = 1 segment (whole file) | files ≥3000 lines split into 1000-1500 line chunks (v6.1.1 anti-over-segmentation)'. Impact: 15x reduction in Read calls for typical files (824 lines: 28 → 1), massive token savings in STATE_EVIDENCE, reduced latency, cleaner claim extraction context. User feedback: 'czytanie tak kilka linii po linii, to chyba przesada' (reading a few lines at a time is excessive). Updated 4 files: config.yaml (thresholds), mapper-agent.md (segmentation strategy + efficiency notes), reference.md (schema constraints), _manifest.yaml (version 3.7.19)."
