# Deep-Process v3.7 — Process Manifest
# Registry of all SRE-Convergent process definitions

manifest_version: "3.7"
description: |
  This manifest lists all processes transformed to SRE-Convergent standard.
  Each process inherits from Deep-Process meta-class and uses its execution framework.

# ============================================================================
# PROCESS REGISTRY
# ============================================================================

processes:
  - id: "proc-deep-knowledge"
    name: "Deep Knowledge (Semantic Pyramid)"
    path: "deep-knowledge"
    description: "Meta-proces do zarządzania wiedzą o projekcie (L0-L2) bez zewnętrznych narzędzi."
    artifacts_count: 3
    steps_count: 4

  - id: "proc-deep-document"
    name: "Deep Document (Project Documentation Generator)"
    path: "../deep-document"
    description: "Automatyczny generator dokumentacji projektowej z wielopoziomowym skanowaniem, weryfikacją i oceną jakości."
    artifacts_count: 3
    steps_count: 13

  - id: "proc-deep-document-v2"
    name: "Deep Document V2 (Orchestrator + Sub-Agent Architecture)"
    path: "../deep-document-v2"
    description: "Ewolucja Deep Document z architekturą orchestrator + 5 sub-agentów. Task/result envelope protocol, file-based communication, token budget management, graceful degradation."
    artifacts_count: 3
    steps_count: 13

  - id: "proc-deep-synthesis"
    name: "Deep Synthesis (Systematic Knowledge Synthesis)"
    path: "../deep-synthesis"
    description: "Systematyczna synteza wiedzy: 40 metod w 7 fazach (SCOPE, ACQUIRE, DECOMPOSE, RELATE, INTEGRATE, CRYSTALLIZE, OUTPUT). 4 poziomy głębokości, 19 fundamentów teoretycznych, ciągłe META quality gates."
    artifacts_count: 2
    steps_count: 7

  - id: "proc-deep-explore"
    name: "Deep Explore (Knowledge-First Decision Exploration)"
    path: "../deep-explore"
    description: "Strukturalna eksploracja decyzji: 54 metody w 5 tier-ach (Foundation, Map, Illuminate, Challenge, Synthesize, Converge, Meta). 3 poziomy głębokości (quick/standard/deep), automatyczna detekcja fear analysis, Morphological Box, VERIFIED vs ASSUMED consequences."
    artifacts_count: 1
    steps_count: 7

  - id: "proc-deep-verify-v2"
    name: "Deep Verify V2 (Enforcement Edition)"
    path: "../deep-verify-v2"
    description: "Ewolucja Deep Verify z mechanizmami wymuszania: binding gates (GATE_0-6), ASSUMPTIONS_DECLARED przed ekstrakcją, hypothesis logging, counter-checks na CRITICAL/IMPORTANT, sekwencja extract→verify→render, brak early exits. 10 przykazań, 7 faz (0-6), 3 tryby (Quick/Standard/Deep)."
    artifacts_count: 2
    steps_count: 7

  - id: "proc-deep-architect"
    name: "Deep Architect V1.4.1 (ZASADY Compliance Stripping)"
    path: "../deep-architect"
    description: "Software architecture design process from user brief to verified architecture. 16 operations (8 canonical + 8 adversarial). 7 phases (0-6), 7 binding gates (53 conditions), 16 invariants, 8 schemas. V1.4.0: Deep-Risk V2.1.0 mitigations for R-017 (process compliance ≠ architecture quality). Architecture Fitness Assessment (INV-15, G5-07, 5 criteria AF-01..05). Reasoning Visibility (INV-16, G1-08, ≥80% decisions with WHY). CP2 user checkpoint after ADVERSARY. Project Scale Classification (G0-08, proportionality). Staleness tracking on REDESIGN_LOOP. Context handoff Phase 3→4. Pattern Library: 110 patterns across 9 files, 17 domains, brief-based detection."
    artifacts_count: 10
    steps_count: 7

  - id: "proc-deep-document-v6"
    name: "Deep Document V6.4.1 (Universal Placeholder Detection & Automatic Decomposition)"
    path: "../deep-document-v6"
    description: "FSM-based documentation process with planning-first architecture, ITERATIVE EXECUTION, QUALITY MECHANISMS, QUANTITATIVE ENFORCEMENT, and UNIVERSAL PLACEHOLDER DETECTION. 15 states (9 processing + 4 user-review + 3 terminal), 24 binding gates (V6.4.1 adds PD-UNIVERSAL placeholder detection to 8 gates), 25 invariants, pattern-based detection, 7 agents (orchestrator, context, template-analyzer, planner, mapper, architect, writer, verifier), DEEP-DIAGRAM 9-sub-phase pipeline. V6.1 features: process-state.yaml persistence, orchestrator control plane, staleness propagation, resume/expand/rerun commands, custom template support. V6.2.0 features: quality mechanisms (R1-R10 prose rules, GG-10..14 quality gates, V-PROSE-001..V-SCAN-001 verification tests) for scannability, navigability, completeness, format appropriateness, readability. V6.2.1 features: STATE_QUALITY_AMENDMENT quasi-terminal pattern enabling post-completion quality improvements (15% budget) without full evidence/diagram regeneration (60% budget). V6.3.1 features: STATE_TEMPLATE_ANALYSIS with baseline census, GATE_TA (13 conditions), template decomposition before planning. V6.4.0 features: QUANTITATIVE ENFORCEMENT with 28 new gate conditions checking QUANTITY not EXISTENCE (prevents 92% documentation gaps), GATE_COHERENCE cross-phase validation, baseline census integration, tool error handling protocol, CUI BONO enforcement. V6.4.1 features: UNIVERSAL PLACEHOLDER DETECTION (workflow.md §2.5) automatically detecting 68+ placeholder patterns (ellipsis, placeholders, deferrals) after EVERY Write/Edit operation, automatic incremental decomposition protocol (4 steps: ANALYZE→DECOMPOSE→RETURN→VERIFY) when placeholders detected, token penalty warnings (0%→15%→40% with BLOCKER), PD-UNIVERSAL condition in 8 gates (GATE_0/D/P/1/2/3/GEN/4). Prevents Gemini patterns: '... (and so on for all 28 files)', 'CLAIM-XXX', '(many more would be here)'."
    artifacts_count: 9
    steps_count: 12

# ============================================================================
# PROCESS DEFINITION SCHEMA
# ============================================================================

process_definition_schema:
  required_files:
    - "process.yaml"      # Process metadata and configuration

  optional_files:
    - "steps/"            # Step definitions (if multi-step)
    - "templates/"        # Artifact templates specific to this process
    - "gates/"            # Logic gates and conditions
    - "README.md"         # Human-readable documentation

  process_yaml_structure:
    id: "string (PROC-XXX format)"
    name: "string"
    description: "string"
    version: "string"

    # Inheritance from Deep-Process
    inherits:
      framework: "deep-process"
      version: "3.7"

    # Process-specific method injection
    methods:
      default: []           # Always applied
      on_start: []          # Applied at process start
      on_complete: []       # Applied at completion

    # Process steps/phases
    steps: []

    # Artifacts this process produces
    artifacts: []

    # Decision points (human-in-the-loop)
    decision_points: []

# ============================================================================
# INSTANCE TRACKING
# ============================================================================

# Instances are tracked in .deep-process/registry.json at runtime
# This manifest only defines WHAT processes exist
# Registry defines WHERE instances are running

instance_tracking:
  location: ".deep-process/registry.json"
  artifacts_base: "artifacts/processes/"

  instance_structure:
    instance_id: "unique identifier (e.g., onboarding-client-abc-001)"
    process_type: "reference to process id from this manifest"
    artifacts_path: "artifacts/processes/{instance_id}/"
    status: "PENDING | RUNNING | PAUSED | COMPLETED | FAILED"
    started_at: "ISO timestamp"
    last_activity: "ISO timestamp"
    current_step: "step id or null"
    context: {}  # Process-specific runtime context

# ============================================================================
# CREATING NEW PROCESSES
# ============================================================================

# To add a new process:
#
# 1. Copy processes/_process-template/ to processes/{your-process-name}/
# 2. Edit process.yaml with your steps and gates
# 3. Create artifact templates in templates/
# 4. Add entry to this manifest file (in processes: section)
# 5. Test by creating an instance: [N] from main menu

# ============================================================================
# MIGRATION PROTOCOL
# ============================================================================

migration:
  description: |
    When external process is transformed to SRE-Convergent standard:
    1. Create folder in processes/ with process definition
    2. Add entry to this manifest
    3. Process becomes available for instantiation

  transformation_methods:
    - 71   # First Principles Analysis
    - 72   # 5 Whys Deep Dive
    - 79   # Operational Definition
    - 90   # Dependency Topology Mapping
    - 95   # Structural Isomorphism
    - 100  # Vocabulary Consistency
    - 114  # Reversibility Test
    - 159  # Transitive Dependency Closure
    - 160  # Transformation Proof (New v3.7)

