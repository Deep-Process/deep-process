header from v6.2.0 to v6.2.1, added v6.2.1 update note documenting STATE_QUALITY_AMENDMENT. Added comprehensive section '## 12. QUALITY MECHANISMS (V6.2.0)' (~1100 lines) documenting overview (3-layer enforcement: config thresholds, writer rules + gates, verification tests), prose quality rules R1-R10 with rationale/thresholds/gates/tests (paragraph length constraint, structure decomposition, table format selection, list format selection, 70/30 citation strategy, [UNKNOWN] minimization 3-tier hierarchy, progressive disclosure, hierarchical depth, code examples, diagram relationships), quality gates GG-10..14 with conditions/severity/methods/failures/remedies, verification tests V-PROSE-001..V-SCAN-001 with algorithms/outputs/pass-fail criteria, configuration thresholds from config.yaml, implementation timeline (5 phases over 2 days), 6 key design decisions (ADR-001 threshold selection, ADR-002 70/30 citation strategy, ADR-003 format selection logic, ADR-004 3-tier [UNKNOWN] hierarchy, ADR-005 structure decomposition algorithm, ADR-006 gate severity levels), impact summary (+5 quality gates, +726 lines documentation-standards, ~5% budget). Updated footer from V6.1.0 to V6.2.1, added 'Every paragraph scannable' to signature block. (4) _manifest.yaml: Updated proc-deep-document-v6 name from 'V6.1' to 'V6.2.1 (Iterative Planning-First FSM with Quality Mechanisms)', updated description from '13 binding gates, 24 invariants' to '15 binding gates (added GATE_P_AMENDMENT), 25 invariants (added INV-25 Template Completeness)', expanded feature list to document V6.2.0 quality mechanisms (R1-R10 prose rules, GG-10..14 quality gates, V-PROSE-001..V-SCAN-001 verification tests for scannability/navigability/completeness/format appropriateness/readability) and V6.2.1 quality amendment (STATE_QUALITY_AMENDMENT quasi-terminal pattern, 15% budget vs 60% for full regeneration). Synchronization achievement: All version references now 6.2.1, gate count 15 consistent across files, invariant count 25 documented everywhere, GG-10..14 present in gates.yaml + workflow.md + reference.md, INV-25 present in invariants.yaml + workflow.md, R1-R10 documented in reference.md, complete V6.2.0 quality mechanism documentation added. Files modified: workflow.md (version + gates + invariants), process.yaml (version + counts + law comments), reference.md (version + section 12), _manifest.yaml (process description + version 3.7.22 history). This release completes the v6.2.0 upgrade integration that was partially deployed in v3.7.20, ensuring workflow files correctly enforce quality mechanisms that were already present in implementation files."
  - version: "3.7.21"
    date: "2026-02-10"
    changes:
      - "Added STATE_QUALITY_AMENDMENT to proc-deep-document-v6 to fix UX gap where completed projects (STATE_COMPLETE) had no regeneration options for quality improvements: Root cause analysis: Users who completed documentation with V6.1 (before quality mechanisms) reached STATE_COMPLETE and had no option to apply V6.2 quality improvements without full RESET (4 hours). V6.2 quality mechanisms (GG-10..14 prose quality gates added in v3.7.20) meant existing docs lacked scannability (≤300 char paragraphs), navigability (depth ≥2.0), completeness (<10% [UNKNOWN]), format appropriateness (tables/lists), readability (≤30% citations). Solution: STATE_QUALITY_AMENDMENT (quasi-terminal pattern) enables post-completion quality improvements WITHOUT full evidence/diagram regeneration. Implementation (method-based using #167 Baseline Census, #78 Assumption Excavation, #81 Scope Integrity, #59 CUI BONO, #84 Coherence Check, #61 Pre-mortem, #114 Reversibility, #85 Grounding Check, #99 Multi-Artifact Coherence, #31 ADR): (1) Changed STATE_COMPLETE from TERMINAL to QUASI_TERMINAL in transitions.yaml, added STATE_QUALITY_AMENDMENT state with 6-step enforced sequence (load plan → declare assumptions → amend with quality_requirements → evaluate GATE_P_AMENDMENT → mark docs STALE with targeted staleness → delegate to writer-agent). (2) Added GATE_P_AMENDMENT to gates.yaml with 7 conditions (GPA-01..07): additive only (no removals/contradictions), quality requirements added (GG-10..14 references), no cascade to evidence/model (targeted staleness), assumptions logged, version incremented, coherence check (Method #99), staleness override documented. Includes 3 counter-checks: cascade verification (Method #85), coherence verification (Method #84), gate enforcement pre-mortem (Method #61). (3) Updated INV-24 (Staleness Propagation) in invariants.yaml to add QUALITY_ONLY exception: When override.type=='QUALITY_ONLY', staleness is TARGETED (affects only specified artifacts like docs/*.md) and does NOT cascade transitively (evidence_map.yaml and architectural-model.json remain FRESH). Added detection_method showing IF/ELSE logic, exception test cases. Rationale: Quality amendment affects HOW docs written (prose structure) not WHAT documented (facts/diagrams). Token economy: docs regeneration = ~15% budget vs full evidence+diagrams = ~60% budget. (4) Updated workflow.md staleness propagation algorithm (§19.3) to add override parameter supporting QUALITY_ONLY mode with targeted staleness, no transitive propagation, decision logging documenting cascade blocked and fresh_preserved artifacts. (5) Added Scenario E (Completed Process with Quality Amendment Option) to orchestrator-agent.md: Shows completion summary with all artifacts, gates passed, options including [AMEND_QUALITY] for V6.2 compliance. Amendment flow displays quality improvements (GG-10..14), what changes (plan + docs, evidence/diagrams preserved), token budget (15%), estimated time (15 min vs 4 hours), process flow (STATE_QUALITY_AMENDMENT → STATE_GENERATION → USER_REVIEW_DOCS → STATE_VERIFICATION → STATE_COMPLETE v2), assumptions, counter-checks. Updated validate_and_load() to route STATE_COMPLETE to handle_completed_process() instead of handle_resume(). (6) Updated RULE F-04 from 'STATE_COMPLETE is terminal' to 'STATE_COMPLETE is quasi-terminal (V6.2) — can transition to STATE_QUALITY_AMENDMENT for post-completion quality improvements, otherwise terminal'. (7) Updated reference.md from 12 gates to 13 gates (added GATE_P_AMENDMENT), noted INV-24 QUALITY_ONLY exception for V6.2, updated consolidated validation report to reflect changes. (8) Added 3 allowed_transitions (STATE_COMPLETE → STATE_QUALITY_AMENDMENT, STATE_QUALITY_AMENDMENT → STATE_GENERATION, STATE_QUALITY_AMENDMENT → STATE_ERROR) and 2 forbidden_transitions (STATE_QUALITY_AMENDMENT cannot skip to completion/earlier states, STATE_COMPLETE can only go to amendment). V6 compliance: 9/9 requirements (self-contained via transitions.yaml, COMPLETENESS>TOKEN_ECONOMY via same evidence/diagrams, mechanisms via GATE_P_AMENDMENT enforcement, binding gates block if fail, ASSUMPTIONS_DECLARED before amendment, extract→verify→render sequence preserved, checklists via GPA-01..07, counter-checks via 3 verifications, egzekucyjny via gate HOW/ORDER enforcement). CUI BONO: Full RESET benefits AGENT (less work), partial regeneration benefits USER (15 min vs 4 hours). Coherence: Resolves V6 contradiction where P0 COMPLETENESS conflicts with F-04 terminal state (V6.2 quality is part of completeness). Pre-mortem identified 5 failure modes addressed by quasi-terminal pattern. This enables iterative quality improvement for existing completed projects without requiring destructive RESET."
  - version: "3.7.20"
