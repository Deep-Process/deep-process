# Transformation Proof Schema v1.0
# Reference: SPECIFICATION.md Section 8.4.2, 8.4.3
#
# PURPOSE: Documents the mapping from UPS to SRE-Convergent and enables verification.
# Every process migration MUST produce this proof document.
#
# METHOD #87 (Falsifiability Check): Each verdict has explicit thresholds that
# can be tested. Lossiness and reversibility scores are falsifiable metrics.
#
# METHOD #79 (Operational Definition): "Lossless" is operationally defined as
# L=0, R=1. "Acceptable" is L<0.1, R>0.9.

schema_version: "1.0"
framework_version: "3.7"

description: |
  Schema for transformation-proof.json - document proving migration quality.

  This proof is MANDATORY for all process migrations (Law 6).
  Generated by Method #160 (Transformation Proof).

transformation_proof:
  type: object
  required:
    - proof_version
    - generated_at
    - method_used
    - source_process
    - target_process
    - element_mapping
    - lossiness_report
    - reversibility_test
    - final_verdict
    - proof_signature

  properties:
    # === PROOF METADATA ===
    proof_version:
      type: string
      const: "1.0"
      description: "Schema version for this proof document"

    generated_at:
      type: string
      format: date-time
      description: "When this proof was generated"

    method_used:
      type: string
      const: "#160 (Transformation Proof)"
      description: "Method that generated this proof"

    # === SOURCE PROCESS (UPS) ===
    source_process:
      type: object
      required: [ups_id, source_system, element_count, flow_count]
      properties:
        ups_id:
          type: string
          description: "ID from universal-process-schema"
        source_system:
          type: string
          description: "Original system (BPMN, Confluence, etc.)"
        element_count:
          type: integer
          minimum: 0
          description: "Total elements in source"
        flow_count:
          type: integer
          minimum: 0
          description: "Total flows in source"
        source_version:
          type: string
          description: "Version in source system"

    # === TARGET PROCESS (SRE-Convergent) ===
    target_process:
      type: object
      required: [proc_id, artifact_count, edge_count]
      properties:
        proc_id:
          type: string
          pattern: "^PROC-[A-Z0-9-]+$"
          description: "Process ID in Deep-Process format"
        artifact_count:
          type: integer
          minimum: 0
          description: "Total artifacts created"
        edge_count:
          type: integer
          minimum: 0
          description: "Total edges in dependency graph"
        step_count:
          type: integer
          minimum: 0
          description: "Total steps in process definition"

    # === ELEMENT MAPPING (Bijection) ===
    element_mapping:
      type: array
      items:
        type: object
        required: [source_ups_id, mapping_type]
        properties:
          source_ups_id:
            type: string
            description: "Element ID from UPS"

          target_dp_id:
            type: string
            nullable: true
            description: "Element ID in Deep-Process (null if unmapped)"

          mapping_type:
            type: string
            enum:
              - direct       # 1:1 mapping, semantic equivalence
              - split        # 1:N mapping (one source → many targets)
              - merge        # N:1 mapping (many sources → one target)
              - transform    # Semantic transformation (type change)
              - unmapped     # Could not map (loss)
            description: "How the mapping was performed"

          confidence:
            type: number
            minimum: 0
            maximum: 1
            description: "Confidence in mapping correctness (1 = certain)"

          notes:
            type: string
            description: "Explanation of mapping decision"

    # === FLOW MAPPING ===
    flow_mapping:
      type: array
      items:
        type: object
        properties:
          source_flow:
            type: string
            description: "Flow identifier from UPS (from→to)"
          target_edge:
            type: string
            description: "Edge identifier in state.json"
          mapping_type:
            type: string
            enum: [direct, transformed, unmapped]

    # === LOSSINESS REPORT ===
    lossiness_report:
      type: object
      required:
        - total_source_elements
        - mapped_elements
        - unmapped_elements
        - lossiness_score
        - verdict
      properties:
        total_source_elements:
          type: integer
          description: "Total elements in source (T)"

        mapped_elements:
          type: integer
          description: "Elements successfully mapped"

        unmapped_elements:
          type: integer
          description: "Elements that could not be mapped (U)"

        lossiness_score:
          type: number
          minimum: 0
          maximum: 1
          description: |
            L = (U + S) / T
            Where:
            - U = count of unmapped elements
            - S = sum of (semantic_loss × severity_weight)
            - T = total source elements

            0 = lossless, 1 = total loss

        lossiness_formula:
          type: string
          default: "(unmapped + semantic_loss) / total"
          description: "Formula used to calculate lossiness"

        semantic_losses:
          type: array
          items:
            type: object
            required: [element, lost_property, severity]
            properties:
              element:
                type: string
                description: "Element where loss occurred"
              lost_property:
                type: string
                description: "Property that was lost"
              severity:
                type: string
                enum:
                  - info       # Weight: 0.1
                  - warning    # Weight: 0.5
                  - critical   # Weight: 1.0
                description: "Impact severity"
              mitigation:
                type: string
                description: "How this loss is mitigated"

        verdict:
          type: string
          enum:
            - LOSSLESS           # L = 0
            - ACCEPTABLE_LOSS    # L < 0.1, no critical losses
            - SIGNIFICANT_LOSS   # L < 0.3, has critical losses
            - UNACCEPTABLE       # L >= 0.3
          description: "Lossiness verdict"

    # === REVERSIBILITY TEST (Method #114 applied to transformation) ===
    reversibility_test:
      type: object
      required: [executed, verdict]
      properties:
        executed:
          type: boolean
          description: "Whether reverse transformation was attempted"

        executed_at:
          type: string
          format: date-time
          description: "When reverse transformation was executed"

        reverse_transformation:
          type: object
          description: "Results of reverse transformation"
          properties:
            attempted:
              type: boolean
            result_ups_id:
              type: string
              description: "ID of reconstructed UPS"

            # Compare original vs reverse-transformed
            structural_delta:
              type: number
              minimum: 0
              maximum: 1
              description: "Difference in structure (0 = identical)"

            semantic_delta:
              type: number
              minimum: 0
              maximum: 1
              description: "Difference in meaning (0 = identical)"

            missing_elements:
              type: array
              items:
                type: string
              description: "Elements that couldn't be reconstructed"

            added_elements:
              type: array
              items:
                type: string
              description: "Elements added in reverse (shouldn't exist)"

        reversibility_score:
          type: number
          minimum: 0
          maximum: 1
          description: |
            R = 1 - (|E_missing| + |E_changed|) / |E_original|

            1 = fully reversible, 0 = irreversible

        verdict:
          type: string
          enum:
            - REVERSIBLE           # R = 1
            - MOSTLY_REVERSIBLE    # R > 0.9
            - PARTIALLY_REVERSIBLE # R > 0.7
            - IRREVERSIBLE         # R <= 0.7
          description: "Reversibility verdict"

    # === FINAL VERDICT ===
    final_verdict:
      type: string
      enum:
        - PROVEN_LOSSLESS        # L = 0 AND R = 1
        - PROVEN_ACCEPTABLE      # L < 0.1 AND R > 0.9
        - DOCUMENTED_LOSSES      # L < 0.3 AND R > 0.7
        - TRANSFORMATION_FAILED  # else
      description: |
        Reference: SPECIFICATION.md Section 8.4.3

        | Lossiness | Reversibility | Verdict |
        |-----------|---------------|---------|
        | L = 0     | R = 1         | PROVEN_LOSSLESS |
        | L < 0.1   | R > 0.9       | PROVEN_ACCEPTABLE |
        | L < 0.3   | R > 0.7       | DOCUMENTED_LOSSES |
        | else      | else          | TRANSFORMATION_FAILED |

    # === PROOF SIGNATURE ===
    proof_signature:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
      description: "SHA256 hash of mapping for integrity verification"

    # === ADDITIONAL METADATA ===
    transformation_duration_ms:
      type: integer
      description: "How long the transformation took"

    validator:
      type: string
      description: "Who/what validated this proof"

    notes:
      type: string
      description: "Additional notes about the transformation"

# === VERDICT ACTIONS ===
verdict_actions:
  PROVEN_LOSSLESS:
    action: "Proceed with registration in _manifest.yaml"
    requires_approval: false

  PROVEN_ACCEPTABLE:
    action: "Proceed with registration, document losses"
    requires_approval: false

  DOCUMENTED_LOSSES:
    action: "Require human approval before registration"
    requires_approval: true
    escalation: "Create decision-point for approval"

  TRANSFORMATION_FAILED:
    action: "Block registration, require re-migration"
    requires_approval: true
    escalation: "Migration must be revised or human override required"

# === EXAMPLE ===
example:
  proof_version: "1.0"
  generated_at: "2026-02-05T10:00:00Z"
  method_used: "#160 (Transformation Proof)"

  source_process:
    ups_id: "ups-onboarding-v1"
    source_system: "Confluence"
    element_count: 15
    flow_count: 18

  target_process:
    proc_id: "PROC-ONBOARDING"
    artifact_count: 12
    edge_count: 14

  element_mapping:
    - source_ups_id: "ups-001"
      target_dp_id: "ARTIFACT-REVIEW-001"
      mapping_type: "direct"
      confidence: 1.0
      notes: "Task → Artifact (1:1)"

    - source_ups_id: "ups-005"
      target_dp_id: null
      mapping_type: "unmapped"
      confidence: 0
      notes: "Notification event has no DP equivalent"

  lossiness_report:
    total_source_elements: 15
    mapped_elements: 12
    unmapped_elements: 2
    lossiness_score: 0.08
    lossiness_formula: "(unmapped + semantic_loss) / total"
    semantic_losses:
      - element: "ups-005"
        lost_property: "email_notification_trigger"
        severity: "info"
        mitigation: "Document in process notes"
    verdict: "ACCEPTABLE_LOSS"

  reversibility_test:
    executed: true
    executed_at: "2026-02-05T10:05:00Z"
    reverse_transformation:
      attempted: true
      result_ups_id: "ups-onboarding-reverse-v1"
      structural_delta: 0.05
      semantic_delta: 0.03
      missing_elements: ["ups-005"]
      added_elements: []
    reversibility_score: 0.92
    verdict: "MOSTLY_REVERSIBLE"

  final_verdict: "PROVEN_ACCEPTABLE"
  proof_signature: "sha256:a1b2c3d4e5f6..."
