# Deep-Process v3.7 — State Schema
# The global registry that serves as the graph database
#
# v3.7 Changes:
# - Added version_history to nodes
# - Added propagation_mode to edges
# - Added new statuses: STALE_DEFERRED, COMMITTED_PINNED
# - Added fork/join support
# - Added artifact hierarchy support (contains edge type)

schema_version: "3.7"
description: "Schema for .deep-process/state.json - the system's memory"

state:
  type: object
  required:
    - version
    - initialized_at
    - last_modified
    - nodes
    - edges
    - transactions

  properties:
    version:
      type: string
      pattern: "^3\\.7(\\.\\d+)?$"
      description: "Deep-Process version"

    initialized_at:
      type: string
      format: date-time
      description: "When the system was bootstrapped"

    last_modified:
      type: string
      format: date-time
      description: "Last state update timestamp"

    current_saga:
      type: string
      nullable: true
      description: "Active transaction ID (null if none)"

    nodes:
      type: object
      description: "All artifacts, processes, decision-points in the graph"
      additionalProperties:
        $ref: "#/definitions/node"

    edges:
      type: array
      items:
        $ref: "#/definitions/edge"
      description: "Dependency relationships between nodes"

    transactions:
      type: array
      items:
        $ref: "#/definitions/transaction"
      description: "Transaction log for rollback support"

definitions:
  node:
    type: object
    required:
      - dp_id
      - dp_type
      - dp_status
      - path
      - semantic_hash
    properties:
      dp_id:
        type: string
        pattern: "^[A-Z]+-[A-Z0-9-]+$"
        description: "Unique identifier (e.g., EPIC-USER-LOGIN)"

      dp_type:
        type: string
        enum: [artifact, process, decision-point, agent]
        description: "Node type"

      dp_status:
        type: string
        enum:
          - NOW                    # Being created/edited
          - STALE                  # Needs immediate update (IMMEDIATE propagation)
          - STALE_DEFERRED         # Has pending update but not urgent (DEFERRED) [NEW v3.7]
          - COMMITTED              # Valid and current
          - COMMITTED_PINNED       # Valid, ignoring parent changes (VERSION_PINNED) [NEW v3.7]
          - FAILED                 # Validation failed
          - AWAITING_USER_INPUT    # Decision point pending
          - BLOCKED                # Dependency issue
        description: "Current status"

      path:
        type: string
        description: "Relative path to the file"

      semantic_hash:
        type: array
        items:
          type: string
        description: "List of facts that must remain true"

      created_at:
        type: string
        format: date-time

      modified_at:
        type: string
        format: date-time

      origin:
        type: string
        enum: [created, migrated, generated]
        default: created

      active_methods:
        type: array
        items:
          type: integer
        description: "Methods injected for this node"

      # === VERSION TRACKING [NEW v3.7] ===
      current_version:
        type: integer
        default: 1
        description: "Current version number"

      version_history:
        type: array
        items:
          $ref: "#/definitions/version_entry"
        description: "History of all versions"

      # === ARTIFACT HIERARCHY [NEW v3.7] ===
      artifact_type:
        type: string
        nullable: true
        description: "Type defined by process (e.g., EPIC, STORY) - only for artifacts"

      parent_artifact:
        type: string
        nullable: true
        description: "Parent artifact dp_id (null for root artifacts)"

      children:
        type: array
        items:
          type: string
        description: "Child artifact dp_ids"
        default: []

      depth_level:
        type: integer
        minimum: 0
        nullable: true
        description: "Depth in artifact hierarchy (0 = root)"

      instance_id:
        type: string
        nullable: true
        description: "Instance this artifact belongs to"

      # === PARALLEL PATHS [NEW v3.7] ===
      branch:
        type: string
        nullable: true
        description: "Which parallel branch this node belongs to"

      fork_origin:
        type: string
        nullable: true
        description: "Which fork created this branch"

  # === VERSION ENTRY [NEW v3.7] ===
  version_entry:
    type: object
    required: [version, semantic_hash, committed_at]
    properties:
      version:
        type: integer
      semantic_hash:
        type: array
        items:
          type: string
        description: "Facts at this version"
      committed_at:
        type: string
        format: date-time
      committed_by:
        type: string
        description: "Who/what committed this version"
      change_summary:
        type: string
        description: "What changed from previous version"
      snapshot_path:
        type: string
        description: "Path to full content snapshot (for rollback)"

  edge:
    type: object
    required:
      - from
      - to
      - type
    properties:
      from:
        type: string
        description: "Source node dp_id"

      to:
        type: string
        description: "Target node dp_id"

      type:
        type: string
        enum:
          - semantic_source    # Changes invalidate content
          - hard_constraint    # Changes invalidate logic
          - weak_reference     # Informational link
          - blocks             # Dependency blocker
          - contains           # Artifact containment [NEW v3.7]
        description: "Dependency type"

      # === PROPAGATION MODE [NEW v3.7] ===
      propagation_mode:
        type: string
        enum:
          - IMMEDIATE          # Changes propagate instantly (default)
          - DEFERRED           # Flag for update but don't force
          - VERSION_PINNED     # Lock to specific parent version
          - CONDITIONAL        # Propagate only if condition met
        default: IMMEDIATE
        description: "How changes propagate (SPECIFICATION.md Section 4.4)"

      pinned_version:
        type: integer
        nullable: true
        description: "For VERSION_PINNED: which parent version to use"

      propagation_condition:
        type: string
        nullable: true
        description: "For CONDITIONAL: expression to evaluate"

      last_propagated_at:
        type: string
        format: date-time
        nullable: true

      deferred_since:
        type: string
        format: date-time
        nullable: true
        description: "For DEFERRED: when change was detected but not applied"

      created_at:
        type: string
        format: date-time

  transaction:
    type: object
    required:
      - saga_id
      - status
      - started_at
      - operations
    properties:
      saga_id:
        type: string
        pattern: "^tx-[0-9]+$"
        description: "Transaction identifier"

      status:
        type: string
        enum: [PENDING, COMMITTED, ROLLED_BACK]

      started_at:
        type: string
        format: date-time

      completed_at:
        type: string
        format: date-time
        nullable: true

      operations:
        type: array
        items:
          type: object
          properties:
            type:
              type: string
              enum:
                - CREATE
                - UPDATE
                - DELETE
                - FLAG_STALE
                - EXTEND        # Add artifact to instance [NEW v3.7]
                - ADD_EDGE      # Add edge [NEW v3.7]
            target:
              type: string
              description: "dp_id of affected node"
            backup_path:
              type: string
              description: "Path to backup file for rollback"

# Example state.json
example:
  version: "3.6"
  initialized_at: "2025-01-30T10:00:00Z"
  last_modified: "2025-01-30T14:30:00Z"
  current_saga: null
  nodes:
    VISION-001:
      dp_id: "VISION-001"
      dp_type: "artifact"
      dp_status: "COMMITTED"
      path: "artifacts/vision.md"
      semantic_hash:
        - "Target: Small teams (2-10 developers)"
        - "Core value: Speed over perfection"
        - "Platform: Web-first, mobile later"
      created_at: "2025-01-30T10:05:00Z"
      modified_at: "2025-01-30T10:05:00Z"
      origin: "created"
      active_methods: [71, 79, 152]

    ARCH-001:
      dp_id: "ARCH-001"
      dp_type: "artifact"
      dp_status: "STALE"
      path: "artifacts/architecture.md"
      semantic_hash:
        - "Pattern: Modular monolith"
        - "Database: PostgreSQL"
        - "API: REST + WebSocket"
      created_at: "2025-01-30T11:00:00Z"
      modified_at: "2025-01-30T12:00:00Z"
      origin: "created"
      active_methods: [87, 114, 154]

  edges:
    - from: "ARCH-001"
      to: "VISION-001"
      type: "semantic_source"
      created_at: "2025-01-30T11:00:00Z"

  transactions:
    - saga_id: "tx-0001"
      status: "COMMITTED"
      started_at: "2025-01-30T10:05:00Z"
      completed_at: "2025-01-30T10:05:30Z"
      operations:
        - type: "CREATE"
          target: "VISION-001"
          backup_path: null
