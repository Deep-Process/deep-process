# Fork-Join Schema v1.0
# Reference: SPECIFICATION.md Section 5.1
#
# PURPOSE: Defines parallel path (structural independence) in process definitions.
#
# KEY PRINCIPLE (METHOD #71 First Principles):
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  PARALLEL PATHS = STRUCTURAL INDEPENDENCE                                   │
# │                                                                             │
# │  NOT about: Running things at the same wall-clock time                      │
# │  IS about:  Declaring that elements have no sequential dependency           │
# │                                                                             │
# │  FORK:  "After step A, both B and C can proceed independently"             │
# │  JOIN:  "Step D requires both B and C to be complete"                      │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# METHOD #79 (Operational Definition):
# - "Parallel" = no depends_on relationship between branches
# - "Fork" = point where single path splits into multiple independent paths
# - "Join" = point where multiple paths must converge before continuing

schema_version: "1.0"
framework_version: "3.7"

description: |
  Schema for fork/join gates in process definitions.

  Fork and Join are step types in process.yaml that declare
  structural independence (parallelism) between process paths.

  Note: Deep-Process defines STRUCTURAL parallelism (independence),
  not runtime parallelism. Actual execution order depends on LLM/Operator.

definitions:
  # === FORK (Parallel Split) ===
  fork:
    type: object
    description: "Parallel split point - declares independent branches"
    required: [id, type, after, branches]

    properties:
      id:
        type: string
        pattern: "^fork-[0-9]+$"
        description: "Unique fork identifier"
        examples:
          - "fork-01"
          - "fork-02"

      type:
        type: string
        const: "fork"
        description: "Step type marker"

      name:
        type: string
        description: "Human-readable name for this fork"
        examples:
          - "Begin parallel analysis"
          - "Split technical and business tracks"

      after:
        type: string
        description: "Step ID that triggers this fork"
        examples:
          - "step-01"

      branches:
        type: array
        minItems: 2
        description: "At least 2 branches for meaningful parallelism"
        items:
          type: object
          required: [branch_id, starts_with]
          properties:
            branch_id:
              type: string
              pattern: "^branch-[a-z0-9-]+$"
              description: "Unique branch identifier"
              examples:
                - "branch-tech"
                - "branch-business"
                - "branch-legal"

            name:
              type: string
              description: "Human-readable branch name"

            starts_with:
              type: string
              description: "First step ID in this branch"

            description:
              type: string
              description: "What this branch accomplishes"

            # === RUNTIME STATE ===
            status:
              type: string
              enum:
                - PENDING     # Not yet started
                - ACTIVE      # In progress
                - COMPLETED   # All steps in branch done
                - BLOCKED     # Waiting for something
                - FAILED      # Branch failed
              default: "PENDING"
              description: "Current branch status"

            started_at:
              type: string
              format: date-time
              description: "When this branch started"

            completed_at:
              type: string
              format: date-time
              description: "When this branch completed"

            progress:
              type: number
              minimum: 0
              maximum: 100
              description: "Branch completion percentage"

      # === FORK RUNTIME STATE ===
      fork_status:
        type: string
        enum:
          - PENDING     # Fork not yet reached
          - ACTIVE      # At least one branch active
          - COMPLETED   # All branches completed (or enough for join)
        default: "PENDING"

      activated_at:
        type: string
        format: date-time
        description: "When fork was activated"

  # === JOIN (Parallel Merge) ===
  join:
    type: object
    description: "Parallel merge point - waits for branches to complete"
    required: [id, type, requires_branches, join_type]

    properties:
      id:
        type: string
        pattern: "^join-[0-9]+$"
        description: "Unique join identifier"
        examples:
          - "join-01"
          - "join-02"

      type:
        type: string
        const: "join"
        description: "Step type marker"

      name:
        type: string
        description: "Human-readable name for this join"
        examples:
          - "Merge analyses"
          - "Combine results"

      requires_branches:
        type: array
        items:
          type: string
        description: "Branch IDs that must complete (based on join_type)"
        examples:
          - ["branch-tech", "branch-business"]

      join_type:
        type: string
        enum:
          - AND      # All branches must complete
          - OR       # Any one branch completes
          - N_OF_M   # N out of M branches
        description: |
          How many branches must complete before join proceeds.

          AND:    All branches in requires_branches must be COMPLETED
          OR:     Any one branch in requires_branches becomes COMPLETED
          N_OF_M: At least n_required branches must be COMPLETED

      n_required:
        type: integer
        minimum: 1
        description: "For N_OF_M: how many branches are required"

      creates:
        type: string
        description: "Step ID created after join completes"
        examples:
          - "step-03"

      # === JOIN RUNTIME STATE ===
      branches_completed:
        type: array
        items:
          type: string
        description: "Branch IDs that have completed"
        default: []

      join_status:
        type: string
        enum:
          - WAITING    # Waiting for branches
          - READY      # Enough branches completed, can proceed
          - COMPLETED  # Join has executed
        default: "WAITING"

      ready_at:
        type: string
        format: date-time
        description: "When join became ready"

      completed_at:
        type: string
        format: date-time
        description: "When join executed"

# === JOIN TYPE LOGIC ===
join_type_logic:
  AND:
    description: "All branches must complete"
    formula: "join.ready ⟺ ALL(branch.status = COMPLETED for branch in requires_branches)"
    use_case: "When all parallel work must converge (e.g., all reviews done)"

  OR:
    description: "Any one branch completes"
    formula: "join.ready ⟺ ANY(branch.status = COMPLETED for branch in requires_branches)"
    use_case: "When first result wins (e.g., first available option)"

  N_OF_M:
    description: "N out of M branches complete"
    formula: "join.ready ⟺ COUNT(COMPLETED) >= n_required"
    use_case: "When quorum needed (e.g., 2 of 3 approvers)"

# === PROCESS.YAML INTEGRATION ===
process_yaml_example:
  steps:
    - id: "step-01"
      name: "Initial analysis"
      type: "artifact"
      produces: "initial-analysis.md"

    # FORK: After step-01, both paths can proceed independently
    - id: "fork-01"
      type: "fork"
      name: "Begin parallel work"
      after: "step-01"
      branches:
        - branch_id: "branch-tech"
          name: "Technical Track"
          starts_with: "step-02a"
        - branch_id: "branch-business"
          name: "Business Track"
          starts_with: "step-02b"

    # Branch A (Technical)
    - id: "step-02a"
      name: "Technical analysis"
      type: "artifact"
      branch: "branch-tech"
      produces: "tech-analysis.md"

    - id: "step-03a"
      name: "Technical design"
      type: "artifact"
      branch: "branch-tech"
      depends_on: ["step-02a"]
      produces: "tech-design.md"

    # Branch B (Business)
    - id: "step-02b"
      name: "Business analysis"
      type: "artifact"
      branch: "branch-business"
      produces: "business-analysis.md"

    - id: "step-03b"
      name: "Business requirements"
      type: "artifact"
      branch: "branch-business"
      depends_on: ["step-02b"]
      produces: "business-reqs.md"

    # JOIN: Requires both branches complete
    - id: "join-01"
      type: "join"
      name: "Merge analyses"
      requires_branches: ["branch-tech", "branch-business"]
      join_type: "AND"
      creates: "step-04"

    - id: "step-04"
      name: "Integrated design"
      type: "artifact"
      depends_on: ["join-01"]
      produces: "integrated-design.md"

# === DISPLAY IN SENSE ===
display:
  format: |
    Równoległe ścieżki (fork-01):
      branch-tech:     [=====>    ] 60% (ACTIVE)
      branch-business: [===       ] 30% (ACTIVE)

    Join (join-01): Wymaga: branch-tech AND branch-business
                    Status: WAITING (0/2 complete)

  status_icons:
    PENDING: "⏳"
    ACTIVE: "🔄"
    COMPLETED: "✅"
    BLOCKED: "🚫"
    FAILED: "❌"
    WAITING: "⏸️"
    READY: "▶️"

# === VALIDATION RULES ===
validation:
  rules:
    - name: "fork_has_branches"
      description: "Every fork must have at least 2 branches"
      severity: "CRITICAL"

    - name: "branch_starts_exist"
      description: "Every branch.starts_with must reference an existing step"
      severity: "CRITICAL"

    - name: "join_references_valid_branches"
      description: "Every branch in join.requires_branches must exist in a fork"
      severity: "CRITICAL"

    - name: "n_of_m_valid"
      description: "For N_OF_M joins, n_required <= len(requires_branches)"
      severity: "ERROR"

    - name: "steps_have_branch"
      description: "Steps between fork and join must have branch attribute"
      severity: "WARNING"

    - name: "no_cross_branch_depends"
      description: "Steps in one branch cannot depend_on steps in another branch"
      severity: "ERROR"

    - name: "fork_join_paired"
      description: "Every fork should have a corresponding join (warning if not)"
      severity: "WARNING"

# === STATE.JSON INTEGRATION ===
state_integration:
  description: |
    Fork and Join states are tracked in .deep-process/state.json

  state_additions:
    forks:
      type: array
      items:
        $ref: "#/definitions/fork"
      description: "All forks in active processes"

    joins:
      type: array
      items:
        $ref: "#/definitions/join"
      description: "All joins in active processes"

  node_extensions:
    branch:
      type: string
      nullable: true
      description: "Which parallel branch this node belongs to"

    fork_origin:
      type: string
      nullable: true
      description: "Which fork created this branch"
