# Deep-Process v3.7 — Universal Contract Schema
# YAML header required for every artifact
#
# v3.7 Changes:
# - Added new statuses: STALE_DEFERRED, COMMITTED_PINNED
# - Added artifact_type, parent_artifact, instance_id, depth_level
# - Added propagation_mode to dependencies
# - Added version tracking (current_version)

schema_version: "3.7"
description: "Universal Contract that every .md file in artifacts/ must have"

contract:
  type: object
  required:
    - dp_id
    - dp_type
    - dp_status
    - version
    - context
    - semantic_hash
    - transaction

  properties:
    dp_id:
      type: string
      pattern: "^[A-Z]+-[A-Z0-9-]+$"
      description: |
        Unique identifier following naming convention:
        - VISION-XXX for vision documents
        - ARCH-XXX for architecture
        - EPIC-XXX for epics
        - TASK-XXX for tasks
        - PROC-XXX for processes
        - DP-XXX for decision points
      examples:
        - "EPIC-USER-LOGIN"
        - "ARCH-DATABASE-DESIGN"
        - "PROC-MIGRATION-LEGACY"

    dp_type:
      type: string
      enum:
        - artifact      # Content document (vision, arch, epic, etc.)
        - process       # Executable procedure
        - decision-point # Human-in-the-loop checkpoint
        - agent         # Role manifest
      description: "Type of the document"

    dp_status:
      type: string
      enum:
        - NOW                 # Currently being worked on
        - STALE               # Needs immediate update (IMMEDIATE propagation)
        - STALE_DEFERRED      # Needs update but not urgent (DEFERRED) [v3.7]
        - COMMITTED           # Validated and saved
        - COMMITTED_PINNED    # Valid, ignoring parent changes (VERSION_PINNED) [v3.7]
        - FAILED              # Validation failed
        - AWAITING_USER_INPUT # Decision point waiting for human
        - BLOCKED             # Cannot proceed (dependency blocked)
      description: "Current status in the workflow"

    version:
      type: string
      const: "3.7"
      description: "Deep-Process version (must be 3.7)"

    context:
      type: object
      required:
        - depends_on
      properties:
        depends_on:
          type: array
          items:
            type: object
            required:
              - path
              - type
            properties:
              path:
                type: string
                description: "Relative path to dependency"
              type:
                type: string
                enum:
                  - semantic_source  # Changes invalidate content
                  - hard_constraint  # Changes invalidate logic
                  - weak_reference   # Informational only
                description: "How strongly this dependency affects the node"

              # === PROPAGATION MODE [NEW v3.7] ===
              propagation_mode:
                type: string
                enum:
                  - IMMEDIATE       # Changes propagate instantly (default)
                  - DEFERRED        # Flag for update but not urgent
                  - VERSION_PINNED  # Lock to specific parent version
                  - CONDITIONAL     # Propagate only if condition met
                default: IMMEDIATE
                description: "How changes propagate from parent (SPECIFICATION.md Section 4.4)"

              pinned_version:
                type: integer
                nullable: true
                description: "For VERSION_PINNED: which parent version to use"

              propagation_condition:
                type: string
                nullable: true
                description: "For CONDITIONAL: expression to evaluate"
          description: "List of dependencies"

        source_id:
          type: string
          description: "Original source for lineage tracking"

        tags:
          type: array
          items:
            type: string
          description: "Classification tags"

    # === ARTIFACT HIERARCHY [NEW v3.7] ===
    artifact_type:
      type: string
      nullable: true
      description: |
        Type defined by process (e.g., EPIC, STORY, TASK).
        Only for artifacts that participate in hierarchy.
        This is a GENERIC string, not an enum - types are defined by each process.

    parent_artifact:
      type: string
      nullable: true
      description: |
        dp_id of parent artifact (null for root artifacts).
        Parent-child relationships are between ARTIFACTS, not instances.

    instance_id:
      type: string
      nullable: true
      description: |
        Instance this artifact belongs to.
        All artifacts in a hierarchy belong to the SAME instance.

    depth_level:
      type: integer
      minimum: 0
      nullable: true
      description: |
        Depth in artifact hierarchy (0 = root).
        Used for visualization and max_depth validation.

    children:
      type: array
      items:
        type: string
      default: []
      description: "dp_ids of child artifacts"

    # === VERSION TRACKING [NEW v3.7] ===
    current_version:
      type: integer
      default: 1
      description: "Current version number of this artifact"

    semantic_hash:
      type: array
      items:
        type: string
        minLength: 5
      minItems: 1
      description: |
        List of facts that must remain true regardless of text rewrites.
        These are the "ground truth" of the document.
        Format: "Category: Specific fact"
      examples:
        - "Auth: OAuth2 via Google"
        - "MFA: Required for Admin"
        - "Session: 24h JWT"
        - "Platform: Web-first"

    execution:
      type: object
      properties:
        active_methods:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 166
          description: "Method numbers injected by PM for this artifact"

        logic_gates:
          type: object
          additionalProperties:
            type: string
          description: "Conditional execution paths"

        constraints:
          type: array
          items:
            type: string
          description: "Hard constraints that must not be violated"

    transaction:
      type: object
      required:
        - saga_id
      properties:
        saga_id:
          type: string
          pattern: "^tx-[0-9]+$"
          description: "Current transaction ID"

        previous_hash:
          type: string
          description: "Hash of previous version for rollback"

        checkpoint:
          type: string
          format: date-time
          description: "When this version was checkpointed"

# Template for new artifacts
template: |
  ---
  dp_id: "{TYPE}-{NAME}"
  dp_type: "artifact"
  dp_status: "NOW"
  version: "3.7"

  # Artifact hierarchy (optional, for hierarchical artifacts) [v3.7]
  artifact_type: null           # Set by process (e.g., "EPIC", "STORY")
  parent_artifact: null         # dp_id of parent artifact
  instance_id: null             # Instance this artifact belongs to
  depth_level: null             # Depth in hierarchy (0 = root)
  children: []                  # Child artifact dp_ids
  current_version: 1            # Version tracking

  context:
    depends_on:
      - path: "artifacts/vision.md"
        type: "semantic_source"
        propagation_mode: "IMMEDIATE"  # [v3.7]

  semantic_hash:
    - "Fact 1: Description"
    - "Fact 2: Description"

  execution:
    active_methods: []
    logic_gates: {}

  transaction:
    saga_id: "tx-XXXX"
    previous_hash: null
  ---

  # {Title}

  ## Overview

  {Content goes here}

  ## Details

  {More content}
