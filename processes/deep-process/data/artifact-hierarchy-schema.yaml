# Artifact Hierarchy Schema v1.0
# Reference: SPECIFICATION.md Section 2.3
#
# PURPOSE: Tracks parent-child relationships between artifacts WITHIN a single instance.
#
# KEY PRINCIPLE (METHOD #71 First Principles):
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  SELF-EXTENSION = ARTIFACT HIERARCHY WITHIN INSTANCE                        │
# │                                                                             │
# │  NOT: Instance spawns child instances (WRONG!)                              │
# │  IS:  Instance extends itself with more artifacts internally                │
# │                                                                             │
# │  The instance is a CONTAINER for artifacts.                                 │
# │  Artifacts form parent-child relationships WITHIN the instance.             │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# METHOD #100 (Vocabulary Consistency):
# - "artifact" = document within instance
# - "parent_artifact" = artifact containing other artifacts
# - "instance" = container for all artifacts (ONE level, not hierarchy)
# - BANNED: "parent_instance", "child_instance", "spawn"

schema_version: "1.0"
framework_version: "3.7"

description: |
  Schema for artifact hierarchy WITHIN a single instance.

  This file is stored at: .deep-process/artifact-hierarchy.json
  Or embedded in: .deep-process/state.json (edges with type: "contains")

  IMPORTANT: There is NO instance hierarchy. Only artifact hierarchy
  within a single instance. All artifacts belong to ONE instance.

artifact_hierarchy:
  type: object
  required: [instance_id, root_artifacts, artifact_tree]

  properties:
    # === INSTANCE IDENTITY ===
    instance_id:
      type: string
      pattern: "^[a-z0-9-]+-[0-9]{3}$"
      description: "The instance this hierarchy belongs to"
      examples:
        - "project-alpha-001"
        - "sprint-planning-042"

    # === ROOT ARTIFACTS ===
    root_artifacts:
      type: array
      items:
        type: string
      description: "DP IDs of top-level artifacts (depth=0)"
      examples:
        - ["VISION-001", "SCOPE-001", "CONSTRAINTS-001"]

    # === ARTIFACT TREE ===
    artifact_tree:
      type: object
      additionalProperties:
        $ref: "#/definitions/artifact_node"
      description: "Map of dp_id → artifact_node"

    # === HIERARCHY METADATA ===
    max_depth_reached:
      type: integer
      minimum: 0
      description: "Current maximum depth in this hierarchy"

    total_artifacts:
      type: integer
      minimum: 0
      description: "Total number of artifacts in this instance"

    last_extended_at:
      type: string
      format: date-time
      description: "When the last artifact was added"

definitions:
  artifact_node:
    type: object
    required: [dp_id, artifact_type, depth]
    properties:
      # === IDENTITY ===
      dp_id:
        type: string
        description: "Artifact DP ID (unique within instance)"

      artifact_type:
        type: string
        description: |
          Type defined by process (e.g., PHASE, MODULE, STEP - any string).

          NOT an enum - types are defined by each process, not the framework.

          Examples by domain:
          - Software: VISION, EPIC, STORY, TASK
          - Documentation: DOCUMENT, CHAPTER, SECTION
          - Research: STUDY, PHASE, EXPERIMENT
        examples:
          - "EPIC"
          - "STORY"
          - "PHASE"
          - "MODULE"

      # === HIERARCHY POSITION ===
      depth:
        type: integer
        minimum: 0
        description: "Depth level in hierarchy (0 = root, 1 = first children, etc.)"

      depth_label:
        type: string
        description: "Human-friendly label from process.yaml depth_labels config"
        examples:
          - "Project"
          - "Epic"
          - "Story"
          - "Task"

      # === PARENT RELATIONSHIP ===
      parent_artifact:
        type: string
        nullable: true
        description: |
          Parent artifact DP ID (null for root artifacts).

          NOTE: This is parent ARTIFACT, not parent INSTANCE.
          All artifacts are in the SAME instance.

      # === CHILDREN ===
      children:
        type: array
        items:
          type: string
        description: "Child artifact DP IDs (within same instance)"
        default: []

      # === FILE LOCATION ===
      file_path:
        type: string
        description: "Relative path to artifact file within instance folder"
        examples:
          - "vision.md"
          - "epics/epic-auth.md"
          - "epics/stories/story-login.md"

      # === STATUS ===
      status:
        type: string
        enum:
          - NOW                    # Being created/edited
          - STALE                  # Needs update (parent changed)
          - STALE_DEFERRED         # Needs update (low priority)
          - COMMITTED              # Valid and current
          - COMMITTED_PINNED       # Valid, ignoring parent changes
          - BLOCKED                # Blocked by dependency
          - FAILED                 # Validation failed
          - AWAITING_USER_INPUT    # Decision point pending
        description: "Artifact status (from contract)"

      # === PROGRESS ===
      progress:
        type: number
        minimum: 0
        maximum: 100
        description: "Completion percentage"

      # === CONTEXT INHERITANCE ===
      context_from_parent:
        type: object
        additionalProperties: true
        description: |
          Context inherited from parent artifact.
          Defined by process.yaml context_inheritance mappings.
        examples:
          - parent_name: "User Authentication"
            parent_id: "EPIC-AUTH-001"

      # === TIMESTAMPS ===
      created_at:
        type: string
        format: date-time

      updated_at:
        type: string
        format: date-time

# === AGGREGATION RULES ===
aggregation:
  description: |
    Instance completion depends on ALL contained artifacts.
    Configured in process.yaml self_extension.aggregation section.

  strategies:
    ALL_ARTIFACTS:
      description: "Instance completes when ALL artifacts are COMMITTED"
      formula: "instance.status = COMPLETED ⟺ ALL artifacts.status = COMMITTED"

    ANY_ARTIFACT:
      description: "Instance completes when ANY artifact is COMMITTED"
      formula: "instance.status = COMPLETED ⟺ ANY artifact.status = COMMITTED"

    N_OF_M:
      description: "Instance completes when N of M artifacts are COMMITTED"
      formula: "instance.status = COMPLETED ⟺ COUNT(COMMITTED) >= N"
      requires: ["n_required"]

    MANUAL:
      description: "Instance completion requires explicit user action"

  progress_formula: |
    instance.progress = weighted_average(artifact_progress by depth_level)

    Example:
    - Root artifacts (depth 0): weight 1.0
    - Level 1 artifacts: weight 0.8
    - Level 2 artifacts: weight 0.6

# === EXAMPLE ===
example:
  instance_id: "project-alpha-001"
  root_artifacts: ["VISION-001", "SCOPE-001"]
  max_depth_reached: 2
  total_artifacts: 7
  last_extended_at: "2026-02-05T10:00:00Z"

  artifact_tree:
    VISION-001:
      dp_id: "VISION-001"
      artifact_type: "VISION"
      depth: 0
      depth_label: "Root"
      parent_artifact: null
      children: ["EPIC-AUTH-001", "EPIC-PAYMENT-001"]
      file_path: "vision.md"
      status: "COMMITTED"
      progress: 100
      created_at: "2026-01-15T10:00:00Z"

    EPIC-AUTH-001:
      dp_id: "EPIC-AUTH-001"
      artifact_type: "EPIC"
      depth: 1
      depth_label: "Epic"
      parent_artifact: "VISION-001"
      children: ["STORY-LOGIN-001", "STORY-LOGOUT-001"]
      file_path: "epics/epic-auth.md"
      status: "COMMITTED"
      progress: 60
      context_from_parent:
        vision_name: "Project Alpha"
        vision_id: "VISION-001"

    STORY-LOGIN-001:
      dp_id: "STORY-LOGIN-001"
      artifact_type: "STORY"
      depth: 2
      depth_label: "Story"
      parent_artifact: "EPIC-AUTH-001"
      children: []
      file_path: "epics/stories/story-login.md"
      status: "COMMITTED"
      progress: 100
      context_from_parent:
        epic_name: "User Authentication"
        epic_id: "EPIC-AUTH-001"

    STORY-LOGOUT-001:
      dp_id: "STORY-LOGOUT-001"
      artifact_type: "STORY"
      depth: 2
      depth_label: "Story"
      parent_artifact: "EPIC-AUTH-001"
      children: []
      file_path: "epics/stories/story-logout.md"
      status: "STALE"
      progress: 20

# === VALIDATION RULES ===
validation:
  rules:
    - name: "single_instance"
      description: "All artifacts must belong to the same instance_id"
      severity: "CRITICAL"

    - name: "valid_parent_references"
      description: "All parent_artifact values must reference existing artifact in tree"
      severity: "CRITICAL"

    - name: "no_parent_for_roots"
      description: "Root artifacts (in root_artifacts[]) must have parent_artifact: null"
      severity: "CRITICAL"

    - name: "depth_consistency"
      description: "Artifact depth = parent.depth + 1 (except roots which are 0)"
      severity: "ERROR"

    - name: "bidirectional_links"
      description: "If A.parent_artifact = B, then B.children must include A"
      severity: "ERROR"

    - name: "no_cycles"
      description: "Artifact hierarchy must be acyclic (DAG)"
      severity: "CRITICAL"

    - name: "max_depth_respected"
      description: "No artifact exceeds process.yaml max_depth"
      severity: "WARNING"

# === FILESYSTEM STRUCTURE ===
filesystem:
  description: |
    Artifact hierarchy is reflected in filesystem structure within instance folder.

  structure: |
    artifacts/processes/{instance-id}/         # ONE instance
    ├── instance-state.json                    # Instance-specific state
    ├── {root-artifact-1}.md                   # Artifact at depth 0
    ├── {root-artifact-2}.md                   # Artifact at depth 0
    │
    ├── {child-group-1}/                       # Folder for depth 1 artifacts
    │   ├── {child-artifact-1}.md              # Artifact at depth 1
    │   ├── {grandchild-1}.md                  # Artifact at depth 2
    │   └── {grandchild-2}.md                  # Artifact at depth 2
    │
    └── {child-group-2}/                       # Another depth 1 folder
        └── ...

  notes:
    - "Folders are optional organizational structure"
    - "file_path in artifact_node defines actual location"
    - "All files are within single instance folder"
