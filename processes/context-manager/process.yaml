---
# Context Manager Process
# Project state management and session continuity
---

process_name: context-manager
version: "2.0.0"
13_zasady_version: "1.0.0"
created: "2026-02-16"

# ═══════════════════════════════════════════════════════════════
# METADATA
# ═══════════════════════════════════════════════════════════════

metadata:
  category: ORCHESTRATION_SUPPORT
  complexity: MEDIUM

# ═══════════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════════

inputs:
  project_id:
    type: string
    required: true
    schema: "Unique project identifier"

  session_type:
    type: enum
    values: [NEW_SESSION, RESUME_SESSION, CONTEXT_UPDATE]
    required: true

  previous_artifacts:
    type: directory
    required: false
    schema: "artifacts/{project_id}/**/*.yaml"

  user_context:
    type: artifact
    required: false
    schema: "{user_preferences, project_goals}"

# ═══════════════════════════════════════════════════════════════
# PHASES (OODA STRUCTURE)
# ═══════════════════════════════════════════════════════════════

phases:
  phase_0_initialization:
    observe:
      action: "LOAD project_id + session_type + previous_artifacts IF exists"
      gate: "GATE_0_OBSERVED"

    orient:
      action: "CLASSIFY session_type + DETECT existing_project_state"
      assumptions: "DECLARE context_requirements per session_type"
      gate: "GATE_0_ORIENTED"

    decide:
      action: "IF NEW_SESSION THEN fresh_context ELIF RESUME_SESSION THEN reconstruct ELSE update"
      gate: "GATE_0_DECIDED"

    act:
      action: "CREATE session-config.yaml WITH strategy"
      gate: "GATE_0"

  phase_1_project_discovery:
    observe:
      action: "LOAD artifacts/{project_id}/ + session-config.yaml"
      gate: "GATE_1_OBSERVED"

    orient:
      action: "SCAN artifacts FOR project_metadata + completed_phases + active_processes"
      assumptions: "DECLARE artifact_discovery_patterns"
      gate: "GATE_1_ORIENTED"

    decide:
      action: "FOR EACH artifact IF valid THEN include ELSE skip"
      gate: "GATE_1_DECIDED"

    act:
      action: "CREATE project-inventory.yaml WITH discovered_artifacts"
      gate: "GATE_1"

  phase_2_state_reconstruction:
    observe:
      action: "LOAD project-inventory.yaml + ALL artifacts"
      gate: "GATE_2_OBSERVED"

    orient:
      action: "RECONSTRUCT project_state FROM artifacts USING timeline"
      assumptions: "DECLARE state_reconstruction_rules"
      gate: "GATE_2_ORIENTED"

    decide:
      action: "IF state_complete THEN proceed ELIF gaps_detected THEN flag ELSE infer_missing"
      gate: "GATE_2_DECIDED"

    act:
      action: "CREATE project-state.yaml WITH reconstructed_context"
      gate: "GATE_2"

  phase_3_context_compilation:
    observe:
      action: "LOAD project-state.yaml + user_context"
      gate: "GATE_3_OBSERVED"

    orient:
      action: "COMPILE active_context = project_state + user_preferences + session_info"
      assumptions: "DECLARE context_completeness_criteria"
      gate: "GATE_3_ORIENTED"

    decide:
      action: "IF context_sufficient THEN finalize ELSE request_clarification"
      gate: "GATE_3_DECIDED"

    act:
      action: "CREATE active-context.yaml WITH compiled_context"
      gate: "GATE_3"

  phase_4_handoff_preparation:
    observe:
      action: "LOAD active-context.yaml"
      gate: "GATE_4_OBSERVED"

    orient:
      action: "PREPARE handoff_document FOR orchestrator WITH context + next_steps"
      assumptions: "DECLARE handoff_requirements"
      gate: "GATE_4_ORIENTED"

    decide:
      action: "IF ready_for_handoff THEN finalize ELSE identify_missing"
      gate: "GATE_4_DECIDED"

    act:
      action: "CREATE context-handoff.yaml + session-log.yaml"
      gate: "GATE_4"

# ═══════════════════════════════════════════════════════════════
# OUTPUTS
# ═══════════════════════════════════════════════════════════════

outputs:
  session-config: {schema: "{session_type, strategy}", phase: 0}
  project-inventory: {schema: "{artifacts[], phases_completed[]}", phase: 1}
  project-state: {schema: "{timeline{}, current_phase, completeness}", phase: 2}
  active-context: {schema: "{project_state{}, user_context{}, session_info{}}", phase: 3}
  context-handoff: {schema: "{context{}, next_steps[]}", phase: 4}
  session-log: {schema: "{events[], timestamps[]}", phase: 4}

# ═══════════════════════════════════════════════════════════════
# VALIDATION GATES
# ═══════════════════════════════════════════════════════════════

validation_gates:
  GATE_0:
    condition: "session-config.yaml EXISTS AND strategy DEFINED"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_1:
    condition: "project-inventory.yaml EXISTS AND artifacts_discovered"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_2:
    condition: "project-state.yaml EXISTS AND state_reconstructed"
    on_fail: "EMIT_WARNING + PROCEED"
    severity: WARNING

  GATE_3:
    condition: "active-context.yaml EXISTS AND context_complete"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_4:
    condition: "context-handoff.yaml + session-log.yaml EXIST"
    on_fail: "HALT"
    severity: BLOCKER

# ═══════════════════════════════════════════════════════════════
# ERROR HANDLERS
# ═══════════════════════════════════════════════════════════════

error_handlers:
  missing_input:
    trigger: "project_id NOT PROVIDED OR empty"
    severity: CRITICAL
    action: "HALT WITH error_missing_project_id"
    recovery: "Request project identifier"

  invalid_input:
    trigger: "session_type NOT IN allowed_values"
    severity: HIGH
    action: "HALT WITH validation_error"
    recovery: "Use valid session type"

  partial_completion:
    trigger: "phase N reaches 70% THEN interrupted"
    severity: MEDIUM
    action: "SAVE checkpoint + HALT"
    recovery: "Resume from checkpoint"

  external_dependency_failure:
    trigger: "artifacts/ directory NOT ACCESSIBLE"
    severity: HIGH
    action: "USE empty_context + EMIT_WARNING"
    recovery: "Proceed with minimal context"

  timeout:
    trigger: "state_reconstruction > max_allowed"
    severity: HIGH
    action: "SAVE state + HALT WITH timeout_error"
    recovery: "User decides: continue OR skip_reconstruction"

  resource_exhaustion:
    trigger: "artifact_count > max_processable"
    severity: MEDIUM
    action: "PRIORITIZE by recency + REDUCE scope"
    recovery: "Process recent artifacts only"

  concurrent_modification:
    trigger: "artifacts CHANGED during reconstruction"
    severity: CRITICAL
    action: "RELOAD + RESTART from GATE_1"
    recovery: "Phase 1 re-execution"

  user_cancellation:
    trigger: "user_cancels DURING execution"
    severity: LOW
    action: "SAVE checkpoint + CLEANUP temp_files"
    recovery: "State saved for resume"

# ═══════════════════════════════════════════════════════════════
# COMPLIANCE
# ═══════════════════════════════════════════════════════════════

compliance_13_zasady:
  zasada_0_ooda: "PASS - 5 phases OODA"
  zasada_1_self_contained: "PASS - steps/*.md JIT"
  zasada_2_completeness: "PASS - ALL artifacts scanned GATE_1"
  zasada_3_mechanisms: "PASS - 5 gates IF-THEN"
  zasada_4_binding_gates: "PASS - BLOCKER enforcement"
  zasada_5_assumptions: "PASS - DECLARE each phase"
  zasada_6_evr: "PASS - observe→orient→act"
  zasada_7_checklists: "PASS - step files"
  zasada_8_counter_checks: "PASS - state verification phase_2"
  zasada_9_executable: "PASS - LOAD/CREATE/IF"
  zasada_10_visible_reasoning: "PASS - orient shows reconstruction"
  zasada_11_instruction_data: "PASS - schemas included"
  zasada_12_jit: "PASS - on-demand loading"
  zasada_13_zero_decoration: "PASS - no explanations"

---
# END context-manager process.yaml
