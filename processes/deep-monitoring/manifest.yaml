name: deep-monitoring
version: 1.0.0
description: Artifact-based post-execution process quality monitoring
type: monitoring

inputs:
  - process-log.yaml (from monitored process)
  - process-specific artifacts (risk-register.yaml, option_map.yaml, etc.)

outputs:
  - monitoring-report-[execution_id].md
  - monitoring-log.yaml

phases:
  - id: 0
    name: SETUP
    file: steps/step-00-setup.md
    gate: GATE_0
    required: true

  - id: 1
    name: COLLECT
    file: steps/step-01-collect.md
    gate: GATE_1
    required: true

  - id: 2
    name: ANALYZE
    file: steps/step-02-analyze.md
    gate: GATE_2
    required: true

  - id: 3
    name: DETECT
    file: steps/step-03-detect.md
    gate: GATE_3
    required: true

  - id: 4
    name: ASSESS
    file: steps/step-04-assess.md
    gate: GATE_4
    required: true

  - id: 5
    name: REPORT
    file: steps/step-05-report.md
    gate: GATE_5
    required: true

enforcement:
  sequential_execution: true
  binding_gates: true
  counter_checks_required: true
  assumptions_before_execution: true
  scope_reduction_protocol: enabled

monitoring_dimensions:
  - gate_results
  - assumption_declarations
  - counter_check_execution
  - evidence_ratio
  - scope_reductions
  - phase_completion
  - execution_completeness

thresholds:
  default:
    gates_passed_min: 80% # 80% of gates must pass
    counter_checks_min: 2  # 2 counter-checks per phase minimum
    verified_ratio_min: 30% # 30% evidence must be VERIFIED
    assumptions_declared_min: 1 # 1 assumption per phase minimum

verdicts:
  FAILED: "Critical process violations detected"
  INSUFFICIENT: "Execution completeness below acceptable threshold"
  MARGINAL: "Below quality thresholds but functional"
  PASSED_WITH_CONCERNS: "Completed with quality concerns"
  PASSED: "Executed within quality standards"

architecture:
  type: artifact_based
  timing: post_execution
  integration: hybrid # Can be embedded or centralized
  data_collection: artifact_inspection
  scope: configurable # GATE_ONLY | COMPREHENSIVE | SELECTIVE
