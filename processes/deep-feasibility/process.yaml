---
# Deep Feasibility Process V1.1.0
# Transformed to R1-R13 compliance (2026-02-11)
# Method-based transformation using 9 methods from methods.csv

metadata:
  name: "Deep Feasibility"
  version: "1.1.0"
  status: "OPERATIONAL"
  framework: "deep-process"
  category: "decision-analysis"
  author: "Deep-Process Framework"
  created: "2025-01-15"
  last_updated: "2026-02-11"
  transformation_date: "2026-02-11"

  description: |
    Multi-dimensional feasibility assessment process using 10 dimensions
    (Technical, Resource, Knowledge, Organizational, Temporal, Compositional,
    Economic, Scale, Cognitive, Dependency) with 4 depth levels (quick,
    standard, comprehensive, critical).

    V1.1.0 transformation achieved full R1-R13 compliance via:
    - Binding gates (6 gates, 32 conditions)
    - ENFORCED SEQUENCE in all 6 step files
    - Counter-checks (13 total: 3 global + 10 dimension-specific)
    - Just-in-time loading (workflow.md reduced 627→220 lines, -65%)
    - Zero decorative content (deleted 407 lines)
    - COMPLETENESS > TOKEN_ECONOMY priority

# ZASAD R1-R13 COMPLIANCE MATRIX
compliance:
  R1_self_contained:
    status: "✓ COMPLIANT"
    evidence: |
      All methods embedded in data/method-procedures/ (48 procedures).
      No external dependencies beyond Read/Write/Edit tools.
      Agent can execute process reading only deep-feasibility/ files.
    verification: "All method files exist in data/method-procedures/{001-505}*.md"

  R2_completeness_priority:
    status: "✓ COMPLIANT"
    evidence: |
      workflow.md lines 17-25 declares "COMPLETENESS > TOKEN_ECONOMY > DEPTH > AESTHETICS".
      GATE_2 condition G2-01 (BLOCKER) enforces ALL 10 dimensions scored.
      step-02-assess.md ENFORCED SEQUENCE requires ALL 10 dimensions (#201-210).
      No "main dimensions" or "typical constraints" shortcuts allowed.
    verification: "GATE_2 blocks if any of 10 dimensions missing (BLOCKER severity)"

  R3_mechanisms_not_intentions:
    status: "✓ COMPLIANT"
    evidence: |
      6 binding gates with 32 conditions using IF/THEN logic (gates.yaml).
      All steps use imperative commands (Read tool:, Execute:, Record:).
      VIOLATION CHECKS specify exact actions (HALT, ABORT, RERUN).
      No "should", "recommended", "will" language - only MUST/REQUIRED.
    verification: "gates.yaml uses only 'IF FAIL → action' format, not 'should'"

  R4_binding_gates:
    status: "✓ COMPLIANT"
    evidence: |
      6 gates (GATE_0 through GATE_5) with 32 total conditions.
      Severity levels: BLOCKER (cannot proceed), CRITICAL (should fix), ERROR (flag), WARNING (note).
      GATE enforcement in all 6 step files prevents progression if FAIL.
      Agent CANNOT skip dimensions without SCOPE_REDUCTION_DECLARATION.
    verification: "All 6 step files have GATE_N EVALUATION sections with IF FAIL → HALT logic"
    gate_counts:
      total_gates: 6
      total_conditions: 32
      blocker_conditions: 8
      critical_conditions: 12
      error_conditions: 8
      warning_conditions: 4

  R5_assumptions_declared:
    status: "✓ COMPLIANT"
    evidence: |
      step-00-frame.md requires explicit domain classification assumptions.
      step-02-assess.md requires confidence levels (High/Medium/Low) for all scores.
      All dimension assessments log evidence field documenting basis.
      Counter-checks validate assumptions (CC-GLOBAL-01 samples 3 assumptions).
    verification: "All dimension_scores entries require {score, confidence, evidence} structure"

  R6_extract_verify_render:
    status: "✓ COMPLIANT"
    evidence: |
      EXTRACT: Methods #001-306 extract feasibility data across 6 phases.
      VERIFY: 13 counter-checks validate extractions (CC-GLOBAL-01/02/03 + CC-DIM-01..10).
      RENDER: step-05-output.md generates report + register after verification.
      Sequence enforced via PRECONDITION checks (step N requires GATE_(N-1) = PASS).
    verification: "PRECONDITION checks in steps 1-5 prevent skipping to render without extract+verify"

  R7_post_phase_checklists:
    status: "✓ COMPLIANT"
    evidence: |
      All 6 step files have "Output Checklist" sections at end.
      Checklists document: outputs generated, gates passed, decisions made.
      Example: step-02-assess.md checklist has 10 items (one per dimension + binding constraint).
    verification: "grep 'Output Checklist' across all 6 step files returns 6 matches"

  R8_counter_checks:
    status: "✓ COMPLIANT"
    evidence: |
      13 counter-checks total (gates.yaml lines 394-561):
      - 3 global: CC-GLOBAL-01 (Grounding #85), CC-GLOBAL-02 (Coherence #84), CC-GLOBAL-03 (CUI BONO #59)
      - 10 dimension-specific: CC-DIM-01..10 using methods #85, #84, #59, #168, #501
      All critical claims validated (domain classification, dimension scores, binding constraint).
    verification: "gates.yaml contains 13 counter_checks entries with method references"
    counter_check_counts:
      global: 3
      dimension_specific: 10
      total: 13

  R9_egzekucyjny_executable:
    status: "✓ COMPLIANT"
    evidence: |
      All 6 step files have ENFORCED SEQUENCE sections with numbered steps.
      Steps specify HOW and ORDER: "1. Read tool: [file]", "2. Execute: [action]", "3. Record: [output]".
      workflow.md EXECUTION SEQUENCE has 6 programmatic steps (lines 87-149).
      No descriptive language - only imperative commands.
    verification: "All step files use '1. Read tool:', '2.', '3.' numbered execution steps"

  R10_step_by_step_thinking:
    status: "✓ COMPLIANT"
    evidence: |
      Method procedures decomposed into numbered steps (e.g., #201 Technical: 6 steps).
      ENFORCED SEQUENCE sections break complex tasks (e.g., step-02 has 12 numbered steps).
      Thinking scaffolds in decision logic (step-04 decision matrix with 3×3 grid).
    verification: "Method files use numbered steps (1, 2, 3...) for multi-step operations"

  R11_instructions_plus_information:
    status: "✓ COMPLIANT"
    evidence: |
      Step files contain BOTH executable instructions (ENFORCED SEQUENCE) AND contextual information (schemas, thresholds).
      workflow.md provides routing + enforcement rules + schemas.
      gates.yaml provides validation criteria + failure remediation.
      No guessing "what format?" - all outputs have explicit schemas.
    verification: "step files include data_dependencies frontmatter specifying all required info files"

  R12_just_in_time_delivery:
    status: "✓ COMPLIANT"
    evidence: |
      workflow.md reduced from 627→220 lines (-65%) by removing decorative content.
      Deleted sections loaded everything upfront: INVOCATION (84L), COMPLEXITY (22L), PHILOSOPHY (35L), FOUNDATIONS (24L), DEPTH (41L), SCORING (42L), INTEGRATION (75L), DIRECTORY (40L), USAGE (40L), VERSION (4L).
      Agent loads workflow.md (220L) → reads step-NN.md only when executing that step.
      Token economy: 407 lines NOT loaded upfront.
    verification: "workflow.md contains only routing (EXECUTION SEQUENCE) not all method details"
    token_economy:
      workflow_before: 627
      workflow_after: 220
      reduction_lines: 407
      reduction_percent: 65

  R13_zero_decorative_content:
    status: "✓ COMPLIANT"
    evidence: |
      Deleted 407 lines of decorative content from workflow.md:
      - INVOCATION (how to call process) - moved to external docs
      - CORE PHILOSOPHY (why feasibility matters) - theory not needed during execution
      - THEORETICAL FOUNDATIONS (Cynefin, Goldratt) - loaded JIT in step-00
      - COMPLEXITY DETECTION (when to use) - decision made before process start
      - DEPTH LEVELS (differences) - loaded JIT per selected depth
      - SCORING SYSTEMS (how to score) - loaded JIT in step-02
      - INTEGRATION (handoff points) - loaded JIT in step-05
      - DIRECTORY STRUCTURE (what files where) - agent uses Read tool
      - USAGE GUIDE (example invocations) - external docs
      - VERSION HISTORY (changelog) - external docs
      Only executable mechanisms and necessary information remain.
    verification: "workflow.md contains zero 'Purpose', 'Background', 'Theory', 'Guide' sections"

# ARCHITECTURE
architecture:
  pattern: "Deep-Verify V2.0 + Deep-Explore V3.2"
  structure: "workflow.md (routing) + steps/ (execution) + data/ (configs + methods)"
  priority: "COMPLETENESS > TOKEN_ECONOMY > DEPTH > AESTHETICS"

  files:
    core:
      - "workflow.md (220 lines - routing, enforcement rules, violation detection)"
      - "steps/step-00-frame.md (Cynefin classification, scope)"
      - "steps/step-01-constrain.md (Constraint analysis, 6 methods)"
      - "steps/step-02-assess.md (10 dimensions, CRITICAL for R2)"
      - "steps/step-03-validate.md (Reference class, probes, assumptions)"
      - "steps/step-04-decide.md (Decision matrix, conditions, decay)"
      - "steps/step-05-output.md (META audit, report, register)"

    data:
      - "data/gates.yaml (561 lines - 6 gates, 32 conditions, 13 counter-checks)"
      - "data/method-procedures/*.md (48 method files: #001-#505)"
      - "data/decision-thresholds.yaml"
      - "data/feasibility-scoring.yaml"
      - "data/coverage-scoring.yaml"
      - "data/feasibility-report-template.md"
      - "data/feasibility-register-template.md"
      - "meta/meta-checklist.yaml"

  phases:
    - name: "FRAME"
      step: 0
      methods: ["#001 Cynefin", "#002 Stakes", "#003 Scope"]
      outputs: ["scope", "domain_map", "complex_mode"]
      gate: "GATE_0"

    - name: "CONSTRAIN"
      step: 1
      methods: ["#101 Hardness", "#102 Variety", "#103 TRIZ", "#104 Conway", "#105 Regulatory", "#106 Precedent"]
      outputs: ["constraint_catalog", "h5_h4_h3_constraints", "contradictions", "variety_gap"]
      gate: "GATE_1"

    - name: "ASSESS"
      step: 2
      methods: ["#201 Technical", "#202 Resource", "#203 Knowledge", "#204 Organizational", "#205 Temporal", "#206 Compositional", "#207 Economic", "#208 Scale", "#209 Cognitive", "#210 Dependency"]
      outputs: ["dimension_scores (ALL 10)", "binding_constraint"]
      gate: "GATE_2"
      critical: "R2 COMPLETENESS enforced here - ALL 10 dimensions required"

    - name: "VALIDATE"
      step: 3
      methods: ["#301 Reference Class", "#302 Probes", "#303 Integration Spike", "#304 Expert Panel", "#305 Assumption Test", "#306 Sensitivity"]
      outputs: ["validation_results", "calibrated_scores", "tested_assumptions"]
      gate: "GATE_3"

    - name: "DECIDE"
      step: 4
      methods: ["#401 Multi-Axis Profile", "#402 Confidence-Weighted Decision", "#403 Conditional Map", "#404 Decay Monitoring"]
      outputs: ["feasibility_profile", "decision", "conditions", "decay_triggers"]
      gate: "GATE_4"

    - name: "OUTPUT"
      step: 5
      methods: ["#501 Planning Fallacy", "#502 Hofstadter", "#503 Confidence Theater", "#504 Dunning-Kruger", "#505 Meta-Feasibility"]
      outputs: ["feasibility_report", "register_entry", "meta_audit"]
      gate: "GATE_5"

# GATES
gates:
  total: 6
  total_conditions: 32

  GATE_0:
    conditions: 4
    critical: "Domain classification (Cynefin), scope definition"

  GATE_1:
    conditions: 6
    critical: "Constraint catalog, H5/H4/H3 identification"

  GATE_2:
    conditions: 8
    critical: "ALL 10 dimensions scored (R2 COMPLETENESS enforcement)"
    most_important: true
    rationale: "Binding constraint = min(10 dimensions) - if any missing, result invalid"

  GATE_3:
    conditions: 5
    critical: "Reference class, probes executed (depth-dependent)"

  GATE_4:
    conditions: 5
    critical: "Decision made, conditions mapped, decay triggers"

  GATE_5:
    conditions: 4
    critical: "META audit, report complete, register entry"

# COUNTER-CHECKS
counter_checks:
  total: 13
  global: 3
  dimension_specific: 10

  global_checks:
    - id: "CC-GLOBAL-01"
      method: "#85 Grounding Check"
      target: "All assumptions and evidence"

    - id: "CC-GLOBAL-02"
      method: "#84 Coherence Check"
      target: "Binding constraint = min(dimensions)"

    - id: "CC-GLOBAL-03"
      method: "#59 CUI BONO Test"
      target: "Detect optimism bias"

  dimension_checks:
    - id: "CC-DIM-01"
      dimension: "Technical"
      method: "#85 Grounding Check"

    - id: "CC-DIM-02"
      dimension: "Resource"
      method: "#84 Coherence Check"

    - id: "CC-DIM-03"
      dimension: "Knowledge"
      method: "#168 Phantom Hunt"

    - id: "CC-DIM-04"
      dimension: "Organizational"
      method: "#59 CUI BONO Test"

    - id: "CC-DIM-05"
      dimension: "Temporal"
      method: "#501 Planning Fallacy Detection"

    - id: "CC-DIM-06"
      dimension: "Compositional"
      method: "#85 Grounding Check"

    - id: "CC-DIM-07"
      dimension: "Economic"
      method: "#84 Coherence Check"

    - id: "CC-DIM-08"
      dimension: "Scale"
      method: "#168 Phantom Hunt"

    - id: "CC-DIM-09"
      dimension: "Cognitive"
      method: "#59 CUI BONO Test"

    - id: "CC-DIM-10"
      dimension: "Dependency"
      method: "#85 Grounding Check"

# METHODS USED
methods:
  transformation_analysis:
    - "#167 Baseline Census (enumerate current state)"
    - "#100 Vocabulary Consistency (terminology audit)"
    - "#84 Coherence Check (internal consistency)"
    - "#17 Abstraction Laddering (levels analysis)"
    - "#59 CUI BONO (who benefits from current design)"
    - "#61 Pre-mortem (failure scenarios)"
    - "#99 Multi-Artifact Coherence (cross-file consistency)"
    - "#114 Reversibility Test (can we undo changes)"
    - "#31 ADR (document key decisions)"

  runtime_methods:
    framing: ["#001 Cynefin", "#002 Stakes", "#003 Scope"]
    constraints: ["#101 Hardness", "#102 Variety", "#103 TRIZ", "#104 Conway", "#105 Regulatory", "#106 Precedent"]
    dimensions: ["#201 Technical", "#202 Resource", "#203 Knowledge", "#204 Organizational", "#205 Temporal", "#206 Compositional", "#207 Economic", "#208 Scale", "#209 Cognitive", "#210 Dependency"]
    validation: ["#301 Reference Class", "#302 Probes", "#303 Integration Spike", "#304 Expert Panel", "#305 Assumption Test", "#306 Sensitivity"]
    decision: ["#401 Multi-Axis Profile", "#402 Confidence-Weighted Decision", "#403 Conditional Map", "#404 Decay Monitoring"]
    meta: ["#501 Planning Fallacy", "#502 Hofstadter", "#503 Confidence Theater", "#504 Dunning-Kruger", "#505 Meta-Feasibility"]

  total_methods: 48

# OUTPUTS
outputs:
  artifacts:
    - "scope (subject, horizon, standard, exclusions)"
    - "domain_map (Cynefin classification per component)"
    - "constraint_catalog (H5/H4/H3/H2 constraints)"
    - "dimension_scores (10 dimensions: score, confidence, evidence)"
    - "binding_constraint (minimum dimension)"
    - "validation_results (reference class, probes, assumptions)"
    - "feasibility_profile (visual 10-dimension profile)"
    - "decision (GO/NO-GO/CONDITIONAL/INVESTIGATE)"
    - "conditions (feasible IF... list)"
    - "decay_triggers (reassessment events)"
    - "feasibility_report (full structured document)"
    - "register_entry (YAML tracking)"
    - "meta_audit (planning fallacy, Dunning-Kruger, confidence)"

  deliverables:
    - "feasibility-report.md (comprehensive report)"
    - "feasibility-register.yaml (concise entry for tracking)"
    - "decision summary (one-paragraph stakeholder communication)"

# DEPTH LEVELS
depth_levels:
  quick:
    time: "30-60 minutes"
    phases: [0, 1, 2, 4, 5]
    skip: "Phase 3 (Validate)"
    methods: "~18 methods"
    use_case: "Initial screening, low-stakes decisions"

  standard:
    time: "2-4 hours"
    phases: [0, 1, 2, 3, 4, 5]
    methods: "~35 methods"
    use_case: "Normal project feasibility, medium-stakes"

  comprehensive:
    time: "1-2 days"
    phases: [0, 1, 2, 3, 4, 5]
    methods: "~45 methods (full coverage)"
    use_case: "High-stakes, complex projects"

  critical:
    time: "2-5 days"
    phases: [0, 1, 2, 3, 4, 5]
    methods: "48 methods (exhaustive + external validation)"
    use_case: "Mission-critical, regulatory compliance, massive investment"

