---
# Deep Feasibility Process
# Multi-dimensional feasibility assessment
---

process_name: deep-feasibility
version: "1.2.0"
13_zasady_version: "1.0.0"
created: "2026-02-16"

# ═══════════════════════════════════════════════════════════════
# METADATA
# ═══════════════════════════════════════════════════════════════

metadata:
  category: DECISION_ANALYSIS
  complexity: HIGH

# ═══════════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════════

inputs:
  proposal:
    type: object
    required: true
    schema: "{subject, scope, horizon}"

  depth_level:
    type: enum
    values: [quick, standard, comprehensive, critical]
    default: standard
    loaded_from: "data/feasibility-scoring.yaml"

# ═══════════════════════════════════════════════════════════════
# PHASES (OODA STRUCTURE)
# ═══════════════════════════════════════════════════════════════

phases:
  phase_0_frame:
    observe:
      action: "LOAD proposal"
      gate: "GATE_0_OBSERVED"

    orient:
      action: "CLASSIFY domain AS simple|complicated|complex|chaotic USING Cynefin"
      assumptions: "DECLARE scope_boundaries + exclusions"
      gate: "GATE_0_ORIENTED"

    decide:
      action: "IF complex THEN probe_mode ELSE analyze_mode"
      gate: "GATE_0_DECIDED"

    act:
      action: "CREATE scope.yaml WITH domain_map"
      gate: "GATE_0"

  phase_1_constrain:
    observe:
      action: "LOAD scope.yaml + data/decision-thresholds.yaml"
      gate: "GATE_1_OBSERVED"

    orient:
      action: "IDENTIFY constraints AS H5|H4|H3 BY hardness"
      assumptions: "DECLARE constraint_catalog completeness"
      gate: "GATE_1_ORIENTED"

    decide:
      action: "FOR EACH constraint IF hardness >= H4 THEN flag_critical"
      gate: "GATE_1_DECIDED"

    act:
      action: "CREATE constraints.yaml WITH catalog"
      gate: "GATE_1"

  phase_2_assess:
    observe:
      action: "LOAD constraints.yaml"
      gate: "GATE_2_OBSERVED"

    orient:
      action: "SCORE ALL 10 dimensions USING methods #201-210"
      assumptions: "DECLARE confidence_levels per dimension"
      gate: "GATE_2_ORIENTED"

    decide:
      action: "binding_constraint = MIN(10 dimensions)"
      gate: "GATE_2_DECIDED"

    act:
      action: "CREATE dimension-scores.yaml WITH ALL 10 scores"
      gate: "GATE_2"

  phase_3_validate:
    observe:
      action: "LOAD dimension-scores.yaml"
      gate: "GATE_3_OBSERVED"

    orient:
      action: "EXECUTE reference_class + probes + sensitivity_tests"
      assumptions: "DECLARE validation_methods per depth"
      gate: "GATE_3_ORIENTED"

    decide:
      action: "IF validation FAILS THEN recalibrate ELSE accept"
      gate: "GATE_3_DECIDED"

    act:
      action: "CREATE validation-results.yaml WITH calibrated_scores"
      gate: "GATE_3"

  phase_4_decide:
    observe:
      action: "LOAD validation-results.yaml"
      gate: "GATE_4_OBSERVED"

    orient:
      action: "BUILD feasibility_profile 10-axis"
      assumptions: "DECLARE decision_thresholds"
      gate: "GATE_4_ORIENTED"

    decide:
      action: "IF binding >= 60 THEN GO ELIF binding >= 40 THEN CONDITIONAL ELSE NO-GO"
      gate: "GATE_4_DECIDED"

    act:
      action: "CREATE decision.yaml WITH conditions + decay_triggers"
      gate: "GATE_4"

  phase_5_output:
    observe:
      action: "LOAD ALL phase_outputs"
      gate: "GATE_5_OBSERVED"

    orient:
      action: "EXECUTE meta_audit USING methods #501-505"
      assumptions: "DECLARE report_completeness criteria"
      gate: "GATE_5_ORIENTED"

    decide:
      action: "IF meta_audit detects_bias THEN flag ELSE proceed"
      gate: "GATE_5_DECIDED"

    act:
      action: "CREATE feasibility-report.md + register-entry.yaml"
      gate: "GATE_5"

# ═══════════════════════════════════════════════════════════════
# OUTPUTS
# ═══════════════════════════════════════════════════════════════

outputs:
  scope:
    schema: "{subject, horizon, standard, exclusions, domain_map}"
    phase: 0

  constraints:
    schema: "{catalog: [], h5: [], h4: [], h3: []}"
    phase: 1

  dimension-scores:
    schema: "{technical, resource, knowledge, organizational, temporal, compositional, economic, scale, cognitive, dependency, binding_constraint}"
    phase: 2

  validation-results:
    schema: "{calibrated_scores: {}, probes: [], reference_class: {}}"
    phase: 3

  decision:
    schema: "{verdict, profile, conditions: [], decay_triggers: []}"
    phase: 4

  feasibility-report:
    schema_ref: "data/feasibility-report-template.md"
    phase: 5

  register-entry:
    schema: "{project, decision, date, binding_constraint}"
    phase: 5

# ═══════════════════════════════════════════════════════════════
# VALIDATION GATES
# ═══════════════════════════════════════════════════════════════

validation_gates:
  GATE_0:
    condition: "scope.yaml EXISTS AND domain_map NOT EMPTY"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_1:
    condition: "constraints.yaml EXISTS AND ALL hardness_classified"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_2:
    condition: "dimension-scores.yaml EXISTS AND ALL 10 dimensions scored"
    on_fail: "HALT"
    severity: BLOCKER
    note: "R2 COMPLETENESS enforced - binding = MIN(10)"

  GATE_3:
    condition: "validation-results.yaml EXISTS AND calibrated"
    on_fail: "SCOPE_REDUCTION OR HALT"
    severity: CRITICAL

  GATE_4:
    condition: "decision.yaml EXISTS AND conditions documented"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_5:
    condition: "feasibility-report.md + register-entry.yaml EXIST"
    on_fail: "HALT"
    severity: BLOCKER

# ═══════════════════════════════════════════════════════════════
# ERROR HANDLERS
# ═══════════════════════════════════════════════════════════════

error_handlers:
  missing_input:
    trigger: "proposal NOT PROVIDED"
    severity: CRITICAL
    action: "HALT WITH error_missing_proposal"
    recovery: "Request user input"

  invalid_input:
    trigger: "proposal schema VALIDATION FAILS"
    severity: HIGH
    action: "HALT WITH validation_error"
    recovery: "Request corrected input"

  partial_completion:
    trigger: "phase N reaches 70% THEN interrupted"
    severity: MEDIUM
    action: "SAVE checkpoint + HALT"
    recovery: "Resume from checkpoint"

  external_dependency_failure:
    trigger: "data/decision-thresholds.yaml NOT ACCESSIBLE"
    severity: MEDIUM
    action: "USE default_thresholds + EMIT_WARNING"
    recovery: "Continue with defaults"

  timeout:
    trigger: "phase_duration > max_allowed"
    severity: HIGH
    action: "SAVE state + HALT WITH timeout_error"
    recovery: "User decides: continue OR abort"

  resource_exhaustion:
    trigger: "memory_usage > 80%"
    severity: HIGH
    action: "REDUCE analysis_depth + GC + retry"
    recovery: "Continue with reduced depth"

  concurrent_modification:
    trigger: "artifact_hash CHANGED during execution"
    severity: CRITICAL
    action: "RELOAD + RESTART phase"
    recovery: "Phase re-execution"

  user_cancellation:
    trigger: "user_cancels DURING execution"
    severity: LOW
    action: "SAVE checkpoint + CLEANUP"
    recovery: "State saved for resume"

# ═══════════════════════════════════════════════════════════════
# COMPLIANCE
# ═══════════════════════════════════════════════════════════════

compliance_13_zasady:
  zasada_0_ooda: "PASS - 6 phases OODA"
  zasada_1_self_contained: "PASS - methods in data/"
  zasada_2_completeness: "PASS - ALL 10 dimensions GATE_2"
  zasada_3_mechanisms: "PASS - 6 gates IF-THEN"
  zasada_4_binding_gates: "PASS - BLOCKER enforcement"
  zasada_5_assumptions: "PASS - DECLARE each phase"
  zasada_6_evr: "PASS - observe→orient→act"
  zasada_7_checklists: "PASS - step files checklists"
  zasada_8_counter_checks: "PASS - 13 checks in gates.yaml"
  zasada_9_executable: "PASS - LOAD/CREATE/IF-THEN"
  zasada_10_visible_reasoning: "PASS - orient shows logic"
  zasada_11_instruction_data: "PASS - schemas included"
  zasada_12_jit: "PASS - step files JIT"
  zasada_13_zero_decoration: "PASS - no explanations"

---
# END deep-feasibility process.yaml
