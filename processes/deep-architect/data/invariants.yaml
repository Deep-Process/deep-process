# Deep-Architect V1.4.1 — Invariants
# Binding process rules — 16 invariants

metadata:
  version: "1.4.1"
  total_invariants: 16
  enforcement_level:
    BLOCKER: 5   # INV-01, INV-02, INV-07, INV-08, INV-09
    CRITICAL: 8  # INV-03, INV-04, INV-05, INV-11, INV-13, INV-14, INV-15, INV-16
    ERROR: 2     # INV-10, INV-12
    REQUIRED: 1  # INV-06

INV-01:
  name: "Sequential Execution"
  severity: BLOCKER
  rule: "current_phase == previous_phase + 1"
  exception: "REDESIGN_LOOP (INV-13) allows controlled backward jump Phase 3→1/2 with user approval"
  enforcement:
    when_violated: "ABORT execution immediately"
    message: "Phase sequence broken"
    recovery: "Restart from Phase 0"

INV-02:
  name: "Gate Blocking"
  severity: BLOCKER
  rule: "IF gate_status == LOCKED THEN next_phase_forbidden"
  enforcement:
    when_violated: "ABORT execution, log violation"
    message: "Cannot proceed with LOCKED gate"
    recovery: "Fix gate condition, re-evaluate gate, proceed only if OPEN"

INV-03:
  name: "Assumptions Declared"
  severity: CRITICAL
  rule: "FOR ALL phases: assumptions.length >= 1 AND assumptions_declared_before_extraction == true"
  enforcement:
    when_violated: "HALT phase execution"
    message: "Assumptions not declared before action"
    recovery: "Declare assumptions, restart phase"

INV-04:
  name: "EVR Sequence"
  severity: CRITICAL
  rule: "FOR ALL phases: extraction_complete BEFORE verification_start AND verification_complete BEFORE rendering_start"
  enforcement:
    when_violated: "HALT at current step"
    message: "Must extract, then verify, then render"
    recovery: "Execute steps in correct order"

INV-05:
  name: "Post-Phase Checklist"
  severity: CRITICAL
  rule: "FOR ALL phases: checklist_completed == true AND checklist.items.all(i => i.status in [PASS, FAIL])"
  enforcement:
    when_violated: "HALT at gate evaluation"
    message: "Cannot evaluate gate without checklist"
    recovery: "Complete checklist, re-evaluate gate"

INV-06:
  name: "Counter-Checks Minimum"
  severity: REQUIRED
  rule: |
    depth_level == quick: counter_checks >= 1/phase
    depth_level == standard: counter_checks >= 2/phase
    depth_level == deep: counter_checks >= 3/phase
  enforcement:
    when_violated: "LOG warning, proceed with degraded confidence"
    message: "Insufficient counter-checks"
    recovery: "Execute missing counter-checks"

INV-07:
  name: "Eight Canonical Operations"
  severity: BLOCKER
  rule: "canonical_operations.executed == [Decomposition, Boundary, Relationship, Responsibility, Dependency, Pattern, Quality, Interface]"
  enforcement:
    when_violated: "ABORT at GATE_1"
    message: "Incomplete canonical operations"
    recovery: "Execute missing operations, re-evaluate GATE_1"

INV-08:
  name: "Eight Adversarial Operations"
  severity: BLOCKER
  non_negotiable: true
  rule: "adversary.executed == [STRIDE, FMEA, Bottleneck, Anti-patterns, Complexity, Compliance, Pre-mortem, Trade-offs]"
  scope_reduction_forbidden: true
  user_approval_cannot_override: true
  enforcement:
    when_violated: "ABORT at GATE_3, NO SCOPE_REDUCTION allowed"
    message: "Incomplete ADVERSARY"
    recovery: "Execute ALL 8 adversarial operations, no exceptions"

INV-09:
  name: "Bounded Validation"
  severity: BLOCKER
  rule: "validation.issues_validated.length == 10"
  bounded_count: 10
  selection_criteria: "Top 10 by severity x impact ranking"
  scope_reduction_forbidden: true
  enforcement:
    when_violated: "ABORT at GATE_5"
    message: "Validation not bounded (must be exactly 10)"
    recovery: "Rank all issues, select top 10 by severity x impact, validate those"

INV-10:
  name: "Checkpoint Maximum"
  severity: ERROR
  rule: "checkpoints_requested <= 4"
  max_checkpoints: 4
  enforcement:
    when_violated: "LOG warning, proceed without additional approvals"
    message: "Max 4 approvals to prevent fatigue"
    recovery: "Consolidate approvals, proceed autonomously"

INV-11:
  name: "Embedded Methods"
  severity: CRITICAL
  rule: "FOR ALL step_files: methods referenced -> methods defined inline"
  embedding_format: "Method name + 3-5 executable steps (numbered), NO theory"
  enforcement:
    when_violated: "HALT at step execution"
    message: "Method not embedded"
    recovery: "Embed method inline (3-5 bullet points), remove external reference"

INV-12:
  name: "Just-in-Time Loading"
  severity: ERROR
  rule: "AT phase N: loaded_files == [workflow.md, step-0N-*.md] (no others)"
  enforcement:
    when_violated: "LOG warning, context bloated"
    message: "Loading files not needed for current phase"
    recovery: "Focus on current step only"

INV-13:
  name: "REDESIGN_LOOP Evaluation"
  severity: CRITICAL
  rule: "IF GATE_3 == OPEN THEN redesign_loop.evaluated == true"
  redesign_triggers:
    - ">= 3 critical STRIDE threats without viable mitigation"
    - "FMEA failure mode with mitigated_rpn > 100"
    - "Anti-patterns 'Big Ball of Mud' or 'Distributed Monolith' detected"
    - ">= 2 pre-mortem scenarios without preventive measures"
  user_decisions:
    REDESIGN: "Loop to Phase 1 (carry adversary findings as constraints)"
    REDESIGN_ARTIFACTS: "Loop to Phase 2 (update diagrams/ADRs)"
    ACCEPT_RISK: "Log risk acceptance, proceed to Phase 4"
  enforcement:
    when_violated: "HALT at Phase 4 entry"
    message: "REDESIGN_LOOP not evaluated after GATE_3"
    recovery: "Execute section 3.13, evaluate redesign criteria"

INV-14:
  name: "Pattern Library Grounding"
  severity: CRITICAL
  rule: "FOR ALL pattern_ref IN architecture_artifacts: pattern_ref EXISTS IN data/patterns/*.yaml"
  scope:
    - "AP-XXX -> data/patterns/architecture-patterns.yaml"
    - "AAP-XXX -> data/patterns/anti-patterns.yaml"
    - "CP-XXX -> data/patterns/cloud-patterns.yaml"
    - "DP-XXX -> data/patterns/domain-*.yaml"
  enforcement:
    when_violated: "HALT at GATE_6 (G6-09)"
    message: "Reference to non-existent pattern ID"
    recovery: "Replace with valid pattern_id from library OR add pattern to library"

INV-15:
  name: "Architecture Fitness"
  severity: CRITICAL
  rule: "validation.architecture_fitness.fitness_score >= 3 AND verdict in [FIT, PARTIALLY_FIT]"
  fitness_criteria:
    - id: "AF-01"
      check: "Architecture addresses ALL stated user requirements"
    - id: "AF-02"
      check: "Primary quality attribute targets achievable"
    - id: "AF-03"
      check: "Architecture matches context (team, budget, timeline)"
    - id: "AF-04"
      check: "No simpler alternative would suffice (over-engineering check)"
    - id: "AF-05"
      check: "Architecture survives pre-mortem scenarios"
  scoring:
    FIT: ">= 4/5 criteria PASS"
    PARTIALLY_FIT: "3/5 criteria PASS"
    UNFIT: "<= 2/5 criteria PASS -> recommend redesign"
  enforcement:
    when_violated: "HALT at GATE_5, recommend returning to Phase 1"
    message: "Architecture passes gates but does not solve user's problem"
    recovery: "Redesign with focus on user requirements and fitness criteria"

INV-16:
  name: "Reasoning Visibility"
  severity: CRITICAL
  rule: "FOR ALL key_decisions: reasoning field exists AND reasoning.length > 0"
  minimum_coverage: 0.80
  applies_to:
    - "Component decomposition (C-XXX.reasoning)"
    - "Pattern selection (pattern_application.rationale)"
    - "Quality attribute priorities (prioritized[].rationale)"
    - "Trade-off resolutions (decisions[].rationale)"
    - "ADR decisions (adrs[].rationale)"
  enforcement:
    when_violated: "LOG warning at GATE_1 (ERROR severity)"
    message: "Key decisions lack documented rationale"
    recovery: "Add reasoning field to decisions missing WHY justification"
