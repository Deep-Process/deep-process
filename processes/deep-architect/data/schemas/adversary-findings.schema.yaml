# Deep-Architect V1.2 — Adversary Findings Schema
# Output of Phase 3: ADVERSARY (8 mandatory operations, NON-NEGOTIABLE)
# Consumed by: Phase 4 (trade-offs), Phase 5 (validation input), Phase 6 (traceability)

schema:
  version: "1.2.0"
  artifact: "adversary-findings.yaml"
  produced_by: "Phase 3"
  consumed_by: ["Phase 4", "Phase 5", "Phase 6"]
  non_negotiable: true

structure:
  metadata:
    version: "string (required)"
    timestamp: "ISO-8601 (required)"
    operations_executed: "integer (required) — MUST be 8"
    source: "string — architecture-model.yaml reference"

  assumptions:
    - id: "string (required) — A-3XX format"
      assumption: "string (required)"
      confidence: "float 0.0-1.0 (required)"
      falsification: "string (required)"
      impact_if_wrong: "string (required)"

  # --- Operation 1: Threat Modeling (STRIDE) ---
  stride:
    threats:
      - id: "string (required) — T-XXX format"
        category: "enum: Spoofing|Tampering|Repudiation|Information_Disclosure|Denial_of_Service|Elevation_of_Privilege (required)"
        target: "string (required) — C-XXX or I-XXX affected"
        description: "string (required) — threat description"
        severity: "enum: low|medium|high|critical (required)"
        mitigation: "string (required) — proposed defense"
        residual_risk: "string (required) — remaining risk after mitigation"
    coverage:
      spoofing: "boolean (required)"
      tampering: "boolean (required)"
      repudiation: "boolean (required)"
      information_disclosure: "boolean (required)"
      denial_of_service: "boolean (required)"
      elevation_of_privilege: "boolean (required)"
    minimum_threats: 6

  # --- Operation 2: FMEA ---
  fmea:
    failure_modes:
      - id: "string (required) — FM-XXX format"
        component: "string (required) — C-XXX affected"
        failure_mode: "string (required) — what fails"
        effect: "string (required) — impact of failure"
        severity: "integer 1-10 (required)"
        occurrence: "integer 1-10 (required)"
        detection: "integer 1-10 (required)"
        rpn: "integer (required) — severity × occurrence × detection"
        mitigation: "string (required)"
        mitigated_rpn: "integer (optional)"
    rpn_threshold: 100
    minimum_modes: 5

  # --- Operation 3: Bottleneck Detection ---
  bottlenecks:
    - id: "string (required) — BN-XXX format"
      location: "string (required) — C-XXX or DF-XXX"
      type: "enum: throughput|latency|resource|contention|bandwidth (required)"
      description: "string (required)"
      current_capacity: "string (required) — estimated capacity"
      projected_load: "string (required) — expected demand"
      headroom: "string (required) — capacity margin"
      mitigation: "string (required)"
      priority: "enum: low|medium|high|critical (required)"
    minimum_count: 2

  # --- Operation 4: Anti-Pattern Detection ---
  anti_patterns:
    - id: "string (required) — AP-XXX instance format"
      anti_pattern_id: "string (required) — AAP-XXX from anti-patterns.yaml"
      name: "string (required) — anti-pattern name"
      location: "string (required) — where detected (C-XXX or area)"
      symptoms_matched: "string[] (required) — which symptoms from library were observed"
      description: "string (required) — why it's harmful in this context"
      remediation: "string[] (required) — fix steps from library + context-specific additions"
      severity: "enum: low|medium|high|critical (required)"
      related_patterns: "string[] (optional) — AP-XXX patterns that resolve this anti-pattern"

  # --- Operation 5: Complexity Analysis ---
  complexity:
    cyclomatic:
      - component: "string (required) — C-XXX"
        value: "integer (required)"
        threshold: 10
        status: "enum: PASS|WARNING|FAIL (required)"
    cognitive:
      - component: "string (required) — C-XXX"
        value: "integer (required)"
        threshold: 15
        status: "enum: PASS|WARNING|FAIL (required)"
    coupling:
      overall_score: "float (required) — average coupling"
      hotspots: "string[] — highest coupling components"
    cohesion:
      overall_score: "float (required) — average cohesion"
      cold_spots: "string[] — lowest cohesion components"
    summary:
      total_components_analyzed: "integer (required)"
      violations: "integer (required)"
      health: "enum: healthy|concerning|critical (required)"

  # --- Operation 6: Compliance Analysis ---
  compliance:
    applicable_regulations:
      - regulation: "string (required) — e.g., GDPR, HIPAA, PCI-DSS, SOC2"
        relevance: "string (required) — why applicable"
        requirements:
          - requirement: "string (required)"
            status: "enum: met|partially_met|not_met|not_applicable (required)"
            evidence: "string (required)"
    gaps:
      - regulation: "string (required)"
        gap: "string (required)"
        remediation: "string (required)"
        priority: "enum: low|medium|high|critical (required)"

  # --- Operation 7: Pre-mortem ---
  premortem:
    failure_scenarios:
      - id: "string (required) — PS-XXX format"
        scenario: "string (required) — what failed"
        root_cause: "string (required) — why it failed"
        probability: "enum: low|medium|high (required)"
        impact: "enum: low|medium|high|catastrophic (required)"
        early_warning_signs: "string[] (required)"
        preventive_measures: "string[] (required)"
    minimum_scenarios: 5

  # --- Operation 8: Trade-off Identification ---
  tradeoff_identification:
    conflicts:
      - id: "string (required) — TC-XXX format"
        attribute_a: "string (required) — quality attribute"
        attribute_b: "string (required) — conflicting attribute"
        tension: "string (required) — nature of conflict"
        current_resolution: "string (required) — how resolved in current design"
        alternative_resolutions: "string[] (optional)"
    minimum_conflicts: 2

  # --- Aggregates ---
  summary:
    total_findings: "integer (required)"
    by_severity:
      critical: "integer"
      high: "integer"
      medium: "integer"
      low: "integer"
    top_risks:
      - finding_id: "string — reference to finding above"
        category: "string — which operation"
        summary: "string — one-line summary"

  checklist:
    - item: "string (required)"
      status: "enum: PASS|FAIL (required)"

  counter_checks:
    - method: "string (required)"
      result: "string (required)"
      status: "enum: PASS|FAIL|WARNING (required)"

validation_rules:
  - "metadata.operations_executed MUST equal 8"
  - "stride.coverage: ALL 6 categories MUST be true"
  - "stride.threats.length >= 6"
  - "fmea.failure_modes.length >= 5"
  - "bottlenecks.length >= 2"
  - "complexity.summary MUST exist"
  - "premortem.failure_scenarios.length >= 5"
  - "tradeoff_identification.conflicts.length >= 2"
  - "assumptions.length >= 3"
  - "checklist items present"
  - "counter_checks.length >= depth_counter_check_minimum"
