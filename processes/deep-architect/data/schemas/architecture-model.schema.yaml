# Deep-Architect V1.0 — Architecture Model Schema
# Output of Phase 2: Artifact Generation
# Consumed by: Phase 3 (adversary analysis), Phase 4 (trade-offs), Phase 5 (validation), Phase 6 (traceability)

schema:
  version: "1.0.0"
  artifact: "architecture-model.yaml"
  produced_by: "Phase 2"
  consumed_by: ["Phase 3", "Phase 4", "Phase 5", "Phase 6"]

structure:
  metadata:
    version: "string (required)"
    timestamp: "ISO-8601 (required)"
    source: "string — canonical-operations.yaml reference"

  assumptions:
    - id: "string (required) — A-2XX format"
      assumption: "string (required)"
      confidence: "float 0.0-1.0 (required)"
      falsification: "string (required)"
      impact_if_wrong: "string (required)"

  diagrams:
    c4_context:
      format: "enum: mermaid|plantuml (required)"
      file: "string (required) — diagrams/c4-context.mermaid"
      system_name: "string (required)"
      actors: "string[] — external actor names"
      external_systems: "string[] — external system names"
      content: "string (required) — diagram source code"

    c4_container:
      format: "enum: mermaid|plantuml (required)"
      file: "string (required) — diagrams/c4-container.mermaid"
      containers:
        - name: "string (required)"
          technology: "string (required)"
          description: "string (required)"
      content: "string (required)"

    c4_component:
      format: "enum: mermaid|plantuml (required)"
      file: "string (required) — diagrams/c4-component.mermaid"
      target_container: "string (required) — which container decomposed"
      components:
        - name: "string (required)"
          responsibility: "string (required)"
      content: "string (required)"

    data_model:
      format: "enum: mermaid|plantuml (required)"
      file: "string (required) — diagrams/data-model.mermaid"
      entities:
        - name: "string (required)"
          attributes: "string[] (required)"
          relationships:
            - target: "string (required)"
              type: "enum: one-to-one|one-to-many|many-to-many (required)"
              description: "string (optional)"
      content: "string (required)"

    deployment:
      format: "enum: mermaid|plantuml (required)"
      file: "string (required) — diagrams/deployment.mermaid"
      environments:
        - name: "string (required) — e.g., production, staging"
          nodes:
            - name: "string (required)"
              type: "string (required) — e.g., EC2, ECS, Lambda, K8s"
              containers: "string[] — deployed containers"
      content: "string (required)"

  adrs:
    - id: "string (required) — ADR-XXX format"
      title: "string (required)"
      status: "enum: proposed|accepted|deprecated|superseded (required)"
      context: "string (required) — why decision needed"
      decision: "string (required) — what was decided"
      rationale: "string (required) — why this option"
      alternatives_considered:
        - option: "string (required)"
          rejected_because: "string (required)"
      consequences:
        positive: "string[] (required)"
        negative: "string[] (required)"

  technology_stack:
    - layer: "string (required) — e.g., frontend, backend, database, infrastructure"
      technology: "string (required)"
      version: "string (optional)"
      rationale: "string (required)"

  checklist:
    - item: "string (required)"
      status: "enum: PASS|FAIL (required)"

  counter_checks:
    - method: "string (required)"
      result: "string (required)"
      status: "enum: PASS|FAIL|WARNING (required)"

validation_rules:
  - "diagrams.c4_context MUST exist with content"
  - "diagrams.c4_container MUST exist with content"
  - "diagrams.data_model MUST exist with entities"
  - "adrs.length >= 3"
  - "adrs[].status MUST be one of: proposed, accepted, deprecated, superseded"
  - "technology_stack.length >= 1"
  - "assumptions.length >= 1"
  - "checklist items present"
