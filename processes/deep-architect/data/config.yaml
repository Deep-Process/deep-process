# Deep-Architect V1.4.1 — Configuration

metadata:
  version: "1.4.1"

depth_levels:
  quick:
    counter_checks_min: 1
    iterations_max: 1
    time_estimate: "2.5-5 hours"
  standard:
    counter_checks_min: 2
    iterations_max: 3
    time_estimate: "5-10 hours"
  deep:
    counter_checks_min: 3
    iterations_max: 10
    time_estimate: "10-15 hours"

execution_modes:
  iterative:
    checkpoint_max: 4
    phases_per_iteration: 2
    requirements_stability: "low (0.0-0.4)"
    team_maturity: "high"
    domain: "web, data, cloud"
  waterfall:
    checkpoint_max: 1
    phases_per_iteration: 7
    requirements_stability: "high (0.7-1.0)"
    team_maturity: "any"
    domain: "embedded, compliance-heavy"
  hybrid:
    checkpoint_max: 2
    phases_per_iteration: 4
    requirements_stability: "medium (0.4-0.7)"
    team_maturity: "medium"
    domain: "any"

timeline:
  buffer_multiplier: 1.25
  simple_architecture:
    base_estimate: "2.5-5 hours"
    with_buffer: "3.1-6.25 hours"
  medium_architecture:
    base_estimate: "5-10 hours"
    with_buffer: "6.25-12.5 hours"
  complex_architecture:
    base_estimate: "10-15 hours"
    with_buffer: "12.5-18.75 hours"

project_scale:
  classifications:
    small:
      criteria:
        max_components: 5
        max_integrations: 3
        regulatory: "none"
        max_team_size: 3
    medium:
      criteria:
        components_range: "5-15"
        integrations_range: "3-10"
        regulatory: "basic"
        team_size_range: "3-10"
    large:
      criteria:
        components_range: "15-50"
        integrations_range: "10+"
        regulatory: "compliance required"
        team_size_range: "10-30"
    enterprise:
      criteria:
        min_components: 50
        integrations: "many"
        regulatory: "heavy compliance"
        min_team_size: 30
  proportionality_warnings:
    over_engineering: "Small project + deep depth → LOG warning 'Deep depth may be disproportionate'"
    under_engineering: "Enterprise project + quick depth → LOG warning 'Quick depth may be insufficient'"

validation:
  bounded_count: 10
  issue_ranking:
    formula: "severity × impact × likelihood"
    severity_scale: "1-5"
    impact_scale: "1-5"
    likelihood_scale: "1-5"
    top_n: 10

checkpoints:
  max_count: 4
  recommended_positions:
    checkpoint_1:
      phase: 1
      name: "Canonical Operations Review"
      artifacts: ["canonical_operations.yaml", "diagrams/c4-context.mermaid"]
    checkpoint_2:
      phase: 3
      name: "ADVERSARY Findings Review"
      artifacts: ["adversary_findings.yaml", "premortem_scenarios.yaml"]
    checkpoint_3:
      phase: 5
      name: "Validation Results Review"
      artifacts: ["validation_report.yaml"]
    checkpoint_4:
      phase: 6
      name: "Final Verification Approval"
      artifacts: ["verification_report.yaml", "process_log.yaml"]

adversary:
  mandatory: true
  non_negotiable: true
  operations_required: 8
  fmea_configuration:
    severity_scale: "1-10"
    occurrence_scale: "1-10"
    detection_scale: "1-10"
    rpn_threshold: 100
    rpn_formula: "severity × occurrence × detection"
  complexity_metrics:
    cyclomatic_complexity:
      threshold: 10
      severity_if_exceeded: "ERROR"
    cognitive_complexity:
      threshold: 15
      severity_if_exceeded: "ERROR"
    coupling:
      threshold: 5
      severity_if_exceeded: "WARNING"
    cohesion:
      threshold: 0.7
      severity_if_below: "WARNING"

counter_checks:
  minimum_per_phase:
    quick: 1
    standard: 2
    deep: 3
  total_minimum:
    quick: 7
    standard: 14
    deep: 21

artifacts:
  output_directory: "{output_directory}/architecture-artifacts/"
  schemas_location: "data/schemas/"
  schemas_count: 8
  required_artifacts:
    phase_0:
      - "context-assessment.yaml"
    phase_1:
      - "canonical-operations.yaml"
    phase_2:
      - "architecture-model.yaml"
      - "diagrams/c4-context.mermaid"
      - "diagrams/c4-container.mermaid"
      - "diagrams/c4-component.mermaid"
      - "diagrams/data-model.mermaid"
      - "diagrams/deployment.mermaid"
      - "adrs/"
    phase_3:
      - "adversary-findings.yaml"
    phase_4:
      - "tradeoff-analysis.yaml"
    phase_5:
      - "validation-report.yaml"
    phase_6:
      - "verification-report.yaml"
      - "process-log.yaml"

scope_reduction:
  allowed_for_severity:
    BLOCKER: false
    CRITICAL: true
    ERROR: true
    REQUIRED: true
  user_approval_required:
    CRITICAL: true
    ERROR: false
    REQUIRED: false
  declaration_required: true
  silent_omission_forbidden: true
  declaration_fields:
    - "gate"
    - "item_skipped"
    - "reason"
    - "impact_assessment"
    - "completeness_cost"
    - "requires_user_approval"

timeouts:
  phase_timeout_minutes:
    phase_0: 30
    phase_1: 120
    phase_2: 90
    phase_3: 180
    phase_4: 90
    phase_5: 60
    phase_6: 40
  total_process_timeout_hours:
    quick: 8
    standard: 16
    deep: 24

limits:
  max_components: 100
  max_entities: 200
  max_adrs: 50
  max_diagrams: 20
  max_iterations: 10

pattern_library:
  version: "1.1.0"
  location: "data/patterns/"
  files:
    domains: "architecture-domains.yaml"
    detection: "domain-detection-rules.yaml"
    patterns: "architecture-patterns.yaml"
    anti_patterns: "anti-patterns.yaml"
    cloud: "cloud-patterns.yaml"
    domain_microservices: "domain-microservices.yaml"
    domain_data_engineering: "domain-data-engineering.yaml"
    domain_rag_ai: "domain-rag-ai.yaml"
    domain_real_time: "domain-real-time.yaml"
  loading_rules:
    phase_0: ["architecture-domains.yaml", "domain-detection-rules.yaml"]
    phase_1: ["architecture-patterns.yaml", "cloud-patterns.yaml (if platform detected)", "domain-*.yaml (if domain detected)"]
    phase_3: ["anti-patterns.yaml"]
    phase_6: ["ALL (for grounding verification)"]
  detection:
    source: "user_brief"
    thresholds:
      paradigm_domains: 0.65
      platform_domains: 0.60
      integration_domains: 0.60
    base_domains_auto_apply: ["DOM-BASE-SOLID", "DOM-BASE-SEC", "DOM-BASE-OBS"]
  counts:
    total_patterns: 110
    architecture_patterns: 38
    anti_patterns: 15
    cloud_patterns: 29
    domain_patterns: 28
