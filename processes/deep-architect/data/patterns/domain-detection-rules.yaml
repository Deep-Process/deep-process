# Domain Detection Rules — Deep-Architect V1.2.0
# Brief-based detection using keywords + requirement indicators
# Adapted from Deep-Document V6 code-scanning detection to user-brief-based detection
# Version: 1.0.0
# Date: 2026-02-12

metadata:
  version: "1.0.0"
  total_rules: 14
  detection_source: "user_brief"
  note: "Thresholds lower than V6 (0.65 vs 0.75) because briefs are less precise than code"

# ─────────────────────────────────────────────
# DETECTION ALGORITHM (7 steps)
# ─────────────────────────────────────────────
# 1. Normalize brief text (lowercase, strip punctuation)
# 2. For each domain rule: evaluate ALL conditions
# 3. Compute confidence = sum(weight × match_score) / sum(weight)
# 4. Compare confidence against detection_threshold
# 5. Collect detected domains (confidence ≥ threshold)
# 6. Resolve transitive dependencies (per architecture-domains.yaml algorithm)
# 7. Log evidence: domain, confidence, matched_keywords, conditions_met
#
# Match score functions:
#   binary: 1.0 if ANY keyword found, 0.0 otherwise
#   threshold_linear: min(1.0, matches_count / threshold_count)

# ─────────────────────────────────────────────
# DETECTION RULES — PARADIGM DOMAINS
# ─────────────────────────────────────────────

detection_rules:

  # ── Microservices ──
  - domain_id: "DOM-PAR-MICRO"
    detection_threshold: 0.65
    conditions:
      - id: "C1_explicit"
        description: "Explicit mention of microservices"
        keywords: ["microservices", "micro-services", "micro services", "microservice architecture"]
        match_type: "binary"
        weight: 0.40

      - id: "C2_indicators"
        description: "Microservices indicator terms (≥2 matches)"
        keywords: ["saga", "cqrs", "bounded context", "domain-driven", "service mesh",
                   "api gateway", "service discovery", "circuit breaker", "sidecar",
                   "independent deployment", "database per service"]
        match_type: "threshold_linear"
        threshold_count: 2
        weight: 0.35

      - id: "C3_scale"
        description: "Scale/team indicators"
        keywords: ["independent deployment", "multiple teams", "autonomous teams",
                   "independently scalable", "polyglot services", "service-level SLA"]
        match_type: "threshold_linear"
        threshold_count: 2
        weight: 0.25

    anti_gaming: "Explicit keyword alone → 0.40 confidence (BELOW 0.65 threshold). Requires indicator OR scale evidence."

  # ── Event-Driven ──
  - domain_id: "DOM-PAR-EVENT"
    detection_threshold: 0.65
    conditions:
      - id: "C1_explicit"
        keywords: ["event-driven", "event driven", "event sourcing", "event architecture",
                   "pub/sub", "publish-subscribe"]
        match_type: "binary"
        weight: 0.40

      - id: "C2_indicators"
        keywords: ["message queue", "event bus", "event store", "domain events",
                   "eventual consistency", "choreography", "orchestration",
                   "async communication", "asynchronous", "decoupled"]
        match_type: "threshold_linear"
        threshold_count: 2
        weight: 0.35

      - id: "C3_technology"
        keywords: ["kafka", "rabbitmq", "sqs", "sns", "eventbridge", "service bus",
                   "event grid", "nats", "pulsar"]
        match_type: "threshold_linear"
        threshold_count: 1
        weight: 0.25

  # ── Serverless ──
  - domain_id: "DOM-PAR-SERVER"
    detection_threshold: 0.65
    conditions:
      - id: "C1_explicit"
        keywords: ["serverless", "function-as-a-service", "faas", "lambda-based",
                   "serverless architecture"]
        match_type: "binary"
        weight: 0.45

      - id: "C2_indicators"
        keywords: ["lambda", "azure functions", "cloud functions", "cold start",
                   "pay-per-invocation", "stateless functions", "managed services",
                   "no infrastructure management"]
        match_type: "threshold_linear"
        threshold_count: 2
        weight: 0.35

      - id: "C3_patterns"
        keywords: ["step functions", "durable functions", "event-triggered",
                   "api gateway + lambda", "fanout"]
        match_type: "threshold_linear"
        threshold_count: 1
        weight: 0.20

  # ── Data Engineering ──
  - domain_id: "DOM-PAR-DATA"
    detection_threshold: 0.65
    conditions:
      - id: "C1_explicit"
        keywords: ["data pipeline", "data engineering", "data platform", "data lake",
                   "data warehouse", "data mesh", "lakehouse", "etl", "elt"]
        match_type: "binary"
        weight: 0.40

      - id: "C2_indicators"
        keywords: ["batch processing", "stream processing", "data ingestion",
                   "data transformation", "schema evolution", "data lineage",
                   "data catalog", "data quality", "cdc", "change data capture"]
        match_type: "threshold_linear"
        threshold_count: 2
        weight: 0.35

      - id: "C3_technology"
        keywords: ["spark", "airflow", "dbt", "snowflake", "databricks", "redshift",
                   "bigquery", "glue", "firehose", "kinesis", "flink", "synapse",
                   "azure synapse", "adls", "delta lake"]
        match_type: "threshold_linear"
        threshold_count: 1
        weight: 0.25

  # ── AI/ML & RAG ──
  - domain_id: "DOM-PAR-AI"
    detection_threshold: 0.65
    conditions:
      - id: "C1_explicit"
        keywords: ["rag", "retrieval augmented", "ai pipeline", "ml pipeline",
                   "machine learning", "llm", "large language model", "ai architecture"]
        match_type: "binary"
        weight: 0.40

      - id: "C2_indicators"
        keywords: ["embedding", "vector store", "chunking", "retrieval", "model serving",
                   "inference", "fine-tuning", "prompt engineering", "semantic search",
                   "knowledge base", "training pipeline", "feature store"]
        match_type: "threshold_linear"
        threshold_count: 2
        weight: 0.35

      - id: "C3_technology"
        keywords: ["openai", "pinecone", "weaviate", "chromadb", "langchain",
                   "sagemaker", "bedrock", "azure ai", "vertex ai", "huggingface",
                   "mlflow", "kubeflow"]
        match_type: "threshold_linear"
        threshold_count: 1
        weight: 0.25

  # ── Real-Time Processing ──
  - domain_id: "DOM-PAR-RT"
    detection_threshold: 0.65
    conditions:
      - id: "C1_explicit"
        description: "Explicit mention of real-time processing"
        keywords: ["real-time", "real time", "low-latency", "low latency", "live data",
                   "live feed", "streaming data", "live processing", "live signals"]
        match_type: "binary"
        weight: 0.40

      - id: "C2_indicators"
        description: "Real-time processing indicator terms (≥2 matches)"
        keywords: ["websocket", "backpressure", "tick data", "market data",
                   "signal processing", "sub-millisecond", "hot path", "time-series",
                   "event stream", "continuous query", "sliding window", "tumbling window",
                   "latency budget", "jitter", "clock sync"]
        match_type: "threshold_linear"
        threshold_count: 2
        weight: 0.35

      - id: "C3_technology"
        description: "Real-time technology stack mentions"
        keywords: ["kafka streams", "flink", "redis pub/sub", "zeromq", "nanomsg",
                   "lmax disruptor", "aeron", "chronicle queue", "socket.io",
                   "signalr", "sse", "server-sent events", "grpc streaming"]
        match_type: "threshold_linear"
        threshold_count: 1
        weight: 0.25

    anti_gaming: "Explicit keyword alone → 0.40 confidence (BELOW 0.65). Requires indicator OR technology evidence."

  # ── Monolithic ──
  - domain_id: "DOM-PAR-MONO"
    detection_threshold: 0.65
    conditions:
      - id: "C1_explicit"
        keywords: ["monolith", "monolithic", "modular monolith", "single deployment",
                   "traditional architecture"]
        match_type: "binary"
        weight: 0.45

      - id: "C2_indicators"
        keywords: ["single codebase", "shared database", "layered architecture",
                   "mvc", "three-tier", "vertical slices", "single team",
                   "simple deployment", "startup", "mvp"]
        match_type: "threshold_linear"
        threshold_count: 2
        weight: 0.35

      - id: "C3_negative"
        description: "Absence of distributed indicators (inverse signal)"
        keywords: ["microservices", "distributed", "multiple services", "service mesh"]
        match_type: "binary"
        weight: 0.20
        invert: true  # Score 1.0 if NONE found, 0.0 if any found

# ─────────────────────────────────────────────
# DETECTION RULES — PLATFORM DOMAINS
# ─────────────────────────────────────────────

  # ── AWS ──
  - domain_id: "DOM-PLT-AWS"
    detection_threshold: 0.60
    conditions:
      - id: "C1_explicit"
        keywords: ["aws", "amazon web services", "amazon cloud"]
        match_type: "binary"
        weight: 0.50

      - id: "C2_services"
        keywords: ["lambda", "dynamodb", "s3", "sqs", "sns", "ecs", "eks", "fargate",
                   "step functions", "eventbridge", "cloudfront", "cognito", "aurora",
                   "api gateway", "cdk", "cloudformation", "ec2", "rds"]
