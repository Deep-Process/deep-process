        threshold_count: 2
        weight: 0.50

  # ── Azure ──
  - domain_id: "DOM-PLT-AZURE"
    detection_threshold: 0.60
    conditions:
      - id: "C1_explicit"
        keywords: ["azure", "microsoft azure", "microsoft cloud"]
        match_type: "binary"
        weight: 0.50

      - id: "C2_services"
        keywords: ["azure functions", "cosmos db", "service bus", "event grid",
                   "aks", "app service", "front door", "entra id", "apim",
                   "azure devops", "blob storage", "azure sql"]
        match_type: "threshold_linear"
        threshold_count: 2
        weight: 0.50

  # ── GCP ──
  - domain_id: "DOM-PLT-GCP"
    detection_threshold: 0.60
    conditions:
      - id: "C1_explicit"
        keywords: ["gcp", "google cloud", "google cloud platform"]
        match_type: "binary"
        weight: 0.50

      - id: "C2_services"
        keywords: ["cloud functions", "bigquery", "cloud run", "pub/sub", "gke",
                   "cloud storage", "firestore", "cloud sql", "vertex ai", "dataflow"]
        match_type: "threshold_linear"
        threshold_count: 2
        weight: 0.50

  # ── Kubernetes ──
  - domain_id: "DOM-PLT-K8S"
    detection_threshold: 0.60
    conditions:
      - id: "C1_explicit"
        keywords: ["kubernetes", "k8s", "container orchestration"]
        match_type: "binary"
        weight: 0.50

      - id: "C2_indicators"
        keywords: ["pods", "helm", "istio", "service mesh", "operators",
                   "container", "docker", "kubectl", "ingress"]
        match_type: "threshold_linear"
        threshold_count: 2
        weight: 0.50

# ─────────────────────────────────────────────
# DETECTION RULES — INTEGRATION DOMAINS
# ─────────────────────────────────────────────

  # ── Polyglot ──
  - domain_id: "DOM-INT-POLY"
    detection_threshold: 0.60
    conditions:
      - id: "C1_explicit"
        keywords: ["polyglot", "multi-language", "multiple languages"]
        match_type: "binary"
        weight: 0.45

      - id: "C2_indicators"
        keywords: ["node.js and python", "java and typescript", "go and python",
                   "mixed technology", "language boundary", "different runtimes",
                   "best tool for the job", "typescript and java"]
        match_type: "threshold_linear"
        threshold_count: 1
        weight: 0.55

  # ── Multi-Tenant ──
  - domain_id: "DOM-INT-MULTI"
    detection_threshold: 0.65
    conditions:
      - id: "C1_explicit"
        keywords: ["multi-tenant", "multi tenant", "saas", "software as a service"]
        match_type: "binary"
        weight: 0.45

      - id: "C2_indicators"
        keywords: ["tenant isolation", "data partitioning", "noisy neighbor",
                   "per-tenant", "tenant context", "shared infrastructure",
                   "tenant onboarding", "subscription tiers"]
        match_type: "threshold_linear"
        threshold_count: 2
        weight: 0.55

  # ── Legacy Integration ──
  - domain_id: "DOM-INT-LEGACY"
    detection_threshold: 0.60
    conditions:
      - id: "C1_explicit"
        keywords: ["legacy", "brownfield", "migration", "modernization",
                   "legacy integration"]
        match_type: "binary"
        weight: 0.45

      - id: "C2_indicators"
        keywords: ["strangler", "anti-corruption layer", "data sync", "coexistence",
                   "phased migration", "existing system", "replace gradually",
                   "mainframe", "monolith to microservices"]
        match_type: "threshold_linear"
        threshold_count: 1
        weight: 0.55

# ─────────────────────────────────────────────
# ANTI-GAMING VERIFICATION
# ─────────────────────────────────────────────
anti_gaming:
  single_keyword_defense: "Single keyword → max weight of heaviest condition (0.40-0.50), below all thresholds (0.60-0.65)"
  multi_condition_requirement: "All domains require ≥2 conditions to reach threshold"
  resistance_estimate: "95% — single keyword cannot pass, requires contextual evidence"

  examples:
    - brief: "Build a system using AWS"
      detection: { "DOM-PLT-AWS": 0.50 }  # C1 only → below 0.60 threshold
      note: "FAILS — needs service mentions too. Agent must ask for more context."

    - brief: "Build microservices on AWS with Lambda, SQS, and DynamoDB"
      detection: { "DOM-PAR-MICRO": 0.40, "DOM-PLT-AWS": 1.00, "DOM-PAR-SERVER": 0.45 }
      note: "AWS detected (strong services evidence). Microservices and serverless below threshold — agent should ask clarifying questions."

    - brief: "Design a microservices architecture with saga pattern, independent deployment, using AWS Lambda, SQS, SNS, and DynamoDB"
      detection: { "DOM-PAR-MICRO": 0.87, "DOM-PAR-EVENT": 0.65, "DOM-PLT-AWS": 1.00, "DOM-PAR-SERVER": 0.65 }
      note: "PASSES — rich brief with explicit terms, indicators, and technology mentions."
