---
# Deep Risk Process
# Systematic risk assessment with binding enforcement
---

process_name: deep-risk
version: "2.3.0"
13_zasady_version: "1.0.0"
created: "2026-02-16"

# ═══════════════════════════════════════════════════════════════
# METADATA
# ═══════════════════════════════════════════════════════════════

metadata:
  category: RISK_ASSESSMENT
  complexity: HIGH

# ═══════════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════════

inputs:
  architecture:
    type: artifact
    schema_ref: "schemas/architecture-schema.yaml"
    required: true
    loaded_from: "artifacts/architecture.yaml"

  requirements:
    type: artifact
    schema_ref: "schemas/requirements-schema.yaml"
    required: false
    loaded_from: "artifacts/requirements.yaml"

  depth_level:
    type: enum
    values: [quick, standard, comprehensive, critical]
    default: standard
    loaded_from: "data/risk-scoring.yaml"

# ═══════════════════════════════════════════════════════════════
# PHASES (OODA STRUCTURE)
# ═══════════════════════════════════════════════════════════════

phases:
  phase_0_ground:
    observe:
      action: "LOAD architecture.yaml + requirements.yaml"
      gate: "GATE_0_OBSERVED"

    orient:
      action: "EXTRACT theoretical_foundations FROM data/theoretical-foundations.yaml"
      assumptions: "DECLARE applicable_theories per domain"
      gate: "GATE_0_ORIENTED"

    decide:
      action: "IF foundations_applicable THEN load_patterns ELSE use_generic"
      gate: "GATE_0_DECIDED"

    act:
      action: "CREATE grounding-context.yaml WITH selected_theories"
      gate: "GATE_0"

  phase_1_identify_vertical:
    observe:
      action: "LOAD grounding-context.yaml + data/risk-pattern-libraries/*.yaml"
      gate: "GATE_1_OBSERVED"

    orient:
      action: "CLASSIFY components BY risk_categories USING pattern_detection"
      assumptions: "DECLARE pattern_libraries per domain"
      gate: "GATE_1_ORIENTED"

    decide:
      action: "FOR EACH component IF matches_pattern THEN extract_risks"
      gate: "GATE_1_DECIDED"

    act:
      action: "CREATE vertical-risks.yaml WITH component_risks"
      gate: "GATE_1"

  phase_2_identify_horizontal:
    observe:
      action: "LOAD vertical-risks.yaml"
      gate: "GATE_2_OBSERVED"

    orient:
      action: "ANALYZE dependencies FOR cascades + correlations"
      assumptions: "DECLARE interaction_scope boundaries"
      gate: "GATE_2_ORIENTED"

    decide:
      action: "IF dependency_risk THEN trace_cascade ELSE skip"
      gate: "GATE_2_DECIDED"

    act:
      action: "CREATE horizontal-risks.yaml WITH interaction_map"
      gate: "GATE_2"

  phase_3_quantify:
    observe:
      action: "LOAD vertical-risks.yaml + horizontal-risks.yaml"
      gate: "GATE_3_OBSERVED"

    orient:
      action: "SCORE ALL risks USING 5D(P/I/V/D/R) FROM data/risk-scoring.yaml"
      assumptions: "DECLARE scoring_confidence per risk"
      gate: "GATE_3_ORIENTED"

    decide:
      action: "FOR EACH risk IF score > threshold THEN flag_critical"
      gate: "GATE_3_DECIDED"

    act:
      action: "CREATE risk-register.yaml WITH ALL 5D_scores"
      gate: "GATE_3"

  phase_4_interact:
    observe:
      action: "LOAD risk-register.yaml"
      gate: "GATE_4_OBSERVED"

    orient:
      action: "EXECUTE ADVERSARY Devil's_Advocate + Missing_Risk_Hunt"
      assumptions: "DECLARE adversary_completeness criteria"
      gate: "GATE_4_ORIENTED"

    decide:
      action: "IF adversary_finds_gaps THEN add_to_register ELSE proceed"
      gate: "GATE_4_DECIDED"

    act:
      action: "CREATE risk-interaction-map.yaml WITH adversary_findings"
      gate: "GATE_4"

  phase_5_mitigate:
    observe:
      action: "LOAD risk-register.yaml + risk-interaction-map.yaml"
      gate: "GATE_5_OBSERVED"

    orient:
      action: "CLASSIFY mitigations AS 4T(Transfer/Treat/Tolerate/Terminate)"
      assumptions: "DECLARE mitigation_strategy per risk"
      gate: "GATE_5_ORIENTED"

    decide:
      action: "FOR EACH mitigation IF Cobra_Effect_detected THEN redesign"
      gate: "GATE_5_DECIDED"

    act:
      action: "CREATE mitigation-portfolio.yaml WITH 4T_classifications"
      gate: "GATE_5"

  phase_6_monitor:
    observe:
      action: "LOAD mitigation-portfolio.yaml"
      gate: "GATE_6_OBSERVED"

    orient:
      action: "DESIGN leading_indicators + review_cadence + escalation_protocol"
      assumptions: "DECLARE monitoring_scope"
      gate: "GATE_6_ORIENTED"

    decide:
      action: "IF monitoring_creates_perverse_effects THEN Cobra_check"
      gate: "GATE_6_DECIDED"

    act:
      action: "CREATE monitoring-system.yaml WITH indicators"
      gate: "GATE_6"

  phase_7_output:
    observe:
      action: "LOAD ALL phase_outputs"
      gate: "GATE_7_OBSERVED"

    orient:
      action: "EXECUTE META_audit portfolio_coherence + completeness"
      assumptions: "DECLARE output_format requirements"
      gate: "GATE_7_ORIENTED"

    decide:
      action: "IF coherence_fails THEN flag_inconsistency ELSE proceed"
      gate: "GATE_7_DECIDED"

    act:
      action: "CREATE risk-report.md + risk-register.yaml(final)"
      gate: "GATE_7"

# ═══════════════════════════════════════════════════════════════
# OUTPUTS
# ═══════════════════════════════════════════════════════════════

outputs:
  grounding-context: {schema: "{theories, patterns}", phase: 0}
  vertical-risks: {schema: "{component_risks[]}", phase: 1}
  horizontal-risks: {schema: "{cascades[], correlations[]}", phase: 2}
  risk-register: {schema: "{risks[], 5D_scores{}}", phase: 3}
  risk-interaction-map: {schema: "{interactions[], adversary_findings[]}", phase: 4}
  mitigation-portfolio: {schema: "{4T_classifications{}}", phase: 5}
  monitoring-system: {schema: "{leading_indicators[], cadence, escalation}", phase: 6}
  risk-report: {schema_ref: "data/risk-report-template.md", phase: 7}

# ═══════════════════════════════════════════════════════════════
# VALIDATION GATES
# ═══════════════════════════════════════════════════════════════

validation_gates:
  GATE_0:
    condition: "grounding-context.yaml EXISTS AND theories_selected"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_1:
    condition: "vertical-risks.yaml EXISTS AND pattern_detection >= min_coverage"
    on_fail: "SCOPE_REDUCTION OR HALT"
    severity: CRITICAL

  GATE_2:
    condition: "horizontal-risks.yaml EXISTS AND cascades_analyzed"
    on_fail: "EMIT_WARNING + PROCEED"
    severity: WARNING

  GATE_3:
    condition: "risk-register.yaml EXISTS AND ALL risks 5D_scored"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_4:
    condition: "risk-interaction-map.yaml EXISTS AND adversary_complete"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_5:
    condition: "mitigation-portfolio.yaml EXISTS AND Cobra_checks_passed"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_6:
    condition: "monitoring-system.yaml EXISTS AND indicators_defined"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_7:
    condition: "risk-report.md + risk-register.yaml(final) EXIST"
    on_fail: "HALT"
    severity: BLOCKER

# ═══════════════════════════════════════════════════════════════
# ERROR HANDLERS
# ═══════════════════════════════════════════════════════════════

error_handlers:
  missing_input:
    trigger: "architecture.yaml NOT PROVIDED"
    severity: CRITICAL
    action: "HALT WITH error_missing_architecture"
    recovery: "Request architecture artifact"

  invalid_input:
    trigger: "architecture.yaml schema VALIDATION FAILS"
    severity: HIGH
    action: "HALT WITH validation_error"
    recovery: "Request valid architecture"

  partial_completion:
    trigger: "phase N reaches 70% THEN interrupted"
    severity: MEDIUM
    action: "SAVE checkpoint + HALT"
    recovery: "Resume from checkpoint"

  external_dependency_failure:
    trigger: "data/risk-pattern-libraries/* NOT ACCESSIBLE"
    severity: MEDIUM
    action: "USE core_patterns_only + EMIT_WARNING"
    recovery: "Continue with reduced coverage"

  timeout:
    trigger: "phase_duration > max_allowed"
    severity: HIGH
    action: "SAVE state + HALT WITH timeout_error"
    recovery: "User decides: continue OR abort"

  resource_exhaustion:
    trigger: "risk_count > max_processable"
    severity: HIGH
    action: "PRIORITIZE by score + REDUCE scope"
    recovery: "Continue with top N risks"

  concurrent_modification:
    trigger: "architecture.yaml CHANGED during execution"
    severity: CRITICAL
    action: "RELOAD + RESTART from GATE_0"
    recovery: "Phase 0 re-execution"

  user_cancellation:
    trigger: "user_cancels DURING execution"
    severity: LOW
    action: "SAVE checkpoint + CLEANUP"
    recovery: "State saved for resume"

# ═══════════════════════════════════════════════════════════════
# COMPLIANCE
# ═══════════════════════════════════════════════════════════════

compliance_13_zasady:
  zasada_0_ooda: "PASS - 8 phases OODA"
  zasada_1_self_contained: "PASS - methods in steps/"
  zasada_2_completeness: "PASS - ALL risks scored GATE_3"
  zasada_3_mechanisms: "PASS - 8 gates IF-THEN"
  zasada_4_binding_gates: "PASS - BLOCKER enforcement"
  zasada_5_assumptions: "PASS - DECLARE each phase"
  zasada_6_evr: "PASS - observe→orient→act"
  zasada_7_checklists: "PASS - step files"
  zasada_8_counter_checks: "PASS - ADVERSARY phase_4"
  zasada_9_executable: "PASS - LOAD/CREATE/IF"
  zasada_10_visible_reasoning: "PASS - orient shows logic"
  zasada_11_instruction_data: "PASS - schemas + patterns"
  zasada_12_jit: "PASS - steps/*.md JIT"
  zasada_13_zero_decoration: "PASS - no explanations"

---
# END deep-risk process.yaml
