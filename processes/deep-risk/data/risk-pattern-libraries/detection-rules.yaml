# Risk Pattern Library Detection Rules
# Determines which domain libraries to load based on project characteristics
# Used in step-01 Method #106 (Historical Pattern Matching)

version: "1.0.0"
description: |
  Multi-condition detection engine for selecting relevant risk pattern libraries.
  Each domain has 2-3 detection conditions with weighted scoring.
  Libraries with confidence >= threshold are activated.
  Core library is ALWAYS loaded (auto_apply: true).

algorithm:
  name: "Weighted Multi-Condition Detection"
  steps:
    1: "Load core library (auto_apply — always active)"
    2: "Scan repository/project description for detection conditions"
    3: "For EACH domain library, evaluate ALL conditions"
    4: "Calculate confidence = sum(weight × match_score) / sum(weight)"
    5: "IF confidence >= threshold → activate library"
    6: "Log evidence for each activated library"
    7: "Execute counter-checks (CC-DET-01, CC-DET-02, CC-DET-03)"

  match_score_functions:
    binary: "1.0 if condition met, 0.0 if not"
    threshold_linear: "min(1.0, actual_count / threshold_count)"

domains:
  core:
    auto_apply: true
    description: "Always loaded — universal patterns apply to all projects"
    detection: null  # No detection needed

  distributed-systems:
    auto_apply: false
    threshold: 0.70
    conditions:
      - id: C1_distributed_markers
        type: content_search
        search: ["microservice", "message queue", "event bus", "Kafka", "RabbitMQ", "gRPC", "service mesh", "load balancer", "cluster", "replica"]
        minimum_matches: 3
        weight: 0.45
        match_score: threshold_linear  # min(1.0, matches/3)
      - id: C2_network_config
        type: file_existence
        files: ["docker-compose.yml", "docker-compose.yaml", "kubernetes/", "k8s/", "helm/", "istio/"]
        minimum_matches: 1
        weight: 0.35
        match_score: binary
      - id: C3_multi_service
        type: content_search
        search: ["service discovery", "circuit breaker", "retry policy", "timeout", "health check", "distributed tracing"]
        minimum_matches: 2
        weight: 0.20
        match_score: threshold_linear

  data-engineering:
    auto_apply: false
    threshold: 0.70
    conditions:
      - id: C1_data_markers
        type: content_search
        search: ["ETL", "pipeline", "data warehouse", "data lake", "Spark", "Airflow", "dbt", "BigQuery", "Redshift", "Snowflake", "Databricks"]
        minimum_matches: 2
        weight: 0.45
        match_score: threshold_linear
      - id: C2_data_files
        type: file_existence
        files: ["dags/", "pipelines/", "models/", "schemas/", "migrations/", "dbt_project.yml"]
        minimum_matches: 1
        weight: 0.30
        match_score: binary
      - id: C3_data_governance
        type: content_search
        search: ["data quality", "lineage", "catalog", "schema registry", "data contract", "GDPR", "PII", "retention"]
        minimum_matches: 2
        weight: 0.25
        match_score: threshold_linear

  enterprise:
    auto_apply: false
    threshold: 0.65
    conditions:
      - id: C1_enterprise_markers
        type: content_search
        search: ["SAP", "Oracle", "Salesforce", "ERP", "CRM", "LDAP", "Active Directory", "SSO", "SAML", "enterprise bus"]
        minimum_matches: 2
        weight: 0.40
        match_score: threshold_linear
      - id: C2_compliance
        type: content_search
        search: ["compliance", "audit", "SOX", "HIPAA", "PCI", "ISO 27001", "SOC 2", "regulatory", "governance"]
        minimum_matches: 2
        weight: 0.35
        match_score: threshold_linear
      - id: C3_legacy
        type: content_search
        search: ["legacy", "migration", "COBOL", "mainframe", "monolith", "end-of-life", "deprecated", "vendor lock"]
        minimum_matches: 1
        weight: 0.25
        match_score: binary

  project-management:
    auto_apply: false
    threshold: 0.60
    conditions:
      - id: C1_team_scale
        type: content_search
        search: ["multiple teams", "cross-functional", "remote", "distributed team", "contractor", "vendor", "outsource"]
        minimum_matches: 2
        weight: 0.50
        match_score: threshold_linear
      - id: C2_delivery_markers
        type: content_search
        search: ["deadline", "milestone", "sprint", "release train", "MVP", "phase", "go-live", "launch"]
        minimum_matches: 2
        weight: 0.50
        match_score: threshold_linear

  cloud-infrastructure:
    auto_apply: false
    threshold: 0.75
    conditions:
      - id: C1_cloud_provider
        type: content_search
        search: ["AWS", "Azure", "GCP", "CloudFormation", "Terraform", "Pulumi", "CDK", "ARM template", "cloud"]
        minimum_matches: 2
        weight: 0.40
        match_score: threshold_linear
      - id: C2_cloud_services
        type: content_search
        search: ["Lambda", "S3", "EC2", "RDS", "DynamoDB", "Cloud Functions", "App Engine", "AKS", "EKS", "ECS", "Fargate"]
        minimum_matches: 3
        weight: 0.35
        match_score: threshold_linear
      - id: C3_iac_files
        type: file_existence
        files: ["*.tf", "cdk.json", "template.yaml", "serverless.yml", "sam.yaml", "cloudformation/", "terraform/", "infrastructure/"]
        minimum_matches: 1
        weight: 0.25
        match_score: binary

  security-cybersecurity:
    auto_apply: false
    threshold: 0.65
    conditions:
      - id: C1_security_markers
        type: content_search
        search: ["authentication", "authorization", "encryption", "TLS", "JWT", "OAuth", "RBAC", "WAF", "firewall", "certificate"]
        minimum_matches: 3
        weight: 0.40
        match_score: threshold_linear
      - id: C2_security_sensitive
        type: content_search
        search: ["payment", "PII", "credentials", "secrets", "API key", "token", "password", "financial", "healthcare", "HIPAA"]
        minimum_matches: 2
        weight: 0.35
        match_score: threshold_linear
      - id: C3_security_tooling
        type: content_search
        search: ["SAST", "DAST", "penetration test", "vulnerability scan", "OWASP", "security audit", "threat model", "CVE"]
        minimum_matches: 1
        weight: 0.25
        match_score: binary

  ai-ml-systems:
    auto_apply: false
    threshold: 0.70
    conditions:
      - id: C1_ml_markers
        type: content_search
        search: ["model", "training", "inference", "neural network", "deep learning", "PyTorch", "TensorFlow", "scikit", "transformer", "LLM", "GPT", "embedding"]
        minimum_matches: 3
        weight: 0.45
        match_score: threshold_linear
      - id: C2_ml_pipeline
        type: content_search
        search: ["feature store", "model registry", "MLOps", "experiment tracking", "MLflow", "Kubeflow", "SageMaker", "training pipeline", "data labeling"]
        minimum_matches: 2
        weight: 0.30
        match_score: threshold_linear
      - id: C3_ml_files
        type: file_existence
        files: ["models/", "notebooks/", "*.ipynb", "requirements.txt", "model_config.*", "hyperparameters.*"]
        minimum_matches: 2
        weight: 0.25
        match_score: threshold_linear

  web-applications:
    auto_apply: false
    threshold: 0.70
    conditions:
      - id: C1_web_markers
        type: content_search
        search: ["React", "Angular", "Vue", "Next.js", "Express", "Django", "Flask", "REST API", "GraphQL", "frontend", "backend", "SPA"]
        minimum_matches: 3
        weight: 0.45
        match_score: threshold_linear
      - id: C2_web_concerns
        type: content_search
        search: ["session", "cookie", "CORS", "CSP", "XSS", "CSRF", "rate limit", "CDN", "cache", "SEO", "accessibility"]
        minimum_matches: 2
        weight: 0.30
        match_score: threshold_linear
      - id: C3_web_files
        type: file_existence
        files: ["package.json", "tsconfig.json", "webpack.config.*", "next.config.*", "public/", "pages/", "components/"]
        minimum_matches: 2
        weight: 0.25
        match_score: threshold_linear

  microservices:
    auto_apply: false
    threshold: 0.70
    conditions:
      - id: C1_microservice_markers
        type: content_search
        search: ["microservice", "service boundary", "bounded context", "API gateway", "service registry", "saga", "CQRS", "event sourcing"]
        minimum_matches: 2
        weight: 0.45
        match_score: threshold_linear
      - id: C2_service_infra
        type: content_search
        search: ["Docker", "Kubernetes", "container", "pod", "deployment", "service mesh", "Istio", "Envoy", "sidecar"]
        minimum_matches: 2
        weight: 0.35
        match_score: threshold_linear
      - id: C3_multi_repo
        type: file_existence
        files: ["services/", "apps/", "packages/", "docker-compose.yml", "skaffold.yaml"]
        minimum_matches: 1
        weight: 0.20
        match_score: binary

  serverless-realtime:
    auto_apply: false
    threshold: 0.70
    conditions:
      - id: C1_serverless_markers
        type: content_search
        search: ["Lambda", "Cloud Functions", "Azure Functions", "serverless", "FaaS", "event-driven", "trigger", "cold start", "invocation"]
        minimum_matches: 2
        weight: 0.40
        match_score: threshold_linear
      - id: C2_realtime_markers
        type: content_search
        search: ["WebSocket", "SSE", "real-time", "streaming", "pub/sub", "notification", "push", "live update", "low latency"]
        minimum_matches: 2
        weight: 0.35
        match_score: threshold_linear
      - id: C3_event_files
        type: file_existence
        files: ["serverless.yml", "sam.yaml", "functions/", "handlers/", "events/"]
        minimum_matches: 1
        weight: 0.25
        match_score: binary

anti_gaming:
  scenarios:
    - scenario: "Single keyword match inflates confidence"
      defense: "Multi-condition (2-3 conditions per domain), minimum_matches threshold"
      resistance: "95%"
    - scenario: "File existence without real usage"
      defense: "Content search conditions weighted higher (0.40-0.45) than file existence (0.20-0.25)"
      resistance: "90%"
    - scenario: "Generic terms match wrong domain"
      defense: "Domain-specific terms (not generic), minimum 2-3 matches required"
      resistance: "92%"

counter_checks:
  - id: CC-DET-01
    method: "#85 Grounding Check"
    action: "Sample 3 activated libraries → verify each has ≥2 evidence items from actual project content"
    pass_criteria: "3/3 libraries grounded with concrete evidence"
    fail_action: "BLOCKER → remove ungrounded library"

  - id: CC-DET-02
    method: "#168 Phantom Hunt"
    action: "Re-scan project with fresh eyes → verify no domain library is hallucinated (activated without real evidence)"
    pass_criteria: "0 phantom libraries"
    fail_action: "ERROR → deactivate phantom library"

  - id: CC-DET-03
    method: "#84 Coherence Check"
    action: "Verify activated libraries coherent with system characterization from step-00 (e.g., 'web monolith' should not activate microservices library)"
    pass_criteria: "No contradictions between system profile and activated libraries"
    fail_action: "WARNING → resolve contradiction"

integration:
  binding_point: "step-01-identify-vertical.md, Method #106 (Historical Pattern Matching)"
  execution: |
    1. At step-01 start, run detection algorithm
    2. Load core.yaml (always)
    3. For each domain with confidence >= threshold, load domain library
    4. Pass activated_libraries to Method #106
    5. Method #106 matches current system against pattern signatures
    6. Log activated libraries + evidence in vertical-risk-inventory.yaml
  gate_enforcement: |
    GATE_1 condition G1-07: Pattern libraries detected and loaded (CRITICAL)
    Verification: Check detection_log exists with ≥1 library activated (core minimum)
    Failure: Return to detection, verify project characteristics
