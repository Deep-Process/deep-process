# AI/ML Systems Risk Pattern Library
# Patterns specific to machine learning pipelines, model deployment, and AI systems

library:
  id: "ai-ml-systems"
  name: "AI/ML Systems Risk Patterns"
  version: "1.0.0"
  description: "Failure patterns from ML model development, deployment, and operations"

patterns:
  - id: "AIML-001"
    name: "Training-Serving Skew"
    description: |
      Model performs differently in production than in training/testing.
      Feature engineering, data preprocessing, or input distributions differ
      between training pipeline and serving infrastructure.

    signature:
      - "Separate codebases for training and serving"
      - "Feature engineering not shared between pipelines"
      - "Model accuracy drops after deployment"
      - "No feature store or shared transformation layer"

    anti_patterns:
      - "Different preprocessing in training vs serving"
      - "Training on batch data, serving on streaming"
      - "No feature parity validation"
      - "Manual feature engineering not reproducible"

    indicators:
      - "Prediction accuracy lower in production than offline evaluation"
      - "Feature value distributions differ between training and serving"
      - "A/B test results don't match offline experiment"

    historical_examples:
      - "Common in recommendation systems: Offline metrics excellent, online metrics poor"
      - "Self-driving cars: Simulation performance doesn't match real-world"

    mitigation_hints:
      - "Shared feature store"
      - "Feature parity monitoring"
      - "Shadow deployment before full rollout"

  - id: "AIML-002"
    name: "Data Drift Degradation"
    description: |
      Model input data distribution changes over time, causing gradual
      performance degradation. Model trained on historical data becomes
      stale as world changes.

    signature:
      - "No data drift monitoring"
      - "Model retrained on schedule, not on drift detection"
      - "No baseline comparison for input distributions"
      - "Seasonal patterns not accounted for"

    anti_patterns:
      - "Train once, deploy forever"
      - "No monitoring of prediction distributions"
      - "Ignoring concept drift (relationship between features and target changes)"
      - "No automated retraining trigger"

    indicators:
      - "Declining prediction accuracy over time"
      - "Input feature distributions shifting"
      - "Increasing prediction uncertainty"

    historical_examples:
      - "COVID-19: Most demand forecasting models broke overnight"
      - "Credit scoring: Economic changes invalidated historical patterns"

    mitigation_hints:
      - "Statistical drift detection (KS test, PSI)"
      - "Automated retraining on drift detection"
      - "Model performance dashboards"

  - id: "AIML-003"
    name: "Bias Amplification Loop"
    description: |
      Model learns and amplifies existing biases in training data.
      Deployed model's predictions create feedback loop that reinforces bias.

    signature:
      - "Training data from biased historical decisions"
      - "No fairness metrics tracked"
      - "Model predictions fed back into training data"
      - "Protected attributes not analyzed for bias"

    anti_patterns:
      - "Using biased historical data without correction"
      - "No fairness auditing"
      - "Feedback loops without bias monitoring"
      - "Optimizing only for accuracy, ignoring fairness"

    indicators:
      - "Disparate impact across protected groups"
      - "Performance varies significantly by demographic"
      - "Bias complaints from users"

    historical_examples:
      - "Amazon 2018: Recruiting AI biased against women"
      - "COMPAS: Criminal risk assessment biased against Black defendants"
      - "Healthcare algorithm: Racial bias in care allocation"

    mitigation_hints:
      - "Fairness metrics in model evaluation"
      - "Bias auditing before deployment"
      - "Human-in-the-loop for high-stakes decisions"

  - id: "AIML-004"
    name: "Model Interpretability Black Box"
    description: |
      Complex model makes decisions that cannot be explained or audited.
      Regulatory or stakeholder requirements for explainability cannot be met.

    signature:
      - "Deep learning models for regulated decisions"
      - "No feature importance tracking"
      - "Cannot explain individual predictions"
      - "Model decisions challenged without ability to respond"

    anti_patterns:
      - "Choosing complex models without interpretability assessment"
      - "No SHAP/LIME analysis"
      - "Treating model as infallible oracle"
      - "No human override mechanism"

    indicators:
      - "Inability to answer 'why this prediction?'"
      - "Regulatory audit concerns"
      - "Stakeholder distrust of model decisions"

    historical_examples:
      - "GDPR right to explanation challenges for automated decisions"
      - "Insurance and lending: Regulators requiring model explainability"

    mitigation_hints:
      - "Explainability toolkit (SHAP, LIME, InterpretML)"
      - "Model cards documenting capabilities and limitations"
      - "Human override for consequential decisions"

  - id: "AIML-005"
    name: "GPU/Compute Cost Spiral"
    description: |
      Training and inference costs escalate beyond budget. Larger models
      require more compute, experimentation multiplies costs.

    signature:
      - "No compute budget tracking"
      - "Experiments running without cost awareness"
      - "GPU instances left running after experiments"
      - "Model size growing without cost analysis"

    anti_patterns:
      - "Unlimited experiment compute"
      - "No spot/preemptible instance usage"
      - "Training on full dataset when sample would suffice"
      - "No model compression for inference"

    indicators:
      - "GPU costs growing faster than revenue"
      - "Idle GPU instances"
      - "Training jobs without timeout"

    historical_examples:
      - "GPT-3 training cost: ~$4.6M for single training run"
      - "Research labs with unbounded compute budgets causing organizational strain"

    mitigation_hints:
      - "Compute budget per experiment"
      - "Spot instances for training"
      - "Model distillation/pruning for inference"

  - id: "AIML-006"
    name: "Hallucination and Confabulation"
    description: |
      Generative AI models produce confident but factually incorrect outputs.
      Users trust outputs without verification, leading to incorrect decisions.

    signature:
      - "LLM/generative model in production without guardrails"
      - "No output validation or fact-checking"
      - "Users treating AI output as ground truth"
      - "No confidence scoring or uncertainty quantification"

    anti_patterns:
      - "Deploying generative AI without human review"
      - "No content filtering or safety checks"
      - "Using AI output for critical decisions without verification"
      - "No fallback for low-confidence outputs"

    indicators:
      - "User reports of incorrect AI outputs"
      - "Factual errors in AI-generated content"
      - "Growing trust without growing accuracy"

    historical_examples:
      - "Lawyer using ChatGPT: Filed brief with hallucinated case citations"
      - "Google Bard launch: Factual error in first demo"
      - "Bing Chat: Confidently incorrect answers"

    mitigation_hints:
      - "Output validation pipeline"
      - "Retrieval-augmented generation (RAG)"
      - "Human review for high-stakes outputs"
      - "Confidence scores with threshold-based routing"

  - id: "AIML-007"
    name: "Data Pipeline Fragility"
    description: |
      ML data pipeline has multiple failure points — schema changes,
      data source outages, or quality degradation silently corrupt
      training data or features.

    signature:
      - "No schema validation on ingestion"
      - "Silent failures in data pipeline"
      - "No data quality monitoring"
      - "Missing data imputed without alerting"

    anti_patterns:
      - "No data contracts between producers and consumers"
      - "Pipeline failures caught only when model degrades"
      - "No data versioning"
      - "Feature computation without null handling"

    indicators:
      - "Unexpected null rates in features"
      - "Schema changes breaking downstream"
      - "Model performance correlated with data pipeline issues"

    historical_examples:
      - "Zillow 2021: Home-buying algorithm lost $569M due to faulty predictions from bad data"
      - "Common: Feature store corruption causing cascading model failures"

    mitigation_hints:
      - "Schema validation at every pipeline stage"
      - "Data quality monitoring dashboards"
      - "Data versioning and lineage tracking"

  - id: "AIML-008"
    name: "Adversarial Attack Surface"
    description: |
      ML models vulnerable to adversarial inputs that cause misclassification
      or unexpected behavior. Attackers can manipulate inputs to exploit model.

    signature:
      - "Model accepts untrusted user inputs"
      - "No adversarial testing in evaluation"
      - "No input validation beyond basic types"
      - "Model used for security-sensitive decisions"

    anti_patterns:
      - "No adversarial robustness testing"
      - "Model directly exposed to user input"
      - "No input preprocessing or anomaly detection"
      - "Assuming model robustness without testing"

    indicators:
      - "Unusual prediction patterns"
      - "Out-of-distribution inputs increasing"
      - "Targeted misclassifications reported"

    historical_examples:
      - "Adversarial patches fooling image classifiers"
      - "Prompt injection attacks on LLMs"
      - "Spam/content moderation evasion"

    mitigation_hints:
      - "Adversarial robustness training"
      - "Input validation and anomaly detection"
      - "Defense in depth (don't rely solely on model)"
