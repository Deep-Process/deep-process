# Serverless & Real-Time Systems Risk Pattern Library
# Patterns specific to serverless architectures, event-driven systems, and real-time processing

library:
  id: "serverless-realtime"
  name: "Serverless & Real-Time Risk Patterns"
  version: "1.0.0"
  description: "Failure patterns from serverless platforms, event-driven architectures, and real-time systems"

patterns:
  - id: "SRT-001"
    name: "Cold Start Latency Trap"
    description: |
      Serverless function initialization causes unacceptable latency for
      user-facing requests. Intermittent slow responses degrade UX.

    signature:
      - "Lambda/Cloud Functions with >1s cold start"
      - "Java/C# runtimes in serverless"
      - "Large deployment packages"
      - "VPC-connected functions"

    anti_patterns:
      - "Heavy frameworks in serverless (Spring Boot, .NET)"
      - "No provisioned concurrency for critical paths"
      - "VPC attachment without dedicated NAT"
      - "Ignoring P99 latency (only tracking P50)"

    indicators:
      - "Bimodal latency distribution (fast warm, slow cold)"
      - "User complaints about intermittent slowness"
      - "P99 latency 10-100x higher than P50"

    historical_examples:
      - "Common: Java Lambda cold starts of 5-10 seconds"
      - "API Gateway timeout from Lambda cold start"

    mitigation_hints:
      - "Provisioned concurrency for critical paths"
      - "Lightweight runtimes (Node.js, Python, Go)"
      - "Minimal deployment packages"

  - id: "SRT-002"
    name: "Event Storm Cascade"
    description: |
      Event-driven system produces exponential event amplification.
      One event triggers multiple handlers, each producing more events,
      creating uncontrollable cascade.

    signature:
      - "Events triggering other events"
      - "No circuit breaker on event handlers"
      - "No event deduplication"
      - "Fan-out patterns without rate limiting"

    anti_patterns:
      - "Recursive event patterns (event A triggers B triggers A)"
      - "No dead letter queue"
      - "No event rate limiting"
      - "Unbounded fan-out"

    indicators:
      - "Exponential Lambda invocation spikes"
      - "Event queue depth growing uncontrollably"
      - "Unexpected cloud bill spikes"

    historical_examples:
      - "S3 event → Lambda → S3 → Lambda infinite loop"
      - "Common: SNS fan-out overwhelming downstream services"

    mitigation_hints:
      - "Event deduplication (idempotent handlers)"
      - "Circuit breakers on event handlers"
      - "Dead letter queues with alerting"

  - id: "SRT-003"
    name: "Serverless Vendor Lock-in"
    description: |
      Heavy use of provider-specific serverless services makes migration
      impossible. Application logic intertwined with platform services.

    signature:
      - "Step Functions / Durable Functions for business logic"
      - "Provider-specific event sources (EventBridge, Cloud Scheduler)"
      - "No abstraction between business logic and platform"
      - "Provider-specific IAM in function code"

    anti_patterns:
      - "Business logic in infrastructure definitions (SAM, Serverless Framework)"
      - "Using proprietary APIs directly in handlers"
      - "No hexagonal/ports-adapters architecture"
      - "Testing requires cloud deployment"

    indicators:
      - "Cannot run functions locally"
      - "Cannot estimate migration effort"
      - "Function code contains provider SDK calls"

    historical_examples:
      - "Organizations unable to multi-cloud due to serverless lock-in"
      - "Cost negotiations limited by migration impossibility"

    mitigation_hints:
      - "Hexagonal architecture for serverless"
      - "Adapter pattern for cloud services"
      - "Local testing framework"

  - id: "SRT-004"
    name: "Message Ordering Assumption"
    description: |
      System assumes message ordering that platform doesn't guarantee.
      Out-of-order processing causes data corruption or incorrect state.

    signature:
      - "Business logic depends on message order"
      - "No sequence numbers in messages"
      - "Multiple consumers on same queue"
      - "Event sourcing without version checks"

    anti_patterns:
      - "Assuming FIFO without FIFO queue"
      - "No idempotency in message handlers"
      - "Processing order-dependent without ordering key"
      - "Ignoring duplicate delivery"

    indicators:
      - "Data inconsistencies after message processing"
      - "Race conditions between consumers"
      - "Order of operations violations"

    historical_examples:
      - "Common: SQS standard queue redelivering messages out of order"
      - "Kafka: Consumer rebalance causing duplicate/reordered processing"

    mitigation_hints:
      - "Idempotent message handlers"
      - "FIFO queues for order-dependent processing"
      - "Event versioning and conflict resolution"

  - id: "SRT-005"
    name: "Real-Time Backpressure Failure"
    description: |
      Producer generates events faster than consumer can process.
      Without backpressure, system runs out of memory, drops messages,
      or crashes.

    signature:
      - "Unbounded buffers between producer and consumer"
      - "No backpressure mechanism"
      - "Consumer processing time varies widely"
      - "No monitoring of queue depth"

    anti_patterns:
      - "Unbounded in-memory queues"
      - "No flow control between services"
      - "Fire-and-forget publishing"
      - "Consumer scaling not tied to queue depth"

    indicators:
      - "Growing queue/buffer depth"
      - "Increasing message age"
      - "Consumer OOM errors"
      - "Message processing latency growing"

    historical_examples:
      - "Twitter: Firehose consumers unable to keep up with tweet volume"
      - "Common: Kafka consumers falling behind during traffic spikes"

    mitigation_hints:
      - "Bounded buffers with overflow strategy"
      - "Consumer auto-scaling based on queue depth"
      - "Reactive streams with backpressure"

  - id: "SRT-006"
    name: "WebSocket State Complexity"
    description: |
      WebSocket connections create stateful server requirements that
      conflict with stateless scaling. Connection management becomes
      primary engineering challenge.

    signature:
      - "WebSocket connections tied to specific servers"
      - "No connection migration on server restart"
      - "Session affinity required for load balancer"
      - "Connection count as scaling bottleneck"

    anti_patterns:
      - "In-memory connection state without persistence"
      - "No heartbeat/ping mechanism"
      - "No reconnection logic in client"
      - "Broadcasting to all connections via single server"

    indicators:
      - "Connection drops during deployments"
      - "Uneven connection distribution across servers"
      - "Memory growing with connection count"

    historical_examples:
      - "Slack: Connection management at scale requiring custom infrastructure"
      - "Common: WebSocket connections lost during rolling deployments"

    mitigation_hints:
      - "Connection state in external store (Redis)"
      - "Automatic reconnection with exponential backoff"
      - "Server-Sent Events as simpler alternative"

  - id: "SRT-007"
    name: "Exactly-Once Processing Myth"
    description: |
      System designed assuming exactly-once message delivery, which is
      impossible in distributed systems. At-least-once delivery without
      idempotency causes duplicate processing.

    signature:
      - "Business operations not idempotent"
      - "No deduplication mechanism"
      - "No idempotency key in messages"
      - "Side effects in message handlers (email, payment)"

    anti_patterns:
      - "Assuming exactly-once delivery"
      - "Non-idempotent handlers for financial operations"
      - "No deduplication window"
      - "Side effects without deduplication guard"

    indicators:
      - "Duplicate operations (double charges, double emails)"
      - "Data counts don't match between systems"
      - "Reconciliation needed between services"

    historical_examples:
      - "Double-charging customers from message redelivery"
      - "Common: Email sent twice due to retry after timeout"

    mitigation_hints:
      - "Idempotency keys for all operations"
      - "Deduplication with time window"
      - "Outbox pattern for reliable publishing"

  - id: "SRT-008"
    name: "Serverless Concurrency Limits"
    description: |
      Cloud provider concurrency limits throttle function executions
      during traffic spikes. Default limits often too low for production.

    signature:
      - "Default concurrency limits not increased"
      - "No reserved concurrency for critical functions"
      - "No throttling strategy for downstream"
      - "Burst traffic patterns"

    anti_patterns:
      - "Not requesting limit increases before launch"
      - "All functions sharing same concurrency pool"
      - "No queue-based buffering for spiky traffic"
      - "No monitoring of throttle metrics"

    indicators:
      - "ThrottleCount metrics increasing"
      - "429 errors from Lambda/Cloud Functions"
      - "Downstream service overwhelmed by burst"

    historical_examples:
      - "AWS Lambda 1000 concurrent limit surprising new users"
      - "DynamoDB throttling causing cascade failures"

    mitigation_hints:
      - "Reserved concurrency for critical functions"
      - "Queue-based load leveling"
      - "Request limit increases proactively"
