---
# Deep Explore Process
# Structured decision exploration
---

process_name: deep-explore
version: "3.3.0"
13_zasady_version: "1.0.0"
created: "2026-02-16"

# ═══════════════════════════════════════════════════════════════
# METADATA
# ═══════════════════════════════════════════════════════════════

metadata:
  category: DECISION_ANALYSIS
  complexity: HIGH

# ═══════════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════════

inputs:
  decision_question:
    type: string
    required: true
    schema: "Single question requiring exploration"

  context:
    type: object
    required: false
    schema: "Background information"

  depth_level:
    type: enum
    values: [quick, standard, deep]
    default: standard
    loaded_from: "data/coverage-scoring.yaml"

# ═══════════════════════════════════════════════════════════════
# PHASES (OODA STRUCTURE)
# ═══════════════════════════════════════════════════════════════

phases:
  phase_0_knowledge_audit:
    observe:
      action: "LOAD decision_question + context"
      gate: "GATE_00_OBSERVED"

    orient:
      action: "CLASSIFY knowledge_gaps AS known|unknown|fear-based"
      assumptions: "DECLARE research_scope boundaries"
      gate: "GATE_00_ORIENTED"

    decide:
      action: "IF gaps > threshold THEN queue_research ELSE skip_to_map"
      gate: "GATE_00_DECIDED"

    act:
      action: "CREATE knowledge-map.yaml WITH research_queue"
      gate: "GATE_00"

  phase_1_research:
    observe:
      action: "LOAD research_queue FROM knowledge-map.yaml"
      gate: "GATE_01_OBSERVED"

    orient:
      action: "EXTRACT research_methods FROM data/research-methods.md"
      assumptions: "DECLARE source_credibility criteria"
      gate: "GATE_01_ORIENTED"

    decide:
      action: "FOR EACH item IN queue IF priority > min THEN research"
      gate: "GATE_01_DECIDED"

    act:
      action: "CREATE research-summary.yaml WITH findings"
      gate: "GATE_01"

  phase_2_map:
    observe:
      action: "LOAD knowledge-map.yaml + research-summary.yaml"
      gate: "GATE_02_OBSERVED"

    orient:
      action: "CLASSIFY options AS viable|non-viable"
      assumptions: "DECLARE option_completeness threshold"
      gate: "GATE_02_ORIENTED"

    decide:
      action: "IF options < 2 THEN expand_search ELSE proceed"
      gate: "GATE_02_DECIDED"

    act:
      action: "CREATE option-map.yaml WITH morphological_box"
      gate: "GATE_02"

  phase_3_deepen:
    observe:
      action: "LOAD option-map.yaml"
      gate: "GATE_03_OBSERVED"

    orient:
      action: "EXTRACT consequences FOR EACH option"
      assumptions: "DECLARE consequence_horizon timeframe"
      gate: "GATE_03_ORIENTED"

    decide:
      action: "IF reversibility < threshold THEN flag_critical"
      gate: "GATE_03_DECIDED"

    act:
      action: "CREATE consequence-map.yaml WITH dependencies"
      gate: "GATE_03"

  phase_4_challenge:
    observe:
      action: "LOAD option-map.yaml + consequence-map.yaml"
      gate: "GATE_04_OBSERVED"

    orient:
      action: "IDENTIFY assumptions requiring counter-check"
      assumptions: "DECLARE challenge_methods per depth_level"
      gate: "GATE_04_ORIENTED"

    decide:
      action: "FOR EACH assumption IF critical THEN counter_check"
      gate: "GATE_04_DECIDED"

    act:
      action: "CREATE challenge-results.yaml WITH validated_assumptions"
      gate: "GATE_04"

  phase_5_synthesize:
    observe:
      action: "LOAD ALL phase_outputs"
      gate: "GATE_05_OBSERVED"

    orient:
      action: "CLUSTER options BY strategic_themes"
      assumptions: "DECLARE synthesis_completeness criteria"
      gate: "GATE_05_ORIENTED"

    decide:
      action: "IF clusters coherent THEN synthesize ELSE regroup"
      gate: "GATE_05_DECIDED"

    act:
      action: "CREATE synthesis.yaml WITH decision_sequence"
      gate: "GATE_05"

  phase_6_output:
    observe:
      action: "LOAD ALL artifacts"
      gate: "GATE_06_OBSERVED"

    orient:
      action: "VALIDATE coverage_score AGAINST depth_target"
      assumptions: "DECLARE output_format requirements"
      gate: "GATE_06_ORIENTED"

    decide:
      action: "IF coverage < target THEN emit_warning ELSE proceed"
      gate: "GATE_06_DECIDED"

    act:
      action: "CREATE exploration-report.md USING template"
      gate: "GATE_06"

# ═══════════════════════════════════════════════════════════════
# OUTPUTS
# ═══════════════════════════════════════════════════════════════

outputs:
  knowledge-map: {schema: "{gaps, research_queue}", phase: 0}
  research-summary: {schema: "{findings, sources}", phase: 1}
  option-map: {schema: "{options, dimensions}", phase: 2}
  consequence-map: {schema: "{consequences, dependencies}", phase: 3}
  challenge-results: {schema: "{validated, rejected}", phase: 4}
  synthesis: {schema: "{clusters, sequence}", phase: 5}
  exploration-report: {schema_ref: "data/exploration-report-template.md", phase: 6}

# ═══════════════════════════════════════════════════════════════
# VALIDATION GATES
# ═══════════════════════════════════════════════════════════════

validation_gates:
  GATE_00:
    condition: "knowledge-map.yaml EXISTS AND research_queue NOT EMPTY"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_01:
    condition: "research-summary.yaml EXISTS AND findings >= min_depth"
    on_fail: "SCOPE_REDUCTION OR HALT"
    severity: CRITICAL

  GATE_02:
    condition: "option-map.yaml EXISTS AND options >= 2"
    on_fail: "RETURN_TO_PHASE_1"
    severity: BLOCKER

  GATE_03:
    condition: "consequence-map.yaml EXISTS AND ALL options analyzed"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_04:
    condition: "challenge-results.yaml EXISTS AND counter_checks >= min"
    on_fail: "SCOPE_REDUCTION OR HALT"
    severity: CRITICAL

  GATE_05:
    condition: "synthesis.yaml EXISTS AND coherence_check PASS"
    on_fail: "RETURN_TO_PHASE_4"
    severity: CRITICAL

  GATE_06:
    condition: "exploration-report.md EXISTS AND coverage >= target"
    on_fail: "EMIT_WARNING + PROCEED"
    severity: WARNING

# ═══════════════════════════════════════════════════════════════
# ERROR HANDLERS
# ═══════════════════════════════════════════════════════════════

error_handlers:
  missing_input:
    trigger: "decision_question NOT PROVIDED"
    severity: CRITICAL
    action: "HALT WITH error_missing_input"
    recovery: "Request user input"

  invalid_input:
    trigger: "decision_question schema VALIDATION FAILS"
    severity: HIGH
    action: "HALT WITH validation_error"
    recovery: "Request corrected input"

  partial_completion:
    trigger: "phase N reaches 70% THEN process_interrupted"
    severity: MEDIUM
    action: "SAVE checkpoint TO recovery.yaml + HALT"
    recovery: "Resume from checkpoint"

  external_dependency_failure:
    trigger: "data/research-methods.md NOT ACCESSIBLE"
    severity: MEDIUM
    action: "USE minimal_methods fallback + EMIT_WARNING"
    recovery: "Continue with degraded capability"

  timeout:
    trigger: "phase_duration > max_time_per_phase"
    severity: HIGH
    action: "SAVE state + HALT WITH timeout_error"
    recovery: "User decides: continue OR abort"

  resource_exhaustion:
    trigger: "memory_usage > 80%"
    severity: HIGH
    action: "REDUCE batch_size + GC + retry"
    recovery: "Continue with smaller batches"

  concurrent_modification:
    trigger: "artifact_hash CHANGED during phase"
    severity: CRITICAL
    action: "RELOAD artifact + RESTART current phase"
    recovery: "Phase re-execution"

  user_cancellation:
    trigger: "user_cancels DURING execution"
    severity: LOW
    action: "SAVE checkpoint + CLEANUP temp_files"
    recovery: "State saved for potential resume"

# ═══════════════════════════════════════════════════════════════
# COMPLIANCE
# ═══════════════════════════════════════════════════════════════

compliance_13_zasady:
  zasada_0_ooda: "PASS - 7 phases OODA"
  zasada_1_self_contained: "PASS - JIT steps/*.md"
  zasada_2_completeness: "PASS - ALL options GATE_03"
  zasada_3_mechanisms: "PASS - 7 gates IF-THEN"
  zasada_4_binding_gates: "PASS - BLOCKER enforcement"
  zasada_5_assumptions: "PASS - DECLARE orient"
  zasada_6_evr: "PASS - observe→orient→act"
  zasada_7_checklists: "PASS - step checklists"
  zasada_8_counter_checks: "PASS - phase_4 challenge"
  zasada_9_executable: "PASS - LOAD/CREATE/IF"
  zasada_10_visible_reasoning: "PASS - orient logic"
  zasada_11_instruction_data: "PASS - schemas included"
  zasada_12_jit: "PASS - on-demand loading"
  zasada_13_zero_decoration: "PASS - no explanations"

---
# END deep-explore process.yaml
