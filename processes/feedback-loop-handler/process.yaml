---
# Feedback Loop Handler Process
# Error detection, analysis, and automated remediation
---

process_name: feedback-loop-handler
version: "2.0.0"
13_zasady_version: "1.0.0"
created: "2026-02-16"

# ═══════════════════════════════════════════════════════════════
# METADATA
# ═══════════════════════════════════════════════════════════════

metadata:
  category: ORCHESTRATION_SUPPORT
  complexity: MEDIUM

# ═══════════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════════

inputs:
  error_event:
    type: artifact
    required: true
    schema: "{error_type, source_process, phase, error_details}"

  project_context:
    type: artifact
    schema_ref: "schemas/project-context-schema.yaml"
    required: true

  process_state:
    type: artifact
    required: true
    schema: "{current_phase, artifacts_generated[], last_successful_gate}"

  execution_log:
    type: artifact
    required: false
    loaded_from: "artifacts/{project_id}/execution-log.yaml"

# ═══════════════════════════════════════════════════════════════
# PHASES (OODA STRUCTURE)
# ═══════════════════════════════════════════════════════════════

phases:
  phase_0_preparation:
    observe:
      action: "LOAD error_event + process_state + execution_log"
      gate: "GATE_0_OBSERVED"

    orient:
      action: "CLASSIFY error_type + IDENTIFY source_phase"
      assumptions: "DECLARE error_classification_taxonomy"
      gate: "GATE_0_ORIENTED"

    decide:
      action: "IF recoverable THEN analyze ELSE escalate_to_user"
      gate: "GATE_0_DECIDED"

    act:
      action: "CREATE feedback-context.yaml WITH error_classification"
      gate: "GATE_0"

  phase_1_error_capture:
    observe:
      action: "LOAD feedback-context.yaml + error_event"
      gate: "GATE_1_OBSERVED"

    orient:
      action: "EXTRACT error_details + stack_trace + context USING structured_capture"
      assumptions: "DECLARE capture_completeness_requirements"
      gate: "GATE_1_ORIENTED"

    decide:
      action: "FOR EACH detail IF relevant THEN capture ELSE filter"
      gate: "GATE_1_DECIDED"

    act:
      action: "CREATE error-report.yaml WITH full_context"
      gate: "GATE_1"

  phase_2_root_cause_analysis:
    observe:
      action: "LOAD error-report.yaml + process_state"
      gate: "GATE_2_OBSERVED"

    orient:
      action: "ANALYZE root_cause USING error_patterns + process_history"
      assumptions: "DECLARE root_cause_analysis_methods"
      gate: "GATE_2_ORIENTED"

    decide:
      action: "IF root_cause_found THEN proceed ELSE classify_as_unknown"
      gate: "GATE_2_DECIDED"

    act:
      action: "CREATE root-cause-analysis.yaml WITH findings"
      gate: "GATE_2"

  phase_3_impact_analysis:
    observe:
      action: "LOAD root-cause-analysis.yaml + process_state"
      gate: "GATE_3_OBSERVED"

    orient:
      action: "ASSESS impact ON downstream_phases + artifacts + dependencies"
      assumptions: "DECLARE impact_propagation_rules"
      gate: "GATE_3_ORIENTED"

    decide:
      action: "IF high_impact THEN escalate ELIF medium THEN remediate ELSE continue"
      gate: "GATE_3_DECIDED"

    act:
      action: "CREATE impact-assessment.yaml WITH scope"
      gate: "GATE_3"

  phase_4_remediation_planning:
    observe:
      action: "LOAD root-cause-analysis.yaml + impact-assessment.yaml"
      gate: "GATE_4_OBSERVED"

    orient:
      action: "GENERATE remediation_strategy FROM error_type + impact_scope"
      assumptions: "DECLARE remediation_patterns per error_type"
      gate: "GATE_4_ORIENTED"

    decide:
      action: "IF auto_fixable THEN plan_fix ELSE request_user_intervention"
      gate: "GATE_4_DECIDED"

    act:
      action: "CREATE remediation-plan.yaml WITH fix_steps"
      gate: "GATE_4"

  phase_5_fix_application:
    observe:
      action: "LOAD remediation-plan.yaml"
      gate: "GATE_5_OBSERVED"

    orient:
      action: "EXECUTE fix_steps USING remediation_actions"
      assumptions: "DECLARE fix_execution_rules"
      gate: "GATE_5_ORIENTED"

    decide:
      action: "FOR EACH fix_step IF safe THEN apply ELSE skip_and_log"
      gate: "GATE_5_DECIDED"

    act:
      action: "APPLY fixes + CREATE fix-log.yaml WITH results"
      gate: "GATE_5"

  phase_6_verification:
    observe:
      action: "LOAD fix-log.yaml + process_state"
      gate: "GATE_6_OBSERVED"

    orient:
      action: "VERIFY fix_success BY re-executing_failed_phase OR validation"
      assumptions: "DECLARE verification_criteria"
      gate: "GATE_6_ORIENTED"

    decide:
      action: "IF fix_successful THEN resume_process ELSE retry_OR_escalate"
      gate: "GATE_6_DECIDED"

    act:
      action: "CREATE feedback-summary.yaml + handoff-to-orchestrator.yaml"
      gate: "GATE_6"

# ═══════════════════════════════════════════════════════════════
# OUTPUTS
# ═══════════════════════════════════════════════════════════════

outputs:
  feedback-context: {schema: "{error_classification, recoverability}", phase: 0}
  error-report: {schema: "{error_details{}, stack_trace, context{}}", phase: 1}
  root-cause-analysis: {schema: "{root_cause, confidence, evidence[]}", phase: 2}
  impact-assessment: {schema: "{affected_phases[], scope, severity}", phase: 3}
  remediation-plan: {schema: "{fix_steps[], strategy, auto_fixable}", phase: 4}
  fix-log: {schema: "{applied_fixes[], results[], status}", phase: 5}
  feedback-summary: {schema: "{resolution_status, actions_taken[]}", phase: 6}
  handoff-to-orchestrator: {schema: "{resume_from, context{}}", phase: 6}

# ═══════════════════════════════════════════════════════════════
# VALIDATION GATES
# ═══════════════════════════════════════════════════════════════

validation_gates:
  GATE_0:
    condition: "feedback-context.yaml EXISTS AND error_classified"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_1:
    condition: "error-report.yaml EXISTS AND context_captured"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_2:
    condition: "root-cause-analysis.yaml EXISTS AND root_cause_identified"
    on_fail: "EMIT_WARNING + PROCEED"
    severity: WARNING

  GATE_3:
    condition: "impact-assessment.yaml EXISTS AND impact_analyzed"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_4:
    condition: "remediation-plan.yaml EXISTS AND fix_steps_defined"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_5:
    condition: "fix-log.yaml EXISTS AND fixes_applied"
    on_fail: "EMIT_WARNING + PROCEED"
    severity: WARNING

  GATE_6:
    condition: "feedback-summary.yaml + handoff-to-orchestrator.yaml EXIST"
    on_fail: "HALT"
    severity: BLOCKER

# ═══════════════════════════════════════════════════════════════
# ERROR HANDLERS
# ═══════════════════════════════════════════════════════════════

error_handlers:
  missing_input:
    trigger: "error_event OR process_state NOT PROVIDED"
    severity: CRITICAL
    action: "HALT WITH error_missing_context"
    recovery: "Request error event details"

  invalid_input:
    trigger: "error_event schema VALIDATION FAILS"
    severity: HIGH
    action: "HALT WITH validation_error"
    recovery: "Fix error event format"

  partial_completion:
    trigger: "phase N reaches 70% THEN interrupted"
    severity: MEDIUM
    action: "SAVE checkpoint + HALT"
    recovery: "Resume from checkpoint"

  external_dependency_failure:
    trigger: "error_patterns OR fix_templates NOT ACCESSIBLE"
    severity: MEDIUM
    action: "USE built-in_patterns + EMIT_WARNING"
    recovery: "Continue with reduced remediation"

  timeout:
    trigger: "root_cause_analysis > max_allowed"
    severity: HIGH
    action: "SAVE state + HALT WITH timeout_error"
    recovery: "User decides: continue OR escalate"

  resource_exhaustion:
    trigger: "fix_attempts > max_retries"
    severity: HIGH
    action: "ESCALATE to user + HALT"
    recovery: "Manual intervention required"

  concurrent_modification:
    trigger: "process_state CHANGED during feedback_loop"
    severity: CRITICAL
    action: "RELOAD + RESTART from GATE_0"
    recovery: "Phase 0 re-execution"

  user_cancellation:
    trigger: "user_cancels DURING execution"
    severity: LOW
    action: "SAVE checkpoint + CLEANUP temp_files"
    recovery: "State saved for resume"

# ═══════════════════════════════════════════════════════════════
# COMPLIANCE
# ═══════════════════════════════════════════════════════════════

compliance_13_zasady:
  zasada_0_ooda: "PASS - 7 phases OODA"
  zasada_1_self_contained: "PASS - steps/*.md JIT"
  zasada_2_completeness: "PASS - ALL errors analyzed GATE_2"
  zasada_3_mechanisms: "PASS - 7 gates IF-THEN"
  zasada_4_binding_gates: "PASS - BLOCKER enforcement"
  zasada_5_assumptions: "PASS - DECLARE each phase"
  zasada_6_evr: "PASS - observe→orient→act"
  zasada_7_checklists: "PASS - step files"
  zasada_8_counter_checks: "PASS - verification phase_6"
  zasada_9_executable: "PASS - LOAD/CREATE/IF"
  zasada_10_visible_reasoning: "PASS - orient shows root_cause"
  zasada_11_instruction_data: "PASS - schemas + patterns"
  zasada_12_jit: "PASS - on-demand loading"
  zasada_13_zero_decoration: "PASS - no explanations"

---
# END feedback-loop-handler process.yaml
