extraction_rules:
  extract_from_deep_explore:
    options:
      filtering:
        - rule: "SORT options BY score DESC"
        - rule: "LIMIT to top 5 options"

      extraction:
        - field: "name"
          format: "- {name} (score: {score})"
        - field: "approach"
          format: "- Approach: {approach}"

  extract_from_deep_risk:
    risks:
      filtering:
        - rule: "SORT risks BY severity DESC"
        - rule: "LIMIT to top 5 risks"

      extraction:
        - field: "name"
          format: "- {name} ({severity})"
        - field: "impact"
          format: "- Impact: {impact}"

  extract_from_deep_verify:
    verdict:
      extraction:
        - field: "verdict"
          format: "Verdict: {verdict}"
        - field: "score"
          format: "Score: {score}/10"
        - field: "confidence"
          format: "Confidence: {confidence}"

    critical_issues:
      filtering:
        - rule: "FILTER issues WHERE severity IN [BLOCKER, CRITICAL]"

      extraction:
        - field: "severity"
          format: "**{severity}:** {description}"

  extract_from_deep_synthesis:
    themes:
      extraction:
        - field: "name"
          format: "- {name}"
        - field: "description"
          format: "  {description}"

recommendation_synthesis:
  decision_tree:
    - condition: "critical_issues contains BLOCKER severity"
      recommendation:
        action: "NO-GO"
        priority: "CRITICAL"
        rationale_template: "Blocker issue present - {blocker_description}. Cannot proceed without resolution."

    - condition: "deep-verify.verdict = NO-GO"
      recommendation:
        action: "NO-GO"
        priority: "HIGH"
        rationale_template: "Verification failed with verdict: {verdict}. Score: {score}/10."

    - condition: "critical_issues contains 3+ CRITICAL severity"
      recommendation:
        action: "NO-GO"
        priority: "HIGH"
        rationale_template: "{count} critical issues identified. Risk level too high to proceed."

    - condition: "deep-verify.verdict = GO AND critical_issues count < 2"
      recommendation:
        action: "GO"
        priority: "NORMAL"
        rationale_template: "Verification passed. {score}/10 score with {confidence} confidence. Proceed with planned approach."

    - condition: "deep-verify.verdict = CONDITIONAL-GO"
      recommendation:
        action: "CONDITIONAL-GO"
        priority: "NORMAL"
        rationale_template: "Conditional approval. Must resolve: {conditions}."

    - condition: "deep-verify.verdict = UNCERTAIN"
      recommendation:
        action: "PIVOT"
        priority: "MEDIUM"
        rationale_template: "Verification uncertain. Additional analysis required before decision."

next_steps_generation:
  for_NO_GO:
    - rule: "FOR each BLOCKER: Generate 'Resolve blocker: {description}'"
    - rule: "FOR each CRITICAL: Generate 'Address critical issue: {description}'"
    - rule: "Add 'Re-assess decision readiness after resolution'"

  for_GO:
    - rule: "Extract top 3 options from deep-explore"
    - rule: "Generate 'Proceed with {option_name}'"
    - rule: "FOR each HIGH risk: Generate 'Monitor risk: {risk_name}'"

  for_CONDITIONAL_GO:
    - rule: "Extract conditions from deep-verify"
    - rule: "FOR each condition: Generate 'Fulfill condition: {description}'"

  for_PIVOT:
    - rule: "Identify information gaps"
    - rule: "Generate 'Conduct additional analysis: {gap}'"

decision_brief_structure:
  sections:
    - section_id: 1
      name: "Header"
      required_fields:
        - "decision_title"
        - "recommendation"
        - "priority"
        - "timestamp"

    - section_id: 2
      name: "Recommendation"
      required_fields:
        - "action"
        - "priority"
        - "rationale"
        - "next_steps"

    - section_id: 3
      name: "Key Findings"
      subsections:
        - "Options Identified"
        - "Top Risks"
        - "Verification Status"

    - section_id: 4
      name: "Critical Issues"
      format: "Numbered list with severity and description"

    - section_id: 5
      name: "Execution Summary"
      required_fields:
        - "tasks_completed"
        - "execution_time"
        - "token_usage"
        - "cost"

    - section_id: 6
      name: "Decision Readiness"
      required_fields:
        - "readiness_level"
        - "readiness_score"
        - "key_metrics"

page_limit:
  target_pages: 5
  maximum_pages: 10
  enforcement: "HALT if rendered output exceeds 10 pages"
