# Gate Definitions — Binding Gate Requirements for Deep Verify V2
# PURPOSE: Define exact requirements for each gate transition
# ENFORCEMENT: Agent MUST NOT proceed past a gate without ALL items DONE or SCOPE_REDUCED

---
gate_mechanism:
  description: |
    Gates are BINDING checkpoints between phases. Every gate item must be
    explicitly marked DONE or SCOPE_REDUCED. SCOPE_REDUCED requires a formal
    SCOPE_REDUCTION_RECORD with user approval. No "intelligent" skipping allowed.

  scope_reduction_record:
    required_fields:
      - what_omitted: "Exact description of what was skipped"
      - why: "Justification for the omission"
      - impact_assessment: "How this affects verification quality"
      - user_approved: "Boolean — HALT and ask user if not pre-approved"
    enforcement: "If user_approved is false, agent MUST HALT and request approval"

---
gates:
  GATE_0:
    name: "Setup → Extraction"
    phase_from: 0
    phase_to: 1
    required_items:
      - id: G0.1
        description: "execution_mode is set"
        verification: "frontmatter.execution_mode is not null"
      - id: G0.2
        description: "artifact is defined and accessible"
        verification: "frontmatter.artifact is not null and file exists"
      - id: G0.3
        description: "stakes and bias_mode are set"
        verification: "frontmatter.stakes and frontmatter.bias_mode are not null"
      - id: G0.4
        description: "ASSUMPTIONS_DECLARED section completed"
        verification: "frontmatter.assumptions_declared.count > 0"
      - id: G0.5
        description: "All INFERRED assumptions logged as HYPOTHESES"
        verification: "Every assumption with basis=INFERRED has a corresponding hypothesis"
      - id: G0.6
        description: "Frontmatter initialized"
        verification: "All frontmatter fields present"

  GATE_1:
    name: "Extraction → Verification"
    phase_from: 1
    phase_to: 2
    required_items:
      - id: G1.1
        description: "claims_extracted populated (total > 0)"
        verification: "frontmatter.claims_extracted is non-empty array"
      - id: G1.2
        description: "terms_extracted populated"
        verification: "frontmatter.terms_extracted is non-empty array"
      - id: G1.3
        description: "structure_extracted populated"
        verification: "frontmatter.structure_extracted is not null"
      - id: G1.4
        description: "pattern_signals populated"
        verification: "frontmatter.pattern_signals is not null"
      - id: G1.5
        description: "All hypotheses from extraction logged"
        verification: "hypothesis count matches implicit claims + synonyms + homonyms"
      - id: G1.6
        description: "NO severity/scoring occurred in Phase 1"
        verification: "frontmatter.findings is empty, frontmatter.currentScore is 0"

  GATE_2:
    name: "Verification → Adversarial"
    phase_from: 2
    phase_to: 3
    required_items:
      - id: G2.1
        description: "ALL Tier 1 methods executed"
        verification: "methodsExecuted contains 71, 100, 17"
      - id: G2.2
        description: "Tier 2 methods executed per mode"
        verification: "Quick: >= 1, Standard/Deep: >= 2"
      - id: G2.3
        description: "ALL findings have quotes"
        verification: "Every finding has non-empty quote field"
      - id: G2.4
        description: "ALL CRITICAL/IMPORTANT findings counter-checked"
        verification: "Every finding with severity >= IMPORTANT has counter_check"
      - id: G2.5
        description: "Score calculated correctly"
        verification: "S = sum of all scoring components"

  GATE_3:
    name: "Adversarial → Verdict"
    phase_from: 3
    phase_to: 4
    required_items:
      - id: G3.1
        description: "ALL IMPORTANT+ findings reviewed adversarially"
        verification: "Every IMPORTANT+ finding has survived_phase3 set"
      - id: G3.2
        description: "ALL four prompts answered per finding"
        verification: "Each reviewed finding has 4 prompt answers"
      - id: G3.3
        description: "Steel-man attempted"
        verification: "phase3_summary.steel_man_attempted is true"
      - id: G3.4
        description: "False Positive Checklist completed (if REJECT)"
        verification: "If direction is REJECT, checklist is filled"
      - id: G3.5
        description: "Counter-checks reconciled with adversarial"
        verification: "No unresolved disagreements"
      - id: G3.6
        description: "Score adjusted"
        verification: "currentScore reflects Phase 3 adjustments"

  GATE_4:
    name: "Verdict → Render"
    phase_from: 4
    phase_to: 5
    required_items:
      - id: G4.1
        description: "Score verified (recalculated matches running)"
        verification: "Audit trail calculation matches frontmatter.currentScore"
      - id: G4.2
        description: "Verdict determined correctly"
        verification: "Verdict matches decision-thresholds.yaml rules for current S"
      - id: G4.3
        description: "Validation checklist passed"
        verification: "Verdict-specific checklist completed"
      - id: G4.4
        description: "Confidence assigned"
        verification: "frontmatter.confidence is not null"
      - id: G4.5
        description: "Escalation decided"
        verification: "frontmatter.escalation.needed is set"

  GATE_5:
    name: "Render → Complete / Pattern Candidate"
    phase_from: 5
    phase_to: "complete or 6"
    required_items:
      - id: G5.1
        description: "Report fully populated and validated"
        verification: "No [PLACEHOLDER] fields remain"
      - id: G5.2
        description: "Report output to user"
        verification: "Report was output in this turn"

  GATE_6:
    name: "Pattern Candidate → Complete"
    phase_from: 6
    phase_to: "complete"
    optional: true
    required_items:
      - id: G6.1
        description: "All candidates evaluated"
        verification: "pattern_candidates array populated"
