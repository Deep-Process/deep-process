---
# Deep Requirements Process
# Requirements extraction and analysis
---

process_name: deep-requirements
version: "2.0.0"
13_zasady_version: "1.0.0"
created: "2026-02-16"

# ═══════════════════════════════════════════════════════════════
# METADATA
# ═══════════════════════════════════════════════════════════════

metadata:
  category: REQUIREMENTS_ANALYSIS
  complexity: MEDIUM

# ═══════════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════════

inputs:
  user_request:
    type: string
    required: true
    schema: "User's project description or change request"

  project_context:
    type: artifact
    schema_ref: "schemas/project-context-schema.yaml"
    required: false
    loaded_from: "artifacts/{project_id}/project-context.yaml"

  existing_requirements:
    type: artifact
    schema_ref: "schemas/requirements-schema.yaml"
    required: false
    loaded_from: "artifacts/{project_id}/requirements.yaml"

  analysis_result:
    type: artifact
    required: true
    schema: "{mode, request_type, high_level_requirements}"

# ═══════════════════════════════════════════════════════════════
# PHASES (OODA STRUCTURE)
# ═══════════════════════════════════════════════════════════════

phases:
  phase_0_preparation:
    observe:
      action: "LOAD user_request + analysis_result + project_context IF exists"
      gate: "GATE_0_OBSERVED"

    orient:
      action: "CLASSIFY mode AS new_project|modify_existing + EXTRACT request_type"
      assumptions: "DECLARE requirement_extraction_patterns"
      gate: "GATE_0_ORIENTED"

    decide:
      action: "IF mode==modify_existing THEN merge_strategy ELSE fresh_extraction"
      gate: "GATE_0_DECIDED"

    act:
      action: "CREATE preparation-context.yaml WITH extraction_strategy"
      gate: "GATE_0"

  phase_1_extraction:
    observe:
      action: "LOAD preparation-context.yaml"
      gate: "GATE_1_OBSERVED"

    orient:
      action: "EXTRACT functional|nonfunctional|constraints|stakeholders FROM user_request USING patterns"
      assumptions: "DECLARE pattern_library = [action_verbs, quality_attributes, constraint_keywords]"
      gate: "GATE_1_ORIENTED"

    decide:
      action: "FOR EACH detected_requirement IF valid THEN extract ELSE skip"
      gate: "GATE_1_DECIDED"

    act:
      action: "CREATE raw-requirements.yaml WITH extracted_requirements"
      gate: "GATE_1"

  phase_2_elaboration:
    observe:
      action: "LOAD raw-requirements.yaml"
      gate: "GATE_2_OBSERVED"

    orient:
      action: "ELABORATE acceptance_criteria + dependencies + user_stories FOR EACH requirement"
      assumptions: "DECLARE prioritization_method = MoSCoW"
      gate: "GATE_2_ORIENTED"

    decide:
      action: "FOR EACH requirement IF testable THEN elaborate ELSE flag_for_review"
      gate: "GATE_2_DECIDED"

    act:
      action: "CREATE elaborated-requirements.yaml WITH priorities"
      gate: "GATE_2"

  phase_3_validation:
    observe:
      action: "LOAD elaborated-requirements.yaml"
      gate: "GATE_3_OBSERVED"

    orient:
      action: "VALIDATE completeness + consistency + feasibility + testability USING checklist"
      assumptions: "DECLARE validation_thresholds per check_type"
      gate: "GATE_3_ORIENTED"

    decide:
      action: "IF total_issues == 0 THEN pass ELIF critical_issues > 0 THEN fail ELSE pass_with_warnings"
      gate: "GATE_3_DECIDED"

    act:
      action: "CREATE validation-report.yaml WITH findings"
      gate: "GATE_3"

  phase_4_success_criteria:
    observe:
      action: "LOAD elaborated-requirements.yaml + validation-report.yaml"
      gate: "GATE_4_OBSERVED"

    orient:
      action: "DEFINE functional|quality|deployment success_criteria FROM requirements"
      assumptions: "DECLARE default_quality_gates = [coverage>80%, zero_critical_vulns]"
      gate: "GATE_4_ORIENTED"

    decide:
      action: "IF criteria_complete THEN proceed ELSE add_default_criteria"
      gate: "GATE_4_DECIDED"

    act:
      action: "CREATE success-criteria.yaml WITH definition_of_done"
      gate: "GATE_4"

  phase_5_finalization:
    observe:
      action: "LOAD ALL artifacts"
      gate: "GATE_5_OBSERVED"

    orient:
      action: "AGGREGATE requirements + validation + success_criteria INTO final_document"
      assumptions: "DECLARE handoff_validation_checklist"
      gate: "GATE_5_ORIENTED"

    decide:
      action: "IF ready_for_handoff THEN finalize ELSE return_to_validation"
      gate: "GATE_5_DECIDED"

    act:
      action: "CREATE requirements.yaml + handoff-checkpoint.yaml"
      gate: "GATE_5"

# ═══════════════════════════════════════════════════════════════
# OUTPUTS
# ═══════════════════════════════════════════════════════════════

outputs:
  preparation-context: {schema: "{mode, strategy}", phase: 0}
  raw-requirements: {schema: "{functional[], nonfunctional[], constraints[], stakeholders[]}", phase: 1}
  elaborated-requirements: {schema: "{requirements[] WITH acceptance_criteria, priorities}", phase: 2}
  validation-report: {schema: "{completeness{}, consistency{}, feasibility{}, testability{}}", phase: 3}
  success-criteria: {schema: "{functional[], quality[], deployment[], definition_of_done[]}", phase: 4}
  requirements: {schema_ref: "schemas/requirements-schema.yaml", phase: 5}
  handoff-checkpoint: {schema_ref: "schemas/handoff-checkpoint-schema.yaml", phase: 5}

# ═══════════════════════════════════════════════════════════════
# VALIDATION GATES
# ═══════════════════════════════════════════════════════════════

validation_gates:
  GATE_0:
    condition: "preparation-context.yaml EXISTS AND extraction_strategy SET"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_1:
    condition: "raw-requirements.yaml EXISTS AND functional_requirements > 0"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_2:
    condition: "elaborated-requirements.yaml EXISTS AND ALL requirements have priorities"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_3:
    condition: "validation-report.yaml EXISTS AND validation_status != FAIL"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_4:
    condition: "success-criteria.yaml EXISTS AND definition_of_done DEFINED"
    on_fail: "HALT"
    severity: BLOCKER

  GATE_5:
    condition: "requirements.yaml + handoff-checkpoint.yaml EXIST AND handoff_validation PASSED"
    on_fail: "HALT"
    severity: BLOCKER

# ═══════════════════════════════════════════════════════════════
# ERROR HANDLERS
# ═══════════════════════════════════════════════════════════════

error_handlers:
  missing_input:
    trigger: "user_request NOT PROVIDED OR empty"
    severity: CRITICAL
    action: "HALT WITH error_missing_user_request"
    recovery: "Request user input"

  invalid_input:
    trigger: "user_request < 10 chars OR incoherent"
    severity: HIGH
    action: "HALT WITH validation_error"
    recovery: "Request clarification"

  partial_completion:
    trigger: "phase N reaches 70% THEN interrupted"
    severity: MEDIUM
    action: "SAVE checkpoint + HALT"
    recovery: "Resume from checkpoint"

  external_dependency_failure:
    trigger: "data/patterns/*.yaml NOT ACCESSIBLE"
    severity: MEDIUM
    action: "USE built-in_patterns + EMIT_WARNING"
    recovery: "Continue with reduced patterns"

  timeout:
    trigger: "extraction_duration > max_allowed"
    severity: HIGH
    action: "SAVE state + HALT WITH timeout_error"
    recovery: "User decides: continue OR simplify_request"

  resource_exhaustion:
    trigger: "requirement_count > max_processable"
    severity: HIGH
    action: "PRIORITIZE by importance + REDUCE scope"
    recovery: "Process top N requirements only"

  concurrent_modification:
    trigger: "user_request CHANGED during execution"
    severity: CRITICAL
    action: "RELOAD + RESTART from GATE_0"
    recovery: "Phase 0 re-execution"

  user_cancellation:
    trigger: "user_cancels DURING execution"
    severity: LOW
    action: "SAVE checkpoint + CLEANUP temp_files"
    recovery: "State saved for resume"

# ═══════════════════════════════════════════════════════════════
# COMPLIANCE
# ═══════════════════════════════════════════════════════════════

compliance_13_zasady:
  zasada_0_ooda: "PASS - 6 phases OODA"
  zasada_1_self_contained: "PASS - steps/*.md JIT"
  zasada_2_completeness: "PASS - ALL requirements extracted GATE_1"
  zasada_3_mechanisms: "PASS - 6 gates IF-THEN"
  zasada_4_binding_gates: "PASS - BLOCKER enforcement"
  zasada_5_assumptions: "PASS - DECLARE each phase"
  zasada_6_evr: "PASS - observe→orient→act"
  zasada_7_checklists: "PASS - step files"
  zasada_8_counter_checks: "PASS - validation phase_3"
  zasada_9_executable: "PASS - LOAD/CREATE/IF"
  zasada_10_visible_reasoning: "PASS - orient shows extraction"
  zasada_11_instruction_data: "PASS - schemas + patterns"
  zasada_12_jit: "PASS - on-demand loading"
  zasada_13_zero_decoration: "PASS - no explanations"

---
# END deep-requirements process.yaml
