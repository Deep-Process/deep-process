id: deep-compliance
name: "Deep Compliance"
version: "1.0.0"
description: "Universal regulatory compliance assessment with requirement mapping gap analysis evidence collection and remediation planning"

workflowFile: "workflow.md"
firstStepFile: "steps/step-01-inventory.md"

agentInstruction: "Execute compliance workflow for selected regulation. Extract system capabilities BEFORE requirement mapping. Apply counter-checks to all gap assessments. Regulation specified in input."

compliancePatterns:
  - id: "eu-ai-act"
    name: "EU AI Act 2024"
    focus: "High-risk AI classification, Articles 9-15, Annex III"
  - id: "gdpr"
    name: "GDPR (General Data Protection Regulation)"
    focus: "Data protection, privacy rights, consent, data minimization"
  - id: "hipaa"
    name: "HIPAA (Health Insurance Portability and Accountability Act)"
    focus: "Protected health information, security rule, privacy rule"
  - id: "soc2"
    name: "SOC 2 Type II"
    focus: "Security, availability, processing integrity, confidentiality, privacy"
  - id: "iso27001"
    name: "ISO 27001"
    focus: "Information security management system"
  - id: "nis2"
    name: "NIS2 Directive"
    focus: "Network and information security for essential services"
  - id: "multi"
    name: "Multi-Regulation Assessment"
    focus: "Combined assessment across multiple regulations"

gates:
  - GATE_1: "systems_identified = TRUE AND capabilities_count >= 3 AND counter_check_executed = TRUE"
  - GATE_2: "requirements_mapped >= 90% AND mapping_verified = TRUE AND counter_check_executed = TRUE"
  - GATE_3: "gaps_classified = TRUE AND severity_assigned = TRUE AND counter_check_executed = TRUE"
  - GATE_4: "evidence_collected >= covered_requirements_count AND evidence_verified = TRUE AND counter_check_executed = TRUE"
  - GATE_5: "remediation_plans >= critical_gaps_count AND timeline_realistic = TRUE AND counter_check_executed = TRUE"
  - GATE_6A: "findings_compiled = TRUE AND metrics_aggregated = TRUE AND counter_check_executed = TRUE"
  - GATE_6B: "compliance_calculated = TRUE AND level_classified = TRUE AND counter_check_executed = TRUE"
  - GATE_6: "deliverables_generated = 6 AND all_files_verified = TRUE AND counter_check_executed = TRUE"

outputs:
  - "system_inventory"
  - "requirements_mapping"
  - "gap_analysis"
  - "evidence_inventory"
  - "remediation_roadmap"
  - "compliance_report"
