# Deep-Compliance Gates — Programmatic Evaluation

GATE_0:
  name: "INVENTORY_COMPLETE"
  phase: 0
  description: "System inventory collected with sufficient detail for compliance assessment"

  conditions:
    G0-01:
      check: "At least 1 AI system identified"
      severity: BLOCKER
      validation: "len(systems) >= 1"

    G0-02:
      check: "System capabilities list not empty"
      severity: BLOCKER
      validation: "len(capabilities) > 0"

    G0-03:
      check: "Documentation references provided"
      severity: CRITICAL
      validation: "len(documentation) > 0 OR fast_track_mode == true"
      bypass: "fast_track_mode"

    G0-04:
      check: "System owner identified"
      severity: HIGH
      validation: "owner is not None"

  pass_criteria: "All BLOCKER conditions TRUE AND (all CRITICAL conditions TRUE OR bypass)"
  fail_action: "Collect missing information: systems list, capabilities, owner"

GATE_1:
  name: "REQUIREMENTS_MAPPED"
  phase: 1
  description: "EU AI Act requirements mapped to system capabilities"

  conditions:
    G1-01:
      check: "All EU AI Act articles processed"
      severity: BLOCKER
      validation: "mapping_result.articles_processed == total_articles"

    G1-02:
      check: "Mapping coverage sufficient"
      severity: BLOCKER
      validation: "(mapping_result.coverage > 0.90) OR (fast_track_mode AND mapping_result.coverage > 0.70)"
      threshold_normal: 0.90
      threshold_fast_track: 0.70

    G1-03:
      check: "Method #327 executed successfully"
      severity: BLOCKER
      validation: "method_327_status == 'SUCCESS'"
      fallback: "Manual mapping if method not available"

    G1-04:
      check: "Mapping result has valid structure"
      severity: BLOCKER
      validation: "validate_schema(mapping_result, 'regulatory_mapping_schema.yaml')"

  pass_criteria: "All BLOCKER conditions TRUE"
  fail_action: "Re-run Method #327 with refined mapping rules or manual mapping"

GATE_2:
  name: "GAPS_IDENTIFIED"
  phase: 2
  description: "Compliance gaps identified and classified by severity"

  conditions:
    G2-01:
      check: "All requirements classified"
      severity: BLOCKER
      validation: "all(req.status in ['COVERED', 'PARTIAL', 'GAP'] for req in requirements)"

    G2-02:
      check: "Gap severity assigned"
      severity: BLOCKER
      validation: "all(gap.severity in ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW'] for gap in gaps)"

    G2-03:
      check: "Method #329 executed successfully"
      severity: CRITICAL
      validation: "method_329_status == 'SUCCESS'"
      fallback: "Manual gap analysis if method not available"

    G2-04:
      check: "Gaps have remediation recommendations"
      severity: HIGH
      validation: "all(gap.recommendation is not None for gap in critical_gaps)"

  pass_criteria: "All BLOCKER + CRITICAL conditions TRUE"
  fail_action: "Re-analyze uncertain gap classifications"

GATE_3:
  name: "EVIDENCE_COLLECTED"
  phase: 3
  description: "Evidence collected and verified for all covered requirements"

  conditions:
    G3-01:
      check: "Evidence exists for all COVERED requirements"
      severity: BLOCKER
      validation: "all(len(req.evidence) > 0 for req in covered_requirements)"

    G3-02:
      check: "Evidence quality verified"
      severity: CRITICAL
      validation: "method_168_executed AND all(evidence.exists for evidence in all_evidence)"
      method_dependency: "Method #168 (Existence Verification)"

    G3-03:
      check: "No stale evidence"
      severity: HIGH
      validation: "method_169_executed AND all(evidence.age_days < 180 for evidence in all_evidence)"
      threshold: 180  # 6 months
      method_dependency: "Method #169 (Staleness Detection)"

    G3-04:
      check: "Evidence references are valid"
      severity: CRITICAL
      validation: "all(validate_reference(evidence.reference) for evidence in all_evidence)"

  pass_criteria: "All BLOCKER + CRITICAL conditions TRUE"
  fail_action: "Collect missing or stale evidence"
  skip_if: "fast_track_mode == true"

GATE_4:
  name: "REMEDIATION_PLANNED"
  phase: 4
  description: "Remediation plans created for all gaps"

  conditions:
    G4-01:
      check: "All CRITICAL gaps have remediation plans"
      severity: BLOCKER
      validation: "all(gap.remediation_plan is not None for gap in critical_gaps)"

    G4-02:
      check: "All HIGH gaps have remediation plans"
      severity: CRITICAL
      validation: "all(gap.remediation_plan is not None for gap in high_gaps)"

    G4-03:
      check: "Remediation timeline realistic"
      severity: HIGH
      validation: "not all(plan.effort == '1 week' for plan in remediation_plans)"
      heuristic: "Plans should have varied effort estimates"

    G4-04:
      check: "Owners assigned for CRITICAL gaps"
      severity: CRITICAL
      validation: "all(gap.owner is not None for gap in critical_gaps)"

    G4-05:
      check: "Dependencies mapped"
      severity: MEDIUM
      validation: "remediation_graph.has_dependencies_mapped()"

  pass_criteria: "All BLOCKER + CRITICAL conditions TRUE"
  fail_action: "Refine remediation plans (add owners, realistic timelines)"

GATE_5:
  name: "REPORT_COMPLETE"
  phase: 5
  description: "Compliance report complete and validated"

  conditions:
    G5-01:
      check: "Executive summary present"
      severity: BLOCKER
      validation: "report.has_section('executive_summary')"

    G5-02:
      check: "All required sections complete"
      severity: BLOCKER
      validation: "all(report.has_section(section) for section in required_sections)"
      required_sections:
        - "executive_summary"
        - "requirements_mapping"
        - "gap_analysis"
        - "evidence_inventory"
        - "remediation_roadmap"

    G5-03:
      check: "Compliance readiness % calculated"
      severity: BLOCKER
      validation: "report.compliance_percentage is not None AND 0 <= report.compliance_percentage <= 100"

    G5-04:
      check: "Critical gaps highlighted"
      severity: CRITICAL
      validation: "len(report.critical_gaps) > 0 AND report.has_section('critical_gaps_summary')"

    G5-05:
      check: "Report length appropriate"
      severity: MEDIUM
      validation: "len(report.content) > 1000 AND not report.is_truncated"
      min_length: 1000

  pass_criteria: "All BLOCKER + CRITICAL conditions TRUE"
  fail_action: "Complete missing sections"

  success_output:
    - "compliance-report-{system_name}-{date}.md"
    - "compliance-mapping-{system_name}-{date}.yaml"
    - "remediation-roadmap-{system_name}-{date}.md"
    - "audit-evidence-package-{system_name}-{date}.zip (if scope == comprehensive or pre-audit)"

# Meta-gates (cross-cutting validation)

META_VALIDATION:
  consistency_check:
    description: "Cross-gate consistency validation"
    checks:
      - name: "Gap count consistency"
        validation: "sum(gaps_by_severity.values()) == total_gaps"
      - name: "Evidence count consistency"
        validation: "len(evidence_inventory) == len(covered_requirements)"
      - name: "Remediation coverage"
        validation: "len(remediation_plans) >= len(critical_gaps) + len(high_gaps)"

  compliance_percentage_formula:
    description: "How compliance % is calculated"
    formula: "(covered_requirements / total_requirements) * 100"
    adjustment: "partial_coverage_weight = 0.5"
    final_formula: "((covered + partial*0.5) / total) * 100"

  eu_ai_act_deadline:
    enforcement_date: "2026-08-01"
    warning_threshold_days: 90
    critical_threshold_days: 30
    action_if_close_to_deadline: "Set fast_track_mode = true, prioritize CRITICAL gaps"

# Fast-track mode overrides

FAST_TRACK_OVERRIDES:
  enabled_when: "fast_track_mode == true"

  modifications:
    GATE_0:
      - "G0-03 bypassed (documentation optional)"
    GATE_1:
      - "G1-02 threshold lowered (90% → 70%)"
    GATE_2:
      - "Only CRITICAL + HIGH gaps required"
    GATE_3:
      - "Entire gate skipped (evidence flagged as TODO)"
    GATE_4:
      - "Only CRITICAL gaps need plans"

  additional_sections:
    - "Fast-Track Recommendations"
    - "Immediate Actions (next 48h)"
    - "Long-term Remediation (post-crisis)"
