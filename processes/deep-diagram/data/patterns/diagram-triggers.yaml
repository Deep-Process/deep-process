# Diagram Trigger Definitions V0.1.0
# Domain-specific conditions for automatic diagram generation
# Extracted from Deep-Document V7.1.4 domain-dependencies.yaml DT-* references
# + ADR-016 topology-driven diagram detection
#
# Each trigger defines:
#   - trigger_id: Unique identifier (DT-*)
#   - domain: Required active domain for this trigger
#   - diagram_type: Type of diagram to generate
#   - conditions: When to activate this trigger
#   - components_selection: How to select components for the diagram
#   - description: What the diagram shows

version: "0.1.0"
origin: "Deep-Document V7.1.4 data/patterns/domain-dependencies.yaml"
total_triggers: 17

# ==============================================================================
# BASE DOMAIN TRIGGERS (Always Available)
# ==============================================================================

- trigger_id: DT-DEPLOYMENT-PIPELINE
  domain: iac-agnostic
  domain_type: base
  diagram_type: deployment
  description: "CI/CD pipeline and deployment flow diagram"
  conditions:
    - "iac-agnostic domain is active (auto-applied)"
    - "At least 1 deployment/CI configuration file detected"
  components_selection: "Infrastructure-layer components + CI/CD related entities"

- trigger_id: DT-ENVIRONMENT-CONFIG
  domain: iac-agnostic
  domain_type: base
  diagram_type: architecture
  description: "Environment configuration (DTAP) diagram showing dev/test/staging/prod"
  conditions:
    - "iac-agnostic domain is active"
    - "Multiple environment configurations detected"
  components_selection: "Config components differentiated by environment"

- trigger_id: DT-MODULE-STRUCTURE
  domain: typescript-library
  domain_type: base
  diagram_type: component
  description: "TypeScript module dependency structure diagram"
  conditions:
    - "typescript-library domain is active"
    - "tsconfig.json exists"
    - "At least 5 TypeScript modules detected"
  components_selection: "Module-type components with import/export relationships"

- trigger_id: DT-TEST-STRUCTURE
  domain: testing-patterns
  domain_type: base
  diagram_type: component
  description: "Test structure and coverage diagram"
  conditions:
    - "testing-patterns domain is active"
    - "Test files detected (*.test.*, *.spec.*, __tests__/)"
  components_selection: "Test components mapped to source components they test"

# ==============================================================================
# AWS CDK TRIGGERS
# ==============================================================================

- trigger_id: DT-CDK-STACK
  domain: aws-cdk
  diagram_type: architecture
  description: "AWS CDK stack composition and construct hierarchy diagram"
  conditions:
    - "aws-cdk domain is active (confidence >= 0.80)"
    - "cdk.json exists"
    - "At least 1 Stack class detected"
  components_selection: "Stack components, L1/L2/L3 constructs, cross-stack references"

- trigger_id: DT-MULTI-REGION
  domain: aws-cdk
  diagram_type: deployment
  description: "Multi-region deployment architecture diagram"
  conditions:
    - "aws-cdk domain is active"
    - "Multiple AWS region references detected in code"
  components_selection: "Region-specific components with cross-region relationships"

# ==============================================================================
# EVENT-DRIVEN SERVERLESS TRIGGERS
# ==============================================================================

- trigger_id: DT-EVENT-FLOW
  domain: event-driven-serverless
  diagram_type: sequence
  description: "Event flow diagram showing producers, consumers, and event routing"
  conditions:
    - "event-driven-serverless domain is active (confidence >= 0.75)"
    - "EventBridge/SNS/SQS patterns detected"
  components_selection: "Event producers (publishes), consumers (subscribes), event buses"

- trigger_id: DT-LAMBDA-INVENTORY
  domain: event-driven-serverless
  diagram_type: component
  description: "Lambda function inventory with triggers and destinations"
  conditions:
    - "event-driven-serverless domain is active"
    - "At least 3 Lambda functions detected"
  components_selection: "Lambda function components with trigger sources and target services"

- trigger_id: DT-SNS-TAXONOMY
  domain: event-driven-serverless
  diagram_type: data_flow
  description: "SNS topic taxonomy showing message routing and subscriptions"
  conditions:
    - "event-driven-serverless domain is active"
    - "At least 5 SNS topics detected"
  components_selection: "SNS topics with publisher/subscriber relationships"

- trigger_id: DT-DYNAMODB-SCHEMA
  domain: event-driven-serverless
  diagram_type: class
  description: "DynamoDB table schema diagram showing tables, keys, GSIs, relationships"
  conditions:
    - "event-driven-serverless domain is active"
    - "At least 5 DynamoDB table definitions detected"
  components_selection: "DynamoDB table components with key schemas and GSI patterns"

# ==============================================================================
# API GATEWAY TRIGGERS
# ==============================================================================

- trigger_id: DT-OPENAPI-CONTRACT
  domain: api-gateway
  diagram_type: component
  description: "OpenAPI contract diagram showing endpoints, methods, schemas"
  conditions:
    - "api-gateway domain is active (confidence >= 0.70)"
    - "OpenAPI/Swagger specification file detected"
  components_selection: "API endpoint components with request/response schemas"

- trigger_id: DT-MIDDLEWARE-CHAIN
  domain: api-gateway
  diagram_type: sequence
  description: "Middleware processing chain diagram (Middy, Express, etc.)"
  conditions:
    - "api-gateway domain is active"
    - "Middleware chain pattern detected (Middy middlewares, Express use())"
  components_selection: "Middleware components in execution order"

# ==============================================================================
# REACT TRIGGERS
# ==============================================================================

- trigger_id: DT-COMPONENT-TREE
  domain: react
  diagram_type: component
  description: "React component hierarchy and composition diagram"
  conditions:
    - "react domain is active (confidence >= 0.80)"
    - "At least 5 React components detected"
  components_selection: "React components with parent-child and composition relationships"

- trigger_id: DT-STATE-FLOW
  domain: react
  diagram_type: data_flow
  description: "State management flow diagram (Context, Redux, Zustand, etc.)"
  conditions:
    - "react domain is active"
    - "State management pattern detected (useContext, Redux store, etc.)"
  components_selection: "State stores, providers, consumers with data flow arrows"

# ==============================================================================
# INTEGRATION TRIGGERS
# ==============================================================================

- trigger_id: DT-EXTERNAL-INTEGRATION
  domain: external-integrations
  diagram_type: component
  description: "External service integration map showing third-party connections"
  conditions:
    - "external-integrations domain is active (confidence >= 0.65)"
    - "At least 3 external service integrations detected"
  components_selection: "Internal components + external service boxes with API connections"

- trigger_id: DT-MULTI-TENANT
  domain: multi-tenant
  diagram_type: architecture
  description: "Multi-tenant architecture showing tenant isolation and data partitioning"
  conditions:
    - "multi-tenant domain is active (confidence >= 0.75)"
    - "Tenant isolation patterns detected (OpCo, tenant ID, data partitioning)"
  components_selection: "Shared components, tenant-specific components, isolation boundaries"

# ==============================================================================
# TOPOLOGY-DRIVEN TRIGGER (Always Available - ADR-016)
# ==============================================================================

- trigger_id: DT-TOPOLOGY-HIGH-CENTRALITY
  domain: "_any_"
  domain_type: universal
  diagram_type: component
  description: "Topology-driven diagram for high-centrality components (Method #90, ADR-016)"
  conditions:
    - "Always evaluated regardless of domain"
    - "Component has complexity_class == HIGH (top 20% by degree)"
    - "Component not already covered by domain-specific trigger"
  components_selection: "High-centrality component + all direct dependencies (in and out)"
  rationale: |
    ADR-016: Pattern-only triggers miss 67% of complex entities.
    Example: UserService with 25 dependencies has no DT-* match but is
    architecturally critical. Topology-driven detection fills this gap.
  coverage_improvement: "+20-30% more diagrams compared to triggers only"

