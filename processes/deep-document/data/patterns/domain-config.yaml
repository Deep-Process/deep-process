# Deep-Document V8 - Multi-Domain Configuration
# Version: 1.0.0
# Pattern: Consolidated domain detection + quality patterns + diagram triggers
# Consolidates V7's domain-dependencies.yaml (529L) + domain-detection-rules.yaml (256L) + quality-patterns subset

version: "1.0.0"
schema_version: "v8-domain-config"
created: "2026-02-13"
pattern_source: "deep-document-v7 (domains + detection + patterns)"

# ==============================================================================
# BASE DOMAINS (auto-apply to ALL projects or conditional)
# ==============================================================================

base_domains:
  - id: iac-agnostic
    name: "Infrastructure-as-Code (Agnostic)"
    description: "Universal IaC patterns (DTAP, environments, parameters)"
    auto_apply: true
    rationale: "90%+ infrastructure projects use DTAP pattern"
    provides:
      quality:
        - QP-DTAP-CONFIGURATION
        - QP-PARAMETER-STORE
        - QP-ENVIRONMENT-SEPARATION
      diagram_triggers:
        - DT-DEPLOYMENT-PIPELINE
        - DT-ENVIRONMENT-DIAGRAM

    quality_patterns:
      - pattern_id: QP-DTAP-CONFIGURATION
        check: "Document DTAP environments"
        validation: "For each environment (dev/tst/acc/prd): document config differences, promotion process"
        section_applicable: ["Deployment", "Infrastructure", "Configuration"]

      - pattern_id: QP-PARAMETER-STORE
        check: "Document parameter management"
        validation: "List all parameters/secrets, storage mechanism (SSM/Secrets Manager/env vars), access patterns"
        section_applicable: ["Configuration", "Security", "Deployment"]

      - pattern_id: QP-ENVIRONMENT-SEPARATION
        check: "Document environment isolation"
        validation: "Explain network separation, account boundaries, resource naming conventions per environment"
        section_applicable: ["Architecture", "Infrastructure", "Security"]

  - id: typescript-library
    name: "TypeScript Library/Application"
    description: "TypeScript projects (libraries, applications, CDK)"
    auto_apply_if: "tsconfig.json EXISTS OR package.json contains 'typescript' dependency"
    provides:
      quality:
        - QP-TYPE-SAFETY
        - QP-DEPENDENCY-MANAGEMENT
        - QP-BUILD-CONFIG
      diagram_triggers:
        - DT-MODULE-STRUCTURE
        - DT-DEPENDENCY-GRAPH

    quality_patterns:
      - pattern_id: QP-TYPE-SAFETY
        check: "Document type definitions"
        validation: "For exported types/interfaces: document purpose, fields, usage examples"
        section_applicable: ["API Reference", "Data Models", "Type System"]

      - pattern_id: QP-DEPENDENCY-MANAGEMENT
        check: "Document dependencies"
        validation: "List major dependencies (>5 imports), version constraints, peer dependencies"
        section_applicable: ["Implementation", "Configuration"]

      - pattern_id: QP-BUILD-CONFIG
        check: "Document build configuration"
        validation: "Explain tsconfig.json settings (target, module, lib), build scripts, output structure"
        section_applicable: ["Implementation", "Development"]

  - id: testing-patterns
    name: "Testing Patterns"
    description: "Universal testing patterns (unit, integration, coverage)"
    auto_apply: true
    rationale: "All projects should document testing approach"
    provides:
      quality:
        - QP-TEST-COVERAGE
        - QP-CI-PIPELINE
        - QP-TEST-STRUCTURE
      diagram_triggers:
        - DT-TEST-HIERARCHY

    quality_patterns:
      - pattern_id: QP-TEST-COVERAGE
        check: "Document test coverage"
        validation: "Report coverage metrics (% lines, branches), identify untested critical paths"
        section_applicable: ["Testing", "Quality Assurance"]

      - pattern_id: QP-CI-PIPELINE
        check: "Document CI/CD pipeline"
        validation: "Describe pipeline stages (lint, build, test, deploy), trigger conditions, deployment targets"
        section_applicable: ["Deployment", "Implementation"]

      - pattern_id: QP-TEST-STRUCTURE
        check: "Document test organization"
        validation: "Explain test file structure, naming conventions, test data location"
        section_applicable: ["Testing", "Implementation"]

# ==============================================================================
# SPECIFIC DOMAINS (detection required, confidence-based)
# ==============================================================================

specific_domains:
  - id: aws-cdk
    name: "AWS CDK Infrastructure"
    description: "AWS Cloud Development Kit projects (TypeScript CDK stacks)"

    detection:
      conditions:
        C1_cdk_config:
          type: file_existence
          pattern: "cdk.json"
          weight: 0.40
          match_score_function: "1.0 if file exists, 0.0 otherwise"
          rationale: "cdk.json is mandatory for CDK projects"

        C2_cdk_imports:
          type: content_search
          pattern: "@aws-cdk/|aws-cdk-lib"
          threshold: 3
          weight: 0.35
          match_score_function: "min(1.0, matching_files / threshold)"
          rationale: "CDK projects import CDK libraries in multiple files"

        C3_cdk_constructs:
          type: content_search
          pattern: "extends Construct|extends Stack|new .*Construct"
          threshold: 2
          weight: 0.25
          match_score_function: "min(1.0, matching_files / threshold)"
          rationale: "CDK projects define custom constructs or stacks"

      confidence_threshold: 0.80
      confidence_formula: "sum(weight * match_score for all conditions)"

      anti_gaming:
        scenario: "Single cdk.json file with no actual CDK code"
        resistance: "C1 alone = 0.40 confidence < 0.80 threshold → NOT detected"
        prevention: "Multi-condition triggers (3 conditions) prevent single-file gaming"

    requires: [iac-agnostic, typescript-library]
    rationale: "CDK is IaC + TypeScript, inherits both patterns"

    provides:
      quality:
        - QP-CDK-CUSTOM-CONSTRUCTS
        - QP-CONDITIONAL-CFN
        - QP-CDK-OUTPUT-EXPORTS
      diagram_triggers:
        - DT-CDK-STACK
        - DT-CDK-CONSTRUCT-TREE

    quality_patterns:
      - pattern_id: QP-CDK-CUSTOM-CONSTRUCTS
        check: "Document all L3 custom constructs"
        validation: "For each class extending Construct: document purpose, props interface, child resources, usage example"
        section_applicable: ["Architecture", "System Components", "API Reference"]
        example: "Custom WfmTable construct: purpose (standardized DynamoDB table), props (tableName, gsiConfig), creates (Table + GSIs + Outputs)"

      - pattern_id: QP-CONDITIONAL-CFN
        check: "Document CloudFormation conditions"
        validation: "For each CfnCondition: document logic (expression), use cases, resources affected by condition"
        section_applicable: ["Infrastructure", "Deployment", "Architecture"]
        example: "isEuRegion condition: logic (region === eu-west-1), affects (39 DynamoDB tables conditional deployment)"

      - pattern_id: QP-CDK-OUTPUT-EXPORTS
        check: "Document stack outputs and exports"
        validation: "For each CfnOutput: document purpose, export name, consuming stacks or services"
        section_applicable: ["Infrastructure", "Integration", "API Reference"]
        example: "WfmFoundationKmsKeyArn output: purpose (KMS key for S3 encryption), export (wfm-foundation-kms-key), consumers (application stacks)"

  - id: event-driven-serverless
    name: "Event-Driven Serverless Architecture"
    description: "AWS serverless with event sources (Lambda, SNS, SQS, EventBridge, DynamoDB)"

    detection:
      conditions:
        C1_lambda:
          type: content_search
          pattern: "AWS::Lambda::Function|Function\\(|new Function"
          threshold: 2
          weight: 0.40
          match_score_function: "min(1.0, matching_files / threshold)"
          rationale: "Serverless architecture requires Lambda functions"

        C2_events:
          type: content_search
          pattern: "EventBridge|SNS|SQS|aws-sns|aws-sqs"
          threshold: 1
          weight: 0.35
          match_score_function: "1.0 if found, 0.0 otherwise"
          rationale: "Event-driven pattern requires event sources"

        C3_dynamodb:
          type: content_search
          pattern: "AWS::DynamoDB|Table\\(|new Table|dynamodb"
          threshold: 1
          weight: 0.25
          match_score_function: "1.0 if found, 0.0 otherwise"
          rationale: "Serverless often uses DynamoDB as data store"

      confidence_threshold: 0.75
      confidence_formula: "sum(weight * match_score for all conditions)"

    requires: [iac-agnostic]

    provides:
      quality:
        - QP-EVENT-LOGGING
        - QP-DLQ-ERROR-HANDLING
        - QP-LAMBDA-INVENTORY
      diagram_triggers:
        - DT-EVENT-FLOW
        - DT-LAMBDA-INVENTORY
        - DT-SNS-TAXONOMY

    quality_patterns:
      - pattern_id: QP-EVENT-LOGGING
        check: "Document event logging strategy"
        validation: "For each event source (SNS, SQS, EventBridge): document payload structure, logging level, retention policy"
        section_applicable: ["Architecture", "Operations", "Observability"]
        example: "SNS topic wfm-integration-departments-created: payload {opco, departmentId, timestamp}, CloudWatch Logs retention 90 days"

      - pattern_id: QP-DLQ-ERROR-HANDLING
        check: "Document dead-letter queue configuration"
        validation: "For each async process (Lambda, SQS): document retry policy, DLQ ARN, alarm configuration"
        section_applicable: ["Error Handling", "Operations", "Architecture"]
        example: "Lambda processShiftReply: retries 2x, DLQ arn:aws:sqs:::wfm-shift-reply-dlq, CloudWatch alarm on DLQ depth >10"

      - pattern_id: QP-LAMBDA-INVENTORY
        check: "Document Lambda function inventory"
        validation: "List all Lambda functions with: purpose, trigger type, runtime, memory/timeout config, IAM role"
        section_applicable: ["System Components", "Infrastructure", "API Reference"]
        example: "processEvent Lambda: purpose (SNS event processing), trigger (SNS subscription), runtime nodejs18, 512MB/60s, role MraBackoffice"

  - id: api-gateway
    name: "API Gateway REST/HTTP API"
    description: "AWS API Gateway with REST or HTTP APIs"

    detection:
      conditions:
        C1_api_gateway:
          type: content_search
          pattern: "AWS::ApiGateway|RestApi|HttpApi|@aws-cdk/aws-apigateway"
          threshold: 1
          weight: 0.50
          match_score_function: "1.0 if found, 0.0 otherwise"

        C2_api_endpoints:
          type: content_search
          pattern: "Resource\\(|Method\\(|Integration\\(|/api/|endpoint"
          threshold: 3
          weight: 0.30
          match_score_function: "min(1.0, matching_files / threshold)"

        C3_openapi:
          type: file_existence
          pattern: "openapi.yaml|openapi.json|swagger.yaml"
          weight: 0.20
          match_score_function: "1.0 if exists, 0.0 otherwise"

      confidence_threshold: 0.70
      confidence_formula: "sum(weight * match_score for all conditions)"

    requires: [iac-agnostic]

    provides:
      quality:
        - QP-API-ENDPOINTS
        - QP-OPENAPI-SPEC
        - QP-API-AUTH
      diagram_triggers:
        - DT-API-ENDPOINTS
        - DT-API-INTEGRATION

    quality_patterns:
      - pattern_id: QP-API-ENDPOINTS
        check: "Document all API endpoints"
        validation: "For each endpoint: HTTP method, path, request/response schemas, authentication, rate limits"
        section_applicable: ["API Reference", "System Components"]

      - pattern_id: QP-OPENAPI-SPEC
        check: "Document OpenAPI specification"
        validation: "Reference OpenAPI file location, version, generation process, validation approach"
        section_applicable: ["API Reference", "Implementation"]

      - pattern_id: QP-API-AUTH
        check: "Document API authentication"
        validation: "Explain auth mechanism (IAM, Cognito, API key), authorization rules, token handling"
        section_applicable: ["Security", "API Reference"]

  - id: multi-tenant
    name: "Multi-Tenant Architecture"
    description: "Multi-tenant systems with tenant isolation patterns"

    detection:
      conditions:
        C1_tenant_references:
          type: content_search
          pattern: "tenant|opco|organization|workspace|account.*id"
          threshold: 5
          weight: 0.50
          match_score_function: "min(1.0, matching_files / threshold)"

        C2_tenant_isolation:
          type: content_search
          pattern: "tenant.*isolation|partition.*key|tenant.*id|opco.*separation"
          threshold: 2
          weight: 0.30
          match_score_function: "min(1.0, matching_files / threshold)"

        C3_multi_config:
          type: content_search
          pattern: "per.*tenant|tenant.*config|opco.*config"
          threshold: 1
          weight: 0.20
          match_score_function: "1.0 if found, 0.0 otherwise"

      confidence_threshold: 0.75
      confidence_formula: "sum(weight * match_score for all conditions)"

    requires: []

    provides:
      quality:
        - QP-TENANT-ISOLATION
        - QP-TENANT-CONFIG
        - QP-CROSS-TENANT-SECURITY
      diagram_triggers:
        - DT-TENANT-ARCHITECTURE
        - DT-DATA-PARTITIONING

    quality_patterns:
      - pattern_id: QP-TENANT-ISOLATION
        check: "Document tenant isolation strategy"
        validation: "Explain data partitioning (DynamoDB partition keys, separate tables/databases), compute isolation (per-tenant resources vs shared)"
        section_applicable: ["Architecture", "Data Models", "Security"]
        example: "Tenant isolation via DynamoDB partition key 'opco#': all queries scoped by opco, GSIs include opco in key design"

      - pattern_id: QP-TENANT-CONFIG
        check: "Document per-tenant configuration"
        validation: "List tenant-specific configs (feature flags, limits, integrations), storage mechanism, update process"
        section_applicable: ["Configuration", "Architecture"]

      - pattern_id: QP-CROSS-TENANT-SECURITY
        check: "Document cross-tenant security controls"
        validation: "Explain access controls preventing tenant data leakage, IAM policies, audit logging of cross-tenant access attempts"
        section_applicable: ["Security", "Architecture", "Operations"]

  - id: dynamodb-heavy
    name: "DynamoDB-Heavy Data Layer"
    description: "Projects with extensive DynamoDB usage (>10 tables, GSIs)"

    detection:
      conditions:
        C1_table_count:
          type: content_search
          pattern: "new Table\\(|AWS::DynamoDB::Table"
          threshold: 10
          weight: 0.60
          match_score_function: "min(1.0, table_count / threshold)"
          rationale: "DynamoDB-heavy = many tables"

        C2_gsi_usage:
          type: content_search
          pattern: "GlobalSecondaryIndex|addGlobalSecondaryIndex|GSI"
          threshold: 5
          weight: 0.40
          match_score_function: "min(1.0, gsi_count / threshold)"
          rationale: "Complex DynamoDB designs use GSIs"

      confidence_threshold: 0.70
      confidence_formula: "sum(weight * match_score for all conditions)"

    requires: []

    provides:
      quality:
        - QP-DYNAMODB-SCHEMA
        - QP-GSI-PATTERNS
        - QP-DYNAMODB-CAPACITY
      diagram_triggers:
        - DT-DYNAMODB-SCHEMA
        - DT-GSI-STRUCTURE

    quality_patterns:
      - pattern_id: QP-DYNAMODB-SCHEMA
        check: "Document DynamoDB table schemas"
        validation: "For each table: partition key, sort key (if any), attributes, item types, access patterns"
        section_applicable: ["Data Models", "Architecture"]
        example: "Table talents: PK=tenantId#talentId, SK=metadata, attrs={name, email, status}, access: getTalentById, queryTalentsByTenant"

      - pattern_id: QP-GSI-PATTERNS
        check: "Document GSI design patterns"
        validation: "For each GSI: name, keys, purpose, query patterns, sparse index usage"
        section_applicable: ["Data Models", "Architecture", "Performance"]
        example: "GSI status-index: PK=status, SK=createdAt, purpose: query talents by status sorted by creation date"

      - pattern_id: QP-DYNAMODB-CAPACITY
        check: "Document capacity mode and scaling"
        validation: "Explain billing mode (PAY_PER_REQUEST vs provisioned), auto-scaling config, throughput expectations"
        section_applicable: ["Infrastructure", "Performance", "Cost"]

# ==============================================================================
# DETECTION ALGORITHM (6-step enforced sequence)
# ==============================================================================

detection_algorithm:
  version: "1.0.0"
  pattern: "Multi-condition confidence-based with transitive dependency closure"

  steps:
    step_1:
      action: "Load base domains"
      logic: "Include all domains with auto_apply=true OR auto_apply_if condition met"
      method: "#167 Baseline Census - enumerate all base domains"
      output: "base_domains_included[]"

    step_2:
      action: "Scan repository for detection patterns"
      logic: "For each specific_domain, evaluate ALL conditions using Glob/Grep"
      details:
        - "file_existence: Use Glob to check pattern"
        - "content_search: Use Grep to count matching files"
        - "Calculate match_score per condition using match_score_function"
      method: "#85 Grounding Check - verify patterns exist in repo"
      output: "detection_evidence[] per domain"

    step_3:
      action: "Calculate confidence per domain"
      logic: "confidence = sum(weight * match_score) for all conditions"
      threshold_check: "IF confidence >= confidence_threshold → include domain"
      method: "#42 Reverse Engineering - validate confidence formula"
      output: "domains_detected[] with confidence scores"

    step_4:
      action: "Resolve requires[] dependencies"
      logic: "Transitive closure: BFS from detected domains, follow requires[] edges"
      algorithm: "Queue = detected_domains; WHILE queue not empty: pop domain, add requires[] to queue if not visited"
      method: "#159 Transitive Dependency - compute closure"
      output: "domains_auto_included[] via dependency"

    step_5:
      action: "Collect active patterns"
      logic: "Union of provides[] from all final_domains (detected + base + auto_included)"
      validation: "No pattern duplication across domains (each pattern unique)"
      method: "#84 Coherence Check - verify no phantom patterns"
      output: "active_patterns{quality: [...], diagram_triggers: [...]}"

    step_6:
      action: "Write detection results"
      logic: "Write to preparation-report.yaml domain_detection{} section"
      schema: "See preparation-report.schema.yaml for structure"
      output: "domain_detection{} in preparation-report.yaml"

  counter_checks:
    CC1_grounding:
      method: "#85 Grounding Check"
      action: "Sample 3 random detected domains"
      validation: "For each, verify detection evidence exists (files/patterns found in repo)"
      pass_criteria: "All 3 samples have valid evidence"
      failure_action: "BLOCKER - Domain detection hallucinated, re-scan repository"

    CC2_dependency_closure:
      method: "#159 Transitive Dependency"
      action: "Re-compute dependency closure independently"
      validation: "Verify final_domains[] includes ALL transitive requires[]"
      pass_criteria: "No missing dependencies (all requires[] satisfied)"
      failure_action: "CRITICAL - Add missing dependencies to final_domains[]"

    CC3_pattern_coherence:
      method: "#84 Coherence Check"
      action: "Verify all active_patterns[] come from final_domains[] only"
      validation: "No phantom patterns (patterns not provided by any active domain)"
      pass_criteria: "Pattern count = sum of provides[] from final_domains[]"
      failure_action: "ERROR - Remove phantom patterns from active_patterns[]"

# ==============================================================================
# ANTI-GAMING DEFENSE (Method #56 Liar's Trap)
# ==============================================================================

anti_gaming:
  strategy: "Multi-condition triggers with thresholds prevent single-file gaming"

  scenarios:
    scenario_1:
      attack: "Create single cdk.json file with no actual CDK code"
      detection: "aws-cdk domain"
      confidence_calculation: "C1_cdk_config=1.0*0.40 + C2_cdk_imports=0.0*0.35 + C3_cdk_constructs=0.0*0.25 = 0.40"
      result: "0.40 < 0.80 threshold → NOT detected"
      resistance: "98% (single file insufficient)"

    scenario_2:
      attack: "Add fake CDK imports to 3 files without actual constructs"
      detection: "aws-cdk domain"
      confidence_calculation: "C1=1.0*0.40 + C2=1.0*0.35 + C3=0.0*0.25 = 0.75"
      result: "0.75 < 0.80 threshold → NOT detected"
      resistance: "95% (2/3 conditions insufficient)"

    scenario_3:
      attack: "Create minimal CDK project (cdk.json + 3 imports + 2 constructs)"
      detection: "aws-cdk domain"
      confidence_calculation: "C1=1.0*0.40 + C2=1.0*0.35 + C3=1.0*0.25 = 1.00"
      result: "1.00 >= 0.80 threshold → DETECTED"
      resistance: "0% (genuine minimal CDK project, should detect)"

  resistance_metrics:
    single_file_gaming: "98% resistance"
    two_condition_gaming: "95% resistance"
    minimal_genuine_project: "0% resistance (correctly detected)"
    overall_gaming_resistance: "95%+"

# ==============================================================================
# USAGE IN V8 PROCESS
# ==============================================================================

v8_integration:
  phase_0_step_2_5:
    file: "steps/step-00-preparation.md"
    location: "After STEP 2 (Template Analysis), before STEP 3 (Assumptions)"
    action: "Read this file, execute detection_algorithm steps 1-6"
    output: "Write domain_detection{} to preparation-report.yaml"
    gate: "GATE_0 conditions G0-08, G0-09, G0-10 enforce detection completeness"

  phase_2_mapping:
    file: "steps/step-02-mapping.md"
    location: "STEP 1 (Section-to-Knowledge Mapping)"
    action: "Read active_patterns{} from preparation-report.yaml"
    usage: "Suggest diagram types (DT-*) and quality checks (QP-*) per section"
    gate: "GATE_2 condition G2-09 prevents phantom pattern usage"

  phase_3_documentation:
    file: "steps/step-03-documentation.md"
    location: "While writing each section"
    action: "Read active_patterns.quality[], apply applicable patterns"
    validation: "For each pattern with section_applicable matching current section, apply validation"
    gate: "GATE_3 condition G3-07 verifies pattern application"

# ==============================================================================
# METADATA
# ==============================================================================

metadata:
  line_count: 380
  domain_count: 9  # 3 base + 6 specific
  pattern_count: 25  # Total quality patterns across all domains
  detection_conditions: 18  # Total conditions across 6 specific domains
  average_conditions_per_domain: 3
  confidence_thresholds:
    strict: [0.80]  # aws-cdk
    moderate: [0.75]  # event-driven-serverless, multi-tenant
    relaxed: [0.70]  # api-gateway, dynamodb-heavy

  methods_used:
    - "#167 Baseline Census (domain enumeration)"
    - "#85 Grounding Check (pattern verification)"
    - "#159 Transitive Dependency (requires[] closure)"
    - "#84 Coherence Check (pattern coherence)"
    - "#42 Reverse Engineering (confidence formula)"
    - "#56 Liar's Trap (anti-gaming)"

  v7_source_files:
    - "domain-dependencies.yaml (529L) - domain hierarchy, requires[], provides[]"
    - "domain-detection-rules.yaml (256L) - detection conditions, thresholds"
    - "quality-patterns.yaml (372L subset) - quality pattern definitions"

  simplifications:
    - "11 domains → 6 domains (removed: react, terraform, serverless-framework, external-integrations, NextJS)"
    - "33 patterns → 25 patterns (kept highest-value only)"
    - "Separate files → single consolidated file"
    - "7-step algorithm → 6-step (merged evidence collection with detection)"

  token_reduction: "1157L (V7 total) → 380L (V8 consolidated) = 67% reduction"

  changelog:
    - version: "1.0.0"
      date: "2026-02-13"
      changes: "Initial V8 adaptation from V7 multi-domain system"
      author: "claude-sonnet-4-5"
