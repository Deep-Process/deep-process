---
schema_version: "8.0.0"
artifact: "verification-report.yaml"
description: "Schema for Phase 4 verification output"

structure:
  version:
    type: "string"
    required: true

  phase:
    type: "integer"
    required: true
    description: "Phase number (4)"

  phase_name:
    type: "string"
    required: true
    description: "'VERIFICATION'"

  generated_at:
    type: "string"
    format: "ISO 8601 timestamp"
    required: true

  summary:
    type: "object"
    required: true
    description: "Overall verification statistics"
    properties:
      total_claims:
        type: "integer"
        required: true
        description: "Total claims extracted from documentation"

      verified:
        type: "integer"
        required: true
        description: "Claims that match source code exactly"

      degraded:
        type: "integer"
        required: true
        description: "Claims partially true (e.g., line number changed)"

      hallucinated:
        type: "integer"
        required: true
        description: "Claims that don't match source code"

      degradation_rate:
        type: "number"
        required: true
        description: "(degraded + hallucinated) / total_claims * 100"

  claims:
    type: "array"
    required: true
    description: "Individual claim verification results"
    items:
      type: "object"
      properties:
        claim_id:
          type: "string"
          required: true
          description: "Claim ID (e.g., 'C-001')"

        statement:
          type: "string"
          required: true
          description: "The claim made in documentation"

        evidence:
          type: "string"
          required: true
          description: "File:line citation"

        doc_location:
          type: "string"
          required: true
          description: "Where claim appears in docs (e.g., 'docs/architecture.md:45')"

        status:
          type: "string"
          enum: ["VERIFIED", "DEGRADED", "HALLUCINATED"]
          required: true

        evidence_check:
          type: "string"
          required: true
          description: "Result of checking evidence"

        impact:
          type: "string"
          enum: ["low", "medium", "high", "critical"]
          required: false
          description: "Impact if degraded/hallucinated"

  verification_by_category:
    type: "object"
    required: false
    description: "Verification statistics by category"
    properties:
      execution_flows:
        type: "object"
        properties:
          total:
            type: "integer"
          verified:
            type: "integer"
          degraded:
            type: "integer"
          hallucinated:
            type: "integer"

      data_flows:
        type: "object"
        properties:
          total:
            type: "integer"
          verified:
            type: "integer"
          degraded:
            type: "integer"
          hallucinated:
            type: "integer"

      control_flows:
        type: "object"
        properties:
          total:
            type: "integer"
          verified:
            type: "integer"
          degraded:
            type: "integer"
          hallucinated:
            type: "integer"

      test_coverage:
        type: "object"
        properties:
          total:
            type: "integer"
          verified:
            type: "integer"
          degraded:
            type: "integer"
          hallucinated:
            type: "integer"

      configuration:
        type: "object"
        properties:
          total:
            type: "integer"
          verified:
            type: "integer"
          degraded:
            type: "integer"
          hallucinated:
            type: "integer"

  issues:
    type: "array"
    required: true
    description: "List of degraded and hallucinated claims"
    items:
      type: "object"
      properties:
        claim_id:
          type: "string"
          required: true

        status:
          type: "string"
          enum: ["DEGRADED", "HALLUCINATED"]
          required: true

        issue:
          type: "string"
          required: true
          description: "What's wrong"

        recommendation:
          type: "string"
          required: true
          description: "How to fix"

        impact:
          type: "string"
          enum: ["low", "medium", "high", "critical"]
          required: true

  counter_check:
    type: "object"
    required: true
    description: "Counter-check results (sample 10% re-verification)"
    properties:
      sampled_claims:
        type: "integer"
        required: true
        description: "Number of claims sampled (10% of total)"

      verified:
        type: "integer"
        required: true
        description: "How many sampled claims verified correctly"

      status:
        type: "string"
        enum: ["PASS", "FAIL"]
        required: true
        description: "Whether counter-check passed"

  gate_evaluation:
    type: "object"
    required: true
    description: "GATE_4 evaluation results"
    properties:
      gate:
        type: "string"
        required: true
      status:
        type: "string"
        enum: ["OPEN", "LOCKED"]
        required: true
      conditions:
        type: "array"
        required: true
      counter_checks:
        type: "array"
        required: true
      evaluated_at:
        type: "string"
        format: "ISO 8601 timestamp"
        required: true

  recommendation:
    type: "object"
    required: true
    description: "Recommendation for next steps"
    properties:
      proceed_to_refinement:
        type: "boolean"
        required: true
        description: "Whether Phase 5 recommended"

      reason:
        type: "string"
        required: true

      critical_issues_count:
        type: "integer"
        required: true
        description: "Number of critical hallucinations"

validation_rules:
  - rule: "degradation_rate must be <5% for GATE_4 to pass"
  - rule: "hallucinated claims with impact=critical must be 0"
  - rule: "counter_check must sample ≥10% of claims"
  - rule: "gate_evaluation.status must be OPEN to proceed (or complete)"
  - rule: "If critical_issues_count > 0, proceed_to_refinement must be true"
