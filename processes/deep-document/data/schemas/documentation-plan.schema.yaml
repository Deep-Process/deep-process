---
schema_version: "8.1.0"
artifact: "documentation-plan.yaml"
description: "Schema for Phase 2 template mapping output (V8.1.0 adds semantic_verification)"

structure:
  version:
    type: "string"
    required: true

  phase:
    type: "integer"
    required: true
    description: "Phase number (2)"

  phase_name:
    type: "string"
    required: true
    description: "'TEMPLATE MAPPING'"

  generated_at:
    type: "string"
    format: "ISO 8601 timestamp"
    required: true

  section_mappings:
    type: "array"
    required: true
    description: "Map knowledge items to template sections"
    items:
      type: "object"
      properties:
        section_id:
          type: "string"
          required: true
          description: "Section ID (e.g., 'S-001')"

        section_title:
          type: "string"
          required: true
          description: "Section title from template"

        section_level:
          type: "integer"
          required: true
          description: "Heading level (1, 2, 3, 4)"

        template_location:
          type: "string"
          required: true
          description: "Location in template (e.g., 'line 45-78')"

        required:
          type: "boolean"
          required: true
          description: "Whether section is required"

        knowledge_sources:
          type: "array"
          required: true
          description: "Knowledge items mapped to this section"
          items:
            type: "object"
            properties:
              type:
                type: "string"
                enum: ["execution_flows", "data_flows", "control_flows", "test_coverage", "configuration_impact"]
                required: true
              items:
                type: "array"
                items:
                  type: "string"
                required: true
                description: "Knowledge item IDs (e.g., ['F-001', 'F-002'])"
              coverage:
                type: "string"
                required: true
                description: "Coverage description"

        semantic_intent:
          type: "object"
          required: true
          description: "Semantic intent carried from Phase 0 (purpose, depth, entity_expectation)"
          properties:
            purpose:
              type: "string"
              enum: ["explain", "reference", "guide", "catalog", "analyze"]
              required: true
            depth:
              type: "string"
              enum: ["overview", "standard", "detailed", "deep-dive"]
              required: true
            audience:
              type: "string"
              required: true
            entity_expectation:
              type: "string"
              enum: ["all", "primary", "selective", "none"]
              required: true

        entity_census_check:
          type: "object"
          required: false
          description: "Entity count verification (required when entity_expectation=all)"
          properties:
            expected:
              type: "integer"
              required: true
            mapped:
              type: "integer"
              required: true
            status:
              type: "string"
              enum: ["COMPLETE", "INCOMPLETE"]
              required: true

        estimated_length:
          type: "string"
          required: false
          description: "Estimated word count (e.g., '800-1200 words')"

  semantic_verification:
    type: "object"
    required: true
    description: "Semantic matching verification (V8.1.0 Phase B - prevents sparse planning)"
    properties:
      sections_verified:
        type: "integer"
        required: true
        description: "Count of sections with entity_expectation='all' that were verified"

      mismatches_found:
        type: "integer"
        required: true
        description: "Total mismatches detected (potential + critical)"

      potential_mismatches:
        type: "array"
        required: true
        description: "Sections with match_score 0.40-0.60 (SHOULD resolve)"
        items:
          type: "object"
          properties:
            section_id:
              type: "string"
              required: true
            section_title:
              type: "string"
              required: true
            entity_expectation:
              type: "string"
              required: true
            match_score:
              type: "number"
              required: true
              description: "0.0-1.0 (0.6 * keyword_overlap + 0.4 * entity_type_match)"
            keyword_overlap:
              type: "number"
              required: true
              description: "0.0-1.0"
            entity_type_match:
              type: "number"
              required: true
              description: "0.0-1.0"
            recommendation:
              type: "string"
              required: true
            resolution:
              type: "string"
              required: false
              description: "SCOPE_REDUCTION, adjustment, or justification"

      critical_mismatches:
        type: "array"
        required: true
        description: "Sections with match_score < 0.40 (MUST resolve - BLOCKER)"
        items:
          type: "object"
          properties:
            section_id:
              type: "string"
              required: true
            section_title:
              type: "string"
              required: true
            entity_expectation:
              type: "string"
              required: true
            match_score:
              type: "number"
              required: true
            keyword_overlap:
              type: "number"
              required: true
            entity_type_match:
              type: "number"
              required: true
            recommendation:
              type: "string"
              required: true
            resolution:
              type: "string"
              required: true
              description: "MUST have SCOPE_REDUCTION or entity_expectation adjustment"

      verified_at:
        type: "string"
        format: "ISO 8601 timestamp"
        required: true

  gaps:
    type: "array"
    required: true
    description: "Sections with no knowledge sources"
    items:
      type: "object"
      properties:
        section_id:
          type: "string"
          required: true

        section_title:
          type: "string"
          required: true

        template_location:
          type: "string"
          required: true

        required:
          type: "boolean"
          required: true

        reason:
          type: "string"
          required: true
          description: "Why gap exists"

        fillable:
          type: "boolean"
          required: true
          description: "Can we derive knowledge?"

        action:
          type: "string"
          enum: ["mark_unknown", "derive_from_knowledge", "scope_reduction"]
          required: true

        impact:
          type: "string"
          enum: ["low", "medium", "high", "critical"]
          required: true

    gap_reasoning:
      type: "array"
      required: true
      description: "REASONING_DECLARATION for each gap action (Standard 10)"
      items:
        type: "object"
        properties:
          section:
            type: "string"
            required: true
          action:
            type: "string"
            required: true
          because:
            type: "string"
            required: true

  coverage_summary:
    type: "object"
    required: true
    description: "Coverage statistics"
    properties:
      total_sections:
        type: "integer"
        required: true

      covered_sections:
        type: "integer"
        required: true
        description: "Sections with knowledge sources"

      gap_sections:
        type: "integer"
        required: true
        description: "Sections without knowledge sources"

      unknown_sections:
        type: "integer"
        required: true
        description: "Gaps marked as [UNKNOWN]"

      section_coverage:
        type: "number"
        required: true
        description: "covered_sections / total_sections * 100. [UNKNOWN] sections do NOT count as covered."

      target:
        type: "number"
        required: true
        description: "Target coverage (90.0)"

      status:
        type: "string"
        enum: ["PASS", "FAIL"]
        required: true
        description: "Whether coverage ≥ target"

  writing_order:
    type: "array"
    required: true
    description: "Topologically sorted order for writing sections"
    items:
      type: "object"
      properties:
        order:
          type: "integer"
          required: true

        section_id:
          type: "string"
          required: true

        section_title:
          type: "string"
          required: true

        reason:
          type: "string"
          required: true
          description: "Why this order (dependencies)"

  gate_evaluation:
    type: "object"
    required: true
    description: "GATE_2 evaluation results"
    properties:
      gate:
        type: "string"
        required: true
      status:
        type: "string"
        enum: ["OPEN", "LOCKED"]
        required: true
      conditions:
        type: "array"
        required: true
      counter_checks:
        type: "array"
        required: true
      evaluated_at:
        type: "string"
        format: "ISO 8601 timestamp"
        required: true

validation_rules:
  - rule: "section_mappings must cover all template sections"
  - rule: "gaps must document all sections without knowledge sources"
  - rule: "coverage_summary.coverage_percentage must be ≥90%"
  - rule: "writing_order must have topological order (no circular dependencies)"
  - rule: "All required gaps must have action != 'mark_unknown' OR SCOPE_REDUCTION declared"
  - rule: "semantic_verification.critical_mismatches[] MUST all have resolution field (GATE_2 G2-09)"
  - rule: "semantic_verification.potential_mismatches[] SHOULD all have resolution field (GATE_2 G2-10)"
  - rule: "gate_evaluation.status must be OPEN to proceed to Phase 3"
