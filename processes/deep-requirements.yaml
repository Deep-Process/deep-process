---
# Deep-Requirements Process v1.0
# Requirements extraction and analysis from user input
---

process_name: deep-requirements
version: "1.0.0"
created: "2026-02-16"
13_zasady_version: "1.0.0"

# ═══════════════════════════════════════════════════════════════
# METADATA
# ═══════════════════════════════════════════════════════════════

metadata:
  category: REQUIREMENTS_ANALYSIS
  purpose: "Extract, analyze, and document project requirements from user input"
  role: "Business Analyst + Product Manager"
  complexity: MEDIUM
  estimated_duration: "2-5 minutes"

# ═══════════════════════════════════════════════════════════════
# TRIGGER CONDITIONS
# ═══════════════════════════════════════════════════════════════

triggers:
  - trigger_type: ORCHESTRATOR_INVOCATION
    description: "Orchestrator invokes for Phase 1 (new project or requirements change)"
    event: PROCESS_STARTED

  - trigger_type: FEEDBACK_LOOP
    description: "Feedback loop triggers requirements update"
    event: REQUIREMENTS_UPDATE_NEEDED

# ═══════════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════════

inputs:
  user_request:
    type: string
    description: "User's project description or change request"
    required: true
    examples:
      - "I want a task management app with user authentication, real-time updates, and mobile support"
      - "Add ability to assign tasks to users and set priorities"

  project_context:
    type: artifact
    schema_ref: "schemas/project-context-schema.yaml"
    description: "Project metadata (if existing project)"
    required: false
    path: "artifacts/{project_id}/project-context.yaml"

  existing_requirements:
    type: artifact
    schema_ref: "schemas/requirements-schema.yaml"
    description: "Existing requirements (if change request)"
    required: false
    path: "artifacts/{project_id}/requirements.yaml"

  analysis_result:
    type: artifact
    description: "Request analysis from orchestrator"
    required: true
    fields:
      - mode (NEW_PROJECT | MODIFY_EXISTING)
      - request_type
      - high_level_requirements

# ═══════════════════════════════════════════════════════════════
# PHASES
# ═══════════════════════════════════════════════════════════════

phases:
  total_phases: 6
  execution: "Sequential"

  # ───────────────────────────────────────────────────────────
  # PHASE 1: Initial Extraction
  # ───────────────────────────────────────────────────────────

  phase_1_initial_extraction:
    description: "Extract functional and non-functional requirements from user input"
    sequence: 1

    steps:
      step_1_extract_functional_requirements:
        description: "Identify what the system should do"
        action: |
          functional_requirements = []

          # Parse user request for action verbs and objects
          # Examples: "create tasks", "authenticate users", "send notifications"

          patterns = [
            "user can ...",
            "system should ...",
            "ability to ...",
            "support for ...",
            "[verb] [object]"
          ]

          FOR pattern IN patterns:
            matches = extract_using_pattern(user_request, pattern)
            FOR match IN matches:
              req = {
                req_id: generate_req_id("FR"),  # FR-001, FR-002, ...
                description: normalize_requirement(match),
                priority: estimate_priority(match),
                source: "user_request",
                category: categorize_requirement(match)
              }
              functional_requirements.append(req)

      step_2_extract_nonfunctional_requirements:
        description: "Identify quality attributes and constraints"
        action: |
          nonfunctional_requirements = []

          # Categories: PERFORMANCE, SECURITY, USABILITY, SCALABILITY,
          #            RELIABILITY, MAINTAINABILITY, COMPLIANCE

          nfr_keywords = {
            PERFORMANCE: ["fast", "response time", "latency", "throughput"],
            SECURITY: ["authentication", "authorization", "encryption", "secure"],
            USABILITY: ["user-friendly", "intuitive", "easy to use"],
            SCALABILITY: ["scale", "concurrent users", "load"],
            RELIABILITY: ["uptime", "availability", "fault-tolerant"],
            COMPLIANCE: ["GDPR", "HIPAA", "SOC2", "regulation"]
          }

          FOR category, keywords IN nfr_keywords:
            IF any_keyword_in_request(user_request, keywords):
              req = {
                req_id: generate_req_id("NFR"),  # NFR-001, NFR-002, ...
                category: category,
                description: extract_nfr_description(user_request, category),
                target: extract_target_metric(user_request, category),
                priority: HIGH if category in [SECURITY, PERFORMANCE] else MEDIUM
              }
              nonfunctional_requirements.append(req)

          # Add default NFRs
          IF not has_security_nfr(nonfunctional_requirements):
            nonfunctional_requirements.append({
              req_id: generate_req_id("NFR"),
              category: SECURITY,
              description: "System must implement secure authentication and authorization",
              priority: HIGH
            })

      step_3_extract_constraints:
        description: "Identify project constraints"
        action: |
          constraints = []

          constraint_types = {
            TECHNOLOGY: ["use Python", "must be React", "PostgreSQL"],
            TIMELINE: ["deadline", "by next week", "in 2 months"],
            BUDGET: ["budget", "cost", "free tier"],
            COMPLIANCE: ["must comply with", "regulation", "standard"],
            PLATFORM: ["web", "mobile", "desktop", "cross-platform"]
          }

          FOR type, keywords IN constraint_types:
            IF any_keyword_in_request(user_request, keywords):
              constraint = {
                type: type,
                description: extract_constraint(user_request, type)
              }
              constraints.append(constraint)

      step_4_extract_stakeholders:
        description: "Identify stakeholders and users"
        action: |
          stakeholders = []

          user_types = extract_user_types(user_request)
          # Examples: "admin", "regular user", "guest", "manager"

          FOR user_type IN user_types:
            stakeholder = {
              type: user_type,
              role: infer_role(user_type),
              permissions: infer_permissions(user_type)
            }
            stakeholders.append(stakeholder)

          # Add default stakeholder
          IF len(stakeholders) == 0:
            stakeholders.append({
              type: "end_user",
              role: "Primary user of the system",
              permissions: ["read", "write"]
            })

    outputs:
      - functional_requirements (list)
      - nonfunctional_requirements (list)
      - constraints (list)
      - stakeholders (list)

    gates:
      - GATE_REQUIREMENTS_EXTRACTED

  # ───────────────────────────────────────────────────────────
  # PHASE 2: Requirement Elaboration
  # ───────────────────────────────────────────────────────────

  phase_2_requirement_elaboration:
    description: "Elaborate each requirement with details and acceptance criteria"
    sequence: 2

    steps:
      step_1_elaborate_functional_requirements:
        description: "Add details to each functional requirement"
        action: |
          FOR req IN functional_requirements:
            # Add acceptance criteria
            req.acceptance_criteria = generate_acceptance_criteria(req)

            # Example:
            # Req: "User can create a task"
            # Acceptance criteria:
            #   - User can enter task title (max 200 chars)
            #   - User can enter optional description
            #   - User can set due date
            #   - Task is saved to database
            #   - User receives confirmation

            # Add dependencies
            req.depends_on = identify_dependencies(req, functional_requirements)

            # Add user stories (optional)
            req.user_story = generate_user_story(req)
            # Format: "As a [user type], I want to [action], so that [benefit]"

      step_2_elaborate_nonfunctional_requirements:
        description: "Add measurable targets to NFRs"
        action: |
          FOR req IN nonfunctional_requirements:
            # Add measurable targets
            IF req.category == PERFORMANCE:
              req.target = req.target OR "API response time P95 <200ms, P99 <500ms"
              req.measurement_method = "Load testing with 100 concurrent users"

            ELIF req.category == SECURITY:
              req.target = "Zero critical/high vulnerabilities, pass OWASP Top 10 checks"
              req.measurement_method = "SAST/DAST scanning, security testing"

            ELIF req.category == SCALABILITY:
              req.target = req.target OR "Support 1000 concurrent users, 10000 daily active users"
              req.measurement_method = "Load testing, performance benchmarks"

            ELIF req.category == RELIABILITY:
              req.target = req.target OR "99.5% uptime, RTO <1 hour, RPO <15 minutes"
              req.measurement_method = "Monitoring, incident tracking"

            # Add validation criteria
            req.validation_criteria = generate_validation_criteria(req)

      step_3_prioritize_requirements:
        description: "Assign priority to each requirement (MoSCoW method)"
        action: |
          FOR req IN functional_requirements + nonfunctional_requirements:
            IF req.priority NOT set:
              # MoSCoW: Must have, Should have, Could have, Won't have
              req.priority = prioritize_requirement(req, user_request)

              # Heuristics:
              # - Security NFRs: HIGH
              # - Core CRUD operations: HIGH
              # - Authentication: HIGH
              # - Nice-to-have features: MEDIUM/LOW
              # - Advanced features: LOW

    outputs:
      - functional_requirements (elaborated)
      - nonfunctional_requirements (elaborated)

    gates:
      - GATE_REQUIREMENTS_ELABORATED

  # ───────────────────────────────────────────────────────────
  # PHASE 3: Success Criteria Definition
  # ───────────────────────────────────────────────────────────

  phase_3_success_criteria:
    description: "Define project success criteria and definition of done"
    sequence: 3

    steps:
      step_1_define_functional_success:
        description: "Define when functional requirements are met"
        action: |
          functional_success_criteria = []

          # Group by priority
          high_priority_count = count(functional_requirements WHERE priority == HIGH)

          functional_success_criteria.append(
            f"All {high_priority_count} high-priority features implemented and tested"
          )

          functional_success_criteria.append(
            "All acceptance criteria for high-priority requirements met"
          )

      step_2_define_quality_success:
        description: "Define quality gates"
        action: |
          quality_success_criteria = [
            "Test coverage >80% for all code",
            "All tests passing (unit, integration, e2e)",
            "Zero critical security vulnerabilities",
            "Zero high-severity bugs",
            "All NFR targets met (performance, security, etc.)",
            "Code passes linting and security scans"
          ]

      step_3_define_deployment_success:
        description: "Define deployment criteria"
        action: |
          deployment_success_criteria = [
            "Application deployed to staging environment",
            "Health checks passing",
            "Monitoring and alerting configured",
            "Documentation complete (README, API docs, deployment guide)"
          ]

      step_4_combine_success_criteria:
        description: "Combine all success criteria"
        action: |
          success_criteria = {
            functional: functional_success_criteria,
            quality: quality_success_criteria,
            deployment: deployment_success_criteria,
            overall_definition_of_done: [
              "All high-priority requirements implemented",
              "All tests passing with >80% coverage",
              "Zero critical vulnerabilities",
              "Application deployed and healthy",
              "Documentation complete"
            ]
          }

    outputs:
      - success_criteria (dict)

    gates:
      - GATE_SUCCESS_CRITERIA_DEFINED

  # ───────────────────────────────────────────────────────────
  # PHASE 4: Requirement Validation
  # ───────────────────────────────────────────────────────────

  phase_4_requirement_validation:
    description: "Validate requirements for completeness, consistency, feasibility"
    sequence: 4

    steps:
      step_1_check_completeness:
        description: "Check if all requirements have necessary details"
        action: |
          completeness_issues = []

          FOR req IN functional_requirements:
            IF not req.acceptance_criteria:
              completeness_issues.append(f"{req.req_id}: Missing acceptance criteria")

            IF not req.priority:
              completeness_issues.append(f"{req.req_id}: Missing priority")

          FOR req IN nonfunctional_requirements:
            IF not req.target:
              completeness_issues.append(f"{req.req_id}: Missing measurable target")

      step_2_check_consistency:
        description: "Check for contradictory requirements"
        action: |
          consistency_issues = []

          # Check for contradictions
          # Example: "Must be simple to use" vs "Must have advanced configuration"

          FOR req1 IN functional_requirements:
            FOR req2 IN functional_requirements WHERE req1 != req2:
              IF contradicts(req1, req2):
                consistency_issues.append(
                  f"Contradiction: {req1.req_id} conflicts with {req2.req_id}"
                )

      step_3_check_feasibility:
        description: "Check if requirements are technically feasible"
        action: |
          feasibility_issues = []

          # Check for unrealistic requirements
          FOR req IN nonfunctional_requirements:
            IF req.category == PERFORMANCE:
              IF req.target includes "response time <1ms":
                feasibility_issues.append(
                  f"{req.req_id}: Response time <1ms unrealistic for web app"
                )

            IF req.category == SCALABILITY:
              IF req.target includes "1 billion users":
                feasibility_issues.append(
                  f"{req.req_id}: Scalability target may require significant infrastructure"
                )

      step_4_check_testability:
        description: "Check if requirements are testable"
        action: |
          testability_issues = []

          FOR req IN functional_requirements + nonfunctional_requirements:
            IF not is_testable(req):
              testability_issues.append(
                f"{req.req_id}: Requirement not measurable/testable"
              )

              # Suggest improvement
              suggestion = make_testable(req)
              testability_issues.append(f"  Suggestion: {suggestion}")

      step_5_aggregate_validation_results:
        description: "Aggregate all validation issues"
        action: |
          validation_results = {
            completeness_issues: completeness_issues,
            consistency_issues: consistency_issues,
            feasibility_issues: feasibility_issues,
            testability_issues: testability_issues,
            total_issues: len(completeness_issues) + len(consistency_issues) +
                          len(feasibility_issues) + len(testability_issues)
          }

          # Determine if validation passes
          IF validation_results.total_issues == 0:
            validation_status = PASS
          ELIF count(critical_issues) > 0:
            validation_status = FAIL
          ELSE:
            validation_status = PASS_WITH_WARNINGS

    outputs:
      - validation_results (dict)
      - validation_status (PASS | FAIL | PASS_WITH_WARNINGS)

    gates:
      - GATE_REQUIREMENTS_VALIDATED

  # ───────────────────────────────────────────────────────────
  # PHASE 5: Documentation Generation
  # ───────────────────────────────────────────────────────────

  phase_5_documentation_generation:
    description: "Generate requirements.yaml artifact"
    sequence: 5

    steps:
      step_1_structure_requirements_document:
        description: "Create requirements.yaml structure"
        action: |
          requirements_document = {
            dp_id: f"{project_context.project_id}-REQ",
            artifact_type: "requirements",
            version: "1.0.0",
            created_at: now(),
            created_by: "deep-requirements",
            schema_ref: "schemas/requirements-schema.yaml",

            project_info: {
              project_id: project_context.project_id,
              project_name: project_context.project_name,
              description: extract_project_description(user_request)
            },

            functional_requirements: functional_requirements,
            nonfunctional_requirements: nonfunctional_requirements,
            constraints: constraints,
            stakeholders: stakeholders,
            success_criteria: success_criteria,

            validation_results: validation_results,

            metadata: {
              total_functional_requirements: len(functional_requirements),
              total_nonfunctional_requirements: len(nonfunctional_requirements),
              high_priority_count: count(requirements WHERE priority == HIGH),
              medium_priority_count: count(requirements WHERE priority == MEDIUM),
              low_priority_count: count(requirements WHERE priority == LOW)
            },

            compliance_flags: {
              self_contained: true,
              has_counter_checks: true,
              binding_gates_enforced: true
            },

            13_zasady_version: "1.0.0"
          }

      step_2_save_requirements_artifact:
        description: "Save requirements.yaml to project artifacts"
        action: |
          save_yaml(requirements_document, f"artifacts/{project_id}/requirements.yaml")

      step_3_generate_human_readable_summary:
        description: "Generate markdown summary for user"
        action: |
          summary = f"""
          # Requirements Summary - {project_context.project_name}

          ## Overview
          - Total Requirements: {len(functional_requirements) + len(nonfunctional_requirements)}
          - Functional: {len(functional_requirements)} ({count(FR WHERE priority==HIGH)} high priority)
          - Non-Functional: {len(nonfunctional_requirements)}
          - Constraints: {len(constraints)}

          ## High-Priority Functional Requirements
          {list_requirements(functional_requirements WHERE priority == HIGH)}

          ## Non-Functional Requirements
          {list_requirements(nonfunctional_requirements)}

          ## Success Criteria
          {format_success_criteria(success_criteria)}

          ## Validation Status
          Status: {validation_status}
          Issues: {validation_results.total_issues}
          """

          save_markdown(summary, f"artifacts/{project_id}/requirements-summary.md")

    outputs:
      - artifacts/{project_id}/requirements.yaml
      - artifacts/{project_id}/requirements-summary.md

    gates:
      - GATE_DOCUMENTATION_COMPLETE

  # ───────────────────────────────────────────────────────────
  # PHASE 6: Handoff Preparation
  # ───────────────────────────────────────────────────────────

  phase_6_handoff_preparation:
    description: "Prepare handoff to deep-architecture process"
    sequence: 6

    steps:
      step_1_create_handoff_checkpoint:
        description: "Create handoff checkpoint artifact"
        action: |
          handoff_checkpoint = {
            dp_id: f"{project_context.project_id}-HANDOFF-01",
            artifact_type: "handoff-checkpoint",
            schema_ref: "schemas/handoff-checkpoint-schema.yaml",

            source_process: "deep-requirements",
            target_process: "deep-architecture",
            handoff_type: "SEQUENTIAL",

            handoff_payload: {
              artifacts: [
                "artifacts/{project_id}/requirements.yaml"
              ],
              context: {
                project_id: project_context.project_id,
                high_priority_requirements: extract(functional_requirements WHERE priority == HIGH),
                key_nfrs: extract(nonfunctional_requirements WHERE priority == HIGH),
                constraints: constraints
              }
            },

            pre_validation_status: "NOT_STARTED",
            created_at: now()
          }

      step_2_run_pre_validation:
        description: "Run Method #348: Pre-Handoff Validation"
        action: |
          validation_checklist = {
            process_status_complete: project_context.status == "RUNNING",
            required_artifacts_exist: file_exists("requirements.yaml"),
            artifacts_pass_schema: validate_schema("requirements.yaml"),
            no_failed_gates: check_no_failed_gates(),
            no_critical_warnings: validation_results.total_issues == 0 OR validation_status != FAIL,
            context_complete: true,
            dependencies_resolved: true
          }

          all_checks_pass = all(validation_checklist.values())

          handoff_checkpoint.pre_validation_status = "PASSED" if all_checks_pass else "FAILED"
          handoff_checkpoint.pre_validation_checklist = validation_checklist

      step_3_emit_handoff_event:
        description: "Emit HANDOFF_INITIATED event"
        action: |
          IF handoff_checkpoint.pre_validation_status == "PASSED":
            emit_event(
              event_type: HANDOFF_INITIATED,
              project_id: project_context.project_id,
              payload: {
                from_process: "deep-requirements",
                to_process: "deep-architecture",
                handoff_id: handoff_checkpoint.dp_id
              }
            )

      step_4_save_handoff_checkpoint:
        description: "Save handoff checkpoint"
        action: |
          save_yaml(handoff_checkpoint, f"artifacts/{project_id}/handoff-checkpoint-01.yaml")

    outputs:
      - artifacts/{project_id}/handoff-checkpoint-01.yaml

    gates:
      - GATE_HANDOFF_READY

# ═══════════════════════════════════════════════════════════════
# OUTPUTS
# ═══════════════════════════════════════════════════════════════

outputs:
  requirements:
    artifact_type: "requirements"
    schema_ref: "schemas/requirements-schema.yaml"
    path: "artifacts/{project_id}/requirements.yaml"
    description: "Complete requirements specification"

  requirements-summary:
    artifact_type: "documentation"
    format: "markdown"
    path: "artifacts/{project_id}/requirements-summary.md"
    description: "Human-readable requirements summary"

  handoff-checkpoint:
    artifact_type: "handoff-checkpoint"
    schema_ref: "schemas/handoff-checkpoint-schema.yaml"
    path: "artifacts/{project_id}/handoff-checkpoint-01.yaml"
    description: "Handoff checkpoint to deep-architecture"

# ═══════════════════════════════════════════════════════════════
# VALIDATION GATES
# ═══════════════════════════════════════════════════════════════

validation_gates:
  GATE_REQUIREMENTS_EXTRACTED:
    description: "Basic requirements extracted from user input"
    validation_rule: "len(functional_requirements) > 0"

  GATE_REQUIREMENTS_ELABORATED:
    description: "All requirements have acceptance criteria and priorities"
    validation_rule: "all(req.acceptance_criteria AND req.priority for req in functional_requirements)"

  GATE_SUCCESS_CRITERIA_DEFINED:
    description: "Success criteria defined for project"
    validation_rule: "success_criteria defined AND len(success_criteria.overall_definition_of_done) > 0"

  GATE_REQUIREMENTS_VALIDATED:
    description: "Requirements validated for completeness, consistency, feasibility"
    validation_rule: "validation_status IN [PASS, PASS_WITH_WARNINGS]"

  GATE_DOCUMENTATION_COMPLETE:
    description: "requirements.yaml artifact created and valid"
    validation_rule: "file_exists(requirements.yaml) AND validate_schema(requirements.yaml)"

  GATE_HANDOFF_READY:
    description: "Handoff checkpoint created and pre-validation passed"
    validation_rule: "handoff_checkpoint.pre_validation_status == PASSED"

# ═══════════════════════════════════════════════════════════════
# ERROR HANDLING
# ═══════════════════════════════════════════════════════════════

error_handlers:
  insufficient_information:
    trigger: "Cannot extract meaningful requirements from user input"
    action: |
      1. Generate clarifying questions
      2. Request additional information from user
      3. Retry extraction after receiving answers

  validation_failure:
    trigger: "Requirements validation fails (FAIL status)"
    action: |
      1. Document validation issues
      2. Attempt automatic fixes (e.g., add missing acceptance criteria)
      3. If cannot fix: request user clarification
      4. Retry validation

  contradictory_requirements:
    trigger: "Consistency check detects contradictions"
    action: |
      1. Identify contradicting requirements
      2. Present contradiction to user
      3. Request prioritization or clarification
      4. Update requirements based on user input

# ═══════════════════════════════════════════════════════════════
# COMPLIANCE
# ═══════════════════════════════════════════════════════════════

compliance_13_zasady:
  zasada_1_self_contained:
    status: COMPLIANT
    evidence: "Process includes all extraction, elaboration, validation logic"

  zasada_2_binding_gates:
    status: COMPLIANT
    evidence: "6 validation gates must pass (GATE_REQUIREMENTS_VALIDATED blocks if validation fails)"

  zasada_3_sequential_execution:
    status: COMPLIANT
    evidence: "Phases execute 1→2→3→4→5→6, cannot skip"

  zasada_4_completeness_markers:
    status: COMPLIANT
    evidence: "All requirements have priority, acceptance criteria, validation status"

  zasada_7_counter_checks:
    status: COMPLIANT
    evidence: "Validation phase checks completeness, consistency, feasibility, testability"

  zasada_9_traceable_decisions:
    status: COMPLIANT
    evidence: "All requirement prioritizations logged, validation results documented"

---
# END deep-requirements.yaml
