process_schemas:
  deep-explore:
    required_fields:
      - field: "options"
        type: array
        rule: "MIN_LENGTH:1"
        error: "At least 1 option must be identified"

      - field: "options[].name"
        type: string
        rule: "NOT_EMPTY"
        error: "Option name required"

      - field: "options[].score"
        type: number
        rule: "RANGE:0-10"
        error: "Score must be 0-10"

  deep-risk:
    required_fields:
      - field: "risks"
        type: array
        rule: "MIN_LENGTH:1"
        error: "At least 1 risk must be identified"

      - field: "risks[].name"
        type: string
        rule: "NOT_EMPTY"
        error: "Risk name required"

      - field: "risks[].severity"
        type: number
        rule: "RANGE:0-10"
        error: "Severity must be 0-10"

      - field: "risks[].impact"
        type: string
        rule: "ENUM:LOW,MEDIUM,HIGH,CRITICAL"
        error: "Impact must be LOW/MEDIUM/HIGH/CRITICAL"

  deep-verify:
    required_fields:
      - field: "verdict"
        type: string
        rule: "ENUM:GO,NO-GO,CONDITIONAL-GO,UNCERTAIN"
        error: "Verdict must be GO/NO-GO/CONDITIONAL-GO/UNCERTAIN"

      - field: "score"
        type: number
        rule: "RANGE:0-10"
        error: "Score must be 0-10"

      - field: "confidence"
        type: string
        rule: "ENUM:LOW,MEDIUM,HIGH,VERY_HIGH"
        error: "Confidence must be LOW/MEDIUM/HIGH/VERY_HIGH"

      - field: "critical_issues"
        type: array
        rule: "ALLOW_EMPTY"

  deep-synthesis:
    required_fields:
      - field: "themes"
        type: array
        rule: "MIN_LENGTH:1"
        error: "At least 1 theme must be identified"

      - field: "themes[].name"
        type: string
        rule: "NOT_EMPTY"
        error: "Theme name required"

validation_rules:
  TASK_STATE:
    - field: "task_id"
      rule: "NOT_EMPTY"
      error: "Task ID required"

    - field: "status"
      rule: "ENUM:COMPLETED,FAILED,SKIPPED"
      error: "Status must be COMPLETED/FAILED/SKIPPED"

    - field: "output_location"
      rule: "IF status=COMPLETED THEN NOT_EMPTY"
      error: "Output location required for completed tasks"

  WORKFLOW_METADATA:
    - field: "goal"
      rule: "NOT_EMPTY"
      error: "Workflow goal required"
