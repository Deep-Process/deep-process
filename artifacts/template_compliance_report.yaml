# CRITICAL ZASADY COMPLIANCE REQUIREMENTS
# ═══════════════════════════════════════════════════════════════

critical_requirements:

  binding_gates_enforcement:
    affected_recommendations: [REC-MODIFY-001, REC-MODIFY-002, REC-MODIFY-005, REC-MODIFY-007, REC-MODIFY-008, REC-MODIFY-009]
    requirement: "Every phase integration MUST add binding gates"
    zasada: 4
    action: |
      - New phase integrations require: GATE_PHASE_Nx_COMPLETE
      - Orchestrator merge requires: GATE_ORCHESTRATION_UNIFIED
      - Subprocess integrations require: GATE_SUBPROCESS_COMPLETE
      - Error handlers require: GATE_ERROR_HANDLED

  mechanism_not_intent:
    affected_recommendations: [REC-MODIFY-001, REC-MODIFY-003, REC-MODIFY-004, REC-MODIFY-005]
    requirement: "ALL rules must be IF-THEN, no 'should' or 'typically'"
    zasada: 3
    violations_to_avoid:
      - "System should retry..." → "IF retry_count < 3 THEN retry ELSE HALT"
      - "Typically monitors..." → "WHILE active DO monitor EVERY 5_seconds"
      - "May need approval..." → "IF risk > threshold THEN require_approval ELSE proceed"

  completeness_enforcement:
    affected_recommendations: [REC-MODIFY-001, REC-MODIFY-003, REC-MODIFY-004, REC-MODIFY-005, REC-ADD-001, REC-ADD-002]
    requirement: "Use ALL, EVERY, EACH - never 'main' or 'key'"
    zasada: 2
    examples:
      - "Monitor ALL active processes" not "Monitor main processes"
      - "Test EVERY function" not "Test key functions"
      - "Handle ALL error cases" not "Handle typical errors"

  ooda_structure_enforcement:
    affected_recommendations: [REC-MODIFY-004, REC-ADD-001, REC-ADD-002, REC-ADD-003, REC-ADD-004]
    requirement: "Every phase MUST have complete Observe-Orient-Decide-Act"
    zasada: 0
    special_case: "Continuous processes (deep-monitoring) need OODA loop, not linear phases"

  forced_sequence_enforcement:
    affected_recommendations: [REC-MODIFY-001, REC-MODIFY-007, REC-MODIFY-008, REC-MODIFY-009]
    requirement: "Phases connected by BLOCKER gates, cannot skip without scope_reduction"
    zasada: 6
    implementation: "Phase N completion gate blocks Phase N+1 start"

  counter_check_requirement:
    affected_recommendations: [REC-MODIFY-002]
    requirement: "Critical decisions need counter-checks (attempt to disprove)"
    zasada: 8
    example: "Orchestrator merge decision: actively search for cases where TWO orchestrators better than one"

  zero_decoration_enforcement:
    affected_recommendations: [REC-MODIFY-008, REC-MODIFY-009, REC-ADD-001, REC-ADD-002, REC-ADD-003, REC-ADD-004]
    requirement: "No explanatory text, examples in separate file, descriptions max 10 words"
    zasada: 13
    violations_to_avoid:
      - Long descriptions of "why"
      - Examples in process definition
      - Explanatory comments
      - "Best practices" sections

