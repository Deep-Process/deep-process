# COMPLIANCE RISKS (13 ZASADY VIOLATIONS)
# ═══════════════════════════════════════════════════════════════

compliance_risks:

  - risk_id: RISK-029
    category: compliance
    title: "13 Zasady Not Enforced Across All Processes"
    description: "14 processes have manifests, but only some declare compliance_13_zasady. No systematic validation."
    severity: HIGH
    probability: CERTAIN
    affected_processes:
      - ALL 27 processes
    impact: "Inconsistent process quality. Non-compliant processes may violate principles. No automated compliance checking."
    evidence:
      - "orchestrator-master has compliance_13_zasady section"
      - "deep-aggregate manifest has gates but no compliance section"
      - "No compliance validation in CI/CD"
    mitigation:
      priority: P1
      action: |
        1. Create compliance validator tool:
           - Check all 13 zasady for each process
           - Generate compliance report
        2. Add compliance_13_zasady to all process.yaml files
        3. Require compliance validation before process approval
        4. Add to CI/CD: block merges if non-compliant
      estimated_effort: "2-3 weeks"

  - risk_id: RISK-030
    category: compliance
    title: "OODA Structure Not Enforced"
    description: "PROCESS-TEMPLATE mandates OODA (Observe-Orient-Decide-Act) but not validated systematically."
    severity: MEDIUM
    probability: CERTAIN
    affected_processes:
      - ALL 27 processes
    impact: "Processes may skip OODA phases. Inconsistent execution patterns. Violates Zasada 0."
    evidence:
      - "PROCESS-TEMPLATE requires OODA for every phase"
      - "orchestrator-master phases have OODA structure"
      - "No validation that all processes follow OODA"
    mitigation:
      priority: P2
      action: |
        1. Add OODA validator to compliance tool:
           - Check each phase has observe, orient, decide, act
           - Validate each sub-phase has gate
        2. Audit all 27 processes for OODA compliance
        3. Fix non-compliant processes
      estimated_effort: "1-2 weeks"

  - risk_id: RISK-031
    category: compliance
    title: "Binding Gates Not Consistently Enforced"
    description: "PROCESS-TEMPLATE requires binding gates but enforcement mechanism unclear. Processes may skip gates."
    severity: HIGH
    probability: LIKELY
    affected_processes:
      - ALL 27 processes
    impact: "Processes advance without meeting prerequisites. Quality issues. Incomplete work. Violates Zasada 4."
    evidence:
      - "orchestrator-master defines gates but no enforcement code"
      - "deep-aggregate has gates but gate checking not visible in workflow"
      - "No gate failure tracking in execution-plan.yaml"
    mitigation:
      priority: P1
      action: |
        1. Implement gate enforcement in orchestrator:
           - Evaluate gate condition before proceeding
           - HALT if gate fails and on_fail = HALT
           - Track gate results in execution-plan.yaml
        2. Add gate test framework
        3. Add gate failure logging
      estimated_effort: "2 weeks"

  - risk_id: RISK-032
    category: compliance
    title: "Counter-Checks Not Systematically Required"
    description: "PROCESS-TEMPLATE requires counter-checks (Zasada 8) but not enforced. Critical decisions made without attempting to disprove."
    severity: MEDIUM
    probability: LIKELY
    affected_processes:
      - ALL processes making critical decisions
    impact: "Confirmation bias. Wrong decisions. Assumptions not challenged. Violates Zasada 8."
    evidence:
      - "deep-aggregate manifest: all gates require counter_check_executed = TRUE"
      - "Most other processes don't reference counter-checks"
      - "No counter-check validation in compliance checker"
    mitigation:
      priority: P2
      action: |
        1. Identify critical decision points in each process
        2. Add counter-check requirements:
           - For architecture decisions
           - For completeness claims
           - For go/no-go decisions
        3. Add counter-check tracking to artifacts
        4. Add to compliance validator
      estimated_effort: "2-3 weeks"

  - risk_id: RISK-033
    category: compliance
    title: "Process Size Limits Not Enforced"
    description: "PROCESS-TEMPLATE specifies max 300 lines per process, max 50 lines per phase. No enforcement."
    severity: LOW
    probability: CERTAIN
    affected_processes:
      - ALL 27 processes
    impact: "Processes become too large and complex. Violates maintainability principles. Zasada 1 (self-contained) at risk."
    evidence:
      - "PROCESS-TEMPLATE: max_lines_per_process: 300"
      - "No validation of line counts"
      - "No size tracking in CI/CD"
    mitigation:
      priority: P3
      action: |
        1. Add size validator to CI/CD:
           - Count lines in process.yaml
           - Count lines in each phase
           - Fail if over limit
        2. Audit existing processes for size
        3. Split oversized processes
      estimated_effort: "1 week"

  - risk_id: RISK-034
    category: compliance
    title: "Checklist After Every Phase Not Validated"
    description: "PROCESS-TEMPLATE requires checklist after every phase (Zasada 7) but not validated."
    severity: MEDIUM
    probability: CERTAIN
    affected_processes:
      - ALL 27 processes
    impact: "Phases complete without validation. Errors not caught early. Violates Zasada 7."
    evidence:
      - "PROCESS-TEMPLATE: 'Every phase ends with mandatory checklist'"
      - "orchestrator-master phases don't show checklists"
      - "No checklist validation in compliance checker"
    mitigation:
      priority: P2
      action: |
        1. Add checklist validation to compliance tool:
           - Each phase must have checklist
           - Minimum 3 questions, maximum 7
           - Must include completeness, correctness, consistency
        2. Audit all processes
        3. Add missing checklists
      estimated_effort: "2 weeks"

  - risk_id: RISK-035
    category: compliance
    title: "Executable Language Not Enforced"
    description: "PROCESS-TEMPLATE requires executable language (LOAD, EXTRACT, IF-THEN) but processes may use intent language."
    severity: MEDIUM
    probability: POSSIBLE
    affected_processes:
      - ALL 27 processes
    impact: "Ambiguous instructions. Agent cannot execute. Manual interpretation required. Violates Zasada 9."
    evidence:
      - "PROCESS-TEMPLATE forbidden: 'should', 'might', 'typically'"
      - "No validation of language in process definitions"
      - "No forbidden word checker"
    mitigation:
      priority: P2
      action: |
        1. Create language validator:
           - Scan for forbidden patterns ("should", "might", "typically", "ideally")
           - Scan for required verbs (LOAD, EXTRACT, IF, THEN, etc.)
           - Flag violations
        2. Add to CI/CD
        3. Fix violations in existing processes
      estimated_effort: "1 week"

  - risk_id: RISK-036
    category: compliance
    title: "Error Handlers Not Complete Across All Processes"
    description: "PROCESS-TEMPLATE requires 8 specific error handlers. Not all processes define all handlers."
    severity: HIGH
    probability: CERTAIN
    affected_processes:
      - ALL 27 processes
    impact: "Unhandled error cases. Process crashes. No recovery paths. Poor error messages."
    evidence:
      - "PROCESS-TEMPLATE required_error_handlers: 8 types"
      - "orchestrator-master defines all 8"
      - "Other processes may not define all"
    mitigation:
      priority: P1
      action: |
        1. Add error handler validator:
           - Check for all 8 required handlers
           - Validate handler structure (trigger, severity, action, recovery)
        2. Audit all processes
        3. Add missing error handlers
      estimated_effort: "2-3 weeks"

  - risk_id: RISK-037
    category: compliance
    title: "Schema Validation Not Enforced"
    description: "PROCESS-TEMPLATE requires schemas for inputs/outputs but no runtime schema validation."
    severity: HIGH
    probability: CERTAIN
    affected_processes:
      - ALL 27 processes
    impact: "Invalid artifacts pass undetected. Integration failures. Data corruption. Schema drift."
    evidence:
      - "Processes define schema_ref but no validation code"
      - "No schema validator in orchestrator"
      - "Artifacts written without validation"
    mitigation:
      priority: P1
      action: |
        1. Implement schema validator:
           - Load schema from schema_ref
           - Validate artifact against schema
           - Fail if validation fails
        2. Add to orchestrator: validate all inputs/outputs
        3. Add to CI/CD: validate example artifacts
      estimated_effort: "1-2 weeks"

