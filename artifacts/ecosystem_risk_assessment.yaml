# ═══════════════════════════════════════════════════════════════
# ARCHITECTURAL RISKS
# ═══════════════════════════════════════════════════════════════

architectural_risks:

  - risk_id: RISK-001
    category: architectural
    title: "Inconsistent Process Naming in Orchestrator"
    description: "orchestrator-master phase_process_mapping references 'deep-architecture' (phase 2) but actual process is named 'deep-architect'. Mismatch will cause invocation failure."
    severity: CRITICAL
    probability: CERTAIN
    affected_processes:
      - orchestrator-master
      - deep-architect
    impact: "Process invocation failure. Phase 2 will fail to execute, breaking entire orchestration flow."
    evidence:
      - "orchestrator-master/process.yaml line 256: phase 2 maps to 'deep-architecture'"
      - "Process directory is 'processes/deep-architect'"
      - "Process manifest declares id: 'deep-architect'"
    mitigation:
      priority: P0
      action: "Update orchestrator-master phase_process_mapping line 256 from 'deep-architecture' to 'deep-architect'"
      estimated_effort: "5 minutes"
      validation: "Test orchestrator-master invocation of phase 2"

  - risk_id: RISK-002
    category: architectural
    title: "59% Process Orphaning Rate"
    description: "16 of 27 processes (59.3%) are not invoked by any other process. High orphan rate indicates poor integration and underutilization."
    severity: HIGH
    probability: CERTAIN
    affected_processes:
      - deep-feasibility
      - deep-diagram
      - deep-challenge
      - deep-compliance
      - deep-governance
      - deep-document
      - deep-synthesis
      - deep-monitoring
      - context-manager
      - deep-change
      - deep-edge-case
      - deep-execute
      - deep-govern
      - deep-plan
      - deep-process
    impact: "Investment in 16 processes not yielding ecosystem value. Functionality gaps as capabilities exist but aren't integrated."
    evidence:
      - "dependency_graph.yaml orphaned_processes: 16 items"
      - "statistics.integration_rate: 40.7%"
      - "15 orphaned processes have no integration path"
    mitigation:
      priority: P1
      action: |
        Phase 1 (CRITICAL): Integrate governance & execution processes
          - deep-governance -> orchestrator-master (governance layer)
          - deep-plan -> orchestrator-master (planning layer)
          - deep-change -> orchestrator-master (change management)
          - deep-implement -> orchestrator-master (execution layer)

        Phase 2 (HIGH): Integrate quality & analysis processes
          - deep-feasibility -> orchestrator-master (pre-phase analysis)
          - deep-challenge -> orchestrator-master (validation layer)
          - deep-compliance -> deep-governance (compliance checks)
          - deep-document -> orchestrator-master (documentation phase)

        Phase 3 (MEDIUM): Integrate supporting processes
          - deep-monitoring -> orchestrator-master (continuous monitoring)
          - deep-synthesis -> orchestrator-master (post-execution learning)
          - deep-diagram -> deep-architect (diagram generation)

        Phase 4 (LOW): Archive or deprecate legacy
          - deep-change, deep-edge-case, deep-execute, deep-govern, deep-plan, deep-process
      estimated_effort: "4-6 weeks"

  - risk_id: RISK-003
    category: architectural
    title: "Two Competing Orchestrators"
    description: "Both 'orchestrator-master' and 'deep-orchestration' exist with overlapping responsibilities. No clear separation of concerns."
    severity: MEDIUM
    probability: CERTAIN
    affected_processes:
      - orchestrator-master
      - deep-orchestration
      - deep-aggregate
    impact: "Confusion about which orchestrator to use. Potential for duplicate work and inconsistent execution patterns."
    evidence:
      - "orchestrator-master: main entry point, coordinates 9 processes"
      - "deep-orchestration: workflow coordination, invokes deep-aggregate"
      - "No clear documentation on when to use which"
    mitigation:
      priority: P1
      action: |
        Option A (RECOMMENDED): Merge functionality
          - Make orchestrator-master the single entry point
          - Move deep-aggregate invocation into orchestrator-master
          - Archive deep-orchestration

        Option B: Define clear roles
          - orchestrator-master: Project-level orchestration (full lifecycle)
          - deep-orchestration: Workflow-level orchestration (sub-process coordination)
          - Document invocation patterns clearly
      estimated_effort: "1-2 weeks"

  - risk_id: RISK-004
    category: architectural
    title: "No Error Recovery Orchestration"
    description: "feedback-loop-handler invoked conditionally on partial_completion, but no systematic error recovery across ecosystem."
    severity: HIGH
    probability: LIKELY
    affected_processes:
      - orchestrator-master
      - feedback-loop-handler
      - ALL child processes
    impact: "Process failures cascade without recovery. Partial work lost. Manual intervention required for every failure."
    evidence:
      - "orchestrator-master only invokes feedback-loop-handler on partial_completion"
      - "No retry logic in phase invocations"
      - "No checkpoint/resume mechanism documented"
    mitigation:
      priority: P1
      action: |
        1. Implement systematic retry with exponential backoff
        2. Add checkpoint mechanism (save state every phase)
        3. Create recovery decision tree:
           - TRANSIENT errors -> auto-retry 3x
           - BLOCKER errors -> invoke feedback-loop-handler
           - CRITICAL errors -> escalate to user with state saved
        4. Add recovery tracking to execution-plan.yaml
      estimated_effort: "2-3 weeks"

  - risk_id: RISK-005
    category: architectural
    title: "Missing Schema Definitions"
    description: "Process manifests reference schemas that don't exist in schemas/ directory. Missing orchestration-state-machine-schema.yaml, process-registry-schema.yaml, etc."
    severity: HIGH
    probability: CERTAIN
    affected_processes:
      - orchestrator-master
      - deep-orchestration
      - ALL processes referencing missing schemas
    impact: "Cannot validate artifacts. Schema violations go undetected. Integration failures during runtime."
    evidence:
      - "orchestrator-master references schemas/orchestration-state-machine-schema.yaml (NOT FOUND)"
      - "orchestrator-master references schemas/process-registry-schema.yaml (NOT FOUND)"
      - "Only 13 schemas exist in schemas/ directory"
      - "Multiple processes reference non-existent schemas"
    mitigation:
      priority: P0
      action: |
        1. Audit all schema_ref declarations across 27 processes
        2. Create missing schemas:
           - orchestration-state-machine-schema.yaml
           - process-registry-schema.yaml
           - sprint-backlog-schema.yaml
           - execution-status-schema.yaml
           - change-request-schema.yaml
           - governance-decision-schema.yaml
        3. Validate all existing schemas against YAML Schema spec
        4. Add schema validation to CI/CD
      estimated_effort: "1-2 weeks"

  - risk_id: RISK-006
    category: architectural
    title: "Context Manager Not Integrated"
    description: "context-manager process exists but has no explicit invocation. Likely intended to run before orchestrator-master but integration undefined."
    severity: MEDIUM
    probability: CERTAIN
    affected_processes:
      - context-manager
      - orchestrator-master
    impact: "Session state management unclear. Context may not be properly initialized. Parallel executions may collide."
    evidence:
      - "context-manager: invoked_by: [] (no invokers)"
      - "Note: 'Likely invoked before orchestrator-master but not explicitly referenced'"
      - "context-manager has no manifest.yaml"
    mitigation:
      priority: P1
      action: |
        1. Add explicit invocation: CLI/API -> context-manager -> orchestrator-master
        2. Define handoff protocol:
           - context-manager OUTPUTS: session-context.yaml
           - orchestrator-master INPUTS: session-context.yaml
        3. Document lifecycle: init -> load context -> execute -> cleanup
        4. Add manifest.yaml to context-manager
      estimated_effort: "1 week"

  - risk_id: RISK-007
    category: architectural
    title: "No Circular Dependency Detection"
    description: "While current dependency_graph shows no circular dependencies, there's no mechanism to prevent them as processes evolve."
    severity: MEDIUM
    probability: POSSIBLE
    affected_processes:
      - ALL orchestrators
      - ALL processes that may invoke subprocesses
    impact: "Future process changes could introduce circular dependencies, causing infinite loops and stack overflow."
    evidence:
      - "dependency_graph.yaml: circular_dependencies: []"
      - "No validation in orchestrator-master to detect cycles"
      - "No pre-invocation dependency graph validation"
    mitigation:
      priority: P2
      action: |
        1. Implement dependency graph validator
        2. Run validation before process invocation
        3. Add to CI/CD: validate dependency_graph.yaml on every commit
        4. Create maximum depth limit (e.g., 10 levels)
      estimated_effort: "1 week"

