        3. Feed learning back into process templates
      estimated_effort: "2 weeks"

# ═══════════════════════════════════════════════════════════════
# OPERATIONAL RISKS
# ═══════════════════════════════════════════════════════════════

operational_risks:

  - risk_id: RISK-021
    category: operational
    title: "Single Point of Failure: Orchestrator-Master"
    description: "All process execution depends on orchestrator-master. If it fails, entire ecosystem is unusable."
    severity: CRITICAL
    probability: LIKELY
    affected_processes:
      - orchestrator-master
      - ALL 27 processes
    impact: "Complete ecosystem failure. Cannot execute any processes. All work blocked until orchestrator-master fixed."
    evidence:
      - "orchestrator-master is single entry point"
      - "9 processes depend on orchestrator-master"
      - "No fallback or redundancy"
    mitigation:
      priority: P0
      action: |
        1. Implement health check for orchestrator-master
        2. Add fallback direct invocation:
           - If orchestrator-master unavailable, allow direct process invocation
           - Skip orchestration features but keep process execution working
        3. Add orchestrator-master monitoring and auto-restart
        4. Document manual invocation procedures
      estimated_effort: "1-2 weeks"

  - risk_id: RISK-022
    category: operational
    title: "No Lock Timeout Mechanism"
    description: "orchestrator-master acquires project lock but no timeout. Stale locks can block execution indefinitely."
    severity: HIGH
    probability: LIKELY
    affected_processes:
      - orchestrator-master
      - context-manager
    impact: "Deadlocks. Processes blocked waiting for stale locks. Manual intervention required to release locks."
    evidence:
      - "orchestrator-master error_handlers.concurrent_modification: 'IF stale_lock THEN force_release'"
      - "No stale lock detection logic defined"
      - "No lock timeout duration specified"
    mitigation:
      priority: P1
      action: |
        1. Define lock timeout (e.g., 4 hours)
        2. Add lock heartbeat (update every 5 minutes while active)
        3. Implement stale lock detection:
           - Lock with no heartbeat >5 minutes = stale
           - Auto-release stale locks with warning
        4. Add lock monitoring dashboard
      estimated_effort: "1 week"

  - risk_id: RISK-023
    category: operational
    title: "No Rate Limiting or Throttling"
    description: "No limits on concurrent process execution. Could overwhelm system resources."
    severity: HIGH
    probability: POSSIBLE
    affected_processes:
      - orchestrator-master
      - ALL processes
    impact: "System overload. Out of memory errors. API rate limit exceeded. Unpredictable performance."
    evidence:
      - "orchestrator-master error_handlers.resource_exhaustion: 'concurrent_projects > max_allowed'"
      - "max_allowed not defined"
      - "No throttling mechanism implemented"
    mitigation:
      priority: P1
      action: |
        1. Define concurrency limits:
           - Max 5 concurrent orchestrator-master executions
           - Max 10 concurrent child process executions per orchestrator
        2. Implement queue for excess requests
        3. Add resource monitoring (CPU, memory, tokens/min)
        4. Add graceful degradation (slow down, don't fail)
      estimated_effort: "1-2 weeks"

  - risk_id: RISK-024
    category: operational
    title: "No Timeout Enforcement in Child Processes"
    description: "orchestrator-master has timeout error handler but timeout duration not specified. Child processes may hang indefinitely."
    severity: HIGH
    probability: LIKELY
    affected_processes:
      - orchestrator-master
      - ALL child processes
    impact: "Hung processes. Orchestrator blocked waiting forever. Resources not released. Manual killing required."
    evidence:
      - "orchestrator-master error_handlers.timeout: 'child_process > max_duration'"
      - "max_duration not defined"
      - "No timeout values in phase definitions"
    mitigation:
      priority: P1
      action: |
        1. Define timeout values per process:
           - Default: 30 minutes
           - deep-explore: 60 minutes (research-heavy)
           - deep-implement: 120 minutes (execution-heavy)
        2. Implement timeout enforcement
        3. Add timeout warnings at 80% threshold
        4. Save checkpoint before killing timed-out process
      estimated_effort: "1 week"

  - risk_id: RISK-025
    category: operational
    title: "No Artifact Retention Policy"
    description: "Artifacts created indefinitely with no cleanup. Storage will grow unbounded."
    severity: MEDIUM
    probability: CERTAIN
    affected_processes:
      - orchestrator-master
      - ALL processes producing artifacts
    impact: "Storage exhaustion. Performance degradation. Difficult to find relevant artifacts. High storage costs."
    evidence:
      - "No cleanup logic in any process"
      - "No retention policy documented"
      - "Artifacts written to artifacts/ with no expiration"
    mitigation:
      priority: P2
      action: |
        1. Define retention policy:
           - Active projects: retain all artifacts
           - Completed projects: retain 90 days
           - Failed projects: retain 30 days
           - Archive to cold storage after 90 days
        2. Implement cleanup process (run weekly)
        3. Add artifact compression for archived projects
      estimated_effort: "1 week"

  - risk_id: RISK-026
    category: operational
    title: "Complex Dependency Chain Increases Failure Risk"
    description: "orchestrator-master invokes 9 processes sequentially. Single failure blocks all downstream processes."
    severity: MEDIUM
    probability: LIKELY
    affected_processes:
      - orchestrator-master
      - ALL 9 child processes
    impact: "Long chains = high failure probability. Compound probability of failure increases with each step. More failures, more restarts."
    evidence:
      - "orchestrator-master: 9 sequential process invocations"
      - "No parallel execution"
      - "No optional/skippable phases"
    mitigation:
      priority: P2
      action: |
        1. Identify independent phases that can run in parallel:
           - deep-risk + deep-requirements (both analyze requirements)
           - deep-test + deep-verify (can run concurrently)
        2. Implement parallel execution in orchestrator-master
        3. Add optional phase marking (allow skip if not critical)
        4. Add retry logic for transient failures
      estimated_effort: "2-3 weeks"

  - risk_id: RISK-027
    category: operational
    title: "No Observability: Cannot Diagnose Failures"
    description: "Processes emit events but no centralized logging or tracing. Cannot diagnose failures across process boundaries."
    severity: HIGH
    probability: CERTAIN
    affected_processes:
      - ALL 27 processes
    impact: "Debugging extremely difficult. Cannot trace execution flow. Root cause analysis takes hours instead of minutes."
    evidence:
      - "PROCESS-TEMPLATE requires emissions but no log aggregation"
      - "No trace IDs for cross-process correlation"
      - "No centralized log storage"
    mitigation:
      priority: P1
      action: |
        1. Implement structured logging:
           - All emissions to structured format (JSON)
           - Include trace_id, process_id, phase_id, step_id
        2. Create log aggregation service
        3. Add trace visualization tool
        4. Add search/filter capabilities
      estimated_effort: "2-3 weeks"

  - risk_id: RISK-028
    category: operational
    title: "Legacy Processes Create Maintenance Burden"
    description: "6 legacy processes (no manifests) still in codebase. Unclear if they're used. Maintenance burden without value."
    severity: LOW
    probability: CERTAIN
    affected_processes:
      - deep-change
      - deep-edge-case
      - deep-execute
      - deep-govern
      - deep-plan
      - deep-process
    impact: "Code clutter. Confusion about which processes to use. Maintenance time wasted on unused code."
    evidence:
      - "6 processes with status: legacy"
      - "No manifests, minimal structure"
      - "Not invoked by any process"
    mitigation:
      priority: P3
      action: |
        1. Audit legacy processes:
           - Check if any external tools reference them
           - Check git history (last modified date)
        2. If unused: Move to archive/ directory
        3. If used: Create manifests and integrate
        4. Document deprecation status
      estimated_effort: "1 week"

