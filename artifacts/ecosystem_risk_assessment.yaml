integration_risks:

  - risk_id: RISK-008
    category: integration
    title: "Undefined Handoff Protocols Between Processes"
    description: "No standardized handoff protocol between processes. Each process outputs artifacts but downstream consumption not validated."
    severity: HIGH
    probability: CERTAIN
    affected_processes:
      - ALL 27 processes
    impact: "Integration failures at runtime. Processes expect different artifact formats. Manual intervention needed to fix handoffs."
    evidence:
      - "No handoff-protocol.yaml found in artifacts/"
      - "Processes define outputs but not consumption contracts"
      - "Schema mismatches between producer/consumer not detected"
    mitigation:
      priority: P1
      action: |
        1. Create handoff protocol specification:
           - Define input/output contracts for each process
           - Specify artifact format expectations
           - Define handoff validation rules
        2. Add handoff validation to orchestrator-master:
           - Validate phase N outputs before invoking phase N+1
           - Check artifact existence AND schema compliance
        3. Create handoff-protocol.yaml artifact
        4. Document in PROCESS-ECOSYSTEM-INTEGRATION.md
      estimated_effort: "2-3 weeks"

  - risk_id: RISK-009
    category: integration
    title: "No Data Lineage Tracking"
    description: "Artifacts produced and consumed across processes but no tracking of data lineage. Cannot trace which process created which artifact."
    severity: MEDIUM
    probability: CERTAIN
    affected_processes:
      - ALL 27 processes
    impact: "Debugging difficult. Cannot trace artifact origin. Compliance/audit trails incomplete."
    evidence:
      - "No lineage metadata in artifact schemas"
      - "No provenance tracking in orchestration"
      - "execution-summary.yaml doesn't capture artifact lineage"
    mitigation:
      priority: P2
      action: |
        1. Add lineage metadata to all artifact schemas:
           created_by: process_id
           created_at: timestamp
           derived_from: [parent_artifact_ids]
           lineage_chain: [process_id_1, process_id_2, ...]
        2. Update orchestration to populate lineage
        3. Create lineage visualization tool
      estimated_effort: "2 weeks"

  - risk_id: RISK-010
    category: integration
    title: "Deep-Verify Invoked Twice Without Clear Distinction"
    description: "orchestrator-master invokes deep-verify at phases 3 and 7. No documentation on what changes between invocations."
    severity: MEDIUM
    probability: CERTAIN
    affected_processes:
      - orchestrator-master
      - deep-verify
    impact: "Duplicate work. Unclear verification boundaries. May verify same things twice or miss things neither invocation checks."
    evidence:
      - "orchestrator-master phase_process_mapping: 3: 'deep-verify', 7: 'deep-verify'"
      - "No distinction in invocation parameters"
      - "deep-verify manifest doesn't specify different modes"
    mitigation:
      priority: P2
      action: |
        Option A: Define verification modes
          - Phase 3: Architectural verification (post-design)
          - Phase 7: Implementation verification (post-implementation)

        Option B: Split into separate processes
          - deep-verify-architecture (phase 3)
          - deep-verify-implementation (phase 7)

        Option C: Single invocation
          - Move to phase 7 only (post-implementation)
          - Remove from phase 3
      estimated_effort: "1 week"

  - risk_id: RISK-011
    category: integration
    title: "Deep-Aggregate Only Invoked by Deep-Orchestration"
    description: "deep-aggregate provides valuable aggregation capability but only accessible through deep-orchestration. orchestrator-master doesn't use it."
    severity: MEDIUM
    probability: CERTAIN
    affected_processes:
      - deep-aggregate
      - orchestrator-master
      - deep-orchestration
    impact: "Orchestrator-master users don't get aggregated decision briefs. Inconsistent user experience between orchestrators."
    evidence:
      - "deep-aggregate invoked_by: [deep-orchestration]"
      - "orchestrator-master doesn't invoke deep-aggregate"
      - "orchestrator-master produces execution-summary.yaml but not decision brief"
    mitigation:
      priority: P2
      action: |
        1. Add deep-aggregate invocation to orchestrator-master phase 4 (result_aggregation)
        2. Update phase_4_result_aggregation to invoke deep-aggregate
        3. Generate decision brief in addition to execution-summary
      estimated_effort: "3-5 days"

  - risk_id: RISK-012
    category: integration
    title: "No Artifact Version Control"
    description: "Artifacts overwritten without versioning. No way to rollback to previous state or track changes over time."
    severity: MEDIUM
    probability: CERTAIN
    affected_processes:
      - ALL 27 processes
    impact: "Cannot rollback failed changes. Debugging difficult. No audit trail of artifact evolution."
    evidence:
      - "Artifacts written to fixed paths (artifacts/{project_id}/artifact.yaml)"
      - "No version suffix or timestamp"
      - "No artifact history tracked"
    mitigation:
      priority: P2
      action: |
        1. Implement artifact versioning:
           - Path format: artifacts/{project_id}/{artifact_name}-v{N}.yaml
           - Keep last N versions (e.g., 10)
        2. Add version pointer: artifacts/{project_id}/{artifact_name}-CURRENT.yaml -> v{N}
        3. Add cleanup policy (delete versions >30 days old)
        4. Track versions in execution-plan.yaml
      estimated_effort: "1-2 weeks"

  - risk_id: RISK-013
    category: integration
    title: "No Event Bus for Process Communication"
    description: "Processes communicate through artifacts only. No event-driven communication for real-time coordination."
    severity: LOW
    probability: CERTAIN
    affected_processes:
      - ALL orchestrators
      - deep-monitoring
      - feedback-loop-handler
    impact: "Polling artifacts for changes. High latency for error detection. Cannot react to events in real-time."
    evidence:
      - "orchestrator-master uses artifact-based handoffs"
      - "No event emission documented"
      - "Note in phase 5: 'EMIT final_event' but no event bus defined"
    mitigation:
      priority: P3
      action: |
        1. Design event bus architecture:
           - Event types: PROCESS_STARTED, PROCESS_COMPLETED, PROCESS_FAILED, GATE_FAILED, etc.
           - Event schema with metadata
        2. Implement event emitter in orchestrators
        3. Create event subscribers for monitoring and error handling
        4. Add event log to execution-plan.yaml
      estimated_effort: "2-3 weeks"

