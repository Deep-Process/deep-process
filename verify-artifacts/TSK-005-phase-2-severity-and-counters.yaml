counter_checks:
  note: "Counter-checking all 7 CRITICAL and 4 IMPORTANT findings (11 total)"

  # CRITICAL findings counter-checks

  CC_F85-001:
    finding_id: "F85-001"
    severity: "CRITICAL"
    claim: "Performance guarantee (P95 <500ms) ungrounded"

    counter_hypothesis:
      hypothesis: "What if latency budget EXISTS but wasn't documented in this architecture summary?"
      alternative_explanations:
        1: "Latency budget documented in separate performance testing report"
        2: "P95 <500ms derived from benchmarking, just not shown here"
        3: "Architecture summary intentionally omits implementation details"

    test_against_artifact:
      search_for_evidence: "Re-read architecture document for ANY latency measurements or budget"
      evidence_for_counter:
        - "Line 48: Performance claim exists"
        - "Section 7.1: Monitoring mentions 'latency (P50, P95, P99)' but no targets"
      evidence_against_counter:
        - "No latency budget found in any section"
        - "No reference to separate performance report"
        - "Document claims to be 'COMPREHENSIVE' (line 3)"
        - "Other claims (cost, risk) show calculations → selective omission unlikely"

    conclusion: "FINDING_SURVIVES"
    rationale: |
      Counter-hypothesis WEAK. Document is labeled "COMPREHENSIVE" and shows calculations
      for other claims (cost, risk). If latency budget existed, it would be shown.
      Monitoring mentions P95 metric but no <500ms target documented.
      Finding survives: Performance guarantee remains ungrounded.

  CC_F85-002:
    finding_id: "F85-002"
    severity: "CRITICAL"
    claim: "Risk reduction (30%→10%) ungrounded, fictional benchmark"

    counter_hypothesis:
      hypothesis: "What if 30%→10% reduction is from security research or expert judgment?"
      alternative_explanations:
        1: "Baseline 30% from industry breach statistics"
        2: "RLS effectiveness from PostgreSQL security research"
        3: "Expert judgment from security consultant (not cited)"

    test_against_artifact:
      search_for_evidence: "Re-read risk sections for ANY reference to baseline or research"
      evidence_for_counter:
        - "Line 541: Mentions 'defense-in-depth' (security practice)"
      evidence_against_counter:
        - "No reference to breach statistics"
        - "No citation of PostgreSQL security research"
        - "No mention of security consultant or expert judgment"
        - "Other risks have detailed methodology (VR-001 uses scoring formula)"

    conclusion: "FINDING_SURVIVES"
    rationale: |
      Counter-hypothesis WEAK. Document shows detailed risk scoring for other items
      (Probability × Impact × Velocity × Detectability × Reversibility).
      If 30%→10% had basis, methodology would be shown (as with other risks).
      Finding survives: Risk reduction claim is fictional benchmark.

  CC_F85-003:
    finding_id: "F85-003"
    severity: "CRITICAL"
    claim: "Detectability improvement (25%→60%) ungrounded"

    counter_hypothesis:
      hypothesis: "Same as CC_F85-002 - security research or expert judgment"

    test_against_artifact:
      search_for_evidence: "Check for anomaly detection effectiveness research"
      evidence_for_counter: []
      evidence_against_counter:
        - "Same pattern as F85-002 - no research cited"
        - "No anomaly detection vendor specifications"
        - "Specific numbers (25%, 60%) suggest measurement, but no source"

    conclusion: "FINDING_SURVIVES"
    rationale: "Same logic as CC_F85-002. Finding survives."

  CC_F78-001:
    finding_id: "F78-001"
    severity: "CRITICAL"
    claim: "Performance relies on unstated assumptions (cold start, budget, concurrency)"

    counter_hypothesis:
      hypothesis: "What if assumptions are IMPLICIT domain knowledge (not worth stating)?"
      alternative_explanations:
        1: "K8s cold start handling is standard practice (readers should know)"
        2: "Latency budget is obvious from component list"
        3: "100 concurrent = standard load testing assumption"

    test_against_artifact:
      search_for_evidence: "Check if assumptions are industry standard"
      evidence_for_counter:
        - "K8s cold start is known issue in community"
        - "Performance testing commonly uses sustained concurrency"
      evidence_against_counter:
        - "Document is for enterprise customers (may not know K8s internals)"
        - "Other assumptions ARE stated explicitly (Multi-AZ, RLS, etc.)"
        - "Performance is Quality Attribute #3 (critical) → should be explicit"
        - "Cold start can VIOLATE P95 → cannot be assumed handled"

    conclusion: "FINDING_SURVIVES"
    rationale: |
      Counter-hypothesis WEAK. While domain knowledge exists, critical assumptions
      for Quality Attribute #3 should be explicit. Cold start is known to ADD LATENCY
      (not reduce it) → cannot be assumed handled without evidence.
      Finding survives: Assumptions remain unstated and risky.

  CC_F78-002:
    finding_id: "F78-002"
    severity: "CRITICAL"
    claim: "Risk reduction relies on unstated assumptions (baseline, SUPERUSER, etc.)"

    counter_hypothesis:
      hypothesis: "What if assumptions are security best practices (implicit)?"
      alternative_explanations:
        1: "Not using SUPERUSER is standard security practice"
        2: "RLS configuration correctness assumed as implementation detail"
        3: "Baseline 30% is industry standard"

    test_against_artifact:
      search_for_evidence: "Check if SUPERUSER assumption is stated anywhere"
      evidence_for_counter:
        - "Line 218: 'RLS blocks access' (implies proper configuration)"
      evidence_against_counter:
        - "No mention of SUPERUSER anywhere in document"
        - "Many managed RDS apps DO use SUPERUSER for simplicity"
        - "Phase 1 V-004 identified SUPERUSER bypass as critical gap"
        - "Baseline 30% has NO industry standard (SQL injection varies widely)"

    conclusion: "FINDING_SURVIVES"
    rationale: |
      Counter-hypothesis WEAK. SUPERUSER bypass is CRITICAL security assumption
      that MUST be stated, not assumed. Using SUPERUSER is common in managed RDS.
      Finding survives: Assumptions unstated and likely false.

  CC_F78-004:
    finding_id: "F78-004"
    severity: "CRITICAL"
    claim: "RLS defense-in-depth relies on SUPERUSER assumption"

    counter_hypothesis:
      hypothesis: "Same as CC_F78-002 - SUPERUSER avoidance is standard practice"

    test_against_artifact:
      search_for_evidence: "Same as CC_F78-002"
      evidence_for_counter: []
      evidence_against_counter:
        - "Same as CC_F78-002"
        - "This is MOST CRITICAL assumption affecting TWO mechanisms"

    conclusion: "FINDING_SURVIVES"
    rationale: "Same as CC_F78-002. This is THE most critical finding. Survives."

  # IMPORTANT findings counter-checks

  CC_F85-004:
    finding_id: "F85-004"
    severity: "IMPORTANT"
    claim: "Reliability guarantee (99.9% uptime) partially grounded"

    counter_hypothesis:
      hypothesis: "What if replication/backup details are in separate ops runbook?"
      alternative_explanations:
        1: "AWS Multi-AZ handles replication automatically (doesn't need stating)"
        2: "Backup/restore is RDS managed service (implicit)"
        3: "Operational details separate from architecture"

    test_against_artifact:
      search_for_evidence: "Check if operational details excluded intentionally"
      evidence_for_counter:
        - "Document is 'architecture', not 'operations manual'"
        - "Multi-AZ RDS DOES handle sync replication automatically"
        - "AWS manages backups automatically"
      evidence_against_counter:
        - "Other operational details ARE included (monitoring, alerting, health checks)"
        - "Section 7 (Operational Model) exists → operations ARE in scope"
        - "Backup/restore RPO/RTO affects 'no data loss' claim → must be stated"

    conclusion: "FINDING_SURVIVES (but severity could downgrade to MINOR)"
    rationale: |
      Counter-hypothesis MODERATE. Some evidence that AWS handles details automatically.
      However, Section 7 exists → operational details ARE in scope.
      RPO/RTO affects "no data loss" guarantee → should be stated.
      Finding survives but borderline (could be MINOR if we accept AWS auto-handles).

  CC_F85-005:
    finding_id: "F85-005"
    severity: "IMPORTANT"
    claim: "PostgreSQL 'kernel-level' enforcement is technically incorrect"

    counter_hypothesis:
      hypothesis: "What if 'kernel-level' is metaphor for 'strong enforcement'?"
      alternative_explanations:
        1: "Author meant 'database kernel' not 'OS kernel'"
        2: "Metaphorical use of 'kernel-level' to mean 'fundamental'"
        3: "PostgreSQL internals are 'kernel-level' relative to application"

    test_against_artifact:
      search_for_evidence: "Check context of 'kernel-level' claim"
      evidence_for_counter:
        - "Line 210: 'PostgreSQL enforces schema boundaries at kernel level'"
        - "Could be interpreted as 'database kernel' (PostgreSQL internals)"
      evidence_against_counter:
        - "Claim says 'PostgreSQL enforces', not 'database kernel enforces'"
        - "'Kernel-level' has specific meaning in security (OS kernel enforcement)"
        - "Context is security architecture → technical precision matters"
        - "search_path IS application-level (documented PostgreSQL behavior)"

    conclusion: "FINDING_SURVIVES"
    rationale: |
      Counter-hypothesis WEAK. In security context, 'kernel-level' has specific meaning.
      If author meant 'database kernel', should say "database kernel" not "kernel level".
      PostgreSQL search_path is application-level (CURRENT_SETTING, SET commands).
      Finding survives: Technical inaccuracy remains.

  CC_F78-003:
    finding_id: "F78-003"
    severity: "IMPORTANT"
    claim: "Reliability relies on unstated assumptions (retry, maintenance, K8s)"

    counter_hypothesis:
      hypothesis: "What if these are standard infrastructure practices?"
      alternative_explanations:
        1: "Connection retry is standard in all production apps"
        2: "AWS maintenance windows are well-known"
        3: "K8s reliability is industry standard (99%+)"

    test_against_artifact:
      search_for_evidence: "Check if retry logic or K8s reliability mentioned"
      evidence_for_counter:
        - "Retry logic IS standard practice"
        - "AWS maintenance IS predictable"
        - "K8s IS reliable (usually 99%+)"
      evidence_against_counter:
        - "Standard practices should still be DOCUMENTED in architecture"
        - "99.9% is VERY tight → all assumptions must be validated"
        - "No mention of retry logic anywhere in document"
        - "No mention of K8s cluster reliability SLA"

    conclusion: "FINDING_SURVIVES (but could downgrade to MINOR)"
    rationale: |
      Counter-hypothesis MODERATE. Practices are standard, but 99.9% target is tight.
      For such tight SLA, all assumptions should be explicit.
      Finding survives but borderline (could be MINOR if we accept standard practices).

  CC_F153-001:
    finding_id: "F153-001"
    severity: "IMPORTANT"
    claim: "CAP theorem trade-off undocumented"

    counter_hypothesis:
      hypothesis: "What if CAP trade-off is too advanced for architecture audience?"
      alternative_explanations:
        1: "Document targets enterprise customers, not distributed systems experts"
        2: "Multi-AZ behavior is well-documented by AWS (doesn't need repeating)"
        3: "CAP trade-off is implementation detail, not architecture decision"

    test_against_artifact:
      search_for_evidence: "Check if document targets technical vs business audience"
      evidence_for_counter:
        - "Audience includes 'Enterprise Admins' (line 98) - may not know CAP"
        - "AWS Multi-AZ behavior IS documented externally"
      evidence_against_counter:
        - "Document is TECHNICAL (includes security controls, deployment, ADRs)"
        - "Audience also includes 'Enterprise Developers' (line 97) - should know CAP"
        - "Other technical details ARE explained (RLS, circuit breaker, etc.)"
        - "CAP trade-off affects Quality Attribute #1 → should be explicit"

    conclusion: "FINDING_SURVIVES (but could downgrade to MINOR)"
    rationale: |
      Counter-hypothesis MODERATE. Audience may include non-experts, but document is
      technical overall. CAP trade-off is important for understanding availability guarantees.
      Finding survives but borderline (could be MINOR if we accept external AWS docs).

