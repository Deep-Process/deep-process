  FINDING_003:
    id: "V-003"
    severity: "IMPORTANT"
    methods: [71, 17]
    pattern: null
    quote: "99.9% uptime, no data loss"
    location: "line 46"
    description: |
      Reliability guarantee lacks operational details. 99.9% uptime requires failover mechanism
      (Multi-AZ ✓), replication strategy (NOT specified), and backup/restore (NOT specified).
      "No data loss" requires sync replication and documented RPO/RTO, but these are missing.
    impact: "Reliability claims cannot be validated without replication and backup specifications."
    score: 2  # 1 + 0 (no pattern) + 1 (cross-cluster)

  FINDING_004:
    id: "V-004"
    severity: "IMPORTANT"
    methods: [71]
    pattern: null
    quote: "Row-Level Security (RLS) as defense-in-depth (even if search_path wrong, RLS blocks access)"
    location: "line 218"
    description: |
      RLS security claim omits SUPERUSER bypass risk. PostgreSQL RLS is bypassed by SUPERUSER
      role. Document claims defense-in-depth but doesn't mention that application using
      SUPERUSER credentials bypasses RLS entirely, defeating the isolation mechanism.
    impact: "Security architecture has undocumented bypass condition. If application uses SUPERUSER (common in managed RDS), RLS provides zero isolation."
    score: 1

  FINDING_005:
    id: "V-005"
    severity: "IMPORTANT"
    methods: [100]
    pattern: "UG-003 (Scope Creep Definition)"
    quote: "'process' used in: (1) verification workflows (deep-risk), (2) microservices (Process Services), (3) system processes"
