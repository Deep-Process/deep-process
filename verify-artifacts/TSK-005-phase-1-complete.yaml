    severity: "CRITICAL"
    methods: [71, 17]
    pattern: "SI-004 (Fictional Benchmark Claims)"
    quote: "Database Row-Level Security (RLS) - Reduces probability 30% → 10%"
    location: "line 541"
    description: |
      Risk mitigation effectiveness claim lacks empirical basis. Claims 3x risk reduction
      (30% → 10%) without methodology, reference class data, or expert judgment documentation.
      This is a fictional benchmark presented as fact.
    impact: "Risk mitigation strategy based on ungrounded effectiveness claim. Investment decision ($20K-$40K) lacks empirical justification."
