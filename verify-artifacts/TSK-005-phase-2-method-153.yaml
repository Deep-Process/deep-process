  findings:
    F153-001:
      method: 153
      quote: "99.9% uptime, no data loss"
      location: "line 46"
      description: |
        Claim appears to violate CAP theorem but has VALID EXCEPTION (undocumented).
        CAP theorem: Can't have Consistency + Availability + Partition tolerance.
        Claim: "No data loss" (C) + "99.9% uptime" (A) + "Multi-AZ" (P).

        Valid exception: Multi-AZ uses synchronous replication within region.
        CAP applies to async networks; sync replication sidesteps theorem.
        AWS Multi-AZ chooses C over A when partition occurs (may become unavailable).

        ISSUE: Document doesn't explain:
        - CAP trade-off (C over A during partition)
        - Synchrony assumption (rare partitions)
        - Why 99.9% is achievable (partition time << 0.1%)

        Readers unfamiliar with CAP may think system guarantees both C and A always,
        which is theoretically impossible. Lack of explanation is misleading.
      severity: "TBD in 2.4"
      pattern_match: null
      note: "NOT a theorem violation, but undocumented trade-off"

