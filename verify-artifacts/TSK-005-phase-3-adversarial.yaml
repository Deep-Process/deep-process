  V-001_performance:
    finding_id: "V-001"
    original_severity: "CRITICAL"
    quote: "Job submission P95 <500ms, 100 concurrent jobs"
    location: "line 48"
    methods: [71, 17, 85, 78]
    description: "Performance guarantee completely ungrounded"

    prompt_1_alternative_explanation:
      question: "What if the author meant X instead of Y? Is there a reading where this is not a problem?"
      answer: |
        Alternative: Author meant P95 <500ms for ENQUEUE operation (async), not full job completion.
        Reading: "Job submission" = API returns 202 Accepted, not job completion.
        P95 <500ms for async enqueue is achievable (API Gateway + Orchestrator + SQS enqueue).
      weakens_finding: true
      explanation: |
        If "submission" means async enqueue (not completion), claim becomes more plausible.
        However, document still provides NO latency measurements even for enqueue.
        Weakens but doesn't eliminate finding (still ungrounded, but more achievable target).

    prompt_2_hidden_context:
      question: "What unstated assumption would make this work? Is there a footnote/appendix that resolves this?"
      answer: |
        Assumption: Performance testing was done but not documented in this architecture summary.
        Footnote: Could reference separate "Performance Testing Report" (not provided).
        Appendix: Could be in external artifacts (diagrams marked "not provided").
      weakens_finding: true
      explanation: |
        Document is labeled "COMPREHENSIVE" but has 13 dead refs to external files.
        If latency budget is in external performance report, finding is documentation gap, not fundamental flaw.
        Weakens severity (CRITICAL → IMPORTANT).

    prompt_3_domain_exception:
      question: "Is there a known exception in this domain? Do practitioners actually treat this as a problem?"
      answer: |
        Domain practice: Many architecture documents state SLAs without detailed latency budgets.
        Exception: Performance targets without budgets are common in early-stage architectures.
        Practitioners: May defer detailed performance engineering to implementation phase.
      weakens_finding: true
      explanation: |
        In enterprise architecture practice, high-level SLAs without budgets are common.
        Document may be intentionally high-level (architecture, not performance engineering).
        Weakens severity (CRITICAL → IMPORTANT "missing detail" vs CRITICAL "fundamental flaw").

    prompt_4_survivorship_bias:
      question: "Am I focusing on this because I found it first? What would I conclude if I'd read in different order?"
      answer: |
        Bias check: V-001 found in Phase 1 by method #71, confirmed by #17, #85, #78.
        Reading order: If read Section 7 (Operational Model) first, might see monitoring P95 mentioned.
        Alternative: Performance is mentioned but not detailed → consistent with architecture scope.
      weakens_finding: false
      explanation: |
        No survivorship bias - finding confirmed by 4 methods independently.
        Reading order doesn't change conclusion: P95 target exists but has no budget/evidence.

    adversarial_result:
      prompts_weakened: 3  # Prompts 1, 2, 3 weaken
      decision: "DOWNGRADE"
      old_severity: "CRITICAL"
      new_severity: "IMPORTANT"
      rationale: |
        3/4 prompts weakened finding:
        - Prompt 1: "Submission" could mean async enqueue (more achievable)
        - Prompt 2: Could be in external performance report (documentation gap)
        - Prompt 3: High-level SLAs without budgets are common in architecture phase

        Downgrading CRITICAL → IMPORTANT:
