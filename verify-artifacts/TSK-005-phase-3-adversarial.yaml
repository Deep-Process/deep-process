# SECTION 3.3: FALSE POSITIVE CHECKLIST
# TRIGGER: Current direction is REJECT → Complete checklist
# ═══════════════════════════════════════════════════════════════

false_positive_checklist:
  trigger: "REJECT direction (findings suggest architecture has issues)"
  required: true

  question_1:
    question: "Did I search for disconfirming evidence with same rigor as confirming?"
    answer: |
      YES. Adversarial prompts (Section 3.1) specifically sought alternative explanations.
      Counter-checks in Phase 2 attempted to refute findings.
      Steel-man (Section 3.2) constructed best case for ACCEPT.

      Rigor applied:
      - 4 prompts × 9 findings = 36 adversarial tests
      - 10 counter-checks in Phase 2 (100% survival initially)
      - 5 findings downgraded after adversarial review

      Result: Balanced search for confirming AND disconfirming evidence.

  question_2:
    question: "Could a domain expert reasonably disagree with my interpretation?"
    answer: |
      YES for some findings, NO for others.

      Reasonable disagreement possible:
      - V-001 (Performance): Expert might say "latency budget is implementation detail"
      - V-003 (Reliability): Expert might say "AWS handles details"
      - V-005-V-009 (Terminology): Expert might say "context disambiguates"

      Unreasonable to disagree:
      - V-002 (Risk mitigation 30%→10%): Quantitative claim requires evidence
      - V-004 (SUPERUSER): Critical security assumption must be stated
      - V-008 (Anomaly detection 25%→60%): Same as V-002

      Result: Some findings are judgment calls, but CRITICAL findings are solid.

  question_3:
    question: "Is my finding based on what artifact SAYS vs what it IMPLIES?"
    answer: |
      Findings are based on what artifact SAYS (or DOESN'T say).

      Examples:
      - V-002: Artifact SAYS "30% → 10%" (not implied)
      - V-004: Artifact DOESN'T say "avoid SUPERUSER" (absence, not implication)
      - V-006: Artifact SAYS "MCP" without expansion (not implied meaning)

      No findings based on IMPLIED meanings.
      Result: Findings grounded in explicit text (or explicit absence).

  question_4:
    question: "Did I give artifact benefit of doubt on ambiguous language?"
    answer: |
      YES. Adversarial review gave benefit of doubt:
      - V-001: Considered "submission" could mean async enqueue
      - V-003: Considered reliance on AWS managed services
      - V-005: Considered context disambiguates homonyms
      - V-009: Considered "kernel" could mean database kernel

      Result: Benefit of doubt applied, leading to 5 downgrades.

  question_5:
    question: "Would original author recognize my characterization as fair?"
    answer: |
      MOSTLY YES with caveats.

      Author would likely AGREE:
      - "Architecture is high-level" → TRUE (steel-man argument 1)
      - "Missing implementation details" → TRUE (latency budget, RLS policies)
      - "Relies on AWS services" → TRUE (steel-man argument 3)

      Author might DISAGREE:
      - "30%→10% is fictional" → Might say "it's an estimate"
      - "SUPERUSER is critical assumption" → Might say "best practices assumed"

      Result: Characterizations are strong but defensible.
      Terminology like "fictional" is accurate for unsupported quantitative claims.

  question_6:
    question: "Am I conflating 'not proven' with 'disproven'?"
    answer: |
      NO. Findings say "not proven" (ungrounded), not "disproven" (wrong).

      Examples:
      - V-001: "Performance guarantee UNGROUNDED" (not "performance is bad")
      - V-002: "Risk reduction UNSUBSTANTIATED" (not "RLS doesn't work")
      - V-003: "Reliability PARTIALLY grounded" (not "system is unreliable")

      Findings are about EVIDENCE, not TRUTH.
      Result: Clear distinction maintained.

  checklist_summary:
    any_doubts_raised: false
    re_examination_needed: false
    conclusion: |
      False positive checklist did NOT raise concerns.
      All 6 questions answered affirmatively or with reasonable explanation.

      Findings are:
      - Based on explicit text (not implications)
      - Given benefit of doubt (5 downgrades)
      - Fairly characterized
      - About evidence (not truth claims)
      - Searched with balanced rigor

      Verdict: Findings are VALID, not false positives.

