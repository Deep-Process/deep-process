      MEDIUM: 16

  findings_count: 4

  critical_cross_mechanism_assumption:
    assumption: "Application does NOT use SUPERUSER credentials"
    appears_in:
      - "mechanism_2 (risk mitigation) - A6"
      - "mechanism_4 (security) - A4"
    impact_if_wrong: "CATASTROPHIC"
    description: |
      This SINGLE assumption invalidates BOTH:
      1. Risk mitigation effectiveness (30%→10% reduction becomes 0%)
