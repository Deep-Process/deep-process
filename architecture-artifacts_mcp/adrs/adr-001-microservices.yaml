---
id: "ADR-001"
title: "Adopt Microservices Architecture for Process Platform"
date: "2026-02-15"
status: "accepted"
deciders: ["Architecture Team", "Platform Lead"]

context: |
  The Deep-* Process Platform must deliver 13 independent processes (deep-explore, deep-compliance, deep-risk, etc.)
  to enterprise customers via cloud and on-premise deployments. Key requirements:
  - Independent scaling: Long-running processes (deep-architect: 10-15 hours) vs short processes (deep-diagram: 1-2 hours)
  - Hybrid deployment: Compliance processes (deep-compliance, deep-governance) need on-prem deployment for HIPAA customers,
    while analytics processes can run in cloud
  - Cross-functional teams: Platform core (5), Process integration (4), Observability (3), Security (3) per Conway's Law
  - Technology diversity: Some processes may benefit from different languages/runtimes
  - Brownfield constraint: Existing workflow.md processes must be integrated without modification

decision: |
  Adopt microservices architecture with 23 components organized into 3 tiers:
  - Tier 1 (API/Orchestration): API Gateway, Process Orchestrator, Job Queue
  - Tier 2 (Process Services): 5 prioritized process services (deep-explore, deep-compliance, deep-risk, deep-architect,
    deep-governance) + 1 common pool for remaining 8 processes
  - Tier 3 (Infrastructure): IAM, Artifact Storage, Process Repository, LLM Integration, Observability, Integration Adapters

  Each process service is independently deployable, scalable, and can be deployed to different environments
  (compliance on-prem, analytics cloud).

rationale: |
  1. **Independent Scaling**: Microservices allow horizontal scaling of individual processes. deep-compliance can scale
     to 50 replicas during audit season while deep-diagram remains at 2 replicas.

  2. **Hybrid Deployment**: Compliance processes can be deployed to customer on-prem K8s clusters while other processes
     run in AWS/Azure. Monolith would require deploying entire platform on-prem.

  3. **Team Autonomy**: 4 teams can work independently on their bounded contexts (API, Orchestration, Processes, Observability)
     without merge conflicts or release coupling.

  4. **Fault Isolation**: Failure in deep-risk service doesn't bring down deep-compliance. Circuit breakers prevent cascades.

  5. **Technology Flexibility**: Can use Go for high-performance orchestrator, Python for LLM-heavy process services.

alternatives_considered:
  - option: "Modular Monolith"
    pros:
      - "Simpler deployment (single binary)"
      - "No distributed tracing needed"
      - "Strong consistency via shared database transactions"
    cons:
      - "Cannot independently scale processes"
      - "Cannot deploy compliance module on-prem while keeping analytics in cloud (hybrid deployment impossible)"
      - "Release coupling: all processes must deploy together"
      - "Single failure domain: OOM in one process crashes entire platform"
    rejected_because: |
      Hybrid deployment requirement is blocker. HIPAA customers demand on-prem compliance processes, but cloud analytics
      for cost efficiency. Monolith cannot satisfy this requirement.

  - option: "Serverless (Pure Lambda/Functions)"
    pros:
      - "No infrastructure management"
      - "Infinite horizontal scaling"
      - "Pay-per-invocation cost model"
    cons:
      - "15-minute Lambda timeout, processes run 2-24 hours (exceeds limit)"
      - "Complex state management for long-running workflows"
      - "Cold start latency (100ms-3s) unacceptable for interactive use"
      - "Step Functions State Language too limited for complex workflow.md interpretation"
    rejected_because: |
      Lambda 15-minute timeout is hard blocker for long-running processes. Step Functions can run 1 year, but DSL is
      too restrictive for dynamic workflow.md execution logic (gate enforcement, counter-checks, adversarial operations).

  - option: "Cell-Based Architecture"
    pros:
      - "Blast radius containment (failure in one cell doesn't affect others)"
      - "Multi-region deployment with cell isolation"
      - "Scalability to 100s of services"
    cons:
      - "Over-engineered for 13-23 components"
      - "Complex cell boundary management and cross-cell communication"
      - "MVP doesn't need multi-region (single region sufficient)"
    rejected_because: |
      Cell-based is designed for >50 services with multi-region requirements. Platform has 23 components in single region
      (MVP). Standard microservices with K8s namespaces provides sufficient isolation without cell complexity.

consequences:
  positive:
    - "Independent deployment: Each process service can release without coordinating with others"
    - "Independent scaling: Auto-scale executor pool 0-100 based on queue depth"
    - "Hybrid deployment: Compliance services on-prem, analytics in cloud"
    - "Fault isolation: Circuit breakers prevent cascading failures"
    - "Team autonomy: 4 teams work independently on bounded contexts"
    - "Technology flexibility: Can choose best language/runtime per service (Go for performance, Python for LLM integration)"

  negative:
    - "Distributed complexity: Need distributed tracing (Jaeger), centralized logging (CloudWatch), service mesh (Istio optional)"
    - "Network latency: Inter-service calls add 10-50ms overhead vs in-process function calls"
    - "Eventual consistency: Job status updates propagate via events, not immediate"
    - "Operational overhead: 23 deployments to manage vs 1 monolith (mitigated by K8s automation)"
    - "Higher initial cost: Need API Gateway, queue infrastructure, observability stack vs single EC2 instance for monolith"

risks:
  - risk: "Distributed debugging is harder than monolith debugging"
    mitigation: "Implement comprehensive distributed tracing (Jaeger), correlation IDs, structured logging"

  - risk: "Data consistency challenges across services"
    mitigation: "Use Saga pattern for multi-service workflows, event sourcing for audit trails"

  - risk: "Network failures between services cause transient errors"
    mitigation: "Circuit breakers, retries with exponential backoff, DLQ for failed messages"

compliance_notes: |
  - SOC 2: Microservices enable principle of least privilege (service-to-service auth, mTLS). Each service has minimal permissions.
  - HIPAA: Compliance services can be deployed in isolated on-prem environment with separate database (PHI isolation).
  - GDPR: Data residency requirements met by deploying services to EU regions (AWS eu-west-1, Azure West Europe).

related_adrs:
  - "ADR-002: Event-Driven Architecture for Async Communication"
  - "ADR-003: Multi-Tenant Schema-Per-Tenant Isolation"
  - "ADR-006: Kubernetes as Container Orchestration Platform"
