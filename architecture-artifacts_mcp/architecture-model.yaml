assumptions:
  - id: "A-201"
    assumption: "Mermaid diagram syntax is sufficient for all architecture views (C4, ER, sequence, state, flow)"
    confidence: 0.90
    falsification: "Attempt to render all 9 diagrams in Mermaid Live Editor or mermaid-cli. If any diagram type is unsupported or renders incorrectly, assumption is false."
    impact_if_wrong: "Need alternative diagramming tools (PlantUML, Structurizr DSL, draw.io). Migration effort 2-4 hours."

  - id: "A-202"
    assumption: "Kubernetes deployment is appropriate for all process services (not just compliance-heavy ones)"
    confidence: 0.75
    falsification: "Deploy light processes (deep-diagram, deep-document) to K8s. Monitor resource utilization. If <5% CPU/memory utilization and serverless would be cheaper, assumption is weakened."
    impact_if_wrong: "Hybrid architecture: K8s for heavy processes, serverless (Lambda/Functions) for light processes. Added deployment complexity."

  - id: "A-203"
    assumption: "PostgreSQL can handle 100+ tenant schemas without performance degradation"
    confidence: 0.80
    falsification: "Load test: Create 100 schemas, run concurrent queries across all schemas. Measure P95 latency. If P95 >500ms or connection pool exhaustion, assumption is false."
    impact_if_wrong: "Shard to multiple PostgreSQL instances (10-20 tenants per instance) or migrate to separate-database-per-tenant model. Cost increases 10-50x."

