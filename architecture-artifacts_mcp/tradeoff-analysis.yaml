metadata:
  version: "1.2.0"
  timestamp: "2026-02-15T23:00:00Z"
  depth_level: "comprehensive"
  process_version: "deep-architect-1.4.1"
  phase: "Phase 4: Trade-Off Analysis"

assumptions:
  - id: "A-401"
    assumption: "Quality attribute priorities (Reliability > Security > Performance) are correctly inferred from enterprise SaaS context and will remain stable"
    confidence: 0.80
    falsification: "Conduct stakeholder interviews (5 enterprise customers, 3 internal product managers). If >50% prioritize Performance over Security, assumption is false."
    impact_if_wrong: "Trade-off decisions (accepting 15ms overhead for security, $450/month for reliability) may be incorrect. Need to re-evaluate architectural strategies."

  - id: "A-402"
    assumption: "Cost estimates for CBAM analysis are accurate within ±30% (e.g., Multi-AZ RDS $900/month vs $450 single-AZ)"
    confidence: 0.70
    falsification: "Deploy production infrastructure, measure actual costs for 3 months. If actual costs differ by >30%, assumption is weakened."
    impact_if_wrong: "ROI calculations for architectural strategies incorrect. May choose sub-optimal strategy (e.g., over-invest in reliability, under-invest in performance)."

  - id: "A-403"
    assumption: "Evolution from MVP (10 customers) to Scale (300 customers) follows linear growth model over 12 months"
    confidence: 0.65
    falsification: "Track actual customer growth monthly. If growth is exponential (100 customers by Month 6) or stagnant (<50 by Month 12), assumption is false."
    impact_if_wrong: "Scaling strategy timing wrong. Exponential growth requires earlier infrastructure investment (Month 3 vs Month 6). Stagnant growth means over-provisioning waste."

# ══════════════════════════════════════════════
# ATAM: QUALITY ATTRIBUTE TREE
# ══════════════════════════════════════════════

quality_attribute_tree:
  - attribute: "Reliability"
    priority: 1
    refinements:
      - sub_attribute: "Availability"
        target: "99.9% uptime SLA"
        scenarios: ["SA-001", "SA-002"]
      - sub_attribute: "Fault Tolerance"
        target: "Single component failure does not cause total system failure"
        scenarios: ["SA-003"]
      - sub_attribute: "Recoverability"
        target: "RTO <5 minutes for most failures, RPO <1 minute"
        scenarios: ["SA-004"]

  - attribute: "Security"
    priority: 2
    refinements:
      - sub_attribute: "Confidentiality"
        target: "Multi-tenant data isolation, encryption at rest and in transit"
        scenarios: ["SA-005", "SA-006"]
      - sub_attribute: "Authentication & Authorization"
        target: "Zero-trust, service-to-service auth, SSO integration"
        scenarios: ["SA-007"]
      - sub_attribute: "Compliance"
        target: "SOC 2 Type II, GDPR, HIPAA compliant"
        scenarios: ["SA-008"]

  - attribute: "Performance"
    priority: 3
    refinements:
      - sub_attribute: "Latency"
        target: "Job submission API P95 <500ms, artifact retrieval P95 <200ms"
        scenarios: ["SA-009"]
      - sub_attribute: "Throughput"
        target: "100 concurrent long-running jobs without degradation"
        scenarios: ["SA-010"]

  - attribute: "Scalability"
    priority: 4
    refinements:
      - sub_attribute: "Horizontal Scalability"
        target: "Auto-scale executor pool 0-100 replicas based on queue depth"
        scenarios: ["SA-011"]
      - sub_attribute: "Data Scalability"
        target: "Handle 300 tenants, 10TB artifact storage"
        scenarios: ["SA-012"]

  - attribute: "Maintainability"
    priority: 5
    refinements:
      - sub_attribute: "Deployability"
        target: "Zero-downtime deployment, <5 minute rollback"
        scenarios: ["SA-013"]
      - sub_attribute: "Extensibility"
        target: "Onboard new process in <1 day"
        scenarios: ["SA-014"]

# ══════════════════════════════════════════════
# ATAM: SCENARIOS
# ══════════════════════════════════════════════

atam_scenarios:
  # USE CASE SCENARIOS
  - id: "SA-001"
    type: "use_case"
    stimulus: "Database primary instance fails (hardware crash)"
    source: "Infrastructure (AWS RDS)"
    environment: "Normal operation, 50 concurrent jobs running"
    artifact: "C-015 (PostgreSQL Database)"
    response: "Automatic failover to standby instance in different AZ"
    response_measure: "Failover completes in <90 seconds, <5% of in-flight queries fail, all completed successfully after retry"
    attribute: "Reliability"
    priority: "critical"
    current_architecture_support: "Multi-AZ RDS with automatic failover. Executor implements retry logic with exponential backoff."

  - id: "SA-002"
    type: "use_case"
    stimulus: "API Gateway pod crashes during deployment"
    source: "Deployment process (K8s rolling update)"
    environment: "Production, 20 requests/sec load"
    artifact: "C-001 (API Gateway)"
    response: "Traffic routed to healthy pods, no user-visible errors"
    response_measure: "0% request failures, no increase in P95 latency"
    attribute: "Reliability"
    priority: "high"
    current_architecture_support: "K8s rolling update with maxUnavailable=25%, PodDisruptionBudget min 2 pods, health checks block bad deployments."

  - id: "SA-003"
    type: "use_case"
    stimulus: "LLM API (Anthropic) returns 429 rate limit errors for 10 minutes"
    source: "External dependency (C-021 Anthropic API)"
    environment: "Peak usage, 80 concurrent jobs executing"
    artifact: "C-014 (LLM Integration Service)"
    response: "Circuit breaker opens, failover to OpenAI API, jobs continue"
    response_measure: "<10% of jobs delayed >5 minutes, 0% permanent failures"
    attribute: "Reliability"
    priority: "critical"
    current_architecture_support: "Circuit breaker (resilience4j) with 60s cooldown. Multi-provider failover (Anthropic → OpenAI). Exponential backoff retry."

  - id: "SA-004"
    type: "use_case"
    stimulus: "Process Executor pod killed by OOM during deep-risk comprehensive run (8 hours in)"
    source: "Infrastructure (K8s OOMKilled)"
    environment: "Normal operation, large input dataset"
    artifact: "C-004 (Process Executor Pool)"
    response: "Job resumes from last checkpoint (phase completion), not full restart"
    response_measure: "<5 minutes recovery time, resume from last completed phase (lose <1 hour of work)"
    attribute: "Reliability"
    priority: "high"
    current_architecture_support: "Checkpoint/resume mechanism stores state to PostgreSQL after each phase. Job status in DB, not pod memory."

  - id: "SA-005"
    type: "use_case"
    stimulus: "Attacker attempts SQL injection via job submission API to access other tenants' data"
    source: "External attacker"
    environment: "Production, multi-tenant database"
    artifact: "C-015 (PostgreSQL Database)"
    response: "Attack blocked by parameterized queries, RLS prevents cross-tenant access even if SQL injection succeeds"
    response_measure: "0 successful cross-tenant data access attempts, attack logged in audit trail"
    attribute: "Security"
    priority: "critical"
    current_architecture_support: "ORM with parameterized queries (mandatory, no raw SQL). Database row-level security (RLS) enforces tenant_id filtering. SAST in CI/CD blocks SQL injection patterns."

  - id: "SA-006"
    type: "use_case"
    stimulus: "Insider threat: rogue employee with database read access attempts to extract customer PII"
    source: "Internal user (employee)"
    environment: "Production database access via read replica"
    artifact: "C-015 (PostgreSQL Database)"
    response: "Data encrypted at rest, access logged to immutable audit trail, anomaly detection alerts on unusual queries"
    response_measure: "PII exposure detected within 5 minutes, access revoked, audit trail provides evidence for incident response"
    attribute: "Security"
    priority: "high"
    current_architecture_support: "RDS encryption (AES-256), audit logging to immutable table, anomaly detection monitors cross-tenant queries."

  - id: "SA-007"
    type: "use_case"
    stimulus: "Enterprise user accesses platform via SSO (Okta)"
    source: "External user (EA-001 Enterprise Developer)"
    environment: "Normal operation, authentication flow"
    artifact: "C-010 (IAM Service)"
    response: "SSO authentication, JWT issued with tenant_id scope, user authorized for requested resources"
    response_measure: "Authentication completes in <2 seconds, JWT valid for 1 hour, refresh token valid for 30 days"
    attribute: "Security"
    priority: "high"
    current_architecture_support: "SAML/OIDC integration with Okta, Azure AD. JWT with tenant_id claim. Token validation cached (1ms overhead)."

  - id: "SA-008"
    type: "use_case"
    stimulus: "SOC 2 auditor requests evidence of access control changes"
    source: "External auditor"
    environment: "Audit preparation, 6-month audit period"
    artifact: "C-010 (IAM Service)"
    response: "Immutable audit log provides complete history of role changes, approvals, timestamps"
    response_measure: "Auditor satisfied, no gaps in audit trail, 100% of role changes logged"
    attribute: "Security"
    priority: "critical"
    current_architecture_support: "Immutable audit log (INSERT-only table), 7-year retention, EventBridge archive provides independent verification."

  - id: "SA-009"
    type: "use_case"
    stimulus: "User submits 10 jobs in rapid succession via API"
    source: "External user (EA-001)"
    environment: "Normal operation, low system load"
    artifact: "C-001 (API Gateway)"
    response: "All 10 job submissions processed, jobs queued for execution"
    response_measure: "P95 latency <500ms per submission (including auth, validation, queue enqueue)"
    attribute: "Performance"
    priority: "high"
    current_architecture_support: "Async job submission (202 Accepted immediately), gRPC for low-latency service-to-service, JWT validation cached."

  - id: "SA-010"
    type: "use_case"
    stimulus: "100 concurrent jobs execute during peak usage (audit season)"
    source: "Multiple users (50 tenants × 2 jobs each)"
    environment: "Peak load, all executor pods busy"
    artifact: "C-004 (Process Executor Pool)"
    response: "All jobs execute concurrently without resource starvation, completion times within normal range"
    response_measure: "P95 job execution time <10% slower than single-job baseline, 0% OOM failures"
    attribute: "Performance"
    priority: "critical"
    current_architecture_support: "Horizontal Pod Autoscaler scales executor pool 0-100 replicas based on queue depth. Resource limits prevent noisy neighbor."

  # GROWTH SCENARIOS
  - id: "SA-011"
    type: "growth"
    stimulus: "Customer base grows from 10 (MVP) to 300 customers over 12 months"
    source: "Business growth"
    environment: "Production scaling"
    artifact: "C-004 (Process Executor Pool), C-015 (PostgreSQL)"
    response: "System auto-scales horizontally, no manual intervention required"
    response_measure: "Executor pool scales from 5 to 100 pods, database read replicas added (3 replicas), P95 latency remains <500ms"
    attribute: "Scalability"
    priority: "critical"
    current_architecture_support: "HPA + Cluster Autoscaler for executor. Read replicas for database scaling. Connection pooling (PgBouncer)."

  - id: "SA-012"
    type: "growth"
    stimulus: "Artifact storage grows from 100GB (MVP) to 10TB over 12 months"
    source: "Data growth (jobs generate YAML artifacts, diagrams, PDFs)"
    environment: "Production storage"
    artifact: "C-012 (S3 Object Storage)"
    response: "Storage scales seamlessly, old artifacts migrate to cheaper tiers"
    response_measure: "Cost per GB decreases from $0.023 (S3 Standard) to $0.004 (S3 IA) for artifacts >30 days old, 99.999999999% durability maintained"
    attribute: "Scalability"
    priority: "medium"
    current_architecture_support: "S3 lifecycle policies auto-migrate Standard → IA → Glacier. Infinite scalability, no manual provisioning."

  # EXPLORATORY SCENARIOS
  - id: "SA-013"
    type: "exploratory"
    stimulus: "Critical security patch requires immediate deployment to production"
    source: "Security team"
    environment: "Production, 30 concurrent jobs running"
    artifact: "C-004 (Process Executor Pool)"
    response: "Rolling update deploys patch without interrupting running jobs, bad deployment rolls back automatically"
    response_measure: "0% job failures, rollback completes in <5 minutes if deployment fails health checks"
    attribute: "Maintainability"
    priority: "high"
    current_architecture_support: "K8s rolling update with health checks. Checkpoint/resume ensures jobs survive pod restarts. Helm rollback command for instant rollback."

  - id: "SA-014"
    type: "exploratory"
    stimulus: "New process (deep-strategy) needs to be added to platform"
    source: "Product team"
    environment: "Development, onboarding new process"
    artifact: "C-013 (Process Definition Repository), C-009 (Common Process Services)"
    response: "Upload workflow.md and schemas to repository, executor dynamically loads definition"
    response_measure: "New process onboarded in <1 day (6-8 hours), no executor code changes required"
    attribute: "Maintainability"
    priority: "medium"
    current_architecture_support: "Process Definition Repository stores workflow.md. Executor is generic, interprets any workflow.md. Hot-reloading of process definitions."

# ══════════════════════════════════════════════
# ATAM: SENSITIVITY POINTS
# ══════════════════════════════════════════════

sensitivity_points:
  - id: "SP-001"
    component: "C-015 (PostgreSQL Database)"
    attribute: "Performance"
    description: "Database connection pool size significantly affects throughput"
    impact: "Increasing PgBouncer pool from 100 → 200 connections doubles job submission throughput (500 → 1000 jobs/hour) but increases RDS memory usage 50% and cost 30%"
    current_setting: "100 connections (PgBouncer)"
    sensitivity: "high"
    recommendation: "Monitor connection pool utilization. If >80% sustained, increase to 150 connections (sweet spot per cost/benefit analysis)."

  - id: "SP-002"
    component: "C-014 (LLM Integration Service)"
    attribute: "Cost"
    description: "LLM provider choice (Anthropic vs OpenAI) has 2-3× cost difference for equivalent quality"
    impact: "Switching from Anthropic Claude Sonnet ($3/MTok) to OpenAI GPT-4 Turbo ($10/MTok) increases cost 3.3× but provides 20% faster completion (net impact: higher cost, better latency)"
    current_setting: "Anthropic Claude Sonnet 4.5 (primary)"
    sensitivity: "critical"
    recommendation: "Use Claude for quality-sensitive processes (deep-compliance, deep-risk), GPT for speed-sensitive (deep-diagram). Hybrid approach saves 40% cost vs GPT-only."

  - id: "SP-003"
    component: "C-004 (Process Executor Pool)"
    attribute: "Reliability"
    description: "Checkpoint frequency vs performance trade-off"
    impact: "Checkpointing every phase (8-10 checkpoints per job) ensures <1 hour work loss on failure but adds 2-5% overhead (PostgreSQL writes). Checkpointing every 2 phases reduces overhead to <1% but risks 2 hour work loss."
    current_setting: "Checkpoint every phase"
    sensitivity: "medium"
    recommendation: "Keep per-phase checkpointing for long processes (deep-architect, deep-risk comprehensive). Use every-2-phases for short processes (<2 hours) to reduce overhead."

  - id: "SP-004"
    component: "C-001 (API Gateway)"
    attribute: "Security vs Performance"
    description: "JWT validation strategy (validate every request vs cache for 1 minute)"
    impact: "Validating every JWT adds 5-10ms latency (cryptographic signature check). Caching for 1 minute reduces latency to <1ms but creates 1-minute window for revoked tokens to remain valid."
    current_setting: "Cache for 1 minute"
    sensitivity: "high"
    recommendation: "Accept 1-minute revocation delay for 10× latency improvement. For critical operations (role changes, admin actions), bypass cache and validate in real-time."

# ══════════════════════════════════════════════
# ATAM: TRADE-OFF POINTS
# ══════════════════════════════════════════════

tradeoff_points:
  - id: "TP-001"
    attribute_a: "Security"
    attribute_b: "Performance"
    component: "C-015 (PostgreSQL Database)"
    description: "Row-Level Security (RLS) adds query overhead but provides defense-in-depth for multi-tenant isolation"
    current_position: "RLS enabled on all tenant tables, adds ~5ms per query"
    rationale: "Accept 5ms overhead (1% of 500ms P95 budget) for critical security layer. RLS prevents SQL injection bypass from leaking cross-tenant data."
    alternatives:
      - position: "Disable RLS, rely only on application-layer WHERE tenant_id filtering"
        pros: ["5ms faster queries", "Simpler query plans", "Lower database CPU"]
        cons: ["Catastrophic if SQL injection bypasses app layer", "No defense-in-depth", "SOC 2 auditor concern"]
        cost_benefit: "5ms saved vs $100M+ breach risk (VR-001). Not justified."
      - position: "RLS + query optimization (indexes on tenant_id, composite indexes)"
        pros: ["Maintains security", "Reduces RLS overhead from 5ms to 2ms via indexes"]
        cons: ["Index maintenance overhead", "Slightly larger database size"]
        cost_benefit: "Best of both worlds. Implement composite indexes (tenant_id, created_at)."
    decision: "Keep RLS enabled, add composite indexes to reduce overhead to 2ms"

  - id: "TP-002"
    attribute_a: "Reliability"
    attribute_b: "Cost"
    component: "C-015 (PostgreSQL Database)"
    description: "Multi-AZ RDS costs 2× single-AZ but provides 99.9% vs 99.5% uptime"
    current_position: "Multi-AZ enabled, $900/month vs $450 single-AZ"
    rationale: "Enterprise SaaS requires 99.9% SLA. 99.5% = 3.6 hours/month downtime (unacceptable). $450/month reliability premium justified."
    alternatives:
      - position: "Single-AZ with snapshot backups"
        pros: ["Save $450/month ($5400/year)", "Simpler configuration"]
        cons: ["99.5% uptime (3.6h/month downtime)", "1-2 hour RTO on AZ failure", "Loses enterprise customers"]
        cost_benefit: "$5400/year saved vs $50K-$500K lost revenue from churned enterprise customers. Not justified."
      - position: "Aurora Serverless v2 (auto-scaling, Multi-AZ)"
        pros: ["Pay for actual usage", "Auto-scales to 0 during idle", "Multi-AZ included"]
        cons: ["Cold start 10-30s", "More complex cost model", "Less predictable billing"]
        cost_benefit: "Potential 30-50% cost savings for variable workloads. Revisit at scale (300+ customers)."
    decision: "Accept Multi-AZ premium for MVP. Re-evaluate Aurora Serverless v2 at 100+ customers when cost optimization becomes priority."

  - id: "TP-003"
    attribute_a: "Scalability"
    attribute_b: "Maintainability"
    component: "Architecture-wide (Microservices vs Monolith)"
    description: "Microservices enable independent scaling but increase operational complexity (23 deployments vs 1)"
    current_position: "Microservices with 23 components, managed via K8s + Helm"
    rationale: "Hybrid deployment requirement (compliance on-prem, analytics cloud) is blocker for monolith. Accept operational overhead."
    alternatives:
      - position: "Modular monolith"
        pros: ["1 deployment", "Simpler debugging (no distributed tracing)", "Lower infrastructure cost"]
        cons: ["Cannot deploy compliance on-prem while keeping analytics in cloud", "Single scaling unit (cannot scale processes independently)", "Release coupling"]
        cost_benefit: "Hybrid deployment is hard requirement (HIPAA customers). Monolith eliminates core value proposition."
      - position: "Hybrid: Monolith for MVP, migrate to microservices later"
        pros: ["Faster MVP (simpler architecture)", "Defer complexity until proven need"]
        cons: ["Major rewrite required for migration", "Downtime during migration", "Technical debt accumulates"]
        cost_benefit: "Migration cost estimated $500K-$1M (6-12 months eng time). Starting with microservices avoids this."
    decision: "Microservices from day one. Hybrid deployment is core requirement, monolith eliminates differentiator."

  - id: "TP-004"
    attribute_a: "Performance"
    attribute_b: "Cost"
    component: "C-014 (LLM Integration Service)"
    description: "Choosing faster LLM (GPT-4 Turbo) costs 3× more than Claude Sonnet but reduces job completion time 20%"
    current_position: "Claude Sonnet primary (cost-optimized), GPT-4 Turbo for latency-sensitive workloads"
    rationale: "Hybrid approach: 80% jobs use Claude (quality + cost), 20% use GPT (speed). Saves 40% vs GPT-only, maintains acceptable latency."
    alternatives:
      - position: "GPT-4 Turbo only (optimize for speed)"
        pros: ["20% faster completion", "Simpler (single provider)", "Lower latency variance"]
        cons: ["3× higher cost ($30K/month vs $10K)", "Single point of failure (no multi-provider resilience)"]
        cost_benefit: "20% faster vs $240K/year extra cost. Not justified for MVP (customers prioritize cost over 20% speed)."
      - position: "Claude Sonnet only (optimize for cost)"
        pros: ["Lowest cost ($10K/month)", "Best quality per dollar", "Simpler integration"]
        cons: ["No failover (single provider)", "Slower than GPT", "Rate limit risk (BN-002)"]
        cost_benefit: "Cost-optimal but single point of failure. Risk: Anthropic outage stops all jobs."
    decision: "Hybrid: Claude primary (80%), GPT failover + speed tier (20%). Best cost/performance/resilience balance."

# ══════════════════════════════════════════════
# CBAM: COST-BENEFIT ANALYSIS
# ══════════════════════════════════════════════

cbam_strategies:
  - id: "CBAM-001"
    strategy: "Multi-AZ RDS for Database High Availability"
    quality_attributes_affected: ["Reliability", "Cost"]
    costs:
      development: "0 hours (managed AWS service, no custom dev)"
      operational: "$450/month premium vs single-AZ ($900 vs $450)"
      risk: "Slightly more complex failover testing"
    benefits:
      - attribute: "Reliability"
        improvement: "99.5% → 99.9% uptime (3.6h/month → 43min/month downtime)"
        quantified: "2.75 hours/month downtime reduction = 33 hours/year saved"
        confidence: 0.95
      - attribute: "Customer Satisfaction"
        improvement: "Enterprise customers require 99.9% SLA for regulatory compliance platforms"
        quantified: "Blocks $50K-$500K enterprise deals without 99.9% SLA"
        confidence: 0.85
    roi_assessment: |
      Cost: $5,400/year
      Benefit: Prevent churn of 1 enterprise customer ($50K ACV) = $50K saved
      ROI: ($50K - $5.4K) / $5.4K = 826% ROI
      Payback period: <1 month (first enterprise deal)
      DECISION: HIGH ROI, IMPLEMENT
    rank: 1

  - id: "CBAM-002"
    strategy: "Kubernetes Cluster Autoscaling for Executor Pool"
    quality_attributes_affected: ["Scalability", "Cost"]
    costs:
      development: "40 hours (HPA + Cluster Autoscaler config, testing)"
      operational: "Variable: $500/month at MVP (5 nodes) → $5K/month at scale (50 nodes), but pay-as-you-grow"
      risk: "Scaling lag (2-5 min to provision new nodes) may delay job execution"
    benefits:
      - attribute: "Scalability"
        improvement: "Handle 10 → 400 concurrent jobs without manual intervention"
        quantified: "Supports 30× customer growth (10 → 300 customers) without ops team scaling"
        confidence: 0.90
      - attribute: "Cost Efficiency"
        improvement: "Auto-scale to 0 during off-hours (nights, weekends), save 60% vs fixed capacity"
        quantified: "$3K/month saved at scale vs always-on 50-node cluster ($5K variable vs $8K fixed)"
        confidence: 0.75
    roi_assessment: |
      Cost: $10K development (40h × $250/h) + $5K/month operational at scale
      Benefit: $3K/month saved (vs fixed capacity) + avoid $100K manual scaling ops burden
      ROI: Scale-dependent. Positive at >50 customers.
      Payback period: 6-9 months
      DECISION: MEDIUM ROI, IMPLEMENT (enables growth)
    rank: 2

  - id: "CBAM-003"
    strategy: "Circuit Breaker for LLM API Resilience"
    quality_attributes_affected: ["Reliability", "Performance"]
    costs:
      development: "60 hours (resilience4j integration, testing failover, monitoring)"
      operational: "Minimal: Anthropic + OpenAI API costs same whether circuit breaker exists or not"
      risk: "Circuit breaker false positives may fail over prematurely (rare with 5-failure threshold)"
    benefits:
      - attribute: "Reliability"
        improvement: "LLM API outage (occurs ~1-2× per year) fails over in 60s vs 15+ min manual intervention"
        quantified: "15 min downtime → 1 min (14 min saved × 2 outages/year = 28 min/year)"
        confidence: 0.80
      - attribute: "User Experience"
        improvement: "Jobs continue during LLM provider outage vs failing completely"
        quantified: "Prevents 100% job failure during outage. Estimated 50-100 jobs saved per outage event."
        confidence: 0.85
    roi_assessment: |
      Cost: $15K development (60h × $250/h)
      Benefit: Prevent $10K-$50K customer churn per outage incident (customers expect resilience)
      ROI: ($30K - $15K) / $15K = 100% ROI (conservative estimate, 2 outages/year)
      Payback period: 6 months (first outage)
      DECISION: HIGH ROI, IMPLEMENT
    rank: 3

  - id: "CBAM-004"
    strategy: "Schema-Per-Tenant Multi-Tenancy vs Separate-Database-Per-Tenant"
    quality_attributes_affected: ["Security", "Cost", "Scalability"]
    costs:
      schema_per_tenant:
        development: "80 hours (RLS policies, schema migration scripts, testing)"
        operational: "$900/month for single PostgreSQL instance (all tenants)"
      separate_database:
        development: "120 hours (database provisioning automation, connection management)"
        operational: "$600/month × 300 tenants = $180K/month at scale"
    benefits:
      schema_per_tenant:
        - attribute: "Cost Efficiency"
          improvement: "Single database vs 300 databases"
          quantified: "$900/month vs $180K/month at 300 tenants = $179K saved"
          confidence: 0.90
        - attribute: "Security"
          improvement: "Strong isolation via RLS, but shared database (SQL injection risk exists)"
          quantified: "RLS provides 95% isolation confidence vs 99.9% for separate DBs"
          confidence: 0.70
      separate_database:
        - attribute: "Security"
          improvement: "Perfect tenant isolation (physically separate databases)"
          quantified: "99.9% isolation confidence, eliminates cross-tenant SQL injection risk"
          confidence: 0.95
        - attribute: "Cost"
          improvement: "None (200× more expensive)"
          quantified: "$180K/month vs $900/month"
          confidence: 1.0
    roi_assessment: |
      SCHEMA-PER-TENANT:
      Cost: $20K development + $900/month operational
      Benefit: $179K/month saved (vs separate DB)
      ROI: Massive cost savings, acceptable security with RLS + SAST
      Trade-off: Accept medium SQL injection risk (VR-001) with $100K-$145K mitigation investment
      DECISION: SCHEMA-PER-TENANT for MVP. Re-evaluate at 50+ enterprise customers if security incidents occur.

      SEPARATE-DATABASE:
      Cost: $30K development + $180K/month operational
      Benefit: Near-perfect isolation
      ROI: Negative (200× cost increase for marginal security improvement)
      DECISION: REJECT unless HIPAA customer requires (offer as premium tier)
    rank: 1 (schema-per-tenant)

  - id: "CBAM-005"
    strategy: "Hybrid Deployment (Cloud + On-Prem) vs Cloud-Only"
    quality_attributes_affected: ["Compliance", "Cost", "Complexity"]
    costs:
      hybrid:
