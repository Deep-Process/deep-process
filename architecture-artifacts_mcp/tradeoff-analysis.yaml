# ══════════════════════════════════════════════
# FINOPS / COST ARCHITECTURE
# ══════════════════════════════════════════════

cost_architecture:
  environments:
    - name: "Production"
      monthly_estimate: "$9,200"
      cost_drivers:
        - resource: "Compute (EKS nodes: 5× c6i.4xlarge)"
          monthly: "$2,400"
          details: "5 nodes × $480/month = $2,400. Spot instances discount: 70% off = $720 saved"
        - resource: "Database (RDS PostgreSQL db.r6g.2xlarge Multi-AZ)"
          monthly: "$900"
          details: "Multi-AZ premium: $900 vs $450 single-AZ"
        - resource: "Storage (S3 Standard + IA + Glacier lifecycle)"
          monthly: "$500"
          details: "100GB MVP → 10TB @ 12mo. Lifecycle policies reduce avg cost to $0.015/GB"
        - resource: "LLM API (Anthropic Claude Sonnet + OpenAI GPT fallback)"
          monthly: "$10,000"
          details: "80% Claude ($3/MTok) + 20% GPT ($10/MTok). Est 3M tokens/month @ $10K"
        - resource: "Message Queue (SQS FIFO + DLQ)"
          monthly: "$200"
          details: "1M messages/month × $0.40/million + DLQ"
        - resource: "Event Bus (EventBridge)"
          monthly: "$100"
          details: "100K events/month × $1/million"
        - resource: "Networking (Data Transfer + NAT Gateway)"
          monthly: "$400"
          details: "NAT Gateway $32/month + 100GB data transfer"
        - resource: "Observability (Prometheus + Grafana on EKS, CloudWatch)"
          monthly: "$300"
          details: "CloudWatch logs + metrics ingestion"

    - name: "Staging"
      monthly_estimate: "$2,800"
      cost_drivers:
        - resource: "Compute (EKS: 2× c6i.2xlarge)"
          monthly: "$480"
        - resource: "Database (RDS db.t3.large single-AZ)"
          monthly: "$180"
        - resource: "Storage (S3 Standard, 10GB)"
          monthly: "$5"
        - resource: "LLM API (reduced usage, 10% of prod)"
          monthly: "$1,000"
        - resource: "Queue + Event Bus + Networking"
          monthly: "$100"

    - name: "Development"
      monthly_estimate: "$800"
      cost_drivers:
        - resource: "Compute (EKS: 1× c6i.xlarge)"
          monthly: "$240"
        - resource: "Database (RDS db.t3.small)"
          monthly: "$50"
        - resource: "LLM API (minimal testing)"
          monthly: "$500"

  total_monthly:
    mvp: "$12,800"
    scale_6m: "$25,000"
    scale_12m: "$45,000"
    breakdown: |
      MVP (10 customers):
        - Infra: $2,800 (compute + DB + storage + networking)
        - LLM API: $10,000 (dominant cost driver)
        - Total: $12,800/month = $154K/year

      6-Month (50 customers):
        - Infra: $5,000 (5× growth, some economies of scale)
        - LLM API: $20,000 (2× tokens)
        - Total: $25,000/month = $300K/year

      12-Month (300 customers):
        - Infra: $10,000 (10× growth with auto-scaling)
        - LLM API: $35,000 (3.5× tokens, not linear due to caching)
        - Total: $45,000/month = $540K/year

  cost_optimization_strategies:
    - "Reserved Instances for baseline EKS nodes (40% discount vs on-demand)"
    - "Spot Instances for auto-scaled nodes (70% discount, acceptable for stateless executors)"
    - "S3 Lifecycle Policies (Standard → IA → Glacier, save 75% on old artifacts)"
    - "LLM response caching (30% cache hit rate reduces API calls 30%)"
    - "Database connection pooling (PgBouncer reduces connection overhead)"
    - "Right-sizing: t3.small for dev/staging vs r6g.2xlarge for prod"

  cost_scaling_model: "sub-linear"
  scaling_analysis: |
    Customer growth: 10 → 300 (30× growth)
    Infrastructure cost: $2,800 → $10,000 (3.6× growth)
    LLM API cost: $10,000 → $35,000 (3.5× growth)

    Sub-linear scaling due to:
    1. LLM response caching (30% hit rate at scale)
    2. Economies of scale (reserved instances, committed use discounts)
    3. S3 lifecycle policies (old data migrates to cheaper tiers)
    4. Database read replicas (more efficient than separate DBs)

  break_even_analysis:
    assumption: "Average revenue per customer = $2,000/month ($24K ACV)"
    mvp_10_customers:
      revenue: "$20,000/month"
      cost: "$12,800/month"
      margin: "$7,200/month (36% margin)"
      break_even: "Profitable at MVP"
    scale_300_customers:
      revenue: "$600,000/month"
      cost: "$45,000/month"
      margin: "$555,000/month (92.5% margin)"
      break_even: "Highly profitable at scale (margins improve with scale)"

  cost_per_job:
    mvp: "$25.60 per job (500 jobs/month)"
    scale: "$4.50 per job (10,000 jobs/month)"
    note: "Cost per job decreases 5.7× due to economies of scale"

# ══════════════════════════════════════════════
# EVOLUTION STRATEGY
# ══════════════════════════════════════════════

evolution_strategy:
  phases:
    - phase: "MVP / Phase 1"
      timeline: "Months 0-3"
      scope: "10 customers, 4 prioritized processes (deep-explore, deep-compliance, deep-risk, deep-architect), core infrastructure"
      architecture: |
        - Microservices with 23 components (full architecture day 1)
        - Common Process Services pool (C-009) hosts 9 lower-priority processes
        - Single region (us-east-1 AWS)
        - Multi-AZ RDS (reliability required from day 1)
        - Manual scaling (no HPA yet, fixed 5 executor pods)
        - Basic observability (CloudWatch metrics, Grafana dashboards)
      validation_gates:
        - "First 3 enterprise customers onboarded successfully"
        - "99.9% uptime SLA achieved for 30 days"
        - "VR-001 mitigation implemented (SQL injection prevention)"

    - phase: "Growth / Phase 2"
      timeline: "Months 3-9"
      scope: "50 customers, extract 2 top-used processes from common pool to dedicated services, auto-scaling, enhanced security"
      architecture: |
        - Extract deep-governance from C-009 to dedicated service (if usage validates)
        - Implement HPA + Cluster Autoscaler (CBAM-002)
        - Add read replicas for database scaling (BN-001 mitigation)
        - Circuit breaker for LLM APIs (CBAM-003)
        - Enhanced observability (distributed tracing with Jaeger)
        - SOC 2 Type II certification (6-month audit process)
      validation_gates:
        - "50 customers, 2,000 jobs/month sustained load"
        - "Auto-scaling tested at 100 concurrent jobs"
        - "SOC 2 audit passed, certification obtained"
        - "P95 latency <500ms maintained under load"

    - phase: "Scale / Phase 3"
      timeline: "Months 9-18"
      scope: "200-300 customers, multi-region, advanced features (WebSocket, MCP marketplace, advanced analytics)"
      architecture: |
        - Multi-region deployment (us-east-1 primary, eu-west-1 secondary for GDPR)
        - Cross-region replication for S3, RDS read replicas in EU region
        - Extract remaining high-usage processes from C-009 (deep-document, deep-challenge if validated)
        - WebSocket support for real-time job progress (I-002 implementation)
        - Advanced cost optimization (reserved instances, spot instances, LLM caching at 50% hit rate)
        - Service mesh (Istio) for mTLS, advanced traffic management
      validation_gates:
        - "200 customers, 10,000 jobs/month"
        - "Multi-region failover tested (<5 min RTO)"
        - "Cost per job <$5 (vs $25.60 at MVP)"
        - "LLM cache hit rate >40%"

  migration_path:
    from: "Current state (CLI-only deep-* processes, no platform)"
    to: "Cloud platform with API, orchestration, multi-tenant SaaS"
    strategy: "strangler_fig"
    details: |
      STRANGLER FIG PATTERN:
      - Wrap existing CLI processes with API layer (processes unchanged, per brownfield constraint)
      - Gradually enhance orchestration layer (gates, counter-checks, checkpointing)
      - Migrate customers from CLI to platform API incrementally
      - Maintain CLI compatibility indefinitely (local developer use case)

      Migration stages:
      1. Month 0-1: Build platform infrastructure, integrate 4 processes (deep-explore, deep-compliance, deep-risk, deep-architect)
      2. Month 1-2: Onboard first 3 enterprise customers (beta), gather feedback
      3. Month 2-3: Integrate remaining 9 processes (via C-009 common pool)
      4. Month 3-6: Migrate early adopters from CLI to platform, validate value proposition
      5. Month 6+: Scale customer acquisition, CLI remains available for local use

    risks:
      - "CLI-to-platform migration slower than expected (customers resist change)"
      - "Brownfield constraint limits optimization (cannot modify core process logic)"
      - "Workflow.md interpretation edge cases cause failures"

    rollback_plan:
      - "Platform runs side-by-side with CLI (no forced migration)"
      - "Customers can revert to CLI if platform issues occur"
      - "Data export API allows extracting artifacts from platform to local storage"

  extensibility_points:
    - point: "Process Definition Repository (C-013)"
      description: "New processes added by uploading workflow.md + schemas, no code changes"
      example: "Add deep-strategy process: upload workflow.md, executor auto-loads definition, <1 day integration"

    - point: "Integration Adapters (C-018, C-020)"
      description: "New integration channels (e.g., Jira plugin, ServiceNow adapter) as separate services"
      example: "Add Jira integration: new adapter service translates Jira webhooks to platform API calls, no core platform changes"

    - point: "LLM Provider (C-014)"
      description: "Multi-provider strategy allows adding new LLMs (e.g., Google Gemini, local Llama) via strategy pattern"
      example: "Add Gemini: implement LLMProvider interface, update strategy factory, no orchestrator changes"

    - point: "Deployment Model (ADR-001)"
      description: "Microservices allow selective deployment (compliance on-prem, analytics cloud)"
      example: "HIPAA customer: deploy C-006 (deep-compliance) to customer K8s cluster, route jobs via hybrid networking"

  deprecation_plan:
    - component: "C-009 (Common Process Services)"
      timeline: "Months 6-18"
      rationale: "Common pool is MVP pragmatism. Extract high-usage processes to dedicated services based on telemetry."
      migration: "Extract processes one-by-one to dedicated services when usage threshold crossed (>100 jobs/month)"

    - pattern: "gRPC for public API (I-001)"
      timeline: "Month 12+"
      rationale: "gRPC great for internal services, but REST is more accessible for external developers. Consider REST for public API, keep gRPC internal."
      migration: "Add REST API layer (OpenAPI spec) alongside gRPC, deprecate gRPC public endpoints over 6 months"

# ══════════════════════════════════════════════
# DECISIONS
# ══════════════════════════════════════════════

decisions:
  - id: "D-001"
    description: "Use Multi-AZ RDS despite $450/month premium"
    rationale: "Enterprise SaaS requires 99.9% uptime SLA. $450/month cost justified by preventing $50K+ customer churn and enabling enterprise sales."
    trade_off_point: "TP-002"
    alternatives_rejected:
      - option: "Single-AZ RDS"
        reason: "99.5% uptime insufficient for enterprise customers, 1-2 hour RTO unacceptable"
      - option: "Aurora Serverless v2"
        reason: "Cold start issues, more complex. Defer to scale phase (300+ customers)."
    reversibility: "reversible"
    reversal_cost: "Low (RDS Multi-AZ can be disabled, $450/month saved)"
    confidence: 0.95

  - id: "D-002"
    description: "Accept 5ms RLS overhead for defense-in-depth security"
    rationale: "Row-Level Security prevents SQL injection bypass from exposing cross-tenant data. 5ms overhead is 1% of 500ms P95 budget, acceptable trade-off."
    trade_off_point: "TP-001"
    alternatives_rejected:
      - option: "Disable RLS, rely only on application-layer filtering"
        reason: "Catastrophic risk if SQL injection bypasses app layer (VR-001 breach scenario). Not justified for 5ms gain."
    reversibility: "reversible"
    reversal_cost: "Medium (removing RLS requires re-testing security, potential compliance issues)"
    confidence: 0.90

  - id: "D-003"
    description: "Hybrid LLM strategy: 80% Claude (cost), 20% GPT (speed + failover)"
    rationale: "Best cost/performance/resilience balance. Claude saves 40% vs GPT-only, GPT provides failover and speed tier for latency-sensitive jobs."
    trade_off_point: "TP-004"
    alternatives_rejected:
      - option: "GPT-4 Turbo only"
        reason: "3× higher cost ($240K/year premium) for 20% speed improvement not justified"
      - option: "Claude Sonnet only"
        reason: "Single point of failure, no failover during Anthropic outages"
    reversibility: "reversible"
    reversal_cost: "Low (change LLM routing logic in C-014, no architecture change)"
    confidence: 0.85

  - id: "D-004"
    description: "Microservices from day 1 (not monolith-first)"
    rationale: "Hybrid deployment requirement (compliance on-prem, analytics cloud) is blocker for monolith. Microservices required to deliver core value proposition."
    trade_off_point: "TP-003"
    alternatives_rejected:
      - option: "Modular monolith, migrate to microservices later"
        reason: "Migration cost $500K-$1M, 6-12 months engineering. Starting with microservices avoids this debt."
      - option: "Pure serverless (Lambda)"
        reason: "15-minute timeout insufficient for 2-24 hour processes"
    reversibility: "irreversible"
    reversal_cost: "Very High ($500K-$1M to consolidate to monolith, loses hybrid deployment capability)"
    confidence: 0.95

  - id: "D-005"
    description: "Schema-per-tenant multi-tenancy (not separate databases)"
    rationale: "Single PostgreSQL instance for 300 tenants costs $900/month vs $180K for separate databases (200× savings). RLS provides adequate isolation with VR-001 mitigations."
    trade_off_point: "CBAM-004"
    alternatives_rejected:
      - option: "Separate database per tenant"
        reason: "$180K/month at scale (200× more expensive) for marginal security improvement not justified"
    reversibility: "partially reversible"
    reversal_cost: "High (migrate each tenant to separate DB, 6-12 months, $100K-$200K eng cost)"
    confidence: 0.80
    risk_acceptance: "Accept medium SQL injection risk (VR-001) with $100K-$145K mitigation investment. Re-evaluate if breach occurs."

  - id: "D-006"
    description: "Implement hybrid deployment (cloud + on-prem) for HIPAA compliance"
    rationale: "Unlocks $500K-$2M healthcare market (3-5 enterprise customers). 782% ROI if market validates. On-prem capability is competitive differentiator."
    trade_off_point: "CBAM-005"
    alternatives_rejected:
      - option: "Cloud-only"
        reason: "Foregoes 30-40% of enterprise market (on-prem buyers), loses $1.5M+ revenue"
    reversibility: "partially reversible"
    reversal_cost: "Medium (can deprecate on-prem deployment, but loses HIPAA customers)"
    confidence: 0.75
    validation_checkpoint: "Month 6: If 0 HIPAA customers onboarded, re-evaluate on-prem investment"

  - id: "D-007"
    description: "Auto-scale executor pool 0-100 replicas with HPA + Cluster Autoscaler"
    rationale: "Supports 30× customer growth (10 → 300) without manual intervention. Saves $3K/month vs fixed capacity at scale."
    trade_off_point: "CBAM-002"
    alternatives_rejected:
      - option: "Fixed-size cluster"
        reason: "Cannot handle growth, or wastes cost (always-on 50 nodes = $8K/month vs $5K variable)"
    reversibility: "reversible"
    reversal_cost: "Low (can disable auto-scaling, revert to fixed capacity)"
    confidence: 0.90

  - id: "D-008"
    description: "Circuit breaker for LLM APIs with multi-provider failover"
    rationale: "Prevents 15-minute manual failover during LLM outages (2× per year). 100% ROI, prevents customer churn during outages."
    trade_off_point: "CBAM-003"
    alternatives_rejected:
      - option: "No circuit breaker, manual failover"
        reason: "15+ minute downtime during outages, poor user experience, customer churn risk"
    reversibility: "reversible"
    reversal_cost: "Low (can remove circuit breaker, revert to single-provider)"
    confidence: 0.85

