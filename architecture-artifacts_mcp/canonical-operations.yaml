boundary_definition:
  context_map:
    system_name: "Deep-* Process Platform"
    scope: "Platform for orchestrating, executing, and integrating 13 deep-* verification and governance processes"

    external_actors:
      - id: "EA-001"
        name: "Enterprise Developers"
        type: "user"
        interaction: "Invoke processes via API, MCP, or CI/CD integrations. View results in Dashboard UI."

      - id: "EA-002"
        name: "Enterprise Admins"
        type: "user"
        interaction: "Manage users, configure processes, view audit logs, set policies."

      - id: "EA-003"
        name: "Compliance Officers"
        type: "user"
        interaction: "Run compliance assessments, view regulatory gap analysis, export evidence for audits."

      - id: "EA-004"
        name: "GitHub / Azure DevOps / GitLab"
        type: "system"
        interaction: "CI/CD pipelines invoke processes via C-020 adapters, receive webhook notifications on completion."

      - id: "EA-005"
        name: "Slack / Email Systems"
        type: "system"
        interaction: "Receive webhook notifications for job status, gate failures, compliance alerts."

      - id: "EA-006"
        name: "Claude Code / GitHub Copilot"
        type: "system"
        interaction: "Invoke processes via MCP protocol (C-018) from IDE/chat interfaces."

      - id: "EA-007"
        name: "Anthropic/OpenAI APIs"
        type: "system"
        interaction: "Platform sends prompts, receives LLM completions for process execution logic."

      - id: "EA-008"
        name: "Customer SSO Providers"
        type: "system"
        interaction: "SAML/OIDC authentication flow for enterprise users via C-010."

    bounded_contexts:
      - id: "BC-001"
        name: "API & Gateway Context"
        description: "External API surface, authentication, routing"
        components: ["C-001", "C-010", "C-018"]
        relationships:
          - target: "BC-002"
            type: "customer_supplier"
            reasoning: "API Gateway consumes Orchestration services. Gateway is customer, Orchestrator is supplier."

      - id: "BC-002"
        name: "Orchestration & Execution Context"
        description: "Core process workflow orchestration, job management"
        components: ["C-002", "C-003", "C-004"]
        relationships:
          - target: "BC-003"
            type: "customer_supplier"
            reasoning: "Orchestrator invokes Process Services. Orchestrator is customer."
          - target: "BC-004"
            type: "customer_supplier"
            reasoning: "Orchestrator stores artifacts. Orchestrator is customer of storage."

      - id: "BC-003"
        name: "Process Services Context"
        description: "Individual deep-* process execution logic"
        components: ["C-005", "C-006", "C-007", "C-008", "C-009", "C-013"]
        relationships:
          - target: "BC-005"
            type: "customer_supplier"
            reasoning: "Processes invoke LLM APIs. Processes are customers."
          - target: "BC-004"
            type: "customer_supplier"
            reasoning: "Processes store artifacts, retrieve schemas."

      - id: "BC-004"
        name: "Storage & Persistence Context"
        description: "Artifact storage, metadata DB, process definitions"
        components: ["C-011", "C-012", "C-013", "C-015"]
        relationships:
          - target: "BC-003"
            type: "published_language"
            reasoning: "Storage exposes YAML artifact schema as published language that all processes must conform to."

      - id: "BC-005"
        name: "LLM Integration Context"
        description: "AI/ML API abstraction, prompt management"
        components: ["C-014"]
        relationships:
          - target: "BC-003"
            type: "open_host"
            reasoning: "LLM service provides open host API that any process can use without tight coupling."

      - id: "BC-006"
        name: "Observability Context"
        description: "Monitoring, logging, tracing, dashboards"
        components: ["C-016", "C-017"]
        relationships:
          - target: "BC-002"
            type: "conformist"
            reasoning: "Observability consumes data from Orchestration and must conform to its event structure."
          - target: "BC-003"
            type: "conformist"
            reasoning: "Observability consumes logs/metrics from all Process Services."

      - id: "BC-007"
        name: "Integration & Notifications Context"
        description: "External system integration (webhooks, CI/CD)"
        components: ["C-019", "C-020"]
        relationships:
          - target: "BC-002"
            type: "customer_supplier"
            reasoning: "Integrations consume orchestration events. Orchestrator is supplier."

