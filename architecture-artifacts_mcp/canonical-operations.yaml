# OPERATION 6: PATTERN APPLICATION
# ══════════════════════════════════════════════

pattern_application:
  architectural_pattern:
    pattern_id: "AP-DEC-001"
    name: "Microservices"
    source_domains: ["DOM-PAR-MICRO"]
    rationale: "Multiple independent processes (13) with distinct responsibilities, cross-functional teams (platform, process integration, observability, security), need for independent scaling (long-running vs short processes), polyglot requirements (processes may use different languages), and hybrid deployment model (cloud + on-prem) all strongly indicate microservices architecture. Technical report confirms 'Kubernetes dominates (66% use)', 'service mesh', 'api gateway' as standard patterns."
    trade_offs: "Accept distributed system complexity (network latency, data consistency, distributed debugging) in exchange for independent deployment, technology diversity, and team autonomy. Tradeoff is justified by need to isolate compliance processes (on-prem) from analytics (cloud) and scale processes independently."

  supporting_patterns:
    - pattern_id: "AP-COM-001"
      name: "Event-Driven Architecture"
      source: "architecture-patterns.yaml / DOM-PAR-EVENT"
      applied_to: "C-002 (Orchestrator) → C-003 (Job Queue) → C-004 (Executor) communication. C-019 (Webhook Dispatcher) event subscriptions."
      rationale: "Long-running processes (2-24 hours) cannot block synchronous HTTP. Event-driven async pattern with queue (C-003) decouples job submission from execution. Webhooks (C-019) enable async notifications to external systems."

    - pattern_id: "AP-COM-007"
      name: "API Gateway Pattern"
      source: "architecture-patterns.yaml / DOM-PAR-MICRO"
      applied_to: "C-001 (API Gateway) as single entry point"
      rationale: "13 process services need unified external API. Gateway provides routing, auth, rate limiting, versioning. Standard microservices pattern for external communication."

    - pattern_id: "AP-DEC-004"
      name: "Hexagonal (Ports & Adapters)"
      source: "architecture-patterns.yaml / DOM-BASE-SOLID"
      applied_to: "C-004 (Process Executor) core logic isolated from I/O. C-010 (IAM) with SSO adapters. C-014 (LLM service) with multi-provider adapters."
      rationale: "Process executor core (workflow.md interpretation, gate enforcement) must be testable in isolation from LLM APIs, storage, queues. Ports = interfaces (ILLMProvider, IArtifactStore), Adapters = implementations (OpenAI, S3)."

    - pattern_id: "AP-INT-001"
      name: "API Composition"
      source: "architecture-patterns.yaml / DOM-PAR-MICRO"
      applied_to: "C-017 (Dashboard UI) aggregates data from C-001 (jobs), C-011 (artifacts), C-016 (metrics)"
      rationale: "Dashboard needs data from multiple services. API composition pattern aggregates responses client-side to avoid backend for frontend (BFF) complexity in MVP."

    - pattern_id: "AP-RES-001"
      name: "Circuit Breaker"
      source: "architecture-patterns.yaml / DOM-PAR-MICRO"
      applied_to: "C-014 (LLM service) calls to C-021 (External LLM APIs). C-004 (Executor) calls to C-014."
      rationale: "External LLM APIs (Anthropic, OpenAI) can fail or rate-limit. Circuit breaker prevents cascading failures. Fail fast and retry with exponential backoff."

    - pattern_id: "AP-RES-004"
      name: "Bulkhead"
      source: "architecture-patterns.yaml / DOM-PAR-MICRO"
      applied_to: "C-004 (Process Executor Pool) with separate thread pools for compliance vs non-compliance processes"
      rationale: "High-priority compliance processes should not be starved by large volume of low-priority processes. Bulkhead pattern isolates resource pools."

    - pattern_id: "AP-DAT-003"
      name: "Database per Service"
      source: "architecture-patterns.yaml / DOM-PAR-MICRO"
      applied_to: "C-015 (PostgreSQL) with schema-per-tenant. C-012 (Object Storage) with prefix-per-tenant."
      rationale: "Multi-tenant isolation via schema-per-tenant in PostgreSQL. Each tenant has isolated schema with dedicated tables. Object storage uses tenant-id prefix for blob isolation."

    - pattern_id: "AP-SEC-001"
      name: "Zero Trust Architecture"
      source: "architecture-patterns.yaml / DOM-BASE-SEC"
      applied_to: "All inter-service communication via C-010 (IAM) with mutual TLS and service-to-service auth"
      rationale: "No implicit trust between services. Every request authenticated and authorized. Required for SOC 2 compliance."

    - pattern_id: "AP-SEC-004"
      name: "Secrets Management"
      source: "architecture-patterns.yaml / DOM-BASE-SEC"
      applied_to: "LLM API keys, DB passwords, SSO secrets stored in AWS Secrets Manager / Azure Key Vault, not env vars"
      rationale: "SOC 2 and compliance requirements. Secrets must be encrypted, rotated, audited. Managed service (Secrets Manager) provides this."

    - pattern_id: "AP-OBS-001"
      name: "Distributed Tracing"
      source: "architecture-patterns.yaml / DOM-BASE-OBS"
      applied_to: "C-016 (Observability) with Jaeger/Tempo for request tracing across services"
      rationale: "Distributed system with 13+ services. Need end-to-end trace visibility for debugging long-running workflows. Correlation ID propagated through all service calls."

    - pattern_id: "AP-OBS-003"
      name: "Health Check API"
      source: "architecture-patterns.yaml / DOM-BASE-OBS"
      applied_to: "All services expose /health endpoints for K8s liveness/readiness probes"
      rationale: "Kubernetes requires health checks for orchestration. Services report dependency health (DB, queue, LLM API availability)."

  cloud_patterns:
    - pattern_id: "CP-AWS-001"
      name: "Lambda + API Gateway"
      applied_to: "Potential serverless implementation for C-001 (API Gateway) and light request handlers"
      rationale: "Variable traffic pattern. Pay-per-request cost model. Cold start acceptable for job submission (async anyway). Alternative to ECS/Fargate for cost optimization."

    - pattern_id: "CP-AWS-003"
      name: "SQS/SNS Fan-out"
      applied_to: "C-003 (Job Queue) as SQS FIFO queue. C-019 (Webhook Dispatcher) subscribes to SNS topics for job events."
      rationale: "Guaranteed message delivery with DLQ. Fan-out pattern for multiple webhook consumers. FIFO queue ensures process execution order."

    - pattern_id: "CP-AWS-004"
      name: "Step Functions Orchestration"
      applied_to: "Potential alternative to C-002 (Process Orchestrator) for visual workflow"
      rationale: "Step Functions provides visual workflow, built-in retry, error handling. Could simplify orchestration logic. Trade-off: vendor lock-in vs operational simplicity."

    - pattern_id: "CP-AWS-007"
      name: "EventBridge Event Bus"
      applied_to: "C-019 (Webhook Dispatcher) uses EventBridge for content-based routing of job events"
      rationale: "Event schema registry for webhook payloads. Content-based routing (e.g., only compliance events to audit systems). Archive/replay for debugging."

    - pattern_id: "CP-AWS-008"
      name: "S3 Data Lake Foundation"
      applied_to: "C-012 (Object Storage) as S3 with lifecycle policies (hot → IA → Glacier)"
      rationale: "Artifacts grow over time. Lifecycle policies auto-archive old results to reduce cost. Raw artifacts in /raw, processed in /curated."

    - pattern_id: "CP-AZURE-002"
      name: "Service Bus Premium (if Azure)"
      applied_to: "C-003 (Job Queue) as Azure Service Bus with partitioning"
      rationale: "If deployed on Azure, Service Bus Premium provides FIFO, sessions, duplicate detection. Equivalent to SQS FIFO."

    - pattern_id: "CP-K8S-001"
      name: "Deployment + Service"
      applied_to: "All microservices (C-001 through C-020) as K8s Deployments with Service objects"
      rationale: "Standard K8s pattern. Deployment manages replicas, rolling updates. Service provides stable DNS and load balancing."

    - pattern_id: "CP-K8S-002"
      name: "ConfigMap + Secret"
      applied_to: "Process configurations in ConfigMaps. API keys, credentials in Secrets. Mounted as volumes or env vars."
      rationale: "Separate config from code. Secrets encrypted at rest. ConfigMaps for workflow.md paths, feature flags."

    - pattern_id: "CP-K8S-003"
      name: "Ingress Controller"
      applied_to: "C-001 (API Gateway) exposed via Ingress with TLS termination"
      rationale: "Single external entry point. Ingress handles TLS, routing to API Gateway service."

  rejected_alternatives:
    - pattern_id: "AP-DEC-002"
      name: "Modular Monolith"
      rejection_rationale: "13 processes with distinct scaling needs (compliance heavy, explore light). Multiple teams (platform, process integration, security). Independent deployment required for compliance-on-prem vs analytics-cloud. Monolith would create release coupling and prevent hybrid deployment."

    - pattern_id: "AP-DEC-007"
      name: "Cell-Based Architecture"
      rejection_rationale: "Cell-based is for >20 services with multi-region blast radius containment. Platform has 13-20 components but single-region MVP sufficient. Over-engineering for current scale. Revisit if multi-region needed."

    - pattern_id: "AP-COM-002"
      name: "CQRS"
      rejection_rationale: "Process execution is read-heavy (artifact retrieval) but not high-volume writes. CQRS adds complexity (separate read/write models) without clear benefit for current scale. Event sourcing may be useful for audit trails later, but not MVP requirement."

    - pattern_id: "AP-PAR-SERVER"
      name: "Pure Serverless"
      rejection_rationale: "Long-running processes (2-24 hours) exceed Lambda 15-minute limit. Step Functions Standard supports up to 1 year but complex workflow interpretation and gate enforcement harder to implement in Step Functions DSL. Hybrid serverless (API Gateway + Lambda) + containerized execution (ECS/K8s) is better fit."

  design_patterns:
    - name: "Repository Pattern"
      applied_to: "C-011 (Artifact Storage), C-013 (Process Definition Repository)"
      rationale: "Abstract data access behind repository interface. Enables swapping S3 for Azure Blob or local filesystem without changing business logic."

    - name: "Factory Pattern"
      applied_to: "C-004 (Process Executor) to instantiate correct process service (C-005, C-006, etc.) based on process_id"
      rationale: "Process executor receives process_id at runtime and must instantiate correct process implementation. Factory encapsulates instantiation logic."

    - name: "Strategy Pattern"
      applied_to: "C-014 (LLM Service) to select provider (OpenAI, Anthropic, Azure OpenAI) based on config or failover"
      rationale: "Multiple LLM providers with same interface. Strategy pattern allows runtime provider selection and multi-provider fallback."

    - name: "Observer Pattern"
      applied_to: "C-019 (Webhook Dispatcher) observes job completion events from C-003 (Queue)"
      rationale: "Webhooks are observers of job lifecycle events. Loose coupling between job execution and notification delivery."

    - name: "Adapter Pattern"
      applied_to: "C-018 (MCP Server), C-020 (CI/CD Adapters) to translate external protocols to internal APIs"
      rationale: "MCP protocol, GitHub Actions syntax, Azure DevOps tasks all need translation to unified internal API. Adapter pattern isolates protocol-specific logic."

    - name: "Saga Pattern"
      applied_to: "C-002 (Orchestrator) for multi-phase process execution with compensation on gate failure"
      rationale: "Workflow.md defines multi-phase saga (Phase 0 → 1 → 2 → ... → 6). If gate fails, need compensation (rollback artifacts, update job status). Choreography-based saga via events."

