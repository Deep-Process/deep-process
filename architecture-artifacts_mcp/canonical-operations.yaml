metadata:
  version: "1.2.0"
  timestamp: "2026-02-15T20:30:00Z"
  execution_mode: "hybrid"
  operations_executed: 8

assumptions:
  - id: "A-101"
    assumption: "Each deep-* process can be packaged as an independent Docker container without modifying core workflow.md logic"
    confidence: 0.75
    falsification: "Build Docker images for 3 representative processes (deep-explore, deep-compliance, deep-risk). Execute full workflows including gates. If gate enforcement fails or YAML artifact generation breaks, assumption is false."
    impact_if_wrong: "Cannot use standard container orchestration (K8s). May need custom runtime environment or process modifications violating brownfield constraint."

  - id: "A-102"
    assumption: "Multi-tenant SaaS can achieve adequate data isolation using schema-per-tenant in PostgreSQL without separate database instances"
    confidence: 0.70
    falsification: "Security audit schema-based isolation. Test cross-tenant query access, privilege escalation scenarios. If any tenant can access another's data or metadata, assumption is false."
    impact_if_wrong: "Must provision separate DB instances per enterprise tenant, significantly increasing cost and operational complexity."

  - id: "A-103"
    assumption: "Process execution state can be persisted and resumed across container restarts for long-running operations (2-24 hours)"
    confidence: 0.65
    falsification: "Implement checkpoint/resume for one process (e.g., deep-architect). Kill container mid-execution, restore from checkpoint. If resume fails or produces different results, assumption is false."
    impact_if_wrong: "Must guarantee container uptime for entire execution window, or restrict to shorter processes only, limiting platform value."

  - id: "A-104"
    assumption: "API Gateway can handle long-running async operations via webhook callbacks without blocking synchronous HTTP connections"
    confidence: 0.80
    falsification: "Load test API Gateway with 100 concurrent long-running jobs (simulated 1-hour execution). Monitor connection timeouts, callback delivery. If >5% callback failures, assumption is weakened."
    impact_if_wrong: "Need alternative async pattern (polling, WebSockets, or job queue with separate status API). May complicate client integration."

# ══════════════════════════════════════════════
# OPERATION 1: DECOMPOSITION
# ══════════════════════════════════════════════

decomposition:
  levels: 3
  strategy: "Microservices-oriented with clear bounded contexts per process type and infrastructure concerns"
  reasoning: "Multiple independent processes with distinct responsibilities (compliance, risk, architecture, documentation), cross-functional teams (per Conway's Law), need for independent scaling (long-running vs short-running processes), and hybrid deployment model (cloud + on-prem) all indicate service-oriented decomposition."

  components:
    # === TIER 1: API & Orchestration Layer ===

    - id: "C-001"
      name: "API Gateway"
      type: "service"
      responsibility: "External API entry point, authentication, rate limiting, request routing to orchestrator"
      reasoning: "Enterprises need unified API surface for all 13 processes, not 13 separate endpoints. Gateway provides auth, throttling, and routing to appropriate process orchestration."
      dependencies: ["C-002", "C-010"]
      interfaces: ["I-001", "I-002"]

    - id: "C-002"
      name: "Process Orchestrator"
      type: "service"
      responsibility: "Workflow execution coordination, gate enforcement, phase sequencing, long-running job management"
      reasoning: "Core orchestration logic must be centralized to ensure consistent gate enforcement, EVR compliance, and counter-check execution across all processes. Prevents each process service from reimplementing orchestration."
      dependencies: ["C-003", "C-004", "C-005", "C-013"]
      interfaces: ["I-003", "I-004"]

    - id: "C-003"
      name: "Job Queue Manager"
      type: "queue"
      responsibility: "Async job queueing, priority scheduling, timeout management, retry logic"
      reasoning: "Long-running processes (2-24 hours) cannot block HTTP requests. Need durable queue with DLQ for failed jobs and priority queuing for enterprise vs free-tier users."
      dependencies: ["C-004"]
      interfaces: ["I-005"]

    # === TIER 2: Process Execution Services (13 processes) ===

    - id: "C-004"
      name: "Process Executor Pool"
      type: "service"
      responsibility: "Execute workflow.md steps for any deep-* process, enforce gates, collect artifacts"
      reasoning: "Reusable execution engine that can run any process's workflow.md. Avoids 13 separate executor services. Dynamically loads process definition (workflow.md, schemas, patterns) from C-013."
      dependencies: ["C-006", "C-007", "C-013", "C-014"]
      interfaces: ["I-006"]

    - id: "C-005"
      name: "deep-explore Service"
      type: "service"
      responsibility: "Decision exploration, option mapping, assumption extraction, knowledge expansion"
      reasoning: "First process to productize per technical report. Separate service allows independent scaling for high-volume decision exploration use cases."
      dependencies: ["C-004", "C-013"]
      interfaces: ["I-007"]

    - id: "C-006"
      name: "deep-compliance Service"
      type: "service"
      responsibility: "Regulatory compliance assessment (EU AI Act, GDPR, HIPAA, SOC2)"
      reasoning: "Compliance processes handle sensitive data and may require dedicated on-prem deployment for HIPAA customers. Separate service enables isolated deployment with enhanced security."
      dependencies: ["C-004", "C-013"]
      interfaces: ["I-008"]

    - id: "C-007"
      name: "deep-risk Service"
      type: "service"
      responsibility: "5D risk scoring, cascade analysis, Cobra Effect detection"
      reasoning: "Risk assessment may require integration with external risk databases and threat intelligence feeds. Separate service allows specialized infrastructure and data sources."
      dependencies: ["C-004", "C-013"]
      interfaces: ["I-009"]

    - id: "C-008"
      name: "deep-architect Service"
      type: "service"
      responsibility: "Software architecture design, adversarial validation, ADR generation"
      reasoning: "Architecture process has unique pattern library dependencies and diagram generation requirements. Separation allows specialized tooling (Mermaid rendering, ADR templates)."
      dependencies: ["C-004", "C-013"]
      interfaces: ["I-010"]

    - id: "C-009"
      name: "Common Process Services"
      type: "service"
      responsibility: "Remaining 9 processes (deep-document, deep-challenge, deep-governance, deep-synthesis, deep-verify, deep-feasibility, deep-diagram, deep-monitoring, deep-orchestration)"
      reasoning: "Lower-priority processes grouped into shared service for MVP. Can extract to dedicated services later based on usage. Reduces initial deployment complexity."
      dependencies: ["C-004", "C-013"]
      interfaces: ["I-011"]

    # === TIER 3: Shared Infrastructure & Integration ===

    - id: "C-010"
      name: "Identity & Access Management (IAM)"
      type: "service"
      responsibility: "User authentication, authorization, API key management, SSO integration (Okta, Azure AD)"
      reasoning: "Enterprise requirement from technical report. Centralized IAM enables SSO, RBAC, audit trails for SOC2 compliance. Must integrate with customer identity providers."
      dependencies: ["C-015"]
      interfaces: ["I-012"]

    - id: "C-011"
      name: "Artifact Storage Service"
      type: "service"
      responsibility: "YAML artifact persistence, versioning, retrieval, SARIF/SBOM conversion"
      reasoning: "All processes generate YAML artifacts. Centralized storage enables cross-process analysis, artifact reuse, and standard output format conversion (YAML → JSON/SARIF)."
      dependencies: ["C-012"]
      interfaces: ["I-013"]

    - id: "C-012"
      name: "Object Storage"
      type: "database"
      responsibility: "Blob storage for artifacts, diagrams, large reports (S3, Azure Blob)"
      reasoning: "Artifacts can be large (multi-MB YAML, Mermaid diagrams, PDFs). Need scalable, durable blob storage with lifecycle policies for cost management."
      dependencies: []
      interfaces: ["I-014"]

    - id: "C-013"
      name: "Process Definition Repository"
      type: "service"
      responsibility: "Store and serve workflow.md, schemas, patterns, configs for all processes"
      reasoning: "Processes are brownfield (existing workflow.md). This service acts as process registry, serving definitions to C-004. Enables process version management and hot-reloading."
      dependencies: ["C-012"]
      interfaces: ["I-015"]

    - id: "C-014"
      name: "LLM Integration Service"
      type: "service"
      responsibility: "Abstract LLM API calls (OpenAI, Anthropic, Azure OpenAI), prompt management, token tracking"
      reasoning: "Processes rely on Claude/GPT for analysis. Centralized service enables API key rotation, multi-provider failover, cost tracking, and prompt versioning."
      dependencies: []
      interfaces: ["I-016"]

    - id: "C-015"
      name: "PostgreSQL Database"
      type: "database"
      responsibility: "Relational data (users, jobs, metadata, audit logs), schema-per-tenant isolation"
      reasoning: "Need ACID guarantees for job state, user data, audit logs. Multi-tenant with schema-per-tenant provides isolation without separate DB instances (per A-102 assumption)."
      dependencies: []
      interfaces: ["I-017"]

    - id: "C-016"
      name: "Observability Stack"
      type: "service"
      responsibility: "Metrics, logs, traces aggregation (Prometheus, Grafana, Jaeger/Tempo)"
      reasoning: "Distributed system with 13 process services, queues, multiple DBs. Need centralized observability for debugging, performance monitoring, SLA tracking."
      dependencies: []
      interfaces: ["I-018"]

    - id: "C-017"
      name: "Dashboard UI"
      type: "component"
      responsibility: "Web UI for job monitoring, artifact viewing, compliance dashboards"
      reasoning: "Technical report identifies dashboard as standard expectation. Provides enterprise users visibility into long-running jobs, gate pass/fail status, and historical results."
      dependencies: ["C-001", "C-011", "C-016"]
      interfaces: ["I-019"]

    # === TIER 3: Integration Layer ===

    - id: "C-018"
      name: "MCP Server"
      type: "service"
      responsibility: "Model Context Protocol server for GitHub Copilot, Claude Code integration"
      reasoning: "Technical report Scenario 4 (MCP-First Marketplace) is recommended path. MCP enables developers to invoke processes from IDE/chat interfaces."
      dependencies: ["C-001"]
      interfaces: ["I-020"]

    - id: "C-019"
      name: "Webhook Dispatcher"
      type: "service"
      responsibility: "Outbound webhook delivery for job status, gate failures, completion events"
      reasoning: "Async long-running jobs need notification mechanism. Webhooks enable integration with Slack, email, CI/CD pipelines, external workflow systems."
      dependencies: ["C-003"]
      interfaces: ["I-021"]

    - id: "C-020"
      name: "CI/CD Integration Adapters"
      type: "service"
      responsibility: "GitHub Actions, Azure DevOps, GitLab CI plugins for process execution in pipelines"
      reasoning: "Technical report identifies CI/CD plugins as integration strategy. Enables automated compliance/risk checks in deployment pipelines."
      dependencies: ["C-001"]
      interfaces: ["I-022"]

    # === External Dependencies ===

    - id: "C-021"
      name: "External LLM APIs"
      type: "external"
      responsibility: "Claude API (Anthropic), GPT API (OpenAI), Azure OpenAI"
      reasoning: "Core dependency for all process execution. Must be available for process to run."
      dependencies: []
      interfaces: []

    - id: "C-022"
      name: "Customer Identity Providers"
      type: "external"
      responsibility: "Okta, Azure AD, Auth0 for SSO integration"
      reasoning: "Enterprise SSO requirement for seamless onboarding."
      dependencies: []
      interfaces: []

    - id: "C-023"
      name: "Cloud Platform Services"
      type: "external"
      responsibility: "AWS/Azure managed services (S3/Blob, SQS/Service Bus, CloudWatch/Monitor)"
      reasoning: "Platform relies on cloud primitives for storage, queuing, monitoring."
      dependencies: []
      interfaces: []

