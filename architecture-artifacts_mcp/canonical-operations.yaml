# OPERATION 8: INTERFACE DESIGN
# ══════════════════════════════════════════════

interface_design:
  interfaces:
    - id: "I-001"
      name: "Public REST API"
      type: "REST"
      provider: "C-001"
      consumers: ["EA-001", "EA-002", "EA-004", "C-017", "C-018", "C-020"]
      contract: |
        POST /v1/jobs - Submit job
          Request: { process_id, inputs: {...}, config: {...}, priority }
          Response: 202 Accepted { job_id, status: "queued", webhook_url (optional) }

        GET /v1/jobs/{job_id} - Get job status
          Response: { job_id, status, phase, gate_status, progress_pct, artifacts_url }

        GET /v1/jobs/{job_id}/artifacts - List artifacts
          Response: { artifacts: [{ name, type, url, size, timestamp }] }

        GET /v1/artifacts/{artifact_id} - Download artifact
          Response: YAML or JSON blob
      versioning: "URL versioning (/v1). Maintain backwards compatibility for N-1 versions."
      authentication: "Bearer token (JWT) from C-010. API key for service accounts."
      error_handling: "Standard HTTP codes: 400 (bad request), 401 (unauthorized), 404 (not found), 429 (rate limit), 500 (server error). Error response: { error_code, message, details }"

    - id: "I-002"
      name: "Public WebSocket API (optional for v2)"
      type: "WebSocket"
      provider: "C-001"
      consumers: ["C-017"]
      contract: |
        WS /v1/jobs/{job_id}/stream - Real-time job progress updates
          Messages: { event: "phase_started|gate_passed|gate_failed|completed", data: {...} }
      versioning: "Same as REST API"
      reasoning: "Dashboard UI needs real-time updates for long-running jobs. WebSocket reduces polling overhead. Optional for MVP."

    - id: "I-003"
      name: "Orchestrator Internal API"
      type: "gRPC"
      provider: "C-002"
      consumers: ["C-001"]
      contract: |
        rpc SubmitJob(JobRequest) returns (JobResponse)
        rpc GetJobStatus(JobId) returns (JobStatus)
        rpc CancelJob(JobId) returns (CancelResponse)
      versioning: "Protobuf versioning with field numbers. Backwards compatible."
      reasoning: "gRPC for internal service-to-service communication. Better performance than REST, type-safe contracts."

    - id: "I-004"
      name: "Orchestrator to Executor RPC"
