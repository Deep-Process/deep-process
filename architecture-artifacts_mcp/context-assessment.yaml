project:
  name: "Deep-* Process Enterprise Architecture"
  description: "Enterprise-grade architecture for delivering deep-* verification and governance processes to organizations via cloud platforms, APIs, and integration patterns. Focuses on making deep-explore, deep-architect, deep-compliance, deep-risk, deep-document, deep-challenge, deep-governance, deep-synthesis, deep-verify, deep-feasibility, deep-diagram, deep-monitoring, and deep-orchestration processes accessible and integratable into client systems."
  scope: "Platform architecture for hosting, orchestrating, and integrating 13 deep-* processes (excluding deep-process meta-process). Includes deployment models, API design, integration patterns, security tiers, observability, multi-tenancy considerations, and developer experience."
  constraints_summary: "Must preserve process integrity (gates, counter-checks, EVR compliance), support both cloud and on-premise deployment for regulatory scenarios, enable API/CLI/MCP integration modes, handle long-running operations (processes can take 2-24 hours), support both synchronous and asynchronous execution."

system_maturity:
  classification: "brownfield"
  reason: "Processes already exist as CLI tools with established workflow.md patterns, YAML schemas, and gate mechanisms. Architecture task is to DELIVER these existing processes via enterprise platforms, not to redesign the processes themselves."
  existing_system:
    name: "Deep-* Process Collection (CLI-based)"
    age_years: 0.5
    codebase_size: "medium (estimated 10-50K LOC across 13 processes)"
    known_problems:
      - "CLI-only execution limits enterprise adoption"
      - "No centralized orchestration for multi-process workflows"
      - "Manual result aggregation across processes"
      - "No built-in observability dashboard"
      - "Limited integration with enterprise tooling (GitHub, Azure DevOps, Jira)"
    constraints_from_existing:
      - "Must preserve existing workflow.md structure (gates, phases, steps)"
      - "Cannot modify core process logic (EVR, counter-checks, assumptions)"
      - "Must support existing YAML artifact schemas"
      - "Must maintain CLI compatibility for local developer use"
    migration_scope: "incremental"
    migration_strategy: "Add enterprise delivery layer WITHOUT modifying existing process implementations. CLI remains primary interface, platform provides orchestration, integration, and observability layers."

project_scale:
  classification: "large"
  indicators:
    expected_components: "20-30 (13 process services + orchestrator + API gateway + auth + observability + storage + integration adapters)"
    team_size: "15-20"
    expected_integrations: "10+ (GitHub, Azure DevOps, Jira, Slack, email, MCP servers, CI/CD pipelines, S3/Blob Storage, logging platforms)"
    regulatory_requirements: "extensive (SOC 2, GDPR, HIPAA for compliance processes, EU AI Act for governance)"
  depth_calibration:
    proportionality_check: "PASS — large-scale project warrants deep depth analysis"
    note: "Enterprise architecture with heavy compliance, multiple integrations, cross-functional buyers (per technical-delivery-architecture-report.md findings) requires thorough analysis."

