conways_law:
  team_units:
    - name: "Platform Core Team"
      size: 5
      ownership: ["C-ORCHESTRATOR", "C-API-GATEWAY", "C-AUTH", "C-STORAGE"]
      communication_channels: ["Process Teams", "DevOps Team", "Security Team"]

    - name: "Process Integration Team"
      size: 4
      ownership: ["C-PROCESS-ADAPTER-*", "C-MCP-SERVER", "C-CLI-WRAPPER"]
      communication_channels: ["Platform Core Team", "External Dev Community"]

    - name: "Observability & Monitoring Team"
      size: 3
      ownership: ["C-DASHBOARD", "C-METRICS", "C-LOGGING", "C-ALERTING"]
      communication_channels: ["Platform Core Team", "SRE Team"]

    - name: "Security & Compliance Team"
      size: 3
      ownership: ["C-IAM", "C-SECRETS-MGMT", "C-AUDIT-TRAIL", "C-COMPLIANCE-ENGINE"]
      communication_channels: ["All Teams", "External Auditors"]

  alignment_assessment:
    team_to_system_match: "aligned"
    misalignment_risks: []
    recommendations:
      - "Assign clear ownership boundaries between Platform Core (horizontal infrastructure) and Process Integration (vertical process adapters)"
      - "Establish API contracts early to minimize cross-team dependencies"
      - "Co-locate Security & Compliance team with Process Integration for compliance-heavy processes (deep-compliance, deep-governance)"

constraints:
  budget:
    level: "moderate"
    details: "Startup/scaleup scenario based on technical report (Scenario 4: MCP-First Marketplace Quick-Win recommended with $50K-$200K investment). Not generous enterprise budget, but sufficient for MVP + iteration."

  timeline:
    level: "normal"
    details: "Technical report indicates 4-12 months for marketplace launch (Scenario 4), 3-6 months for SaaS MVP (Scenario 1). No urgent regulatory deadline, but competitive pressure (report notes 'Competitor launches faster' as medium likelihood failure mode)."

  culture:
    type: "startup"
    details: "Technical report emphasizes developer-first GTM, bottoms-up motion, marketplace discovery, self-service onboarding — all startup culture indicators. Not corporate (no procurement friction mentioned as benefit). Not regulated entity (though processes serve regulated customers)."

  technical:
    - constraint: "Processes are long-running (2-24 hours per technical report config.yaml timeouts)"
      impact: "Must support asynchronous execution, job queuing, progress tracking, timeout handling. Cannot use synchronous HTTP-only APIs."

    - constraint: "Existing YAML artifact schemas must be preserved"
      impact: "Storage layer must handle YAML natively or convert losslessly. API responses should support YAML in addition to JSON."

    - constraint: "CLI must remain functional for local developer use"
      impact: "Platform must wrap/augment CLI, not replace it. Hybrid local+cloud execution model needed."

    - constraint: "Gates and counter-checks are mandatory (per process integrity requirements)"
      impact: "Orchestration layer cannot skip or bypass gates. Must surface gate failures to users/APIs."

    - constraint: "Multiple cloud platforms (AWS, Azure) mentioned in report"
      impact: "Architecture should be cloud-agnostic where possible, or provide deployment patterns for both AWS and Azure."

  regulatory:
    - regulation: "SOC 2 Type II"
      impact: "Required for enterprise SaaS sales per technical report. 6-12 month timeline. Must implement access controls, audit logging, encryption, incident response. Blocks enterprise revenue until certified."

    - regulation: "GDPR"
      impact: "EU AI Act + GDPR dual compliance for high-risk AI processes with personal data (per technical report). Must support data residency, right to deletion, consent management, data minimization."

    - regulation: "HIPAA"
      impact: "Single-tenant required for HIPAA customers (per technical report). Must support BAA, encryption at rest/in transit, audit trails, access controls."

    - regulation: "EU AI Act"
      impact: "High-risk AI classification requires FRIA + transparency + human oversight. Deep-governance and deep-compliance processes themselves may be subject to EU AI Act requirements."

requirements_stability:
  score: 0.55
  rationale: "Medium stability. Core process logic is stable (brownfield constraint), but enterprise delivery requirements are evolving based on market feedback (technical report shows 16 assumptions, 5 critical unknowns still open). Deployment models, integration patterns, and GTM strategy are still being validated."
  evidence:
    - factor: "Core process workflows (workflow.md, gates, EVR) are established"
      direction: "stable"
      weight: 0.35

    - factor: "Technical report shows 5 critical unknowns (tiered deployment need, marketplace activation rate, SOC 2 timeline, failure cases, customer TCO)"
      direction: "unstable"
      weight: 0.25

    - factor: "Integration strategy has multiple options (MCP vs REST vs SDK vs CI/CD plugins)"
      direction: "unstable"
      weight: 0.20

    - factor: "Deployment model choice still being validated (SaaS vs Hybrid vs On-Prem vs Marketplace)"
      direction: "unstable"
      weight: 0.20

    - factor: "Team and organizational constraints are clear (startup culture, moderate budget, normal timeline)"
      direction: "stable"
      weight: 0.00

execution_mode:
  selected: "hybrid"
  rationale: "Stability score 0.55 falls in medium range (0.4-0.7 per config.yaml), indicating hybrid mode. Team maturity is high (can handle iterative), but brownfield constraints (must preserve existing process structure) favor some waterfall elements. Cloud domain typically supports hybrid. Technical report shows iterative validation (3-5 enterprise interviews, marketplace analytics) alongside structured architecture decisions."
  derived_from:
    stability_score: 0.55
    team_maturity: "high"
    domain: "cloud"

assumptions:
  - id: "A-001"
    assumption: "Processes can be containerized without modification to their core logic"
    confidence: 0.80
    falsification: "Attempt to package deep-explore, deep-architect, deep-compliance as Docker containers. If core workflow.md execution fails or gates break, assumption is false."
    impact_if_wrong: "Major architecture redesign required. May need to fork/modify process implementations to support containerization, violating brownfield constraint."

  - id: "A-002"
    assumption: "Long-running processes (2-24 hours) are acceptable in async execution mode with status polling"
    confidence: 0.75
    falsification: "Interview 3-5 enterprise users on acceptable wait times for compliance/risk/architecture processes. If >60% demand <1 hour results, assumption is false."
    impact_if_wrong: "Need to implement incremental/streaming results, process optimization, or rewrite processes for parallelization."

  - id: "A-003"
    assumption: "Enterprises will accept MCP protocol for integration (per technical report Scenario 4 recommendation)"
    confidence: 0.65
    falsification: "Survey 10 enterprise IT teams on MCP awareness and adoption willingness. If <30% familiar with MCP or willing to adopt, assumption is weak."
    impact_if_wrong: "Must prioritize REST API + Webhooks (Scenario 1) over MCP-first approach, delaying marketplace GTM."

  - id: "A-004"
    assumption: "Multi-tenant architecture with separate schemas provides sufficient isolation for non-HIPAA customers"
    confidence: 0.70
    falsification: "Conduct security audit of schema-based multi-tenancy. If cross-tenant data leakage is feasible or violates GDPR/SOC 2, assumption is false."
    impact_if_wrong: "Must implement separate database per tenant (higher cost, complexity) or limit to single-tenant only (limits scale)."

  - id: "A-005"
    assumption: "Technical delivery architecture report findings (MCP adoption, SOC 2 timelines, multi-tenant patterns) are applicable to deep-* process platform"
    confidence: 0.85
    falsification: "Verify report findings against deep-* process-specific constraints (long-running jobs, YAML artifacts, gate enforcement). If findings assume short-lived request/response APIs, assumption is false."
    impact_if_wrong: "Report-based architecture decisions (Scenario 4 recommendation, hybrid deployment) may not apply. Need fresh research specific to workflow orchestration platforms."

  - id: "A-006"
    assumption: "13 processes can share a common orchestration layer without process-specific customization"
    confidence: 0.60
    falsification: "Analyze workflow.md, gate conditions, artifact schemas across all 13 processes. If >30% of processes require unique orchestration logic, assumption is false."
    impact_if_wrong: "Need process-specific orchestration adapters, increasing complexity and maintenance burden."

  - id: "A-007"
    assumption: "Kubernetes is necessary for production deployment (per technical report: 'Kubernetes dominates 66% use for GenAI workloads')"
    confidence: 0.70
    falsification: "Prototype deployment on serverless-only architecture (AWS Lambda + Step Functions). If it meets scale, cost, and reliability requirements, K8s may not be necessary."
    impact_if_wrong: "Over-engineering with K8s when simpler serverless could suffice, or under-engineering if K8s capabilities (stateful sets, complex networking) are actually needed."

