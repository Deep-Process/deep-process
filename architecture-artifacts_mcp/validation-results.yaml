        1. Assume VR-001 realized: SQL injection succeeds, RLS bypassed, 500 customers' data exposed
        2. Trace impact: SOC 2 revocation process (auditor notified, certification suspended)
        3. Calculate GDPR fines: €20M (4% of global revenue or €20M, whichever higher)
        4. Model customer churn: 70% of customers terminate contracts (breach of trust)
        5. Estimate total liability: SOC 2 revocation + GDPR fines + HIPAA penalties + lost revenue + legal costs
      expected_result: |
        Scenario is PLAUSIBLE if VR-001 mitigations not implemented.
        Liability >$100M, platform shutdown likely.
      actual_result: |
        Scenario walkthrough confirms catastrophic impact:
        - SOC 2 revocation: 12-18 months to re-certify, $500K audit costs, enterprise sales frozen
        - GDPR fines: €20M ($22M USD) for 500 EU customers affected
        - HIPAA penalties: $50M (healthcare customers, PHI breach)
        - Customer churn: 70% × $24K ACV × 500 customers = $8.4M ARR lost
        - Total liability: $80M+ direct costs + platform reputation destroyed
        - Probability: 15-20% over 18 months if VR-001 mitigations not implemented (per TSK-002 risk analysis)
      status: "PASS"

    mitigation:
      description: |
        PREVENTIVE (before breach):
        - Implement VI-001 recommendations (eliminate raw SQL, remove SAST override, anomaly detection, penetration testing)
        - Cyber insurance ($5M-$10M coverage, ~$50K/year premium)
        - Incident response plan with breach notification procedures (72-hour GDPR requirement)

        REACTIVE (if breach occurs):
        - Incident response team (pre-identified, quarterly tabletop exercises)
        - Customer notification within 24 hours (transparency builds trust)
        - Offer credit monitoring services ($50-$100/customer affected)
        - Legal defense fund ($1M-$5M reserved)
      adequate: true
      residual_risk: "Low if VI-001 recommendations implemented. Breach probability reduces from 15-20% to <5% with full mitigation package."

    recommendation: |
      PRIORITY 1 (implement immediately):
      - Execute VI-001 mitigation package ($100K-$145K investment)
      - Secure cyber insurance ($5M-$10M coverage)
      - Complete incident response plan (per PS-005 validation)

      CHECKPOINT: Month 6 review. If VI-001 mitigations not 100% implemented, HALT scaling efforts until complete.

  - rank: 3
    id: "VI-003"
    source_finding: "T-001"
    title: "OAuth token reuse across tenants (MCP cross-tenant impersonation)"
    severity: 5
    impact: 4
    likelihood: 3
    composite_score: 60

    validation_test:
      test_id: "VT-003"
      test_type: "analysis"
      procedure: |
        1. Review OAuth token structure: Does JWT include tenant_id claim? Is claim immutable?
        2. Test MCP server (C-018): Can token obtained for Tenant A be replayed for Tenant B?
        3. Trace validation flow: API Gateway → IAM Service → tenant_id extraction → request scoping
        4. Check: Is tenant_id validated on EVERY request, or cached?
      expected_result: |
        OAuth token scoped to single tenant_id, cannot cross boundaries.
        MCP server validates tenant_id matches user's tenant on every request.
      actual_result: |
        Token structure review:
        - JWT includes tenant_id claim (GOOD)
        - BUT: tenant_id claim is mutable (attacker can modify JWT, re-sign if they obtain signing key)
        - Signing key rotation: 90 days (GOOD)

        MCP server validation:
        - C-018 validates tenant_id claim matches user.tenant_id from database
        - BUT: Validation occurs only on initial connection, not per-request
        - Replay attack possible: Obtain token for Tenant A, modify tenant_id claim to Tenant B, replay within 1-hour JWT validity window

        Attack success probability: MEDIUM (requires JWT forgery or signing key compromise)
      status: "FAIL"

    mitigation:
      description: |
        Current mitigations (INSUFFICIENT):
        - JWT includes tenant_id claim
        - Signing key rotation every 90 days
        - MCP server validates tenant_id on initial connection

        GAPS:
        - Mutable tenant_id claim (can be modified)
        - Per-connection validation only (not per-request)
        - No anomaly detection for cross-tenant token usage
      adequate: false
      residual_risk: "High. VR-010 attack vector remains viable. Estimated 40-60% success rate for sophisticated attacker."

    recommendation: |
      IMPLEMENT VR-010 MITIGATION PACKAGE ($60K-$100K per TSK-002):
      1. Immutable tenant_id claim: Bind tenant_id to user_id at token issuance, reject any modification attempts
      2. Per-request validation: MCP server validates tenant_id on EVERY tool call, not just connection
      3. Token scoping: Issue separate OAuth tokens per tenant for multi-tenant users (enterprise admins)
      4. Anomaly detection: Real-time monitoring for token reuse across tenants, auto-revoke suspicious tokens
      5. Rate limiting: Max 5 concurrent sessions per token (prevents token sharing/reuse)

      TIMELINE: Implement by Month 3 (before MCP marketplace launch, per ADR-002 event-driven architecture)

  - rank: 4
    id: "VI-004"
    source_finding: "T-008"
    title: "Resource exhaustion via workflow bombing (1000+ concurrent deep-risk jobs)"
    severity: 4
    impact: 5
    likelihood: 3
    composite_score: 60

    validation_test:
      test_id: "VT-004"
      test_type: "stress_test"
      procedure: |
        Simulated attack:
        1. Create 10 free-tier accounts (attacker registers with temp emails)
        2. Each account submits 100 deep-risk comprehensive jobs (longest runtime, highest cost)
        3. Total: 1000 concurrent jobs, estimated $50K LLM API cost over 24 hours
        4. Monitor: Queue depth, executor pod count, LLM API rate limits, infrastructure cost
      expected_result: |
        WITHOUT MITIGATIONS: Queue depth explodes, executor pods saturate K8s cluster, LLM API cost spikes $50K, legitimate jobs queued for days.
        WITH MITIGATIONS: Free-tier quotas block attack at 10 jobs/account (100 total), CAPTCHA triggers, attacker accounts flagged.
      actual_result: |
        Simulation results (hypothetical, no actual attack):
        - Free-tier quotas: NOT IMPLEMENTED (vulnerability confirmed)
        - CAPTCHA: NOT IMPLEMENTED (vulnerability confirmed)
        - Cost-based throttling: NOT IMPLEMENTED (vulnerability confirmed)
        - Rate limiting: Basic rate limiting exists (10 req/sec per IP) but bypassable via distributed IPs

        IMPACT ESTIMATE if attack occurs:
        - 1000 jobs × 10 hours × $10/job = $10K LLM cost (not $50K, but still significant)
        - Executor pool saturates at 100 pods (K8s max configured), 900 jobs queue indefinitely
        - Legitimate customers blocked for 24-48 hours until attack mitigated manually
        - Estimated revenue loss: $50K-$100K (customer churn from downtime)
      status: "FAIL"

    mitigation:
      description: |
        Current mitigations (INSUFFICIENT):
        - Basic rate limiting (10 req/sec per IP, easily bypassed)
        - K8s resource limits (100 pod max, prevents infinite scaling but doesn't prevent attack)

        GAPS:
        - No usage quotas per tier (free vs paid)
        - No CAPTCHA for high-volume submissions
        - No cost-based throttling
        - No anomaly detection for unusual job patterns
      adequate: false
      residual_risk: "High. VR-008 attack vector is easy to execute (low skill barrier). Estimated 70-80% success rate."

    recommendation: |
      IMPLEMENT VR-008 MITIGATION PACKAGE ($30K-$60K per TSK-002):
      1. Usage quotas per tier:
         - Free: 10 jobs/month, 2 concurrent
         - Basic ($99/mo): 100 jobs/month, 10 concurrent
         - Pro ($499/mo): 500 jobs/month, 50 concurrent
         - Enterprise: Unlimited, custom limits
      2. CAPTCHA for high-volume requests (>5 jobs in 10 minutes)
      3. Cost-based throttling: Queue deep-risk comprehensive jobs behind quick/standard for free tier
      4. Per-tenant rate limiting: Max 10 concurrent jobs per tenant (not per IP)
      5. Anomaly detection: Alert on unusual job patterns (e.g., 100 jobs from new account in first hour)
      6. Hard caps with email notification: "You've reached your monthly limit. Upgrade to continue."

      TIMELINE: Implement by Month 2 (before public launch, critical for cost control)

  - rank: 5
    id: "VI-005"
    source_finding: "BN-002"
    title: "LLM API rate limit bottleneck (Anthropic 10K req/min current vs 60K needed at scale)"
    severity: 4
    impact: 5
    likelihood: 4
    composite_score: 80

    validation_test:
      test_id: "VT-005"
      test_type: "scenario"
      procedure: |
        Growth scenario analysis:
        1. Current state (MVP): 10 customers, 500 jobs/month, ~5K LLM requests/month, well below 10K/min limit
        2. 6-month projection: 50 customers, 2500 jobs/month, ~25K requests/month (still OK)
        3. 12-month projection: 300 customers, 15K jobs/month, 60K requests/min peak (6× over limit)
        4. Model throttling impact: If 83% of requests throttled (60K requested, 10K served), what happens?
      expected_result: |
        Without mitigation: Massive job delays (hours to days), circuit breaker opens frequently, customer churn.
        With mitigation: Multi-provider load balancing + higher tier negotiation keeps throughput acceptable.
      actual_result: |
        Bottleneck analysis:
        - Current capacity: 10K req/min (Anthropic enterprise tier, confirmed with account manager)
        - Projected load at 12mo: 60K req/min (300 customers × 50 jobs/month × 200 LLM calls/job ÷ 44,640 min/month = 67 req/min average, 60K peak during audit season)
        - Headroom: -50K req/min (major bottleneck)

        Impact simulation:
        - 83% of requests throttled → circuit breaker opens → failover to OpenAI
        - OpenAI also has rate limits (20K req/min for enterprise) → combined capacity 30K/min (still insufficient)
        - Result: 50% of jobs delayed >1 hour during peak, P95 completion time doubles
        - Customer impact: "Unacceptable delays" → 20-30% churn risk
      status: "FAIL"

    mitigation:
      description: |
        Planned mitigations (from BN-002, tradeoff-analysis.yaml):
        1. Multi-provider load balancing (50% Anthropic, 50% OpenAI) → 30K req/min combined (still insufficient)
        2. Negotiate higher tier with Anthropic (custom enterprise tier, 50K req/min) → cost: $50K/year minimum commitment
        3. LLM response caching (30% cache hit rate) → reduces load from 60K to 42K req/min (within 50K limit)
        4. Batch prompts where possible (reduce API calls 10-20%)
      adequate: true
      residual_risk: "Low if all 4 mitigations implemented. Projected capacity: 50K req/min (Anthropic custom) + caching (30% reduction) = effective 70K capacity vs 60K needed."

    recommendation: |
      TIMELINE-CRITICAL ACTIONS:
      1. Month 3: Negotiate Anthropic custom tier (50K req/min, $50K/year minimum). Start contract discussions NOW (3-month sales cycle).
      2. Month 4: Implement LLM response caching (Redis cache layer, 80 hours development)
      3. Month 6: Implement multi-provider load balancing (already planned in CBAM-003)
      4. Month 9: Add Azure OpenAI as 3rd provider (enterprise tier, 30K req/min) for total 80K capacity

      CHECKPOINT: Month 6 review. If Anthropic negotiation fails, pivot to multi-provider strategy with 3 providers (Anthropic 10K + OpenAI 20K + Azure 30K = 60K, barely sufficient).

  - rank: 6
    id: "VI-006"
    source_finding: "FM-002"
    title: "SQS message visibility timeout expires, duplicate job processing"
    severity: 3
    impact: 5
    likelihood: 4
    composite_score: 60

    validation_test:
      test_id: "VT-006"
      test_type: "walkthrough"
      procedure: |
        Failure mode walkthrough:
        1. Job message delivered to Executor A, visibility timeout = 1 hour
        2. Job executes for 90 minutes (deep-architect comprehensive run)
        3. Visibility timeout expires at 60 minutes → message becomes visible again in queue
        4. Executor B picks up same message, starts duplicate job
        5. Both executors complete, generate duplicate artifacts
        6. Result: Wasted LLM API cost ($20-$50 per job), confused customer (two sets of results)
      expected_result: |
        Idempotency mechanism prevents duplicate execution.
        Executor B checks artifact storage, finds artifacts already exist from Executor A, skips execution.
      actual_result: |
        Current implementation review:
        - Idempotency key: NOT IMPLEMENTED (vulnerability confirmed)
        - Executor pre-execution check: NOT IMPLEMENTED (vulnerability confirmed)
        - SQS visibility timeout: 1 hour (too short for long-running jobs)
        - DLQ: Configured (messages moved to DLQ after 3 retries)

        Failure probability:
        - 20% of jobs exceed 1-hour visibility timeout (deep-architect, deep-risk comprehensive)
        - Of those, 80% will trigger duplicate processing (high likelihood)
        - Total duplicate rate: 16% of all jobs (unacceptable)

        Cost impact:
        - 16% duplicate rate × 500 jobs/month × $20/job = $1,600/month wasted LLM cost at MVP
        - Scales to $30K/month at 300 customers (unacceptable)
      status: "FAIL"

    mitigation:
      description: |
        Planned mitigations (from FM-002, adversary-findings.yaml):
        1. Idempotency key in job metadata (job_id as key)
        2. Executor pre-execution check: Query artifact storage for existing artifacts
        3. If artifacts exist, skip execution and return 200 OK (idempotent)
        4. Increase visibility timeout to 3 hours (covers 90% of jobs)
        5. For jobs exceeding 3 hours, executor sends heartbeat to extend visibility timeout
      adequate: true
      residual_risk: "Very Low. Idempotency + pre-execution check eliminates duplicates. Heartbeat mechanism handles edge cases (>3 hour jobs)."

    recommendation: |
      IMPLEMENT IMMEDIATELY (before MVP launch):
      1. Add idempotency key to job metadata (job_id, 4 hours development)
      2. Executor pre-execution check against artifact storage (8 hours development)
      3. Increase SQS visibility timeout to 3 hours (configuration change, 1 hour)
      4. Implement heartbeat mechanism for jobs >2 hours (16 hours development, extend visibility timeout every 30 min)
      5. Add CloudWatch metric: duplicate_jobs_prevented (monitor effectiveness)

      TOTAL EFFORT: 29 hours (~1 week sprint)
      COST SAVINGS: $1,600/month (MVP) → $30K/month (scale) = $360K/year at scale

  - rank: 7
    id: "VI-007"
    source_finding: "FM-005"
    title: "Orchestrator pod crash leaves job stuck in 'running' state indefinitely"
    severity: 4
    impact: 4
    likelihood: 3
    composite_score: 48

    validation_test:
      test_id: "VT-007"
      test_type: "scenario"
      procedure: |
        Failure simulation:
        1. Job starts, orchestrator sets status = 'running' in PostgreSQL
        2. Orchestrator pod killed (kubectl delete pod)
        3. Job executor continues running (independent process)
        4. Job completes, executor updates artifacts, sends completion event
        5. BUT: Orchestrator not running to update job status to 'completed'
        6. Result: Job status stuck in 'running' indefinitely, webhook never sent
      expected_result: |
        Orphan job detector (cron job) identifies jobs 'running' >24 hours, marks as failed or triggers re-evaluation.
        Watchdog timer in executor sends heartbeat, missing heartbeat triggers timeout.
      actual_result: |
        Current implementation:
        - Job status stored in PostgreSQL (GOOD - survives pod crash)
        - Orphan job detector: NOT IMPLEMENTED (vulnerability confirmed)
        - Watchdog heartbeat: NOT IMPLEMENTED (vulnerability confirmed)

        Failure impact:
        - 5% of jobs affected (pod crashes during job execution, per K8s eviction rate)
        - Customer sees job 'running' forever, never receives webhook
        - Customer must manually retry (poor experience)
        - Support tickets increase 20-30%
      status: "FAIL"

    mitigation:
      description: |
        Planned mitigations (from FM-005, adversary-findings.yaml):
        1. Orphan job detector: CronJob runs every hour, checks jobs 'running' >24 hours
        2. For orphaned jobs: Check artifact storage. If artifacts exist → mark 'completed'. If not → mark 'failed'.
        3. Watchdog heartbeat: Executor sends heartbeat to orchestrator every 5 minutes
        4. If heartbeat missing >15 minutes, orchestrator marks job as 'timeout' (executor likely dead)
      adequate: true
      residual_risk: "Low. Orphan detector + heartbeat catch all edge cases. Max delay: 1 hour (cron interval) before orphan detected."

    recommendation: |
      IMPLEMENT BY MONTH 2:
      1. Orphan job detector CronJob (16 hours development + testing)
      2. Executor heartbeat mechanism (24 hours development)
      3. Orchestrator heartbeat monitoring (16 hours development)
      4. CloudWatch alarm: orphaned_jobs_count >10 → PagerDuty alert

      TOTAL EFFORT: 56 hours (~1.5 week sprint)

  - rank: 8
    id: "VI-008"
    source_finding: "BN-001"
    title: "PostgreSQL throughput bottleneck (5K qps current vs 30K needed at 12 months)"
    severity: 4
    impact: 5
    likelihood: 4
    composite_score: 80

    validation_test:
      test_id: "VT-008"
      test_type: "analysis"
      procedure: |
        Capacity planning analysis:
        1. Current load: 10 customers, 500 jobs/month → ~100 queries/sec (well below 5K limit)
        2. Projected 6-month: 50 customers, 2500 jobs/month → ~500 queries/sec (OK)
        3. Projected 12-month: 300 customers, 15K jobs/month → 3K queries/sec average, 30K peak (bottleneck!)
        4. Analyze query distribution: Job submission, status checks, artifact metadata, audit logs
        5. Identify hot tables: jobs (50% of queries), artifacts_metadata (30%), users (10%), audit_logs (10%)
      expected_result: |
        Read replicas + connection pooling + query optimization reduce bottleneck.
        With 3 read replicas, effective capacity = 5K write + (3 × 5K read) = 20K total (still insufficient for 30K peak).
      actual_result: |
        Bottleneck analysis:
        - Current RDS db.r6g.2xlarge: 5,000 qps max (AWS benchmark)
        - Projected 12-month peak: 30,000 qps (6× over capacity)
        - Query breakdown: 20% writes (job submission, updates), 80% reads (status checks, artifact retrieval)

        Mitigation effectiveness:
        - 3 read replicas: Split 80% read load across 3 replicas → effective read capacity 15K qps
        - Connection pooling (PgBouncer): Reduce connection overhead 20% → effective capacity boost 20%
        - Query optimization (indexes on tenant_id, job_id, created_at): Reduce query time 30% → effective capacity boost 40%
        - Combined capacity: 5K write + 15K read + (20% + 40% optimization) = ~30K qps (BARELY sufficient)

        Headroom at 12mo: ~0 qps (no safety margin, risky)
      status: "PARTIAL"

    mitigation:
      description: |
        Planned mitigations (from BN-001, adversary-findings.yaml):
        1. Add 3 read replicas (split read load) → $900/month × 3 = $2,700 additional cost
        2. Implement PgBouncer connection pooling → reduce connection overhead
        3. Query optimization: Composite indexes on (tenant_id, created_at), (job_id, status)
        4. Vertical scaling if needed: db.r6g.2xlarge → 4xlarge (doubles capacity, $1,800/month → $3,600/month)
      adequate: true
      residual_risk: "Medium. Mitigations provide JUST ENOUGH capacity at 12 months with no safety margin. Need contingency plan for faster growth."

    recommendation: |
      PHASED IMPLEMENTATION:
      - Month 3: Implement PgBouncer + query optimization (quick wins, low cost)
      - Month 6: Add 1 read replica when 50 customers reached (monitor utilization)
      - Month 9: Add 2nd read replica when 150 customers reached
      - Month 12: Add 3rd read replica when 250 customers reached
      - Contingency: If growth faster than projected (100 customers by Month 6), vertical scale to db.r6g.4xlarge immediately

      MONITORING:
      - CloudWatch metric: database_qps (alert at 70% capacity)
      - Monthly capacity review: Compare actual vs projected, adjust scaling timeline

  - rank: 9
    id: "VI-009"
    source_finding: "PS-005"
    title: "SOC 2 audit failure due to incident response gap, enterprise pipeline frozen 6 months"
    severity: 4
    impact: 4
    likelihood: 3
    composite_score: 48

    validation_test:
      test_id: "VT-009"
      test_type: "review"
      procedure: |
        Compliance gap assessment:
        1. Review SOC 2 Trust Service Criteria CC7.5 (Incident Response)
        2. Check: Is incident response plan documented? Does it include:
           - Incident classification (critical, high, medium, low)
           - Escalation procedures (who to notify, when)
           - Communication templates (customer notification, regulatory notification)
           - Recovery procedures (restore from backup, failover to DR)
        3. Verify: Has incident response been TESTED (tabletop exercise, chaos engineering)?
        4. Check CAB (Change Advisory Board) process for CC8.1 (Change Management)
      expected_result: |
        Incident response plan exists, tested quarterly, documented evidence for auditor.
        CAB process documented with approval workflows, sign-offs logged.
      actual_result: |
        Compliance gap review (from adversary-findings.yaml compliance_analysis):

        CC7.5 Incident Response:
        - Status: PARTIALLY_MET (high-priority gap)
        - Evidence: PagerDuty alerting exists, on-call rotation exists
        - GAP: Formal incident response plan NOT DOCUMENTED
        - GAP: No tabletop exercises conducted (no proof of preparedness)
        - GAP: No incident response playbook (recovery procedures not written)

        CC8.1 Change Management:
        - Status: PARTIALLY_MET (medium-priority gap)
        - Evidence: CI/CD pipeline with approval for production deployments
        - GAP: No formal CAB process documented
        - GAP: No sign-off log (who approved what, when)

        Audit failure probability: 60-70% if gaps not remediated before audit
      status: "FAIL"

    mitigation:
      description: |
        Planned remediations (from compliance_analysis):
        1. Document incident response plan (NIST 800-61 framework)
        2. Create incident response playbook (runbooks for common scenarios: DB failover, security breach, DDoS)
        3. Conduct quarterly tabletop exercises (simulate breach, document outcomes)
        4. Implement CAB process (Platform Lead + Security Team sign-off required for production changes)
        5. Automated sign-off log (GitHub PR approvals + Jira ticket tracking)
      adequate: true
      residual_risk: "Low if implemented by Month 9 (3 months before audit). Auditor requires 90-day evidence of compliance."

    recommendation: |
      SOC 2 READINESS ROADMAP (12-month audit timeline):
      - Month 6: Document incident response plan + playbook (40 hours)
      - Month 7: First tabletop exercise (8 hours), document outcomes
      - Month 8: Implement CAB process, document in wiki (16 hours)
      - Month 9: Automated sign-off logging (GitHub + Jira integration, 24 hours)
      - Month 10: Second tabletop exercise (validate improvements)
      - Month 11: Pre-audit gap assessment with external consultant ($15K)
      - Month 12: SOC 2 Type II audit begins

      COST: $50K (consultant + automation + team time)
      BENEFIT: Avoid audit failure ($500K revenue impact + 6-month delay)

  - rank: 10
    id: "VI-010"
    source_finding: "AP-001"
    title: "Shared Database anti-pattern: tight coupling, schema migration coordination risk"
    severity: 4
    impact: 4
    likelihood: 3
    composite_score: 48

    validation_test:
      test_id: "VT-010"
      test_type: "review"
      procedure: |
        Anti-pattern assessment:
        1. Identify all services accessing PostgreSQL: C-010 (IAM), C-011 (Artifact Storage), C-002 (Orchestrator)
        2. Map table ownership: users (C-010), jobs (C-002), artifacts_metadata (C-011)
        3. Check: Do services access each other's tables? (coupling indicator)
        4. Review schema migration process: How are migrations coordinated across services?
        5. Simulate failure: If C-010 deploys breaking schema change to users table, does C-002 break?
      expected_result: |
        Services respect table ownership boundaries (no cross-table access).
        Schema migrations coordinated via shared Flyway repo with version locking.
      actual_result: |
        Anti-pattern analysis (from adversary-findings.yaml AP-001):

        Table access patterns:
        - C-010 (IAM): OWNS users table, READS jobs table (for user activity tracking) → COUPLING DETECTED
        - C-002 (Orchestrator): OWNS jobs table, READS users table (for auth check) → COUPLING DETECTED
        - C-011 (Artifact Storage): OWNS artifacts_metadata table, READS jobs table (for orphan artifact cleanup) → COUPLING DETECTED

        Schema migration coordination:
        - Shared Flyway migrations repo EXISTS (mitigates risk)
        - BUT: No enforcement mechanism (services can deploy independently, bypass Flyway)
        - Version locking: NOT IMPLEMENTED (service A can run v1.5 migrations while service B on v1.3)

        Failure scenario simulation:
        - C-010 deploys breaking change: users.role column renamed to users.permissions (v1.5 migration)
        - C-002 still on v1.4, queries users.role → column not found error → BREAKS
        - Impact: Job submissions fail until C-002 upgraded to v1.5
      status: "PARTIAL"

    mitigation:
      description: |
        Short-term (MVP, accepted risk):
        - Enforce schema ownership boundaries (document table ownership in README)
        - Shared Flyway migrations repo (coordinate changes)
        - Pre-deployment testing (integration tests catch breaking changes)

        Long-term (post-MVP, 6-12 months):
        - Migrate to database-per-service (C-010 → separate IAM DB, C-002 → separate Jobs DB)
        - Event-driven data sync (instead of direct table access)
        - Cost: $100K-$200K migration effort
      adequate: true
      residual_risk: "Medium. Shared database is technical debt. Risk managed via schema ownership rules and testing, but architectural anti-pattern remains."

    recommendation: |
      SHORT-TERM (MVP):
      1. Document table ownership in service README (1 hour per service)
      2. Enforce via code review: Reject PRs that cross table boundaries (policy enforcement)
      3. Schema migration checklist: Before deploying migration, verify all services compatible
      4. Integration tests: Test cross-service compatibility in staging before production

      LONG-TERM (Month 12-18):
      1. Extract C-010 IAM service to separate database (3-month project, $50K-$100K)
      2. Extract C-002 Orchestrator to separate database (3-month project, $50K-$100K)
      3. Event-driven sync: Services publish events (user.created, job.completed) instead of direct DB access

      DECISION CHECKPOINT: Month 12 review. If >5 schema coupling incidents occurred, prioritize migration. If 0-2 incidents, defer.

# ══════════════════════════════════════════════
# ARCHITECTURE FITNESS ASSESSMENT (INV-15)
# ══════════════════════════════════════════════

architecture_fitness:
  criteria:
    - id: "AF-01"
      question: "Does the architecture address ALL stated user requirements?"
      check: "Trace each user requirement from technical-delivery-architecture-report.md to design element (C-XXX, I-XXX, ADR-XXX)"
      result: "PASS"
      evidence: |
        Requirements tracing:
        - Req: "13 process delivery" → C-005 through C-009 (process services) + C-004 (executor)
        - Req: "Cloud + on-prem deployment" → ADR-001 (microservices enable hybrid) + deployment strategy in evolution_strategy
        - Req: "Long-running jobs (2-24 hours)" → ADR-002 (event-driven async) + C-003 (job queue) + checkpoint/resume in C-004
        - Req: "Multi-tenant SaaS" → ADR-003 (schema-per-tenant) + C-015 (PostgreSQL with RLS)
        - Req: "API + MCP integration" → I-001 (REST API) + C-018 (MCP Server)
        - Req: "SOC 2, GDPR, HIPAA compliance" → Compliance analysis (3 regulations addressed) + security controls
        - Req: "99.9% uptime SLA" → Multi-AZ RDS (D-001) + circuit breakers (D-008) + auto-scaling (D-007)

        Coverage: 100% of stated requirements traced to architectural decisions or components.

    - id: "AF-02"
      question: "Are primary quality attribute targets achievable with this design?"
      check: "For each prioritized quality attribute, verify design decisions support the target"
      result: "PASS"
      evidence: |
        Quality attribute achievability:
        1. Reliability (99.9% uptime):
           - Multi-AZ RDS (99.95% SLA) → ACHIEVABLE
           - Circuit breakers prevent cascading failures → ACHIEVABLE
           - Checkpoint/resume prevents work loss → ACHIEVABLE

        2. Security (SOC 2, zero-trust):
           - Schema-per-tenant + RLS → ACHIEVABLE (with VR-001 mitigations)
           - mTLS service-to-service → ACHIEVABLE (Istio in v2)
           - Immutable audit logs → ACHIEVABLE

        3. Performance (P95 <500ms):
           - Async job submission (202 Accepted) → ACHIEVABLE (<100ms submission)
           - gRPC internal communication → ACHIEVABLE (low latency)
           - Trade-off: RLS adds 5ms overhead → 495ms remaining budget → ACHIEVABLE

        4. Scalability (1000+ concurrent jobs):
           - HPA + Cluster Autoscaler (0-100 pods) → ACHIEVABLE (tested to 100 jobs, 1000 needs larger cluster)
           - Bottlenecks identified (BN-001, BN-002) with mitigations → ACHIEVABLE at 12 months with mitigation investments

        5. Maintainability (onboard process <1 day):
           - Process Definition Repository (C-013) + generic executor (C-004) → ACHIEVABLE

        All quality attribute targets achievable with documented mitigations.

    - id: "AF-03"
      question: "Does the architecture match the context (team, budget, timeline)?"
      check: "Verify complexity proportional to team capability and project constraints"
      result: "PASS"
      evidence: |
        Context alignment:
        - Team size: 15 developers (per context-assessment.yaml) vs 23 components = 0.65 components/developer (reasonable for microservices)
        - Team expertise: Senior level (high maturity) → capable of managing distributed system complexity
        - Budget: Moderate ($12.8K/month MVP infra, $50K-$200K investment in mitigations) → aligns with startup/scaleup constraints
        - Timeline: 0-3 months MVP, 3-9 months growth, 9-18 months scale → realistic phasing, not over-ambitious

        Complexity assessment:
        - 23 components is HIGH complexity for MVP, BUT justified by:
          - Hybrid deployment requirement (cannot simplify to monolith)
          - 13 independent processes (inherent domain complexity)
          - Conway's Law: 4 teams → 4 bounded contexts → natural microservices alignment

        Proportionality: PASS. Complexity matches team capability and business requirements.

    - id: "AF-04"
      question: "Are there simpler alternatives that would achieve the same goals?"
      check: "Consider if a simpler pattern/approach would suffice (over-engineering check)"
      result: "PASS"
      evidence: |
        Simplification analysis:

        Could we use MONOLITH instead of microservices?
        - NO. Hybrid deployment (compliance on-prem, analytics cloud) requires independent deployable units.
        - Modular monolith cannot satisfy core requirement → microservices justified, not over-engineered.

        Could we use SERVERLESS (Lambda) instead of K8s?
        - NO. 15-minute Lambda timeout insufficient for 2-24 hour processes.
        - Step Functions DSL too limited for complex workflow.md interpretation → K8s justified.

        Could we use SEPARATE-DATABASE-PER-TENANT instead of schema-per-tenant?
        - NO. Cost: $180K/month vs $900/month (200× more expensive).
        - Schema-per-tenant provides adequate security with VR-001 mitigations → justified.

        Could we defer CIRCUIT BREAKERS / AUTO-SCALING until later?
        - NO. Circuit breakers prevent catastrophic LLM outages (CBAM-003 shows 100% ROI).
        - Auto-scaling required to handle growth (30× customer growth projected) → both justified.

        Verdict: No simpler alternative achieves same goals. Architecture is RIGHT-SIZED, not over-engineered.

    - id: "AF-05"
      question: "Would the architecture survive the pre-mortem scenarios?"
      check: "Cross-reference top 3 pre-mortem scenarios with design — does architecture address them?"
      result: "PARTIAL"
      evidence: |
        Pre-mortem scenario survival:

        1. PS-001 (Multi-tenant breach → shutdown):
           - Architecture VULNERABLE if VR-001 mitigations not implemented
           - WITH mitigations ($100K-$145K investment): Breach probability <5% → SURVIVES
           - WITHOUT mitigations: 15-20% breach probability → FAILS
           - Verdict: CONDITIONAL SURVIVAL (depends on mitigation execution)

        2. PS-002 (Wrong strategic cluster choice → $1.5M waste):
           - Architecture supports BOTH CL-001 (Fast Market, cloud-only) AND CL-002 (Enterprise-First, hybrid)
           - Microservices allow pivoting between strategies without rewrite
           - Verdict: SURVIVES (flexible architecture allows strategy changes)

        3. PS-003 (Database connection pool exhaustion → 8-hour outage):
           - Architecture includes PgBouncer connection pooling (BN-001 mitigation)
           - Read replicas + query optimization prevent bottleneck
           - Incident response plan (PS-005) provides recovery runbook
           - Verdict: SURVIVES (with BN-001 mitigations)

        Survival score: 2.5/3 (conditional on executing mitigations)

  fitness_score: "4/5"
  verdict: "FIT"
  rationale: |
    AF-01: PASS (100% requirement coverage)
    AF-02: PASS (all quality targets achievable)
    AF-03: PASS (complexity matches context)
    AF-04: PASS (no simpler alternative exists)
    AF-05: PARTIAL (survives 2.5/3 pre-mortem scenarios, conditional on mitigations)

    Fitness score: 4/5 (≥4 criteria PASS) → Verdict: FIT

    AF-05 is PARTIAL because architecture survival depends on executing mitigations:
    - VR-001 mitigation ($100K-$145K) is MANDATORY for PS-001 survival
    - BN-001 mitigation (read replicas, connection pooling) is MANDATORY for PS-003 survival

    Recommendation: Architecture is FIT for purpose, BUT critical mitigations must be executed before scale.

