unknown_unknowns:
  blind_spots_acknowledged:
    - area: "MCP protocol security vulnerabilities"
      nature: "MCP is new protocol (v1.0, 2025 release), less battle-tested than REST. Unknown vulnerabilities may exist in JSON-RPC implementation, tool invocation sandboxing."
      risk_level: "medium"
      recommendation: "Add MCP-specific penetration testing (engage security firm familiar with JSON-RPC attacks). Monitor MCP GitHub issues for reported CVEs."

    - area: "LLM prompt injection evolution"
      nature: "Prompt injection techniques evolve rapidly. Current defenses (input sanitization, output filtering) may be bypassed by novel attacks (e.g., instruction hierarchy attacks, context smuggling)."
      risk_level: "medium"
      recommendation: "Subscribe to AI security research (e.g., OWASP LLM Top 10 updates). Quarterly review of prompt injection defenses. Consider LLM firewall (e.g., Lakera Guard)."

    - area: "Third-party LLM API reliability assumptions"
      nature: "Anthropic/OpenAI API uptime assumed >99.5% (A-304 assumption). Unknown: actual SLA, degraded mode performance, regional outage frequency."
      risk_level: "high"
      recommendation: "Request formal SLA from Anthropic/OpenAI. Monitor uptime via third-party services (e.g., Pingdom). Implement local LLM fallback (Llama 3.1 70B) for catastrophic failure."

    - area: "Regulatory compliance changes"
      nature: "EU AI Act, GDPR, HIPAA regulations evolve. Unknown: when next major update, impact on deep-* processes (e.g., AI Act Article 6 high-risk AI classification changes)."
      risk_level: "medium"
      recommendation: "Legal counsel quarterly review of regulatory changes. Subscribe to regulatory update services (e.g., OneTrust, TrustArc). Build flexibility for compliance pivots."

    - area: "Customer deployment environment constraints"
      nature: "On-prem customers may have unexpected constraints: air-gapped networks, legacy K8s versions (1.24 vs 1.28), proxy requirements, certificate pinning."
      risk_level: "medium"
      recommendation: "Customer environment survey before first on-prem deployment (3-5 HIPAA customers). Document minimum requirements (K8s 1.26+, egress to LLM APIs OR local LLM). Prototype in constrained environment."

  areas_of_uncertainty:
    - uncertainty: "Actual customer usage patterns (which processes most popular, typical job duration, peak load timing)"
      impact_if_wrong: "Capacity planning wrong (over/under-provisioned infrastructure). Cost projections inaccurate."
      mitigation: "Instrument heavily from day 1. CloudWatch dashboards for: jobs_by_process_id, job_duration_histogram, peak_hour_load. Monthly review vs projections."

    - uncertainty: "Market validation of hybrid deployment value proposition"
      impact_if_wrong: "Invested $50K in on-prem capability, 0 customers need it (VR-007 scenario). Or opposite: underestimated demand, lost deals."
      mitigation: "Validation checkpoint at Month 6 (D-006 decision). If 0 HIPAA customers in pipeline, pivot to cloud-only."

    - uncertainty: "SOC 2 audit interpretation of schema-per-tenant multi-tenancy"
      impact_if_wrong: "Auditor deems schema-per-tenant insufficient isolation, requires separate databases. $180K/month cost surprise."
      mitigation: "Pre-audit consultation with auditor (Month 11, $15K). If schema-per-tenant rejected, negotiate phased migration plan (enterprise customers first)."

