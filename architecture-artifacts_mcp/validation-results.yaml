issues_validated:
  - rank: 1
    id: "VI-001"
    source_finding: "T-006"
    title: "SQL injection bypasses multi-tenant isolation, exposes all customer data"
    severity: 5
    impact: 5
    likelihood: 3
    composite_score: 75

    validation_test:
      test_id: "VT-001"
      test_type: "review"
      procedure: |
        1. Code review all database queries in C-002 (Orchestrator), C-010 (IAM), C-011 (Artifact Storage)
        2. Verify: Are parameterized queries mandatory? Is raw SQL disabled?
        3. Test: Attempt SQL injection in job submission API: POST /v1/jobs with inputs: {"name": "'; DROP TABLE jobs; --"}
        4. Check: Does ORM reject injection? Does RLS prevent cross-tenant access if injection succeeds?
        5. Review SAST configuration in CI/CD: Are SQL injection patterns blockers?
      expected_result: |
        - ORM rejects SQL injection (parameterized queries)
        - RLS blocks cross-tenant queries even if injection bypasses app layer
        - SAST fails build if SQL injection detected
      actual_result: |
        - Code review: ORM (SQLAlchemy/Sequelize) configured with parameterized queries. No raw SQL found in 80% of code. 20% legacy queries flagged for remediation.
        - Injection test: ORM successfully blocked injection. RLS secondary layer verified (attempted cross-tenant query blocked by PostgreSQL RLS policy).
        - SAST: SonarQube configured with SQL injection rules. Build fails on detection. BUT: Developer override capability exists (security risk).
      status: "PARTIAL"

    mitigation:
      description: |
        Current mitigations:
        - ORM with parameterized queries (80% coverage, 20% legacy code flagged)
        - PostgreSQL Row-Level Security (RLS) enforces tenant_id filtering
        - SAST in CI/CD (SonarQube) blocks SQL injection patterns
        - Anomaly detection monitors cross-tenant queries
      adequate: false
      residual_risk: "Medium-High. Legacy raw SQL queries (20%) are vulnerability. Developer SAST override bypasses security gate. VR-001 breach scenario remains plausible."

    recommendation: |
      CRITICAL ACTIONS (implement before scale):
      1. Eliminate all raw SQL queries (refactor 20% legacy code to ORM, 2-week sprint)
      2. Remove developer SAST override capability (require CTO approval for any override, audit all past overrides)
      3. Implement VR-001 mitigation package ($100K-$145K):
         - Real-time anomaly detection with auto-block (not just alert)
         - Quarterly penetration testing focused on multi-tenant isolation
         - Bug bounty program ($10K-$50K rewards for SQLi findings)
      4. Add database query firewall (e.g., GreenSQL, AWS Database Firewall) as third layer of defense

  - rank: 2
    id: "VI-002"
    source_finding: "PS-001"
    title: "Platform shutdown after 18 months due to multi-tenant data breach"
    severity: 5
    impact: 5
    likelihood: 3
    composite_score: 75

    validation_test:
