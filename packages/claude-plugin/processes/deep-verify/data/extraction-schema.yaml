# Extraction Schema — Output Format for Phase 1 (Extraction)
# PURPOSE: Define the exact structure of extraction outputs
# ENFORCEMENT: Phase 1 MUST produce outputs matching this schema

---
claim_schema:
  id: "C[N]"
  text: "Exact quote from artifact"
  location: "Line number or section reference"
  claim_type:
    enum: [FACTUAL, CAPABILITY, GUARANTEE, REQUIREMENT, CONSTRAINT, DEFINITION]
  implicit: false
  hypothesis_id: "H[N] if implicit, null otherwise"

term_schema:
  id: "T[N]"
  term: "Exact word or phrase"
  locations: ["list of line numbers/sections"]
  usage_count: 0
  definition_found: false
  definition_location: "location or null"
  meaning_consistent: "Yes / Unclear / Cannot determine"

structure_schema:
  format: "prose / structured / mixed / code"
  sections: ["list of section names"]
  hierarchy_depth: 0
  abstraction_levels:
    HIGH: false
    MID: false
    LOW: false
  dependencies:
    forward_refs: 0
    back_refs: 0
    circular_refs: 0
    dead_refs: 0
  dependency_map: ["Section A → Section B"]

pattern_signal_schema:
  pattern_id: "ID from pattern-library.yaml"
  pattern_name: "Name"
  signal_strength: "STRONG / WEAK / NONE"
  matching_claims: ["C[N] ids"]
  matching_keywords: ["keywords found"]

synonym_pair_schema:
  term_a: "T[N]"
  term_b: "T[M]"
  hypothesis_id: "H[N]"
  evidence: "Context quotes showing potential synonymy"

homonym_candidate_schema:
  term: "T[N]"
  location_a: "line/section"
  location_b: "line/section"
  meaning_a: "meaning at location A"
  meaning_b: "meaning at location B"
  hypothesis_id: "H[N]"

---
extraction_summary_schema:
  claims:
    total: 0
    by_type: {FACTUAL: 0, CAPABILITY: 0, GUARANTEE: 0, REQUIREMENT: 0, CONSTRAINT: 0, DEFINITION: 0}
    implicit: 0
  terms:
    total: 0
    defined: 0
    undefined: 0
    synonym_pairs: 0
    homonym_candidates: 0
  structure:
    sections: 0
    abstraction_levels: 0
    dead_refs: 0
    circular_refs: 0
  pattern_signals:
    strong: []
    weak: []
  hypotheses:
    total: 0
    untested: 0

---
enforcement_rules:
  - "ALL claims MUST have exact quotes from artifact"
  - "ALL terms MUST have location references"
  - "NO severity judgments in extraction phase"
  - "NO scores calculated in extraction phase"
  - "ALL implicit claims MUST generate hypotheses"
  - "ALL synonym/homonym candidates MUST generate hypotheses"
