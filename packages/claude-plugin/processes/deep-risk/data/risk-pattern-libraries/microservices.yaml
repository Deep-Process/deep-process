# Microservices Risk Pattern Library
# Patterns specific to microservice architectures, service decomposition, and distributed coordination

library:
  id: "microservices"
  name: "Microservices Risk Patterns"
  version: "1.0.0"
  description: "Failure patterns from microservice architecture design, deployment, and operations"

patterns:
  - id: "MICRO-001"
    name: "Distributed Monolith"
    description: |
      System has microservice infrastructure cost (network, deployment, monitoring)
      but monolith coupling (services can't deploy independently, shared database).

    signature:
      - "Services share database"
      - "Deploying one service requires deploying others"
      - "Synchronous call chains between services"
      - "Shared libraries with business logic"

    anti_patterns:
      - "Shared database tables between services"
      - "Synchronous HTTP chains (A→B→C→D)"
      - "Shared code libraries with frequent changes"
      - "Services that can't start without other services"

    indicators:
      - "Deployment coordination overhead increasing"
      - "Cross-service breaking changes"
      - "Network complexity without independence benefit"

    historical_examples:
      - "Common migration pattern: Monolith split into coupled services"
      - "Segment 2018: Microservices rewrite back to monolith"

    mitigation_hints:
      - "Database per service"
      - "Async communication default"
      - "Independent deployability as test"

  - id: "MICRO-002"
    name: "Service Boundary Erosion"
    description: |
      Initially well-defined service boundaries blur over time as features
      require cross-service coordination. Services become entangled.

    signature:
      - "Services calling each other for basic operations"
      - "Circular dependencies between services"
      - "Data duplication across services growing"
      - "No domain model documentation"

    anti_patterns:
      - "Adding RPC calls instead of event propagation"
      - "No bounded context definition"
      - "Feature development crossing service boundaries"
      - "No API review process for new endpoints"

    indicators:
      - "Increasing inter-service call count per request"
      - "Growing number of shared data entities"
      - "Service dependency graph becoming cyclic"

    historical_examples:
      - "Common: Services evolve to need each other's data"
      - "Amazon early days: Service boundaries redrawn multiple times"

    mitigation_hints:
      - "Bounded context documentation"
      - "Event-driven integration"
      - "Regular service boundary review"

  - id: "MICRO-003"
    name: "Observability Gap"
    description: |
      Cannot trace requests across services, identify bottlenecks, or
      understand system behavior. Debugging distributed issues is guesswork.

    signature:
      - "No distributed tracing"
      - "Logs not correlated across services"
      - "No service mesh observability"
      - "Debugging requires checking multiple log sources"

    anti_patterns:
      - "Each service uses different logging format"
      - "No correlation IDs in requests"
      - "No centralized logging"
      - "Metrics collected but not dashboarded"

    indicators:
      - "Mean time to diagnose increasing"
      - "'I don't know which service is slow'"
      - "Incidents requiring multiple teams to debug"

    historical_examples:
      - "Common: Multi-hour debugging for cross-service issues"
      - "Google: Developed Dapper for distributed tracing need"

    mitigation_hints:
      - "Distributed tracing (Jaeger, Zipkin, OpenTelemetry)"
      - "Correlation IDs in all requests"
      - "Service mesh observability"

  - id: "MICRO-004"
    name: "Data Consistency Nightmare"
    description: |
      Distributed data across services becomes inconsistent. Saga patterns
      incomplete, eventual consistency windows too long, compensating
      transactions missing.

    signature:
      - "Business operations spanning multiple services"
      - "No saga pattern for distributed transactions"
      - "Inconsistent data between services accepted as normal"
      - "Manual reconciliation processes"

    anti_patterns:
      - "Distributed transactions (2PC) across services"
      - "Assuming strong consistency in async system"
      - "No compensating transactions"
      - "Read-your-writes not guaranteed"

    indicators:
      - "Data reconciliation errors"
      - "Users seeing stale data"
      - "Business operations partially completed"

    historical_examples:
      - "E-commerce: Order created but inventory not reserved"
      - "Banking: Transfer debited but not credited"

    mitigation_hints:
      - "Saga pattern with compensating transactions"
      - "Event sourcing for audit trail"
      - "Idempotent operations"

  - id: "MICRO-005"
    name: "API Gateway Bottleneck"
    description: |
      API gateway becomes single point of failure and performance bottleneck.
      All traffic funneled through one component that accumulates logic.

    signature:
      - "Business logic in API gateway"
      - "Gateway handling authentication, transformation, orchestration"
      - "Gateway latency growing"
      - "Gateway outage = total outage"

    anti_patterns:
      - "Moving business logic to gateway"
      - "Request transformation in gateway"
      - "No gateway redundancy"
      - "Monolithic gateway configuration"

    indicators:
      - "Gateway P99 latency growing"
      - "Gateway deployment frequency = system deployment frequency"
      - "Gateway configuration complexity increasing"

    historical_examples:
      - "Netflix: Zuul gateway evolution to handle increasing complexity"
      - "Common: API gateway becoming new monolith"

    mitigation_hints:
      - "Gateway for routing and auth only"
      - "BFF (Backend for Frontend) pattern"
      - "Gateway redundancy and failover"

  - id: "MICRO-006"
    name: "Service Discovery Failure"
    description: |
      Services cannot find each other during deployments, scaling events,
      or infrastructure changes. Stale service registry causes requests
      to dead instances.

    signature:
      - "Hardcoded service endpoints"
      - "No health check-based deregistration"
      - "DNS TTL too long for dynamic environments"
      - "Service discovery not tested during failure"

    anti_patterns:
      - "Hardcoded IP addresses or hostnames"
      - "No graceful shutdown with deregistration"
      - "Service registry as single point of failure"
      - "No client-side load balancing fallback"

    indicators:
      - "Connection errors to recently scaled services"
      - "Requests routed to terminated instances"
      - "DNS resolution delays during deployments"

    historical_examples:
      - "Common in Kubernetes: Pod IP churn causing connection errors"
      - "Consul/Eureka outages cascading to all services"

    mitigation_hints:
      - "Health check-based service registry"
      - "Client-side service discovery with fallback"
      - "Graceful shutdown with deregistration"

  - id: "MICRO-007"
    name: "Configuration Sprawl"
    description: |
      Configuration scattered across environment variables, config files,
      config servers, and hardcoded values. No single view of system configuration.

    signature:
      - "Configuration in multiple formats and locations"
      - "'What value is this using in production?' requires investigation"
      - "Configuration changes require restarts"
      - "No configuration versioning or audit"

    anti_patterns:
      - "Configuration in source code"
      - "No centralized config management"
      - "Different config approaches per service"
      - "No config change audit trail"

    indicators:
      - "Configuration-related incidents"
      - "Environment-specific bugs"
      - "Configuration documentation always stale"

    historical_examples:
      - "Facebook 2021: BGP configuration change caused global outage"
      - "Common: Wrong config deployed to production"

    mitigation_hints:
      - "Centralized configuration (Consul, Spring Cloud Config)"
      - "Configuration as code with versioning"
      - "Config change audit and approval"

  - id: "MICRO-008"
    name: "Testing Pyramid Inversion"
    description: |
      More end-to-end tests than unit tests, making test suite slow,
      flaky, and expensive. Integration testing requires full environment.

    signature:
      - "E2E tests take hours to run"
      - "Flaky tests ignored or re-run until passing"
      - "Cannot test service in isolation"
      - "Test environment maintenance is full-time job"

    anti_patterns:
      - "E2E tests as primary testing strategy"
      - "No contract testing between services"
      - "Shared test environments with contention"
      - "No mock/stub for external dependencies"

    indicators:
      - "CI/CD pipeline duration increasing"
      - "Test flakiness rate growing"
      - "Test environment provisioning delays"

    historical_examples:
      - "Google: Moving from E2E to contract testing for microservices"
      - "Common: Multi-hour CI pipelines blocking deployments"

    mitigation_hints:
      - "Contract testing (Pact)"
      - "Service virtualization"
      - "Test pyramid enforcement"
