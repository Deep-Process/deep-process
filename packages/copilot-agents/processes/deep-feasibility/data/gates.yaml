# Metadata

gates:
  total: 6
  conditions_total: 32
  severity_breakdown:
    BLOCKER: 6
    CRITICAL: 14
    ERROR: 10
    WARNING: 2

## Dimension-Specific Counter-Checks (apply during GATE_2 assessment)

counter_checks_dimensions:

  CC-DIM-01:
    name: "Technical TRL Grounding Check"
    dimension: "Technical"
    method: "#85 Grounding Check"
    procedure:
      - "Sample 3 TRL claims from technical assessment"
      - "For each: verify evidence exists (documentation, test results, deployment history)"
      - "Calculate: verified_count / 3"
    pass_criteria: "≥2 of 3 TRL claims have verifiable evidence (≥67%)"
    failure: "If <67% → technical score may be hallucinated, reduce confidence to Low"
    severity: "ERROR"

  CC-DIM-02:
    name: "Resource Availability Verification"
    dimension: "Resource"
    method: "#85 Grounding Check"
    procedure:
      - "For resource claims (people allocated, budget approved, infrastructure available)"
      - "Verify: commitment (signed docs) vs assumption (hoped for)"
      - "Check: ≥1 resource has hard commitment"
    pass_criteria: "≥1 of 4 resource types has verifiable commitment"
    failure: "If 0 committed → all assumed, confidence should be Low"
    severity: "WARNING"

  CC-DIM-03:
    name: "Knowledge Gap Reality Check"
    dimension: "Knowledge"
    method: "#168 Phantom Hunt"
    procedure:
      - "For each claimed skill/knowledge"
      - "Verify: who on team has it? (name specific person)"
      - "Check: evidence of that knowledge (past work, certification, experience)"
    pass_criteria: "Skills mapped to named individuals with evidence"
    failure: "If skills unmapped to people → phantom knowledge claim"
    severity: "CRITICAL"

  CC-DIM-04:
    name: "Organizational Capability Evidence"
    dimension: "Organizational"
    method: "#85 Grounding Check"
    procedure:
      - "Check organizational claims (decision authority, stakeholder alignment)"
      - "Verify: Has org done similar before? (precedent)"
      - "Evidence: past project success OR pilot approval"
    pass_criteria: "≥1 precedent OR pilot approved"
    failure: "If no precedent AND no pilot → organizational assessment is assumption"
    severity: "WARNING"

  CC-DIM-05:
    name: "Temporal Planning Fallacy Detection"
    dimension: "Temporal"
    method: "#501 Planning Fallacy Detection (from methods.csv)"
    procedure:
      - "Load time estimates from temporal assessment"
      - "Apply: Kahneman planning fallacy checks"
      - "Check: Inside view (our estimate) vs outside view (reference class)"
      - "Calculate: optimism_bias = reference_class_median / our_estimate"
    pass_criteria: "optimism_bias < 1.5 (estimate within 50% of reference class)"
    failure: "If optimism_bias ≥ 2.0 → severe planning fallacy, adjust estimate"
    severity: "CRITICAL"

  CC-DIM-06:
    name: "Compositional Integration Risk Scan"
    dimension: "Compositional"
    method: "#168 Phantom Hunt"
    procedure:
      - "List ALL integration points between components"
      - "For each: has it been tested? (integration spike OR precedent)"
      - "Check: ≥1 novel integration (not done before)"
    pass_criteria: "Novel integrations identified and flagged"
    failure: "If novel integrations assumed to work → phantom integration claim"
    severity: "ERROR"

  CC-DIM-07:
    name: "Economic ROI Calculation Verification"
    dimension: "Economic"
    method: "#84 Coherence Check"
    procedure:
      - "Check: cost estimate methodology documented?"
      - "Check: benefit calculation assumptions listed?"
      - "Verify: ROI = (benefits - costs) / costs calculated correctly"
    pass_criteria: "Methodology + assumptions + correct calculation"
    failure: "If calculation errors OR assumptions missing → recompute"
    severity: "ERROR"

  CC-DIM-08:
    name: "Scale Performance Evidence Check"
    dimension: "Scale"
    method: "#85 Grounding Check"
    procedure:
      - "Check scale claims (handles 10x load, scales to 1M users)"
      - "Verify: load tested? benchmarked? calculated with safety margin?"
      - "Evidence type: empirical (tested) > analytical (calculated) > assumed (hoped)"
    pass_criteria: "Scale claims have empirical OR analytical evidence"
    failure: "If all assumed → scale assessment is speculation, confidence = Low"
    severity: "ERROR"

  CC-DIM-09:
    name: "Cognitive Complexity Reality Check"
    dimension: "Cognitive"
    method: "#59 CUI BONO Test"
    procedure:
      - "Check cognitive feasibility score"
      - "Ask: Who benefits from 'team can understand' claim? Agent (easier answer) or User (realistic assessment)?"
      - "Verify: Has anyone on team understood similar complexity before?"
    pass_criteria: "Precedent of team handling similar complexity exists"
    failure: "If no precedent → cognitive claim may be optimistic"
    severity: "WARNING"

  CC-DIM-10:
    name: "Dependency Supply Chain Audit"
    dimension: "Dependency"
    method: "#168 Phantom Hunt"
    procedure:
      - "List ALL external dependencies"
      - "For each: verify it exists (not planned/assumed to exist)"
      - "Check: availability (can we access now?), reliability (SLA/track record), affordability (within budget)"
    pass_criteria: "All dependencies exist + available + affordable verified"
    failure: "If any dependency phantom (doesn't exist yet) → flag as risk"
    severity: "CRITICAL"

