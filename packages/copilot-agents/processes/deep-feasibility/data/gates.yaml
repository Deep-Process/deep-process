# Deep-Feasibility V2.0 — Binding Gates
# Version: 1.0.0
# Total Gates: 6
# Total Conditions: 32 (6 BLOCKER, 14 CRITICAL, 10 ERROR, 2 WARNING)

---

GATE_0:
  name: "Frame Gate"
  step: 0
  phase: "FRAME"
  description: "Verifies problem characterization, decomposition, and scope definition complete"

  conditions:
    - id: "G0-01"
      description: "Domain map exists with ≥1 component classified"
      severity: "BLOCKER"
      check: "Verify domain_map output exists AND contains ≥1 entry with domain=[Clear/Complicated/Complex/Chaotic]"
      failure: "Cannot proceed without problem classification — Cynefin analysis is foundation"
      method: "#001 Cynefin Domain Classification"

    - id: "G0-02"
      description: "Sub-questions exist with ≥1 question decomposed"
      severity: "CRITICAL"
      check: "Verify sub_questions output exists AND contains ≥1 decomposed question"
      failure: "Monolithic assessment likely to miss dimensions — decomposition required"
      method: "#002 Feasibility Question Decomposition"

    - id: "G0-03"
      description: "Scope definition exists with boundaries"
      severity: "CRITICAL"
      check: "Verify scope_definition output contains: what_included, what_excluded, assumptions"
      failure: "Unbounded scope = unbounded assessment — boundaries required"
      method: "#003 Feasibility Scope Definition"

    - id: "G0-04"
      description: "Complex components flagged for probing"
      severity: "ERROR"
      check: "IF complex_mode=on, verify domain_map has probe_needed=true for Complex components"
      failure: "Complex components assessed traditionally = false feasibility — probes required"
      method: "#001 Cynefin Domain Classification"

  total_conditions: 4
  blocker_count: 1
  critical_count: 2

  evaluation:
    - "Load outputs from step-00-frame.md frontmatter"
    - "For each condition: execute check per specification"
    - "Record result: PASS/FAIL with evidence"
    - "IF G0-01 (BLOCKER) fails → GATE_0 = FAIL"
    - "IF ≥50% CRITICAL fail (≥1 of 2) → GATE_0 = FAIL"
    - "ELSE → GATE_0 = PASS"

---

GATE_1:
  name: "Constrain Gate"
  step: 1
  phase: "CONSTRAIN"
  description: "Verifies constraint mapping, hardness classification, and contradiction analysis"

  conditions:
    - id: "G1-01"
      description: "Constraint map exists with ≥1 constraint classified H0-H5"
      severity: "BLOCKER"
      check: "Verify constraint_map output exists AND contains ≥1 constraint with hardness=[H0/H1/H2/H3/H4/H5]"
      failure: "Unknown constraints = hidden infeasibility — classification required"
      method: "#101 Constraint Hardness Spectrum"

    - id: "G1-02"
      description: "Depth=standard+: ALL 6 constraint methods executed"
      severity: "CRITICAL"
      check: "IF depth IN [standard,comprehensive,critical], verify methods 101-106 ALL executed"
      failure: "Partial constraint analysis = missed infeasibility — completeness required"
      methods: "#101-106"

    - id: "G1-03"
      description: "Depth=quick: methods 101,102,106 executed"
      severity: "CRITICAL"
      check: "IF depth=quick, verify methods 101,102,106 executed"
      failure: "Even quick assessment needs core constraints — minimum required"
      methods: "#101,102,106"

    - id: "G1-04"
      description: "H5 (impossible) constraints documented with recommendation"
      severity: "ERROR"
      check: "IF any constraint has hardness=H5, verify recommendation exists (redesign/abandon)"
      failure: "Impossible constraints without guidance = wasted effort — redesign recommendation required"
      method: "#101 Constraint Hardness Spectrum"

    - id: "G1-05"
      description: "Contradictions analyzed via TRIZ"
      severity: "WARNING"
      check: "IF contradictions found, verify #103 TRIZ analysis executed"
      failure: "Unresolved contradictions = potential innovation OR infeasibility — analysis valuable"
      method: "#103 TRIZ Contradiction Detection"

    - id: "G1-06"
      description: "Early exit conditions evaluated"
      severity: "ERROR"
      check: "IF H5 found, verify early exit recommendation documented (no point continuing assessment)"
      failure: "Assessing impossible projects wastes resources — early exit recommended"
      method: "#101 Constraint Hardness Spectrum"

  total_conditions: 6
  blocker_count: 1
  critical_count: 2

  evaluation:
    - "Load constraint_map output"
    - "For each condition: execute check"
    - "IF G1-01 (BLOCKER) fails → GATE_1 = FAIL"
    - "IF depth-specific CRITICAL fails → GATE_1 = FAIL"
    - "ELSE → GATE_1 = PASS"

---

GATE_2:
  name: "Assess Gate"
  step: 2
  phase: "ASSESS"
  description: "Verifies ALL 10 dimensions scored with confidence, binding constraint identified"

  conditions:
    - id: "G2-01"
      description: "Dimension scores exist for ALL 10 dimensions"
      severity: "BLOCKER"
      check: "Verify dimension_scores output contains exactly 10 entries: Technical,Resource,Knowledge,Organizational,Temporal,Compositional,Economic,Scale,Cognitive,Dependency"
      failure: "Incomplete assessment = hidden infeasibility — ALL 10 dimensions required per R2 COMPLETENESS"
      methods: "#201-210"

    - id: "G2-02"
      description: "NO dimension scored 0 (unscored)"
      severity: "BLOCKER"
      check: "Verify ALL dimension scores IN [1,2,3,4,5], NO score=0"
      failure: "Score=0 means not assessed (not infeasible) — unacceptable per R2"
      methods: "#201-210"

    - id: "G2-03"
      description: "Confidence levels assigned for ALL 10 dimensions"
      severity: "CRITICAL"
      check: "Verify each dimension has confidence=[High/Medium/Low]"
      failure: "Unconfident scores hide uncertainty — confidence assignment required"
      methods: "#201-210"

    - id: "G2-04"
      description: "Binding constraint identified"
      severity: "BLOCKER"
      check: "Verify binding_constraint = min(dimension_scores) calculated and documented"
      failure: "Weakest dimension binds (Goldratt TOC) — binding constraint is core finding"
      reference: "Theoretical foundation: Goldratt Theory of Constraints"

    - id: "G2-05"
      description: "Depth≥standard: sub-factor analysis for binding constraint"
      severity: "CRITICAL"
      check: "IF depth IN [standard,comprehensive,critical], verify binding constraint has sub-factor analysis"
      failure: "Understanding binding constraint enables mitigation — sub-factors required for actionability"
      methods: "#201-210"

    - id: "G2-06"
      description: "Infeasible dimensions (1-2) justified"
      severity: "ERROR"
      check: "IF any dimension score IN [1,2], verify justification documented with evidence"
      failure: "Infeasibility claims need evidence — prevents false negatives"
      methods: "#201-210"

    - id: "G2-07"
      description: "Scoring matches data/feasibility-scoring.yaml definitions"
      severity: "ERROR"
      check: "Sample 3 random dimension scores, verify match scoring.yaml criteria (5=Proven, 4=Likely, 3=Possible, 2=Doubtful, 1=Infeasible)"
      failure: "Inconsistent scoring = unreliable assessment — definitions binding"
      reference: "data/feasibility-scoring.yaml"

    - id: "G2-08"
      description: "Counter-checks executed for ≥3 dimensions"
      severity: "WARNING"
      check: "Verify counter_check_results contains ≥3 dimension verifications"
      failure: "Unchecked assessments may contain errors — counter-checks improve quality"
      reference: "R8 Counter-checks requirement"

  total_conditions: 8
  blocker_count: 3
  critical_count: 2

  evaluation:
    - "Load dimension_scores output"
    - "FOR EACH condition: execute check"
    - "IF ANY BLOCKER (G2-01,02,04) fails → GATE_2 = FAIL"
    - "IF ≥50% CRITICAL fail (≥1 of 2) → GATE_2 = FAIL"
    - "ELSE → GATE_2 = PASS"
    - "NOTE: GATE_2 is MOST CRITICAL for R2 COMPLETENESS enforcement"

---

GATE_3:
  name: "Validate Gate"
  step: 3
  phase: "VALIDATE"
  description: "Verifies debiasing via reference class, assumption testing, probes (depth-dependent)"

  conditions:
    - id: "G3-01"
      description: "Depth=quick: auto-pass (no validation required)"
      severity: "N/A"
      check: "IF depth=quick, GATE_3 = PASS automatically"
      failure: "N/A"
      rationale: "Quick assessment prioritizes speed over validation"

    - id: "G3-02"
      description: "Depth≥standard: Reference Class Forecasting executed"
      severity: "CRITICAL"
      check: "IF depth IN [standard,comprehensive,critical], verify #301 executed with base_rate calculated"
      failure: "Planning fallacy is systematic (Kahneman) — reference class mandatory for debiasing"
      method: "#301 Reference Class Forecasting"
      reference: "Theoretical foundation: Kahneman Planning Fallacy, Flyvbjerg Reference Class"

    - id: "G3-03"
      description: "Depth≥standard: Critical Assumption Testing executed"
      severity: "CRITICAL"
      check: "IF depth IN [standard,comprehensive,critical], verify #302 executed with ≥3 assumptions tested"
      failure: "Untested assumptions = hidden infeasibility — testing required"
      method: "#302 Critical Assumption Testing"

    - id: "G3-04"
      description: "Complex/Comprehensive: Probes designed"
      severity: "ERROR"
      check: "IF complex_mode=on OR depth IN [comprehensive,critical], verify #303 executed with ≥1 probe designed"
      failure: "Complex domains cannot be assessed traditionally — probes required"
      method: "#303 Probe Design"
      reference: "Theoretical foundation: Snowden Cynefin (Complex = probe-sense-respond)"

    - id: "G3-05"
      description: "Calibrated estimates recorded"
      severity: "WARNING"
      check: "Verify validation_results contains calibrated_estimates with confidence adjustments"
      failure: "Uncalibrated estimates overconfident — calibration improves accuracy"
      method: "#304 Expert Judgment Calibration"

  total_conditions: 5
  blocker_count: 0
  critical_count: 2

  evaluation:
    - "Check depth level first"
    - "IF depth=quick → GATE_3 = PASS (auto)"
    - "ELSE load validation_results output"
    - "FOR depth≥standard conditions: execute checks"
    - "IF depth-required CRITICAL fails → GATE_3 = FAIL"
    - "ELSE → GATE_3 = PASS"

---

GATE_4:
  name: "Decide Gate"
  step: 4
  phase: "DECIDE"
  description: "Verifies decision made with conditions, confidence weighting, decay monitoring"

  conditions:
    - id: "G4-01"
      description: "Decision exists: GO/NO-GO/CONDITIONAL/INVESTIGATE"
      severity: "BLOCKER"
      check: "Verify decision output IN [GO, NO-GO, CONDITIONAL, INVESTIGATE]"
      failure: "Assessment without decision is incomplete — decision required"
      method: "#402 Confidence-Weighted Decision"

    - id: "G4-02"
      description: "CONDITIONAL: conditions enumerated"
      severity: "CRITICAL"
      check: "IF decision=CONDITIONAL, verify conditions list exists with ≥1 condition via #403"
      failure: "Conditional without conditions is meaningless — enumeration required"
      method: "#403 Conditional Feasibility Map"

    - id: "G4-03"
      description: "CONDITIONAL: compound probability calculated"
      severity: "ERROR"
      check: "IF decision=CONDITIONAL with ≥2 conditions, verify compound_probability = P(C1) × P(C2) × ... calculated"
      failure: "Multiple conditions compound (multiply) probability — calculation prevents overconfidence"
      method: "#403 Conditional Feasibility Map"

    - id: "G4-04"
      description: "Confidence-Weighted Decision executed"
      severity: "CRITICAL"
      check: "Verify #402 executed: decision accounts for confidence levels from GATE_2"
      failure: "Low-confidence dimensions need different treatment — confidence weighting required"
      method: "#402 Confidence-Weighted Decision"

    - id: "G4-05"
      description: "Decay triggers defined"
      severity: "WARNING"
      check: "Verify #404 executed with ≥1 decay trigger (event that invalidates feasibility)"
      failure: "Feasibility decays over time — monitoring design valuable for long projects"
      method: "#404 Feasibility Decay Monitoring"
      reference: "Theoretical foundation: Boehm Spiral Model (iterative reassessment)"

  total_conditions: 5
  blocker_count: 1
  critical_count: 2

  evaluation:
    - "Load feasibility_decision output"
    - "IF G4-01 (BLOCKER) fails → GATE_4 = FAIL"
    - "IF decision=CONDITIONAL, verify G4-02 (conditions exist)"
    - "IF G4-04 (confidence weighting) fails → GATE_4 = FAIL"
    - "ELSE → GATE_4 = PASS"

---

GATE_5:
  name: "Output Gate"
  step: 5
  phase: "OUTPUT"
  description: "Verifies complete outputs generated, META methods applied"

  conditions:
    - id: "G5-01"
      description: "Feasibility register entry generated"
      severity: "BLOCKER"
      check: "Verify feasibility-register.md file exists at output_directory"
      failure: "Register entry is deliverable — required for process completion"
      template: "data/feasibility-register-template.md"

    - id: "G5-02"
      description: "Feasibility report generated"
      severity: "BLOCKER"
      check: "Verify feasibility-report.md file exists at output_directory"
      failure: "Full report is primary deliverable — required for process completion"
      template: "data/feasibility-report-template.md"

    - id: "G5-03"
      description: "META methods applied with findings"
      severity: "CRITICAL"
      check: "Verify meta_results contains findings from ≥3 of 5 META methods (#501-505)"
      failure: "META methods catch biases in assessment itself — application required"
      methods: "#501-505"
      reference: "meta/meta-checklist.yaml"

    - id: "G5-04"
      description: "ALL frontmatter outputs present"
      severity: "CRITICAL"
      check: "Verify ALL outputs listed in step-05-output.md frontmatter are generated"
      failure: "Incomplete outputs = incomplete process — all required"
      reference: "step-05-output.md frontmatter: outputs[]"

  total_conditions: 4
  blocker_count: 2
  critical_count: 2

  evaluation:
    - "Check output_directory for files"
    - "IF G5-01 OR G5-02 (register/report) missing → GATE_5 = FAIL"
    - "IF G5-03 OR G5-04 (META/outputs) fail → GATE_5 = FAIL"
    - "ELSE → GATE_5 = PASS"
    - "GATE_5 = PASS means process COMPLETE"

---

# Counter-Checks

## Global Counter-Checks (apply to ALL gates)

counter_checks_global:

  CC-GLOBAL-01:
    name: "Grounding Check"
    method: "#85 Grounding Check (from methods.csv)"
    description: "Sample 3 random outputs, verify each traceable to source method execution"
    frequency: "Per gate evaluation"
    procedure:
      - "Select 3 random outputs from current step"
      - "For each output: trace to method execution evidence"
      - "Check: method file read? method executed? output derivable from method?"
      - "Calculate: grounded_count / 3"
    pass_criteria: "≥2 of 3 outputs verifiable (≥67%)"
    failure: "If <67% verifiable → gate suspicious, flag for review (possible hallucination)"
    severity: "ERROR"

  CC-GLOBAL-02:
    name: "Coherence Check"
    method: "#84 Coherence Check (from methods.csv)"
    description: "Verify no contradictions between step outputs"
    frequency: "At GATE_4, GATE_5"
    procedure:
      - "Load outputs from all completed steps"
      - "Check constraint_map (H5 impossible) vs decision (GO) → contradiction"
      - "Check dimension_scores (all ≥4) vs decision (NO-GO) → contradiction"
      - "Check binding_constraint (Technical=1) vs decision (GO without conditions) → contradiction"
    pass_criteria: "Zero contradictions found"
    failure: "Contradiction = CRITICAL finding, block gate until resolved"
    severity: "CRITICAL"

  CC-GLOBAL-03:
    name: "CUI BONO Test"
    method: "#59 CUI BONO Test (from methods.csv)"
    description: "For SCOPE_REDUCTION, analyze beneficiary"
    frequency: "When SCOPE_REDUCTION declared"
    procedure:
      - "Identify what was reduced/omitted"
      - "Ask: Does omission benefit AGENT (easier work, faster completion)?"
      - "Ask: Does omission benefit USER (better assessment, clearer decision)?"
      - "Calculate: agent_benefit vs user_benefit"
    pass_criteria: "Reduction benefits USER OR neutral"
    failure: "If benefits only agent → reject reduction, require completion OR explicit user approval"
    severity: "CRITICAL"

