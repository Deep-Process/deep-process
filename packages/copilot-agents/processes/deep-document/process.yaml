  requires_llm: "Claude Opus 4.6, Claude Sonnet 4.5, or Gemini 2.5 Pro"
  recommended_llm: "Claude Sonnet 4.5 (most tested and reliable)"
  gemini_llm: "Gemini 2.5 Pro (fully supported with V7.1.1 incremental approach)"
  minimum_context: "200k tokens"

  llm_notes:
    universal_design: "V7.1.1 uses incremental YAML generation - works reliably across all LLMs"
    claude_strengths: "Handles complex operations in single calls, faster execution"
    gemini_strengths: "Excellent entity extraction, cost-effective for large projects"
    incremental_approach: "Breaks complex operations into simple steps - universal compatibility"

  backward_compatible_with:
    - deep-document-v6.3.0
    - deep-document-v6.2.1
    - deep-document-v6.1.0

# ==============================================================================
# KNOWN LIMITATIONS
# ==============================================================================
limitations:
  - limitation: "Complex YAML generation in single function call (resolved in V7.1.1)"
    severity: LOW (mitigated)
    historical_issue: "Pre-V7.1.1: Some LLMs struggled with complex multi-line YAML in Write calls"
    affected_llms: "Gemini 2.5 Pro, some older Claude versions"
    symptoms: "Repeated 'Response stopped due to malformed function call' errors"
    resolution: "V7.1.1 universal incremental approach - breaks complex ops into simple steps"
    current_status: "RESOLVED - all major LLMs now supported"
    evidence: "User report 2026-02-11: Issue triggered V7.1.1 universal design improvement"
    design_improvement: "Incremental YAML generation (skeleton → edit → validate) works across all LLMs"
    benefits:
      - "Universal LLM compatibility"
      - "Easier debugging (validate each step)"
      - "More maintainable"
      - "Predictable behavior"

  - limitation: "O(N³) transitive closure may timeout for >10k nodes"
    severity: MEDIUM
    mitigation: "Timeout mechanism (Finding F-039, 3h implementation)"

  - limitation: "Semantic matching requires embedding generation"
    severity: LOW
    mitigation: "Fallback to keyword overlap (validated in P0-R-02)"

