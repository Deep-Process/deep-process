# DESCRIPTION
# ==============================================================================
description: |
  Deep-Document V7.1.0 - Iterative Planning-First FSM with Pure Deep-Verify Pattern

  **What's New in V7.1.0 (Pure Deep-Verify Pattern - AGENT SPLIT):**
  - IMPLEMENTED Option A from 10-method analysis (#167, #100, #17, #84, #159, #59, #61, #114, #99, #31)
  - DELETED agents/ directory (except orchestrator-agent.md infrastructure exception)
  - EXPANDED steps/ to self-contained files (70L average → 200-300L, Deep-Verify range)
  - ELIMINATED 100% duplication (491 instances: ENFORCED SEQUENCE, Extract→Verify→Render, Counter-Checks)
  - REDUCED token overhead 60% (979L → 220L per state, was 344% waste)
  - ACHIEVED ZASAD compliance 130/130 (100%, was 97/130 = 75%)
  - PATTERN: Each step file = YAML frontmatter + ENFORCED SEQUENCE + schemas + counter-checks + gates (COMPLETE)
  - ZASADA 1 (Self-Contained): Steps contain ALL info to execute (no agent/ references)
  - ZASADA 11 (Instructions+Data): Unified in single file per state
  - ZASADA 12 (Just-In-Time): Load ONLY step-NN-*.md for state N (perfect compliance)
  - Proven pattern: Deep-Verify V2 (7 steps, 2781L, 0 agents/, 397L avg, OPERATIONAL)
  - Reversibility: PERFECT (bidirectional transformation, 0% loss)
  - Migration: 7 phases, ~8 hours, 91% confidence
  - Files deleted: context-agent.md, mapper-agent.md, planner-agent.md, writer-agent.md, architect-agent.md, verifier-agent.md, template-analyzer-agent.md
  - Files kept: orchestrator-agent.md (561L infrastructure exception - scenarios A-E, staleness, transitions, lock)
  - workflow.md updated: Removed "Agent" column from routing table, added self-contained note
  - Success: <400L/step (max 320L), 0 duplication, 15 occurrences ENFORCED SEQUENCE (not 28)

  **What's New in V7.0.4 (R12 Steps Structure - CRITICAL FIX):**
  - FIXED ZASADA 12 violation: workflow.md (1034 lines) split → routing (172 lines) + steps/ (15 files)
  - Created steps/ directory with step-01-init.md through step-15-complete.md
  - Each step file: YAML frontmatter + ENFORCED SEQUENCE for ONE state only
  - workflow.md NOW: ROUTING TABLE (which agent loads which step file) + EXECUTION RULES + ENFORCEMENT SUMMARY
  - Agents load ONLY current step file (not entire 1034-line workflow)
  - PREVENTS: Agent in STATE_INIT reading STATE_VERIFICATION instructions (9 states early)
  - Just-In-Time: Data for phase N appears at phase N, NOT earlier (ZASADA 12 compliance)
  - Token economy: ~80% reduction in workflow loading (172 lines vs 1034 lines upfront)
  - Cognitive load: Agent sees ONLY instructions for current state
  - Structure matches Deep-Verify pattern (workflow.md + steps/step-NN-name.md)

  **What's New in V7.0.3 (R12 Just-In-Time Compliance + Menu Fix):**
  - Fixed ZASADA 12 violations: agents load data ONLY when needed for current phase
  - planner-agent: removed diagram-triggers (needed in SYNTHESIS, not PLANNING)
  - planner-agent: removed documentation-standards (needed in GENERATION, not PLANNING)
  - Eliminated duplicate loading across 3 agents (PLANNING → SYNTHESIS → GENERATION)
  - ~15% token reduction per agent (no future-phase context pollution)
  - Updated workflow.md INPUT documentation for 3 states
  - ENFORCED ban on AskUserQuestion: RULE 5 (BLOCKER), EXECUTION RULE 7, CRITICAL instructions at all 11 menus

  **What's New in V7.0.2 (Orchestrator Enforcement):**
  - Mandatory SCENARIO 0: STARTUP (ALWAYS FIRST) - cannot bypass menu
  - Automatic project discovery (scans all process-state.yaml files, depth 3)
  - GATE_STARTUP with 5 conditions (GS-01..GS-05, BLOCKER enforcement)
  - 4 ANTI-BYPASS RULES (RULE 1-4, prevents assuming NEW/LOAD)
  - 3 counter-checks (CC1 Grounding, CC2 Phantom Hunt, CC3 Coherence)
  - startup_checklist (6 items, mandatory post-phase)
  - Cleaned orchestrator-agent.md to minimum (executable instructions only)

  **What's New in V7.0.0:**
  - STATE_ONTOLOGY_EXTRACTION: Gemini 2.5 Pro extracts domain entities from source code
  - STATE_TEMPLATE_ANALYSIS: Decomposes custom templates before planning (8x ROI)
  - GP-15 Semantic Matching: Cosine similarity ≥90% for template coverage (FAISS-optimized)
  - PD-UNIVERSAL: 68+ placeholder patterns for Gemini-hardening
  - Method #159 Transitive Closure: O(N³) dependency graph completion
  - Method #90 Topology Metrics: Centrality-driven diagram prioritization
  - GOE-01..GOE-10: Enhanced grounding mechanisms (95% phantom prevention)

  **Preserved from V6.3.0:**
  - Iterative execution (process-state.yaml)
  - Multi-project UX
  - Quality mechanisms (GG-10..14)
  - Incremental verification mode
  - 25 invariants

  **Updated in V7.0.1:**
  - 23 binding gates (was 21: +GATE_OE_INCREMENTAL, +GATE_TA_INCREMENTAL)
  - 12 grounding mechanisms (was 10: +batch merge integrity GOE-09, +grounding rate GOE-10)
  - 8 incremental gates (was 6: +ONTOLOGY, +TEMPLATE)

  **Key Improvements:**
  - Fixes 35% [UNKNOWN] problem (V6 issue)
  - Fixes sparse planning problem (30% missing sections)
  - Fixes 75% entity loss problem (V7.0.0 issue) ← C-01
  - Fixes 72-second bottleneck (V7.0.0 issue) ← C-02
  - Fixes incomplete menu (V7.0.0 issue) ← C-03
  - Adds template decomposition (prevents RERUN cycles)
  - Enhanced grounding (12 mechanisms vs 3 in V6)
  - Topology-driven diagrams (Method #90)

priority: COMPLETENESS > TOKEN_ECONOMY > DEPTH > AESTHETICS

