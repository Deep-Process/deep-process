# FSM ARCHITECTURE
# ==============================================================================
fsm:
  total_states: 15
  processing_states: 8
  user_review_states: 4
  terminal_states: 3

  states:
    processing:
      - STATE_INIT                      # Initialize process
      - STATE_ONTOLOGY_EXTRACTION       # NEW - Gemini extracts entities
      - STATE_TEMPLATE_ANALYSIS         # NEW - Decompose template
      - STATE_DETECTION                 # Detect project type + domains
      - STATE_PLANNING                  # Plan documentation (GP-15)
      - STATE_COVERAGE                  # Map file segments
      - STATE_EVIDENCE                  # Extract claims
      - STATE_SYNTHESIS                 # Generate diagrams (Method #159/#90)
      - STATE_GENERATION                # Write documentation
      - STATE_VERIFICATION              # Verify quality

    user_review:
      - USER_REVIEW_PLAN                # Approve documentation plan
      - USER_REVIEW_EVIDENCE            # Approve evidence coverage
      - USER_REVIEW_DIAGRAMS            # Approve diagrams
      - USER_REVIEW_DOCS                # Approve documentation

    terminal:
      - STATE_COMPLETE                  # Success
      - STATE_ERROR                     # Failure
      - STATE_HALT                      # User abort

  transitions: 60  # 8 processing × 2 modes + user reviews + error paths

