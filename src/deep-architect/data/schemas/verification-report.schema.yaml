# Deep-Architect V1.0 — Verification Report Schema
# Output of Phase 6: Verification (final completeness audit)
# Consumed by: User (final deliverable), Deep-Verify V2.0 (external verification), Deep-Risk (risk input)

schema:
  version: "1.0.0"
  artifact: "verification-report.yaml"
  produced_by: "Phase 6"
  consumed_by: ["user", "deep-verify", "deep-risk"]

structure:
  metadata:
    version: "string (required)"
    timestamp: "ISO-8601 (required)"
    process_version: "string (required) — deep-architect version"
    depth_level: "enum: quick|standard|deep (required)"
    total_execution_time: "string (required) — actual time"
    estimated_time: "string (required) — from config"

  assumptions:
    - id: "string (required) — A-6XX format"
      assumption: "string (required)"
      confidence: "float 0.0-1.0 (required)"
      falsification: "string (required)"
      impact_if_wrong: "string (required)"

  # --- Operations Completeness ---
  operations_audit:
    total_required: 16
    total_executed: "integer (required) — MUST be 16"

    canonical_operations:
      - id: "integer 1-8 (required)"
        name: "string (required)"
        status: "enum: EXECUTED|SKIPPED (required)"
        artifact_reference: "string (required) — where output stored"
        evidence: "string (required) — proof of execution"
    canonical_count: "integer (required) — MUST be 8"

    adversarial_operations:
      - id: "integer 1-8 (required)"
        name: "string (required)"
        status: "enum: EXECUTED|SKIPPED (required)"
        artifact_reference: "string (required)"
        evidence: "string (required)"
    adversarial_count: "integer (required) — MUST be 8"

  # --- Traceability Matrix ---
  traceability:
    description: "Maps requirements → design decisions → validation"
    entries:
      - requirement: "string (required) — from user brief"
        design_element: "string (required) — C-XXX, I-XXX, or ADR-XXX"
        validation: "string (required) — VI-XXX or VT-XXX reference"
        status: "enum: traced|partially_traced|untraceable (required)"
    coverage:
      total_requirements: "integer (required)"
      fully_traced: "integer (required)"
      partially_traced: "integer (required)"
      untraceable: "integer (required)"
      coverage_percentage: "float (required)"

  # --- Gate Summary ---
  gates_summary:
    - gate: "string (required) — GATE_0 through GATE_6"
      status: "enum: OPEN|LOCKED (required)"
      conditions_total: "integer (required)"
      conditions_passed: "integer (required)"
      conditions_failed: "integer (required)"
      scope_reductions: "integer (required)"
      failure_details: "string[] — failed condition descriptions"
    all_gates_open: "boolean (required)"

  # --- Assumptions Summary ---
  assumptions_summary:
    total_across_phases: "integer (required) — MUST be >= 10"
    by_phase:
      - phase: "integer (required)"
        count: "integer (required)"
        critical_assumptions: "string[] — highest impact"
    unvalidated: "string[] — assumptions not yet tested"
    falsified: "string[] — assumptions proven wrong"

  # --- Scope Reductions ---
  scope_reductions:
    total: "integer (required)"
    entries:
      - gate: "string (required)"
        item_skipped: "string (required)"
        reason: "string (required)"
        impact: "string (required)"
        user_approved: "boolean (required)"
    impact_assessment: "string (required) — overall impact of all reductions"

  # --- Counter-Checks Summary ---
  counter_checks_summary:
    total_executed: "integer (required)"
    minimum_required: "integer (required) — from depth level"
    by_phase:
      - phase: "integer (required)"
        count: "integer (required)"
        methods_used: "string[] (required)"
    passed: "integer (required)"
    failed: "integer (required)"
    warnings: "integer (required)"

  # --- Invariant Compliance ---
  invariant_compliance:
    - invariant: "string (required) — INV-XX"
      name: "string (required)"
      status: "enum: COMPLIANT|VIOLATED|NOT_APPLICABLE (required)"
      evidence: "string (required)"
    total_compliant: "integer (required)"
    total_invariants: 12

  # --- Final Verdict ---
  verdict:
    status: "enum: PASS|CONDITIONAL_PASS|FAIL (required)"
    confidence: "float 0.0-1.0 (required)"
    summary: "string (required) — 2-3 sentence assessment"
    strengths: "string[] (required)"
    weaknesses: "string[] (required)"
    recommendations: "string[] (required)"
    ready_for:
      deep_risk: "boolean (required) — ready for risk assessment"
      deep_verify: "boolean (required) — ready for verification"
      implementation: "boolean (required) — ready for development"

  checklist:
    - item: "string (required)"
      status: "enum: PASS|FAIL (required)"

  counter_checks:
    - method: "string (required)"
      result: "string (required)"
      status: "enum: PASS|FAIL|WARNING (required)"

validation_rules:
  - "operations_audit.total_executed MUST equal 16"
  - "operations_audit.canonical_count MUST equal 8"
  - "operations_audit.adversarial_count MUST equal 8"
  - "gates_summary: ALL 7 gates present"
  - "assumptions_summary.total_across_phases >= 10"
  - "counter_checks_summary.total_executed >= minimum_required"
  - "invariant_compliance: all 12 invariants checked"
  - "verdict.status MUST be one of: PASS, CONDITIONAL_PASS, FAIL"
  - "verdict.confidence between 0.0 and 1.0"
  - "checklist items present"
