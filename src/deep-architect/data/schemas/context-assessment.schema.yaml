# Deep-Architect V1.0 — Context Assessment Schema
# Output of Phase 0: Context Assessment
# Consumed by: Phase 1 (execution mode), Phase 3 (compliance domain), Phase 6 (traceability)

schema:
  version: "1.0.0"
  artifact: "context-assessment.yaml"
  produced_by: "Phase 0"
  consumed_by: ["Phase 1", "Phase 3", "Phase 4", "Phase 6"]

structure:
  metadata:
    version: "string (required) — schema version"
    timestamp: "ISO-8601 (required)"
    depth_level: "enum: quick|standard|deep (required)"
    process_version: "string (required) — deep-architect version"

  project:
    name: "string (required) — project/system name"
    description: "string (required) — 1-3 sentence summary"
    scope: "string (required) — what is being architected"
    constraints_summary: "string (optional) — key limitations"

  domain:
    classification: "enum: web|embedded|data|cloud|hybrid (required)"
    sub_domain: "string (optional) — specific area"
    evidence:
      - field: "string — what indicates this domain"
        source: "string — where evidence found"
    confidence: "float 0.0-1.0 (required)"

  team:
    size: "integer (required) — number of people"
    expertise_level: "enum: junior|mid|senior|mixed (required)"
    maturity: "enum: low|medium|high (required)"
    architecture_experience: "boolean (required)"
    evidence: "string (required) — basis for assessment"

  constraints:
    budget:
      level: "enum: limited|moderate|generous|unknown (required)"
      details: "string (optional)"
    timeline:
      level: "enum: urgent|normal|flexible|unknown (required)"
      details: "string (optional)"
    culture:
      type: "enum: startup|corporate|regulated|academic|unknown (required)"
      details: "string (optional)"
    technical:
      - constraint: "string — technical limitation"
        impact: "string — how it affects architecture"
    regulatory:
      - regulation: "string — applicable regulation"
        impact: "string — compliance requirement"

  requirements_stability:
    score: "float 0.0-1.0 (required)"
    rationale: "string (required) — basis for score"
    evidence:
      - factor: "string — stability factor"
        direction: "enum: stable|unstable"
        weight: "float 0.0-1.0"

  execution_mode:
    selected: "enum: iterative|waterfall|hybrid (required)"
    rationale: "string (required) — why this mode"
    derived_from:
      stability_score: "float — requirements_stability.score"
      team_maturity: "string — team.maturity"
      domain: "string — domain.classification"

  assumptions:
    - id: "string (required) — A-0XX format"
      assumption: "string (required) — what is assumed"
      confidence: "float 0.0-1.0 (required)"
      falsification: "string (required) — how to disprove"
      impact_if_wrong: "string (required)"

  checklist:
    - item: "string (required)"
      status: "enum: PASS|FAIL (required)"

  counter_checks:
    - method: "string (required) — method name + ID"
      result: "string (required) — what was found"
      status: "enum: PASS|FAIL|WARNING (required)"

validation_rules:
  - "domain.classification MUST be one of: web, embedded, data, cloud, hybrid"
  - "requirements_stability.score MUST be between 0.0 and 1.0"
  - "execution_mode.selected MUST be one of: iterative, waterfall, hybrid"
  - "assumptions.length >= 1"
  - "checklist.length >= 5"
  - "counter_checks.length >= depth_counter_check_minimum"
