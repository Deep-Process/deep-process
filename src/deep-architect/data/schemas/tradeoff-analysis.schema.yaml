# Deep-Architect V1.0 — Trade-off Analysis Schema
# Output of Phase 4: Trade-off Analysis (ATAM/CBAM)
# Consumed by: Phase 5 (validation), Phase 6 (traceability)

schema:
  version: "1.0.0"
  artifact: "tradeoff-analysis.yaml"
  produced_by: "Phase 4"
  consumed_by: ["Phase 5", "Phase 6"]

structure:
  metadata:
    version: "string (required)"
    timestamp: "ISO-8601 (required)"
    sources:
      - "canonical-operations.yaml"
      - "architecture-model.yaml"
      - "adversary-findings.yaml"

  assumptions:
    - id: "string (required) — A-4XX format"
      assumption: "string (required)"
      confidence: "float 0.0-1.0 (required)"
      falsification: "string (required)"
      impact_if_wrong: "string (required)"

  # --- ATAM Analysis ---
  atam:
    quality_attribute_tree:
      - attribute: "string (required) — top-level ISO 25010"
        refinements:
          - sub_attribute: "string (required)"
            scenarios: "string[] — SA-XXX references"

    scenarios:
      - id: "string (required) — SA-XXX format"
        type: "enum: use_case|growth|exploratory (required)"
        stimulus: "string (required) — what triggers"
        source: "string (required) — who/what triggers"
        environment: "string (required) — system state"
        artifact: "string (required) — what is affected"
        response: "string (required) — expected behavior"
        response_measure: "string (required) — measurable outcome"
        attribute: "string (required) — quality attribute"
        priority: "enum: high|medium|low (required)"
    minimum_scenarios: 3

    sensitivity_points:
      - id: "string (required) — SP-XXX format"
        component: "string (required) — C-XXX affected"
        attribute: "string (required) — quality attribute"
        description: "string (required) — why sensitive"
        impact: "string (required) — what changes if modified"
    minimum_count: 2

    tradeoff_points:
      - id: "string (required) — TP-XXX format"
        attribute_a: "string (required)"
        attribute_b: "string (required)"
        component: "string (required) — C-XXX"
        description: "string (required) — nature of trade-off"
        current_position: "string (required) — where on spectrum"
        rationale: "string (required) — why this position"
        alternatives:
          - position: "string (required)"
            pros: "string[] (required)"
            cons: "string[] (required)"
    minimum_count: 2

  # --- CBAM Analysis ---
  cbam:
    cost_benefit:
      - strategy: "string (required) — architectural strategy"
        quality_attributes_affected: "string[] (required)"
        costs:
          development: "string (required) — estimated effort"
          operational: "string (required) — ongoing cost"
          risk: "string (required) — implementation risk"
        benefits:
          - attribute: "string (required)"
            improvement: "string (required) — how much better"
            confidence: "float 0.0-1.0 (required)"
        roi_assessment: "string (required) — cost vs benefit summary"

    ranking:
      - rank: "integer (required)"
        strategy: "string (required)"
        roi_score: "string (required) — relative benefit/cost"
        recommendation: "enum: adopt|defer|reject (required)"
        rationale: "string (required)"

  # --- Decisions ---
  decisions:
    - id: "string (required) — D-XXX format"
      description: "string (required) — what was decided"
      rationale: "string (required) — why"
      trade_off_point: "string (optional) — TP-XXX reference"
      alternatives_rejected:
        - option: "string (required)"
          reason: "string (required)"
      reversibility: "enum: reversible|partially_reversible|irreversible (required)"
      confidence: "float 0.0-1.0 (required)"

  checklist:
    - item: "string (required)"
      status: "enum: PASS|FAIL (required)"

  counter_checks:
    - method: "string (required)"
      result: "string (required)"
      status: "enum: PASS|FAIL|WARNING (required)"

validation_rules:
  - "atam.scenarios.length >= 3"
  - "atam.sensitivity_points.length >= 2"
  - "atam.tradeoff_points.length >= 2"
  - "cbam.cost_benefit.length >= 1"
  - "decisions[].rationale MUST exist for all decisions"
  - "assumptions.length >= 2"
  - "checklist items present"
