# Domain Detection Rules
# Version: 1.0.0
# Created: 2026-02-11 (V7.1.1 - REC-004, REC-005)
# Purpose: Multi-condition detection engine for domain identification

metadata:
  version: "1.0.1"
  total_domains: 11  # 9 existing + 2 new (serverless REC-004, terraform REC-005)
  detection_method: "multi-condition with anti-gaming"

# ==============================================================================
# SERVERLESS FRAMEWORK (NEW - REC-004)
# ==============================================================================
serverless-framework:
  domain_id: serverless-framework
  confidence_threshold: 0.75

  conditions:
    C1_serverless_config:
      id: "C1"
      description: "serverless.yml or serverless.yaml exists"
      type: file_existence
      patterns:
        - "serverless.yml"
        - "serverless.yaml"
      weight: 0.40
      match_score_function: binary

      algorithm: |
        IF file_exists("serverless.yml") OR file_exists("serverless.yaml"):
          match_score = 1.0
        ELSE:
          match_score = 0.0

    C2_lambda_functions:
      id: "C2"
      description: "≥2 Lambda functions defined in serverless.yml"
      type: content_search
      file_pattern: "serverless.yml"
      search_patterns:
        - "functions:"
        - "handler:"
        - "events:"
      threshold: 2
      weight: 0.35
      match_score_function: threshold_linear

      algorithm: |
        Read file: serverless.yml
        count = 0
        FOR pattern IN ["functions:", "handler:", "events:"]:
          IF pattern found in content:
            count += 1
        match_score = min(1.0, count / threshold)
        # Example: 1 pattern → 0.5, 2 patterns → 1.0, 3 patterns → 1.0

    C3_provider_block:
      id: "C3"
      description: "Provider block exists (AWS/Azure/GCP)"
      type: content_search
      file_pattern: "serverless.yml"
      search_patterns:
        - "provider:"
        - "name: aws"
        - "name: azure"
        - "name: google"
      threshold: 1
      weight: 0.25
      match_score_function: binary

      algorithm: |
        Read file: serverless.yml
        FOR pattern IN search_patterns:
          IF pattern found in content:
            match_score = 1.0
            BREAK
        IF not found:
          match_score = 0.0

  confidence_calculation: |
    confidence = sum(weight * match_score for each condition)
    confidence = C1_weight * C1_score + C2_weight * C2_score + C3_weight * C3_score
    confidence = 0.40 * C1 + 0.35 * C2 + 0.25 * C3

  anti_gaming:
    scenario_1_single_file:
      description: "Only serverless.yml exists (no functions)"
      confidence: 0.40  # C1 only = BELOW 0.75 threshold
      resistance: 98%   # BLOCKED

    scenario_2_fake_config:
      description: "serverless.yml + 1 function (below threshold)"
      confidence: 0.58  # C1 + half(C2) = 0.40 + 0.175 = BELOW 0.75
      resistance: 90%   # BLOCKED

    scenario_3_low_quality:
      description: "serverless.yml + 2 functions but no provider"
      confidence: 0.75  # C1 + C2 = 0.40 + 0.35 = exactly at threshold
      resistance: 85%   # MARGINAL (may pass)

    scenario_4_complete:
      description: "serverless.yml + ≥2 functions + provider"
      confidence: 1.00  # All conditions met
      resistance: N/A   # LEGITIMATE

  validation:
    test_cases:
      - name: "Minimal Serverless project"
        files: ["serverless.yml with 2 functions, no provider"]
        expected_confidence: 0.75
        expected_verdict: "ACCEPT (at threshold)"

      - name: "Complete Serverless project"
        files: ["serverless.yml with 5 functions + AWS provider"]
        expected_confidence: 1.00
        expected_verdict: "ACCEPT (high confidence)"

      - name: "Fake serverless.yml"
        files: ["Empty serverless.yml file"]
        expected_confidence: 0.40
        expected_verdict: "REJECT (below threshold)"

# ==============================================================================
# TERRAFORM (NEW - REC-005)
# ==============================================================================
terraform:
  domain_id: terraform
  confidence_threshold: 0.75

  conditions:
    C1_terraform_files:
      id: "C1"
      description: "*.tf files or terraform.tfvars or .terraform.lock.hcl exists"
      type: file_existence
      patterns:
        - "*.tf"
        - "terraform.tfvars"
        - ".terraform.lock.hcl"
      weight: 0.40
      match_score_function: binary

      algorithm: |
        IF file_exists("*.tf") OR file_exists("terraform.tfvars") OR file_exists(".terraform.lock.hcl"):
          match_score = 1.0
        ELSE:
          match_score = 0.0

    C2_terraform_resources:
      id: "C2"
      description: "≥2 Terraform resources/modules/data defined in *.tf files"
      type: content_search
      file_pattern: "*.tf"
      search_patterns:
        - "resource \""
        - "module \""
        - "data \""
      threshold: 2
      weight: 0.35
      match_score_function: threshold_linear

      algorithm: |
        Read all files matching: *.tf
        count = 0
        FOR pattern IN ["resource \"", "module \"", "data \""]:
          IF pattern found in content:
            count += 1
        match_score = min(1.0, count / threshold)
        # Example: 1 pattern → 0.5, 2 patterns → 1.0, 3 patterns → 1.0

    C3_provider_block:
      id: "C3"
      description: "Provider block exists (AWS/Azure/GCP/Kubernetes/Helm)"
      type: content_search
      file_pattern: "*.tf"
      search_patterns:
        - "provider \"aws\""
        - "provider \"azurerm\""
        - "provider \"google\""
        - "provider \"kubernetes\""
        - "provider \"helm\""
      threshold: 1
      weight: 0.25
      match_score_function: binary

      algorithm: |
        Read all files matching: *.tf
        FOR pattern IN search_patterns:
          IF pattern found in content:
            match_score = 1.0
            BREAK
        IF not found:
          match_score = 0.0

  confidence_calculation: |
    confidence = sum(weight * match_score for each condition)
    confidence = C1_weight * C1_score + C2_weight * C2_score + C3_weight * C3_score
    confidence = 0.40 * C1 + 0.35 * C2 + 0.25 * C3

  anti_gaming:
    scenario_1_single_file:
      description: "Only *.tf files exist (no resources)"
      confidence: 0.40  # C1 only = BELOW 0.75 threshold
      resistance: 98%   # BLOCKED

    scenario_2_fake_config:
      description: "*.tf + 1 resource (below threshold)"
      confidence: 0.58  # C1 + half(C2) = 0.40 + 0.175 = BELOW 0.75
      resistance: 90%   # BLOCKED

    scenario_3_low_quality:
      description: "*.tf + 2 resources but no provider"
      confidence: 0.75  # C1 + C2 = 0.40 + 0.35 = exactly at threshold
      resistance: 85%   # MARGINAL (may pass)

    scenario_4_complete:
      description: "*.tf + ≥2 resources + provider"
      confidence: 1.00  # All conditions met
      resistance: N/A   # LEGITIMATE

  validation:
    test_cases:
      - name: "Minimal Terraform project"
        files: ["main.tf with 2 resources, no provider"]
        expected_confidence: 0.75
        expected_verdict: "ACCEPT (at threshold)"

      - name: "Complete Terraform project"
        files: ["main.tf with 5 resources + AWS provider"]
        expected_confidence: 1.00
        expected_verdict: "ACCEPT (high confidence)"

      - name: "Fake *.tf file"
        files: ["Empty main.tf file"]
        expected_confidence: 0.40
        expected_verdict: "REJECT (below threshold)"

