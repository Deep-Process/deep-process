# ==============================================================================
# SERVERLESS FRAMEWORK PATTERNS (NEW - REC-004)
# ==============================================================================

- pattern_id: QP-SERVERLESS-STAGES
  name: "Serverless Framework Stages"
  version: "1.0.0"
  category: deployment
  domain: serverless-framework

  description: "DTAP environments via Serverless stages (dev, test, prod)"

  detection_triggers:
    - "stages: section in serverless.yml"
    - "stage: ${opt:stage} in provider configuration"
    - "Stage-specific environment variables"

  documentation_requirements:
    - id: "DOC-SLS-01"
      requirement: "Document all stages used (dev, test, staging, prod)"
      section: "Deployment Guide > Environments"

    - id: "DOC-SLS-02"
      requirement: "Document stage-specific configuration differences"
      section: "Architecture > Configuration Management"
      examples:
        - "Environment variables per stage"
        - "Resource names per stage (DynamoDB tables, SNS topics)"
        - "IAM roles per stage"

    - id: "DOC-SLS-03"
      requirement: "Document deployment commands per stage"
      section: "Deployment Guide > Commands"
      examples:
        - "serverless deploy --stage dev"
        - "serverless deploy --stage prod"
        - "serverless remove --stage dev"

  evidence_sources:
    - file: "serverless.yml"
      sections: ["provider.stage", "custom.stages"]
    - file: "package.json"
      sections: ["scripts"]
    - file: ".env.dev, .env.test, .env.prod"
      note: "Stage-specific environment files"

  quality_checks:
    - check_id: "QC-SLS-01"
      description: "All stages documented"
      validation: "Count stages in serverless.yml == count stages in docs"

    - check_id: "QC-SLS-02"
      description: "Stage differences explained"
      validation: "≥3 configuration differences documented per stage"

---

- pattern_id: QP-SERVERLESS-PLUGINS
  name: "Serverless Plugins"
  version: "1.0.0"
  category: architecture
  domain: serverless-framework

  description: "Plugin ecosystem (serverless-offline, serverless-webpack, etc.)"

  detection_triggers:
    - "plugins: section in serverless.yml"
    - "serverless-plugin-* in package.json dependencies"

  documentation_requirements:
    - id: "DOC-SLS-04"
      requirement: "List all plugins used"
      section: "Architecture > Build & Development Tools"
      format: "markdown table"
      columns: ["Plugin Name", "Purpose", "Configuration"]

    - id: "DOC-SLS-05"
      requirement: "Document plugin configuration"
      section: "Architecture > Plugin Configuration"
      examples:
        - "serverless-webpack: bundling settings"
        - "serverless-offline: local development setup"
        - "serverless-prune-plugin: version cleanup"

    - id: "DOC-SLS-06"
      requirement: "Document plugin purpose and alternatives"
      section: "Architecture > Technology Decisions"
      examples:
        - "Why serverless-webpack vs serverless-esbuild?"
        - "Why serverless-offline for local dev?"

  evidence_sources:
    - file: "serverless.yml"
      sections: ["plugins", "custom.webpack", "custom.prune"]
    - file: "package.json"
      sections: ["devDependencies"]

  quality_checks:
    - check_id: "QC-SLS-03"
      description: "All plugins listed"
      validation: "Plugin count in serverless.yml == plugin count in docs"

    - check_id: "QC-SLS-04"
      description: "Plugin purposes explained"
      validation: "Each plugin has ≥1 sentence purpose description"

---

- pattern_id: QP-SERVERLESS-PROVIDER
  name: "Multi-Cloud Provider Configuration"
  version: "1.0.0"
  category: infrastructure
  domain: serverless-framework

  description: "Cloud provider abstraction (AWS, Azure, GCP)"

  detection_triggers:
    - "provider.name in serverless.yml"
    - "provider.runtime in serverless.yml"
    - "provider.region in serverless.yml"

  documentation_requirements:
    - id: "DOC-SLS-07"
      requirement: "Document cloud provider"
      section: "Infrastructure > Cloud Provider"
      examples:
        - "AWS (primary provider)"
        - "Azure Functions (alternative)"
        - "Google Cloud Functions"

    - id: "DOC-SLS-08"
      requirement: "Document provider-specific configuration"
      section: "Infrastructure > Provider Settings"
      details:
        - "Runtime: nodejs18.x, python3.9, etc."
        - "Region: us-east-1, eu-west-1, etc."
        - "Memory size: 128MB, 256MB, 512MB"
        - "Timeout: 30s, 60s, etc."

    - id: "DOC-SLS-09"
      requirement: "Document provider IAM roles and permissions"
      section: "Infrastructure > Security"
      examples:
        - "Execution role ARN"
        - "IAM permissions required (DynamoDB, S3, SNS)"

  evidence_sources:
    - file: "serverless.yml"
      sections: ["provider"]

  quality_checks:
    - check_id: "QC-SLS-05"
      description: "Provider documented"
      validation: "provider.name appears in Infrastructure section"

    - check_id: "QC-SLS-06"
      description: "Runtime and region specified"
      validation: "runtime AND region documented in Infrastructure"

---

# ==============================================================================
# TERRAFORM PATTERNS (NEW - REC-005)
# ==============================================================================

- pattern_id: QP-TERRAFORM-MODULES
  name: "Terraform Module Structure"
  version: "1.0.0"
  category: architecture
  domain: terraform

  description: "Module composition and reusability patterns"

  detection_triggers:
    - "module block in *.tf files"
    - "Subdirectories with module structure (variables.tf, outputs.tf, main.tf)"
    - "Module sources (local paths, registry, git)"

  documentation_requirements:
    - id: "DOC-TF-01"
      requirement: "List all modules used (local and remote)"
      section: "Architecture > Module Structure"
      format: "markdown table"
      columns: ["Module Name", "Source", "Purpose", "Key Inputs", "Key Outputs"]

    - id: "DOC-TF-02"
      requirement: "Document module hierarchy and dependencies"
      section: "Architecture > Module Dependencies"
      examples:
        - "Root module → networking module → VPC submodule"
        - "Application module → database module dependency"

    - id: "DOC-TF-03"
      requirement: "Document module versioning strategy"
      section: "Architecture > Module Versioning"
      examples:
        - "Registry modules with version constraints"
        - "Git-sourced modules with ref/tag"

  evidence_sources:
    - file: "*.tf"
      sections: ["module blocks"]
    - file: "modules/**/main.tf"
      note: "Local module definitions"

  quality_checks:
    - check_id: "QC-TF-01"
      description: "All modules documented"
      validation: "Module count in *.tf == module count in docs"

    - check_id: "QC-TF-02"
      description: "Module purposes explained"
      validation: "Each module has ≥1 sentence purpose description"

---

- pattern_id: QP-TERRAFORM-STATE
  name: "Terraform State Management"
  version: "1.0.0"
  category: infrastructure
  domain: terraform

  description: "State storage, locking, and backend configuration"

  detection_triggers:
    - "terraform backend block in *.tf files"
    - "terraform.tfstate or terraform.tfstate.backup files"
    - "Backend configuration (S3, Azure Storage, GCS, Terraform Cloud)"

  documentation_requirements:
    - id: "DOC-TF-04"
      requirement: "Document state backend configuration"
      section: "Infrastructure > State Management"
      examples:
        - "S3 backend with DynamoDB locking"
        - "Azure Storage backend"
        - "Terraform Cloud remote state"
        - "Local state (development only)"

    - id: "DOC-TF-05"
      requirement: "Document state locking mechanism"
      section: "Infrastructure > State Locking"
      details:
        - "DynamoDB table for S3 backend"
        - "Blob lease for Azure Storage"
        - "GCS locking"

    - id: "DOC-TF-06"
      requirement: "Document state backup and recovery procedures"
      section: "Operations > State Recovery"
      examples:
        - "Manual state backup commands"
        - "S3 versioning for state files"
        - "State import/export procedures"

  evidence_sources:
    - file: "*.tf"
      sections: ["terraform.backend"]
    - file: "terraform.tfstate"
      note: "Local state file (if present)"

  quality_checks:
    - check_id: "QC-TF-03"
      description: "Backend documented"
      validation: "Backend type appears in Infrastructure section"

    - check_id: "QC-TF-04"
      description: "Locking mechanism specified"
      validation: "Locking configuration documented (if backend supports)"

---

- pattern_id: QP-TERRAFORM-WORKSPACE
  name: "Terraform Workspace Configuration"
  version: "1.0.0"
  category: deployment
  domain: terraform

  description: "Workspace usage for environment separation (dev, staging, prod)"

  detection_triggers:
    - "terraform workspace commands in scripts"
    - "terraform.workspace variable references in *.tf"
    - "Workspace-specific variable files (dev.tfvars, prod.tfvars)"

  documentation_requirements:
    - id: "DOC-TF-07"
      requirement: "List all workspaces used"
      section: "Deployment Guide > Workspaces"
      examples:
        - "default (development)"
        - "staging"
        - "production"

    - id: "DOC-TF-08"
      requirement: "Document workspace-specific configuration"
      section: "Deployment Guide > Environment Configuration"
      examples:
        - "Variable files per workspace (dev.tfvars, prod.tfvars)"
        - "Resource naming per workspace"
        - "Provider configuration per workspace"

    - id: "DOC-TF-09"
      requirement: "Document workspace management commands"
      section: "Deployment Guide > Workspace Commands"
      examples:
        - "terraform workspace select dev"
        - "terraform workspace new staging"
        - "terraform workspace list"

  evidence_sources:
    - file: "*.tf"
      sections: ["terraform.workspace references"]
    - file: "*.tfvars"
      note: "Workspace-specific variable files"
    - file: "scripts/*.sh"
      note: "Deployment scripts with workspace commands"

  quality_checks:
    - check_id: "QC-TF-05"
      description: "All workspaces documented"
      validation: "Workspace references in code == workspace count in docs"

    - check_id: "QC-TF-06"
      description: "Workspace purposes explained"
      validation: "Each workspace has environment mapping documented"

