# Deep-Document V7.1.1 - Configuration
# Thresholds, patterns, timeouts for process execution
# Version: 7.1.1

# ==============================================================================
# QUALITY THRESHOLDS (V6.2 inherited)
# ==============================================================================
quality:
  max_paragraph_length: 300          # R1, GG-10 (chars)
  min_structure_depth: 2.0            # R8, GG-11 (avg heading levels)
  max_unknown_ratio: 0.10             # R6, GG-12 (10%)
  max_inline_citation_density: 0.30   # R5, GG-14 (30%)

# ==============================================================================
# SEGMENTATION STRATEGY (V6.1.1 anti-over-segmentation)
# ==============================================================================
segmentation:
  whole_file_threshold: 3000          # Files <3000 lines: no segmentation
  max_segment_lines: 1500             # Max segment size
  min_segment_lines: 1000             # Min segment size (for ≥3000 line files)

# ==============================================================================
# TEMPLATE COVERAGE (V6.2 + V7)
# ==============================================================================
template:
  min_coverage_ratio: 0.90            # INV-25, GP-09, GP-15 (90%)
  semantic_similarity_threshold: 0.90 # GP-15 cosine similarity (NEW V7)

# ==============================================================================
# INCREMENTAL MODE (V6.3)
# ==============================================================================
incremental:
  min_preservation_ratio: 0.80        # ≥80% base preserved or abort to FULL

# ==============================================================================
# BATCH PROCESSING (V7.1.1)
# ==============================================================================
batch:
  init_batch_size: 200                # STATE_INIT: files per batch (REC-001)
  ontology_batch_size: 50             # STATE_ONTOLOGY_EXTRACTION: files per batch (C-01)

# ==============================================================================
# TIMEOUTS (V7)
# ==============================================================================
timeouts:
  transitive_closure_ms: 600000       # 10 minutes for Method #159 O(N³)
  gemini_extraction_ms: 120000        # 2 minutes for Gemini API call
  init_batch_timeout_ms: 300000       # 5 minutes for STATE_INIT per batch (NEW V7.1.1)

# ==============================================================================
# PD-UNIVERSAL: 93+ PLACEHOLDER PATTERNS (V7.1.1 REC-003)
# ==============================================================================
# Used by Method #168 Phantom Hunt at 8 gates
# Enforcement: BLOCKER if ANY pattern detected
# Categories: 11 total (8 original V7 + 3 new REC-003)
placeholder_patterns:

  # Category 1: Ellipsis (15 patterns)
  ellipsis:
    - pattern: "..."
      type: "literal"
    - pattern: "…"           # Unicode ellipsis
      type: "literal"
    - pattern: "[...]"
      type: "literal"
    - pattern: "<...>"
      type: "literal"
    - pattern: "(...)"
      type: "literal"
    - pattern: "{...}"
      type: "literal"
    - pattern: '"..."'
      type: "quoted"
    - pattern: "'...'"
      type: "single_quoted"
    - pattern: "//...//"
      type: "regex"
    - pattern: "<!-- ... -->"
      type: "html_comment"
    - pattern: "etc."
      type: "literal"
    - pattern: "and so on"
      type: "phrase"
    - pattern: "more here"
      type: "phrase"
    - pattern: "details omitted"
      type: "phrase"
    - pattern: "continued"
      type: "literal"

  # Category 2: Generic Names (12 patterns)
  generic_names:
    - pattern: "TODO"
      type: "literal"
    - pattern: "FIXME"
      type: "literal"
    - pattern: "TBD"
      type: "literal"
    - pattern: "PLACEHOLDER"
      type: "literal"
    - pattern: "FILL_IN"
      type: "literal"
    - pattern: "REPLACE_ME"
      type: "literal"
    - pattern: "[UNKNOWN]"
      type: "bracketed"
    - pattern: "NOT_IMPLEMENTED"
      type: "literal"
    - pattern: "COMING_SOON"
      type: "literal"
    - pattern: "PENDING"
      type: "literal"
    - pattern: "TO_BE_DETERMINED"
      type: "literal"
    - pattern: "UNDEFINED"
      type: "literal"

  # Category 3: Bracketed (10 patterns)
  bracketed:
    - pattern: "[content]"
      type: "generic_bracketed"
    - pattern: "<content>"
      type: "angle_brackets"
    - pattern: "{content}"
      type: "curly_brackets"
    - pattern: "(content)"
      type: "parentheses"
    - pattern: "[[content]]"
      type: "double_brackets"
    - pattern: "<<content>>"
      type: "double_angle"
    - pattern: "{{content}}"
      type: "double_curly"
    - pattern: "((content))"
      type: "double_parens"
    - pattern: "[insert X]"
      type: "insert_instruction"
    - pattern: "<add details>"
      type: "add_instruction"

  # Category 4: Handlebars (8 patterns)
  handlebars:
    - pattern: "{{var}}"
      type: "standard"
    - pattern: "{{{var}}}"
      type: "triple"
    - pattern: "{{ var }}"
      type: "spaced"
    - pattern: "{{#if var}}"
      type: "conditional"
    - pattern: "{{/if}}"
      type: "conditional_end"
    - pattern: "{%var%}"
      type: "jinja_style"
    - pattern: "{{var | filter}}"
      type: "filtered"
    - pattern: "{{ placeholder }}"
      type: "explicit_placeholder"

  # Category 5: XML-style (7 patterns)
  xml_style:
    - pattern: "<var>"
      type: "opening_tag"
    - pattern: "</var>"
      type: "closing_tag"
    - pattern: "<var/>"
      type: "self_closing"
    - pattern: "<var attr=\"value\">"
      type: "with_attributes"
    - pattern: "<?var?>"
      type: "processing_instruction"
    - pattern: "<![CDATA[...]]>"
      type: "cdata"
    - pattern: "<!DOCTYPE var>"
      type: "doctype"

  # Category 6: TODOs (6 patterns)
  todos:
    - pattern: "TODO:"
      type: "colon_suffix"
    - pattern: "FIXME:"
      type: "colon_suffix"
    - pattern: "NOTE:"
      type: "colon_suffix"
    - pattern: "HACK:"
      type: "colon_suffix"
    - pattern: "XXX:"
      type: "colon_suffix"
    - pattern: "BUG:"
      type: "colon_suffix"

  # Category 7: Filler Text (5 patterns)
  filler:
    - pattern: "Lorem ipsum"
      type: "lorem"
    - pattern: "Example text"
      type: "generic"
    - pattern: "Sample content"
      type: "generic"
    - pattern: "Test data"
      type: "generic"
    - pattern: "Placeholder text"
      type: "explicit"

  # Category 8: Metavariables (5 patterns)
  metavariables:
    - pattern: "$VAR"
      type: "dollar_prefix"
    - pattern: "%VAR%"
      type: "percent_wrapped"
    - pattern: "${VAR}"
      type: "dollar_braced"
    - pattern: "@VAR"
      type: "at_prefix"
    - pattern: "#VAR"
      type: "hash_prefix"

  # Category 9: Template Engines (15 patterns) - REC-003
  template_engines:
    # Mustache patterns (4)
    - pattern: "{{variable}}"
      type: "mustache"
    - pattern: "{{#section}}"
      type: "mustache_section"
    - pattern: "{{/section}}"
      type: "mustache_close"
    - pattern: "{{{raw}}}"
      type: "mustache_unescaped"

    # Jinja2 patterns (4)
    - pattern: "{% block %}"
      type: "jinja2_block"
    - pattern: "{% if %}"
      type: "jinja2_if"
    - pattern: "{% for %}"
      type: "jinja2_for"
    - pattern: "{% endfor %}"
      type: "jinja2_endfor"

    # Liquid patterns (4)
    - pattern: "{% assign %}"
      type: "liquid_assign"
    - pattern: "{% include %}"
      type: "liquid_include"
    - pattern: "{% unless %}"
      type: "liquid_unless"
    - pattern: "{{ page.variable }}"
      type: "liquid_variable"

    # FreeMarker patterns (2)
    - pattern: "<#if condition>"
      type: "freemarker_if"
    - pattern: "<#list items>"
      type: "freemarker_list"

    # Velocity patterns (1)
    - pattern: "#set($var = $value)"
      type: "velocity_set"

  # Category 10: Code Placeholders (5 patterns) - REC-003
  code_placeholders:
    - pattern: "stub()"
      type: "test_stub"
    - pattern: "mock()"
      type: "test_mock"
    - pattern: "fake()"
      type: "test_fake"
    - pattern: "pass"
      type: "python_placeholder"
    - pattern: "NotImplementedError"
      type: "exception_placeholder"

  # Category 11: Documentation Placeholders (5 patterns) - REC-003
  documentation_placeholders:
    - pattern: "[citation needed]"
      type: "wiki_citation"
    - pattern: "[source]"
      type: "source_placeholder"
    - pattern: "[ref]"
      type: "reference_placeholder"
    - pattern: "WIP"
      type: "work_in_progress"
    - pattern: "DRAFT"
      type: "draft_marker"

# Total: 93 patterns (68 original + 15 template engines + 5 code + 5 documentation)
# V7.1.1 REC-003: Expanded from 68 to 93 patterns

# ==============================================================================
# PATTERN EXCEPTIONS (V7.1.1 REC-003 Enhanced)
# ==============================================================================
# Placeholders allowed in these contexts:
exceptions:
  code_blocks:
    enabled: true
    pattern: "```.*?```"    # Fenced code blocks (markdown)

  literal_examples:
    enabled: true
    pattern: "`.*?`"        # Inline code (markdown)

  escaped_content:
    enabled: true
    pattern: "\\{\\{.*?\\}\\}"  # Escaped handlebars

  template_files:
    enabled: true
    extensions: ["*.mustache", "*.hbs", "*.handlebars", "*.j2", "*.jinja", "*.jinja2", "*.liquid", "*.ftl", "*.vm", "*.tmpl"]
    note: "Template files legitimately contain template engine syntax"

  template_directories:
    enabled: true
    paths: ["templates/", "views/", "layouts/", "partials/", "_includes/"]
    note: "Files in template directories allowed to have template syntax"

  documentation_context:
    enabled: true
    markers: ["Example:", "Template:", "Pattern:", "Syntax:"]
    note: "Documentation showing template syntax as examples"

# ==============================================================================
# DOMAIN DETECTION (V6.2.1)
# ==============================================================================
# See data/patterns/domain-detection-rules.yaml for full rules
# This config contains only thresholds
domain_detection:
  confidence_thresholds:
    aws_cdk: 0.80
    event_driven_serverless: 0.75
    api_gateway: 0.70
    react: 0.80
    external_integrations: 0.65
    multi_tenant: 0.75

# ==============================================================================
# GROUNDING MECHANISMS (V7)
# ==============================================================================
grounding:
  sample_size: 3                      # CC1: sample 3 items for verification
  verifiability_threshold: 0.95       # Gemini extraction ≥95% verifiable
  phantom_tolerance: 0                # CC2: 0 phantoms allowed (strict)

# ==============================================================================
# TOPOLOGY METRICS (V7)
# ==============================================================================
topology:
  high_priority_percentile: 0.20      # Top 20% centrality = high-priority diagrams
  centrality_weights:
    betweenness: 0.30
    closeness: 0.25
    degree: 0.25
    pagerank: 0.20
