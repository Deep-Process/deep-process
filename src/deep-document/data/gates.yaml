# ------------------------------------------------------------------------------
# GATE_OE: Ontology Extraction (NEW V7)
# ------------------------------------------------------------------------------
gate_oe:
  name: "GATE_OE: Ontology Extraction"
  state: STATE_ONTOLOGY_EXTRACTION
  total_conditions: 10  # UPDATED: 8 → 10 (added GOE-09, GOE-10 for batch processing)
  new_in_v7: true

  conditions:
    goe_01:
      id: "GOE-01"
      description: "domain-ontology.yaml exists"
      severity: BLOCKER
      verification: "File exists check"
      failure_action: "Transition to STATE_ERROR"

    goe_02:
      id: "GOE-02"
      description: "≥5 entities extracted OR SCOPE_REDUCTION logged"
      severity: BLOCKER
      verification: "Count entities[], check scope_reductions[]"
      failure_action: "Transition to STATE_ERROR"

    goe_03:
      id: "GOE-03"
      description: "Entity relationships mapped"
      severity: CRITICAL
      verification: "Check relationships[] non-empty"
      failure_action: "User decides: retry / skip / abort"

    goe_04:
      id: "GOE-04"
      description: "Gemini extraction confidence ≥0.95 OR limitation logged"
      severity: WARNING
      verification: "Read extraction_confidence, check limitations[]"
      failure_action: "Log only, continue (fallback to low-confidence ontology)"
      note: "P0-R-01 BLOCKED - 30-40% risk if Gemini <0.95"

    goe_05:
      id: "GOE-05"
      description: "ASSUMPTIONS_DECLARED"
      severity: CRITICAL
      verification: "Check assumptions[] non-empty"
      failure_action: "User decides: retry / skip / abort"
      grounding_mechanism: "GOE-01"

    goe_06:
      id: "GOE-06"
      description: "Grounding evidence provided"
      severity: ERROR
      verification: "Check grounding_evidence{} exists with file locations"
      failure_action: "Log warning, continue"
      grounding_mechanism: "GOE-02"

    goe_07:
      id: "GOE-07"
      description: "Counter-checks executed (CC1, CC2, CC3)"
      severity: ERROR
      verification: "Verify counter_checks{} with results (Method #85, #168, #84)"
      failure_action: "Log warning, continue"
      grounding_mechanism: "GOE-06"

    goe_08:
      id: "GOE-08"
      description: "Ontology version incremented"
      severity: WARNING
      verification: "Compare version with previous"
      failure_action: "Log only"

    goe_09:  # NEW: Batch merge integrity validation
      id: "GOE-09"
      description: "Batch merge integrity validation (if batch processing used)"
      severity: CRITICAL
      verification: |
        IF metadata.extraction_mode == "BATCH_PROCESSING":
          - Verify quality_metrics.merge_integrity == "PASS"
          - Verify batch_metadata.deduplication_ratio in range 0.05-0.50
          - Verify batch_metadata.entities_after_merge <= entities_before_merge
        ELSE:
          - Skip (single-pass mode)
      failure_action: "User decides: retry with different batch size / skip / abort"
      prevents: "Excessive entity duplication or loss during batch merge"
      method: "#84 Coherence Check (delta math validation)"

    goe_10:  # NEW: Grounding rate validation
      id: "GOE-10"
      description: "Entity grounding rate ≥70% (Method #85)"
      severity: BLOCKER
      verification: |
        - Verify quality_metrics.grounding_rate >= 0.70
        - BLOCKER if <0.70 (indicates phantom entities)
        - WARNING if <0.95 (indicates low confidence extraction)
      failure_action: "Transition to STATE_ERROR (phantom entities detected)"
      prevents: "Hallucinated entities without source file backing"
      method: "#85 Grounding Check (sample 10% entities, verify in source files)"

