# Deep-Document V7.0.0 - Gate Definitions
# 21 binding gates ensuring correctness and completeness
# Version: 7.0.0
# Last Updated: 2026-02-11

# ==============================================================================
# OVERVIEW
# ==============================================================================
# V7 has 23 total gates (UPDATED: 21 → 23 with C-03 fix):
# - 10 processing gates (including 2 NEW: GATE_OE, GATE_TA)
# - 8 incremental gates (6 from V6.3 + 2 NEW V7: GATE_OE_INCREMENTAL, GATE_TA_INCREMENTAL)
# - 3 iterative gates (from V6.1/V6.2)
# - 4 user approval gates (from V6.0)
#
# NEW V7 Gates:
# - GATE_OE: Ontology Extraction (10 conditions, UPDATED: 8 → 10 with C-01 fix)
# - GATE_TA: Template Analysis (6 conditions)
# - GATE_OE_INCREMENTAL_VERIFY: Ontology Incremental (8 conditions) ← C-03 FIX
# - GATE_TA_INCREMENTAL_VERIFY: Template Incremental (6 conditions) ← C-03 FIX
# - GP-15: Semantic Matching (part of GATE_P, 1 condition, FAISS-optimized) ← C-02 FIX
#
# Gate Severity Levels:
# - BLOCKER: Immediate failure, transition to STATE_ERROR
# - CRITICAL: User decides: retry / skip / abort
# - ERROR: Log warning, user review recommended
# - WARNING: Log only, continue

metadata:
  total_gates: 23  # UPDATED: 21 → 23 (+2 incremental gates)
  processing_gates: 10
  incremental_gates: 8  # UPDATED: 6 → 8 (+GATE_OE_INCREMENTAL, +GATE_TA_INCREMENTAL)
  iterative_gates: 3
  user_approval_gates: 4
  version: "7.0.1"  # UPDATED: 7.0.0 → 7.0.1 (C-01, C-02, C-03 fixes applied)

# ==============================================================================
# PROCESSING GATES
# ==============================================================================

