      verification: "Verify each file has metadata fields"
      failure_action: "User decides: retry / skip / abort"

    g0_04:
      id: "G0-04"
      description: "No phantom files (all exist on disk)"
      severity: BLOCKER
      verification: "Method #168 Phantom Hunt"
      failure_action: "Transition to STATE_ERROR"

    g0_05:
      id: "G0-05"
      description: "Exclusions logged with justification"
      severity: ERROR
      verification: "Check exclusions[] non-empty with reasons"
      failure_action: "Log warning, continue"

    g0_06:
      id: "G0-06"
      description: "Counter-checks executed (CC1, CC2, CC3)"
