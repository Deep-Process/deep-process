inv_13:
  id: "INV-13"
  name: "Idempotency"
  description: "Re-running same state with same inputs produces same outputs"
  severity: ERROR
  violation_consequence: "Non-deterministic results, hard to debug"
  enforcement: "Agents use deterministic algorithms (no random seeds)"
  applies_to: "All processing states"
  from_version: "V5.0.0"

inv_14:
  id: "INV-14"
  name: "Atomic State Transitions"
  description: "State transitions must be atomic (complete or rollback)"
  severity: CRITICAL
  violation_consequence: "Partial states, corrupted process-state.yaml"
  enforcement: "Orchestrator uses transaction pattern (write temp → verify → rename)"
  applies_to: "FSM transitions"
  from_version: "V5.0.0"

inv_15:
  id: "INV-15"
  name: "Metadata Completeness"
