inv_01:
  id: "INV-01"
  name: "Binding Gates"
  description: "All gates must be evaluated and cannot be bypassed"
  severity: BLOCKER
  violation_consequence: "Process integrity compromised"
  enforcement: "Orchestrator validates gate evaluation before state transitions"
  applies_to: "All 21 gates"
  from_version: "V5.0.0"

inv_02:
  id: "INV-02"
  name: "Method Binding"
  description: "If a method is specified for a task, it MUST be executed"
  severity: BLOCKER
  violation_consequence: "Quality mechanisms bypassed"
  enforcement: "Agents check method_id in task definition and execute specified procedure"
  applies_to: "All method-based tasks (Method #85, #159, #168, #84, #90, etc.)"
  from_version: "V5.0.0"

