# ==============================================================================
# V6.2 ADDED INVARIANTS (INV-24, INV-25)
# ==============================================================================

inv_24:
  id: "INV-24"
  name: "Staleness Propagation"
  description: "Staleness propagates with override modes (TRANSITIVE, QUALITY_ONLY, INCREMENTAL_VERIFY)"
  severity: ERROR
  violation_consequence: "Incorrect staleness calculation, wrong artifacts regenerated"
  enforcement: "Orchestrator propagate_staleness(artifact_id, override) function"
  applies_to: "Artifact dependency graph"
  from_version: "V6.2.0"

  override_modes:
    transitive:
      description: "Default - full transitive cascade"
      usage: "FULL mode"
      behavior: "Mark artifact STALE → mark all dependents STALE (recursive)"

    quality_only:
      description: "Docs only - no evidence/model cascade"
      usage: "STATE_QUALITY_AMENDMENT"
      behavior: "Mark docs/*.md STALE, keep evidence_map.yaml and architectural-model.json FRESH"
      rationale: "Quality affects HOW docs written, not WHAT documented"
      from_version: "V6.2.1"

    incremental_verify:
      description: "Direct dependents only - no grandchildren"
      usage: "Incremental verification mode"
      behavior: "Mark changed artifact + direct dependents STALE, stop propagation"
      rationale: "Incremental supplements existing work, doesn't invalidate downstream"
      from_version: "V6.3.0"

  algorithm: |
    def propagate_staleness(artifact_id, override=None):
        mark_artifact_stale(artifact_id)
        log_decision(artifact_id, "STALE", override)

        if override == "QUALITY_ONLY":
            # V6.2.1: Only mark docs STALE
            if artifact_id == "documentation-plan.yaml":
                mark_stale("docs/*.md")
            return

        if override == "INCREMENTAL_VERIFY":
            # V6.3.0: Mark direct dependents STALE, stop cascade
            dependents = get_direct_dependents(artifact_id)
            for dep in dependents:
                mark_artifact_stale(dep)
                log_decision(dep, "STALE (direct)", "INCREMENTAL_VERIFY")
            return

        # Default: Transitive cascade
        dependents = get_all_dependents(artifact_id)
        for dep in dependents:
            propagate_staleness(dep, override)  # Recursive

inv_25:
  id: "INV-25"
  name: "Template Completeness"
  description: "Template coverage must be ≥90% at GATE_P"
  severity: CRITICAL
  violation_consequence: "Sparse planning (30% missing sections in V6)"
  enforcement: "GATE_P conditions GP-09 (keyword) + GP-15 (semantic)"
  applies_to: "STATE_PLANNING"
  from_version: "V6.2.0"
  v7_enhancement: "GP-15 semantic matching provides stronger enforcement than GP-09 keyword matching"

  calculation: |
    coverage = (sections_matched + sections_unknown) / total_template_sections

    Where:
    - sections_matched: Planned sections matching template (similarity ≥0.90)
    - sections_unknown: Template sections marked as SCOPE_REDUCTION
    - total_template_sections: From template-decomposition.yaml (V7)

  threshold: 0.90  # 90%

  enforcement_points:
    gp_09:
      method: "Keyword matching"
      threshold: 0.90
      severity: CRITICAL
      from_version: "V6.2.0"

    gp_15:
      method: "Semantic matching (cosine similarity)"
      threshold: 0.90
      severity: BLOCKER
      from_version: "V7.0.0"
      enhancement: "Detects semantic gaps missed by keyword matching"

  anti_bypass:
    - "Template decomposition is BINDING contract (GATE_TA)"
    - "Omissions require SCOPE_REDUCTION with justification"
    - "Semantic matching prevents synonym gaming"

  v7_workflow_integration:
    state_template_analysis: "Enumerates 100% template sections (GATE_TA)"
    state_planning: "Plans ≥90% sections (GP-09, GP-15)"
    state_verification: "Verifies coverage maintained (G4-11)"

