# Plan Approval Schema (V7)
# User checkpoint decision persistence
# Used by: USER_REVIEW_PLAN, USER_REVIEW_EVIDENCE, USER_REVIEW_DIAGRAMS, USER_REVIEW_DOCS

version: "7.0.0"
required_fields:
  - metadata
  - approval_decision
  - artifact_reference
  - user_feedback

metadata:
  type: object
  required:
    - approval_timestamp
    - checkpoint_state
    - user_id
  optional:
    - session_id

  checkpoint_state:
    type: enum
    values:
      - USER_REVIEW_PLAN
      - USER_REVIEW_EVIDENCE
      - USER_REVIEW_DIAGRAMS
      - USER_REVIEW_DOCS
    validation: "Must match orchestrator state"

approval_decision:
  type: object
  required:
    - decision
    - reason
  optional:
    - improvement_request
    - scope_reduction_request

  decision:
    type: enum
    values:
      - APPROVE
      - REJECT
      - MODIFY
      - SUPPLEMENT
      - ADD_DIAGRAMS
      - REVISE
    validation: "Decision must match checkpoint state allowed actions"

  reason:
    type: string
    min_length: 10
    validation: "User must provide reason for decision"

  improvement_request:
    type: object
    required_if: decision == MODIFY || SUPPLEMENT || ADD_DIAGRAMS || REVISE
    fields:
      - improvement_category
      - specific_request
      - affected_sections
    validation: "Required for non-APPROVE decisions"

  scope_reduction_request:
    type: array
    optional: true
    item_schema:
      required:
        - section_id
        - reason
      validation:
        - "Section IDs must reference plan sections"
        - "Reason must be non-empty"

artifact_reference:
  type: object
  required:
    - artifact_name
    - artifact_path
    - artifact_hash
  validation:
    - "Artifact must exist in process-state.yaml artifact registry"
    - "Hash must match current artifact hash (staleness check)"

user_feedback:
  type: object
  required:
    - quality_rating
    - completeness_rating
  optional:
    - comments
    - suggested_improvements

  quality_rating:
    type: integer
    range: [1, 10]
    description: "User satisfaction with artifact quality (1=poor, 10=excellent)"

  completeness_rating:
    type: integer
    range: [1, 10]
    description: "User satisfaction with artifact completeness (1=incomplete, 10=complete)"

  comments:
    type: string
    optional: true
    max_length: 5000

  suggested_improvements:
    type: array
    optional: true
    item_schema:
      - improvement_text: string

# Gate enforcement (GATE_UA, UB, UC, UD)
gate_validations:
  gate_ua: "USER_REVIEW_PLAN approval decision recorded"
  gate_ub: "USER_REVIEW_EVIDENCE approval decision recorded"
  gate_uc: "USER_REVIEW_DIAGRAMS approval decision recorded"
  gate_ud: "USER_REVIEW_DOCS approval decision recorded"

# Resume support
resume_support:
  description: "If decision == REJECT, process transitions to STATE_HALT (can resume later)"
  resume_conditions:
    - "User can load process-state.yaml"
    - "User can review plan-approval.yaml to see rejection reason"
    - "User can manually fix issues and RESET or continue"
