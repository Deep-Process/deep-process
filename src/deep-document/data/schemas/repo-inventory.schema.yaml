# Repository Inventory Schema (V7)
# Enhanced from V6 with PD-UNIVERSAL validation
# Used by: GATE_0 conditions G0-01 through G0-10

version: "7.0.0"
required_fields:
  - metadata
  - files
  - statistics
  - pd_universal_scan

metadata:
  type: object
  required:
    - scan_timestamp
    - repository_path
    - total_files
    - total_size_bytes
    - scan_duration_ms

files:
  type: array
  min_items: 1
  item_schema:
    required:
      - file_path
      - file_type
      - size_bytes
      - hash_sha256
      - last_modified
      - pd_universal_violations
    optional:
      - encoding
      - line_count
  validation:
    - "File paths must be unique"
    - "Hash SHA256 must be 64 characters"
    - "PD-UNIVERSAL violations must be array (empty if clean)"

statistics:
  type: object
  required:
    - total_files
    - total_directories
    - total_size_bytes
    - file_types
    - largest_files
  validation:
    - "File counts must match files[] array length"

  file_types:
    type: object
    example:
      ts: 45
      js: 12
      json: 8
      yaml: 5

  largest_files:
    type: array
    max_items: 10
    item_schema:
      required:
        - file_path
        - size_bytes

pd_universal_scan:
  type: object
  required:
    - scan_timestamp
    - total_patterns_scanned
    - total_violations
    - violations_by_category
    - files_with_violations
  validation:
    - "Total patterns scanned must be >= 68"
    - "Total violations must be >= 0"

  violations_by_category:
    type: object
    required:
      - ellipsis
      - generic_names
      - bracketed
      - handlebars
      - xml_style
      - todos
      - filler
      - metavariables
    validation:
      - "All category counts must be >= 0"

  files_with_violations:
    type: array
    item_schema:
      required:
        - file_path
        - violation_count
        - violations
      validation:
        - "File path must reference files[] array"

    violations:
      type: array
      item_schema:
        required:
          - pattern
          - category
          - line_number
          - context
        optional:
          - exception_applied

# GATE_0 enforcement points
gate_0_validations:
  g0_01: "File exists: repo_inventory.yaml"
  g0_02: "All directories scanned"
  g0_03: "File metadata complete"
  g0_04: "Hash verification passed"
  g0_05: "PD-UNIVERSAL scan executed"
  g0_06: "Total patterns >= 68"
  g0_07: "All violations categorized"
  g0_08: "Statistics match file count"
  g0_09: "No phantom files in inventory"
  g0_10: "Timestamp within last 24h"
