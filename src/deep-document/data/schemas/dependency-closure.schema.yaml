# Dependency Closure Schema (V7)
# Validation structure for transitive dependency resolution
# Used by: GP-15 semantic matching verification

version: "7.0.0"
required_fields:
  - metadata
  - template_sections
  - ontology_entities
  - matches
  - unmatched
  - quality_metrics

metadata:
  type: object
  required:
    - matching_timestamp
    - template_sections_count
    - ontology_entities_count
    - total_matches
    - match_duration_ms
  optional:
    - notes

template_sections:
  type: array
  min_items: 1
  item_schema:
    required:
      - section_id
      - section_title
      - embedding_vector
  validation:
    - "Section IDs must match template-decomposition.yaml"
    - "Embedding vectors must be normalized"

ontology_entities:
  type: array
  min_items: 1
  item_schema:
    required:
      - entity_id
      - entity_name
      - entity_type
  validation:
    - "Entity IDs must match domain-ontology.yaml"

matches:
  type: array
  min_items: 0
  item_schema:
    required:
      - match_id
      - template_section_id
      - ontology_entity_id
      - semantic_similarity
      - match_type
      - confidence
    optional:
      - justification
  validation:
    - "Section IDs must reference template_sections[] array"
    - "Entity IDs must reference ontology_entities[] array"
    - "Semantic similarity must be >= 0.90"
    - "Match type must be: direct|inferred|transitive"
    - "Confidence must be >= 0.90"

unmatched:
  type: object
  required:
    - unmatched_sections
    - unmatched_entities
    - coverage_ratio

  unmatched_sections:
    type: array
    item_schema:
      required:
        - section_id
        - reason
      optional:
        - closest_match_id
        - closest_similarity

  unmatched_entities:
    type: array
    item_schema:
      required:
        - entity_id
        - reason
      optional:
        - closest_match_id
        - closest_similarity

  coverage_ratio:
    type: number
    validation:
      - "Must be >= 0.90 to pass GP-15"

quality_metrics:
  type: object
  required:
    - total_sections
    - matched_sections
    - coverage_ratio
    - avg_semantic_similarity
    - min_semantic_similarity
    - match_quality
  validation:
    - "coverage_ratio must be >= 0.90"
    - "avg_semantic_similarity must be >= 0.90"
    - "min_semantic_similarity must be >= 0.90"
    - "match_quality must be >= 0.90"

# GP-15 enforcement points
gp_15_validations:
  validation_01: "File exists: dependency-closure.yaml"
  validation_02: "Coverage ratio >= 0.90"
  validation_03: "Avg semantic similarity >= 0.90"
  validation_04: "Min semantic similarity >= 0.90"
  validation_05: "All matches have confidence >= 0.90"
  validation_06: "Unmatched sections <= 10%"
  validation_07: "Match quality >= 0.90"
  validation_08: "No phantom matches (all IDs valid)"
