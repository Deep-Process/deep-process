# V7 Contracts - Design by Contract per Phase
# Pre-conditions, Post-conditions, Invariants for each state
# Version: 7.0.0

version: "7.0.0"
purpose: "Define contracts for each FSM state (pre/post conditions + invariants)"
compliance:
  v6_principle_9: "Counter-checks on key claims (contracts verified at gates)"

# ==============================================================================
# STATE_INIT
# ==============================================================================
state_init:
  agent: "context-agent.md"
  gate: "GATE_0"

  pre_conditions:
    - condition: "Repository path exists and is accessible"
      severity: BLOCKER
      validation: "Check directory exists, read permissions"

    - condition: "Output directory writable"
      severity: BLOCKER
      validation: "Check write permissions, create deep-artifacts/ subdirectory"

  post_conditions:
    - condition: "repo_inventory.yaml created"
      severity: BLOCKER
      validation: "File exists at ./deep-artifacts/repo_inventory.yaml"

    - condition: "All files scanned"
      severity: BLOCKER
      validation: "files[] array non-empty"

    - condition: "PD-UNIVERSAL scan executed"
      severity: CRITICAL
      validation: "pd_universal_scan.total_patterns_scanned == 68"

    - condition: "File hashes calculated"
      severity: CRITICAL
      validation: "All files[] have hash_sha256 field (64 chars)"

  invariants:
    - invariant: "INV-01: Single Source of Truth"
      validation: "repo_inventory.yaml is authoritative file list"

    - invariant: "INV-02: No Phantom Files"
      validation: "All files[] exist on disk (Method #168)"

# ==============================================================================
# STATE_ONTOLOGY_EXTRACTION
# ==============================================================================
state_ontology_extraction:
  agent: "context-agent.md"
  gate: "GATE_OE"

  pre_conditions:
    - condition: "repo_inventory.yaml exists"
      severity: BLOCKER
      validation: "Load from deep-artifacts/"

    - condition: "Gemini API available"
      severity: BLOCKER
      validation: "Credentials present, connectivity verified"

  post_conditions:
    - condition: "domain-ontology.yaml created"
      severity: BLOCKER
      validation: "File exists, schema valid"

    - condition: "All entities have confidence >= 0.95"
      severity: CRITICAL
      validation: "GOE-04: avg_confidence >= 0.95, min_confidence >= 0.95"

    - condition: "Transitive closure complete"
      severity: CRITICAL
      validation: "GOE-09: All entities have transitive_dependencies, closure_complete = true"

    - condition: "Topology metrics calculated"
      severity: ERROR
      validation: "GOE-10: All entities have topology_metrics (in_degree, out_degree, centrality_score, complexity_class)"

  invariants:
    - invariant: "INV-26: Ontology Grounding"
      validation: "All entities have confidence >= 0.95, source files exist in repo_inventory"

    - invariant: "INV-02: No Phantom Entities"
      validation: "All entity source_files exist in repo_inventory (Method #168)"

# ==============================================================================
# STATE_TEMPLATE_ANALYSIS
# ==============================================================================
state_template_analysis:
  agent: "template-analyzer-agent.md"
  gate: "GATE_TA"

  pre_conditions:
    - condition: "Template file accessible"
      severity: BLOCKER
      validation: "Load based on configuration.templates.mode"

    - condition: "domain-ontology.yaml exists"
      severity: BLOCKER
      validation: "Load for semantic matching"

  post_conditions:
    - condition: "template-decomposition.yaml created"
      severity: BLOCKER
      validation: "File exists, schema valid"

    - condition: "dependency-closure.yaml created"
      severity: BLOCKER
      validation: "File exists, semantic matching results"

    - condition: "Semantic matching coverage >= 0.90"
      severity: CRITICAL
      validation: "GTA-05: coverage_ratio >= 0.90"

    - condition: "Embeddings normalized"
      severity: ERROR
      validation: "GTA-10: All embedding vectors L2 norm = 1.0"

    - condition: "Transitive closure validated"
      severity: ERROR
      validation: "GTA-08: No circular dependencies, closure complete"

  invariants:
    - invariant: "INV-27: Semantic Matching"
      validation: "coverage_ratio >= 0.90, all matches have similarity >= 0.90"

    - invariant: "INV-25: Template Completeness"
      validation: ">=90% template sections matched to entities"

# ==============================================================================
# STATE_DETECTION
# ==============================================================================
state_detection:
  agent: "context-agent.md"
  gate: "GATE_D"

  pre_conditions:
    - condition: "repo_inventory.yaml exists"
      severity: BLOCKER
      validation: "Load from deep-artifacts/"

    - condition: "domain-ontology.yaml exists"
      severity: BLOCKER
      validation: "Load for domain detection evidence"

  post_conditions:
    - condition: "detection-report.yaml created"
      severity: BLOCKER
      validation: "File exists, schema valid"

    - condition: "final_domains[] non-empty"
      severity: BLOCKER
      validation: "At least base domains auto-included"

    - condition: "All detected domains have evidence"
      severity: CRITICAL
      validation: "GD-05: All evidence files exist in repo_inventory"

    - condition: "Counter-checks executed"
      severity: ERROR
      validation: "GD-13: counter_check_results[] has 3 items (CC1, CC2, CC3)"

  invariants:
    - invariant: "INV-02: No Phantom Domains"
      validation: "All domain evidence files exist (Method #168)"

    - invariant: "INV-28: Domain Grounding"
      validation: "Confidence >= threshold, >=3 evidence files per domain (Method #56 anti-gaming)"

# ==============================================================================
# STATE_PLANNING
# ==============================================================================
state_planning:
  agent: "planner-agent.md"
  gate: "GATE_P"

  pre_conditions:
    - condition: "detection-report.yaml exists"
      severity: BLOCKER
      validation: "Load final_domains[]"

    - condition: "template-decomposition.yaml exists"
      severity: BLOCKER
      validation: "Load template sections"

    - condition: "dependency-closure.yaml exists"
      severity: BLOCKER
      validation: "Load semantic matches"

    - condition: "domain-ontology.yaml exists"
      severity: BLOCKER
      validation: "Load entities and topology"

  post_conditions:
    - condition: "documentation-plan.yaml created"
      severity: BLOCKER
      validation: "File exists, schema valid"

    - condition: "Template coverage >= 0.90"
      severity: CRITICAL
      validation: "GP-09: template_coverage_verification.coverage_ratio >= 0.90"

    - condition: "Incremental construction executed"
      severity: CRITICAL
      validation: "GP-10: construction_mode = INCREMENTAL if >=20 files OR >=5 docs"

    - condition: "Batches sufficient"
      severity: CRITICAL
      validation: "GP-10b: batches_planned >= ceil(total_documents / 5.0)"

    - condition: "Zero missing dependencies"
      severity: CRITICAL
      validation: "GP-15: All planned entities have complete transitive closure"

    - condition: "Centrality prioritization applied"
      severity: ERROR
      validation: "GP-16: High-centrality entities in early sections"

  invariants:
    - invariant: "INV-18: Plan Binding"
      validation: "Plan references ONLY entities from domain-ontology, ONLY patterns from active domains"

    - invariant: "INV-25: Template Completeness"
      validation: ">=90% template sections have planned content"

    - invariant: "INV-27: Semantic Matching"
      validation: "All planned documents based on semantic matches >= 0.90"

# ==============================================================================
# STATE_COVERAGE
# ==============================================================================
state_coverage:
  agent: "mapper-agent.md"
  gate: "GATE_1"

  pre_conditions:
    - condition: "documentation-plan.yaml exists"
      severity: BLOCKER
      validation: "Load planned entities"

    - condition: "repo_inventory.yaml exists"
      severity: BLOCKER
      validation: "Load files to segment"

  post_conditions:
    - condition: "coverage_map.yaml created"
      severity: BLOCKER
      validation: "File exists, schema valid"

    - condition: "All plan-referenced files segmented"
      severity: CRITICAL
      validation: "G1-02: All files from plan have segments"

    - condition: "Coverage completeness >= 0.90"
      severity: CRITICAL
      validation: "G1-07: coverage_completeness >= 0.90"

  invariants:
    - invariant: "INV-18: Plan Binding"
      validation: "Coverage targets ONLY files referenced in plan (not all files)"

    - invariant: "INV-02: No Phantom Segments"
      validation: "All segment file_paths exist in repo_inventory"

# ==============================================================================
# STATE_EVIDENCE
# ==============================================================================
state_evidence:
  agent: "mapper-agent.md"
  gate: "GATE_2"

  pre_conditions:
    - condition: "coverage_map.yaml exists"
      severity: BLOCKER
      validation: "Load segments"

    - condition: "documentation-plan.yaml exists"
      severity: BLOCKER
      validation: "Load planned entities"

  post_conditions:
    - condition: "evidence_map.yaml created"
      severity: BLOCKER
      validation: "File exists, schema valid"

    - condition: "Evidence ratio >= 0.95"
      severity: CRITICAL
      validation: "G2-09: verified_claims >= 70%, hypothetical_claims <= 10%"

    - condition: "All claims have citations"
      severity: BLOCKER
      validation: "G2-05: Every claim has citations[] array non-empty"

  invariants:
    - invariant: "INV-28: PD-UNIVERSAL Enforcement"
      validation: "Zero placeholder patterns in claim_text (68 patterns blocked)"

    - invariant: "INV-02: No Phantom Claims"
      validation: "All citation file_paths exist in repo_inventory"

# ==============================================================================
# STATE_SYNTHESIS
# ==============================================================================
state_synthesis:
  agent: "architect-agent.md"
  gate: "GATE_3"

  pre_conditions:
    - condition: "evidence_map.yaml exists"
      severity: BLOCKER
      validation: "Load claims for relationships"

    - condition: "documentation-plan.yaml diagram_plan exists"
      severity: BLOCKER
      validation: "Load diagram triggers"

  post_conditions:
    - condition: "architectural-model.json created"
      severity: BLOCKER
      validation: "File exists, schema valid"

    - condition: "Diagram coverage >= 0.90"
      severity: CRITICAL
      validation: "G3-08: components_in_diagrams / total_components >= 0.90"

    - condition: "Topology-driven diagrams generated"
      severity: ERROR
      validation: "G3-06: High-complexity entities have diagrams"

  invariants:
    - invariant: "INV-18: Plan Binding"
      validation: "Diagrams use ONLY triggers from active domains + topology"

    - invariant: "INV-02: No Phantom Components"
      validation: "All components reference entities from domain-ontology"

# ==============================================================================
# STATE_GENERATION
# ==============================================================================
state_generation:
  agent: "writer-agent.md"
  gate: "GATE_GEN"

  pre_conditions:
    - condition: "documentation-plan.yaml exists"
      severity: BLOCKER
      validation: "Load planned documents"

    - condition: "evidence_map.yaml exists"
      severity: BLOCKER
      validation: "Load claims for citations"

    - condition: "architectural-model.json exists"
      severity: BLOCKER
      validation: "Load diagrams"

  post_conditions:
    - condition: "docs/*.md files created"
      severity: BLOCKER
      validation: "All planned documents generated"

    - condition: "Quality rules R1-R10 enforced"
      severity: CRITICAL
      validation: "GG-10..14: paragraphs <=300 chars, depth >=2.0, [UNKNOWN] <=10%, formats appropriate, citations <=30%"

    - condition: "Zero PD-UNIVERSAL violations"
      severity: BLOCKER
      validation: "68 placeholder patterns not detected in docs"

  invariants:
    - invariant: "INV-18: Plan Binding"
      validation: "Docs follow documentation-plan.yaml sections exactly"

    - invariant: "INV-28: PD-UNIVERSAL Enforcement"
      validation: "Zero placeholders in generated documentation"

    - invariant: "INV-21: Plan-Output Traceability"
      validation: "All planned sections present in docs/"

# ==============================================================================
# STATE_VERIFICATION
# ==============================================================================
state_verification:
  agent: "verifier-agent.md"
  gate: "GATE_4"

  pre_conditions:
    - condition: "All artifacts exist"
      severity: BLOCKER
      validation: "Load all artifacts from deep-artifacts/"

    - condition: "All docs exist"
      severity: BLOCKER
      validation: "Load all docs/*.md files"

  post_conditions:
    - condition: "verification-report.md created"
      severity: BLOCKER
      validation: "File exists"

    - condition: "consolidated-validation-report.md created"
      severity: BLOCKER
      validation: "File exists, aggregates all verification"

    - condition: "All gates PASS"
      severity: BLOCKER
      validation: "21 gates evaluated, all PASS"

    - condition: "All invariants SATISFIED"
      severity: BLOCKER
      validation: "25 invariants checked, all SATISFIED"

    - condition: "All verification tests PASS"
      severity: BLOCKER
      validation: "7 tests (V-PROSE-001 through V-PD-UNIVERSAL-001) PASS"

  invariants:
    - invariant: "INV-21: Plan-Output Traceability"
      validation: "All planned sections present in docs, all docs reference plan"

    - invariant: "INV-01: Single Source of Truth"
      validation: "No conflicting information between artifacts"

# ==============================================================================
# COUNTER-CHECKS (Method #9: Counter-Checks on Key Claims)
# ==============================================================================
counter_checks:
  description: "Every critical claim verified by 3 independent checks"

  cc1_grounding:
    method: "#85 Grounding Check"
    description: "Sample 3 items, verify existence"
    applied_to: "All states"
    severity: BLOCKER

  cc2_phantom_hunt:
    method: "#168 Phantom Hunt"
    description: "Check for hallucinated references"
    applied_to: "All states"
    severity: BLOCKER

  cc3_coherence:
    method: "#84 Coherence Check"
    description: "Verify cross-artifact consistency"
    applied_to: "All states"
    severity: ERROR
