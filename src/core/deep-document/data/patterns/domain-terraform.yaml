# Terraform Domain Pattern
# Version: 1.0.0
# Created: 2026-02-11 (V7.1.1 - REC-005)
# Purpose: Detect and document Terraform infrastructure projects

metadata:
  domain_id: terraform
  name: "Terraform"
  version: "1.0.0"
  type: SPECIFIC
  layer: PARADIGM
  auto_apply: false
  confidence_threshold: 0.75

dependencies:
  requires:
    - iac-agnostic  # Transitive dependency (base IaC patterns)

provides:
  patterns:
    - QP-TERRAFORM-MODULES     # Module structure and composition
    - QP-TERRAFORM-STATE       # State management (local, remote, backends)
    - QP-TERRAFORM-WORKSPACE   # Workspace usage (dev, staging, prod)

  templates: []  # Uses iac-agnostic templates

detection:
  method: "multi-condition"

  evidence_requirements:
    - "*.tf files exist (main.tf, variables.tf, outputs.tf, etc.)"
    - "≥2 Terraform resources defined in resource blocks"
    - "provider block with cloud provider (AWS, Azure, GCP, etc.)"

  conditions:
    # Condition 1: Terraform files exist (40% weight)
    C1_terraform_files:
      description: "*.tf files exist"
      type: file_existence
      patterns:
        - "*.tf"
        - "terraform.tfvars"
        - ".terraform.lock.hcl"
      threshold: 1
      weight: 0.40
      match_score_function: binary  # 1.0 if ≥1 exists, 0.0 otherwise

    # Condition 2: Terraform resources defined (35% weight)
    C2_terraform_resources:
      description: "≥2 Terraform resources defined"
      type: content_search
      file_pattern: "*.tf"
      search_patterns:
        - "resource \""
        - "module \""
        - "data \""
      threshold: 2
      weight: 0.35
      match_score_function: threshold_linear

    # Condition 3: Provider block (25% weight)
    C3_provider_block:
      description: "Provider block (AWS/Azure/GCP/other)"
      type: content_search
      file_pattern: "*.tf"
      search_patterns:
        - "provider \"aws\""
        - "provider \"azurerm\""
        - "provider \"google\""
        - "provider \"kubernetes\""
        - "provider \"helm\""
      threshold: 1
      weight: 0.25
      match_score_function: binary

  anti_gaming:
    single_file_resistance: 0.40  # *.tf alone = 0.40 confidence (BELOW 0.75)
    fake_config_resistance: 0.75  # C2+C3 needed (resources + provider)
    low_quality_resistance: 0.85  # ≥2 resources required

documentation:
  quality_patterns:
    - QP-TERRAFORM-MODULES
    - QP-TERRAFORM-STATE
    - QP-TERRAFORM-WORKSPACE

  recommended_sections:
    - "Terraform Configuration"
    - "Infrastructure Resources"
    - "Module Structure"
    - "State Management"
    - "Workspace Configuration"
    - "Deployment Guide"

validation:
  test_projects:
    positive:
      - "Terraform AWS Infrastructure"
      - "Terraform Multi-Cloud (AWS + Azure)"
      - "Terraform Kubernetes Deployment"
    negative:
      - "CloudFormation (uses *.yaml templates)"
      - "CDK (uses cdk.json)"
      - "Pulumi (uses Pulumi.yaml)"

  expected_confidence:
    typical: 0.85-0.95
    minimal: 0.75-0.85  # Just *.tf + 2 resources
    edge_cases: 0.60-0.75  # Incomplete config

changelog:
  - version: "1.0.0"
    date: "2026-02-11"
    changes: "Initial Terraform domain pattern (REC-005)"
