# Domain Ontology Schema (V7)
# Validation structure for Gemini-extracted ontology
# Used by: GATE_OE conditions GOE-01 through GOE-08

version: "7.0.0"
required_fields:
  - metadata
  - entities
  - relationships
  - properties
  - methods
  - domain_rules
  - quality_metrics

metadata:
  type: object
  required:
    - extraction_timestamp
    - gemini_model_version
    - repository_path
    - total_files_analyzed
    - extraction_duration_ms
    - extraction_mode  # NEW: "BATCH_PROCESSING" | "SINGLE_PASS"
  optional:
    - notes
    - batch_metadata  # NEW: required if extraction_mode == "BATCH_PROCESSING"

batch_metadata:  # NEW: batch processing statistics
  type: object
  required:
    - total_batches
    - batch_size
    - total_files_processed
    - entities_before_merge
    - entities_after_merge
    - deduplication_ratio
  validation:
    - "deduplication_ratio must be in range 0.05-0.50"
    - "total_batches must be >= 1"
    - "entities_after_merge must be <= entities_before_merge"

entities:
  type: array
  min_items: 1
  item_schema:
    required:
      - id
      - name
      - type
      - source_files
      - confidence
    optional:
      - description
      - aliases
      - parent_entity
  validation:
    - "Entity IDs must be unique"
    - "Source files must exist in repo_inventory"
    - "Confidence must be >= 0.95"

relationships:
  type: array
  min_items: 0
  item_schema:
    required:
      - id
      - source_entity_id
      - target_entity_id
      - relationship_type
      - confidence
    optional:
      - cardinality
      - description
  validation:
    - "Entity IDs must reference entities[] array"
    - "Confidence must be >= 0.95"

properties:
  type: array
  min_items: 0
  item_schema:
    required:
      - id
      - entity_id
      - property_name
      - property_type
      - confidence
    optional:
      - required
      - default_value
      - constraints
  validation:
    - "Entity IDs must reference entities[] array"
    - "Confidence must be >= 0.95"

methods:
  type: array
  min_items: 0
  item_schema:
    required:
      - id
      - entity_id
      - method_name
      - parameters
      - return_type
      - confidence
    optional:
      - visibility
      - description
  validation:
    - "Entity IDs must reference entities[] array"
    - "Confidence must be >= 0.95"

domain_rules:
  type: array
  min_items: 0
  item_schema:
    required:
      - id
      - rule_description
      - affected_entities
      - confidence
    optional:
      - enforcement_level
  validation:
    - "Affected entities must reference entities[] array"
    - "Confidence must be >= 0.95"

quality_metrics:
  type: object
  required:
    - total_entities
    - total_relationships
    - avg_confidence
    - min_confidence
    - extraction_completeness
    - grounding_rate  # NEW: from Method #85 verification
    - merge_integrity  # NEW: "PASS" | "FAIL" (batch merge validation)
  validation:
    - "avg_confidence must be >= 0.95"
    - "min_confidence must be >= 0.95"
    - "extraction_completeness must be >= 0.90"
    - "grounding_rate must be >= 0.70 (BLOCKER), >= 0.95 (WARNING)"
    - "merge_integrity must be PASS"

# GATE_OE enforcement points
gate_oe_validations:
  goe_01: "File exists: domain-ontology.yaml"
  goe_02: "All required fields present"
  goe_03: "Entities count >= 1"
  goe_04: "Avg confidence >= 0.95"
  goe_05: "Min confidence >= 0.95"
  goe_06: "Extraction completeness >= 0.90"
  goe_07: "All entity IDs unique"
  goe_08: "All source files exist in repo_inventory"
