# Coverage Map Schema (V7)
# Enhanced from V6 - unchanged structure
# Used by: GATE_1 conditions

version: "7.0.0"
required_fields:
  - metadata
  - segments
  - statistics

metadata:
  type: object
  required:
    - mapping_timestamp
    - total_files
    - total_segments
    - mapping_duration_ms

segments:
  type: array
  min_items: 1
  item_schema:
    required:
      - segment_id
      - file_path
      - start_line
      - end_line
      - segment_type
      - priority
      - semantic_category
    optional:
      - description
      - dependencies
  validation:
    - "Segment IDs must be unique"
    - "File paths must exist in repo_inventory"
    - "Line ranges must be valid (start <= end)"
    - "Segment type must be: class|function|interface|type|config|documentation|other"
    - "Priority must be: CRITICAL|HIGH|MEDIUM|LOW"

statistics:
  type: object
  required:
    - total_segments
    - segments_by_type
    - segments_by_priority
    - avg_segment_size
    - coverage_completeness
  validation:
    - "Total segments must match segments[] array length"
    - "Coverage completeness must be >= 0.90"

  segments_by_type:
    type: object
    validation:
      - "All counts must be >= 0"

  segments_by_priority:
    type: object
    validation:
      - "All counts must be >= 0"

# GATE_1 enforcement points
gate_1_validations:
  g1_01: "File exists: coverage_map.yaml"
  g1_02: "All segments mapped"
  g1_03: "Segment metadata complete"
  g1_04: "Priority assigned to all"
  g1_05: "Semantic categories valid"
  g1_06: "Statistics match segment count"
  g1_07: "Coverage completeness >= 0.90"
  g1_08: "No phantom segments"
  g1_09: "Line ranges valid"
  g1_10: "Dependencies resolvable"
