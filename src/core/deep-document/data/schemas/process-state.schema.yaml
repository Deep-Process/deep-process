# Process State Schema (V7)
# Single source of truth for iterative execution
# Used by: orchestrator-agent, all state management

version: "7.0.0"
required_fields:
  - metadata
  - execution_context
  - configuration
  - artifacts
  - decisions
  - lock

metadata:
  type: object
  required:
    - version
    - created_timestamp
    - last_modified_timestamp
    - repository_path
    - output_directory
  optional:
    - project_name

  version:
    type: string
    validation: "Must be 7.0.0"

execution_context:
  type: object
  required:
    - mode
    - current_state
  optional:
    - target_state
    - previous_state

  mode:
    type: enum
    values:
      - FULL
      - INCREMENTAL
      - QUALITY
      - RERUN
      - RESUME
    validation: "Determines FSM transition routing"

  current_state:
    type: enum
    values:
      - STATE_INIT
      - STATE_ONTOLOGY_EXTRACTION
      - STATE_TEMPLATE_ANALYSIS
      - STATE_DETECTION
      - STATE_PLANNING
      - USER_REVIEW_PLAN
      - STATE_COVERAGE
      - STATE_EVIDENCE
      - USER_REVIEW_EVIDENCE
      - STATE_SYNTHESIS
      - USER_REVIEW_DIAGRAMS
      - STATE_GENERATION
      - USER_REVIEW_DOCS
      - STATE_VERIFICATION
      - STATE_COMPLETE
      - STATE_QUALITY_AMENDMENT
      - STATE_ERROR
      - STATE_HALT
    validation: "Must match FSM state definition"

configuration:
  type: object
  required:
    - templates
  optional:
    - custom_settings

  templates:
    type: object
    required:
      - mode
    optional:
      - custom_path
      - selected

    mode:
      type: enum
      values:
        - AUTO_DETECT
        - BUILT_IN
        - CUSTOM
      validation: "Template selection mode"

    selected:
      type: array
      description: "List of selected template files"
      item_schema:
        - template_path: string

artifacts:
  type: array
  min_items: 0
  item_schema:
    required:
      - name
      - file_path
      - status
      - hash
      - dependencies
      - dependents
    optional:
      - last_modified
      - size_bytes

  name:
    type: string
    validation: "Artifact name (e.g., repo_inventory.yaml)"

  file_path:
    type: string
    validation: "Relative path from output_directory (e.g., ./deep-artifacts/repo_inventory.yaml)"

  status:
    type: enum
    values:
      - FRESH
      - STALE
      - IN_PROGRESS
      - MISSING
    validation: "Staleness tracking for incremental mode"

  hash:
    type: string
    length: 64
    validation: "SHA256 hash of artifact content"

  dependencies:
    type: array
    description: "Upstream artifacts this artifact depends on"
    item_schema:
      - artifact_name: string

  dependents:
    type: array
    description: "Downstream artifacts that depend on this artifact"
    item_schema:
      - artifact_name: string

decisions:
  type: array
  description: "Audit trail of all decisions made during process execution"
  min_items: 0
  item_schema:
    required:
      - decision_id
      - timestamp
      - decision_type
      - decision_details
    optional:
      - rationale
      - method_used

  decision_type:
    type: enum
    values:
      - STATE_TRANSITION
      - GATE_EVALUATION
      - STALENESS_PROPAGATION
      - USER_APPROVAL
      - SCOPE_REDUCTION
      - ERROR_HANDLING
    validation: "Type of decision"

lock:
  type: object
  nullable: true
  description: "Concurrency control mechanism"
  required_if_not_null:
    - locked
    - locked_by
    - locked_at
  optional:
    - locked_state

  locked:
    type: boolean
    validation: "true if process is currently executing"

  locked_by:
    type: string
    validation: "Agent name holding the lock"

  locked_at:
    type: string
    format: ISO8601
    validation: "Timestamp when lock acquired"

# Orchestrator usage
orchestrator_usage:
  initialization: "orchestrator creates process-state.yaml on NEW_PROJECT"
  state_management: "orchestrator updates current_state on every transition"
  artifact_registry: "orchestrator updates artifacts[] after every state completion"
  decision_logging: "orchestrator appends to decisions[] for audit trail"
  lock_management: "orchestrator acquires/releases lock for concurrency"

# Staleness propagation
staleness_algorithm:
  description: "When artifact A modified, propagate STALE to dependents"
  modes:
    - name: "FULL (default)"
      behavior: "Transitive cascade (all downstream STALE)"
    - name: "QUALITY_ONLY"
      behavior: "Targeted (only docs/*.md STALE, no cascade)"
    - name: "INCREMENTAL_VERIFY"
      behavior: "Direct (artifact + direct dependents STALE, stop)"

# GATE_0_RESUME enforcement
gate_0_resume:
  validation: "Verify process-state.yaml valid before resuming"
  conditions:
    - "metadata.version == 7.0.0"
    - "execution_context.current_state is valid FSM state"
    - "lock == null (no concurrent execution)"
    - "All FRESH artifacts exist on disk"
