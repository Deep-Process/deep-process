# Architectural Model Schema (V7)
# Enhanced from V6 - unchanged structure
# Used by: GATE_3 conditions
# Note: Actual artifact is architectural-model.json (JSON format)

version: "7.0.0"
required_fields:
  - metadata
  - components
  - relationships
  - diagrams
  - topology_metrics

metadata:
  type: object
  required:
    - synthesis_timestamp
    - total_components
    - total_relationships
    - total_diagrams
    - synthesis_duration_ms

components:
  type: array
  min_items: 1
  item_schema:
    required:
      - component_id
      - component_name
      - component_type
      - layer
      - source_segments
      - evidence_claims
    optional:
      - description
      - responsibilities
      - dependencies
  validation:
    - "Component IDs must be unique"
    - "Source segments must exist in coverage_map"
    - "Evidence claims must exist in evidence_map"
    - "Component type must be: module|service|function|class|interface|config|external"
    - "Layer must be: presentation|business|data|infrastructure|integration"

relationships:
  type: array
  min_items: 0
  item_schema:
    required:
      - relationship_id
      - source_component_id
      - target_component_id
      - relationship_type
      - evidence_claim_ids
    optional:
      - cardinality
      - description
  validation:
    - "Component IDs must reference components[] array"
    - "Evidence claim IDs must exist in evidence_map"
    - "Relationship type must be: uses|contains|extends|implements|calls|subscribes|publishes|depends_on"

diagrams:
  type: array
  min_items: 1
  item_schema:
    required:
      - diagram_id
      - diagram_type
      - title
      - components
      - relationships
      - mermaid_code
    optional:
      - description
      - level_of_detail
  validation:
    - "Diagram IDs must be unique"
    - "Diagram type must be: component|sequence|deployment|class|data_flow|architecture"
    - "Components array must reference components[] array"
    - "Mermaid code must be valid syntax"

topology_metrics:
  type: object
  required:
    - centrality_scores
    - high_priority_components
    - diagram_coverage
  validation:
    - "Centrality scores must exist for all components"

  centrality_scores:
    type: object
    item_schema:
      required:
        - component_id
        - betweenness
        - closeness
        - degree
        - pagerank
        - composite_score
      validation:
        - "All scores must be 0.0 to 1.0"
        - "Composite score weighted per config.yaml"

  high_priority_components:
    type: array
    item_schema:
      required:
        - component_id
        - composite_score
        - percentile
      validation:
        - "Percentile must be >= 0.80 (top 20%)"

  diagram_coverage:
    type: object
    required:
      - total_components
      - components_in_diagrams
      - coverage_ratio
    validation:
      - "Coverage ratio must be >= 0.90"

# GATE_3 enforcement points
gate_3_validations:
  g3_01: "File exists: architectural-model.json"
  g3_02: "All components identified"
  g3_03: "Component metadata complete"
  g3_04: "Relationships mapped"
  g3_05: "Diagrams generated"
  g3_06: "Topology metrics calculated"
  g3_07: "High-priority components identified"
  g3_08: "Diagram coverage >= 0.90"
  g3_09: "No phantom components"
  g3_10: "Mermaid syntax valid"
